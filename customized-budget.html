<style>
/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */
  --lt-shadow-chip:   0 2px 4px 0 rgba(0, 0, 0, 0.3);            /* chip / tag 用，較深 opacity */
  --lt-shadow-dialog: 0 0 6px 0 rgba(0, 0, 0, 0.2);              /* Card / Dialog / Dropdown 共用；無 offset */
  --lt-shadow-overlay:        0 4px 12px rgba(0, 0, 0, 0.14);    /* CMDS 未涵蓋；popover / floating menu */
  --lt-shadow-overlay-strong: 0 4px 16px rgba(0, 0, 0, 0.18);    /* CMDS 未涵蓋；drawer / 較重 overlay */

  /* --- Transition --- */
  --lt-transition-fast: .15s ease;
  --lt-transition-base: .2s ease;
  --lt-transition-slow: .3s ease;

  /* --- Z-index --- */
  --lt-z-base:     0;
  --lt-z-elevated: 10;
  --lt-z-sticky:   100;
  --lt-z-dropdown: 1000;
  --lt-z-modal:    2000;
  --lt-z-tooltip:  3000;
  --lt-z-toast:    4000;


  /* ============================================================
   * LAYER 2 — SEMANTIC
   * 語意層：引用 primitive，描述用途；component 預設用此層
   * ============================================================ */

  /* --- Color: Brand --- */
  --lt-color-primary:         var(--lt-blue-70);
  --lt-color-primary-hover:   var(--lt-blue-60);
  --lt-color-primary-active:  var(--lt-blue-90);
  --lt-color-primary-bg:      var(--lt-blue-10);
  --lt-color-primary-bg-emphasized: var(--lt-blue-20);

  --lt-color-secondary:       var(--lt-turquoise-70);
  --lt-color-secondary-hover: var(--lt-turquoise-60);
  --lt-color-secondary-bg:    var(--lt-turquoise-10);

  /* --- Color: Functional (alias) --- */
  --lt-color-success: var(--lt-color-success-base);
  --lt-color-error:   var(--lt-color-error-base);
  --lt-color-warning: var(--lt-color-warning-base);
  --lt-color-info:    var(--lt-color-info-base);

  /* --- Color: Text --- */
  --lt-color-text-primary:   var(--lt-grey-700);   /* 內文預設 */
  --lt-color-text-secondary: var(--lt-grey-500);   /* 次要文字 */
  --lt-color-text-tertiary:  var(--lt-grey-400);   /* hint / placeholder */
  --lt-color-text-disabled:  var(--lt-grey-400);
  --lt-color-text-inverse:   var(--lt-white);
  --lt-color-text-link:      var(--lt-blue-60);
  --lt-color-text-heading:   var(--lt-grey-800);   /* 為未來 heading 獨立換色預留 */
  --lt-color-text-icon:      var(--lt-grey-600);   /* 為未來 icon 獨立換色預留 */

  /* --- Color: Background --- */
  --lt-color-bg-default:    var(--lt-white);
  --lt-color-bg-subtle:     var(--lt-grey-50);
  --lt-color-bg-emphasized: var(--lt-grey-100);
  --lt-color-bg-disabled:   var(--lt-grey-100);
  --lt-color-bg-inverse:    var(--lt-blue-90);
  --lt-color-bg-overlay:    rgba(0, 0, 0, 0.5);
  --lt-color-bg-skeleton:   var(--lt-grey-200);   /* 骨架屏；2026-09-24 定，對應前端 gray.skeleton → gray.10；用途命名，日後可單獨換色 */

  /* --- Color: Border --- */
  --lt-color-border-default: var(--lt-grey-200);
  --lt-color-border-strong:  var(--lt-grey-300);
  --lt-color-border-focus:   var(--lt-color-primary);
  --lt-color-border-input:   #DCE3EC;   /* prototype --tf-border；略不同於 grey-200 */
  --lt-color-border-error:   var(--lt-color-error-base);


  /* ============================================================
   * LAYER 3 — COMPONENT
   * 元件層：給特定元件使用；引用 semantic
   * ============================================================ */

  /* --- Sidebar (深海軍藍) --- */
  --lt-sidebar-width:      250px;
  --lt-sidebar-bg:         var(--lt-blue-90);
  --lt-sidebar-text:       rgba(255, 255, 255, 0.85);
  --lt-sidebar-text-muted: rgba(255, 255, 255, 0.50);
  --lt-sidebar-hover-bg:   rgba(255, 255, 255, 0.06);
  --lt-sidebar-active-bg:  var(--lt-color-primary);

  /* --- Topbar --- */
  --lt-topbar-bg:     var(--lt-white);
  --lt-topbar-shadow: var(--lt-shadow-dialog);   /* CMDS Dialog shadow（Card 級別 elevation）*/

  /* --- Card --- */
  --lt-card-bg:      var(--lt-color-bg-default);
  --lt-card-radius:  var(--lt-radius-md);
  --lt-card-shadow:  var(--lt-shadow-dialog);    /* CMDS 明確規範 Card 用 Dialog shadow */
  --lt-card-padding: var(--lt-space-24);

  /* --- Button --- */
  --lt-button-radius:     var(--lt-radius-sm);
  --lt-button-padding-x:  var(--lt-space-16);
  --lt-button-padding-y:  var(--lt-space-8);
  --lt-button-focus-ring: 0 0 0 3px rgba(0, 79, 176, 0.10);

  /* --- Input / Text Field --- */
  --lt-input-bg:        var(--lt-color-bg-default);
  --lt-input-border:    var(--lt-color-border-input);
  --lt-input-radius:    var(--lt-radius-sm);
  --lt-input-padding-x: var(--lt-space-16);
  --lt-input-padding-y: var(--lt-space-8);

  /* --- Modal --- */
  --lt-modal-radius:   var(--lt-radius-lg);
  --lt-modal-shadow:   var(--lt-shadow-dialog);  /* CMDS Dialog shadow（Modal = Dialog 同類）*/
  --lt-modal-padding:  var(--lt-space-24);
  --lt-modal-backdrop: rgba(0, 0, 0, 0.5);

  /* --- Tooltip --- */
  --lt-tooltip-bg:      #31383E;            /* 2026-10-09 Kabin 裁決改成 Figma 量到的值（原 #3C3C3C）；對齊 Lumiture-Guideline.md 規範；非品牌色，刻意不引用 brand token */
  --lt-tooltip-text:    var(--lt-white);
  --lt-tooltip-radius:  var(--lt-radius-sm);
  --lt-tooltip-padding: var(--lt-space-8);
}


/* ============================================================
 * NOT YET DEFINED (Pass 3+)
 * ============================================================
 * - ~~Chart palette~~ ✅ 已加入（2026-05-12 從 Figma General Behavior file audit）
 * - Gradient tokens (Figma 有 Lumiture.ai Blue / Orange / Lemon C 等)
 * - Opacity tokens (Figma 有 CM Opacity Color 系列)
 * - Composite typography tokens (--lt-type-h1, --lt-type-body 等 style sets)
 * - Focus / Inset shadow 特殊變體
 * - Dark mode 對應 token
 *
 * Shadow 結構待 Figma audit：v7/v8 用單層、tokens.css 主階用雙層；Overlay 已用單層作折衷
 * ============================================================ */

</style>
<style>
/* ============================================================
 * Customized Budget — route `/budget/customized-budget`
 * 權威順序（Kabin 2026-09-11 裁決）：Figma 設計稿 > tokens.css > Guideline > FE 現況
 * Figma file P3MZ4MmG1pjel2cSbXkUMW（Customized Budget page，45 個畫面）。數值皆由 REST 節點樹量得。
 * 標記慣例：⚠ DEVIATION＝偏離 Figma 或 FE；⚠ 設計端暫擬＝Figma 沒畫、自己補的；⚠ 未確認＝稿上有但用途或規則不明；⚠ Figma 註記＝稿上註記寫待 PM 確認
 * ============================================================ */

/* ---- 頁面層 token：Figma 量到的值、tokens.css 沒有或與 tokens.css 不同時補在這裡（待收錄進 tokens.css）----
 * ⚠ DEVIATION: Figma 與 tokens.css 不同的幾處一律照 Figma（權威順序 Figma > tokens）：
 *   卡片陰影 0 0 20 .10（token 是 0 0 6 .2）／輸入框與按鈕圓角 5（token 4）／Modal 圓角 10（token 12）／輸入框邊框 #CCCCCC（token #DCE3EC） */
:root{
  --cb-card-shadow: 0 0 20px rgba(0,0,0,.10);
  --cb-radius-field: 5px;
  --cb-radius-modal: 10px;
  --cb-field-border: #CCCCCC;                 /* = --lt-grey-300 */
  --cb-bar-track: #E6E6E6;
  --cb-bar-ok: #00B5A6;                       /* = --lt-color-success */
  --cb-bar-warn: #FC9A0F;                     /* = --lt-color-warning（FE 的 warning.hover 實際色值）*/
  --cb-bar-alert: #FF403D;                    /* = --lt-color-error */
  --cb-toast-ok: #008F88;                     /* = --lt-color-success-dark（Figma #6／#19）*/
  --cb-toast-err: #BF302E;                    /* tokens 無 error dark；Figma #6／#19 量到 */
  --cb-scroll-thumb: #D8D8D8;
  --cb-rule-border: #D1EEFF;                  /* = --lt-blue-20（FE 的 primary.light20）*/
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none}
body{font-family:var(--lt-font-sans);font-size:var(--lt-fs-14);line-height:var(--lt-leading-body);color:var(--lt-color-text-primary);background:var(--lt-color-primary-bg);letter-spacing:var(--lt-tracking-normal)}
a{color:var(--lt-color-primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:var(--lt-fs-14);letter-spacing:0;color:inherit}
input{font-family:inherit;letter-spacing:0}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20;vertical-align:middle;user-select:none}
.icon-outline{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}
[hidden]{display:none!important}

/* ===== App layout（Figma：內容區 padding 32、段落間距 20）===== */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:var(--lt-space-32);flex:1;display:flex;flex-direction:column;gap:20px;min-width:0}

/* ===== Buttons（Figma Button/M：36h、圓角 5、14/700）===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--lt-space-4);min-width:80px;padding:0 var(--lt-button-padding-x);height:36px;border-radius:var(--cb-radius-field);font-weight:var(--lt-fw-bold);font-size:var(--lt-fs-14);line-height:1.5;white-space:nowrap;border:1px solid transparent;transition:background-color var(--lt-transition-fast),border-color var(--lt-transition-fast),color var(--lt-transition-fast)}
.btn-p{background:var(--lt-color-primary);color:var(--lt-color-text-inverse)}
.btn-p:hover{background:var(--lt-color-primary-hover)}
.btn-p:active{background:var(--lt-color-primary-active)}
.btn-o{background:var(--lt-color-bg-default);color:var(--lt-color-primary);border-color:var(--lt-color-primary)}
.btn-o:hover{background:var(--lt-color-bg-subtle);color:var(--lt-color-primary-hover);border-color:var(--lt-color-primary-hover)}
.btn-o:active{background:var(--lt-color-bg-emphasized);color:var(--lt-color-primary-active);border-color:var(--lt-color-primary-active)}
.btn .material-symbols-outlined{font-size:16px;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
.btn .ic-add{font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 20}   /* Figma 的 + 是 Material Icons 字形，筆畫比 Symbols wght 400 粗 */
.btn:disabled,.btn.is-disabled{background:var(--lt-grey-300)!important;color:#fff!important;border-color:transparent!important;cursor:not-allowed}   /* Figma #04：Disabled Primary＝填 #CCCCCC、白字 */
.btn.btn-o:disabled,.btn.btn-o.is-disabled{background:#fff!important;color:var(--lt-grey-300)!important;border-color:var(--lt-grey-300)!important}   /* Disabled Outlined＝白底、#CCCCCC 框與字 */
/* Text Button（icon 永遠不畫底線、hover 底線只套文字 span）*/
.btn-t{display:inline-flex;align-items:center;gap:var(--lt-space-4);color:var(--lt-color-primary);font-weight:var(--lt-fw-bold);font-size:var(--lt-fs-14);line-height:24px;height:25px}
.btn-t .material-symbols-outlined{font-size:16px}
.btn-t:hover .t{text-decoration:underline}
.btn-t:disabled,.btn-t.is-disabled{color:var(--lt-grey-300);cursor:not-allowed}
.btn-t:disabled:hover .t,.btn-t.is-disabled:hover .t{text-decoration:none}
.icon-btn{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--lt-color-primary);flex-shrink:0;transition:background var(--lt-transition-fast)}
.icon-btn .material-symbols-outlined{font-size:18px}
.icon-btn:hover{background:var(--lt-blue-20)}
.icon-btn:disabled,.icon-btn.is-disabled{color:var(--lt-grey-400);cursor:not-allowed;background:none}
.icon-btn.on-dark:hover{background:var(--lt-blue-20)}

/* ===== Page header（Figma #01：H4 20/700、UpdateAt 靠右 12px）===== */
.pg-hdr{display:flex;align-items:center;gap:var(--lt-space-16);min-height:30px}
/* ⚠ DEVIATION: Overview v1 把標題放大成 Guideline H3 24px；這頁 Figma 量到 H4 20/700/30（#01、#05、#08、#13 全部一致），照 Figma */
.pg-title{font-size:20px;font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading);line-height:30px}
.upd{display:flex;align-items:center;gap:20px;margin-left:auto;font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);line-height:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.upd b{font-weight:var(--lt-fw-medium);margin-right:4px}
.upd .ic-info{font-size:16px;color:var(--lt-color-text-secondary);cursor:help;margin-left:4px}
.upd.is-skel{opacity:.55}
.pg-desc{font-size:var(--lt-fs-14);line-height:24px;color:var(--lt-color-text-secondary)}
.pg-actions{display:flex;justify-content:flex-end;gap:16px}

/* ===== Card（Figma Card：白底 r8 內距 24 陰影 0 0 20 .10）===== */
.card{background:var(--lt-card-bg);border-radius:var(--lt-card-radius);box-shadow:var(--cb-card-shadow);padding:var(--lt-card-padding)}

/* ===== Table（Figma：Header 50＋Row 50、header #F2FAFF、header 下緣 #B3B3B3、列分隔 #E6E6E6）===== */
.tbl-scroll{overflow-x:scroll;overflow-y:hidden;overscroll-behavior:contain;position:relative}
/* 進入頁面直接顯示橫向 scroll bar（#01 註記）：thumb #D8D8D8 r2、上下 1px #E6E6E6 */
.tbl-scroll::-webkit-scrollbar{height:16px}
.tbl-scroll::-webkit-scrollbar-track{background:#fff;border-top:1px solid #E6E6E6;border-bottom:1px solid #E6E6E6}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--cb-scroll-thumb);border:3px solid #fff;border-left-width:0;border-right-width:0;border-radius:6px;background-clip:padding-box}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:1360px;table-layout:fixed}
.tbl th,.tbl td{height:50px;padding:0 16px;text-align:left;vertical-align:middle;background:#fff;border-bottom:1px solid var(--lt-grey-200);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl th{background:var(--lt-color-primary-bg);font-weight:var(--lt-fw-bold);font-size:var(--lt-fs-14);color:var(--lt-color-text-heading);border-bottom:1px solid var(--lt-grey-400);position:relative}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--lt-grey-50)}
.tbl tbody tr.is-sel td{background:#fff}
.tbl tbody tr.is-opt{cursor:default}
.tbl tbody tr.is-opt td{opacity:.6}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th .sort-ic{font-size:16px;vertical-align:-3px;margin-left:4px;color:var(--lt-color-primary);font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 20}
.tbl .c-chk{width:48px;padding:0 0 0 16px;line-height:0}
.tbl .c-name{width:240px;padding-right:8px}   /* 文案寬度容差：Figma 文字框 208，這裡右內距縮到 8 避免 14px 字型差異多截一個字 */
.tbl .c-spend{width:355px}
.tbl .c-apply{width:146px}
.tbl .c-period{width:200px}
.tbl .c-trig{width:auto}
.tbl .c-status{width:75px;padding:0 0 0 16px}
.tbl .c-action{width:76px;padding:0 0 0 14px}
.tbl th.c-action{padding-left:16px}
/* sticky 欄：左 = checkbox + Budget Name/ID（一開始無陰影，捲動後才有）；右 = Status + Action（一開始就有陰影，捲到底消失）*/
.tbl .st-l1{position:sticky;left:0;z-index:3}
.tbl .st-l2{position:sticky;left:48px;z-index:3}
.tbl .st-r1{position:sticky;right:76px;z-index:3}
.tbl .st-r2{position:sticky;right:0;z-index:3}
.tbl th.st-l1,.tbl th.st-l2,.tbl th.st-r1,.tbl th.st-r2{z-index:4}
.tbl .st-l2::after,.tbl .st-r1::after{content:'';position:absolute;top:0;bottom:-1px;width:10px;pointer-events:none;opacity:0;transition:opacity .15s}
.tbl .st-l2::after{right:-10px;background:linear-gradient(90deg,rgba(0,0,0,.10),rgba(0,0,0,0))}
.tbl .st-r1::after{left:-10px;background:linear-gradient(270deg,rgba(0,0,0,.10),rgba(0,0,0,0))}
.tbl-wrap.sh-l .st-l2::after{opacity:1}
.tbl-wrap.sh-r .st-r1::after{opacity:1}
.cell-2l{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1}
.cell-2l .l1{font-size:var(--lt-fs-14);line-height:24px;color:var(--lt-color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-2l .l2{font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-grey-400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spend-cell{display:flex;align-items:center;min-width:0}
.bar{width:120px;height:16px;border-radius:4px;background:var(--cb-bar-track);position:relative;overflow:hidden;flex-shrink:0;margin-right:19px}
.bar i{position:absolute;left:0;top:0;bottom:0}
/* 五格離散進度條：五段白色 2px 分隔（Figma Dividers 每 24px 一條）*/
.bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 23px,#fff 23px,#fff 25px);background-size:120px 100%}
.spend-cap{font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-color-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.spend-cap div{overflow:hidden;text-overflow:ellipsis}
.spend-cap div:first-child{color:var(--lt-color-text-primary)}
/* Switch（Figma 30×16、r8、knob 12）*/
.sw{position:relative;display:inline-block;width:30px;height:16px;border-radius:8px;border:1px solid var(--lt-color-primary);background:#fff;vertical-align:middle;cursor:pointer;transition:background var(--lt-transition-fast)}
.sw::after{content:'';position:absolute;left:1px;top:1px;width:12px;height:12px;border-radius:50%;background:var(--lt-color-primary);transition:transform var(--lt-transition-fast),background var(--lt-transition-fast)}
.sw.on{background:var(--lt-color-primary)}
.sw.on::after{background:#fff;transform:translateX(14px)}
.sw:focus-visible{outline:none;box-shadow:var(--lt-button-focus-ring)}
.sw.is-disabled{opacity:.5;cursor:not-allowed}
.act-cell{display:flex;align-items:center;gap:8px}
.act-cell .icon-btn{width:20px;height:20px}
.act-cell .icon-btn .material-symbols-outlined{font-size:16px}
/* Figma 的 Checkbox 外框是 primary 色、圓角 2（shared/lumiture-checkbox.js 預設灰框圓角 4）*/
/* ⚠ DEVIATION: 本頁 checkbox 外框改 primary／圓角 2，照 #01 表格量到的 stroke #004FB0 r2；其他 prototype 維持 shared 預設 */
.cb-page .checkbox__box{border-color:var(--lt-color-primary);border-radius:2px}
.cb-page .checkbox:hover .checkbox__box{border-color:var(--lt-color-primary-hover)}
.chkcell{vertical-align:middle;display:flex;align-items:center;justify-content:center;cursor:pointer;width:16px;height:16px}

/* ===== Skeleton（#02／#15：灰色模塊、固定畫面）===== */
.sk{background:linear-gradient(90deg,#EBEBEB 25%,#F5F5F5 50%,#EBEBEB 75%);background-size:200% 100%;animation:shimmer 1.5s infinite linear;border-radius:4px}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk-tbl{border-collapse:collapse;width:100%}
.sk-rule{background:var(--lt-grey-100);border:1px solid var(--lt-grey-300);border-radius:8px;padding:21px 16px;display:flex;flex-direction:column;gap:26px}   /* Figma #15：條 14 高、上下各 5.25 留白 → 視覺 pad 21、條距 26 */
.sk-tbl th,.sk-tbl td{height:50px;padding:0 16px;border-bottom:1px solid var(--lt-grey-200)}
.sk-tbl th{height:48px;background:var(--lt-grey-100);border-top:2px solid var(--lt-grey-200);border-bottom:1px solid var(--lt-grey-200)}
.sk-tbl td+td,.sk-tbl th+th{}
.sk-tbl .sk{height:12px}
.sk-tbl .first{border-right:1px solid var(--lt-grey-200)}

/* ===== Empty / No-auth / Error（#03／#04／#04-1）===== */
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--lt-color-text-secondary);min-height:360px}   /* Figma #03／#04 卡片高 408＝內距 24×2 + 內容 360 */
.es .es-ic{font-size:80px;color:var(--lt-blue-30);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 48;line-height:80px;width:80px;height:80px}
.es .es-ic.is-outline{font-variation-settings:'FILL' 0,'wght' 700,'GRAD' 0,'opsz' 48}   /* Kabin 2026-10-09 驗收裁決：#03 空狀態的 table_view 稿上是空心格子，比照 Anomaly Detection（FILL 0＋wght 700 才對上稿的筆畫粗細） */
.es svg{width:80px;height:80px;display:block}
.es-title{font-size:var(--lt-fs-18);font-weight:var(--lt-fw-bold);line-height:27px;margin-top:16px}
.es-desc{font-size:var(--lt-fs-14);white-space:pre-line;margin-top:8px;line-height:24.5px}
.es .btn{margin-top:32px}
.es.err{min-height:70vh}

/* ===== Form 版面（#05：GoBack 16/700、標題 20/700、雙欄各 486、欄間距 32）===== */
.goback{display:inline-flex;align-items:center;gap:4px;font-size:var(--lt-fs-16);font-weight:var(--lt-fw-bold);line-height:24px;color:var(--lt-color-primary);align-self:flex-start;height:25px}
.goback .material-symbols-outlined{font-size:16px;color:var(--lt-color-primary)}
.goback:hover .t{text-decoration:underline}
.goback:disabled{opacity:.5;cursor:not-allowed}
.sec-stack{display:flex;flex-direction:column;gap:20px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.card-col{display:flex;flex-direction:column;gap:32px;min-width:0}
@media(max-width:1100px){.card-grid{grid-template-columns:1fr}}   /* ⚠ 設計端暫擬：Figma 只畫 1367 寬；窄視窗時兩欄改上下堆疊 */
.sec-title{font-size:var(--lt-fs-18);font-weight:var(--lt-fw-bold);line-height:27px;color:var(--lt-color-text-heading)}
.sec-title .req{color:var(--lt-color-error);margin-left:4px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld-group{display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-size:var(--lt-fs-12);font-weight:var(--lt-fw-bold);line-height:18px;color:var(--lt-color-primary)}
.lbl .req{color:var(--lt-color-error);font-weight:var(--lt-fw-regular)}
.help{font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-color-text-secondary)}
.help b{font-weight:var(--lt-fw-bold);color:var(--lt-color-text-primary)}
.help b.u{text-decoration:underline}
.help .note{color:var(--lt-color-error);display:block}
.err-msg{font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-color-error)}
.th-item > .err-msg{width:191px}   /* Figma #05-7：門檻錯誤訊息落在百分比輸入欄（191）底下、在欄內換行，不跨到等號與金額 */
.err-msg a,.err-msg .lnk{color:var(--lt-color-primary);text-decoration:underline;cursor:pointer}
.inp{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;background:#fff;border:1px solid var(--cb-field-border);border-radius:var(--cb-radius-field);min-width:0;transition:border-color var(--lt-transition-fast),box-shadow var(--lt-transition-fast)}
.inp:hover{border-color:var(--lt-grey-400)}
.inp:focus-within{border-color:var(--lt-color-border-focus);box-shadow:var(--lt-button-focus-ring)}
.inp input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:var(--lt-fs-14);line-height:21px;color:var(--lt-color-text-primary)}
.inp input::placeholder{color:var(--lt-grey-400)}
.inp .pfx,.inp .sfx{color:var(--lt-color-text-secondary);font-size:var(--lt-fs-14);flex-shrink:0}
.inp.is-err,.inp.is-err:hover{border-color:var(--lt-color-error);box-shadow:inset 0 0 0 1px var(--lt-color-error)}   /* Figma #05-7：錯誤框 2px */
.inp.is-err:focus-within{box-shadow:inset 0 0 0 1px var(--lt-color-error),0 0 0 3px rgba(255,64,61,.10)}
.inp.is-disabled{background:var(--lt-grey-100);border-color:var(--lt-grey-200);cursor:not-allowed}
.inp.is-disabled input,.inp.is-disabled .pfx{color:var(--lt-grey-400);cursor:not-allowed}
/* 下拉（Dropdown Field M：36h、箭頭是 8×6 實心三角 #676767）*/
.sel{display:flex;align-items:center;justify-content:space-between;gap:10px;height:36px;padding:0 9px 0 8px;background:#fff;border:1px solid var(--cb-field-border);border-radius:var(--cb-radius-field);font-size:var(--lt-fs-14);color:var(--lt-color-text-primary);cursor:pointer;text-align:left;width:100%;min-width:0;transition:border-color var(--lt-transition-fast),box-shadow var(--lt-transition-fast)}
.sel:hover{border-color:var(--lt-grey-400)}
.sel.open{border-color:var(--lt-color-border-focus);box-shadow:var(--lt-button-focus-ring)}
.sel .tri,.tri{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--lt-grey-500);flex-shrink:0}
.sel.open .tri,.chipfield.open .tri{transform:rotate(180deg)}
.sel .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.sel:disabled,.sel.is-disabled{background:var(--lt-grey-100);border-color:var(--lt-grey-200);color:var(--lt-grey-400);cursor:not-allowed}
.sel:disabled .tri{border-top-color:var(--lt-grey-400)}
.sel.is-err{border-color:var(--lt-color-error);box-shadow:inset 0 0 0 1px var(--lt-color-error)}
.fld-sel-w200{width:200px;flex-shrink:0}
.period-row{display:flex;align-items:center;gap:16px}
.starts{display:flex;align-items:center;gap:8px;font-size:var(--lt-fs-14);line-height:24px;white-space:nowrap}
.dp-trig{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;width:206px;background:#fff;border:1px solid var(--cb-field-border);border-radius:6px;color:var(--lt-color-text-secondary);font-size:var(--lt-fs-14);cursor:pointer;text-align:left;transition:border-color var(--lt-transition-fast),box-shadow var(--lt-transition-fast)}
.dp-trig .material-symbols-outlined{font-size:18px;color:var(--lt-grey-500)}
.dp-trig .dp-ic{font-size:20px;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}   /* Figma #05 Date Picker：Date 圖示 20×20 */
.dp-trig:not(.range) .dp-tx{flex:1;text-align:center}   /* Figma #05：日期在 146 寬的文字框內置中 */
.dp-trig.range{justify-content:center}
.dp-trig:hover{border-color:var(--lt-grey-400)}
.dp-trig.open{border-color:var(--lt-color-border-focus);box-shadow:var(--lt-button-focus-ring)}
.dp-trig.range{width:270px}
.dp-trig.range .arr{font-size:16px}
.dp-trig:disabled{background:var(--lt-grey-100);border-color:var(--lt-grey-200);color:var(--lt-grey-400);cursor:not-allowed}
.dp-trig:disabled .material-symbols-outlined{color:var(--lt-grey-400)}

/* Thresholds（容器 #F2FAFF、邊框 #E6E6E6、r8、內距 16、列距 16）*/
.th-box .btn-t{height:20px}
.th-box{background:var(--lt-color-primary-bg);border:1px solid var(--lt-grey-200);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:16px}
.th-row{display:flex;gap:8px;align-items:flex-end}
.th-item{display:flex;flex-direction:column;gap:4px}
.th-cols{flex:1;display:grid;grid-template-columns:191px 8px 191px;column-gap:16px;align-items:end;min-width:0}
.th-cols .eq{height:36px;display:flex;align-items:center;justify-content:center;font-size:var(--lt-fs-14)}
.th-cols .amt{height:36px;display:flex;align-items:center;font-size:var(--lt-fs-14);color:var(--lt-color-text-primary);white-space:nowrap}
.th-del .material-symbols-outlined{font-size:20px}
.th-del{width:24px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Chips field（Figma Dropdown/Field/Deletable Chip：chip r5、外框 primary、右側 primary 實心刪除鈕）*/
.chipfield{display:flex;align-items:center;gap:8px;min-height:36px;max-height:240px;padding:4px 8px;background:#fff;border:1px solid var(--cb-field-border);border-radius:var(--cb-radius-field);cursor:pointer;min-width:0;transition:border-color var(--lt-transition-fast),box-shadow var(--lt-transition-fast)}
.chipfield:hover{border-color:var(--lt-grey-400)}
.chipfield.open,.chipfield:focus-within{border-color:var(--lt-color-border-focus);box-shadow:var(--lt-button-focus-ring)}
/* Figma #08-1：Batch 對象欄展開時是 #B3B3B3 2px，跟其他欄位的 primary focus 不同（Kabin 2026-10-09 裁決照稿，只改這一欄）*/
.chipfield[data-fid="cf:batch"].open,.chipfield[data-fid="cf:batch"].open:focus-within{border-color:#B3B3B3;box-shadow:inset 0 0 0 1px #B3B3B3}
.chipfield.is-err{border-color:var(--lt-color-error);box-shadow:inset 0 0 0 1px var(--lt-color-error)}
.chipfield.is-disabled{background:var(--lt-grey-100);cursor:not-allowed}
.chip-list{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center;overflow-y:auto;overscroll-behavior:contain;max-height:230px;line-height:1}
.chipfield .ph{color:var(--lt-grey-400);font-size:var(--lt-fs-14);line-height:21px}
.chip{display:inline-flex;align-items:stretch;height:20px;border:1px solid var(--lt-color-primary);border-radius:var(--cb-radius-field);overflow:hidden;color:var(--lt-color-primary);font-size:var(--lt-fs-12);line-height:18px;background:#fff;min-width:0}
.chip{max-width:300px}   /* #07 註記：Layout Chip Max Width = 300px（收件人 chip 另依 #05-4 為欄位寬的一半，inline style 覆寫）*/
.chip .tx{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.chip .x{width:24px;display:flex;align-items:center;justify-content:center;background:var(--lt-color-primary);color:#fff;cursor:pointer;flex-shrink:0}
.chip .x .material-symbols-outlined{font-size:16px;font-variation-settings:'FILL' 0,'wght' 700,'GRAD' 0,'opsz' 20}
.chip .x:hover{background:var(--lt-color-primary-hover)}
.chip.is-bad{border-color:var(--lt-color-error);color:var(--lt-color-error)}
.chip.is-bad .x{background:var(--lt-color-error)}
.chip.is-bad .x:hover{background:var(--cb-toast-err)}
.chip.is-more{border:none;color:var(--lt-color-text-primary);padding:0 4px}
.cf-ic{display:flex;align-items:center;gap:8px;flex-shrink:0;align-self:center}
.cf-clear{width:16px;height:16px;border-radius:50%;background:#CCCCCC;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cf-clear .material-symbols-outlined{font-size:12px;font-variation-settings:'FILL' 0,'wght' 700,'GRAD' 0,'opsz' 20}
.cf-clear:hover{background:var(--lt-grey-500)}
.chipfield .rin{border:none;outline:none;flex:1 1 24px;width:24px;min-width:24px;font-size:var(--lt-fs-14);line-height:21px;background:none;color:var(--lt-color-text-primary)}
.chipfield .rin::placeholder{color:var(--lt-grey-400)}

/* ===== Budget Scope（#07：規則卡 #F2FAFF／邊框 #D1EEFF／r8／內距 16／gap 16）===== */
.scope-hint{font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-color-text-secondary)}
.scope-hint b{color:var(--lt-color-text-primary);font-weight:var(--lt-fw-bold)}
.rules{display:flex;flex-direction:column;gap:16px}
.rule-row{display:flex;gap:16px;align-items:flex-start}
.rule-card{flex:1;min-width:0;background:var(--lt-color-primary-bg);border:1px solid var(--cb-rule-border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:16px}
.rule-hd{display:flex;align-items:center;gap:8px;line-height:36px;min-height:36px}
.rule-hd .sel{width:200px;flex-shrink:0}
.csp-logo{width:24px;height:24px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.csp-logo svg{width:24px;height:24px}
.cond-row{display:flex;align-items:flex-start;gap:8px;min-height:36px}
.cond-row .kw{width:48px;flex-shrink:0;text-align:right;line-height:36px}
.cond-row .ty{width:72px;height:36px;flex-shrink:0;border:1px solid var(--cb-field-border);border-radius:var(--cb-radius-field);background:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--lt-fs-14)}
.cond-row .isin{line-height:36px;flex-shrink:0}
.cond-row .cf-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cond-row .cond-x{height:36px;display:flex;align-items:center;flex-shrink:0}
.rule-side{display:flex;flex-direction:column;justify-content:center;align-self:stretch;gap:16px;flex-shrink:0;width:30px;align-items:center}   /* Figma #07 Actions 30×(規則卡高) V gap16、置中 */
.rule-empty{background:var(--lt-color-primary-bg);border:1px dashed var(--lt-grey-500);border-radius:8px;padding:32px 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;color:var(--lt-color-text-secondary)}
.rule-empty .t1{font-size:var(--lt-fs-16);font-weight:var(--lt-fw-bold);line-height:24px}
.rule-empty .t2{font-size:var(--lt-fs-14);line-height:24px}
.add-rule-row{display:flex;align-items:center;gap:16px}
.add-rule-row .btn{min-width:112px}
.tip-l{position:relative}
.tip-l::before{content:attr(data-tipl);position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);background:var(--lt-tooltip-bg);color:#fff;font-size:14px;line-height:21px;padding:6px 12px;border-radius:var(--lt-tooltip-radius);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:50}
.tip-l:hover::before,.tip-l:focus-visible::before{opacity:1}

/* ===== 底部固定動作條（#05 Save：#F2FAFF、陰影 0 0 6 .2、內距 16/32、貼視窗底）===== */
.fixbar{position:sticky;bottom:0;margin:12px -32px -32px;padding:16px 32px;background:var(--lt-color-primary-bg);box-shadow:0 0 6px rgba(0,0,0,.2);display:flex;justify-content:flex-end;gap:16px;z-index:30}

/* ===== Popover（menu／multi／recipients／date）===== */
.pop{position:fixed;z-index:var(--lt-z-dropdown);background:#fff;border-radius:5px;box-shadow:0 0 6px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.08);overscroll-behavior:contain;font-size:var(--lt-fs-14)}
.pop.menu{padding:8px;min-width:250px}
.mi{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px;border-radius:4px;cursor:pointer;color:var(--lt-color-text-primary);white-space:nowrap}
.mi:hover,.mi.hl{background:var(--lt-grey-50)}
.mi.sel{background:var(--lt-grey-100)}
.mi.is-disabled{color:var(--lt-grey-400);cursor:not-allowed;background:none}
.pop.multi{padding:8px;display:flex;flex-direction:column}
.pop.multi .srch{display:flex;align-items:center;height:32px;border:1px solid var(--cb-field-border);border-radius:var(--cb-radius-field);padding:0 8px;gap:8px;flex-shrink:0}
.pop.multi .srch input{flex:1;border:none;outline:none;font-size:var(--lt-fs-14);background:none;min-width:0}
.pop.multi .srch input::placeholder{color:var(--lt-grey-400)}
.pop.multi .srch .material-symbols-outlined{font-size:20px;color:var(--lt-grey-500)}
.pop.multi .lst{overflow-y:auto;overscroll-behavior:contain;margin-top:4px;flex:1;min-height:0}
.pop.multi .opt{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px;cursor:pointer;white-space:nowrap}
.pop.multi .opt:hover{background:var(--lt-grey-50)}
.pop.multi .opt.all{border-bottom:1px solid var(--lt-grey-200);position:sticky;top:0;background:#fff;z-index:1}
.pop.multi .opt.all:hover{background:var(--lt-grey-50)}
.pop.multi .opt .lbl-t{overflow:hidden;text-overflow:ellipsis}
.pop.multi .empty{padding:16px;text-align:center;color:var(--lt-color-text-secondary)}
.pop.recip{padding:8px 0}
.pop.recip .lst{overflow-y:auto;overscroll-behavior:contain;max-height:296px;padding:0 8px}
.ru{display:flex;flex-direction:column;justify-content:center;height:58px;padding:0 8px;border-radius:4px;cursor:pointer}
.ru .n{font-size:var(--lt-fs-14);line-height:21px;color:var(--lt-color-text-primary)}
.ru .e{font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-color-text-secondary)}
.ru b{font-weight:var(--lt-fw-bold)}
.ru:hover,.ru.hl{background:var(--lt-grey-200)}
.ru.is-disabled{opacity:.45;cursor:not-allowed;background:none}
.pop.recip .empty{padding:16px;text-align:center;color:var(--lt-color-text-secondary)}
/* Date picker（CMDS：« ‹ Mon YYYY ▾ › »、Su–Sa、40×40 儲存格、選取 primary、範圍連續）*/
.pop.dp{padding:16px 20px 12px;width:300px}
.dp-hd{display:flex;align-items:center;gap:4px;height:32px;border-bottom:1px solid var(--lt-grey-200);padding-bottom:12px;box-sizing:content-box}
.dp-hd .nv{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--lt-grey-700);border-radius:4px}
.dp-hd .nv:hover{background:var(--lt-grey-100)}
.dp-hd .nv .material-symbols-outlined{font-size:18px;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 20}
.dp-hd .ttl{flex:1;text-align:center;font-weight:var(--lt-fw-bold);font-size:var(--lt-fs-14);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.dp-hd .ttl .tri{border-left-width:3px;border-right-width:3px;border-top-width:5px}
.dp-wk{display:grid;grid-template-columns:repeat(7,1fr);margin-top:12px;font-size:var(--lt-fs-12);color:var(--lt-grey-500);text-align:center;line-height:24px}
.dp-gr{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.dp-d{height:40px;display:flex;align-items:center;justify-content:center;font-size:var(--lt-fs-14);cursor:pointer;position:relative;color:var(--lt-grey-700)}
.dp-d span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.dp-d:hover span{background:var(--lt-grey-100)}
.dp-d.out{color:var(--lt-grey-300);cursor:default}
.dp-d.out:hover span{background:none}
.dp-d.dis{color:var(--lt-grey-300);cursor:not-allowed}
.dp-d.dis:hover span{background:none}
.dp-d.today span{background:var(--lt-grey-100)}
.dp-d.sel span{background:var(--lt-color-primary);color:#fff}
.dp-d.in-range{background:var(--lt-color-primary);color:#fff}
.dp-d.in-range span{color:#fff}
.dp-d.in-range:hover span{background:transparent}
.dp-d.rs{border-radius:6px 0 0 6px}
.dp-d.re{border-radius:0 6px 6px 0}
.dp-d.rs.re{border-radius:6px}
.dp-mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 0 8px}
.dp-mg .m{height:36px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-weight:var(--lt-fw-bold);color:var(--lt-grey-500);cursor:pointer}
.dp-mg .m:hover{background:var(--lt-color-primary-bg)}
.dp-mg .m.sel{background:var(--lt-color-primary);color:#fff}

/* ===== Modal（#16／#17／#09：655 寬、r10、內距 24/32、陰影 0 0 6 .2、標題 20/700）===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:var(--lt-z-modal);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:655px;max-width:100%;max-height:calc(100vh - 48px);background:#fff;border-radius:var(--cb-radius-modal);box-shadow:var(--lt-shadow-dialog);padding:24px 32px;display:flex;flex-direction:column;gap:24px;min-height:0}
.modal.g30{gap:30px}
.modal .m-hd{display:flex;align-items:center;gap:15px;flex-shrink:0}
.modal .m-hd .ic{font-size:30px;color:var(--lt-color-error);flex-shrink:0}
.modal .m-hd h2{flex:1;font-size:20px;line-height:30px;font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading)}
.modal .m-x{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--lt-grey-500);flex-shrink:0}
.modal .m-x:hover{background:var(--lt-grey-100)}
.modal .m-x .material-symbols-outlined{font-size:24px;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
.modal .m-body{font-size:var(--lt-fs-14);line-height:24px;color:var(--lt-color-text-primary);flex-shrink:0}
.modal .m-body.ind{padding-left:45px}
.modal .m-body b{font-weight:var(--lt-fw-bold)}
.modal .m-list{border:1px solid var(--lt-grey-200);border-radius:8px;padding:8px;overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1 1 auto}
.modal .m-list.r5{border-radius:5px}
.modal .m-list li{list-style:none;color:var(--lt-color-primary);font-size:var(--lt-fs-14);line-height:24px;display:flex;gap:8px;word-break:break-word}
.modal .m-list li::before{content:'•';font-size:10px;line-height:24px;flex-shrink:0;margin-left:4px}
.modal .m-ft{display:flex;justify-content:flex-end;gap:16px;flex-shrink:0}

/* ===== Toast（#6／#19：左下、400×46、r4、陰影 0 0 6 .2）===== */
/* ⚠ DEVIATION: Figma toast 距左 24；Demo FAB 佔 18–66px，與其他 prototype 一致往右挪到 80 */
.toast-wrap{position:fixed;bottom:24px;left:80px;z-index:var(--lt-z-toast);display:flex;flex-direction:column-reverse;gap:16px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 16px;background:var(--cb-toast-ok);color:#fff;border-radius:4px;box-shadow:var(--lt-shadow-dialog);font-size:var(--lt-fs-14);line-height:24px;width:400px;animation:toast-in .25s ease-out;pointer-events:auto}
.toast.err{background:var(--cb-toast-err)}
.toast.info{background:var(--lt-tooltip-bg)}
.toast .material-symbols-outlined{font-size:20px;flex-shrink:0}
@keyframes toast-in{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* Tooltip（非圖表：#3C3C3C 深底白字，max-width 600）*/
body #gl-tip{max-width:600px;white-space:pre-line;font-size:13px;line-height:1.5;padding:8px 12px;border-radius:var(--lt-tooltip-radius)}

/* ===== Footer（CLAUDE.md 規定的 prototype footer；Figma 底部 Copyright 列是產品 footer，不是這個）===== */
.footer{padding:var(--lt-space-16) var(--lt-space-32);background:var(--lt-color-primary-bg);border-top:1px solid var(--lt-color-border-default);display:flex;align-items:center;justify-content:space-between;font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);flex-wrap:wrap;gap:10px}
.footer-version{font-weight:var(--lt-fw-medium);color:#262626}
.footer-version .ver-tag{background:#34B5D9;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px}
.footer-credit{color:#676767;font-size:12px}
</style>

<script>
/* === Inlined: shared/lumiture-sidebar.js === */
/*!
 * lumiture-sidebar.js — Lumiture Shared Sidebar (with canonical logo)
 *
 * Auto-injects:
 *   - Sidebar CSS (logo, nav items, group collapse, active state)
 *   - Canonical Lumiture logo (concentric circles + PROTOTYPE tag + LumiTure.ai wordmark)
 *
 * Usage in prototype HTML:
 *   1. Define window.LUMITURE_NAV = [...]   (see schema below)
 *   2. Define window.LUMITURE_ACTIVE = 'item-id'  (which item is highlighted)
 *   3. Add mount point: <aside id="lt-sidebar"></aside>
 *   4. <script src="../shared/lumiture-sidebar.js"><\/script>
 *
 * NAV schema:
 *   window.LUMITURE_NAV = [
 *     // Top-level item (no group)
 *     { type: 'item', id: 'overview', label: 'Overview', icon: 'home', href: '#' },
 *     // Group with children (expanded by default unless `collapsed: true`)
 *     { type: 'group', id: 'dashboard', label: 'Dashboard', expanded: true, items: [
 *       { id: 'cost-dashboard', label: 'Cost Dashboard', icon: 'dashboard', href: '#' },
 *       { id: 'exec-insights',  label: 'Executive Insights', icon: 'monitoring', disabled: true },
 *     ]},
 *   ];
 *   window.LUMITURE_ACTIVE = 'cost-dashboard';  // which item is active
 *
 * API:
 *   window.LumitureSidebar.toggleGroup(groupId)
 *   window.LumitureSidebar.toggleCollapse()    — collapse the whole sidebar (icon-only)
 *   window.LumitureSidebar.setActive(itemId)
 */
(function () {
  'use strict';

  // ===== CSS =====
  var CSS = [
    /* CSS variables — sidebar 用 Primary Dark #002663（per Lumiture-Guideline.md，2026-05-08 設計師確認） */
    ':root{--lt-sb-w:250px;--lt-sb-bg:#002663;--lt-sb-hov:rgba(255,255,255,.06);',
    '--lt-sb-active:#004FB0;--lt-sb-text:rgba(255,255,255,.85);--lt-sb-text-muted:rgba(255,255,255,.5);',
    '--lt-sb-border:rgba(255,255,255,.1)}',

    /* Sidebar container — 採 sticky positioning：父層 .app 用 flex 或 grid 都能適應
       min-width:0 是必要的：flex 子元素預設 min-width:auto 會被內容 min-content size 撐住，導致 collapse 失效 */
    '.lt-sidebar{width:var(--lt-sb-w);min-width:0;background:var(--lt-sb-bg);color:#fff;',
    'position:sticky;top:0;height:100vh;z-index:100;overflow:hidden;',
    'flex-shrink:0;',
    'display:flex;flex-direction:column;transition:width .2s ease;scrollbar-width:none;',
    /* 2026-10-02 對 Figma LumiTag #01：Side Navbar 三層陰影 */
    'box-shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12)}',
    '.lt-sidebar::-webkit-scrollbar{display:none}',
    '.lt-sidebar.lt-collapsed{width:64px}',

    /* Logo block */
    '.lt-sb-logo{position:relative;padding:0 24px;display:flex;align-items:center;gap:6px;',
    'font-size:18px;font-weight:700;color:#fff;border-bottom:none;',
    'height:64px;box-sizing:border-box;white-space:nowrap;overflow:hidden;flex-shrink:0}',
    '.lt-sb-logo-wrap{width:39px;height:28px;flex-shrink:0}',
    '.lt-sb-logo-wrap svg{width:39px;height:28px;display:block;overflow:visible}',
    /* hover 變形（2026-10-05 Kabin 試做）：圓環白→青、短條青→白 0.18s，腳 scaleY 0→1 從圓環裡長出來 0.22s；只有連結狀態才有 */
    'a.lt-sb-logo{text-decoration:none;cursor:pointer}',
    'a.lt-sb-logo:focus-visible{outline:2px solid #4ADFFF;outline-offset:-6px;border-radius:8px}',
    '.lt-i-ring{fill:#FFF;transition:fill .18s ease}',
    '.lt-i-short{fill:#4ADFFF;transition:fill .18s ease}',
    '.lt-i-leg{fill:#4ADFFF;transform:scaleY(0);transform-box:fill-box;transform-origin:50% 0;transition:transform .22s cubic-bezier(.2,.8,.2,1) .04s}',
    'a.lt-sb-logo:hover .lt-i-ring,a.lt-sb-logo:focus-visible .lt-i-ring{fill:#4ADFFF}',
    'a.lt-sb-logo:hover .lt-i-short,a.lt-sb-logo:focus-visible .lt-i-short{fill:#FFF}',
    'a.lt-sb-logo:hover .lt-i-leg,a.lt-sb-logo:focus-visible .lt-i-leg{transform:scaleY(1)}',
    '@media (prefers-reduced-motion:reduce){.lt-i-ring,.lt-i-short,.lt-i-leg,.lt-sb-proto-x{transition:none}}',
    '.lt-sb-logo-text{transition:opacity .2s;color:#fff;font-size:18px;line-height:1}',

       9px、青色 #4ADFFF（對比 9.12:1），右緣實測 228.6px，在 nav 項目右緣 234px 以內。原本的 P 標誌存成 shared/prototype-p-mark.svg */
    '.lt-sb-proto{flex-shrink:0;padding:0 4px;border:1px solid #4ADFFF;border-radius:999px;color:#4ADFFF;',

    '.lt-sidebar.lt-collapsed .lt-sb-logo-text,.lt-sidebar.lt-collapsed .lt-sb-proto{display:none}',
    '.lt-sidebar.lt-collapsed .lt-sb-logo{padding:0;justify-content:center;gap:0}',
    /* 收合時膠囊放不下，改顯示 prototype 專用 P 標誌（shared/prototype-p-mark.svg），收合後也看得出是 prototype（2026-10-05 Kabin） */
    '.lt-sb-logo-p{display:none;width:36.8px;height:32px;flex-shrink:0}',

    '.lt-sidebar.lt-collapsed .lt-sb-logo-wrap{display:none}',
    '.lt-sidebar.lt-collapsed .lt-sb-logo-p{display:block}',

    /* Nav scroll area — 內部捲動，sidebar 外層不捲（寬敞 padding 對齊原始設計） */

    '.lt-sb-item{display:flex;align-items:center;gap:8px;padding:8px;min-height:40px;box-sizing:border-box;cursor:pointer;',
    'font-size:14px;font-weight:400;line-height:24px;color:#fff;border-radius:4px;transition:background .15s;',
    'text-decoration:none;white-space:nowrap;overflow:hidden;margin-bottom:8px}',
    '.lt-sb-item:hover{background:var(--lt-sb-hov);color:#fff}',
    '.lt-sb-item.lt-active{background:var(--lt-sb-active);color:#fff}',
    '.lt-sb-item.lt-dis{color:rgba(255,255,255,.35);cursor:not-allowed;pointer-events:none}',
    '.lt-sb-item .material-symbols-outlined{font-size:24px;flex-shrink:0}',

    /* Group section */
    '.lt-sb-group{margin-bottom:0}',

  // logo 連到 Overview（從 LUMITURE_NAV 拿 href）；在 Overview 頁本身不連自己，也就沒有 hover 變形
  function _renderLogo() {
    var nav = window.LUMITURE_NAV || [];
    var home = nav.filter(function (e) { return e.type === 'item' && e.id === 'overview'; })[0];
    var linked = home && home.href && !home.disabled && window.LUMITURE_ACTIVE !== 'overview';
    var open = linked ? '<a class="lt-sb-logo is-link" href="' + _esc(home.href) + '" title="Go to Overview">' : '<div class="lt-sb-logo">';
    return open +
      '<div class="lt-sb-logo-wrap">' + LOGO_ICON + '</div>' +
      '<span class="lt-sb-logo-text">LumiTure.ai</span>' +
      '<span class="lt-sb-proto" title="Prototype">PROTO<span class="lt-sb-proto-x">TYPE</span></span>' +
      '<div class="lt-sb-logo-p" aria-hidden="true"><svg viewBox="0 0 39.10 34.00" fill="none">' + P_MARK_INNER + '</svg></div>' +
    (linked ? '</a>' : '</div>');
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function _renderItem(item, isSub) {
    var cls = isSub ? 'lt-sb-subitem' : 'lt-sb-item';
    var isActive = (item.id === window.LUMITURE_ACTIVE);
    var active = isActive ? ' lt-active' : '';
    var dis = item.disabled ? ' lt-dis' : '';
    // Active item: render as <div> (no self-link). Disabled item: also no href.
    var useHref = item.href && !isActive && !item.disabled;
    var tag = useHref ? 'a' : 'div';
    var hrefAttr = useHref ? ' href="' + _esc(item.href) + '"' : '';
    var dataId = ' data-nav-id="' + _esc(item.id) + '"';
    return '<' + tag + ' class="' + cls + active + dis + '"' + hrefAttr + dataId + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon || 'circle') + '</span>' +
             '<span>' + _esc(item.label) + '</span>' +
           '</' + tag + '>';
  }

  function _renderGroup(grp) {
    var collapsed = grp.collapsed ? ' lt-collapsed' : '';
    var children = (grp.items || []).map(function (item) {
      return _renderItem(item, true);
    }).join('');
    return '<div class="lt-sb-group' + collapsed + '" data-group-id="' + _esc(grp.id) + '">' +
             '<div class="lt-sb-group-hdr">' +
               '<span>' + _esc(grp.label) + '</span>' +
               '<span class="material-symbols-outlined lt-sb-group-arrow">keyboard_arrow_up</span>' +
             '</div>' +
             '<div class="lt-sb-group-children">' + children + '</div>' +
           '</div>';
  }

  function _renderNav() {
    var nav = window.LUMITURE_NAV || [];
    var html = '<div class="lt-sb-nav">';
    nav.forEach(function (entry) {
      if (entry.type === 'group') {
        html += _renderGroup(entry);
      } else {
        html += _renderItem(entry, false);
      }
    });
    html += '</div>';
    return html;
  }

  function _renderCollapseBtn() {
    return '<div class="lt-sb-collapse-btn">' +
             '<button type="button" data-action="toggle-collapse" title="Collapse sidebar">' +
               '<span class="material-symbols-outlined">chevron_left</span>' +
             '</button>' +
           '</div>';
  }

  // ===== Mount =====
  function _render() {
    var mount = document.getElementById('lt-sidebar');
    if (!mount) {
      console.warn('[lumiture-sidebar] Mount point #lt-sidebar not found');
      return;
    }
    // If mount is not already a sidebar, wrap it
    mount.classList.add('lt-sidebar');
    mount.innerHTML = _renderLogo() + _renderNav() + _renderCollapseBtn();

    // Group toggle
    mount.querySelectorAll('.lt-sb-group-hdr').forEach(function (hdr) {
      hdr.addEventListener('click', function () {
        var grp = hdr.parentElement;
        if (grp) grp.classList.toggle('lt-collapsed');
      });
    });
    // Collapse the whole sidebar
    var btn = mount.querySelector('[data-action="toggle-collapse"]');
    if (btn) {
      btn.addEventListener('click', function () {
        window.LumitureSidebar.toggleCollapse();
      });
    }
  }

  // ===== Public API =====
  window.LumitureSidebar = {
    toggleGroup: function (groupId) {
      var grp = document.querySelector('[data-group-id="' + groupId + '"]');
      if (grp) grp.classList.toggle('lt-collapsed');
    },
    toggleCollapse: function () {
      var sb = document.getElementById('lt-sidebar');
      var main = document.querySelector('.lt-main, .main, main');
      if (sb) sb.classList.toggle('lt-collapsed');
      if (main) main.classList.toggle('lt-sidebar-collapsed');
      // Sync legacy CSS vars (--sw) for prototypes that reference them in topbar / footer
      var w = sb && sb.classList.contains('lt-collapsed') ? '64px' : '250px';
      document.documentElement.style.setProperty('--sw', w);
      document.documentElement.style.setProperty('--lt-sb-w', w);
    },
    setActive: function (itemId) {
      window.LUMITURE_ACTIVE = itemId;
      document.querySelectorAll('.lt-sb-item, .lt-sb-subitem').forEach(function (el) {
        el.classList.toggle('lt-active', el.dataset.navId === itemId);
      });
    },
    rerender: _render,
  };

  // 頁面自己沒設 favicon 才補，分頁列一眼分得出 prototype 跟正式站
  function _injectFavicon() {
    if (document.querySelector('link[rel~="icon"]')) return;
    var l = document.createElement('link');
    l.rel = 'icon'; l.type = 'image/svg+xml';
    l.href = 'data:image/svg+xml,' + encodeURIComponent(FAVICON_SVG);
    document.head.appendChild(l);
  }

  // ===== INIT =====
  function _init() {
    _injectCSS();
    _injectFavicon();
    _render();
    // Dispatch resize so chart libraries (ECharts 等) 重新測量容器
    // —— 避免 inline script 已先 init chart 後，shared CSS 才 inject 導致 layout shift
    requestAnimationFrame(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

  function _injectCSS() {
    if (document.getElementById('lt-topbar-css')) return;

    s.id = 'lt-topbar-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function _user() {
    var u = Object.assign({}, DEFAULT_USER, window.LUMITURE_USER || {});
    u.quota = Object.assign({}, DEFAULT_USER.quota, (window.LUMITURE_USER || {}).quota || {});
    return u;
  }
  function _status(used, total) {
    if (!total || total <= 0) return 'active';
    var pct = used / total * 100;
    if (pct >= 100) return 'depleted';
    if (pct >= 80)  return 'warning';
    return 'active';
  }
  function _planItems(plan) {
    return PLAN_QUOTA_ITEMS[plan] != null ? PLAN_QUOTA_ITEMS[plan] : PLAN_QUOTA_ITEMS.Standard;
  }
  function _showQuotaBox(u) {
    return _planItems(u.plan).length > 0;
  }

  // ===== Renderers =====
  function _renderIcon(item) {
    var attrs = ' class="lt-tb-ic" title="' + _esc(item.title || '') + '"';
