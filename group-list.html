  const notAuthorized = state.cloudAuth==='gcp-only' && state.cloud!=='gcp';
  const body = () => {
    if(state.pageState==='loading'){
      return `<div class="pill-tabs">${Object.keys(CLOUD_META).map(c=>`<span class="pill-tab ${c===state.cloud?'active':''}"><span class="csp-dot" style="background:${CLOUD_META[c].dot}"></span>${CLOUD_META[c].label}</span>`).join('')}</div>
        <div class="res-toolbar"><div class="search-box"><span class="material-symbols-outlined">search</span><input disabled placeholder="Search resources"></div></div>
        <div class="table-wrap"><table><colgroup><col style="width:48px"><col style="width:42%"><col><col style="width:80px"></colgroup><thead><tr><th></th><th>${CLOUD_META[state.cloud].col1}</th><th>${CLOUD_META[state.cloud].col2}</th><th>Action</th></tr></thead><tbody>${skeletonRows(4)}</tbody></table></div>`;
    }
    if(notAuthorized){
      const isAdmin = state.role==='admin';
      return `<div class="pill-tabs">${Object.keys(CLOUD_META).map(c=>`<button class="pill-tab ${c===state.cloud?'active':''}" onclick="state.cloud='${c}';render()"><span class="csp-dot" style="background:${CLOUD_META[c].dot}"></span>${CLOUD_META[c].label}</button>`).join('')}</div>
        <div class="empty-state error"><div>
          <span class="material-symbols-outlined">${isAdmin?'lock_open':'lock'}</span>
          <p class="empty-title">${CLOUD_META[state.cloud].label} is not authorized</p>
          <p class="empty-copy">${isAdmin?`Authorize ${CLOUD_META[state.cloud].label} in Authorization List before assigning resources from this provider.`:'Please reach out to your administrator to authorize this cloud provider.'}</p>
          ${isAdmin?'<a class="btn btn-pri" href="./organization-settings.html" style="text-decoration:none"><span class="material-symbols-outlined">link</span>Go to Authorization List</a>':''}
        </div></div>`;
    }
    const resources = resourcesFor(group.id, state.cloud);
    const selected = state.selectedResources[state.cloud] || {};
    const selectedIds = Object.keys(selected).filter(id=>selected[id]);
    const canRemove = actions().removeResource;
    const canAssign = actions().assignResource;
    let tableBlock;
    if(!resources.length){
      tableBlock = `<div class="empty-state"><div><span class="material-symbols-outlined">inventory_2</span>
        <p class="empty-title">No Resources Yet</p>
        <p class="empty-copy">No resources have been assigned to this group yet.
Please assign new resources or reach out to your administrator for help.</p></div></div>`;
    } else {
      const resAccessors = {col1:r=>r.name.toLowerCase(), col2:r=>r.parentName.toLowerCase()};
      const rows = sortRows(resources, 'resources', resAccessors).map(r=>`<tr class="${selected[r.id]?'selected':''}">
          <td>${canRemove?checkboxHtml(!!selected[r.id], `toggleResource('${r.id}')`):''}</td>
          <td class="cell-double"><div class="l1">${esc(r.name)}</div><div class="l2">${esc(r.subId)}</div></td>
          <td class="cell-double"><div class="l1">${esc(r.parentName)}</div><div class="l2">${esc(r.parentId)}</div></td>
          <td><button class="btn-icon ${r.canRemove&&canRemove?'danger':''}" ${!(r.canRemove&&canRemove)?'disabled':''} onclick="openUnlinkDialog('${group.id}','${state.cloud}',['${r.id}'])" title="Unlink Resource"><span class="material-symbols-outlined">link_off</span></button></td>
        </tr>`).join('');
      tableBlock = `<div class="table-wrap"><table><colgroup><col style="width:48px"><col style="width:42%"><col><col style="width:80px"></colgroup><thead><tr><th></th>${sortHeader(CLOUD_META[state.cloud].col1,'resources','col1')}${sortHeader(CLOUD_META[state.cloud].col2,'resources','col2')}<th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    return `<div class="pill-tabs">${Object.keys(CLOUD_META).map(c=>`<button class="pill-tab ${c===state.cloud?'active':''}" onclick="state.cloud='${c}';render()"><span class="csp-dot" style="background:${CLOUD_META[c].dot}"></span>${CLOUD_META[c].label}</button>`).join('')}</div>
      <div class="res-toolbar">
        <div class="search-box"><span class="material-symbols-outlined">search</span><input placeholder="Search resources" oninput="showToast('Filtering… (prototype does not filter mock data)')"></div>
        <div class="res-toolbar-actions">
          ${(canRemove && selectedIds.length)?`<button class="btn btn-out danger" onclick="openUnlinkDialog('${group.id}','${state.cloud}',[${selectedIds.map(id=>"'"+id+"'").join(',')}])"><span class="material-symbols-outlined">link_off</span>Unlink Resource</button>`:''}
          ${canAssign?`<button class="btn btn-pri" data-testid="assign-resource-button" onclick="openAssign('${state.cloud}')"><span class="material-symbols-outlined">add_link</span>Assign Resource</button>`:''}
        </div>
      </div>
      ${tableBlock}`;
  };
  return `<p class="section-copy" style="margin-bottom:16px">You can assign cloud resources to this group here.</p>${body()}`;
}

function renderDetail(){
  const isT2 = state.tier===2;
  const t1 = findT1(state.t1Id);
  const group = isT2 ? findT2(state.t1Id, state.t2Id) : t1;
  if(!group){ state.view='list'; return renderList(); }
  const backHref = isT2 && state.role==='t2-member' ? null : null; // both roles route back to list in this prototype scope
  const crumb = isT2 ? `${ORG_NAME} / ${t1.name}` : `${ORG_NAME} /`;
  let body;
  if(state.tab==='group-members') body = membersTab(group);
  else if(state.tab==='resources') body = resourcesTab(group);
  else body = groupsSubTab();
  function groupsSubTab(){
    const list = tier2GroupsFor(t1);
    return groupTable(list, {showTier2:false, editable:actions().editGroup, tier:2, resourceCenter:true, t1IdForRow:t1.id, sortTable:'tier2'});
  }
  return `<button class="go-back" onclick="backToList()"><span class="material-symbols-outlined">arrow_back</span><span class="go-back-label">Back to Group List</span></button>
    <div class="card">
      <div class="crumb">${esc(crumb)}</div>
      <div class="section-head" style="align-items:center;margin-bottom:20px">
        <h1 style="font-size:24px;font-weight:700;margin:0">${esc(group.name)}</h1>
        <div style="display:flex;gap:8px">
          ${actions().editGroup?`<button class="btn btn-out" onclick="deferredAction('Edit Group')"><span class="material-symbols-outlined">edit</span>Edit Group</button>`:''}
          ${actions().removeGroup?`<button class="btn btn-out danger" onclick="deferredAction('Remove Group')"><span class="material-symbols-outlined">delete</span>Remove Group</button>`:''}
        </div>
      </div>
      ${tabsHeader(group, isT2?2:1)}
      ${state.tab==='tier-2-groups' ? `<div class="section-head">
        <div>
          <h2>Tier 2 Group List (${t1.tier2})</h2>
          <p>You can quickly view the Tier 2 group information here, and click on each group to check details such as group members.</p>
        </div>
        ${actions().createGroup?`<button class="btn btn-pri" onclick="deferredAction('Create Group')"><span class="material-symbols-outlined">add</span>Create Group</button>`:''}
      </div>` : ''}
      ${body}
    </div>`;
}
function toggleResource(id){
  if(!state.selectedResources[state.cloud]) state.selectedResources[state.cloud]={};
  const bucket = state.selectedResources[state.cloud];
  bucket[id] = !bucket[id];
  render();
}


/* ============================================================
 * Assign Resource — folder tree picker
 * 骨架採「資料夾 → 專案」，帳單帳戶降級成篩選器（見
 * specs/2026-09-03-group-list-folder-view-ux-response.md 第一節）。
 * 走「帳單帳戶 → 資料夾 → 專案」的話，橫跨兩個 BA 的資料夾會因此
 * 出現兩次，使用者勾一個會以為選完、實際只拿到一半。
 * ============================================================ */
const assign = {
  open:false,
  cloud:'gcp',         // gcp | aws | azure，決定名詞與資料來源
  /* component = 完全照 libs/lumiture-ui 的 GroupedMultiSelect（Cost Dashboard
   *             的 Tag / Label Value 下拉）語言，直接延伸到多層
   * component-fix = 同上，只改兩個數字：縮排步進 32→16、箭頭從右移到左。
   *             其餘（藍底 band、單行 name (id)、無引導線、無資料夾 icon、
   *             不 sticky）完全不動，對現有九個消費端影響最小
   * tree      = 我原本做的樹狀版（左側箭頭、縮排引導線、巢狀 sticky）
   * 放兩套是為了讓 Kabin 實際感受「既有元件延伸到多層」會遇到什麼，
   * 而不是只讀我的文字分析。Demo FAB 可即時切換。 */
  pickerStyle:'component-fix',   // 2026-09-10 Kabin 定案走這個版本
  hasFolders:true,     // org 完全沒開資料夾時退回現行的 BA → Project 兩層
  loading:false,
  expanded:{},
  selected:{},
  search:'',
  groupBy:'ba',       // ba | folder —— 預設維持現行的帳單帳戶視角，Folder 是新增的選項。
                      // 選取單位是專案、分組只是呈現，所以切換不會弄丟已勾的東西
};
let assignSearchTimer;

/* ⚠️ 這個彈窗只列「尚未被指派的資源」，依設計稿註記
 * （Figma 11735:168385「僅顯示『尚未被 assign 的資源』」）。
 * 移除是另一條路：Resources 表格批次勾選 → [Unlink Resource] → 彈窗 #20
 * （Figma 12801:76215），T1 還會先跑 group-check 列出受影響的 T2 群組。
 * 所以這裡沒有取消指派，也不該有。
 *
 * 實作上有一個必須注意的點：PUT platforms/{platform}/resources/assign
 * 是「覆寫整份清單」不是「追加」——
 *   - backend/api/user.md R5：Cleans existing resource perms, then assigns new
 *     ones. For tier-one groups, also cleans removed resources from child
 *     tier-two groups
 *   - domain/identity/organization.md（Resource Assignment Flow）：
 *     PUT assign - replaces full assignment set
 * 所以畫面只顯示未指派的、送出時必須帶上「已指派的 + 這次勾的」。
 * 只送這次勾的會把群組原本的資源全部洗掉，T1 還連帶清掉子 T2。
 *
 * ⚠️ 現況 FE 兩件事都沒做：GCPAssignResourcesContent 完全沒讀 assigned
 * （所以沒過濾、也沒辦法在送出時補上既有的），GCPAssignResources 每次
 * 開啟都是 useState([])。詳見 specs 的 §8.11。 */

function openAssign(cloud){
  assign.cloud = cloud || state.cloud || 'gcp';
  assign.open = true;
  assign.loading = true;
  /* 照設計稿：預設收合，先看到第一層資料夾，展開才往下看。 */
  assign.expanded = {};
  assign.selected = {};
  assign.forceFail = false;
  assign.search = '';
  /* 預設維持現行的帳單帳戶視角（既有客戶操作不變），資料夾是切過去的第二個視角。 */
  assign.groupBy = 'ba';
  renderAssign();
  setTimeout(()=>{ assign.loading = false; renderAssign(); }, 500);
}
function closeAssign(){ assign.open = false; renderAssign(); }

/* 帳單帳戶篩選只縮小「看得到的專案」，不改變樹的骨架 */
function projectVisible(project){
  if(project.assigned) return false;   // 已指派的不進這個選單（設計稿註記）
  if(!assign.search) return true;
  const term = assign.search.toLowerCase();
  /* 搜尋範圍 = 畫面上看得到的東西。專案列有 name、ID，資料夾視角還在右邊掛了
   * 帳單帳戶 chip，所以帳單帳戶名稱也要能搜到，不然使用者看著 chip 上的字
   * 打進去卻搜不到。 */
  return projectLabel(project).toLowerCase().includes(term)
    || project.resId.toLowerCase().includes(term)
    || project.parent.name.toLowerCase().includes(term);
}
function folderMatches(node){
  return assign.search && node.name.toLowerCase().includes(assign.search.toLowerCase());
}
/* 資料夾自己命中搜尋時，底下的專案整批留著，不然搜到資料夾卻看不到內容 */
function visibleProjectsOf(node, inheritedMatch){
  const keepAll = inheritedMatch || folderMatches(node);
  const own = node.projects.filter(project => keepAll ? inFolderScope(project) : projectVisible(project));
  let total = own.length;
  node.children.forEach(child=>{ total += visibleProjectsOf(child, keepAll).length; });
  return keepAll ? allProjectsOf(node).filter(inFolderScope) : (function(){
    let acc = own.slice();
    node.children.forEach(child=>{ acc = acc.concat(visibleProjectsOf(child, false)); });
    return acc;
  })();
}
function nodeHasVisible(node){ return visibleProjectsOf(node, false).length > 0 || folderMatches(node); }

/* 這個選單的可選範圍：未指派 + 通過帳單帳戶篩選 */
function inFolderScope(project){ return !project.assigned; }
function selectedIn(projects){ return projects.filter(project=>assign.selected[project.id]).length; }
/* Demo 用：三種指派狀態。mixed = mock 原始值（當初指派過、之後 GCP 又長出新專案）， 
 * none = 第一次指派（全部可選），all = 全部都指派過（提示不出現） */
let ASSIGNED_SNAPSHOT = null;
function setAssignedMode(mode){
  const projects = everyProject();
  if(!ASSIGNED_SNAPSHOT) ASSIGNED_SNAPSHOT = new Map(projects.map(project=>[project.id, project.assigned]));
  projects.forEach(project=>{
    project.assigned = mode==='none' ? false : mode==='all' ? true : ASSIGNED_SNAPSHOT.get(project.id);
  });
  assign.selected = {};
}
function everyUnassigned(){ return everyProject().filter(project=>!project.assigned); }
/* 父層勾選框「全選」跟畫面上實際看得到的列，之前是兩個不同的集合：
 * 顯示用 visibleProjectsOf()（有搜尋時只算搜到的），但點擊全選卻是
 * selectableOf()（不管有沒有搜尋，永遠是整個資料夾底下全部）。
 * 後果：搜尋只篩出 1 個子項目時，勾這個資料夾的全選會連同畫面上看不到
 * 的其他 N 個一起選走，「16 個裡勾了 14 個」這種結果就是這樣來的。
 * 修法：全選的範圍一律用 visibleProjectsOf()，跟畫面上排出來的列一致。
 * 沒有搜尋時 visibleProjectsOf(node,false) 就等於原本 selectableOf(node)，
 * 行為不變。 */
function toggleFolder(nodeId){
  const node = findFolder(nodeId);
  if(!node) return;
  toggleScope(visibleProjectsOf(node, false));
}
function toggleProject(projectId){
  if(assign.selected[projectId]) delete assign.selected[projectId]; else assign.selected[projectId]=true;
  renderAssign();
}
/* 父層勾選框：全開就全關、否則全開 */
function toggleScope(projects){
  const allOn = projects.length>0 && projects.every(project=>assign.selected[project.id]);
  projects.forEach(project=>{ if(allOn) delete assign.selected[project.id]; else assign.selected[project.id]=true; });
  renderAssign();
}
function toggleExpand(nodeId){ assign.expanded[nodeId] = !assign.expanded[nodeId]; renderAssign(); }
function findFolder(nodeId){
  let found = null;
  walkFolders(FOLDER_TREE, node=>{ if(node.id===nodeId) found = node; });
  return found;
}
function onAssignSearch(value){
  clearTimeout(assignSearchTimer);
  /* 對齊 FE ResourcesSearch 的 500ms debounce */
  assignSearchTimer = setTimeout(()=>{ assign.search = value.trim(); renderAssign(); }, 500);
}
/* 切換分組不動 assign.selected，因為選取的是專案本身，跟怎麼分組無關 */
function setGroupBy(mode){ assign.groupBy = mode; assign.expanded = {}; renderAssign(); }

function hl(text){
  if(!assign.search) return esc(text);
  const term = assign.search;
  const at = text.toLowerCase().indexOf(term.toLowerCase());
  if(at < 0) return esc(text);
  return esc(text.slice(0,at)) + '<span class="hl">' + esc(text.slice(at, at+term.length)) + '</span>' + esc(text.slice(at+term.length));
}
/* Guideline #Checkbox 的 span 版元件，不是 input——mixed 狀態原本要靠 JS 補設
 * input.indeterminate（HTML 屬性沒有這個狀態），改成純 class 之後不用再補這一步。
 * 用 role="checkbox" + tabindex + Enter/Space 補鍵盤操作，原生 input 這些是免費的。 */
function checkboxHtml(checked, onclick, mixed, disabled){
  const state = disabled ? 'is-disabled' : (mixed ? 'is-mixed' : (checked ? 'is-checked' : ''));
  const act = disabled ? '' : `event.stopPropagation();${onclick}`;
  return `<span class="checkbox ${state}" role="checkbox" aria-checked="${mixed?'mixed':!!checked}" aria-disabled="${!!disabled}" tabindex="${disabled?-1:0}" onclick="${act}" onkeydown="if((event.key===' '||event.key==='Enter')&&!${!!disabled}){event.preventDefault();${act}}">
    <span class="checkbox__box"><span class="material-symbols-outlined checkbox__icon">${mixed?'remove':'check'}</span></span>
  </span>`;
}
/* GCP 允許 10 層。樹狀版把步進縮小讓縮排一路撐到底：16px × 10 層 = 160px，
 * 660px 的彈窗放得下、階層全程看得見。
 * 元件版則忠實沿用 GroupedMultiSelectOptionItem 寫死的 `pl:'32px'`——那個值
 * 是為「只有一層子項」設計的，延伸到多層時 32px × 10 = 320px，會吃掉半個
 * 彈窗寬度。這個差異刻意保留，因為它正是「既有元件能不能直接長高」的關鍵。 */
const INDENT_STEP_TREE = 16;
const INDENT_STEP_COMPONENT = 32;   // = GroupedMultiSelectOptionItem 的 pl:'32px'
function isComponentStyle(){ return assign.pickerStyle.startsWith('component'); }
function isComponentFixed(){ return assign.pickerStyle === 'component-fix'; }
function indentStep(){
  return (isComponentStyle() && !isComponentFixed()) ? INDENT_STEP_COMPONENT : INDENT_STEP_TREE;
}
const FOLDER_ROW_H = 40;   // sticky 疊放的 offset 要跟資料夾列高一致
const SELECT_ALL_H = 40;   // 頂端 Select All 那列也是 sticky，資料夾要釘在它下面
/* 資料夾列釘住的位置。之前只算 depth*40，忘記頂端還有一列 sticky 的
 * Select All（z-index 40）壓在上面，所以第 0 層資料夾其實是釘在它底下、
 * 看不到——這是我加 Select All 那輪造成的 regression，樹狀版也一樣中。
 * component-fix 只釘第 0 層（不做巢狀），所以固定就是 Select All 的下緣。 */
function folderStickyTop(depth){
  return isComponentFixed() ? SELECT_ALL_H : SELECT_ALL_H + depth * FOLDER_ROW_H;
}
function indentPx(depth){ return 24 + depth * indentStep(); }
function railsHtml(depth){
  if(isComponentStyle()) return '';   // 既有元件沒有縮排引導線
  let out = '';
  for(let level=0; level<depth; level++){ out += `<span class="trail" style="left:${32 + level*INDENT_STEP_TREE}px"></span>`; }
  return out;
}
function projectRow(project, depth){
  /* 元件版：GroupedMultiSelectOptionItem 是單行 `name (desc)`，desc 用 hint 色，
   * 所以資源 ID 走 desc 的位置、跟名稱同一行（元件的 row height 是固定 40px，
   * 容不下兩行）。樹狀版維持兩行 Name / ID，對齊 Resources 表格的既有慣例。 */
  const label = `<span class="tname ${project.name?'':'is-nocost'}">${hl(projectLabel(project))}</span>`;
  const body = isComponentStyle()
    ? `${label}<span class="tdesc">(${hl(project.resId)})</span>`
    : `${label}<span class="tsub">${hl(project.resId)}</span>`;
  return `<div class="tnode is-project" style="padding-left:${indentPx(depth)}px" onclick="toggleProject('${project.id}')">${railsHtml(depth)}
    <span class="tchev ghost"></span>
    ${checkboxHtml(!!assign.selected[project.id], `toggleProject('${project.id}')`)}
    <span class="material-symbols-outlined ticon ghost">folder</span>
    <div class="tlabel">${body}</div>
    ${(showFolderView() && !project.parent.none)?`<span class="ba-chip">${esc(project.parent.name)}</span>`:''}
  </div>`;
}
function folderRow(node, depth){
  /* 選單只列未指派的，所以計數也只能算未指派的，
   * 不然「platform (24)」底下只掛 3 列，數字跟看到的東西對不起來 */
  const unassigned = allProjectsOf(node).filter(project=>!project.assigned);
  /* 這裡的「全選範圍」要跟畫面上實際排出來的列一致，包含帳單帳戶篩選
   * 跟搜尋兩種情況——用 visibleProjectsOf() 而不是不看搜尋的 selectableOf() */
  const selectable = visibleProjectsOf(node, false);
  const picked = selectedIn(selectable);
  const isAll = selectable.length>0 && picked===selectable.length;
  const isSome = picked>0 && !isAll;
  /* 篩選（帳單帳戶或搜尋）讓資料夾只剩一部分時要講出來，不然使用者以為專案不見了 */
  const countText = selectable.length === unassigned.length
    ? `(${unassigned.length})`
    : `(${selectable.length} / ${unassigned.length})`;
  const expanded = !!assign.expanded[node.id] || !!assign.search;
  const kids = expanded ? (
      node.children.filter(nodeHasVisible).map(child=>folderRow(child, depth+1)).join('') +
      /* 資料夾自己命中搜尋時整批留著底下的專案，但「已指派的不進這個選單」這條
       * 規則不能跟著放掉——原本這裡只檢查帳單帳戶篩選，導致搜資料夾名稱時
       * 已指派的專案會冒出來，跟旁邊的計數對不起來。用 inFolderScope 一起擋掉。 */
      node.projects.filter(project => folderMatches(node) ? inFolderScope(project) : projectVisible(project)).map(project=>projectRow(project, depth+1)).join('')
    ) : '';
  return `<div class="tbranch">
      <div class="tnode is-folder" data-depth="${depth}" style="padding-left:${indentPx(depth)}px;top:${folderStickyTop(depth)}px;z-index:${30-depth}"${node.folderId?` title="Folder ID: ${esc(node.folderId)}"`:''} onclick="toggleExpand('${node.id}')">${railsHtml(depth)}
        <button class="tchev" onclick="event.stopPropagation();toggleExpand('${node.id}')" aria-label="${expanded?'Collapse':'Expand'}"><span class="material-symbols-outlined">${expanded?'expand_more':'chevron_right'}</span></button>
        ${checkboxHtml(isAll, `toggleFolder('${node.id}')`, isSome)}
        <span class="material-symbols-outlined ticon">folder</span>
        <div class="tlabel"><span class="tname">${hl(node.name)} <span class="tcount ${selectable.length!==unassigned.length?'partial':''}">${countText}</span></span></div>
      </div>${kids}
    </div>`;
}
function unassignedRow(){
  const inFilter = cfg().noFolder().filter(inFolderScope);   // 分母，不受搜尋影響
  const visible = inFilter.filter(projectVisible);              // 目前搜尋下真的看得到、選得到的
  if(assign.search && !visible.length) return '';
  /* 全選範圍跟折疊資料夾同一顆問題：要用 visible（搜尋後的）不是 inFilter
   * （沒管搜尋的），不然全選會連畫面上沒列出來的也一起選走 */
  const picked = selectedIn(visible);
  const isAll = visible.length>0 && picked===visible.length;
  const isSome = picked>0 && !isAll;
  const countText = visible.length===inFilter.length ? `(${inFilter.length})` : `(${visible.length} / ${inFilter.length})`;
  const expanded = !!assign.expanded['unassigned'] || !!assign.search;
  const kids = expanded ? visible.map(project=>projectRow(project,1)).join('') : '';
  return `<div class="tbranch">
      <div class="tnode is-folder is-unassigned" style="padding-left:24px;top:${folderStickyTop(0)}px;z-index:30" onclick="toggleExpand('unassigned')">
        <button class="tchev" onclick="event.stopPropagation();toggleExpand('unassigned')"><span class="material-symbols-outlined">${expanded?'expand_more':'chevron_right'}</span></button>
        ${checkboxHtml(isAll, `toggleUnassigned()`, isSome)}
        <span class="material-symbols-outlined ticon">folder_off</span>
        <div class="tlabel"><span class="tname">No folder <span class="tcount ${visible.length!==inFilter.length?'partial':''}">${countText}</span></span>
        <span class="tsub">Projects sitting directly under ${ORG_DOMAIN}</span></div>
      </div>${kids}
    </div>`;
}
function unassignedInFilter(){ return cfg().noFolder().filter(inFolderScope).filter(projectVisible); }
function toggleUnassigned(){ toggleScope(unassignedInFilter()); }

/* 設計稿 #18-1：沒有帳單帳戶的專案統一排在清單最底部，標頭寫
 * 「Projects without Billing Account」。兩個視角都出現在最後一列，
 * 因為它既歸不到帳單帳戶、也不該混進資料夾的階層裡。 */
function noBaInFilter(){ return cfg().orphans().filter(inFolderScope).filter(projectVisible); }
function toggleNoBa(){ toggleScope(noBaInFilter()); }
function noBaRow(){
  const inScope = cfg().orphans().filter(inFolderScope);
  const visible = noBaInFilter();
  if(!inScope.length) return '';
  if(assign.search && !visible.length) return '';
  const picked = selectedIn(visible);
  const isAll = visible.length>0 && picked===visible.length;
  const isSome = picked>0 && !isAll;
  const countText = visible.length===inScope.length ? `(${inScope.length})` : `(${visible.length} / ${inScope.length})`;
  const expanded = !!assign.expanded['no-ba'] || !!assign.search;
  const kids = expanded ? visible.map(project=>projectRow(project,1)).join('') : '';
  return `<div class="tbranch">
      <div class="tnode is-folder is-unassigned" style="padding-left:24px;top:${folderStickyTop(0)}px;z-index:30" onclick="toggleExpand('no-ba')">
        <button class="tchev" onclick="event.stopPropagation();toggleExpand('no-ba')" aria-label="${expanded?'Collapse':'Expand'}"><span class="material-symbols-outlined">${expanded?'expand_more':'chevron_right'}</span></button>
        ${checkboxHtml(isAll, `toggleNoBa()`, isSome)}
        <span class="material-symbols-outlined ticon">money_off</span>
        <div class="tlabel"><span class="tname">Projects without Billing Account <span class="tcount ${visible.length!==inScope.length?'partial':''}">${countText}</span></span></div>
      </div>${kids}
    </div>`;
}

/* 設計稿 #18-1 要求的 Select All。範圍＝目前視角下真正列出來的所有可選專案，
 * 跟父層全選同一條規則（有搜尋時只算搜到的）。 */
function allVisibleSelectable(){
  const seen = new Set();
  const out = [];
  const push = list => list.forEach(project=>{ if(!seen.has(project.id)){ seen.add(project.id); out.push(project); } });
  if(!assign.hasFolders || assign.groupBy === 'ba'){
    cfg().groups().forEach(group=>push(baProjects(group.id)));
  } else {
    cfg().folders().forEach(node=>push(visibleProjectsOf(node, false)));
    push(unassignedInFilter());
  }
  push(noBaInFilter());
  return out;
}
function toggleSelectAll(){ toggleScope(allVisibleSelectable()); }
function selectAllRow(){
  const scope = allVisibleSelectable();
  if(!scope.length) return '';
  const picked = selectedIn(scope);
  const isAll = picked===scope.length;
  const isSome = picked>0 && !isAll;
  return `<div class="tnode is-selectall">
      <span class="tchev ghost"></span>
      ${checkboxHtml(isAll, `toggleSelectAll()`, isSome)}
      <span class="material-symbols-outlined ticon ghost">folder</span>
      <div class="tlabel"><span class="tname">Select all <span class="tcount">(${scope.length})</span></span></div>
    </div>`;
}

/* org 一個資料夾都沒開時，樹會退化成一個裝了 92 個專案的「No folder」節點，
 * 比現在的平鋪還難用。所以沒有資料夾就維持現行的 BA → Project 兩層。 */
function flatBaTree(){
  return cfg().groups().map(group=>{
    const all = everyUnassigned().filter(project=>project.parent.id===group.id);
    const projects = baProjects(group.id);
    if(!projects.length) return '';
    const expanded = !!assign.expanded[group.id] || !!assign.search;
    const picked = selectedIn(projects);
    const isAll = projects.length>0 && picked===projects.length;
    const isSome = picked>0 && !isAll;
    const countText = projects.length===all.length ? `(${all.length})` : `(${projects.length} / ${all.length})`;
    return `<div class="tbranch">
        <div class="tnode is-folder" data-depth="0" style="padding-left:24px;top:${folderStickyTop(0)}px;z-index:30" onclick="toggleExpand('${group.id}')">
          <button class="tchev" onclick="event.stopPropagation();toggleExpand('${group.id}')"><span class="material-symbols-outlined">${expanded?'expand_more':'chevron_right'}</span></button>
          ${checkboxHtml(isAll, `toggleBa('${group.id}')`, isSome)}
          <span class="material-symbols-outlined ticon">${cfg().parentIcon}</span>
          <div class="tlabel"><span class="tname">${hl(group.name)} <span class="tcount ${projects.length!==all.length?'partial':''}">${countText}</span></span></div>
        </div>${expanded ? projects.map(project=>projectRow(project,1)).join('') : ''}
      </div>`;
  }).join('');
}
/* 帳單帳戶自己的名字也算搜尋命中，命中就整批留著底下的專案——跟資料夾視角的
 * folderMatches() 同一套規則，不然搜「corp-main」會搜不到任何東西（因為之前
 * 只比對專案的 name / ID）。 */
/* placeholder 要講出這個視角實際搜得到什麼。原本固定寫「folders or projects」，
 * 但在帳單帳戶視角裡沒有資料夾這個東西，而帳單帳戶名稱其實搜得到卻沒被提到。 */
function searchPlaceholder(){
  /* placeholder 要把這個視角實際搜得到的東西講完。資料夾視角三種都搜得到
   * （資料夾名稱、上層名稱、資源 name / ID）；上層分組的視角沒有資料夾列，
   * 搜資料夾名稱會出現「不知道為什麼命中」的結果，所以那個視角只講兩種。 */
  const c = cfg();
  if(c.searchHint) return `Search ${c.searchHint}`;
  const parent = c.parentLabel.toLowerCase() + 's';
  if(!showFolderView()) return `Search ${parent} or ${c.nounPlural}`;
  /* 搜尋跟 Group by 併一行之後，搜尋框的文字區只有 234px。實測
   * `Search folders, billing accounts, or projects` 要 300px、
   * 拿掉 billing 之後 238px 還是差 8px，所以連 or 一起省掉（221px）。
   * 三個可搜尋的東西都還在，placeholder 用頓列不接連接詞也是常見寫法。 */
  return `Search folders, ${c.parentShort || parent}, ${c.nounPlural}`;
}
function baMatches(ba){
  return !!assign.search && ba.name.toLowerCase().includes(assign.search.toLowerCase());
}
/* 這同時是「畫面上排哪些列」跟「全選會選走哪些」的唯一來源，兩邊共用一個
 * 函式就不會再出現「看到 1 個卻選走 14 個」那種對不起來的情況。 */
function baProjects(baId){
  const ba = cfg().groups().find(item=>item.id===baId);
  const keepAll = !!ba && baMatches(ba);
  return everyProject()
    .filter(project=>project.parent.id===baId)
    .filter(project=>keepAll ? inFolderScope(project) : projectVisible(project));
}
function toggleBa(baId){ toggleScope(baProjects(baId)); }

function renderAssign(){
  const root = document.getElementById('assign-root');
  if(!assign.open){ root.innerHTML=''; return; }
  const assignable = everyUnassigned().length;
  const picked = Object.keys(assign.selected).length;

  let body;
  if(assign.loading){
    body = `<div class="tskel">${Array.from({length:7}).map(()=>'<div class="skel"></div>').join('')}</div>`;
  } else if(!everyUnassigned().length){
    /* 全部都指派過就沒東西可加了。這裡刻意不用 No Data 那種語彙——
     * 這不是出錯，是這個群組已經設定完了，而且要移除的話得去表格。 */
    body = `<div class="tempty"><span class="material-symbols-outlined tempty-icon is-success">check_circle</span>
      <div class="tempty-title">Everything is already assigned</div>
      <div>All authorized ${esc(cfg().cloudLabel)} resources are assigned to this group. To remove one, select it in the Resources table and use Unlink Resource.</div></div>`;
  } else if(cfg().supportsFolders && assign.groupBy==='folder' && !assign.hasFolders){
    /* 使用者主動點了 Folder 分頁，這個 org 才真的沒有資料夾可看。跟
     * cloud pill tabs 的 not-authorized 空狀態同一個視覺語言（icon +
     * 標題 + 說明），不是常駐警語。 */
    body = `<div class="tempty"><span class="material-symbols-outlined tempty-icon">folder_off</span>
      <div class="tempty-title">No folders in this organization</div>
      <div>Projects here aren't organized into folders. Switch to ${esc(cfg().parentLabel)} to browse and assign resources.</div></div>`;
  } else if(!showFolderView()){
    const tree = flatBaTree() + noBaRow();
    body = tree ? selectAllRow() + tree : `<div class="tempty">No resources match your search.</div>`;
  } else {
    const tree = cfg().folders().filter(nodeHasVisible).map(node=>folderRow(node,0)).join('') + unassignedRow() + noBaRow();
    body = tree ? selectAllRow() + tree : `<div class="tempty">No resources match your search.</div>`;
  }

  /* 原本這段banner 塞了 4-5 句話（分組規則 + 只列未指派 + 去哪移除 + 新資源要重開），
   * Kabin 反饋太長。砍到每個模式只留「這個模式特有的一句」，
   * 「只列未指派 / 去哪移除」兩句所有模式共用，只講一次。
   * 「新增的資源要重開才看得到」這句拿掉——「只列未指派」已經隱含這件事，
   * 不需要再展開講一次重開的機制。 */
  /* 原本這裡有一塊藍底常駐說明，收掉了（Kabin 2026-09-09 決定）。三件事
   * 各自歸位：「只列未指派」→ 底部計數的 unassigned 這個字、視角行為 →
   * Group by 的 info tooltip、「要移除去表格 Unlink」→ 空狀態已經有。
   *
   * 「這個 org 沒有資料夾」原本也走常駐 caption，2026-09-10 改掉：Kabin
   * 指出這件事該比照本檔 resourcesTab() 的雲端 pill tabs 做——tab 永遠
   * 顯示，沒資料的那個點下去才出現空狀態，不要預先把選項藏起來再用文字
   * 解釋為什麼看不到。所以 Group by 的 Folder 分頁永遠在，這個 org 真的
   * 沒有資料夾時，點進 Folder 才在 rmodal-body 出現對應空狀態
   * （見下方 assign.groupBy==='folder' && !assign.hasFolders 分支）。 */

  root.innerHTML = `<div class="rmodal-backdrop" onclick="if(event.target===this)closeAssign()">
    <div class="rmodal" role="dialog" aria-label="Assign Resource">
      <div class="rmodal-head">
        <div>
          <h3>Assign Resource: ${esc(cfg().cloudLabel)}</h3>
          <p>Select the ${esc(cfg().cloudLabel)} resources you want to assign to this group.</p>
        </div>
        <button class="rmodal-close" onclick="closeAssign()" aria-label="Close"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="rmodal-tools">
        <div class="search-box"><span class="material-symbols-outlined">search</span><input placeholder="${searchPlaceholder()}" value="${esc(assign.search)}" oninput="onAssignSearch(this.value)"></div>
        ${showGroupByToggle() ? `<div class="groupby-toggle">
          <span class="lbl">Group by</span>
          <span class="material-symbols-outlined gb-info" title="${esc(GROUPBY_HELP)}">info</span>
          <div class="pill-tabs">
            <button class="pill-tab ${assign.groupBy==='ba'?'active':''}" onclick="setGroupBy('ba')"><span class="material-symbols-outlined" style="font-size:16px">${cfg().parentIcon}</span>${esc(cfg().parentLabel)}</button>
            <button class="pill-tab ${assign.groupBy==='folder'?'active':''}" onclick="setGroupBy('folder')"><span class="material-symbols-outlined" style="font-size:16px">folder</span>Folder</button>
          </div>
        </div>` : ''}
      </div>
      <div class="rmodal-body ${isComponentStyle()?'is-component':'is-tree'}${isComponentFixed()?' is-component-fixed':''}">${body}</div>
      <div class="rmodal-foot">
        <span class="rmodal-count">${assignable?`<b>${picked}</b> of ${assignable} unassigned ${assignable===1?cfg().noun:cfg().nounPlural} selected`:''}</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-out" onclick="closeAssign()">Cancel</button>
          <button class="btn btn-pri" ${picked?'':'disabled'} onclick="confirmAssign()">Assign</button>
        </div>
      </div>
    </div>
  </div>`;
}
/* Demo 用：把樹換成 7 層深的合成結構並整條展開 */

/* 文案照設計稿 #18-3（11735:168501）。註記：成功與失敗都是關閉彈窗 + 左下角

/* 這兩個數字改用算的，不寫死。之前 mock 加了「沒有帳單帳戶的專案」跟深樹之後，

const DEMO_TOTAL = everyProject().length;
const DEMO_DRIFT = [...ASSIGNED_SNAPSHOT.values()].filter(assigned=>!assigned).length;

  }
  if (['set','loading','empty','nodata'].includes(id)) { state.pageState = id; render(); return; }
  if (id === 'cloud-all')      { state.cloudAuth = 'all';      render(); return; }
  if (id === 'cloud-gcp-only') { state.cloudAuth = 'gcp-only'; render(); return; }

  if (id === 'assign-folder')  { assign.hasFolders = true;  openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'assign-nofld')   { assign.hasFolders = false; openAssign('gcp'); return; }
  if (id === 'assign-deep')    { showDeepTree(); return; }
  if (id === 'style-component'){ assign.pickerStyle='component'; if(!assign.open){ openAssign('gcp'); setGroupBy('folder'); } else renderAssign(); return; }
  if (id === 'style-component-fix'){ assign.pickerStyle='component-fix'; if(!assign.open){ openAssign('gcp'); setGroupBy('folder'); } else renderAssign(); return; }
  if (id === 'style-tree')     { assign.pickerStyle='tree';      if(!assign.open){ openAssign('gcp'); setGroupBy('folder'); } else renderAssign(); return; }
  if (id === 'assign-first')   { setAssignedMode('none');  assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'assign-drift')   { setAssignedMode('mixed'); assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'assign-synced')  { setAssignedMode('all');   assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'assign-fail')    { setAssignedMode('mixed'); assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); assign.forceFail = true; return; }

<script>
/* === Inlined: shared/demo-fab.js === */
/*!
 * demo-fab.js — Lumiture Designer Demo Scenarios (Shared Module v2)
 *
 * Auto-injects:
 *   - .demo-fab (FAB button, bottom-left)
 *   - .demo-popover (480px tall × 390px wide popover)
 *   - #gl-tip (body-level fixed tooltip — required for demo button hover tips)
 *
 * Required globals:
 *   window.DEMO_SCENARIOS = [...]   — scenario list
 *   window.DEMO_APPLY     = fn      — called with (id, btn) when scenario clicked
 *
 * Optional globals:
 *   window.DEMO_PAGES = [{id, label, icon}]      — page tabs (top row, pill style)
 *   window.DEMO_CATEGORIES = [{id, label, icon, hint}]  — category tabs (underline style)
 *   window.DEMO_DEFAULT = 'scenario-id'           — initial active scenario
 *
 * Rendering modes (auto-detected):
 *   1. No pages, no categories → flat list of buttons
 *   2. Pages only (LumiTag pattern) → underline tabs at top, scenarios filtered by page
 *   3. Categories only (single-page Cost Dashboard pattern) → underline tabs, scenarios filtered by category
 *   4. Pages + Categories → two-layer: pill page tabs (top) + underline category tabs (bottom)
 *
 * Scenario schema:
 *   {
 *     id:        string,           // unique
 *     label:     string,
 *     icon:      string,           // Material Symbols name
 *     tip:       string?,          // hover tooltip (rendered via #gl-tip, NOT ::after)
 *     page:      string?,          // matches DEMO_PAGES[].id (alias: 'tab' for backwards compat)
 *     category:  string?,          // matches DEMO_CATEGORIES[].id
 *     isNoData:  boolean?,         // groups under "no data" sub-divider
 *     disabled:  boolean?,         // shows "Soon" badge, not clickable
 *   }
 *
 * Programmatic API:
 *   window.demoFabSwitchTab(pageId)    // switch to a specific page tab (called on navigation)
 *   window._demoFabToggle()            // open/close popover
 *   window._demoFabApply(id, btn)      // apply a scenario (internal)
 */
(function () {
  'use strict';

  // ===== MODULE STATE =====
  var _activePage = null;         // null until first scenario filtered
  var _activeCategory = null;
  var _activeScenario = null;

  // ===== CSS INJECTION =====
  var CSS = [
    /* FAB button */
    '.demo-fab{position:fixed;bottom:18px;left:18px;width:48px;height:48px;border-radius:50%;',
    'background:radial-gradient(circle at 78% 68%,#D9CC4A 0%,rgba(217,204,74,0) 42%),',
    'radial-gradient(circle at 30% 28%,#4D8DDB 0%,rgba(77,141,219,0) 52%),',
    'radial-gradient(circle at 25% 78%,#001A52 0%,rgba(0,26,82,0) 58%),',
    'linear-gradient(135deg,#0D1B3E 0%,#0E3A82 100%);',
    'color:#fff;box-shadow:0 4px 14px rgba(13,27,62,.36);z-index:999;cursor:pointer;',
    'display:flex;align-items:center;justify-content:center;transition:transform .18s,box-shadow .18s;border:0}',
    '.demo-fab:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(13,27,62,.45)}',
    '.demo-fab:active{transform:scale(.96)}',
    '.demo-fab .material-symbols-outlined{font-size:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}',
    '.demo-fab.popped{box-shadow:0 4px 14px rgba(13,27,62,.36),inset 0 2px 6px rgba(0,0,0,.28)}',
    '.demo-fab .demo-pulse{position:absolute;top:5px;right:5px;width:9px;height:9px;background:#FF403D;',
    'border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 0 rgba(255,64,61,.6);animation:demoPulse 1.6s ease-in-out infinite}',
    '@keyframes demoPulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,64,61,.6)}',
    '70%{transform:scale(1.1);box-shadow:0 0 0 8px rgba(255,64,61,0)}',
    '100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,64,61,0)}}',

    /* Popover shell — 全站固定 390 × 480 */
    '.demo-popover{position:fixed;bottom:78px;left:18px;width:390px;height:480px;background:#fff;',
    'border:1px solid rgba(14,58,130,.18);border-radius:12px;box-shadow:0 8px 24px rgba(13,27,62,.16);',
    'z-index:998;padding:0;opacity:0;transform:translateY(8px);pointer-events:none;',

    '.demo-popover.show{opacity:1;transform:translateY(0);pointer-events:auto}',
    '.demo-popover::before{content:\'\';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0;',
    'background:radial-gradient(circle at 78% 50%,#D9CC4A 0%,rgba(217,204,74,0) 32%),',
    'radial-gradient(circle at 30% 50%,#4D8DDB 0%,rgba(77,141,219,0) 42%),',
    'linear-gradient(90deg,#0D1B3E 0%,#0E3A82 100%)}',

    /* Popover header */
    '.demo-popover-hdr{display:flex;align-items:center;justify-content:space-between;',
    'padding:14px 16px 10px;flex-shrink:0}',
    '.demo-popover-title{font-size:12px;font-weight:700;color:#0E3A82;text-transform:uppercase;',
    'letter-spacing:.5px;display:flex;align-items:center;gap:6px}',
    '.demo-popover-close{color:#B0B7C0;cursor:pointer;padding:2px;border-radius:4px;',
    'display:flex;align-items:center;background:none;border:none}',
    '.demo-popover-close:hover{color:#0E3A82;background:rgba(14,58,130,.08)}',

    /* Reset link */
    '.demo-reset-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#676767;',
    'font-weight:500;background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:4px;',
    'font-family:inherit;margin:0 16px 6px}',
    '.demo-reset-link:hover{color:#004FB0;background:#F2FAFF}',
    '.demo-reset-link .material-symbols-outlined{font-size:14px}',

    /* Page tabs (Layer 1 — pill / segmented style，only when both layers exist) */
    '.demo-page-tabs{display:flex;gap:4px;padding:0 16px 8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}',
    '.demo-page-tabs::-webkit-scrollbar{display:none}',
    '.demo-page-tab{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;height:26px;',
    'background:#F2F2F2;color:#676767;border:none;border-radius:13px;font-size:11px;font-weight:600;',
    'font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}',
    '.demo-page-tab:hover{color:#262626;background:#E6E6E6}',
    '.demo-page-tab.active{background:#fff;color:#004FB0;box-shadow:inset 0 0 0 1px #004FB0}',
    '.demo-page-tab .material-symbols-outlined{font-size:13px}',

    /* Category tabs (Layer 2，or single-layer underline mode) */
    '.demo-cat-tabs{display:flex;border-bottom:2px solid #E6E6E6;padding:0 12px;flex-shrink:0;',
    'overflow-x:auto;scrollbar-width:none}',
    '.demo-cat-tabs::-webkit-scrollbar{display:none}',
    '.demo-cat-tab{display:inline-flex;align-items:center;gap:4px;padding:7px 10px;font-size:11px;',
    'font-weight:600;color:#676767;border:none;background:none;border-bottom:2px solid transparent;',
    'margin-bottom:-2px;cursor:pointer;letter-spacing:.3px;transition:all .15s;font-family:inherit;white-space:nowrap}',
    '.demo-cat-tab .material-symbols-outlined{font-size:14px}',
    '.demo-cat-tab:hover{color:#262626}',
    '.demo-cat-tab.active{color:#004FB0;border-bottom-color:#004FB0}',

    /* Hint block (淡藍底 + 左藍邊條) */
    '.demo-pane-hint{font-size:11px;color:#676767;line-height:1.5;margin:0 0 8px;',
    'padding:8px 10px;background:#F2FAFF;border-left:2px solid #004FB0;border-radius:4px}',

    /* Scroll area (flex 1, hidden scrollbar) */
    '.demo-popover-scroll{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;',
    'padding:8px 16px 14px;transition:opacity .12s ease;scrollbar-width:none}',
    '.demo-popover-scroll::-webkit-scrollbar{display:none}',

    /* Sub-separator (no data divider) */
    '.demo-sub-sep{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;',
    'color:#9CAEC4;letter-spacing:.4px;text-transform:uppercase;margin:10px 0 6px}',
    '.demo-sub-sep::before,.demo-sub-sep::after{content:\'\';flex:1;height:1px;background:rgba(14,58,130,.1)}',

    /* Button group */
    '.demo-buttons{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}',

    /* Scenario button */
    '.demo-btn{background:#fff;border:1px solid rgba(14,58,130,.25);color:#0E3A82;',
    'padding:8px 12px;border-radius:8px;font-size:12px;font-weight:500;',
    'display:flex;align-items:center;gap:6px;text-align:left;width:100%;',
    'transition:all .15s;position:relative;cursor:pointer;font-family:inherit}',
    '.demo-btn:hover{background:rgba(14,58,130,.05);border-color:rgba(14,58,130,.5)}',
    '.demo-btn.active{background:radial-gradient(circle at 88% 70%,#D9CC4A 0%,rgba(217,204,74,0) 42%),',
    'radial-gradient(circle at 22% 35%,#4D8DDB 0%,rgba(77,141,219,0) 50%),',
    'linear-gradient(135deg,#0D1B3E 0%,#0E3A82 100%);color:#fff;border-color:transparent;',
    'box-shadow:0 2px 6px rgba(13,27,62,.25)}',
    '.demo-btn .material-symbols-outlined{font-size:16px;flex-shrink:0}',

    /* Disabled button */
    '.demo-btn.demo-dis{opacity:.42;cursor:not-allowed}',
    '.demo-btn.demo-dis:hover{background:#fff!important;border-color:rgba(14,58,130,.25)!important}',
    '.demo-cs{margin-left:auto;font-size:9px;font-weight:700;color:#9CAEC4;',
    'background:rgba(14,58,130,.06);border-radius:3px;padding:1px 5px;letter-spacing:.3px;flex-shrink:0}',

    /* Empty state when no scenarios match current filters */
    '.demo-empty{padding:24px 8px;text-align:center;color:#9CAEC4;font-size:12px;line-height:1.5}',

    /* ⚠️ Suppress any global CSS [data-tip]::after on demo elements.
       Tooltips MUST be handled by #gl-tip (auto-injected below) — pseudo-tooltips
       get clipped by .demo-popover { overflow: hidden }. */
    '.demo-btn[data-tip]::after,.demo-btn[data-tip]::before,',
    '.demo-page-tab[data-tip]::after,.demo-cat-tab[data-tip]::after{display:none!important}',

    /* #gl-tip — body-level fixed tooltip (auto-injected) */
    '#gl-tip{position:fixed;background:#3C3C3C;color:#fff;font-size:12px;line-height:1.4;',
    'padding:6px 10px;border-radius:4px;max-width:320px;white-space:normal;',
    'pointer-events:none;z-index:9999;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25);',
    'font-family:\'Noto Sans\',sans-serif}'
  ].join('');

  var style = document.createElement('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  // ===== HELPERS =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  // Normalise scenario: tab → page (backwards compat)
  function _normalizedScenarios() {
    return (window.DEMO_SCENARIOS || []).map(function (s) {
      return Object.assign({}, s, { page: s.page || s.tab || null });
    });
  }

  // Detect rendering mode based on what's configured
  function _detectMode() {
    var scenarios = _normalizedScenarios();
    var hasPages = (window.DEMO_PAGES && window.DEMO_PAGES.length) ||
                   scenarios.some(function (s) { return !!s.page; });
    var hasCats  = (window.DEMO_CATEGORIES && window.DEMO_CATEGORIES.length) ||
                   scenarios.some(function (s) { return !!s.category; });
    if (hasPages && hasCats) return 'two-layer';
    if (hasPages) return 'pages-only';
    if (hasCats)  return 'categories-only';
    return 'flat';
  }

  // Auto-derive page list if DEMO_PAGES not provided
  function _getPages() {
    if (window.DEMO_PAGES && window.DEMO_PAGES.length) return window.DEMO_PAGES;
    var seen = {};
    var pages = [];
    _normalizedScenarios().forEach(function (s) {
      if (s.page && !seen[s.page]) {
        seen[s.page] = true;
        pages.push({ id: s.page, label: s.page.charAt(0).toUpperCase() + s.page.slice(1), icon: 'tab' });
      }
    });
    return pages;
  }

  function _getCategories() {
    return window.DEMO_CATEGORIES || [];
  }

  // Filter scenarios for current page + category
  function _filterScenarios() {
    var scenarios = _normalizedScenarios();
    return scenarios.filter(function (s) {
      if (_activePage && s.page && s.page !== _activePage) return false;
      if (_activePage && !s.page) return false; // page-tab mode requires scenario to have page
      if (_activeCategory && s.category && s.category !== _activeCategory) return false;
      if (_activeCategory && !s.category) return false; // cat-tab mode requires scenario to have category
      return true;
    });
  }

  // ===== HTML BUILDERS =====
  function _renderButtons(scenarios) {
    if (!scenarios.length) {
      return '<div class="demo-empty">No scenarios in this view.</div>';
    }
    var normal = scenarios.filter(function (s) { return !s.isNoData; });
    var noData = scenarios.filter(function (s) { return s.isNoData; });
    var html = _renderGroup(normal);
    if (noData.length) {
      html += '<div class="demo-sub-sep">no data</div>' + _renderGroup(noData);
    }
    return html;
  }

  function _renderGroup(scenarios) {
    if (!scenarios.length) return '';
    var btns = scenarios.map(function (s) {
      var dis = s.disabled ? ' demo-dis' : '';
      var act = s.id === _activeScenario ? ' active' : '';
      var tip = s.tip ? ' data-tip="' + _esc(s.tip) + '"' : '';
      var cs = s.disabled ? '<span class="demo-cs">Soon</span>' : '';
      return '<button class="demo-btn' + dis + act + '"' + tip +
             ' data-scenario="' + _esc(s.id) + '">' +
             '<span class="material-symbols-outlined">' + _esc(s.icon || 'play_arrow') + '</span>' +
             '<span>' + _esc(s.label) + '</span>' + cs + '</button>';
    }).join('');
    return '<div class="demo-buttons">' + btns + '</div>';
  }

  function _renderPageTabs(mode) {
    var pages = _getPages();
    if (!pages.length) return '';
    // 雙層模式：page tabs 用 pill style 放最上面
    // 單層 pages-only 模式：page tabs 用 underline style（跟 cat-tabs 一致），無第二層
    var isTwoLayer = mode === 'two-layer';
    var wrapClass = isTwoLayer ? 'demo-page-tabs' : 'demo-cat-tabs';
    var tabClass  = isTwoLayer ? 'demo-page-tab' : 'demo-cat-tab';
    return '<div class="' + wrapClass + '">' + pages.map(function (p) {
      var act = p.id === _activePage ? ' active' : '';
      return '<button class="' + tabClass + act + '" data-page="' + _esc(p.id) + '">' +
             (p.icon ? '<span class="material-symbols-outlined">' + _esc(p.icon) + '</span>' : '') +
             _esc(p.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderCategoryTabs() {
    var cats = _getCategories();
    if (!cats.length) return '';
    return '<div class="demo-cat-tabs">' + cats.map(function (c) {
      var act = c.id === _activeCategory ? ' active' : '';
      return '<button class="demo-cat-tab' + act + '" data-category="' + _esc(c.id) + '">' +
             (c.icon ? '<span class="material-symbols-outlined">' + _esc(c.icon) + '</span>' : '') +
             _esc(c.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderHint() {
    if (!_activeCategory) return '';
    var cat = _getCategories().find(function (c) { return c.id === _activeCategory; });
    if (!cat || !cat.hint) return '';
    return '<div class="demo-pane-hint">' + _esc(cat.hint) + '</div>';
  }

  function _renderScrollArea() {
    return _renderHint() + _renderButtons(_filterScenarios());
  }

  // ===== DOM MOUNTING =====
  function _render() {
    if (document.getElementById('demo-fab')) return;

    // Auto-detect first page & category
    var mode = _detectMode();
    var pages = _getPages();
    var cats = _getCategories();
    if (!_activePage && pages.length) _activePage = pages[0].id;
    if (!_activeCategory && cats.length) _activeCategory = cats[0].id;
    if (mode === 'flat') { _activePage = null; _activeCategory = null; }
    if (mode === 'pages-only') _activeCategory = null;
    if (mode === 'categories-only') _activePage = null;

    // FAB
    var fabEl = document.createElement('button');
    fabEl.className = 'demo-fab';
    fabEl.id = 'demo-fab';
    fabEl.title = 'Designer Demo Scenarios';
    fabEl.innerHTML =
      '<span class="material-symbols-outlined">science</span>' +
      '<span class="demo-pulse" id="demo-fab-pulse"></span>';
    fabEl.addEventListener('click', function () { window._demoFabToggle(); });

    // Popover
    var popEl = document.createElement('div');
    popEl.className = 'demo-popover';
    popEl.id = 'demo-popover';
    popEl.innerHTML =
      '<div class="demo-popover-hdr">' +
        '<div class="demo-popover-title">' +
          '<span class="material-symbols-outlined" style="font-size:16px">science</span>' +
          'Demo Scenarios' +
        '</div>' +
        '<button class="demo-popover-close" id="demo-pop-close">' +
          '<span class="material-symbols-outlined" style="font-size:18px">close</span>' +
        '</button>' +
      '</div>' +
      (window.DEMO_DEFAULT
        ? '<button class="demo-reset-link" id="demo-reset-link">' +
            '<span class="material-symbols-outlined">refresh</span>Reset to Default</button>'
        : '') +
      _renderPageTabs(mode) +
      _renderCategoryTabs() +
      '<div class="demo-popover-scroll" id="demo-popover-scroll">' +
        _renderScrollArea() +
      '</div>';

    document.body.appendChild(fabEl);
    document.body.appendChild(popEl);

    // === Event wiring ===
    document.getElementById('demo-pop-close').addEventListener('click', function () {
      window._demoFabToggle();
    });

    // Reset link
    var resetLink = document.getElementById('demo-reset-link');
    if (resetLink && window.DEMO_DEFAULT) {
      resetLink.addEventListener('click', function () {
        window._demoFabApply(window.DEMO_DEFAULT, null);
      });
    }

    // Page tabs
    popEl.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        window._demoFabSetPage(t.dataset.page);
      });
    });

    // Category tabs (also handles page tabs in pages-only mode, where they use demo-cat-tab class)
    popEl.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        if (t.dataset.page) {
          window._demoFabSetPage(t.dataset.page);
        } else {
          window._demoFabSetCategory(t.dataset.category);
        }
      });
    });

    // Scenario button clicks (event delegation on scroll area)
    document.getElementById('demo-popover-scroll').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-scenario]');
      if (!btn || btn.classList.contains('demo-dis')) return;
      window._demoFabApply(btn.dataset.scenario, btn);
    });

    // Outside click to close
    document.addEventListener('click', function (e) {
      var pop = document.getElementById('demo-popover');
      var fab = document.getElementById('demo-fab');
      if (!pop || !fab) return;
      if (!pop.contains(e.target) && !fab.contains(e.target) && pop.classList.contains('show')) {
        pop.classList.remove('show');
        fab.classList.remove('popped');
      }
    });

    _injectGlobalTooltip();
  }

  // ===== #gl-tip auto-injection =====
  function _injectGlobalTooltip() {
    if (document.getElementById('gl-tip')) return; // host page already provides one
    var tip = document.createElement('div');
    tip.id = 'gl-tip';
    document.body.appendChild(tip);
    var cur = null;
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest('[data-tip]');
      if (!el || el === cur) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block';
    });
    document.addEventListener('mousemove', function (e) {
      if (!cur) return;
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var x = e.clientX - tw / 2, y = e.clientY - th - 10;
      if (x < 8) x = 8;
      if (x + tw > window.innerWidth - 8) x = window.innerWidth - tw - 8;
      if (y < 8) y = e.clientY + 16;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest('[data-tip]');
      if (el && el === cur) { cur = null; tip.style.display = 'none'; }
    });
  }

  // ===== PUBLIC API =====
  function _refreshScrollArea() {
    var scroll = document.getElementById('demo-popover-scroll');
    if (!scroll) return;
    scroll.style.opacity = '0';
    setTimeout(function () {
      scroll.innerHTML = _renderScrollArea();
      scroll.style.opacity = '1';
    }, 120);
  }

  function _refreshTabs() {
    var pop = document.getElementById('demo-popover');
    if (!pop) return;
    pop.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === _activePage);
    });
    pop.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      // In pages-only mode, cat-tab elements carry data-page (not data-category)
      if (t.dataset.page) {
        t.classList.toggle('active', t.dataset.page === _activePage);
      } else {
        t.classList.toggle('active', t.dataset.category === _activeCategory);
      }
    });
  }

  /** Toggle popover open/close */
  window._demoFabToggle = function () {
    var pop = document.getElementById('demo-popover');
    var fab = document.getElementById('demo-fab');
    var pulse = document.getElementById('demo-fab-pulse');
    var opening = !pop.classList.contains('show');
    pop.classList.toggle('show');
    fab.classList.toggle('popped');
    if (opening && pulse) pulse.style.display = 'none';
  };

  /** Set active page tab (internal + external) */
  window._demoFabSetPage = function (pageId) {
    if (_activePage === pageId) return;
    _activePage = pageId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /** Set active category tab */
  window._demoFabSetCategory = function (catId) {
    if (_activeCategory === catId) return;
    _activeCategory = catId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /**
   * Called from prototype's navigation function to auto-switch the page tab.
   * Only switches if the popover doesn't need to stay on current tab.
   */
  window.demoFabSwitchTab = function (pageId) {
    window._demoFabSetPage(pageId);
  };

  /** Apply a scenario — called via event delegation or by host */
  window._demoFabApply = function (id, btn) {
    _activeScenario = id;
    document.querySelectorAll('.demo-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    if (btn) {
      btn.classList.add('active');
    } else {
      // No btn provided (e.g. Reset link) — find scenario in DOM
      var found = document.querySelector('[data-scenario="' + id + '"]');
      if (found) found.classList.add('active');
    }
    if (typeof window.DEMO_APPLY === 'function') {
      window.DEMO_APPLY(id, btn);
    }
  };

  // ===== INIT =====
  function _init() {
    if (_activeScenario === null && window.DEMO_DEFAULT) {
      _activeScenario = window.DEMO_DEFAULT;
    }
    _render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>
</body>
</html>
