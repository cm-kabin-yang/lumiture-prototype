<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumiture.ai — Group List v2 (Folder Tree Resource Picker)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */
  --lt-shadow-chip:   0 2px 4px 0 rgba(0, 0, 0, 0.3);            /* chip / tag 用，較深 opacity */
  --lt-shadow-dialog: 0 0 6px 0 rgba(0, 0, 0, 0.2);              /* Card / Dialog / Dropdown 共用；無 offset */
  --lt-shadow-overlay:        0 4px 12px rgba(0, 0, 0, 0.14);    /* CMDS 未涵蓋；popover / floating menu */
  --lt-shadow-overlay-strong: 0 4px 16px rgba(0, 0, 0, 0.18);    /* CMDS 未涵蓋；drawer / 較重 overlay */

  /* --- Transition --- */
  --lt-transition-fast: .15s ease;
  --lt-transition-base: .2s ease;
  --lt-transition-slow: .3s ease;

  /* --- Z-index --- */
  --lt-z-base:     0;
  --lt-z-elevated: 10;
  --lt-z-sticky:   100;
  --lt-z-dropdown: 1000;
  --lt-z-modal:    2000;
  --lt-z-tooltip:  3000;
  --lt-z-toast:    4000;


  /* ============================================================
   * LAYER 2 — SEMANTIC
   * 語意層：引用 primitive，描述用途；component 預設用此層
   * ============================================================ */

  /* --- Color: Brand --- */
  --lt-color-primary:         var(--lt-blue-70);
  --lt-color-primary-hover:   var(--lt-blue-60);
  --lt-color-primary-active:  var(--lt-blue-90);
  --lt-color-primary-bg:      var(--lt-blue-10);
  --lt-color-primary-bg-emphasized: var(--lt-blue-20);

  --lt-color-secondary:       var(--lt-turquoise-70);
  --lt-color-secondary-hover: var(--lt-turquoise-60);
  --lt-color-secondary-bg:    var(--lt-turquoise-10);

  /* --- Color: Functional (alias) --- */
  --lt-color-success: var(--lt-color-success-base);
  --lt-color-error:   var(--lt-color-error-base);
  --lt-color-warning: var(--lt-color-warning-base);
  --lt-color-info:    var(--lt-color-info-base);

  /* --- Color: Text --- */
  --lt-color-text-primary:   var(--lt-grey-700);   /* 內文預設 */
  --lt-color-text-secondary: var(--lt-grey-500);   /* 次要文字 */
  --lt-color-text-tertiary:  var(--lt-grey-400);   /* hint / placeholder */
  --lt-color-text-disabled:  var(--lt-grey-400);
  --lt-color-text-inverse:   var(--lt-white);
  --lt-color-text-link:      var(--lt-blue-60);
  --lt-color-text-heading:   var(--lt-grey-800);   /* 為未來 heading 獨立換色預留 */
  --lt-color-text-icon:      var(--lt-grey-600);   /* 為未來 icon 獨立換色預留 */

  /* --- Color: Background --- */
  --lt-color-bg-default:    var(--lt-white);
  --lt-color-bg-subtle:     var(--lt-grey-50);
  --lt-color-bg-emphasized: var(--lt-grey-100);
  --lt-color-bg-disabled:   var(--lt-grey-100);
  --lt-color-bg-inverse:    var(--lt-blue-90);
  --lt-color-bg-overlay:    rgba(0, 0, 0, 0.5);

  /* --- Color: Border --- */
  --lt-color-border-default: var(--lt-grey-200);
  --lt-color-border-strong:  var(--lt-grey-300);
  --lt-color-border-focus:   var(--lt-color-primary);
  --lt-color-border-input:   #DCE3EC;   /* prototype --tf-border；略不同於 grey-200 */
  --lt-color-border-error:   var(--lt-color-error-base);


  /* ============================================================
   * LAYER 3 — COMPONENT
   * 元件層：給特定元件使用；引用 semantic
   * ============================================================ */

  /* --- Sidebar (深海軍藍) --- */
  --lt-sidebar-width:      250px;
  --lt-sidebar-bg:         var(--lt-blue-90);
  --lt-sidebar-text:       rgba(255, 255, 255, 0.85);
  --lt-sidebar-text-muted: rgba(255, 255, 255, 0.50);
  --lt-sidebar-hover-bg:   rgba(255, 255, 255, 0.06);
  --lt-sidebar-active-bg:  var(--lt-color-primary);

  /* --- Topbar --- */
  --lt-topbar-bg:     var(--lt-white);
  --lt-topbar-shadow: var(--lt-shadow-dialog);   /* CMDS Dialog shadow（Card 級別 elevation）*/

  /* --- Card --- */
  --lt-card-bg:      var(--lt-color-bg-default);
  --lt-card-radius:  var(--lt-radius-md);
  --lt-card-shadow:  var(--lt-shadow-dialog);    /* CMDS 明確規範 Card 用 Dialog shadow */
  --lt-card-padding: var(--lt-space-24);

  /* --- Button --- */
  --lt-button-radius:     var(--lt-radius-sm);
  --lt-button-padding-x:  var(--lt-space-16);
  --lt-button-padding-y:  var(--lt-space-8);
  --lt-button-focus-ring: 0 0 0 3px rgba(0, 79, 176, 0.10);

  /* --- Input / Text Field --- */
  --lt-input-bg:        var(--lt-color-bg-default);
  --lt-input-border:    var(--lt-color-border-input);
  --lt-input-radius:    var(--lt-radius-sm);
  --lt-input-padding-x: var(--lt-space-16);
  --lt-input-padding-y: var(--lt-space-8);

  /* --- Modal --- */
  --lt-modal-radius:   var(--lt-radius-lg);
  --lt-modal-shadow:   var(--lt-shadow-dialog);  /* CMDS Dialog shadow（Modal = Dialog 同類）*/
  --lt-modal-padding:  var(--lt-space-24);
  --lt-modal-backdrop: rgba(0, 0, 0, 0.5);

  /* --- Tooltip --- */
  --lt-tooltip-bg:      #3C3C3C;            /* 對齊 Lumiture-Guideline.md 規範；非品牌色，刻意不引用 brand token */
  --lt-tooltip-text:    var(--lt-white);
  --lt-tooltip-radius:  var(--lt-radius-sm);
  --lt-tooltip-padding: var(--lt-space-8);
}


/* ============================================================
 * NOT YET DEFINED (Pass 3+)
 * ============================================================
 * - ~~Chart palette~~ ✅ 已加入（2026-05-12 從 Figma General Behavior file audit）
 * - Gradient tokens (Figma 有 Lumiture.ai Blue / Orange / Lemon C 等)
 * - Opacity tokens (Figma 有 CM Opacity Color 系列)
 * - Composite typography tokens (--lt-type-h1, --lt-type-body 等 style sets)
 * - Focus / Inset shadow 特殊變體
 * - Dark mode 對應 token
 *
 * Shadow 結構待 Figma audit：v7/v8 用單層、tokens.css 主階用雙層；Overlay 已用單層作折衷
 * ============================================================ */

</style>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--lt-color-primary-bg);color:var(--lt-color-text-primary);font-family:var(--lt-font-sans);font-size:var(--lt-fs-14);letter-spacing:var(--lt-tracking-normal)}
button,input{font:inherit}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.shell{display:flex;min-height:100vh}
.workspace{min-width:0;flex:1;display:flex;flex-direction:column}
.main{width:min(100%,1366px);margin:0 auto;padding:32px 32px 96px;flex:1;width:100%}

/* ---- go-back / breadcrumb ---- */
.go-back{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--lt-color-primary);font-weight:700;font-size:14px;padding:0 0 24px;cursor:pointer}
.go-back .material-symbols-outlined{font-size:20px}
.go-back:hover .go-back-label{text-decoration:underline}
.crumb{font-size:12px;color:var(--lt-color-text-secondary);margin-bottom:4px}

/* ---- page card ---- */
.card{background:var(--lt-color-bg-default);border-radius:var(--lt-radius-md);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px}

/* ---- list page header (type scale read off Figma text-node heights:
 * CloudMile 36px→H3 24, "Tier 1 Group List (13)" 24px→H6 16, description 18px→Caption 12) ---- */
.org-title{font-size:var(--lt-fs-24);font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading);margin:0 0 20px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.section-head h2{font-size:var(--lt-fs-16);font-weight:700;line-height:var(--lt-leading-tight);margin:0 0 8px;color:var(--lt-color-text-heading)}
.section-head p{margin:0;color:var(--lt-color-text-secondary);font-size:var(--lt-fs-12);line-height:var(--lt-leading-tight)}
.section-copy{margin:0;color:var(--lt-color-text-secondary);font-size:var(--lt-fs-12);line-height:var(--lt-leading-tight)}
.btn{display:inline-flex;align-items:center;gap:4px;min-width:80px;height:36px;border-radius:5px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;justify-content:center}
.btn .material-symbols-outlined{font-size:18px}
.btn-pri{border:0;background:var(--lt-color-primary);color:#fff;box-shadow:var(--lt-shadow-button)}
.btn-pri:hover{background:var(--lt-color-primary-hover)}
.btn-pri:active{background:var(--lt-blue-90)}
.btn-pri:disabled{background:var(--lt-grey-100);color:var(--lt-grey-300);cursor:not-allowed;box-shadow:none}
.btn-out{border:1px solid var(--lt-color-primary);background:#fff;color:var(--lt-color-primary)}
.btn-out:hover{background:var(--lt-color-primary-bg)}
.btn-out:disabled{border-color:var(--lt-grey-200);color:var(--lt-grey-300);cursor:not-allowed}
.btn-out.danger{border-color:var(--lt-color-error);color:var(--lt-color-error)}
.btn-out.danger:hover{background:var(--lt-color-error-light)}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:0;background:transparent;border-radius:5px;color:var(--lt-color-text-secondary);cursor:pointer}
.btn-icon:hover{background:var(--lt-color-bg-subtle);color:var(--lt-color-text-primary)}
.btn-icon.danger:hover{background:var(--lt-color-error-light);color:var(--lt-color-error)}
.btn-icon:disabled{color:var(--lt-grey-300);cursor:not-allowed;background:transparent}
.btn-icon .material-symbols-outlined{font-size:20px}

/* ---- table ---- */
.table-wrap{border-radius:var(--lt-radius-sm);overflow:auto;overscroll-behavior:contain;max-height:575px;border:1px solid var(--lt-color-border-default)}
.table-wrap::-webkit-scrollbar{width:6px;height:6px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--lt-grey-300);border-radius:3px}
table{border-collapse:collapse;width:100%;min-width:760px;text-align:left;table-layout:fixed}
thead th{position:sticky;top:0;z-index:2;height:50px;padding:7px 16px 8px;background:var(--lt-color-primary-bg);border-bottom:1px solid var(--lt-color-border-default);color:var(--lt-color-text-heading);font-size:var(--lt-fs-14);font-weight:700;white-space:nowrap}
th.center,td.center{text-align:center}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:var(--lt-grey-200)}
.th-sort{display:inline-flex;align-items:center;gap:4px}
th.sortable.center .th-sort{justify-content:center;width:100%}
.sort-ic{font-size:16px!important;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20!important}
tbody td{height:50px;padding:8px 16px;border-bottom:1px solid var(--lt-color-border-default);vertical-align:middle;font-size:14px;overflow:hidden;text-overflow:ellipsis}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--lt-color-primary-bg)}
tbody tr.selected td{background:var(--lt-blue-20)}
tbody tr.selected:hover td{background:var(--lt-blue-30)}
tbody tr.pending td{background:var(--lt-grey-100);color:var(--lt-grey-400)}
.cell-ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-double .l1{color:var(--lt-color-text-primary)}
.cell-double .l2{color:var(--lt-color-text-secondary);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.link-btn{border:0;background:transparent;color:var(--lt-color-text-link);font-weight:600;font-size:14px;padding:0;cursor:pointer}
.link-btn:hover{text-decoration:underline}
.actions-cell{display:flex;align-items:center;gap:4px}
td.center .actions-cell{justify-content:center}
.status-text{font-size:14px}
.status-text.inactive{color:var(--lt-color-text-secondary)}
/* Checkbox（Guideline #Checkbox，S size／Primary／unchecked-checked-mixed）。
 * 原生 input[type=checkbox] + accent-color 在部分瀏覽器的 unchecked 狀態會多畫出
 * 一個小圓點（換成 appearance:none 徒手畫框線就會消失，實測跟 accent-color、
 * 尺寸都無關，單純是瀏覽器畫原生 checkbox 本身的痕跡）。改成 Guideline 定義的
 * span 版自訂 checkbox，順便對齊規範沒有走完的 mixed 狀態視覺。 */
.checkbox{display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:0 0 auto}
.checkbox.is-disabled{cursor:not-allowed}
.checkbox__box{display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px;width:16px;height:16px;border:1px solid var(--lt-grey-300);border-radius:var(--lt-radius-sm);background:#fff;transition:border-color 150ms ease,background 150ms ease,box-shadow 200ms ease}
.checkbox__icon{color:#fff;display:none;font-size:12px;font-variation-settings:'FILL' 1,'wght' 700,'GRAD' 0,'opsz' 20}
.checkbox:hover .checkbox__box{border-color:var(--lt-grey-400)}
.checkbox.is-checked .checkbox__box,.checkbox.is-mixed .checkbox__box{background:var(--lt-color-primary);border-color:var(--lt-color-primary)}
.checkbox.is-checked .checkbox__icon,.checkbox.is-mixed .checkbox__icon{display:inline-block}
.checkbox:hover.is-checked .checkbox__box,.checkbox:hover.is-mixed .checkbox__box{background:var(--lt-color-primary-hover);border-color:var(--lt-color-primary-hover)}
.checkbox:focus-visible .checkbox__box{border-color:var(--lt-color-primary);box-shadow:0 0 0 3px rgba(0,79,176,.1);outline:none}
.checkbox.is-disabled .checkbox__box{border-color:var(--lt-grey-300);background:#fff}
.checkbox.is-disabled.is-checked .checkbox__box,.checkbox.is-disabled.is-mixed .checkbox__box{background:var(--lt-grey-300);border-color:var(--lt-grey-300)}

/* ---- tabs (primary, underline) ---- */
.tabs-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--lt-color-border-default);margin-bottom:20px}
.tabs{display:flex;gap:4px}
.tab{padding:8px 16px;height:36px;font-size:14px;font-weight:500;color:var(--lt-color-text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:var(--lt-transition-fast);background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;white-space:nowrap}
.tab:hover{color:var(--lt-color-text-heading);border-bottom-color:var(--lt-grey-200)}
.tab.active{color:var(--lt-color-primary);font-weight:700;border-bottom-color:var(--lt-color-primary)}
.tab:disabled{color:var(--lt-grey-300);cursor:not-allowed}

/* ---- cloud sub-tabs (pill) ---- */
.pill-tabs{display:inline-flex;gap:4px;background:var(--lt-grey-100);border-radius:5px;padding:4px;margin-bottom:16px}
.pill-tab{height:28px;padding:0 12px;border:0;background:transparent;border-radius:5px;font-size:13px;font-weight:600;color:var(--lt-color-text-secondary);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill-tab.active{background:#fff;color:var(--lt-color-primary);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pill-tab .csp-dot{width:8px;height:8px;border-radius:50%}
.groupby-toggle{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.groupby-toggle .lbl{font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);white-space:nowrap}
.groupby-toggle .pill-tabs{margin:0}

/* ---- search ---- */
.search-box{position:relative;width:280px}
.search-box input{width:100%;height:36px;border:1px solid var(--lt-color-border-input);border-radius:5px;padding:0 12px 0 36px;font-size:14px}
.search-box input:focus{outline:none;border-color:var(--lt-color-primary)}
.search-box .material-symbols-outlined{position:absolute;left:9px;top:8px;font-size:20px;color:var(--lt-color-text-secondary)}
.res-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.res-toolbar-actions{display:flex;align-items:center;gap:8px}

/* ---- empty / error state ---- */
.empty-state{min-height:280px;display:grid;place-items:center;padding:32px;text-align:center}
.empty-state.small{min-height:180px}
.empty-state .material-symbols-outlined{font-size:64px;color:var(--lt-blue-30);font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 48;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:700;margin:0 0 4px;color:var(--lt-color-text-heading)}
.empty-copy{margin:0;max-width:420px;color:var(--lt-color-text-secondary);line-height:1.65;white-space:pre-line}
.empty-state.error .material-symbols-outlined{color:var(--lt-color-error);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 48}
.empty-state .btn{margin-top:16px}

/* ---- skeleton ---- */
.skel{background:linear-gradient(90deg,#edf2f5 0%,#f7f9fa 50%,#edf2f5 100%);background-size:200% 100%;animation:shimmer 1.25s linear infinite;border-radius:var(--lt-radius-sm)}
@keyframes shimmer{to{background-position:-200% 0}}
.skel-title{height:24px;width:220px;margin-bottom:12px}
.skel-btn{height:36px;width:120px}
.skel-row{height:50px;border-bottom:1px solid var(--lt-color-border-default)}

/* ---- role/demo chip on header ---- */
.role-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--lt-color-primary-bg);color:var(--lt-color-primary);font-size:12px;font-weight:700;margin-bottom:12px}
.role-chip .material-symbols-outlined{font-size:16px}

/* ---- confirm dialog ---- */
.dlg-backdrop{position:fixed;inset:0;z-index:2000;background:var(--lt-modal-backdrop);display:grid;place-items:center;padding:24px}
.dlg{width:min(440px,100%);background:#fff;border-radius:var(--lt-radius-lg);box-shadow:var(--lt-modal-shadow);padding:24px}
.dlg-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dlg-head .material-symbols-outlined{color:var(--lt-color-warning);font-size:24px}
.dlg-head h3{margin:0;font-size:18px}
.dlg-body{color:var(--lt-color-text-primary);line-height:1.65;margin-bottom:20px}
.dlg-body b{font-weight:700}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px}
.dlg-actions .btn{min-width:100px}


/* ---- assign-resource modal + folder tree ---- */
.rmodal-backdrop{position:fixed;inset:0;z-index:2000;background:var(--lt-modal-backdrop);display:grid;place-items:center;padding:24px}
.rmodal{width:min(660px,100%);height:min(720px,calc(100vh - 48px));display:flex;flex-direction:column;background:#fff;border-radius:var(--lt-radius-lg);box-shadow:var(--lt-modal-shadow)}
.rmodal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 24px 0}
.rmodal-head h3{margin:0 0 4px;font-size:var(--lt-fs-18);line-height:var(--lt-leading-tight)}
.rmodal-head p{margin:0;font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);line-height:var(--lt-leading-tight)}
.rmodal-close{border:0;background:transparent;color:var(--lt-color-text-secondary);cursor:pointer;display:flex;padding:2px}
.rmodal-tools{display:flex;align-items:center;gap:8px;padding:16px 24px 12px}
.rmodal-tools .search-box{flex:1;width:auto}
.rmodal-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;border-top:1px solid var(--lt-color-border-default);border-bottom:1px solid var(--lt-color-border-default)}
.rmodal-body::-webkit-scrollbar{width:6px}
.rmodal-body::-webkit-scrollbar-thumb{background:var(--lt-grey-300);border-radius:3px}
.rmodal-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px}
.rmodal-foot .btn{min-width:100px}
.rmodal-count{font-size:var(--lt-fs-14);color:var(--lt-color-text-secondary)}
.rmodal-count b{color:var(--lt-color-text-primary)}

.tnode{position:relative;display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 24px 4px 0;cursor:default}
/* 每一層畫一條垂直引導線，否則子資料夾跟同層專案縮排相同、讀不出誰屬於誰 */
.trail{position:absolute;top:0;bottom:0;width:1px;background:var(--lt-color-border-default)}
.tnode:hover{background:var(--lt-color-primary-bg)}
/* 資料夾列在自己的子樹範圍內黏在頂端。因為 .tbranch 把子項包起來，
 * 黏著會在子樹捲完時自然結束，不會一路疊到底。收合的資料夾 .tbranch
 * 高度等於自己那一列，等於沒有黏著空間，行為自動退回一般列。 */
.tnode.is-folder{position:sticky;background:var(--lt-color-bg-default)}
.tnode.is-folder:hover{background:var(--lt-color-primary-bg)}
.tnode.is-project{min-height:44px}
/* padding:0 是必要的，不是保險：<button> 的 UA 預設 padding 是 1px 6px，
 * 配上 box-sizing:border-box 跟固定 20x20，content box 只剩 8px 寬，
 * 20px 的 icon 放不進去就往右溢出 6px、往下 1px。結果是 hover 的灰色方塊
 * （按鈕本體）跟箭頭本身錯開，看起來歪斜。 */
.tchev{width:20px;height:20px;flex:0 0 20px;padding:0;display:grid;place-items:center;border:0;background:transparent;color:var(--lt-color-text-secondary);cursor:pointer;border-radius:var(--lt-radius-sm)}
.tchev:hover{background:var(--lt-grey-200)}
.tchev .material-symbols-outlined{font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}
.tchev.ghost{visibility:hidden}
.tnode .ticon{font-size:18px;color:var(--lt-color-text-secondary);flex:0 0 auto}
/* 專案列沒有資料夾 icon，但如果不補一個等寬的空位，專案名稱會比父層資料夾的
 * 名稱還靠左（父層多了 icon 18px + gap 8px），縮排看起來像倒退回去。 */
.tnode .ticon.ghost{visibility:hidden}
.tnode.is-folder .ticon{color:var(--lt-color-primary)}
.tnode.is-unassigned .ticon{color:var(--lt-grey-400)}
.tlabel{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tname{font-size:var(--lt-fs-14);color:var(--lt-color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode.is-folder .tname{font-weight:600}
.tnode.is-unassigned .tname{color:var(--lt-color-text-secondary)}
.tsub{font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcount{font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);font-weight:400;font-variant-numeric:tabular-nums}
.tcount.partial{color:var(--lt-color-warning)}
.ba-chip{flex:0 0 auto;font-size:11px;color:var(--lt-color-text-secondary);background:var(--lt-grey-100);border-radius:var(--lt-radius-xs);padding:2px 8px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.hl{color:var(--lt-blue-60);font-weight:700}
/* Select All 是清單的總開關，不是樹的一部分，用一條底線跟樹分開 */
.tnode.is-selectall{border-bottom:1px solid var(--lt-color-border-default);position:sticky;top:0;z-index:40;background:var(--lt-color-bg-default)}
.tnode.is-selectall .tname{font-weight:600}
.tname.is-nocost{color:var(--lt-color-text-secondary);font-style:italic}
/* ============================================================
 * 元件版：忠實複製既有 GroupedMultiSelect 的視覺語言，再延伸到多層。
 * 對照來源（LumiTure-FE）：
 *   GroupHeader.tsx                → 父層：primary.light10 底 + 底部
 *                                    light20 hairline + fontWeight 700 +
 *                                    (count) + 右側 Expand icon button
 *   GroupedMultiSelectOptionItem   → 子項：pl:'32px'、單行 name + (desc)
 *   GroupedMultiSelectOption       → ITEM_HEIGHT = 40（固定列高）
 * 刻意不補的：縮排引導線、資料夾 icon、巢狀 sticky——元件本來就沒有，
 * 補了就不是「用既有元件做」而是又變回樹狀版了。
 * ============================================================ */
.rmodal-body.is-component .tnode{min-height:40px}
.rmodal-body.is-component .tnode.is-project{min-height:40px}
/* 父層＝整條 tint band（GroupHeader 的 sx） */
.rmodal-body.is-component .tnode.is-folder{
  position:static;                       /* 元件用 react-window 虛擬清單，sticky 在裡面無效 */
  background:var(--lt-blue-10);
  box-shadow:inset 0 -1px 0 0 var(--lt-blue-20);
}
.rmodal-body.is-component .tnode.is-folder:hover{background:var(--lt-blue-10)}
.rmodal-body.is-component .tnode.is-folder .tname{font-weight:700}
/* 收合箭頭移到最右（GroupHeader 把 IconButton 放在 label 後面） */
.rmodal-body.is-component .tchev{order:9;margin-left:auto;color:var(--lt-color-primary)}
.rmodal-body.is-component .tchev.ghost{display:none}
/* 元件沒有資料夾 icon，父層只有 checkbox + 粗體字 */
.rmodal-body.is-component .ticon{display:none}
/* 子項是單行 name (desc)，desc 用 hint 色 */
.rmodal-body.is-component .tlabel{flex-direction:row;align-items:center;justify-content:flex-start;gap:6px}
.tdesc{font-size:var(--lt-fs-14);color:var(--lt-color-text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 元件版 + 建議修正：箭頭移回左邊（跟縮排同一欄）、縮排步進改 16px。
 * 只有這兩個差異，其餘視覺完全等於元件版。 */
/* 只釘「目前所在的最上層資料夾」那一列，不做巢狀釘選。
 * 巢狀釘選（每一層祖先都釘住）在 10 層 = 400px 的釘住區、body 只有 465px，
 * 會自己撐爆；而且 react-window 的列是 position:absolute、本來就不能 sticky。
 * 只釘一列是設計上合理、技術上也做得到的那個版本。
 * ⚠️ 這支 prototype 沒有虛擬清單，所以這裡的 sticky 是「示意要的行為」，
 * 不等於證明它在 react-window 裡可行。真的要做的路徑是換成
 * @tanstack/react-virtual（package.json 已有，VirtualizedTable 已在用且
 * sticky header 有效）。 */
.rmodal-body.is-component.is-component-fixed .tnode.is-folder[data-depth="0"]{position:sticky}
.rmodal-body.is-component.is-component-fixed .tchev{order:0;margin-left:0}
.rmodal-body.is-component.is-component-fixed .tchev.ghost{display:block;visibility:hidden}
.tempty-icon{display:block;font-size:32px;color:var(--lt-color-text-tertiary);margin-bottom:8px}
.tempty-icon.is-success{color:var(--lt-color-success)}
.tempty-title{font-size:var(--lt-fs-16);font-weight:600;color:var(--lt-color-text-primary);margin-bottom:4px}
.tempty{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;color:var(--lt-color-text-secondary);font-size:var(--lt-fs-14)}
.gb-info{font-size:16px;color:var(--lt-color-text-secondary);cursor:help}
.tskel{padding:8px 24px}
.tskel .skel{height:36px;margin-bottom:8px}

/* ---- toast ---- */
.toast{position:fixed;left:24px;bottom:24px;z-index:4000;display:flex;align-items:center;gap:10px;max-width:440px;border-radius:var(--lt-radius-sm);padding:12px 16px;background:var(--lt-color-success);color:#fff;box-shadow:var(--lt-shadow-overlay-strong);font-size:14px;transform:translateY(100px);opacity:0;transition:var(--lt-transition-base)}
.toast.error{background:var(--lt-color-error)}
.toast.show{opacity:1;transform:none}


/* ---- footer ---- */
.footer{display:flex;justify-content:space-between;gap:16px;padding:20px 32px;margin-top:auto;font-size:12px;background:#fff;border-top:1px solid var(--lt-color-border-default)}
.footer-version{color:var(--lt-color-text-primary);font-weight:600}
.ver-tag{display:inline-block;margin-left:6px;background:#34B5D9;color:#fff;border-radius:999px;padding:2px 8px;font-size:11px}
.footer-credit{color:#676767}

@media(max-width:800px){.main{padding:24px 16px 96px}.section-head{flex-direction:column}.res-toolbar{flex-direction:column;align-items:flex-start}.search-box{width:100%}}
</style>
</head>

  <div class="workspace">

</div>

<div class="toast" id="toast"><span class="material-symbols-outlined" id="toast-icon">check_circle</span><span id="toast-text"></span></div>

<div id="assign-root"></div>


<script>window.LUMITURE_ACTIVE='group-list'; window.LUMITURE_USER={role:'Admin',plan:'Standard',quota:{analyses:{used:32,total:80},rightsizing:{used:410,total:1000},refreshDate:'2 Jul. 2026'}};</script>
<script>
/* === Inlined: shared/lumiture-nav.js === */
/*!
 * lumiture-nav.js — Canonical Sidebar Navigation (Single Source of Truth)
 *
 * Defines window.LUMITURE_NAV used by shared/lumiture-sidebar.js.
 * All Lumiture prototypes share the same nav structure — this file is the
 * single source. Each prototype only needs to set window.LUMITURE_ACTIVE.
 *
 * Usage in prototype HTML:
 *   <aside id="lt-sidebar"></aside>
 *   <script>window.LUMITURE_ACTIVE = 'general-budget';<\/script>
 *   <script src="../shared/lumiture-nav.js"><\/script>    ← MUST load BEFORE sidebar
 *   <script src="../shared/lumiture-sidebar.js"><\/script>
 *
 * Rules:
 *   - Items with `href` → rendered as <a> links (clickable, cross-prototype navigation)
 *   - Items with `disabled:true` → rendered as <div> with .lt-dis class (greyed, not clickable)
 *   - The item matching LUMITURE_ACTIVE → href automatically stripped by lumiture-sidebar.js
 *     so the "current page" item won't self-link
 *
 * To add a new prototype:
 *   1. Update the relevant entry below — change `disabled:true` to `href:'../{name}/{name}-prototype-v{N}.html'`
 *   2. All 3 (or more) prototypes will automatically reflect the new link via this shared script
 *   3. The new prototype only needs to set LUMITURE_ACTIVE = its own id
 */
(function () {
  'use strict';

  window.LUMITURE_NAV = [
    { type: 'item', id: 'overview', label: 'Overview', icon: 'home', disabled: true },

    { type: 'group', id: 'dashboard', label: 'Dashboard', items: [
      { id: 'cost-dashboard',     label: 'Cost Dashboard',     icon: 'dashboard',    href: './cost-dashboard.html' },
      { id: 'executive-insights', label: 'Executive Insights', icon: 'auto_awesome', href: './executive-insights.html' },
    ]},

    { type: 'group', id: 'optimization', label: 'Optimization', items: [
      { id: 'usage-optimization', label: 'Usage Optimization', icon: 'tune', href: './rightsizing.html' },
      { id: 'rate-optimization',  label: 'Rate Optimization',  icon: 'percent', href: './rate-optimization.html' },
    ]},

    { type: 'group', id: 'budget', label: 'Budget Monitoring & Alert', items: [
      { id: 'general-budget',    label: 'General Budget',    icon: 'savings',              href: './general-budget.html' },
      { id: 'customized-budget', label: 'Customized Budget', icon: 'tune',                 disabled: true },
      { id: 'anomaly-detection', label: 'Anomaly Detection', icon: 'notifications_active', disabled: true },
    ]},

    { type: 'group', id: 'org', label: 'Organization Settings', items: [
      { id: 'lumitag',            label: 'LumiTag',            icon: 'sell',            href: './lumitag.html' },
      { id: 'group-list',         label: 'Group List',         icon: 'groups',          href: './group-list.html' },
      { id: 'all-resource-list',  label: 'All Resource List',  icon: 'inventory_2',     disabled: true },
      { id: 'authorization-list', label: 'Authorization List', icon: 'link',            href: './organization-settings.html' },
      { id: 'admin-list',         label: 'Admin List',         icon: 'manage_accounts', disabled: true },
    ]},
  ];
})();

</script>
<script>
/* === Inlined: shared/lumiture-sidebar.js === */
/*!
 * lumiture-sidebar.js — Lumiture Shared Sidebar (with canonical logo)
 *
 * Auto-injects:
 *   - Sidebar CSS (logo, nav items, group collapse, active state)
 *   - Canonical Lumiture logo (concentric circles + PROTOTYPE tag + LumiTure.ai wordmark)
 *
 * Usage in prototype HTML:
 *   1. Define window.LUMITURE_NAV = [...]   (see schema below)
 *   2. Define window.LUMITURE_ACTIVE = 'item-id'  (which item is highlighted)
 *   3. Add mount point: <aside id="lt-sidebar"></aside>
 *   4. <script src="../shared/lumiture-sidebar.js"><\/script>
 *
 * NAV schema:
 *   window.LUMITURE_NAV = [
 *     // Top-level item (no group)
 *     { type: 'item', id: 'overview', label: 'Overview', icon: 'home', href: '#' },
 *     // Group with children (expanded by default unless `collapsed: true`)
 *     { type: 'group', id: 'dashboard', label: 'Dashboard', expanded: true, items: [
 *       { id: 'cost-dashboard', label: 'Cost Dashboard', icon: 'dashboard', href: '#' },
 *       { id: 'exec-insights',  label: 'Executive Insights', icon: 'monitoring', disabled: true },
 *     ]},
 *   ];
 *   window.LUMITURE_ACTIVE = 'cost-dashboard';  // which item is active
 *
 * API:
 *   window.LumitureSidebar.toggleGroup(groupId)
 *   window.LumitureSidebar.toggleCollapse()    — collapse the whole sidebar (icon-only)
 *   window.LumitureSidebar.setActive(itemId)
 */
(function () {
  'use strict';

  // ===== CSS =====
  var CSS = [
    /* CSS variables — sidebar 用 Primary Dark #002663（per Lumiture-Guideline.md，2026-05-08 設計師確認） */
    ':root{--lt-sb-w:250px;--lt-sb-bg:#002663;--lt-sb-hov:rgba(255,255,255,.06);',
    '--lt-sb-active:#004FB0;--lt-sb-text:rgba(255,255,255,.85);--lt-sb-text-muted:rgba(255,255,255,.5);',
    '--lt-sb-border:rgba(255,255,255,.1)}',

    /* Sidebar container — 採 sticky positioning：父層 .app 用 flex 或 grid 都能適應
       min-width:0 是必要的：flex 子元素預設 min-width:auto 會被內容 min-content size 撐住，導致 collapse 失效 */
    '.lt-sidebar{width:var(--lt-sb-w);min-width:0;background:var(--lt-sb-bg);color:#fff;',
    'position:sticky;top:0;height:100vh;z-index:100;overflow:hidden;',
    'flex-shrink:0;',
    'display:flex;flex-direction:column;transition:width .2s ease;scrollbar-width:none}',
    '.lt-sidebar::-webkit-scrollbar{display:none}',
    '.lt-sidebar.lt-collapsed{width:64px}',

    /* Logo block */
    '.lt-sb-logo{padding:16px 20px;display:flex;align-items:center;gap:10px;',
    'font-size:18px;font-weight:700;color:#fff;border-bottom:1px solid var(--lt-sb-border);',
    'min-height:68px;box-sizing:border-box;white-space:nowrap;overflow:hidden;flex-shrink:0}',
    '.lt-sb-logo-wrap{position:relative;width:32px;height:32px;flex-shrink:0}',
    '.lt-sb-logo-wrap svg{width:32px;height:32px;display:block}',
    /* PROTOTYPE tag — cyan caps below the icon */
    '.lt-sb-proto{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);',
    'background:var(--lt-sb-bg);color:#34B5D9;font-size:6px;font-weight:700;',
    'padding:1px 3px;border-radius:2px;text-transform:uppercase;letter-spacing:.3px;',
    'line-height:1.2;white-space:nowrap}',
    '.lt-sb-logo-text{transition:opacity .2s}',
    '.lt-sidebar.lt-collapsed .lt-sb-logo-text{opacity:0;width:0;overflow:hidden}',
    '.lt-sidebar.lt-collapsed .lt-sb-proto{display:none}',
    '.lt-sidebar.lt-collapsed .lt-sb-logo{padding:16px;justify-content:center;gap:0}',

    /* Nav scroll area — 內部捲動，sidebar 外層不捲（寬敞 padding 對齊原始設計） */
    '.lt-sb-nav{flex:1;padding:8px 12px;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}',
    '.lt-sb-nav::-webkit-scrollbar{width:6px}',
    '.lt-sb-nav::-webkit-scrollbar-track{background:transparent}',
    '.lt-sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}',
    '.lt-sb-nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.25)}',

    'text-decoration:none;white-space:nowrap;overflow:hidden;margin-bottom:2px}',

    '.lt-sb-item.lt-active{background:var(--lt-sb-active);color:#fff;font-weight:500}',
    '.lt-sb-item.lt-dis{color:rgba(255,255,255,.35);cursor:not-allowed;pointer-events:none}',
    '.lt-sb-item .material-symbols-outlined{font-size:20px;opacity:.9;flex-shrink:0}',

    /* Group section */
    '.lt-sb-group{margin-bottom:4px}',
    '.lt-sb-group-hdr{display:flex;align-items:center;justify-content:space-between;',
    'padding:18px 14px 10px;font-size:14px;font-weight:700;color:#fff;',
    'cursor:pointer;white-space:nowrap;overflow:hidden;letter-spacing:.2px}',
    '.lt-sb-group-hdr > span:first-child{overflow:hidden;text-overflow:ellipsis}',
    '.lt-sb-group-hdr:hover{color:rgba(255,255,255,.85)}',
    '.lt-sb-group-arrow{font-size:18px;transition:transform .18s;opacity:.85;flex-shrink:0}',
    '.lt-sb-group.lt-collapsed .lt-sb-group-arrow{transform:rotate(180deg)}',
    '.lt-sb-group.lt-collapsed .lt-sb-group-children{display:none}',

    /* Sub-item (inside group) — 一致 14px font，11px 垂直 padding */
    '.lt-sb-subitem{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;',
    'font-size:14px;color:rgba(255,255,255,.92);border-radius:6px;transition:background .15s;',
    'text-decoration:none;white-space:nowrap;overflow:hidden}',

    '.lt-sb-subitem.lt-active{background:var(--lt-sb-active);color:#fff;font-weight:500}',
    '.lt-sb-subitem.lt-dis{color:rgba(255,255,255,.35);cursor:not-allowed;pointer-events:none}',

    '.lt-sidebar.lt-collapsed .lt-sb-subitem span:not(.material-symbols-outlined){display:none}',

    '.lt-sidebar.lt-collapsed .lt-sb-group-hdr > span:first-child{display:none}',
    '.lt-sidebar.lt-collapsed .lt-sb-group-arrow{display:none}',
    '.lt-sidebar.lt-collapsed .lt-sb-group-hdr{padding:8px 0;justify-content:center}',
    /* In collapsed mode, always show children */
    '.lt-sidebar.lt-collapsed .lt-sb-group.lt-collapsed .lt-sb-group-children{display:block}',
    '.lt-sidebar.lt-collapsed .lt-sb-nav{padding:8px 4px}',

    /* Collapse toggle button at bottom */
    '.lt-sb-collapse-btn{padding:12px;display:flex;justify-content:flex-end;',
    'border-top:1px solid var(--lt-sb-border);flex-shrink:0}',
    '.lt-sb-collapse-btn button{color:var(--lt-sb-text-muted);background:none;border:0;cursor:pointer;',
    'display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:4px;',
    'transition:all .15s}',
    '.lt-sb-collapse-btn button:hover{background:var(--lt-sb-hov);color:#fff}',
    '.lt-sidebar.lt-collapsed .lt-sb-collapse-btn{justify-content:center}',
    '.lt-sidebar.lt-collapsed .lt-sb-collapse-btn .material-symbols-outlined{transform:rotate(180deg)}'

  function _injectCSS() {
    if (document.getElementById('lt-sidebar-css')) return;
    var s = document.createElement('style');
    s.id = 'lt-sidebar-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ===== Canonical Logo (concentric circles + PROTOTYPE tag + LumiTure.ai) =====
  var LOGO_HTML =
    '<div class="lt-sb-logo">' +
      '<div class="lt-sb-logo-wrap">' +
        '<svg viewBox="0 0 32 32" fill="none" aria-hidden="true">' +
          '<circle cx="16" cy="16" r="13" stroke="#FFF" stroke-width="2" fill="none"/>' +
          '<circle cx="16" cy="16" r="7" stroke="#FFF" stroke-width="2" fill="none"/>' +
          '<circle cx="16" cy="16" r="3" fill="#FFF"/>' +
        '</svg>' +
        '<span class="lt-sb-proto">PROTOTYPE</span>' +
      '</div>' +
      '<span class="lt-sb-logo-text">LumiTure.ai</span>' +
    '</div>';

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function _renderItem(item, isSub) {
    var cls = isSub ? 'lt-sb-subitem' : 'lt-sb-item';
    var isActive = (item.id === window.LUMITURE_ACTIVE);
    var active = isActive ? ' lt-active' : '';
    var dis = item.disabled ? ' lt-dis' : '';
    // Active item: render as <div> (no self-link). Disabled item: also no href.
    var useHref = item.href && !isActive && !item.disabled;
    var tag = useHref ? 'a' : 'div';
    var hrefAttr = useHref ? ' href="' + _esc(item.href) + '"' : '';
    var dataId = ' data-nav-id="' + _esc(item.id) + '"';
    return '<' + tag + ' class="' + cls + active + dis + '"' + hrefAttr + dataId + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon || 'circle') + '</span>' +
             '<span>' + _esc(item.label) + '</span>' +
           '</' + tag + '>';
  }

  function _renderGroup(grp) {
    var collapsed = grp.collapsed ? ' lt-collapsed' : '';
    var children = (grp.items || []).map(function (item) {
      return _renderItem(item, true);
    }).join('');
    return '<div class="lt-sb-group' + collapsed + '" data-group-id="' + _esc(grp.id) + '">' +
             '<div class="lt-sb-group-hdr">' +
               '<span>' + _esc(grp.label) + '</span>' +
               '<span class="material-symbols-outlined lt-sb-group-arrow">keyboard_arrow_up</span>' +
             '</div>' +
             '<div class="lt-sb-group-children">' + children + '</div>' +
           '</div>';
  }

  function _renderNav() {
    var nav = window.LUMITURE_NAV || [];
    var html = '<div class="lt-sb-nav">';
    nav.forEach(function (entry) {
      if (entry.type === 'group') {
        html += _renderGroup(entry);
      } else {
        html += _renderItem(entry, false);
      }
    });
    html += '</div>';
    return html;
  }

  function _renderCollapseBtn() {
    return '<div class="lt-sb-collapse-btn">' +
             '<button type="button" data-action="toggle-collapse" title="Collapse sidebar">' +
               '<span class="material-symbols-outlined">chevron_left</span>' +
             '</button>' +
           '</div>';
  }

  // ===== Mount =====
  function _render() {
    var mount = document.getElementById('lt-sidebar');
    if (!mount) {
      console.warn('[lumiture-sidebar] Mount point #lt-sidebar not found');
      return;
    }
    // If mount is not already a sidebar, wrap it
    mount.classList.add('lt-sidebar');
    mount.innerHTML = LOGO_HTML + _renderNav() + _renderCollapseBtn();

    // Group toggle
    mount.querySelectorAll('.lt-sb-group-hdr').forEach(function (hdr) {
      hdr.addEventListener('click', function () {
        var grp = hdr.parentElement;
        if (grp) grp.classList.toggle('lt-collapsed');
      });
    });
    // Collapse the whole sidebar
    var btn = mount.querySelector('[data-action="toggle-collapse"]');
    if (btn) {
      btn.addEventListener('click', function () {
        window.LumitureSidebar.toggleCollapse();
      });
    }
  }

  // ===== Public API =====
  window.LumitureSidebar = {
    toggleGroup: function (groupId) {
      var grp = document.querySelector('[data-group-id="' + groupId + '"]');
      if (grp) grp.classList.toggle('lt-collapsed');
    },
    toggleCollapse: function () {
      var sb = document.getElementById('lt-sidebar');
      var main = document.querySelector('.lt-main, .main, main');
      if (sb) sb.classList.toggle('lt-collapsed');
      if (main) main.classList.toggle('lt-sidebar-collapsed');
      // Sync legacy CSS vars (--sw) for prototypes that reference them in topbar / footer
      var w = sb && sb.classList.contains('lt-collapsed') ? '64px' : '250px';
      document.documentElement.style.setProperty('--sw', w);
      document.documentElement.style.setProperty('--lt-sb-w', w);
    },
    setActive: function (itemId) {
      window.LUMITURE_ACTIVE = itemId;
      document.querySelectorAll('.lt-sb-item, .lt-sb-subitem').forEach(function (el) {
        el.classList.toggle('lt-active', el.dataset.navId === itemId);
      });
    },
    rerender: _render,
  };

  // ===== INIT =====
  function _init() {
    _injectCSS();
    _render();
    // Dispatch resize so chart libraries (ECharts 等) 重新測量容器
    // —— 避免 inline script 已先 init chart 後，shared CSS 才 inject 導致 layout shift
    requestAnimationFrame(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>

  function _injectCSS() {
    if (document.getElementById('lt-topbar-css')) return;
    var s = document.createElement('style');
    s.id = 'lt-topbar-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function _user() {
    var u = Object.assign({}, DEFAULT_USER, window.LUMITURE_USER || {});
    u.quota = Object.assign({}, DEFAULT_USER.quota, (window.LUMITURE_USER || {}).quota || {});
    return u;
  }
  function _status(used, total) {
    if (!total || total <= 0) return 'active';
    var pct = used / total * 100;
    if (pct >= 100) return 'depleted';
    if (pct >= 80)  return 'warning';
    return 'active';
  }
  function _planItems(plan) {
    return PLAN_QUOTA_ITEMS[plan] != null ? PLAN_QUOTA_ITEMS[plan] : PLAN_QUOTA_ITEMS.Standard;
  }
  function _showQuotaBox(u) {
    return _planItems(u.plan).length > 0;
  }

  // ===== Renderers =====
  function _renderIcon(item) {
    var attrs = ' class="lt-tb-ic" title="' + _esc(item.title || '') + '"';
    if (item.onclick) attrs += ' onclick="' + _esc(item.onclick) + '"';
    var badge = item.badge ? '<span class="lt-tb-badge"></span>' : '';
    return '<button type="button"' + attrs + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon) + '</span>' + badge +
           '</button>';
  }

  function _renderUserChip(u) {
    return '<button type="button" class="lt-tb-user" id="lt-tb-user" aria-haspopup="true" aria-expanded="false">' +
             '<span class="material-symbols-outlined lt-tb-avatar-ic">account_circle</span>' +
             '<div class="lt-tb-user-text">' +
               '<span class="lt-tb-user-name">' + _esc(u.name) + '</span>' +
               '<span class="lt-tb-user-role" id="lt-tb-user-role">' + _esc(u.role) + '</span>' +
             '</div>' +
             '<span class="material-symbols-outlined lt-tb-chev">keyboard_arrow_down</span>' +
           '</button>';
  }

  function _renderQuotaItem(key, q, opts) {
    opts = opts || {};
    var meta = QUOTA_META[key];
    // Premium：unlimited（無 used/total，cyan + sparkle，不可點）
    if (opts.unlimited) {
      return '<div class="lt-q-item is-unlimited">' +
               '<span class="lt-q-dot"></span>' +
               '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
               '<span class="lt-q-val">Unlimited<span class="material-symbols-outlined">auto_awesome</span></span>' +
             '</div>';
    }
    var used = q.used || 0, total = q.total || 0;
    var remaining = Math.max(0, total - used);
    var st = _status(used, total);
    // Warning / Depleted 才有 hover tooltip 說明（取代原本點開的 Limit Reached 對話框；
    // PM 確認無法提供 per-user 業務 email，故改輕量懸停說明，無 Contact Sales 動作）
    // 文案含變數 {total} {unit} {label}；{label}=Cost Dashboard / Usage Optimization
    var tip = '';
    if (st === 'depleted' || st === 'warning') {
      var verb = st === 'depleted' ? 'has been reached' : 'is approaching';
      var tipText = 'Your monthly limit (' + total.toLocaleString() + ' ' + meta.unit + ') ' + verb +
        ' for ' + meta.dialogLabel + '. Please contact your LumiTure.ai representative to purchase ' +
        'Add-ons to increase your quota for this billing cycle.';
      tip = '<span class="lt-q-tip">' + _esc(tipText) + '</span>';
    }
    var hasTip = tip !== '';
    return '<div class="lt-q-item is-' + st + (hasTip ? ' has-tip' : '') + '"' + (hasTip ? ' tabindex="0"' : '') + '>' +
             '<span class="lt-q-dot"></span>' +
             '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
             '<span class="lt-q-val">' + remaining.toLocaleString() + ' / ' + total.toLocaleString() + ' left</span>' +
             tip +
           '</div>';
  }

  function _renderQuotaBox(u) {
    var isPremium = u.plan === 'Premium';
    var items = _planItems(u.plan);
    if (!items.length && !isPremium) return '';   // 無有效 plan：不顯示（理論上不會發生）
    // Premium（unlimited）不重置 → header 只顯示 Org-wide，不接 refresh 日
    var sub = isPremium ? 'Org-wide' : 'Org-wide, refresh on ' + _esc(u.quota.refreshDate);
    var head = '<div class="lt-q-head">' +
                 '<span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-sub">' + sub + '</span>' +
               '</div>';
    // loading（refresh 日也尚未載入 → sub 一併 skeleton）
    if (u.quota.state === 'loading') {
      return '<div class="lt-q">' +
               '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-skel lt-q-skel-sub"></span></div>' +
               '<div class="lt-q-skel" style="width:78%"></div><div class="lt-q-skel" style="width:62%"></div>' +
             '</div>';
    }
    // error（partial degrade：只有這塊壞，menu 其他項照常）；refresh 日未載入 → sub 只顯示 Org-wide；Retry 右對齊
    if (u.quota.state === 'error') {
      var headErr = '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span><span class="lt-q-sub">Org-wide</span></div>';
      return '<div class="lt-q">' + headErr +
               '<div class="lt-q-err"><span class="material-symbols-outlined">help</span>' +
               '<span class="lt-q-err-msg">Couldn\'t load quota</span>' +
               '<a onclick="window.LumitureTopbar.rerender()">Retry</a></div>' +
             '</div>';
    }
    var rows = isPremium
      ? ['analyses', 'rightsizing'].map(function (k) { return _renderQuotaItem(k, {}, { unlimited: true }); }).join('')
      : items.map(function (k) { return _renderQuotaItem(k, u.quota[k] || {}); }).join('');
    // add-on 行（packs>0，Premium 不適用）；naming 對齊 PRD：單數 "AI Quota Add-on × N"
    var addon = (!isPremium && (u.addonPacks || 0) > 0)
      ? '<div class="lt-q-addon"><span class="material-symbols-outlined">auto_awesome</span>' +
          u.addonPacks + ' × AI Quota Add-ons Activated</div>'
      : '';
    return '<div class="lt-q">' + head + rows + addon + '</div>';
  }

  function _renderMenu(u) {
    var planName = _esc(u.plan) + ' Plan';
    var bannerStyle = PLAN_BANNER[u.plan] || PLAN_BANNER.Standard;
    var viewAs = u.canSwitchRole
      ? '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'View as Another Role\')">' +
          '<span class="material-symbols-outlined">sync_alt</span>View as Another Role</button>' +
        '<div class="lt-am-div"></div>'
      : '';
    var box = _renderQuotaBox(u);
    var quotaSection = box
      ? '<div class="lt-am-div"></div>' + box + '<div class="lt-am-div"></div>'
      : '<div class="lt-am-div"></div>';
    return '<div class="lt-am-backdrop" id="lt-am-backdrop" onclick="window.LumitureTopbar.closeMenu()"></div>' +
           '<div class="lt-am" id="lt-am" role="menu">' +
             '<div class="lt-am-plan" style="' + bannerStyle + '">' +
               '<span class="lt-am-plan-name">' + planName + '</span>' +
               '<span class="lt-am-plan-date">' + _esc(u.planDateRange) + '</span>' +
             '</div>' +
             '<div class="lt-am-id">' +
               '<div class="lt-am-id-name">' + _esc(u.name) + '</div>' +
               '<div class="lt-am-id-email">' + _esc(u.email) + '</div>' +
               '<span class="lt-am-chip"><span class="material-symbols-outlined">account_circle</span>' + _esc(u.role) + '</span>' +
             '</div>' +
             quotaSection +
             viewAs +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Profile\')">' +
               '<span class="material-symbols-outlined">person</span>Profile</button>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Settings\')">' +
               '<span class="material-symbols-outlined">settings</span>Settings</button>' +
             '<div class="lt-am-div"></div>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Log out\')">' +
               '<span class="material-symbols-outlined">logout</span>Log out</button>' +
           '</div>';
  }

  // ===== Mount / state =====
  var _menuOpen = false;

  function _render() {
    var mount = document.getElementById('lt-topbar');
    if (!mount) { console.warn('[lumiture-topbar] Mount point #lt-topbar not found'); return; }
    var u = _user();
    var icons = window.LUMITURE_TOPBAR_ICONS || DEFAULT_ICONS;
    mount.classList.add('lt-topbar');
    mount.innerHTML = icons.map(_renderIcon).join('') + _renderUserChip(u);
    var chip = document.getElementById('lt-tb-user');
    if (chip) chip.addEventListener('click', function (e) { e.stopPropagation(); _toggleMenu(); });
    _menuOpen = false;
  }

  function _menuHost() {
    var host = document.getElementById('lt-am-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'lt-am-host';
      document.body.appendChild(host);
    }
    return host;
  }

  function _openMenu() {
    var u = _user();
    _menuHost().innerHTML = _renderMenu(u);
    _menuOpen = true;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.add('is-open'); chip.setAttribute('aria-expanded', 'true'); }
  }
  function _closeMenu() {
    _menuHost().innerHTML = '';
    _menuOpen = false;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.remove('is-open'); chip.setAttribute('aria-expanded', 'false'); }
  }
  function _toggleMenu() { _menuOpen ? _closeMenu() : _openMenu(); }

  // Esc 關閉 menu
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && _menuOpen) _closeMenu();
  });

  // ===== Public API =====
  window.LumitureTopbar = {
    setUser: function (user) {
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, user || {});
      _render(); if (_menuOpen) _openMenu();
    },
    setRole: function (role) {
      var el = document.getElementById('lt-tb-user-role');
      if (el) el.textContent = role;
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, { role: role });
      if (_menuOpen) _openMenu();
    },
    setPlan: function (plan) {
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, { plan: plan });
      if (_menuOpen) _openMenu();
    },
    setQuota: function (q) {
      var cur = (window.LUMITURE_USER || {});
      window.LUMITURE_USER = Object.assign({}, cur, {
        quota: Object.assign({}, DEFAULT_USER.quota, cur.quota || {}, q || {}),
      });
      if (q && typeof q.addonPacks !== 'undefined') window.LUMITURE_USER.addonPacks = q.addonPacks;
      if (_menuOpen) _openMenu();
    },
    openMenu: _openMenu,
    closeMenu: _closeMenu,
    toggleMenu: _toggleMenu,
    rerender: function () { _render(); if (_menuOpen) _openMenu(); },
    _noop: function (label) { /* 展示用：Profile/Settings/Log out/View as Another Role 點擊佔位 */
      if (typeof window.LUMITURE_MENU_ACTION === 'function') window.LUMITURE_MENU_ACTION(label);
    },
  };

  // ===== INIT =====
  function _init() { _injectCSS(); _render(); }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else { _init(); }
})();

</script>

 *   2. 沒有 Billing Account 的 Project → 統一顯示在清單最底部，
 *      標頭顯示「Projects without Billing Account」

/* 原本寫在常駐 banner 裡的視角說明，改掛在 Group by 的 info icon 上。
 * 這支檔案沒有自製 tooltip 元件，既有的 Unlink Resource / Folder ID 都是用
 * 原生 title，所以這裡沿用同一個做法（Guideline 的深底 tooltip 規格等真的

const GROUPBY_HELP = 'Folder groups projects by your Google Cloud resource hierarchy, and selecting a folder selects everything inside it, including sub-folders. A folder can span more than one billing account, so folders are not shown in the Billing account grouping.';

/* unassignedTail = 尾端幾個標成「還沒指派」，模擬「當初整個資料夾都指派過，
 * 之後客戶又在 GCP 新增了幾個 project」這個真實情境。
 * 對應 API 既有但目前 Group List 沒用到的 GCPAvailableResourcesInfos.projects[].assigned */
function makeProjects(folderKey, count, baSplit, unassignedTail = 0){
  const seeds = SEED_PROJECTS[folderKey] || [];
  const out = [];
  for(let index=0;index<count;index++){
    const name = seeds[index] || `${folderKey.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${String(index+1).padStart(2,'0')}`;
    // platform 是唯一橫跨兩個帳單帳戶的資料夾（對應工程調查第四節第 2 點的發現）
    const parent = baSplit && index >= baSplit ? GCP_BILLING_ACCOUNTS[1] : GCP_BILLING_ACCOUNTS[0];
    out.push({
      id:`${folderKey}-p${index}`, name, resId:`${name}-${470000+index*137}`, parent,
      assigned: index < count - unassignedTail,
    });
  }
  return out;
}

/* ============================================================

 * 設計稿的 AWS 版（#19 / #19-1，Figma 11735:168403 / 11948:106601）用的是跟

 *   AWS   Management account → Account
 *   Azure Subscription → Resource group
 * Azure 在這份 canvas 上只有兩個空白的 Page Format frame、還沒設計，所以照
 * Kabin 的指示「參考 AWS 現況」，用同一個骨架換成 Azure 的名詞。
 * 資料夾是 GCP 才有的概念（AWS 的 Organizational Unit、Azure 的 Management
 * Group 是對應物，但這輪只做 GCP folder），所以另外兩朵雲沒有視角切換。
 * ============================================================ */
const AWS_MGMT_ACCOUNTS = [
  {id:'mgmt-prod', name:'corp-mgmt-prod'},

];

/* 扁平兩層的資源清單（沒有資料夾階層）。unassignedTail 的用意跟 GCP 一樣：
 * 模擬「當初指派過，之後客戶又在 console 開了新的」。 */
function makeFlatResources(keyPrefix, names, parents, parentSplit, unassignedIdx, makeId){
  const pending = new Set(unassignedIdx);
  return names.map((name, index)=>({
    id:`${keyPrefix}-r${index}`,
    name,
    resId:makeId(name, index),
    parent: parentSplit && index >= parentSplit ? parents[1] : parents[0],
    /* 未指派的刻意跨兩個上層（不是取尾端連續幾個），否則選單只會列出一個
     * 上層，看不出「上層 → 資源」的分組長什麼樣 */
    assigned: !pending.has(index),
  }));
}

    parentLabel:'Billing account', parentIcon:'account_balance_wallet',

  aws: {

    noun:'account', nounPlural:'accounts',
    /* AWS 兩層都是 account（management account → account），照通用規則拼會

    searchHint:'accounts',

    groups:()=>AWS_MGMT_ACCOUNTS,
    folders:()=>[], noFolder:()=>[], orphans:()=>[],
    flat:()=>AWS_PICK_ACCOUNTS,
  },
  azure: {

function cfg(){ return PICKER[assign.cloud] || PICKER.gcp; }
/* GCP 的資源散在資料夾樹 + 沒資料夾 + 沒帳單帳戶三處；另外兩朵雲是一份扁平清單 */
function pickerResources(){
  const c = cfg();
  if(c.flat) return c.flat();
  let out = [];
  walkFolders(c.folders(), node=>{ out = out.concat(node.projects); });
  return out.concat(c.noFolder()).concat(c.orphans());
}

/* 極端深度情境用的合成樹（GCP 上限 10 層）。真實客戶只有 2 層，
 * 這棵樹純粹用來確認縮排在官方上限下不會壞版。 */
function makeDeepTree(){
  const names = ['corp','platform-ops','infra','prod','eu-west','payments','ledger','settlement','fraud-review','archive']; // 10 層 = GCP 官方上限
  let node = null;
  for(let index=names.length-1; index>=0; index--){
    /* 第 4 個參數 unassignedTail 給滿，讓這棵合成樹的專案全部是「未指派」。
     * 2026-09-08 改成「選單只列未指派」之後，這裡沒帶這個參數，整棵深樹
     * 因為全部 assigned 而被過濾掉、極端深度情境等於是空的——那次我只用
     * 一般情境驗證，沒回頭跑這個 demo，所以壞了兩天沒被發現。 */
    const count = index===names.length-1 ? 4 : 1;
    node = {id:`deep-${index}`, name:names[index], folderId:String(500000000000+index*10193), projects:makeProjects(`deep-${names[index]}`, count, 0, count), children:node?[node]:[]};
  }
  return node;
}

function walkFolders(nodes, fn, depth=0, path=[]){
  nodes.forEach(node=>{ fn(node, depth, path); walkFolders(node.children, fn, depth+1, path.concat(node.name)); });
}
function allProjectsOf(node){
  let out = node.projects.slice();
  node.children.forEach(child=>{ out = out.concat(allProjectsOf(child)); });
  return out;
}
function everyProject(){ return pickerResources(); }

/* ---------- sorting (matches FE: TanStack Table sort baked into VirtualizedTable,
 * fixed here to also show the Guideline's default grey arrow_upward per the
 * gap the FE hasn't patched yet — see PORTFOLIO_LOG) ---------- */
function relTimeToDays(s){
  if(!s) return 999999;
  if(/today/i.test(s)) return 0;
  if(/yesterday/i.test(s)) return 1;
  const m = s.match(/(\d+)\s*(hour|day|week|month|year)/i);
  if(!m) return 999999;
  const n = +m[1], unit = m[2].toLowerCase();
  const mult = unit==='hour'?(1/24):unit==='day'?1:unit==='week'?7:unit==='month'?30:365;
  return n*mult;
}
function dateToTs(s){
  const m = String(s).match(/(\d+)\/(\d+)\/(\d+)/);
  if(!m) return 0;
  return new Date(+m[3], +m[2]-1, +m[1]).getTime();
}
function sortIconHtml(tableKey,colKey){
  const s = state.sort[tableKey];
  const active = s.key===colKey;
  const color = active ? 'var(--lt-color-primary)' : 'var(--lt-grey-300)';
  const name = (active && s.dir===-1) ? 'arrow_downward' : 'arrow_upward';
  return `<span class="material-symbols-outlined sort-ic" style="color:${color}">${name}</span>`;
}
function sortHeader(label, tableKey, colKey, centered){
  return `<th class="sortable${centered?' center':''}" onclick="toggleSort('${tableKey}','${colKey}')"><span class="th-sort">${label}${sortIconHtml(tableKey,colKey)}</span></th>`;
}
function toggleSort(tableKey,colKey){
  const s = state.sort[tableKey];
  if(s.key!==colKey){ s.key=colKey; s.dir=1; }
  else if(s.dir===1){ s.dir=-1; }
  else { s.key=null; s.dir=0; }
  render();
}
function sortRows(rows, tableKey, accessors){
  const s = state.sort[tableKey];
  if(!s.key || !accessors[s.key]) return rows;
  const acc = accessors[s.key];
  return [...rows].sort((a,b)=>{
    const va=acc(a), vb=acc(b);
    if(va<vb) return -1*s.dir;
    if(va>vb) return 1*s.dir;
    return 0;
  });
}

/* Column ratios measured off the Figma table (1004px content width) so the table
 * fills the card exactly instead of auto-sizing past it. */
function groupCols(showTier2, showAction){
  const widths = showTier2
    ? (showAction ? [18.5,14,14.5,13.5,16.5,14,9] : [20,15.5,16,15,18,15.5])
    : (showAction ? [22,15,15,22,15,11]           : [24,17,17,25,17]);
  return '<colgroup>'+widths.map(w=>'<col style="width:'+w+'%">').join('')+'</colgroup>';
}

/* ---------- renderers: list page ---------- */
function skeletonRows(cols){
  return Array.from({length:8}).map(()=>'<tr class="skel-row">'+Array.from({length:cols}).map(()=>'<td><div class="skel" style="height:16px;width:'+(60+Math.random()*40|0)+'%"></div></td>').join('')+'</tr>').join('');
}
function groupTable(groups, opts){
  const showAction = opts.editable;
  const tableKey = opts.sortTable;
  const colDefs = opts.showTier2
    ? [['Group Name','name'],['Resource','resource'],['Tier 2 Group','tier2'],['Last Updated','lastUpdated'],['Creator','creator'],['Time Created','created']]
    : [['Group Name','name'],['Resource','resource'],['Last Updated','lastUpdated'],['Creator','creator'],['Time Created','created']];
  const accessors = {name:g=>g.name.toLowerCase(), resource:g=>g.resource, tier2:g=>g.tier2, lastUpdated:g=>relTimeToDays(g.lastUpdated), creator:g=>g.creator.toLowerCase(), created:g=>dateToTs(g.created)};
  if(state.pageState==='loading'){
    const headCells = colDefs.map(([label])=>'<th>'+label+'</th>').join('') + (showAction?'<th>Action</th>':'');
    return `<div class="table-wrap"><table>${groupCols(opts.showTier2, showAction)}<thead><tr>${headCells}</tr></thead><tbody>${skeletonRows(colDefs.length+(showAction?1:0))}</tbody></table></div>`;
  }
  if(!groups.length){
    return `<div class="empty-state small error"><div><span class="material-symbols-outlined">group_off</span>
      <p class="empty-title">No Groups Yet</p>
      <p class="empty-copy">It seems like there are no groups created yet.
Please create a new group or contact your administrator for assistance.</p>
      ${actions().createGroup?'<button class="btn btn-pri" onclick="deferredAction(\'Create Group\')"><span class="material-symbols-outlined">add</span>Create Group</button>':''}
      </div></div>`;
  }
  const rows = sortRows(groups, tableKey, accessors).map(g=>{
    const tds = [
      `<td class="cell-ellipsis">${esc(g.name)}</td>`,
      `<td><button class="link-btn" onclick="event.stopPropagation();goToTab('${opts.tier===2?'t2':'t1'}','${opts.t1IdForRow||g.id}','${opts.tier===2?g.id:''}','resources')">${g.resource} Resource${g.resource===1?'':'s'}</button></td>`,
    ];
    if(opts.showTier2) tds.push(`<td><button class="link-btn" onclick="event.stopPropagation();openDetail(1,'${g.id}','tier-2-groups')">${g.tier2} Group${g.tier2===1?'':'s'}</button></td>`);
    tds.push(`<td>${esc(g.lastUpdated)}</td>`, `<td class="cell-ellipsis">${esc(g.creator)}</td>`, `<td>${esc(g.created)}</td>`);
    if(showAction){
      tds.push(`<td><div class="actions-cell">
        <button class="btn-icon" data-testid="edit-group-button" onclick="event.stopPropagation();deferredAction('Edit Group')" title="Edit Group"><span class="material-symbols-outlined">edit</span></button>
        ${actions().removeGroup?'<button class="btn-icon danger" data-testid="remove-group-button" onclick="event.stopPropagation();deferredAction(\'Remove Group\')" title="Remove Group"><span class="material-symbols-outlined">delete</span></button>':''}
        </div></td>`);
    }
    const clickTarget = opts.tier===2 ? `openDetail(2,'${opts.t1IdForRow}','${g.id}')` : `openDetail(1,'${g.id}')`;
    return `<tr class="clickable" onclick="${clickTarget}">${tds.join('')}</tr>`;
  }).join('');
  const headCells = colDefs.map(([label,key])=>sortHeader(label, tableKey, key, false)).join('') + (showAction?'<th>Action</th>':'');
  return `<div class="table-wrap"><table>${groupCols(opts.showTier2, showAction)}<thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

      <button class="link-btn" style="color:var(--lt-color-text-secondary)" onclick="deferredAction('Learn More About Authorization and Resource Assignment')">ⓘ Learn More About Authorization and Resource Assignment</button>

function openDetail(tier, t1id, t2id){
  state.view='detail'; state.tier=tier; state.t1Id=t1id; state.t2Id=t2id||null;
  state.tab = arguments[3] || 'group-members'; state.cloud='gcp'; state.selectedResources={};
  render();
}
function backToList(){ state.view='list'; render(); }

function tabsHeader(group, tier){
  const memberCount = usersFor(group.id).length;
  const resourceCount = group.resource;
  const tabs = [ {id:'group-members', label:`Group Members (${memberCount})`} , {id:'resources', label:`Resources (${resourceCount})`} ];
  if(tier===1) tabs.push({id:'tier-2-groups', label:`Tier 2 Groups (${group.tier2})`});
  return `<div class="tabs-row"><div class="tabs">${tabs.map(t=>`<button class="tab ${state.tab===t.id?'active':''}" onclick="state.tab='${t.id}';render()">${t.label}</button>`).join('')}</div></div>`;
}

function membersTab(group){
  if(state.pageState==='loading'){
    return `<p class="section-copy">You can explore the details of this group here, including members, resources, and subgroups belonging to this group.</p>
      <div class="table-wrap"><table><thead><tr><th>User Name</th><th>Email</th><th class="center">Role</th><th class="center">Active Status</th><th class="center">Last Login</th></tr></thead><tbody>${skeletonRows(5)}</tbody></table></div>`;
  }
  const users = usersFor(group.id);
  const showAction = actions().editUser || actions().removeUser;
  if(!users.length){
    return `<div class="empty-state small error"><div><span class="material-symbols-outlined">person_off</span>
      <p class="empty-title">No Users Yet</p>
      <p class="empty-copy">There are currently no users assigned to this group.
Invite users to the group or check with your administrator if assistance is needed.</p></div></div>`;
  }
  const colDefs = [['User Name','name',false],['Email','email',false],['Role','role',true],['Active Status','active',true],['Last Login','lastLogin',true]];
  const accessors = {name:u=>u.name.trim().toLowerCase(), email:u=>u.email.toLowerCase(), role:u=>u.role, active:u=>u.active?1:0, lastLogin:u=>relTimeToDays(u.lastLogin)};
  const rows = sortRows(users, 'members', accessors).map(u=>`<tr>
      <td class="cell-ellipsis">${esc(u.name.trim()||'--')}</td>
      <td class="cell-ellipsis">${esc(u.email)}</td>
      <td class="center">${u.role.charAt(0).toUpperCase()+u.role.slice(1)}</td>
      <td class="center"><span class="status-text ${u.active?'':'inactive'}">${u.active?'Active':'Inactive'}</span></td>
      <td class="center">${esc(u.lastLogin)}</td>
      ${showAction?`<td class="center"><div class="actions-cell">
        ${actions().editUser?'<button class="btn-icon" data-testid="edit-user-button" onclick="deferredAction(\'Edit User\')" title="Edit"><span class="material-symbols-outlined">edit</span></button>':''}
        ${actions().removeUser?'<button class="btn-icon danger" data-testid="delete-user-button" onclick="deferredAction(\'Remove User\')" title="Remove"><span class="material-symbols-outlined">delete</span></button>':''}
        </div></td>`:''}
    </tr>`).join('');
  const headCells = colDefs.map(([label,key,centered])=>sortHeader(label,'members',key,centered)).join('') + (showAction?'<th class="center">Action</th>':'');
  const memberCols = showAction
    ? '<colgroup><col style="width:22%"><col style="width:26%"><col style="width:12%"><col style="width:14%"><col style="width:15%"><col style="width:11%"></colgroup>'
    : '<colgroup><col style="width:25%"><col style="width:30%"><col style="width:13%"><col style="width:16%"><col style="width:16%"></colgroup>';
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px">
      <p class="section-copy">You can explore the details of this group here, including members, resources, and subgroups belonging to this group.</p>
      ${actions().inviteUser?'<button class="btn btn-pri" onclick="deferredAction(\'Invite User\')"><span class="material-symbols-outlined">person_add</span>Invite User</button>':''}
    </div>
    <div class="table-wrap"><table>${memberCols}<thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

  azure:{label:'Azure', col1:'Resource Group', col2:'Subscription (Resource Group belongs to)', dot:'#0078d4'},
};
