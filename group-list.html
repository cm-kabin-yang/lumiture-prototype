    }
    /* v3：每朵雲的 Resources 分成兩個子分頁（#03-3 / #03-4）——
     *   GCP   Project | Label
     *   AWS   Account | Tag
     *   Azure Resource Group | Label（照「Please Refer to Google Cloud」註記）
     * 兩個子分頁各自有自己的表格、勾選集合、Assign Resource 彈窗（Project 開 v2 的
     * folder picker、Label 開 #56）。Unlink 走同一個 #20 彈窗。 */
    const sub = state.resSub[state.cloud] || 'primary';
    const terms = TAG_TERMS[state.cloud];
    const projects = resourcesFor(group.id, state.cloud);
    const tags = assignedTagsFor(group.id, state.cloud);
    const bucketKey = sub==='tag' ? state.cloud+'-tag' : state.cloud;
    const rowsData = sub==='tag' ? tags : projects;
    const selected = state.selectedResources[bucketKey] || {};
    const selectedIds = rowsData.map(r=>r.id).filter(id=>selected[id]);
    const canRemove = actions().removeResource;
    const canAssign = actions().assignResource;
    const allOn = rowsData.length>0 && selectedIds.length===rowsData.length;
    const someOn = selectedIds.length>0 && !allOn;
    const idsCsv = rowsData.map(r=>"'"+r.id+"'").join(',');
    let tableBlock;
    if(!rowsData.length){
      tableBlock = `<div class="empty-state"><div><span class="material-symbols-outlined">add_link</span>
        <p class="empty-title">No Resources Yet</p>
        <p class="empty-copy">No resources have been assigned to this group yet.
Please assign new resources or reach out to your administrator for help.</p></div></div>`;
    } else if(sub==='tag'){
      const tagAccessors = {key:r=>r.key.toLowerCase(), value:r=>r.value.toLowerCase(), parent:r=>r.parent.name.toLowerCase()};
      const rows = sortRows(tags, 'resources', tagAccessors).map(r=>`<tr class="${selected[r.id]?'selected':''}">
          <td>${canRemove?checkboxHtml(!!selected[r.id], `toggleResource('${r.id}','${bucketKey}')`):''}</td>
          <td class="cell-ellipsis">${esc(r.key)}</td>
          <td class="cell-ellipsis">${esc(r.value)}</td>
          <td class="cell-double"><div class="l1">${esc(r.parent.name)}</div><div class="l2">${esc(r.parent.id)}</div></td>
          <td><button class="btn-icon ${canRemove?'danger':''}" ${canRemove?'':'disabled'} onclick="openUnlinkDialog('${group.id}','${state.cloud}',['${r.id}'],'${bucketKey}')" title="Unlink Resource"><span class="material-symbols-outlined">link_off</span></button></td>
        </tr>`).join('');
      /* #03-5：表頭第一格是全選 checkbox（部分勾選時顯示 mixed） */
      tableBlock = `<div class="table-wrap"><table><colgroup><col style="width:48px"><col style="width:22%"><col style="width:22%"><col><col style="width:80px"></colgroup><thead><tr>
          <th>${canRemove?checkboxHtml(allOn, `toggleAllResources('${bucketKey}',[${idsCsv}])`, someOn):''}</th>
          ${sortHeader(terms.colKey,'resources','key')}${sortHeader(terms.colValue,'resources','value')}${sortHeader(terms.colParent,'resources','parent')}<th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    } else {
      const resAccessors = {col1:r=>r.name.toLowerCase(), col2:r=>r.parentName.toLowerCase()};
      const rows = sortRows(projects, 'resources', resAccessors).map(r=>`<tr class="${selected[r.id]?'selected':''}">
          <td>${canRemove?checkboxHtml(!!selected[r.id], `toggleResource('${r.id}','${bucketKey}')`):''}</td>
          <td class="cell-double"><div class="l1">${esc(r.name)}</div><div class="l2">${esc(r.subId)}</div></td>
          <td class="cell-double"><div class="l1">${esc(r.parentName)}</div><div class="l2">${esc(r.parentId)}</div></td>
          <td><button class="btn-icon ${r.canRemove&&canRemove?'danger':''}" ${!(r.canRemove&&canRemove)?'disabled':''} onclick="openUnlinkDialog('${group.id}','${state.cloud}',['${r.id}'],'${bucketKey}')" title="Unlink Resource"><span class="material-symbols-outlined">link_off</span></button></td>
        </tr>`).join('');
      tableBlock = `<div class="table-wrap"><table><colgroup><col style="width:48px"><col style="width:42%"><col><col style="width:80px"></colgroup><thead><tr>
          <th>${canRemove?checkboxHtml(allOn, `toggleAllResources('${bucketKey}',[${idsCsv}])`, someOn):''}</th>
          ${sortHeader(CLOUD_META[state.cloud].col1,'resources','col1')}${sortHeader(CLOUD_META[state.cloud].col2,'resources','col2')}<th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    const seg = `<div class="seg" role="tablist">
        <button class="seg-btn ${sub==='primary'?'active':''}" role="tab" aria-selected="${sub==='primary'}" onclick="setResSub('primary')">${CLOUD_META[state.cloud].col1}<span class="seg-cnt">${projects.length}</span></button>
        <button class="seg-btn ${sub==='tag'?'active':''}" role="tab" aria-selected="${sub==='tag'}" onclick="setResSub('tag')">${esc(terms.tab)}<span class="seg-cnt">${tags.length}</span></button>
      </div>`;
    /* #03-5：Unlink Resource 是藍色 outline（跟 Assign Resource 同一組主色），不是紅色。
     * v2 做成 danger 紅框是設計端自己加的，這裡改回設計稿。 */
    const assignClick = sub==='tag' ? `openTagAssign('${state.cloud}')` : `openAssign('${state.cloud}')`;
    return pillTabs(true) + `
      <div class="res-toolbar">
        <div class="res-toolbar-left">${seg}
          <div class="search-box"><span class="material-symbols-outlined">search</span><input placeholder="Search resources" oninput="showToast('Filtering… (prototype does not filter mock data)')"></div>
        </div>
        <div class="res-toolbar-actions">
          ${(canRemove && selectedIds.length)?`<button class="btn btn-out" onclick="openUnlinkDialog('${group.id}','${state.cloud}',[${selectedIds.map(id=>"'"+id+"'").join(',')}],'${bucketKey}')"><span class="material-symbols-outlined">link_off</span>Unlink Resource</button>`:''}
          ${canAssign?`<button class="btn btn-pri" data-testid="assign-resource-button" onclick="${assignClick}"><span class="material-symbols-outlined">add_link</span>Assign Resource</button>`:''}
        </div>
      </div>
      ${tableBlock}`;
  };
  return `<p class="section-copy" style="margin-bottom:16px">You can assign cloud resources to this group here.</p>${body()}`;
}

function renderDetail(){
  const isT2 = state.tier===2;
  const t1 = findT1(state.t1Id);
  const group = isT2 ? findT2(state.t1Id, state.t2Id) : t1;
  if(!group){ state.view='list'; return renderList(); }
  const backHref = isT2 && state.role==='t2-member' ? null : null; // both roles route back to list in this prototype scope
  /* #06 註記：麵包屑每項最多約 135px、超過顯示 …（.crumb-item） */
  const crumb = isT2
    ? `<span class="crumb-item">${esc(ORG_NAME)}</span> / <span class="crumb-item" title="${esc(t1.name)}">${esc(t1.name)}</span>`
    : `<span class="crumb-item">${esc(ORG_NAME)}</span> /`;
  const loading = state.pageState==='loading';
  let body;
  if(state.tab==='group-members') body = membersTab(group);
  else if(state.tab==='resources') body = resourcesTab(group);

    const list = tier2GroupsFor(t1);

  return `<button class="go-back" onclick="backToList()"><span class="material-symbols-outlined">arrow_back</span><span class="go-back-label">Back to Group List</span></button>
    <div class="card">
      <div class="crumb">${crumb}</div>
      <div class="section-head" style="align-items:center;margin-bottom:20px">
        <h1 style="font-size:24px;font-weight:700;margin:0">${esc(group.name)}</h1>
        <div style="display:flex;gap:8px">
          ${actions().editGroup?`<button class="btn btn-out" ${loading?'disabled':''} onclick="openEditGroup('${group.id}',${isT2?`'${t1.id}'`:'null'})"><span class="material-symbols-outlined">edit</span>Edit Group</button>`:''}
          ${actions().removeGroup?`<button class="btn btn-out danger" ${loading?'disabled':''} onclick="openRemoveGroup('${group.id}',${isT2?`'${t1.id}'`:'null'})"><span class="material-symbols-outlined">delete</span>Remove Group</button>`:''}
        </div>
      </div>
      ${tabsHeader(group, isT2?2:1)}
      ${state.tab==='tier-2-groups' ? `<div class="section-head">
        <div>
          <h2>Tier 2 Group List (${t1.tier2})</h2>
          <p>You can quickly view the Tier 2 group information here, and click on each group to check details such as group members.</p>
        </div>
        ${actions().createGroup?`<button class="btn btn-pri" ${loading?'disabled':''} onclick="openCreateGroup(2)"><span class="material-symbols-outlined">add</span>Create Group</button>`:''}
      </div>` : ''}
      ${body}
      ${learnMoreHtml(true)}
    </div>`;
}
function toggleResource(id, bucket){
  bucket = bucket || state.cloud;
  if(!state.selectedResources[bucket]) state.selectedResources[bucket]={};
  const list = state.selectedResources[bucket];
  list[id] = !list[id];
  render();
}
/* 表頭全選（#03-5）：全開就全關，否則全開 */
function toggleAllResources(bucket, ids){
  const list = state.selectedResources[bucket] || {};
  const allOn = ids.length>0 && ids.every(id=>list[id]);
  state.selectedResources[bucket] = allOn ? {} : Object.fromEntries(ids.map(id=>[id,true]));
  render();
}


/* ============================================================
 * Assign Resource — folder tree picker
 * 骨架採「資料夾 → 專案」，帳單帳戶降級成篩選器（見
 * specs/2026-09-03-group-list-folder-view-ux-response.md 第一節）。
 * 走「帳單帳戶 → 資料夾 → 專案」的話，橫跨兩個 BA 的資料夾會因此
 * 出現兩次，使用者勾一個會以為選完、實際只拿到一半。
 * ============================================================ */
const assign = {
  open:false,
  host:'modal',        // modal | wizard —— 選單被誰裝著（v3：Create Group 第 3/4 步內嵌同一個選單）
  cloud:'gcp',         // gcp | aws | azure，決定名詞與資料來源
  /* component = 完全照 libs/lumiture-ui 的 GroupedMultiSelect（Cost Dashboard
   *             的 Tag / Label Value 下拉）語言，直接延伸到多層
   * component-fix = 同上，只改兩個數字：縮排步進 32→16、箭頭從右移到左。
   *             其餘（藍底 band、單行 name (id)、無引導線、無資料夾 icon、
   *             不 sticky）完全不動，對現有九個消費端影響最小
   * tree      = 我原本做的樹狀版（左側箭頭、縮排引導線、巢狀 sticky）
   * 放兩套是為了讓 Kabin 實際感受「既有元件延伸到多層」會遇到什麼，
   * 而不是只讀我的文字分析。Demo FAB 可即時切換。 */
  pickerStyle:'component-fix',   // 2026-09-10 Kabin 定案走這個版本
  hasFolders:true,     // org 完全沒開資料夾時退回現行的 BA → Project 兩層
  /* false ＝ 切 Group by 就清掉已勾選（開發團隊 2026-09-10 立場，RD 出兩支
   * 獨立 API）。清掉時會在彈窗裡告知並給 Undo，不靜默。true ＝ 保留（UX
   * 建議），Demo FAB 可切。 */
  /* true ＝ 縮排封頂在第 4 層 + 深層用祖先路徑補（2026-09-10 預設）。
   * false ＝ 原本的線性縮排，留著對照「波動拳」長什麼樣。 */
  /* 是否授權了多個 GCP org。true 才長出 org 區段標頭，單一 org 畫面完全不變。 */
  multiOrg:false,
  /* 深層樹的路徑策略，Kabin 2026-09-11 問「只有第五層後有路徑會不會很怪」而做的
   * 三個可切換對照：
   *   'deep'  = 現況。縮排封頂後才出現路徑
   *   'all'   = 每一列都顯示緊鄰上層（語言一致，但淺層全是冗餘）
   *   'micro' = 封頂後改用 4px 微縮排維持鏈狀感，路徑只留給同名／搜尋
   * 真實客戶只有 2-3 層，三者在真實情境下畫面完全相同，差別只在第五層之後。 */
  pathMode:'deep',
  indentCap:true,
  keepSelection:false,
  clearedSelection:null,   // Undo 用，切視角清掉的那一份
  clearedCount:0,
  loading:false,
  expanded:{},
  selected:{},
  search:'',
  groupBy:'ba',       // ba | folder —— 預設維持現行的帳單帳戶視角，Folder 是新增的選項。
                      // 選取單位是專案、分組只是呈現，所以切換不會弄丟已勾的東西
};
let assignSearchTimer;
let assignFetchTimer;

/* ⚠️ 這個彈窗只列「尚未被指派的資源」，依設計稿註記
 * （Figma 11735:168385「僅顯示『尚未被 assign 的資源』」）。
 * 移除是另一條路：Resources 表格批次勾選 → [Unlink Resource] → 彈窗 #20
 * （Figma 12801:76215），T1 還會先跑 group-check 列出受影響的 T2 群組。
 * 所以這裡沒有取消指派，也不該有。
 *
 * 實作上有一個必須注意的點：PUT platforms/{platform}/resources/assign
 * 是「覆寫整份清單」不是「追加」——
 *   - backend/api/user.md R5：Cleans existing resource perms, then assigns new
 *     ones. For tier-one groups, also cleans removed resources from child
 *     tier-two groups
 *   - domain/identity/organization.md（Resource Assignment Flow）：
 *     PUT assign - replaces full assignment set
 * 所以畫面只顯示未指派的、送出時必須帶上「已指派的 + 這次勾的」。
 * 只送這次勾的會把群組原本的資源全部洗掉，T1 還連帶清掉子 T2。
 *
 * ⚠️ 現況 FE 兩件事都沒做：GCPAssignResourcesContent 完全沒讀 assigned
 * （所以沒過濾、也沒辦法在送出時補上既有的），GCPAssignResources 每次
 * 開啟都是 useState([])。詳見 specs 的 §8.11。 */

/* 選單的狀態重置抽成 startAssignPicker()，因為 v3 起有兩個宿主：
 *   modal  = Resources 分頁的 Assign Resource 彈窗（v2 原本的用法）
 *   wizard = Create Group 第 3 / 4 步（#31 / #37）內嵌同一個選單
 * renderAssign() 依 assign.host 決定重畫哪一個外殼，選取 / 搜尋 / 分組邏輯完全共用。 */
function startAssignPicker(cloud){
  assign.cloud = cloud || state.cloud || 'gcp';
  assign.loading = true;
  assign.searching = false;
  assign.clearedSelection = null;
  assign.clearedCount = 0;
  /* 照設計稿：預設收合，先看到第一層資料夾，展開才往下看。 */
  assign.expanded = {};
  assign.selected = {};
  assign.forceFail = false;
  assign.search = '';
  assign.typed = null;
  /* 預設維持現行的帳單帳戶視角（既有客戶操作不變），資料夾是切過去的第二個視角。 */
  assign.groupBy = 'ba';
  setTimeout(()=>{ assign.loading = false; renderAssign(); }, 500);
}
function openAssign(cloud){
  startAssignPicker(cloud);
  assign.host = 'modal';
  assign.open = true;
  renderAssign();
}
function closeAssign(){ assign.open = false; renderAssign(); }

/* 帳單帳戶篩選只縮小「看得到的專案」，不改變樹的骨架 */
function projectVisible(project){
  if(project.assigned) return false;   // 已指派的不進這個選單（設計稿註記）
  if(!assign.search) return true;
  const term = assign.search.toLowerCase();
  /* 搜尋範圍＝「當下視角的分組軸」＋「專案本身」（2026-09-10 Kabin 定義）：
   *   資料夾視角 → 資料夾名（folderMatches）＋ 專案 name / ID
   *   帳單帳戶視角 → 帳單帳戶名（parent）＋ 專案 name / ID
   * 已知取捨：資料夾視角的專案列右邊掛著帳單帳戶 chip，但那個名稱在這個視角
   * 搜不到。看得見卻搜不到會讓人困惑，不過反過來（兩個視角都搜全部欄位）會讓
   * 結果出現「不知道為什麼命中」的列，兩害相權取這邊，規則也比較講得清楚。 */
  const hitSelf = projectLabel(project).toLowerCase().includes(term)
    || project.resId.toLowerCase().includes(term);
  if(hitSelf) return true;
  return assign.groupBy === 'ba' && project.parent.name.toLowerCase().includes(term);
}
/* 一般情況只比對資料夾名稱——使用者要找 infra 就打 infra，**不必打整條路徑**。
 * PM 擔心「顯示路徑會不會逼使用者打 corp/platform/infra 才搜得到」：不會，顯示
 * 跟查詢是兩件事，路徑只回答「這是哪一個 infra」。
 * 但工程師確實喜歡用路徑找東西，所以加一個漸進式的支援：**查詢字串裡有 `/` 才
 * 切成路徑比對**（比對 `祖先/.../自己`）。沒人被迫打斜線，想用的人打得到，
 * 跟 Gmail 的 `from:` 是同一種設計——強力功能靠語法 opt-in，不改變預設行為。 */
function folderMatches(node){
  if(!assign.search) return false;
  const term = assign.search.toLowerCase();
  if(term.includes('/')){
    if(!FOLDER_PATHS) buildFolderPathIndex();
    const full = (FOLDER_PATHS.get(node.id) || []).concat(node.name).join('/').toLowerCase();
    /* 空白容錯：使用者可能照畫面打「platform / staging」 */
    return full.includes(term.replace(/\s*\/\s*/g, '/'));
  }
  return node.name.toLowerCase().includes(term);
}
/* 資料夾自己命中搜尋時，底下的專案整批留著，不然搜到資料夾卻看不到內容 */
function visibleProjectsOf(node, inheritedMatch){
  const keepAll = inheritedMatch || folderMatches(node);
  const own = node.projects.filter(project => keepAll ? inFolderScope(project) : projectVisible(project));
  let total = own.length;
  node.children.forEach(child=>{ total += visibleProjectsOf(child, keepAll).length; });
  return keepAll ? allProjectsOf(node).filter(inFolderScope) : (function(){
    let acc = own.slice();
    node.children.forEach(child=>{ acc = acc.concat(visibleProjectsOf(child, false)); });
    return acc;
  })();
}
function nodeHasVisible(node){ return visibleProjectsOf(node, false).length > 0 || folderMatches(node); }

/* 這個選單的可選範圍：未指派 + 通過帳單帳戶篩選 */
function inFolderScope(project){ return !project.assigned; }
function selectedIn(projects){ return projects.filter(project=>assign.selected[project.id]).length; }
/* Demo 用：三種指派狀態。mixed = mock 原始值（當初指派過、之後 GCP 又長出新專案）， 
 * none = 第一次指派（全部可選），all = 全部都指派過（提示不出現） */
let ASSIGNED_SNAPSHOT = null;
function setAssignedMode(mode){
  const projects = everyProject();
  if(!ASSIGNED_SNAPSHOT) ASSIGNED_SNAPSHOT = new Map(projects.map(project=>[project.id, project.assigned]));
  projects.forEach(project=>{
    project.assigned = mode==='none' ? false : mode==='all' ? true : ASSIGNED_SNAPSHOT.get(project.id);
  });
  assign.selected = {};
}
function everyUnassigned(){ return everyProject().filter(project=>!project.assigned); }
/* 父層勾選框「全選」跟畫面上實際看得到的列，之前是兩個不同的集合：
 * 顯示用 visibleProjectsOf()（有搜尋時只算搜到的），但點擊全選卻是
 * selectableOf()（不管有沒有搜尋，永遠是整個資料夾底下全部）。
 * 後果：搜尋只篩出 1 個子項目時，勾這個資料夾的全選會連同畫面上看不到
 * 的其他 N 個一起選走，「16 個裡勾了 14 個」這種結果就是這樣來的。
 * 修法：全選的範圍一律用 visibleProjectsOf()，跟畫面上排出來的列一致。
 * 沒有搜尋時 visibleProjectsOf(node,false) 就等於原本 selectableOf(node)，
 * 行為不變。 */
function toggleFolder(nodeId){
  forgetClearedNotice();
  const node = findFolder(nodeId);
  if(!node) return;
  toggleScope(visibleProjectsOf(node, false));
}
/* 使用者一旦重新勾東西就代表已經往前走了，Undo 的意義消失，提示收掉。 */
function forgetClearedNotice(){
  assign.clearedSelection = null;
  assign.clearedCount = 0;
}
function toggleProject(projectId){
  forgetClearedNotice();
  if(assign.selected[projectId]) delete assign.selected[projectId]; else assign.selected[projectId]=true;
  renderAssign();
}
/* 父層勾選框：全開就全關、否則全開 */
function toggleScope(projects){
  const allOn = projects.length>0 && projects.every(project=>assign.selected[project.id]);
  projects.forEach(project=>{ if(allOn) delete assign.selected[project.id]; else assign.selected[project.id]=true; });
  renderAssign();
}
/* 展開一個資料夾就把它底下整條子樹一起展開，收合也一起收。理由：預設收合的
 * 前提下，如果一次只開一層，要看到 GCP 上限 10 層得點九次，中間每一層都只有
 * 一個子資料夾、沒有東西可以判斷，那九下是純粹的操作稅。點一下看到整條路徑，
 * 使用者才能一眼判斷這個資料夾底下到底有什麼。收合對稱處理，否則收起來再
 * 打開會殘留上次的展開狀態。 */
function toggleExpand(nodeId){
  const open = !assign.expanded[nodeId];
  assign.expanded[nodeId] = open;
  const node = findFolder(nodeId);
  if(node) walkFolders(node.children, child=>{ assign.expanded[child.id] = open; });
  renderAssign();
}
function findFolder(nodeId){
  let found = null;
  walkFolders(FOLDER_TREE, node=>{ if(node.id===nodeId) found = node; });
  return found;
}
/* 團隊 2026-09-10 回饋「巢狀搜尋可能效能差 → 需要 skeleton」，時序刻意這樣排：
 *   打字中：什麼都不做。debounce 期間就閃 skeleton 的話，每打一個字閃一次，
 *           比慢更難用。
 *   停手 1000ms：送出查詢，只有清單區換成 skeleton（工具列跟底部計數不動，
 *           不然整個彈窗會抖，使用者會以為彈窗重開了）。
 *   結果回來：換成清單。demo 用 SEARCH_FETCH_MS 模擬，真實情況是 API 往返。
 * 注意 skeleton 是承認慢、不是解決慢：真正的解法是 debounce（已做）＋ 後端索引。
 * 實際是否需要這段等待要看 RD 給的數字（Dcard 是 2-3 層、88 個專案，
 * react-window 本來就吃得下），所以 demo 值故意壓短。
 *
 * ⚠️ 2026-09-11 debounce 數值改source：原本 500ms 只是「沿用現行 Resources
 * 表格搜尋（FE ResourcesSearch）」的暫定值，`specs/2026-09-10-assign-picker-
 * design-notes.md` 自己都還標著「可直接貼 Figma」──代表這個數字從來沒有
 * 真的進過設計稿。跟 rightsizing／rate-optimization 那邊的 debounce 一比對，
 * 那邊是查證過 Figma 節點 8117:40065 的文字註記「停止輸入約一秒後才觸發」，
 * 有設計稿背書。Kabin 定的優先序是設計稿 > 前端既有值，所以這裡改採
 * 1000ms 對齊 rightsizing，不再抄 FE 現況。design notes 那份文件也一併改了，
 * 之後真的要貼 Figma 時不會把已經作廢的理由帶過去。 */
const ASSIGN_DEBOUNCE_MS = 1000;
const SEARCH_FETCH_MS = 350;
function onAssignSearch(value){
  /* v3 順手修：debounce 送出後、結果回來前那段 skeleton 期間，renderAssign 會把搜尋框
   * 重繪成 assign.search（還是舊值），使用者剛打的字會消失 350ms 再回來。把正在輸入的
   * 字串另外記著，重繪時用它。 */
  assign.typed = value;
  clearTimeout(assignSearchTimer);
  assignSearchTimer = setTimeout(()=>{
    const term = value.trim();
    if(term === assign.search) return;          // 內容沒變就不用重查
    assign.searching = true;
    renderAssign();
    clearTimeout(assignFetchTimer);
    assignFetchTimer = setTimeout(()=>{
      assign.search = term;
      assign.typed = null;
      assign.searching = false;
      renderAssign();
    }, SEARCH_FETCH_MS);
  }, ASSIGN_DEBOUNCE_MS);
}
/* 切換分組不動 assign.selected，因為選取的是專案本身，跟怎麼分組無關 */
/* 開發團隊 2026-09-10 的立場是「切視角不保留勾選」（RD 出兩支獨立 API）。
 * assign.keepSelection 預設 false ＝ 跟開發現況一致；Demo FAB 可以切成 true
 * 看 UX 建議的版本。**不保留是可以的，靜默清空不行**——所以清掉時一定要
 * 在彈窗裡講出來並給 Undo，成本只是把陣列留著。
 * 這裡刻意不用 toast：toast 在彈窗外面的左下角，而這件事發生在彈窗裡；
 * 工具列下方那個位置本來就是留給真警示的（T1 存檔連帶清子 T2、同步失敗）。 */
function setGroupBy(mode){
  if(!assign.keepSelection){
    const picked = Object.keys(assign.selected);
    if(picked.length){
      assign.clearedSelection = { ...assign.selected };
      assign.clearedCount = picked.length;
      assign.selected = {};
    }
  }
  assign.groupBy = mode;
  assign.expanded = {};
  /* 兩個視角的搜尋範圍不一樣（見 projectVisible），還沒送出的查詢跨過去會用
   * 錯的規則跑，連 skeleton 一起收掉。 */
  clearTimeout(assignSearchTimer);
  clearTimeout(assignFetchTimer);
  assign.searching = false;
  assign.typed = null;
  renderAssign();
}

function hl(text){
  if(!assign.search) return esc(text);
  const term = assign.search;
  const at = text.toLowerCase().indexOf(term.toLowerCase());
  if(at < 0) return esc(text);
  return esc(text.slice(0,at)) + '<span class="hl">' + esc(text.slice(at, at+term.length)) + '</span>' + esc(text.slice(at+term.length));
}
/* 薄包裝 → shared/lumiture-checkbox.js。這支檔案全程是重繪模型（caller 持有
 * assign.selected 等狀態、改變後重繪整塊），所以走共用元件的 class 路徑，
 * 不產生真的 input。簽名維持不變，呼叫端一處都不用改。 */
function checkboxHtml(checked, onclick, mixed, disabled){
  return LumiCheckbox.html({checked:checked, mixed:mixed, disabled:disabled, onclick:onclick});
}
/* GCP 允許 10 層。樹狀版把步進縮小讓縮排一路撐到底：16px × 10 層 = 160px，
 * 660px 的彈窗放得下、階層全程看得見。
 * 元件版則忠實沿用 GroupedMultiSelectOptionItem 寫死的 `pl:'32px'`——那個值
 * 是為「只有一層子項」設計的，延伸到多層時 32px × 10 = 320px，會吃掉半個
 * 彈窗寬度。這個差異刻意保留，因為它正是「既有元件能不能直接長高」的關鍵。 */
const INDENT_STEP_TREE = 16;
const INDENT_STEP_COMPONENT = 32;   // = GroupedMultiSelectOptionItem 的 pl:'32px'
function isComponentStyle(){ return assign.pickerStyle.startsWith('component'); }
function isComponentFixed(){ return assign.pickerStyle === 'component-fix'; }
function indentStep(){
  return (isComponentStyle() && !isComponentFixed()) ? INDENT_STEP_COMPONENT : INDENT_STEP_TREE;
}
const FOLDER_ROW_H = 40;   // sticky 疊放的 offset 要跟資料夾列高一致
const SELECT_ALL_H = 40;   // 頂端 Select All 那列也是 sticky，資料夾要釘在它下面
/* 資料夾列釘住的位置。之前只算 depth*40，忘記頂端還有一列 sticky 的
 * Select All（z-index 40）壓在上面，所以第 0 層資料夾其實是釘在它底下、
 * 看不到——這是我加 Select All 那輪造成的 regression，樹狀版也一樣中。
 * component-fix 只釘第 0 層（不做巢狀），所以固定就是 Select All 的下緣。 */
/* sticky 一律釘在 Select All 那列下面的同一個位置，不隨深度累加（2026-09-10
 * Kabin 定義）。所有資料夾列都 sticky 但共用同一個 top，深的 z-index 比淺的高，
 * 所以捲到哪一層、被釘住的就是那一層——也就是「當下看到的專案所屬的最近一層
 * 資料夾」。原本的 `SELECT_ALL_H + depth * FOLDER_ROW_H` 是把整條路徑都釘成一疊，
 * 十層會吃掉 400px 的可視高度。 */
const ORG_HEADER_H = 32;
/* 多 org 時資料夾要釘在 org 標頭底下，不然捲動時「我在哪個 org」會被蓋掉。
 * 只多這一層是可以接受的（40 + 32 = 72px），跟先前否決的「整條路徑疊成一落」
 * 不同——那個是十層各 40px。 */
function folderStickyTop(){
  return SELECT_ALL_H + (isMultiOrg() && showFolderView() ? ORG_HEADER_H : 0);
}
/* 縮排封頂在第 4 層（2026-09-10，回應 RD 的「波動拳」）。
 * 線性縮排到十層時，左邊會出現一條 168px 的斜階梯：左半邊全空、名稱被擠掉、
 * 整份清單看起來歪的。而且那個斜線本身沒有帶任何資訊，它只是「我有 9 個祖先」
 * 的一個很佔空間的說法。
 * 封頂之後第 5 層以上縮排不再增加，改用「祖先路徑文字」補上層級資訊
 * （見 folderRow 的 tpath）。也就是縮排停止生長的那一刻，那塊空間改放真的內容，
 * 深層的資訊密度是上升而不是下降。
 * 真實情境（客戶最多 2-3 層）完全碰不到這個上限，畫面跟原本一模一樣。 */
const INDENT_CAP = 4;
/* 封頂後的縮排步進。取 8px 而不是 4px：8px 在 Guideline 的格線上（4px 只准用於
 * icon 與文字之間的微間距），而且相鄰兩列 8px 的差是明確看得出來的。
 * 第 10 層總縮排 24 + 4×16 + 5×8 = 128px，比線性的 168px 少 40px，名稱欄多拿回
 * 那 40px；同時層級關係一路到底都還是「看」得出來的，不用讀文字去解。 */
const MICRO_STEP = 8;
function indentPx(depth){
  const steps = assign.indentCap ? Math.min(depth, INDENT_CAP) : depth;
  const base = 24 + steps * indentStep();
  /* micro 模式：封頂之後每層再疊 4px。相鄰兩列 4px 的差是看得出來的，
   * 所以深層的鏈狀關係不會塌成「一排兄弟」；而 5 層 × 4px 只多 20px，
   * 不會回到線性縮排那種 168px 的斜階梯。 */
  if(assign.pathMode === 'micro' && assign.indentCap && depth > INDENT_CAP){
    return base + (depth - INDENT_CAP) * MICRO_STEP;
  }
  return base;
}
function railsHtml(depth){
  if(isComponentStyle()) return '';   // 既有元件沒有縮排引導線
  let out = '';
  const shown = assign.indentCap ? Math.min(depth, INDENT_CAP) : depth;
  for(let level=0; level<shown; level++){ out += `<span class="trail" style="left:${32 + level*INDENT_STEP_TREE}px"></span>`; }
  return out;
}
/* 帳單帳戶視角沒有 org 分段（一個帳單帳戶可以付費給跨 org 的專案，所以 org
 * 在那個視角不是乾淨的父層），位置講不出 org，只好標在列上。資料夾視角不標，
 * 因為上面的區段標頭已經說了。 */
function orgChipHtml(project){
  if(!isMultiOrg() || showFolderView() || !project.orgName) return '';
  return `<span class="ba-chip is-org-chip">${esc(project.orgName)}</span>`;
}
function projectRow(project, depth){
  /* 元件版：GroupedMultiSelectOptionItem 是單行 `name (desc)`，desc 用 hint 色，
   * 所以資源 ID 走 desc 的位置、跟名稱同一行（元件的 row height 是固定 40px，
   * 容不下兩行）。樹狀版維持兩行 Name / ID，對齊 Resources 表格的既有慣例。 */
  const label = `<span class="tname ${project.name?'':'is-nocost'}">${hl(projectLabel(project))}</span>`;
  const body = isComponentStyle()
    ? `${label}<span class="tdesc">(${hl(project.resId)})</span>`
    : `${label}<span class="tsub">${hl(project.resId)}</span>`;
  return `<div class="tnode is-project" style="padding-left:${indentPx(depth)}px" onclick="toggleProject('${project.id}')">${railsHtml(depth)}
    <span class="tchev ghost"></span>
    ${checkboxHtml(!!assign.selected[project.id], `toggleProject('${project.id}')`)}
    <span class="material-symbols-outlined ticon ghost">folder</span>
    <div class="tlabel">${body}</div>
    ${orgChipHtml(project)}${(showFolderView() && !project.parent.none)?`<span class="ba-chip">${esc(project.parent.name)}</span>`:''}
  </div>`;
}
/* 縮排封頂之後，第 5 層以上的層級靠這條祖先路徑表達，取代原本靠斜階梯表達。
 * 中段省略成「…」只留頭尾兩段，因為使用者要的是「我在哪條分支的底部」，
 * 不是背下整條路徑。 */
/* 「只留頭尾」的第一版有 Kabin 抓到的洞：最上層跟最底層剛好同名時，
 * `corp / … / corp` 分不出是哪一條分支。而且在我們的資料裡**頭那一段其實是噪音**
 * ——深層資料夾的 root 幾乎都一樣（同一個 org），真正能區分的是緊鄰的上一層。
 *
 * 改成「最小可區分路徑」（VS Code 同名檔案 tab 的做法）：
 *   1. 先掃全樹，統計每個資料夾名稱出現幾次
 *   2. 名稱唯一 → 只顯示緊鄰的上一層（`… / eu-west / `）
 *   3. 名稱重複 → 從右往左一段一段加，加到這條後綴在所有同名者之中唯一為止
 * 所以 platform 底下的 staging 顯示 `platform / staging`、deprecated 底下的顯示
 * `deprecated / staging`，兩個 staging 一眼分得出來。 */
let FOLDER_PATHS = null;      // node.id → 祖先名稱陣列
let FOLDER_NAME_COUNT = null; // 名稱 → 出現次數
let FOLDER_SAME_NAME = null;  // 名稱 → 該名稱所有節點的祖先路徑陣列
function buildFolderPathIndex(){
  FOLDER_PATHS = new Map();
  FOLDER_NAME_COUNT = new Map();
  FOLDER_SAME_NAME = new Map();
  walkFolders(cfg().folders(), (node, depth, path)=>{
    FOLDER_PATHS.set(node.id, path);
    FOLDER_NAME_COUNT.set(node.name, (FOLDER_NAME_COUNT.get(node.name)||0) + 1);
    if(!FOLDER_SAME_NAME.has(node.name)) FOLDER_SAME_NAME.set(node.name, []);
    FOLDER_SAME_NAME.get(node.name).push(path);
  });
}
/* 回傳「為了跟同名者區分開來，最少要顯示幾段祖先」。名稱唯一時回傳 0。 */
function distinguishingSegments(node){
  const mine = FOLDER_PATHS.get(node.id) || [];
  if((FOLDER_NAME_COUNT.get(node.name)||0) <= 1) return 0;
  const others = (FOLDER_SAME_NAME.get(node.name)||[]).filter(path=>path !== mine);
  for(let take=1; take<=mine.length; take++){
    const suffix = mine.slice(mine.length - take).join('/');
    const clash = others.some(path=>path.slice(Math.max(0, path.length - take)).join('/') === suffix);
    if(!clash) return take;
  }
  return mine.length;
}
/* 路徑只在「位置本身講不出來」的時候出現，一條規則兩種情況：
 *   ①搜尋中：樹被打平，縮排跟 sticky 兩個線索同時失效，位置什麼都不說
 *   ②深度超過縮排上限：第 5 層以上縮排不再增加，位置也不說了
 * 其餘情況（正常展開的淺層樹）不顯示——上一層就在正上方，再寫一次是雜訊。
 *
 * 顯示幾段：至少一段（緊鄰的上一層，資訊量最高的那一段），同名者需要更多就給
 * 更多，一路加到唯一為止。**刻意不顯示完整路徑**：十層的完整路徑是
 * `corp / platform-ops / infra / prod / eu-west / …` 讀不完，而使用者要的是
 * 「這是哪一個 staging」，不是背下整條路。 */
function pathPrefix(depth, node){
  if(!FOLDER_PATHS) buildFolderPathIndex();
  const ancestors = FOLDER_PATHS.get(node.id) || [];
  if(!ancestors.length) return '';
  const flattened = !!assign.search;
  const capped = assign.indentCap && depth > INDENT_CAP;
  const needed = distinguishingSegments(node) > 0;
  /* `needed`（名稱跟別人衝突）是正確性問題，跟選哪個模式無關——三個模式都要顯示，
   * 不然使用者捲到 `platform > staging` 的專案列表，sticky 釘住的標頭只寫
   * `staging (7)`，完全看不出是哪個 staging（deprecated 底下也有一個）。
   * 這不是假設，是 Bater 工程調查裡真實存在的同名資料夾，2026-09-11 才發現
   * `deep` 模式的原始條件（flattened || capped）漏掉了這一項，深度 1 遠低於
   * 封頂線 4，正常瀏覽時永遠不會消歧。
   *
   * 何時顯示路徑：
   *   一律：搜尋中，或名稱跟別人衝突（不分模式，這是正確性底線）
   *   'all'   → 再加上每一列都顯示（除了第一層，它沒有祖先）
   *   'micro' → 沒有額外情況，封頂後靠微縮排表達層級
   *   'deep'  → 再加上深度超過封頂線（現況：靠路徑補償縮排停止累加）
   */
  const show = flattened
    || needed
    || (assign.pathMode === 'all')
    || (assign.pathMode === 'deep' && capped);
  if(!show) return '';
  const take = Math.min(ancestors.length, Math.max(1, distinguishingSegments(node)));
  const shown = ancestors.slice(ancestors.length - take);
  const elided = ancestors.length > take ? '… / ' : '';
  return `<span class="tpath">${elided}${esc(shown.join(' / '))} / </span>`;
}
function folderRow(node, depth, ancestors = []){
  /* 選單只列未指派的，所以計數也只能算未指派的，
   * 不然「platform (24)」底下只掛 3 列，數字跟看到的東西對不起來 */
  const unassigned = allProjectsOf(node).filter(project=>!project.assigned);
  /* 這裡的「全選範圍」要跟畫面上實際排出來的列一致，包含帳單帳戶篩選
   * 跟搜尋兩種情況——用 visibleProjectsOf() 而不是不看搜尋的 selectableOf() */
  const selectable = visibleProjectsOf(node, false);
  const picked = selectedIn(selectable);
  const isAll = selectable.length>0 && picked===selectable.length;
  const isSome = picked>0 && !isAll;
  /* 篩選（帳單帳戶或搜尋）讓資料夾只剩一部分時要講出來，不然使用者以為專案不見了 */
  const countText = selectable.length === unassigned.length
    ? `(${unassigned.length})`
    : `(${selectable.length} / ${unassigned.length})`;
  const expanded = !!assign.expanded[node.id] || !!assign.search;
  const kids = expanded ? (
      node.children.filter(nodeHasVisible).map(child=>folderRow(child, depth+1, ancestors.concat(node.name))).join('') +
      /* 資料夾自己命中搜尋時整批留著底下的專案，但「已指派的不進這個選單」這條
       * 規則不能跟著放掉——原本這裡只檢查帳單帳戶篩選，導致搜資料夾名稱時
       * 已指派的專案會冒出來，跟旁邊的計數對不起來。用 inFolderScope 一起擋掉。 */
      node.projects.filter(project => folderMatches(node) ? inFolderScope(project) : projectVisible(project)).map(project=>projectRow(project, depth+1)).join('')
    ) : '';
  return `<div class="tbranch">
      <div class="tnode is-folder" data-depth="${depth}" style="padding-left:${indentPx(depth)}px;top:${folderStickyTop()}px;z-index:${30+depth}"${node.folderId?` title="Folder ID: ${esc(node.folderId)}"`:''} onclick="toggleExpand('${node.id}')">${railsHtml(depth)}
        <button class="tchev" onclick="event.stopPropagation();toggleExpand('${node.id}')" aria-label="${expanded?'Collapse':'Expand'}"><span class="material-symbols-outlined">${expanded?'expand_more':'chevron_right'}</span></button>
        ${checkboxHtml(isAll, `toggleFolder('${node.id}')`, isSome)}
        <span class="material-symbols-outlined ticon">folder</span>
        <div class="tlabel"><span class="tname">${pathPrefix(depth, node)}${hl(node.name)} <span class="tcount ${selectable.length!==unassigned.length?'partial':''}">${countText}</span></span></div>
      </div>${kids}
    </div>`;
}
function undoClearedSelection(){
  if(!assign.clearedSelection) return;
  assign.selected = assign.clearedSelection;
  assign.clearedSelection = null;
  assign.clearedCount = 0;
  renderAssign();
}
function dismissClearedNotice(){
  assign.clearedSelection = null;
  assign.clearedCount = 0;
  renderAssign();
}
function clearedNoticeHtml(){
  if(!assign.clearedCount) return '';
  const noun = assign.clearedCount === 1 ? cfg().noun : cfg().nounPlural;
  return `<div class="tnotice">
    <span class="material-symbols-outlined">info</span>
    <span>Switching views cleared ${assign.clearedCount} selected ${esc(noun)}.</span>
    <button class="tnotice-act" onclick="undoClearedSelection()">Undo</button>
  </div>`;
}
function unassignedRow(){
  const inFilter = cfg().noFolder().filter(inFolderScope);   // 分母，不受搜尋影響
  const visible = inFilter.filter(projectVisible);              // 目前搜尋下真的看得到、選得到的
  if(assign.search && !visible.length) return '';
  /* 全選範圍跟折疊資料夾同一顆問題：要用 visible（搜尋後的）不是 inFilter
   * （沒管搜尋的），不然全選會連畫面上沒列出來的也一起選走 */
  const picked = selectedIn(visible);
  const isAll = visible.length>0 && picked===visible.length;
  const isSome = picked>0 && !isAll;
  const countText = visible.length===inFilter.length ? `(${inFilter.length})` : `(${visible.length} / ${inFilter.length})`;
  const expanded = !!assign.expanded['unassigned'] || !!assign.search;
  const kids = expanded ? visible.map(project=>projectRow(project,1)).join('') : '';
  return `<div class="tbranch">
      <div class="tnode is-folder is-unassigned" style="padding-left:24px;top:${folderStickyTop()}px;z-index:30" onclick="toggleExpand('unassigned')">
        <button class="tchev" onclick="event.stopPropagation();toggleExpand('unassigned')"><span class="material-symbols-outlined">${expanded?'expand_more':'chevron_right'}</span></button>
        ${checkboxHtml(isAll, `toggleUnassigned()`, isSome)}
        <span class="material-symbols-outlined ticon">folder_off</span>
        <div class="tlabel"><span class="tname">No folder <span class="tcount ${visible.length!==inFilter.length?'partial':''}">${countText}</span></span>
        <span class="tsub">Projects sitting directly under ${esc(activeOrgs()[0].name)}</span></div>
      </div>${kids}
    </div>`;
}
function unassignedInFilter(){ return cfg().noFolder().filter(inFolderScope).filter(projectVisible); }
function toggleUnassigned(){ toggleScope(unassignedInFilter()); }

/* 設計稿 #18-1：沒有帳單帳戶的專案統一排在清單最底部，標頭寫
 * 「Projects without Billing Account」。兩個視角都出現在最後一列，
 * 因為它既歸不到帳單帳戶、也不該混進資料夾的階層裡。 */
function noBaInFilter(){ return cfg().orphans().filter(inFolderScope).filter(projectVisible); }
function toggleNoBa(){ toggleScope(noBaInFilter()); }
function noBaRow(){
  const inScope = cfg().orphans().filter(inFolderScope);
  const visible = noBaInFilter();
  if(!inScope.length) return '';
  if(assign.search && !visible.length) return '';
  const picked = selectedIn(visible);

  const isSome = picked>0 && !isAll;
  const countText = visible.length===inScope.length ? `(${inScope.length})` : `(${visible.length} / ${inScope.length})`;
  const expanded = !!assign.expanded['no-ba'] || !!assign.search;
  const kids = expanded ? visible.map(project=>projectRow(project,1)).join('') : '';
  return `<div class="tbranch">
      <div class="tnode is-folder is-unassigned${isMultiOrg()?' is-cross-org':''}" style="padding-left:24px;top:${folderStickyTop()}px;z-index:30" onclick="toggleExpand('no-ba')">
        <button class="tchev" onclick="event.stopPropagation();toggleExpand('no-ba')" aria-label="${expanded?'Collapse':'Expand'}"><span class="material-symbols-outlined">${expanded?'expand_more':'chevron_right'}</span></button>
        ${checkboxHtml(isAll, `toggleNoBa()`, isSome)}
        <span class="material-symbols-outlined ticon">money_off</span>
        <div class="tlabel"><span class="tname">Projects without Billing Account <span class="tcount ${visible.length!==inScope.length?'partial':''}">${countText}</span></span></div>
      </div>${kids}
    </div>`;
}

/* 設計稿 #18-1 要求的 Select All。範圍＝目前視角下真正列出來的所有可選專案，
 * 跟父層全選同一條規則（有搜尋時只算搜到的）。 */
function allVisibleSelectable(){
  const seen = new Set();
  const out = [];
  const push = list => list.forEach(project=>{ if(!seen.has(project.id)){ seen.add(project.id); out.push(project); } });
  if(!assign.hasFolders || assign.groupBy === 'ba'){
    cfg().groups().forEach(group=>push(baProjects(group.id)));
  } else {
    cfg().folders().forEach(node=>push(visibleProjectsOf(node, false)));
    push(unassignedInFilter());
  }
  push(noBaInFilter());
  return out;
}
function toggleSelectAll(){ forgetClearedNotice(); toggleScope(allVisibleSelectable()); }
/* org 區段標頭：刻意長得不像資料夾列——沒有 checkbox、沒有展開箭頭、不可點、
 * 字級小一階。四個線索同時在講「這不是資料夾」，不是只靠顏色。
 * 明度往上加深（org blue-20 > folder blue-10 > project 白底），層級一眼讀得出來。 */
function orgHeaderRow(org){
  return `<div class="tnode is-org" style="top:${SELECT_ALL_H}px" title="Organization ID: ${esc(org.orgId)}">
      <span class="material-symbols-outlined org-icon">domain</span>
      <span class="org-name">${hl(org.name)}</span>
    </div>`;
}
function selectAllRow(){
  const scope = allVisibleSelectable();
  if(!scope.length) return '';
  const picked = selectedIn(scope);
  const isAll = picked===scope.length;
  const isSome = picked>0 && !isAll;
  return `<div class="tnode is-selectall">
      <span class="tchev ghost"></span>
      ${checkboxHtml(isAll, `toggleSelectAll()`, isSome)}
      <span class="material-symbols-outlined ticon ghost">folder</span>
      <div class="tlabel"><span class="tname">Select all <span class="tcount">(${scope.length})</span></span></div>
    </div>`;
}

/* org 一個資料夾都沒開時，樹會退化成一個裝了 92 個專案的「No folder」節點，
 * 比現在的平鋪還難用。所以沒有資料夾就維持現行的 BA → Project 兩層。 */
function flatBaTree(){
  return cfg().groups().map(group=>{
    const all = everyUnassigned().filter(project=>project.parent.id===group.id);
    const projects = baProjects(group.id);
    if(!projects.length) return '';
    const expanded = !!assign.expanded[group.id] || !!assign.search;
    const picked = selectedIn(projects);
    const isAll = projects.length>0 && picked===projects.length;
    const isSome = picked>0 && !isAll;
    const countText = projects.length===all.length ? `(${all.length})` : `(${projects.length} / ${all.length})`;
    return `<div class="tbranch">
        <div class="tnode is-folder" data-depth="0" style="padding-left:24px;top:${folderStickyTop()}px;z-index:30" onclick="toggleExpand('${group.id}')">
          <button class="tchev" onclick="event.stopPropagation();toggleExpand('${group.id}')"><span class="material-symbols-outlined">${expanded?'expand_more':'chevron_right'}</span></button>
          ${checkboxHtml(isAll, `toggleBa('${group.id}')`, isSome)}
          <span class="material-symbols-outlined ticon">${cfg().parentIcon}</span>
          <div class="tlabel"><span class="tname">${hl(group.name)} <span class="tcount ${projects.length!==all.length?'partial':''}">${countText}</span></span></div>
        </div>${expanded ? projects.map(project=>projectRow(project,1)).join('') : ''}
      </div>`;
  }).join('');
}
/* 帳單帳戶自己的名字也算搜尋命中，命中就整批留著底下的專案——跟資料夾視角的
 * folderMatches() 同一套規則，不然搜「corp-main」會搜不到任何東西（因為之前
 * 只比對專案的 name / ID）。 */
/* placeholder 要講出這個視角實際搜得到什麼。原本固定寫「folders or projects」，
 * 但在帳單帳戶視角裡沒有資料夾這個東西，而帳單帳戶名稱其實搜得到卻沒被提到。 */
function searchPlaceholder(){
  /* placeholder 要把這個視角實際搜得到的東西講完，兩邊都是「分組軸 + 專案」：
   *   資料夾視角 → Search folders or projects
   *   帳單帳戶視角 → Search billing accounts or projects
   * 併行之後搜尋框文字區只有 234px，這兩句都在寬度內（先前塞三個名詞才需要
   * 省掉連接詞）。 */
  const c = cfg();
  if(c.searchHint) return `Search ${c.searchHint}`;
  const parent = c.parentLabel.toLowerCase() + 's';
  if(!showFolderView()) return `Search ${parent} or ${c.nounPlural}`;
  return `Search folders or ${c.nounPlural}`;
}
function baMatches(ba){
  return !!assign.search && ba.name.toLowerCase().includes(assign.search.toLowerCase());
}
/* 這同時是「畫面上排哪些列」跟「全選會選走哪些」的唯一來源，兩邊共用一個
 * 函式就不會再出現「看到 1 個卻選走 14 個」那種對不起來的情況。 */
function baProjects(baId){
  const ba = cfg().groups().find(item=>item.id===baId);
  const keepAll = !!ba && baMatches(ba);
  return everyProject()
    .filter(project=>project.parent.id===baId)
    .filter(project=>keepAll ? inFolderScope(project) : projectVisible(project));
}
function toggleBa(baId){ toggleScope(baProjects(baId)); }

/* 選單本體（工具列 + 提示條 + 清單 + 計數）跟外殼分開。modal 與 wizard 兩個宿主都吃這一份。 */
function assignPickerParts(){
  buildFolderPathIndex();   // 換雲、塞深樹都會改變樹，索引每次重建（成本可忽略）
  const assignable = everyUnassigned().length;
  const picked = Object.keys(assign.selected).length;

  let body;
  if(assign.loading || assign.searching){
    body = `<div class="tskel">${Array.from({length:7}).map(()=>'<div class="skel"></div>').join('')}</div>`;
  } else if(!everyUnassigned().length){
    /* 全部都指派過就沒東西可加了。這裡刻意不用 No Data 那種語彙——
     * 這不是出錯，是這個群組已經設定完了，而且要移除的話得去表格。 */
    body = `<div class="tempty"><span class="material-symbols-outlined tempty-icon is-success">check_circle</span>
      <div class="tempty-title">Everything is already assigned</div>
      <div>All authorized ${esc(cfg().cloudLabel)} resources are assigned to this group. To remove one, select it in the Resources table and use Unlink Resource.</div></div>`;
  } else if(cfg().supportsFolders && assign.groupBy==='folder' && !assign.hasFolders){
    /* 使用者主動點了 Folder 分頁，這個 org 才真的沒有資料夾可看。跟
     * cloud pill tabs 的 not-authorized 空狀態同一個視覺語言（icon +
     * 標題 + 說明），不是常駐警語。 */
    body = `<div class="tempty"><span class="material-symbols-outlined tempty-icon">folder_off</span>
      <div class="tempty-title">No folders in this organization</div>
      <div>Projects here aren't organized into folders. Switch to ${esc(cfg().parentLabel)} to browse and assign resources.</div></div>`;
  } else if(!showFolderView()){
    const tree = flatBaTree() + noBaRow();
    body = tree ? selectAllRow() + tree : `<div class="tempty">No resources match your search.</div>`;
  } else {
    /* 多 org：每個 org 一段，標頭 + 該 org 底下有內容的資料夾。
     * 單一 org：完全不出現標頭，跟改版前一模一樣。 */
    const multi = isMultiOrg();
    /* 「No folder」是直接掛在 organization 底下的專案，所以它屬於某一個 org，
     * 要排在該 org 的區段裡面。mock 只有一組，歸在第一個 org；真實資料是每個
     * org 各自有自己的一組。
     * 「Projects without Billing Account」相反，那是跨 org 的桶子（帳單帳戶可以
     * 付費給跨 org 的專案），所以排在所有 org 區段之外、最底部，並在多 org 時
     * 加一條分隔線，不然會被讀成屬於最後一個 org。 */
    const tree = activeOrgs().map((org, index)=>{
      const rows = org.folders.filter(nodeHasVisible).map(node=>folderRow(node,0)).join('')
        + (index === 0 ? unassignedRow() : '');
      if(!rows) return '';                       // 這個 org 被搜尋濾光就整段不出現
      return (multi ? orgHeaderRow(org) : '') + rows;
    }).join('') + noBaRow();
    body = tree ? selectAllRow() + tree : `<div class="tempty">No resources match your search.</div>`;
  }

  /* 原本這裡有一塊藍底常駐說明，收掉了（Kabin 2026-09-09 決定）。三件事
   * 各自歸位：「只列未指派」→ 底部計數的 unassigned 這個字、視角行為 →
   * Group by 的 info tooltip、「要移除去表格 Unlink」→ 空狀態已經有。
   *
   * 「這個 org 沒有資料夾」原本也走常駐 caption，2026-09-10 改掉：Kabin
   * 指出這件事該比照本檔 resourcesTab() 的雲端 pill tabs 做——tab 永遠
   * 顯示，沒資料的那個點下去才出現空狀態，不要預先把選項藏起來再用文字
   * 解釋為什麼看不到。所以 Group by 的 Folder 分頁永遠在，這個 org 真的
   * 沒有資料夾時，點進 Folder 才在 rmodal-body 出現對應空狀態。 */
  const tools = `<div class="rmodal-tools">
        <div class="search-box"><span class="material-symbols-outlined">search</span><input placeholder="${searchPlaceholder()}" value="${esc(assign.typed != null ? assign.typed : assign.search)}" oninput="onAssignSearch(this.value)"></div>
        ${showGroupByToggle() ? `<div class="groupby-toggle">
          <span class="lbl">Group by</span>
          <span class="material-symbols-outlined gb-info" title="${esc(GROUPBY_HELP)}">info</span>
          <div class="pill-tabs">
            <button class="pill-tab ${assign.groupBy==='ba'?'active':''}" onclick="setGroupBy('ba')"><span class="material-symbols-outlined" style="font-size:16px">${cfg().parentIcon}</span>${esc(cfg().parentLabel)}</button>
            <button class="pill-tab ${assign.groupBy==='folder'?'active':''}" onclick="setGroupBy('folder')"><span class="material-symbols-outlined" style="font-size:16px">folder</span>Folder</button>
          </div>
        </div>` : ''}
      </div>`;
  const bodyCls = `rmodal-body ${isComponentStyle()?'is-component':'is-tree'}${isComponentFixed()?' is-component-fixed':''}`;
  const count = assignable ? `<b>${picked}</b> of ${assignable} unassigned ${assignable===1?cfg().noun:cfg().nounPlural} selected` : '';
  return {tools, notice:clearedNoticeHtml(), body, bodyCls, count, picked, assignable};
}
function renderAssign(){
  if(assign.host==='wizard'){ renderWizard(); return; }
  const root = document.getElementById('assign-root');
  if(!assign.open){ root.innerHTML=''; return; }
  /* renderAssign 重建整個彈窗的 innerHTML，搜尋框會被換掉，游標就跑了——
   * debounce 一送出就打不下去，得再點回輸入框。渲染前記住焦點跟游標位置，
   * 渲染後補回去。（不是這輪的回饋，是順手修掉的既有問題。） */
  const focus = captureFocus();
  const parts = assignPickerParts();
  root.innerHTML = `<div class="rmodal-backdrop" onclick="if(event.target===this)closeAssign()">
    <div class="rmodal assign-picker" role="dialog" aria-label="Assign Resource">

const TAG_TERMS = {

/* 上層（Billing Account / Management Account / Subscription）。GCP 沿用 Resources 表格
 * 既有的 GCP_BAS，另外兩朵雲補第二個上層，讓「上層 → key」的分組看得出來。 */
const TAG_PARENTS = {
  gcp:   GCP_BAS.map(([name,id])=>({id, name})),
  aws:   [{id:'112233445566', name:'CloudMile-Org-Root'}, {id:'998811223344', name:'CloudMile-Org-Sandbox'}],
  azure: [{id:'/subscriptions/c5d7a1e2', name:'Corporate-BI-Data'}, {id:'/subscriptions/9a1f77c0', name:'Corporate-Web-Prod'}],
};
const TAG_KEYS = {
  gcp:   {application:['crm-system','security-monitoring','iot-platform','hr-portal'], 'billing-account':['shared','dedicated'], compliance:['pci-dss','sox'], 'cost-center':['cc-1001','cc-2040','cc-3300'], environment:['prod','staging','dev']},
  aws:   {Application:['payments','checkout','search'], CostCenter:['fin-01','eng-02'], ManagedBy:['terraform','console'], WorkloadType:['batch','web','ml'], Environment:['Prod','Staging','Dev']},
  azure: {environment:['prod','staging','dev'], owner:['finops','platform'], 'cost-center':['cc-1001','cc-2040'], workload:['bi','web']},

/* 每朵雲的 label/tag 全集：(上層, key, value) 三元組。不是每個上層都有每個 key，
 * 否則兩個上層底下的清單會一模一樣、看不出分組的意義。 */
function buildTagUniverse(cloud){
  const out = [];
  const keys = Object.keys(TAG_KEYS[cloud]);
  TAG_PARENTS[cloud].forEach((parent, pi)=>keys.forEach((key, ki)=>{
    if(pi>0 && (pi+ki)%3===2) return;
    TAG_KEYS[cloud][key].forEach(value=>out.push({id:`${parent.id}|${key}|${value}`, parent, key, value}));
  }));
  return out;
}
const TAG_UNIVERSE = {gcp:buildTagUniverse('gcp'), aws:buildTagUniverse('aws'), azure:buildTagUniverse('azure')};
/* 每個群組已指派的 label/tag（mock，從全集裡等距抽幾個）。存成 Set，指派 / Unlink 會改它，
 * 所以 #56 彈窗「只列尚未指派的」跟表格能對得上。 */
const TAG_ASSIGNED = {};
function assignedTagSet(groupId, cloud){
  const key = groupId+'|'+cloud;
  if(!TAG_ASSIGNED[key]){
    const seed = groupId.length + (cloud==='aws'?1:cloud==='azure'?2:0);
    const universe = TAG_UNIVERSE[cloud];
    TAG_ASSIGNED[key] = new Set(universe.filter((tag, index)=>(index+seed)%5===0).map(tag=>tag.id).slice(0, 4 + seed%3));
  }
  return TAG_ASSIGNED[key];
}
function assignedTagsFor(groupId, cloud){
  const set = assignedTagSet(groupId, cloud);
  return TAG_UNIVERSE[cloud].filter(tag=>set.has(tag.id));
}
function unassignedTagsFor(groupId, cloud){
  const set = assignedTagSet(groupId, cloud);
  return TAG_UNIVERSE[cloud].filter(tag=>!set.has(tag.id));
}

const tagPick = {open:false, cloud:'gcp', groupId:null, keys:{}, values:{}, dd:null, search:'', loading:false, forceFail:false};

function closeTagAssign(){ tagPick.open = false; renderTagAssign(); }
function tagTerms(){ return TAG_TERMS[tagPick.cloud]; }
function tagPool(){ return unassignedTagsFor(tagPick.groupId, tagPick.cloud); }
function tagHit(text){ return !tagPick.search || text.toLowerCase().includes(tagPick.search.toLowerCase()); }
/* Keys 下拉：上層 → key（#56-1 註記「Label Key 的上層為 Billing Account」）。
 * 只列還有未指派 value 的 (上層, key) 組合。 */
function tagKeyGroups(){
  const groups = [];
  TAG_PARENTS[tagPick.cloud].forEach(parent=>{
    const keys = [...new Set(tagPool().filter(tag=>tag.parent.id===parent.id).map(tag=>tag.key))].filter(tagHit);
    if(keys.length) groups.push({id:parent.id, label:`${tagTerms().parentPrefix} = ${parent.name}`, sub:parent.id, items:keys.map(key=>({id:`${parent.id}|${key}`, label:key}))});
  });
  return groups;
}
/* Values 下拉：key → value（註記「Label Value 的上層為 Label Key」）。同一個 key 在
 * 兩個上層都被選到時，value 右邊補上層名稱，不然兩列 prod 分不出是哪一個。
 * 分組列的文案「Label Key = application」是比照 Keys 下拉的「Billing Account = …」造句
 * （設計端暫擬，#56-1 沒畫 Values 展開的樣子）。 */
function tagValueGroups(){
  const pool = tagPool().filter(tag=>tagPick.keys[`${tag.parent.id}|${tag.key}`]);
  const byKey = new Map();
  pool.forEach(tag=>{ if(!byKey.has(tag.key)) byKey.set(tag.key, []); byKey.get(tag.key).push(tag); });
  const groups = [];
  byKey.forEach((tags, key)=>{
    const multiParent = new Set(tags.map(tag=>tag.parent.id)).size > 1;
    const items = tags.filter(tag=>tagHit(tag.value)).map(tag=>({id:tag.id, label:tag.value, sub:multiParent?tag.parent.name:''}));
    if(items.length) groups.push({id:'key|'+key, label:`${tagTerms().keyPrefix} = ${key}`, sub:'', items});
  });
  return groups;
}
function ddOpen(kind){

function ddCloseAll(){ if(tagPick.dd){ tagPick.dd = null; tagPick.search=''; renderTagAssign(); } }

/* 取消一個 key 時，底下已勾的 value 一起清掉，不然 Values 欄位會留著看不到的勾選 */
function pruneValues(){

    if(!tagPick.keys[`${parentId}|${key}`]) delete tagPick.values[id];

function ddToggle(kind, id){

function ddToggleGroup(kind, groupId){

function ddToggleMany(kind, ids){
  const bucket = ddBucket(kind);
  const allOn = ids.length>0 && ids.every(id=>bucket[id]);

function ddPanelHtml(kind){
  const groups = kind==='keys' ? tagKeyGroups() : tagValueGroups();

      ${rows}
      ${all.length?'':`<div class="dd-empty">${tagPick.search?'No results match your search.':'No options available.'}</div>`}
    </div></div>`;
}
function tagTriggerText(kind){
  const bucket = ddBucket(kind);

  if(!ids.length) return '';
  if(kind==='keys') return [...new Set(ids.map(id=>id.split('|')[1]))].join(', ');

/* 重繪 innerHTML 會弄掉輸入框的焦點與游標（v2 在 assign 搜尋框就踩過）。
 * 這裡做成通用版：帶 data-f 的輸入框、或 .assign-picker 裡的搜尋框，渲染前記住、渲染後補回。 */
function captureFocus(){
  const active = document.activeElement;
  if(!active || !active.matches) return null;
  let selector = null;
  if(active.dataset && active.dataset.f) selector = `[data-f="${active.dataset.f}"]`;
  else if(active.matches('.assign-picker .search-box input')) selector = '.assign-picker .search-box input';
  if(!selector) return null;
  let caret = null;
  try { caret = active.selectionStart; } catch(_) { caret = null; }
  return {selector, caret};
}
function restoreFocus(root, focus){
  if(!focus) return;
  const el = root.querySelector(focus.selector);
  if(!el) return;
  el.focus();
  if(focus.caret != null){ try { el.setSelectionRange(focus.caret, focus.caret); } catch(_) {} }
}

function closeWizard(){
  wizard.open = false;
  wizard.seq = (wizard.seq||0) + 1;   // 讓還在路上的 API check / submit timer 作廢
  wizard.forceFail = false; wizard.forceApiError = false;
  if(assign.host==='wizard'){ assign.host='modal'; assign.open=false; }
  renderWizard();
}
/* 格式錯誤即時檢查（#08-1 註記「[Add Manager]：email 格式需即時檢查，即時顯示錯誤提示」）。
 * 只在錯誤狀態有變化時重繪，減少打字時的閃動；焦點與游標由 captureFocus 保住。 */
function wizardLiveValidate(field){
  const before = wizard.errors[field] || null;
  let after = null;
  if(field==='name') after = wizard.errors.name ? (wizard.name.trim() ? null : NAME_EMPTY_ERR) : null;   // 名稱只在按過 Next 之後才即時清除
  if(field==='managers' || field==='emails') after = emailListError(wizard[field]);
  if(wizard.apiError && wizard.apiError.field===field){ wizard.apiError = null; before !== after || renderWizard(); }
  if(before !== after){ if(after) wizard.errors[field]=after; else delete wizard.errors[field]; renderWizard(); }
}
function wizardValidateInfo(){
  wizard.errors = {};
  if(!wizard.name.trim()) wizard.errors.name = NAME_EMPTY_ERR;
  const emailErr = emailListError(wizard.managers);
  if(emailErr) wizard.errors.managers = emailErr;
  renderWizard();
  return !Object.keys(wizard.errors).length;
}
function wizardValidateInvite(){
  wizard.errors = {};
  const emailErr = emailListError(wizard.emails);
  if(emailErr) wizard.errors.emails = emailErr;
  renderWizard();
  return !Object.keys(wizard.errors).length;
}
/* #08-2：按 Next 後由 API 判斷（這裡用 600ms 模擬往返，期間 Next 轉圈、不可再按）。
 * 失敗 → 欄位紅框 + 「Error encountered…」+ 預設展開的 Error Details；註記說錯誤排解完前
 * 不能前往下一步。 */
function wizardApiCheck(field, emails, onPass){
  const taken = wizard.forceApiError ? emails.slice() : emails.filter(email=>TAKEN_EMAILS.has(email.toLowerCase()));
  if(!emails.length || (!taken.length)){ onPass(); return; }
  wizard.checking = true; renderWizard();
  const seq = (wizard.seq = (wizard.seq||0) + 1);
  setTimeout(()=>{
    if(wizard.seq !== seq || !wizard.open) return;
    wizard.checking = false;
    wizard.errors[field] = API_FIELD_ERR;
    wizard.apiError = {field, emails:taken};
    wizard.errOpen = true;
    renderWizard();
  }, 600);
}
function wizardGo(step){
  wizard.step = step; wizard.apiError = null; wizard.errors = {};
  const id = WZ_STEPS[step].id;
  if(id==='gcp' || id==='aws') enterWizardPicker(id); else { if(assign.host==='wizard') assign.host='modal'; renderWizard(); }
}
function enterWizardPicker(cloud){
  startAssignPicker(cloud);
  assign.host = 'wizard';
  assign.selected = {...wizard.picks[cloud]};   // 回到這一步時要看到上次勾的
  renderWizard();
}
function leaveWizardPicker(){
  const id = WZ_STEPS[wizard.step].id;
  if(id==='gcp' || id==='aws') wizard.picks[id] = {...assign.selected};
}
function wizardNext(){
  if(wizard.checking || wizard.submitting) return;
  const id = WZ_STEPS[wizard.step].id;
  if(id==='info'){ if(!wizardValidateInfo()) return; wizardApiCheck('managers', splitEmails(wizard.managers), ()=>wizardGo(1)); return; }
  if(id==='invite'){ if(!wizardValidateInvite()) return; wizardApiCheck('emails', splitEmails(wizard.emails), ()=>wizardGo(2)); return; }
  if(id==='gcp'){ leaveWizardPicker(); wizardGo(3); return; }
}
function wizardPrev(){
  if(wizard.checking || wizard.submitting) return;
  leaveWizardPicker();
  wizardGo(wizard.step-1);
}
/* #08 註記：「[Skip Steps and Create Group]：按下後檢查欄位上所有值是否符合格式，不符合顯示
 * 錯誤頁面，符合則跳過後面步驟直接創立群組。」所以要先回到第一步驗證，也要跑一次 API 檢查。 */
function wizardSkipAndCreate(){
  if(wizard.checking || wizard.submitting) return;
  leaveWizardPicker();
  const inviteOk = !emailListError(wizard.emails);
  if(!inviteOk){ wizardGo(1); wizardValidateInvite(); return; }
  wizard.step = 0; wizard.apiError = null;
  if(!wizardValidateInfo()) return;
  wizardApiCheck('managers', splitEmails(wizard.managers), ()=>wizardSubmit());
}
function wizardSubmit(){
  if(wizard.submitting) return;
  leaveWizardPicker();
  wizard.submitting = true; renderWizard();
  const seq = (wizard.seq = (wizard.seq||0) + 1);
  setTimeout(()=>{
    if(wizard.seq !== seq || !wizard.open) return;
    const failed = wizard.forceFail;
    if(!failed) addCreatedGroup();
    closeWizard();
    showToast(failed ? CREATE_TOAST.error : CREATE_TOAST.success, failed ? 'error' : 'success');
    render();
  }, 800);
}
/* 建好的群組直接長進清單，讓 demo 看得到結果。creator 用 mock 名單第一位代表「目前登入者」。 */
function addCreatedGroup(){
  const resource = Object.keys(wizard.picks.gcp).length + Object.keys(wizard.picks.aws).length;
  const base = {name:wizard.name.trim(), resource, lastUpdated:'Just now', creator:NAME_POOL[0], created:new Date().toLocaleDateString('en-GB')};
  if(wizard.tier===2){
    const t1 = findT1(state.t1Id);
    if(!t1) return;
    tier2GroupsFor(t1).push({id:t1.id+'-t2-new-'+Date.now(), ...base});
    t1.tier2 = tier2GroupsFor(t1).length;
  } else {
    T1_GROUPS.push({id:'new-'+Date.now(), tier2:0, ...base});
  }
}
/* Error Details 折疊區（#08-2 / #11-1）。ctx 是 wizard 或 fm，rerender 是對應的重繪函式名。 */
function errBoxHtml(ctx, rerender){
  ctx = ctx || wizard; rerender = rerender || 'renderWizard';
  if(!ctx.apiError) return '';
  const owner = ctx===wizard ? 'wizard' : 'fm';
  return `<div class="errbox">
    <button class="errbox-head" type="button" onclick="${owner}.errOpen=!${owner}.errOpen;${rerender}()" aria-expanded="${ctx.errOpen}">
      <span class="material-symbols-outlined warn">warning</span>Error Details
      <span class="material-symbols-outlined chev">${ctx.errOpen?'expand_less':'expand_more'}</span>
    </button>
    ${ctx.errOpen?`<div class="errbox-body">${API_DETAIL_COPY}<ul>${ctx.apiError.emails.map(email=>`<li>${esc(email)}</li>`).join('')}</ul></div>`:''}
  </div>`;
}
function wizardInfoStep(){
  const errors = wizard.errors;
  return `<p class="wz-desc">Name your group and assign manager.</p>
    <div class="fld ${errors.name?'has-error':''}"><label class="fld-lbl">Group Name<span class="req">*</span></label>
      <input class="ipt" data-f="wz-name" placeholder="Please enter the group name" value="${esc(wizard.name)}" oninput="wizard.name=this.value;wizardLiveValidate('name')">
      ${errors.name?`<div class="fld-err">${esc(errors.name)}</div>`:''}</div>
    <!-- Add Manager 非必填（#08 便利貼「PM 決策此欄位非必填」） -->
    <div class="fld ${errors.managers?'has-error':''}"><label class="fld-lbl">Add Manager</label>
      <input class="ipt" data-f="wz-managers" placeholder="Please enter the manager's email address" value="${esc(wizard.managers)}" oninput="wizard.managers=this.value;wizardLiveValidate('managers')">
      ${errors.managers?`<div class="fld-err">${esc(errors.managers)}</div>`:''}
      ${wizard.apiError && wizard.apiError.field==='managers' ? errBoxHtml() : ''}
      <div class="fld-help">${EMAIL_HELP}</div></div>`;
}
function wizardInviteStep(){
  const errors = wizard.errors;
  return `<p class="wz-desc">Invite members and assign their roles within the group.</p>
    <div class="fld"><label class="fld-lbl">Role</label>
      <div class="sel"><select class="ipt" data-f="wz-role" onchange="wizard.role=this.value">
        <option value="member" ${wizard.role==='member'?'selected':''}>Member</option>
        <option value="manager" ${wizard.role==='manager'?'selected':''}>Manager</option>
      </select></div></div>
    <div class="fld ${errors.emails?'has-error':''}"><label class="fld-lbl">Email</label>
      <input class="ipt" data-f="wz-emails" placeholder="Please enter the user's email address" value="${esc(wizard.emails)}" oninput="wizard.emails=this.value;wizardLiveValidate('emails')">
      ${errors.emails?`<div class="fld-err">${esc(errors.emails)}</div>`:''}
      ${wizard.apiError && wizard.apiError.field==='emails' ? errBoxHtml() : ''}
      <div class="fld-help">${EMAIL_HELP}</div></div>`;
}
/* #31 / #37 便利貼問 RD：「判斷使用者是否已經做好 GCP / AWS 授權，若無，直接跳過未授權的雲的
 * 指派步驟？若可，Stepper 也能隱藏那些步驟嗎？若不可，則需要定義空狀態下的 action button」。
 * 這題還沒有答案，所以這裡走「不可」那一邊：步驟照常出現，內容區顯示 Resources 分頁既有的
 * not-authorized 空狀態，Next / Submit 維持可按（這一步本來就非必填、可跳過）。 */
function wizardPickerStep(cloud){
  const label = CLOUD_META[cloud].label;
  const notAuthorized = state.cloudAuth==='gcp-only' && cloud!=='gcp';
  const desc = `<p class="wz-desc">Select the ${esc(label)} resources you want to assign to this group.</p>`;
  if(notAuthorized){
    const isAdmin = state.role==='admin';
    return desc + `<div class="wz-picker"><div class="empty-state error" style="min-height:100%"><div>
      <span class="material-symbols-outlined">${isAdmin?'lock_open':'lock'}</span>
      <p class="empty-title">${esc(label)} is not authorized</p>
      <p class="empty-copy">${isAdmin?`Authorize ${esc(label)} in Authorization List before assigning resources from this provider.`:'Please reach out to your administrator to authorize this cloud provider.'}</p>
    </div></div></div>`;
  }
  const parts = assignPickerParts();
  return desc + `<div class="wz-picker assign-picker">${parts.tools}${parts.notice}<div class="${parts.bodyCls}">${parts.body}</div></div>
    <div class="wz-count rmodal-count">${parts.count}</div>`;
}
function renderWizard(){
  const root = document.getElementById('wizard-root');
  if(!wizard.open){ root.innerHTML=''; return; }
  const focus = captureFocus();
  const step = WZ_STEPS[wizard.step];
  const busy = wizard.checking || wizard.submitting;
  const steps = WZ_STEPS.map((item, index)=>{
    const cls = index<wizard.step ? 'done' : index===wizard.step ? 'active' : '';
    return `<div class="wz-step ${cls}"><span class="wz-dot"><span class="material-symbols-outlined">check</span></span><span>${item.label}</span></div>` + (index<WZ_STEPS.length-1?'<div class="wz-line"></div>':'');
  }).join('');
  let body = '';
  if(step.id==='info') body = wizardInfoStep();
  else if(step.id==='invite') body = wizardInviteStep();
  else if(step.id==='gcp' || step.id==='aws') body = wizardPickerStep(step.id);
  const spinner = `<span class="material-symbols-outlined spin">progress_activity</span>`;
  const left = step.id==='aws' ? '' : `<button class="link-btn wz-skip" ${busy?'disabled':''} onclick="wizardSkipAndCreate()">Skip Steps and Create Group</button>`;
  const back = wizard.step===0
    ? `<button class="btn btn-out" ${busy?'disabled':''} onclick="closeWizard()">Cancel</button>`
    : `<button class="btn btn-out" ${busy?'disabled':''} onclick="wizardPrev()">Previous</button>`;
  const forward = step.id==='aws'
    ? `<button class="btn btn-pri" ${busy?'disabled':''} onclick="wizardSubmit()">${wizard.submitting?spinner:''}Submit</button>`
    : `<button class="btn btn-pri" ${busy?'disabled':''} onclick="wizardNext()">${wizard.checking||wizard.submitting?spinner:''}Next</button>`;
  /* 點背景不關閉：這是多步表單，誤觸就會把填了一半的東西弄掉。設計稿沒定義，設計端暫定。 */
  root.innerHTML = `<div class="wz-backdrop">
    <div class="wz" role="dialog" aria-label="Create Group">
      <aside class="wz-steps">${steps}</aside>
      <div class="wz-pane">
        <div class="wz-head"><h3>${step.title}</h3><button class="rmodal-close" onclick="closeWizard()" aria-label="Close"><span class="material-symbols-outlined">close</span></button></div>
        <div class="wz-body">${body}</div>
        <div class="wz-foot">${left}<div class="wz-foot-right">${back}${forward}</div></div>
      </div>
    </div></div>`;
  restoreFocus(root, focus);
}


/* ============================================================
 * v3 P2  Group / User CRUD
 *   #09   11735:168435  Popup: Edit Group（註記「目前只有 Group Name 可供編輯」）
 *   #09-1 11735:168480  Toast: Group updated / Unable to update group
 *   #10   11735:168440  Popup: Remove Group
 *   #10-1 11735:168445  Popup: Group Deletion Not Allowed（有成員就不能刪）
 *   #10-2 11735:168484  Toast: Group removed / Unable to remove group
 *   #11   11735:168369  Popup: Invite User（⚠️ 這張只畫了 Role，沒有 Email 欄；#11-1 有，照 #11-1）
 *   #11-1 11735:168421  Invite User 錯誤（格式錯誤 + API Error Details）
 *   #11-2 / #11-3       Toast: User invited / Unable to invite user
 *   #12   11735:168458  frame 名稱寫「Popup: Edit Group」，畫面其實是 **Edit User**
 *                       （User Name 唯讀、Role 可改）。所以「#09 與 #12 同名」跟「Edit User
 *                       沒有編號彈窗」是同一件事：#12 命名錯了。兩個「Edit User」容器
 *                       （11735:168225 / 168229）是空的 Page Format。
 *   #12-1 11735:168468  Toast: User updated / Unable to update user
 *   #13   11735:168463  Popup: Remove User
 *   #13-1 11735:168476  frame 名稱寫 Toast: Updated，內容是 User removed / Unable to remove user
 * T2 的 Create / Edit / Remove Group、Invite / Edit / Remove User 都是「Same as T1」註記，同一組彈窗。
 * ============================================================ */
const CURRENT_USER_EMAIL = personEmail(NAME_POOL[0]);   // mock 的「目前登入者」：#02 註記說不能刪自己
const fm = {kind:null, busy:false, forceFail:false, forceApiError:false, groupId:null, t1Id:null, userId:null, name:'', role:'member', emails:'', errors:{}, apiError:null, errOpen:true};
const FM_TOAST = {
  editGroup:          {ok:'Group updated successfully.', err:'Unable to update group. Please try again later.'},   // #09-1
  removeGroup:        {ok:'Group removed successfully.', err:'Unable to remove group. Please try again later.'},   // #10-2
  editUser:           {ok:'User updated successfully.',  err:'Unable to update user. Please try again later.'},    // #12-1
  inviteUser:         {ok:'User invited successfully.',  err:'Unable to invite user. Please try again later.'},    // #11-2 / #11-3
  removeUser:         {ok:'User removed successfully.',  err:'Unable to remove user. Please try again later.'},    // #13-1
  inviteAdmin:        {ok:'Admin invited successfully.', err:'Unable to invite admin. Please try again later.'},   // 設計端暫擬（#07 系列沒畫 toast）
};
function openFm(kind, data){
  Object.assign(fm, {kind, busy:false, groupId:null, t1Id:null, userId:null, name:'', role:'member', emails:'', errors:{}, apiError:null, errOpen:true}, data);
  renderFm();
}
function closeFm(){ fm.kind = null; fm.seq = (fm.seq||0) + 1; fm.forceFail = false; fm.forceApiError = false; renderFm(); }
function fmGroup(){ return fm.t1Id ? findT2(fm.t1Id, fm.groupId) : findT1(fm.groupId); }
function fmUser(){ return usersFor(fm.groupId).find(user=>user.id===fm.userId); }
function openEditGroup(groupId, t1Id){
  const group = t1Id ? findT2(t1Id, groupId) : findT1(groupId);
  openFm('editGroup', {groupId, t1Id:t1Id||null, name:group?group.name:''});
}
/* #10-1 的觸發條件照文案：「must first remove all members from this group and any of its subgroups」
 * → 自己有成員、或（T1 時）任何一個子 T2 有成員，都不能刪。 */
function groupHasMembers(groupId, t1Id){
  if(usersFor(groupId).length) return true;
  if(!t1Id){ const t1 = findT1(groupId); return !!t1 && tier2GroupsFor(t1).some(t2=>usersFor(t2.id).length>0); }
  return false;
}
function openRemoveGroup(groupId, t1Id){
  openFm(groupHasMembers(groupId, t1Id) ? 'deletionNotAllowed' : 'removeGroup', {groupId, t1Id:t1Id||null});
}
function openInviteUser(groupId){ openFm('inviteUser', {groupId, t1Id: state.tier===2 ? state.t1Id : null}); }
function openEditUser(groupId, userId){
  const user = usersFor(groupId).find(item=>item.id===userId);
  openFm('editUser', {groupId, t1Id: state.tier===2 ? state.t1Id : null, userId, role:user?user.role:'member'});
}
function openRemoveUser(groupId, userId){ openFm('removeUser', {groupId, t1Id: state.tier===2 ? state.t1Id : null, userId}); }
function fmLiveEmail(){
  const before = fm.errors.emails || null;
  const after = emailListError(fm.emails);
  if(fm.apiError) fm.apiError = null;
  if(before !== after || !after){ if(after) fm.errors.emails = after; else delete fm.errors.emails; renderFm(); }
}
function fmSubmit(){
  if(fm.busy) return;
  if(fm.kind==='editGroup' && !fm.name.trim()){ fm.errors.name = NAME_EMPTY_ERR; renderFm(); return; }   // 沿用 #08-1 文案（#09 沒畫錯誤態，設計端暫擬）
  if(fm.kind==='inviteUser' || fm.kind==='inviteAdmin'){ const err = emailListError(fm.emails); if(err){ fm.errors.emails = err; renderFm(); return; } }
  fm.busy = true; renderFm();
  /* 每次送出帶一個序號：timer 回來時彈窗若已關掉或換成別的 kind，就當這次送出作廢。
   * 否則連續操作（或 Demo FAB 連點）時，上一個彈窗的 timer 會拿新彈窗的狀態去跑。 */
  const kind = fm.kind, seq = (fm.seq = (fm.seq||0) + 1);
  setTimeout(()=>{
    if(fm.seq !== seq || fm.kind !== kind) return;
    fm.busy = false;
    if(fm.kind==='inviteUser' || fm.kind==='inviteAdmin'){
      /* #11-1：API 判斷「已在其他群組」→ Error Details（#07-1 註記「其餘填寫＆格式檢查等行為定義同 UI #11-1」）。⚠️ 同一張稿的黃色便利貼寫「202601
       * 『使用者不可重複存在於不同群組』定義已改掉（目前可）」，所以這個錯誤態可能已經是
       * 死路，照稿留著但已列入回報。 */
      const list = splitEmails(fm.emails);
      const taken = fm.forceApiError ? list.slice() : list.filter(email=>TAKEN_EMAILS.has(email.toLowerCase()));
      if(taken.length){ fm.errors.emails = API_FIELD_ERR; fm.apiError = {field:'emails', emails:taken}; fm.errOpen = true; renderFm(); return; }
    }
    const failed = fm.forceFail;
    const toast = FM_TOAST[fm.kind];
    if(!failed) fmApply();
    closeFm();
    showToast(failed ? toast.err : toast.ok, failed ? 'error' : 'success');
    render();
  }, 600);
}
function fmApply(){
  const group = fmGroup();
  if(fm.kind==='editGroup' && group){ group.name = fm.name.trim(); group.lastUpdated = 'Just now'; }
  if(fm.kind==='removeGroup'){
    if(fm.t1Id){
      const t1 = findT1(fm.t1Id);
      const list = tier2GroupsFor(t1);
      const index = list.findIndex(item=>item.id===fm.groupId);
      if(index>=0) list.splice(index,1);
      t1.tier2 = list.length;
      if(state.view==='detail' && state.tier===2 && state.t2Id===fm.groupId) openDetail(1, t1.id, null, 'tier-2-groups');
    } else {
      const index = T1_GROUPS.findIndex(item=>item.id===fm.groupId);
      if(index>=0) T1_GROUPS.splice(index,1);
      if(state.view==='detail' && state.t1Id===fm.groupId) state.view = 'list';
    }
  }
  if(fm.kind==='editUser'){ const user = fmUser(); if(user) user.role = fm.role; }
  if(fm.kind==='removeUser'){ const list = usersFor(fm.groupId); const index = list.findIndex(user=>user.id===fm.userId); if(index>=0) list.splice(index,1); }
  if(fm.kind==='inviteAdmin'){
    splitEmails(fm.emails).forEach((email, index)=>ADMINS.push({id:`adm-inv-${Date.now()}-${index}`, name:'', email, role:'admin', active:false, lastLogin:'--'}));
  }
  if(fm.kind==='inviteUser'){
    /* 剛邀請、還沒啟用的人：名字未知（顯示 --）、Inactive、沒登入過。設計端暫擬，#11-2 只講「發送帳號啟用信」。 */
    const list = usersFor(fm.groupId);
    splitEmails(fm.emails).forEach((email, index)=>list.push({id:`${fm.groupId}-inv-${Date.now()}-${index}`, name:'', email, role:fm.role, active:false, lastLogin:'--'}));
  }
}
function renderFm(){

    html = `<div class="fm-head"><h3>Edit Group</h3>${closeBtn}</div>

        <input class="ipt ipt-lg" data-f="fm-name" value="${esc(fm.name)}" oninput="fm.name=this.value;if(fm.errors.name&&this.value.trim()){delete fm.errors.name;renderFm()}">

  } else if(fm.kind==='editUser'){

/* #32–#35 的 skeleton：表頭是灰 band 裡的灰條、不顯示欄位文字 */
function skeletonTable(cols, colgroup){
  const head = Array.from({length:cols}).map(()=>'<th class="skel-th"><div class="skel"></div></th>').join('');
  return `<div class="table-wrap"><table>${colgroup||''}<thead><tr>${head}</tr></thead><tbody>${skeletonRows(cols)}</tbody></table></div>`;
}
function openAdminList(){ state.view = 'admin'; render(); }
function renderAdmin(){
  const loading = state.pageState==='loading';
  const canSee = state.role==='admin';
  const cols = '<colgroup><col style="width:22%"><col style="width:26%"><col style="width:12%"><col style="width:14%"><col style="width:15%"><col style="width:11%"></colgroup>';
  let body;
  if(!canSee){
    /* 註記「只有權限在 Admin 以上層級者可看見此頁面」，沒畫非 Admin 看到什麼。設計端暫擬：沿用 no-access 語彙。 */
    body = `<div class="empty-state error"><div><span class="material-symbols-outlined">lock</span>
      <p class="empty-title">Admin List is only available to administrators</p>
      <p class="empty-copy">Please reach out to your administrator if you need access.</p></div></div>`;
  } else if(loading){
    body = skeletonTable(6, cols);
  } else if(state.pageState==='nodata'){
    body = `<div class="empty-state error"><div><span class="material-symbols-outlined">cloud_off</span>
      <p class="empty-title">Unable to load Admin List</p>
      <p class="empty-copy">Please try again. If the problem persists, contact your administrator.</p>
      <button class="btn btn-pri" onclick="state.pageState='set';render()">Retry</button></div></div>`;
  } else {
    /* Owner 固定第一位，其餘照原順序（#07 註記） */
    const rows = [...ADMINS].sort((a,b)=>(a.role==='owner'?0:1)-(b.role==='owner'?0:1)).map(admin=>{
      const locked = admin.role==='owner' || admin.email===CURRENT_USER_EMAIL;
      return `<tr>

        <td class="center">${admin.role==='owner'?'Owner':'Admin'}</td>
        <td class="center"><span class="status-text ${admin.active?'':'inactive'}">${admin.active?'Active':'Inactive'}</span></td>
        <td class="center">${esc(admin.lastLogin)}</td>

      </tr>`;
    }).join('');
    body = `<div class="table-wrap"><table>${cols}<thead><tr><th>User Name</th><th>Email</th><th class="center">Role</th><th class="center">Active Status</th><th class="center">Last Login</th><th class="center">Action</th></tr></thead><tbody>${rows}</tbody></table></div>`;

    <h1 class="org-title">Admin List</h1>
    <div class="section-head" style="align-items:center">
      <p class="section-copy">This page provides detailed information on all users who share admin privileges with you and their account activity.</p>

    </div>
    ${body}
    ${learnMoreHtml(false)}

}

window.DEMO_DEFAULT = 'admin';
window.DEMO_APPLY = function (id) {
  if (['admin','t1-manager','t1-member','t2-manager','t2-member'].includes(id)) {
    state.role = id; state.selectedResources = {}; render(); return;
  }
  if (['set','loading','empty','nodata'].includes(id)) { state.pageState = id; render(); return; }
  if (id === 'cloud-all')      { state.cloudAuth = 'all';      render(); return; }
  if (id === 'cloud-gcp-only') { state.cloudAuth = 'gcp-only'; render(); return; }
  if (id === 'assign-ba')      { assign.hasFolders = true;  openAssign('gcp'); return; }
  if (id === 'assign-folder')  { assign.hasFolders = true;  openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'assign-nofld')   { assign.hasFolders = false; openAssign('gcp'); return; }
  if (id === 'assign-deep')    { showDeepTree(); return; }
  if (id === 'style-component'){ assign.pickerStyle='component'; if(!assign.open){ openAssign('gcp'); setGroupBy('folder'); } else renderAssign(); return; }
  if (id === 'style-component-fix'){ assign.pickerStyle='component-fix'; if(!assign.open){ openAssign('gcp'); setGroupBy('folder'); } else renderAssign(); return; }
  if (id === 'style-tree')     { assign.pickerStyle='tree';      if(!assign.open){ openAssign('gcp'); setGroupBy('folder'); } else renderAssign(); return; }
  if (id === 'assign-first')   { setAssignedMode('none');  assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'assign-drift')   { setAssignedMode('mixed'); assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'assign-synced')  { setAssignedMode('all');   assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'org-multi')       { assign.multiOrg = true;  assign.hasFolders = true; if(!assign.open){ openAssign('gcp'); } setGroupBy('folder'); return; }
  if (id === 'org-single')      { assign.multiOrg = false; assign.hasFolders = true; if(!assign.open){ openAssign('gcp'); } setGroupBy('folder'); return; }
  if (id === 'path-deep')      { assign.pathMode='deep';  assign.indentCap=true; if(!assign.open){ openAssign('gcp'); } setGroupBy('folder'); return; }
  if (id === 'path-all')       { assign.pathMode='all';   assign.indentCap=true; if(!assign.open){ openAssign('gcp'); } setGroupBy('folder'); return; }
  if (id === 'path-micro')     { assign.pathMode='micro'; assign.indentCap=true; if(!assign.open){ openAssign('gcp'); } setGroupBy('folder'); return; }
  if (id === 'indent-cap')     { assign.indentCap = true;  if(!assign.open){ openAssign('gcp'); setGroupBy('folder'); } else renderAssign(); return; }
  if (id === 'indent-linear')  { assign.indentCap = false; if(!assign.open){ openAssign('gcp'); setGroupBy('folder'); } else renderAssign(); return; }
  if (id === 'sel-clear')      { assign.keepSelection = false; if(!assign.open){ openAssign('gcp'); } else renderAssign(); showToast('切換 Group by 會清掉已勾選（開發團隊目前立場），清掉時會在彈窗裡告知並給 Undo'); return; }
  if (id === 'sel-keep')       { assign.keepSelection = true;  if(!assign.open){ openAssign('gcp'); } else renderAssign(); showToast('切換 Group by 保留已勾選（UX 建議），勾選是專案 ID 的集合、跟視角無關'); return; }
  if (id === 'assign-fail')    { setAssignedMode('mixed'); assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); assign.forceFail = true; return; }

  /* ---- v3 P1：Create Group wizard ---- */
  const toList = () => { if(state.view!=='list'){ state.view='list'; render(); } };
  if (id === 'wz-open')   { toList(); openCreateGroup(1); return; }
  if (id === 'wz-format') { toList(); openCreateGroup(1); wizard.managers='mile.dsk, koe@mdl.com,'; wizardValidateInfo(); return; }
  if (id === 'wz-apierr') { toList(); openCreateGroup(1); wizard.forceApiError=true; wizard.name='Cohort Integration'; wizard.managers='cameron.cooper@five9.com, geole.chan@five9.com, halweo.ieation@five9.com'; renderWizard(); showToast('按 Next 就會看到 Error Details（這個情境把所有 email 都當成已在其他群組）'); return; }
  if (id === 'wz-invite') { toList(); openCreateGroup(1); wizard.name='Cohort Integration'; wizardGo(1); return; }
  if (id === 'wz-gcp')    { toList(); state.cloudAuth='all'; openCreateGroup(1); wizard.name='Cohort Integration'; wizardGo(2); return; }
  if (id === 'wz-noauth') { toList(); state.cloudAuth='gcp-only'; render(); openCreateGroup(1); wizard.name='Cohort Integration'; wizardGo(3); return; }
  if (id === 'wz-fail')   { toList(); openCreateGroup(1); wizard.name='Cohort Integration'; wizard.forceFail=true; wizardGo(3); showToast('按 Submit 會走失敗分支'); return; }

  /* ---- v3 P1：Label / Tag ---- */
  const toResources = (cloud, sub) => { openDetail(1,'biz-dev',null,'resources'); state.cloud=cloud; state.resSub[cloud]=sub; render(); };
  if (id === 'tag-gcp')    { toResources('gcp','tag'); openTagAssign('gcp'); return; }
  if (id === 'tag-aws')    { toResources('aws','tag'); openTagAssign('aws'); return; }
  if (id === 'tag-synced') { toResources('gcp','tag'); const set=assignedTagSet('biz-dev','gcp'); TAG_UNIVERSE.gcp.forEach(t=>set.add(t.id)); render(); openTagAssign('gcp'); return; }
  if (id === 'tag-fail')   { toResources('gcp','tag'); openTagAssign('gcp'); tagPick.forceFail=true; return; }
  if (id === 'res-multi')  { toResources('gcp','primary'); const ids=resourcesFor('biz-dev','gcp').map(r=>r.id); state.selectedResources.gcp=Object.fromEntries(ids.slice(0,Math.max(1,ids.length-1)).map(i=>[i,true])); render(); return; }

  /* ---- v3 P2：CRUD ---- */
  const toMembers = (t1) => { openDetail(1, t1, null, 'group-members'); };
  if (id === 'crud-edit-group')   { toMembers('biz-dev'); openEditGroup('biz-dev', null); return; }
  if (id === 'crud-remove-block') { toMembers('biz-dev'); openRemoveGroup('biz-dev', null); return; }
  if (id === 'crud-remove-group') { USERS_CACHE.set('hr', []); toMembers('hr'); openRemoveGroup('hr', null); return; }
  if (id === 'crud-invite')       { toMembers('biz-dev'); openInviteUser('biz-dev'); return; }
  if (id === 'crud-invite-err')   { toMembers('biz-dev'); openInviteUser('biz-dev'); fm.forceApiError=true; fm.role='manager'; fm.emails='cameron.cooper@five9.com, geole.chan@five9.com, halweo.ieation@five9.com'; renderFm(); showToast('按 Invite User 就會看到 Error Details（這個情境把所有 email 都當成已在其他群組）'); return; }
  if (id === 'crud-edit-user')    { toMembers('biz-dev'); openEditUser('biz-dev', usersFor('biz-dev')[1].id); return; }
  if (id === 'crud-remove-user')  { toMembers('partnerships'); openRemoveUser('partnerships', usersFor('partnerships')[1].id); return; }   // partnerships 的第 4 位是 mock 的目前登入者，刪除鈕會是 disabled
  if (id === 'crud-fail')         { fm.forceFail = true; showToast('下一個 Edit / Remove / Invite 送出會走失敗 toast'); return; }
  if (id === 'members-empty')     { USERS_CACHE.set('legal', []); toMembers('legal'); return; }

  /* ---- v3 P3 ---- */
  if (id === 'admin-list')     { state.pageState='set'; state.role='admin'; openAdminList(); return; }
  if (id === 'admin-invite')   { state.pageState='set'; state.role='admin'; openAdminList(); openInviteAdmin(); return; }
  if (id === 'admin-loading')  { state.role='admin'; openAdminList(); state.pageState='loading'; render(); return; }
  if (id === 'admin-noaccess') { state.pageState='set'; state.role='t1-manager'; openAdminList(); return; }
  if (id === 'load-detail')    { toMembers('biz-dev'); state.pageState='loading'; render(); return; }
  if (id === 'load-res')       { openDetail(1,'biz-dev',null,'resources'); state.pageState='loading'; render(); return; }
  if (id === 'load-list')      { state.view='list'; state.pageState='loading'; render(); return; }
  if (id === 'no-group')       { state.view='list'; state.pageState='empty'; render(); return; }
};
</script>
<script>
/* === Inlined: shared/demo-fab.js === */
/*!
 * demo-fab.js — Lumiture Designer Demo Scenarios (Shared Module v2)
 *
 * Auto-injects:
 *   - .demo-fab (FAB button, bottom-left)

 *
 * Required globals:
 *   window.DEMO_SCENARIOS = [...]   — scenario list
 *   window.DEMO_APPLY     = fn      — called with (id, btn) when scenario clicked
 *
 * Optional globals:
 *   window.DEMO_PAGES = [{id, label, icon}]      — page tabs (top row, pill style)
 *   window.DEMO_CATEGORIES = [{id, label, icon, hint}]  — category tabs (underline style)
 *   window.DEMO_DEFAULT = 'scenario-id'           — initial active scenario
 *
 * Rendering modes (auto-detected):
 *   1. No pages, no categories → flat list of buttons
 *   2. Pages only (LumiTag pattern) → underline tabs at top, scenarios filtered by page
 *   3. Categories only (single-page Cost Dashboard pattern) → underline tabs, scenarios filtered by category
 *   4. Pages + Categories → two-layer: pill page tabs (top) + underline category tabs (bottom)
 *
 * Scenario schema:
 *   {
 *     id:        string,           // unique
 *     label:     string,
 *     icon:      string,           // Material Symbols name
 *     tip:       string?,          // hover tooltip (rendered via #gl-tip, NOT ::after)
 *     page:      string?,          // matches DEMO_PAGES[].id (alias: 'tab' for backwards compat)
 *     category:  string?,          // matches DEMO_CATEGORIES[].id
 *     isNoData:  boolean?,         // groups under "no data" sub-divider
 *     disabled:  boolean?,         // shows "Soon" badge, not clickable
 *   }
 *
 * Programmatic API:
 *   window.demoFabSwitchTab(pageId)    // switch to a specific page tab (called on navigation)
 *   window._demoFabToggle()            // open/close popover
 *   window._demoFabApply(id, btn)      // apply a scenario (internal)
 */
(function () {

    '.demo-fab .material-symbols-outlined{font-size:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}',
    '.demo-fab.popped{box-shadow:0 4px 14px rgba(13,27,62,.36),inset 0 2px 6px rgba(0,0,0,.28)}',
    '.demo-fab .demo-pulse{position:absolute;top:5px;right:5px;width:9px;height:9px;background:#FF403D;',
    'border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 0 rgba(255,64,61,.6);animation:demoPulse 1.6s ease-in-out infinite}',
    '@keyframes demoPulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,64,61,.6)}',
