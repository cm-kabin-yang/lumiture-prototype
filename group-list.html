/* 排序鍵：完整路徑，不是畫面上的縮寫字串。
 * 縮寫版裡的「…」(U+2026) 排在所有英文字母後面，深層資料夾會被丟到同一個 root 的
 * 最底下，不會緊貼著它的上層。分隔符用 \u0001（比任何可見字元都小），
 * 所以一個資料夾底下的子層一定緊接在它後面，依這欄排序就等於攤平的樹。 */
function folderSortKey(node, cloud){
  return folderColumnSegmentsFull(node, cloud).join('\u0001').toLowerCase();
}
/* 外層表格的 GCP 資料改成從資料夾樹取，不再用另一套 GCP_PROJECTS / GCP_BAS。
 * 那兩套原本是各自獨立的 mock（表格是 finops-prod-core + CloudMile Master Billing，
 * 樹裡是 reporting-iac + corp-main-billing），同一個專案在彈窗與表格會長得完全不一樣。
 * 加上 Folder 欄之後這個矛盾會直接被看見（欄位值對不上彈窗裡的樹），所以一併統一。
 * ⚠️ 刻意不看 `p.assigned`：那個旗標是彈窗「只列未指派」的情境開關（Demo FAB 的
 * assign-first／drift／synced 在切它，預設是全部未指派），不是「這個群組擁有什麼」。
 * 拿它當表格的資料來源，表格會跟著彈窗情境一起變空。 */
/* 把 extra 平均插進 base，不要接在尾端。
 * 接尾端的話那些列會全部落在 pool 最後一段，而取樣 seed 打不到那麼後面，
 * 等於那個狀態在畫面上永遠不會出現（No folder 跟第二個 org 都踩過這個坑）。
 * 順序在這裡本來就沒有語意，平均散開才能讓每個狀態都被看得到。 */
function spreadInto(base, extra){
  if(!extra.length) return base;
  const queue = extra.slice();
  const step = Math.max(1, Math.floor(base.length / extra.length));
  const out = [];
  base.forEach((row, index)=>{
    out.push(row);
    if(index % step === step - 1 && queue.length) out.push(queue.shift());
  });
  return out.concat(queue);
}
function gcpProjectPool(){
  /* 每個 org 各自收一份再交錯，不是一個 org 接著一個 org。
   * 真實情況本來就可能有一個群組同時指派到兩個 org 的專案，
   * 那正是 Organization 欄存在的理由，所以交錯不是 demo 作弊、是比較貼近真實。 */
  const perOrg = activeOrgs().map(org=>{
    const rows = [];
    walkFolders(org.folders, node=>{
      node.projects.forEach(p=>rows.push({p, folder:node, org}));
    });
    return rows;
  });
  const foldered = perOrg.reduce((acc, rows)=>acc.length ? spreadInto(acc, rows) : rows, []);
  const loose = UNASSIGNED_PROJECTS.map(p=>({p, folder:null, org:activeOrgs()[0]}));
  return spreadInto(foldered, loose);
}
/* Demo 專用的策展列（`state.hierShowcase`）。一般情境的列是依 groupId 取樣的，
 * 深度落在哪裡是隨機的，所以「階層位置欄在各種深度長怎樣」這件事要嘛看不到、
 * 要嘛得一組一組翻。這個情境直接把第 1／2／4／7／10 層跟 No folder 排在一起，
 * 讓深度範圍一眼看完。**只有 Demo FAB 會開**，真實流程不會走到。 */
const HIER_SHOWCASE = {
  /* 第 1 層／第 2 層撞名／第 4 層中間層撞名（regional 兩條只差中間那段）／第 7 層／第 10 層／沒有歸屬 */
  gcp:   ['f-data', 'f-platform-staging', 'f-reg-a-staging', 'deep-6', 'deep-9', null],
  aws:   ['ou-security', 'ou-wk-staging', 'ou-sb-staging', 'ou-pay-ledger', null],
  azure: ['mg-decom', 'mg-corp-prod', 'mg-lz-prod', 'mg-edge', null],
};
function findHierNode(cloud, id){
  let hit = null;
  walkFolders(hierarchyTree(cloud), node=>{ if(node.id === id) hit = node; });
  return hit;
}
function showcaseRows(cloud){
  const pool = cloud==='gcp' ? gcpProjectPool()
    : (cloud==='aws' ? AWS_PICK_ACCOUNTS : AZURE_RESOURCE_GROUPS).map(r=>({p:r, folder:r.hier, org:null}));
  return (HIER_SHOWCASE[cloud]||[]).map((nodeId, index)=>{
    const node = nodeId ? findHierNode(cloud, nodeId) : null;
    /* 找一個真的住在那個容器底下的資源，沒有就從 pool 借一個名字，
     * 重點是演欄位不是演資料完整性 */
    const owned = node && node.projects && node.projects.length ? node.projects[0] : null;
    const res = owned || pool[index % pool.length].p;
    const org = cloud==='gcp'
      ? (pool.find(r=>r.p===res) || {}).org || activeOrgsFor('gcp')[0]
      : (node ? orgForHier(node, cloud) : activeOrgsFor(cloud)[0]);
    return {id:`showcase-${cloud}-${index}`, name:res.name||NO_COST_LABEL, subId:res.resId,
      parentName:res.parent.name, parentId:res.parent.id,
      folderNode:node, orgName:org && org.name, orgId:org && org.orgId, canRemove:true};
  });
}
/* X-9r5 GA17：群組的 resource 計數是 0 就真的沒有資源（稿 #03-2／#06-1 的 No Resources Yet 才到得了）；
 * 其餘群組維持原本的策展列數（計數是三朵雲合計、這裡只展示 GCP／AWS／Azure 各幾列，Engineering 142 那種已列排除清單） */
function groupById(id){
  const t1 = T1_GROUPS.find(g=>g.id===id);
  if(t1) return t1;
  for(const g of T1_GROUPS){ const hit = tier2GroupsFor(g).find(x=>x.id===id); if(hit) return hit; }
  return null;
}
function resourcesFor(groupId, cloud){
  if(state.hierShowcase) return showcaseRows(cloud);
  const grp = groupById(groupId);
  if(grp && grp.resource === 0) return [];
  const seedBase = groupId.length + (cloud==='aws'?1:cloud==='azure'?2:0);
  const count = 1 + (seedBase % 4);
  const out=[];
  for(let index=0;index<count;index++){
    if(cloud==='gcp'){
      /* 取樣用質數步長打散：原本 pick(pool, seedBase+index) 的 seed 只有 2~22，
       * 永遠落在 pool 最前面幾筆，導致同一組的資源全擠在相鄰資料夾、而且
       * 排在尾端的 No folder 專案永遠取不到（那個狀態看不到等於沒做）。 */
      const pool = gcpProjectPool();
      const row = pool.length ? pick(pool, seedBase*37 + index*53) : null;
      if(!row) continue;
      out.push({id:groupId+'-gcp'+index, name:row.p.name||NO_COST_LABEL, subId:row.p.resId,
        parentName:row.p.parent.name, parentId:row.p.parent.id,
        folderNode:row.folder, orgName:row.org.name, orgId:row.org.orgId, canRemove:true});
    }
    else {
      /* AWS / Azure 跟 GCP 走同一套：從該雲自己的巢狀樹取，資源身上帶著 `hier`
       * （attachHierarchy 掛的），所以階層欄三朵雲用同一個機制長出來。
       * 原本這兩朵雲是從 AWS_ACCOUNTS / AZ_RG 這組只有 2~3 筆的常數取，
       * 跟彈窗用的 AWS_PICK_ACCOUNTS / AZURE_RESOURCE_GROUPS 是兩個平行宇宙，
       * 跟 GCP 先前那個矛盾一模一樣，一併收掉。 */
      const pool = cloud==='aws' ? AWS_PICK_ACCOUNTS : AZURE_RESOURCE_GROUPS;
      const res = pick(pool, seedBase*37 + index*53);
      const org = res.hier ? orgForHier(res.hier, cloud) : activeOrgsFor(cloud)[0];
      out.push({id:`${groupId}-${cloud}${index}`, name:res.name, subId:res.resId,
        parentName:res.parent.name, parentId:res.parent.id,
        folderNode:res.hier, orgName:org && org.name, orgId:org && org.orgId, canRemove:true});
    }
  }
  return out;
}

 * 單一 org 時全部歸同一個，欄位本來就不會顯示。 */
function orgForHier(node, cloud){
  const orgs = activeOrgsFor(cloud);
  if(orgs.length <= 1) return orgs[0];
  const roots = hierarchyTree(cloud);
  const path = hierIndex(cloud).paths.get(node.id) || [];
  const rootName = path.length ? path[0] : node.name;
  const index = roots.findIndex(r=>r.name === rootName);
  return orgs[index >= Math.ceil(roots.length / 2) ? 1 : 0];
}
/* 把扁平清單的資源依序發配到樹上，兩邊指向同一批物件（不是複製）。
 * 資源比 take 總和多的時候，剩下的掛回第一個根節點，不讓任何資源沒有位置。 */
function attachHierarchy(resources, tree){
  let cursor = 0;
  walkFolders(tree, node=>{
    node.projects = [];
    for(let n=0; n<(node.take||0) && cursor<resources.length; n++){
      const res = resources[cursor++];
      res.hier = node;
      node.projects.push(res);
    }
  });
  while(cursor < resources.length){
    const res = resources[cursor++];
    res.hier = tree[0];
    tree[0].projects.push(res);
  }
}

function relTimeToDays(s){
  if(!s) return 999999;
  if(/today/i.test(s)) return 0;
  if(/yesterday/i.test(s)) return 1;
  const m = s.match(/(\d+)\s*(hour|day|week|month|year)/i);
  if(!m) return 999999;
  const n = +m[1], unit = m[2].toLowerCase();
  const mult = unit==='hour'?(1/24):unit==='day'?1:unit==='week'?7:unit==='month'?30:365;
  return n*mult;
}
function dateToTs(s){
  const m = String(s).match(/(\d+)\/(\d+)\/(\d+)/);
  if(!m) return 0;
  return new Date(+m[3], +m[2]-1, +m[1]).getTime();
}
function sortIconHtml(tableKey,colKey){
  const s = state.sort[tableKey];
  const active = s.key===colKey;
  const color = active ? 'var(--lt-color-primary)' : 'var(--lt-grey-300)';
  const name = (active && s.dir===-1) ? 'arrow_downward' : 'arrow_upward';
  return `<span aria-hidden="true" class="material-symbols-outlined sort-ic" style="color:${color}">${name}</span>`;
}
const SORT_LABELS = {};
function sortHeader(label, tableKey, colKey, centered){
  /* X-9r5 GA28：th scope／aria-sort，排序改 th 內真 button（.th-sort 外觀同前；th.sortable、.sort-ic、toggleSort 保留） */
  const s = state.sort[tableKey];
  const dir = s.key===colKey ? (s.dir===1 ? 'ascending' : 'descending') : 'none';
  SORT_LABELS[tableKey+':'+colKey] = label;
  return `<th class="sortable${centered?' center':''}" scope="col" aria-sort="${dir}" onclick="toggleSort('${tableKey}','${colKey}')"><button type="button" class="th-sort">${label}${sortIconHtml(tableKey,colKey)}</button></th>`;
}
function toggleSort(tableKey,colKey){
  const s = state.sort[tableKey];
  if(s.key!==colKey){ s.key=colKey; s.dir=1; }
  else if(s.dir===1){ s.dir=-1; }
  else { s.key=null; s.dir=0; }
  render();
  const lbl = SORT_LABELS[tableKey+':'+colKey] || colKey;
  announce(s.key===colKey ? `Sorted by ${lbl}, ${s.dir===1?'ascending':'descending'}` : `Sorting by ${lbl} cleared`);   // X-9r5 GA27
}
function sortRows(rows, tableKey, accessors){
  const s = state.sort[tableKey];
  if(!s.key || !accessors[s.key]) return rows;
  const acc = accessors[s.key];
  return [...rows].sort((a,b)=>{
    const va=acc(a), vb=acc(b);
    if(va<vb) return -1*s.dir;
    if(va>vb) return 1*s.dir;
    return 0;
  });
}

const CLOUD_META = {

/* ===== Resources 表格搜尋（2026-09-24 做成真的） =====
 * 行為照 FE ResourcesSearch：前端篩選（API 一次抓回整個群組）、500ms debounce、
 * 不分大小寫的「包含」、每朵雲各自一份字串、命中字全部高亮。
 * FE 現況只比對「資源 name/ID ＋ 上層 name/ID」；這裡多比對兩個欄位：
 *   ① 階層位置的完整路徑（每一層都算，所以搜 platform 會列出它整棵子樹的專案）
 *   ② Organization（多 org 時才有這欄）
 * ⚠ 這兩個欄位 FE 的 /resources/assigned 回傳目前沒有，要先請後端補。 */
/* X-9r5 Q1（Kabin 裁決）：單行 `name (ID)`，ID 次要灰；回傳整格 <td>，截斷由 markTruncated 掛 tooltip（textContent＝"name (ID)"） */
function nameIdTd(name, id, q){
  return `<td class="cell-ellipsis cell-name-id">${hlq(name,q)}${id!=null&&id!==''?` <span class="idg">(${hlq(id,q)})</span>`:''}</td>`;
}
function resQuery(){ return (state.resSearch[state.cloud] || '').trim().toLowerCase(); }
function hlq(text, q){
  const str = String(text == null ? '' : text);
  if(!q) return esc(str);
  const low = str.toLowerCase(); let out = '', from = 0, at;
  while((at = low.indexOf(q, from)) >= 0){
    out += esc(str.slice(from, at)) + '<span class="hl">' + esc(str.slice(at, at + q.length)) + '</span>';
    from = at + q.length;
  }
  return out + esc(str.slice(from));
}
function resourceMatches(r, q){
  if(!q) return true;
  const hay = [r.name, r.subId, r.parentName, r.parentId, r.orgName, r.orgId];
  if(r.folderNode){
    const segs = folderColumnSegmentsFull(r.folderNode, state.cloud);
    hay.push(...segs, segs.join(' / '));
  }
  return hay.some(v => v && String(v).toLowerCase().includes(q));
}
let _resSearchTimer = null;
function onResSearch(input){
  const value = input.value;
  clearTimeout(_resSearchTimer);
  _resSearchTimer = setTimeout(()=>{
    state.resSearch[state.cloud] = value;
    const caret = input.selectionStart;
    render();
    if(value.trim()){ const n = resourcesFor(currentGroupId(), state.cloud).filter(r=>resourceMatches(r, resQuery())).length; announce(n ? `${n} result${n===1?'':'s'}` : 'No matching resources'); }   // X-9r5 GA27
    /* render() 整頁重建，輸入框會失焦；照彈窗那套把焦點與游標還回去 */
    const el = document.getElementById('res-search');
    if(el){ el.focus(); try{ el.setSelectionRange(caret, caret); }catch(_){} }
  }, 500);
}

    let tableBlock;
    if(!rowsData.length && q){

    } else if(!rowsData.length){

Please assign new resources or reach out to your administrator for help.</p></div></div>`;

      const rows = sortRows(tags, 'resources', tagAccessors).map(r=>`<tr class="${selected[r.id]?'selected':''}">

    } else {
      /* Folder 欄只有 GCP 有。這不是 GCP 特例——這張表的欄位本來就隨雲不同
       * （AWS 是 Management Account、Azure 是 Subscription），每朵雲照自己的階層命名。
       * AWS 的 Organizational Unit / Azure 的 Management Group 是對應物，這輪沒有需求證據，不一起推。
       * 沒有資料夾的專案顯示 No folder，沿用 .is-nocost 的斜體次要色（跟 No Cost Project 同一種處理）。 */
      /* 階層欄三朵雲都有（2026-09-22）。三雲的結構同型、只是名稱與深度上限不同：
       * GCP Folder 10 層／AWS Organizational Unit 5 層／Azure Management Group 6 層。

      const hasFolderCol = !!CLOUD_META[state.cloud].hierCol;
      /* Organization 欄只在「GCP 且真的有多個 org」時出現，條件跟彈窗的區段標頭共用

       * （第一層資料夾沒有祖先可爬，distinguishingSegments() 回傳 0），
       * 彈窗靠 org 區段標頭擋住，平的表格沒有區段就沒人擋，
       * Folder 欄會出現兩列一模一樣的字串指向不同資料夾。 */
      const hasOrgCol = !!CLOUD_META[state.cloud].orgCol && isMultiOrg();
      const noHierLabel = `No ${CLOUD_META[state.cloud].hierCol.toLowerCase()}`;
      const folderText = r => r.folderNode ? folderColumnText(r.folderNode, state.cloud) : noHierLabel;
      const resAccessors = {col1:r=>r.name.toLowerCase(), col2:r=>r.parentName.toLowerCase(),
        folder:r=>r.folderNode ? folderSortKey(r.folderNode, state.cloud) : '\uffff', org:r=>(r.orgName||'').toLowerCase()};
      const rows = sortRows(projects, 'resources', resAccessors).map(r=>`<tr class="${selected[r.id]?'selected':''}">

          ${nameIdTd(r.name, r.subId, q)}
          ${nameIdTd(r.parentName, r.parentId, q)}
          ${hasOrgCol?nameIdTd(r.orgName||'', r.orgId||'', q):''}
          ${hasFolderCol?`<td class="cell-ellipsis${r.folderNode?' has-fptip':' is-nofolder'}"${r.folderNode?` tabindex="0"${hasOrgCol&&r.orgName?` data-forg="${esc(r.orgName)}"`:''} data-fpath="${esc(folderColumnSegmentsFull(r.folderNode, state.cloud).join('\n'))}" aria-label="${esc(folderColumnFullPath(r.folderNode, state.cloud))}"`:''}>${r.folderNode?folderColumnHtml(r.folderNode, state.cloud, q):esc(noHierLabel)}</td>`:''}
          <td><button class="lt-btn-icon" ${!(r.canRemove&&canRemove)?'disabled':''} onclick="openUnlinkDialog('${group.id}','${state.cloud}',['${r.id}'],'${bucketKey}')"data-tip="Unlink Resource" aria-label="Unlink Resource"><span aria-hidden="true" class="material-symbols-outlined">link_off</span></button></td>
        </tr>`).join('');
      /* 欄位順序（2026-09-24 第二次調整）：Project → Billing Account → (Organization) → Folder → Action。
       * ①跟彈窗 Group by 切換器同一個順序（Billing account → Folder）
       * ②production 既有的前兩欄（Project、Billing Account）位置不動，Folder 是新增的、接在後面
       * ③長度不固定的路徑放最後，吃剩下的寬度；Organization 緊貼在它前面，先讀範圍再讀路徑
       * 欄寬：Billing Account 固定 240px（真實 GCP BA ID 20 字元，22% 在 1024px 只剩 167px 放不下），
       * 多 org 時欄位變多，表格最小寬度拉到 960px，窄螢幕改橫向捲動，不讓路徑被擠到剩幾個字。 */
      /* X-9r5 Q1（Kabin 裁決）：Project／Org 改單行 `name (ID)` 後字串變長，Project 22→28%（有 Organization 欄時 24%）、Organization 18→20%，
       * 多出來的寬度由吃剩下的 Folder 欄讓出（Folder 有 .fcell 中段截斷＋tooltip）；仍放不下的格子 ellipsis＋完整字串 tooltip */
      const resCols = hasOrgCol
        ? `<col style="width:48px"><col style="width:24%"><col style="width:240px"><col style="width:20%"><col><col style="width:80px">`
        : hasFolderCol
        ? `<col style="width:48px"><col style="width:28%"><col style="width:240px"><col><col style="width:80px">`

    }
    const seg = `<div class="seg" role="tablist">
        <button class="seg-btn ${sub==='primary'?'active':''}" role="tab" aria-selected="${sub==='primary'}" onclick="setResSub('primary')">${CLOUD_META[state.cloud].col1}<span class="seg-cnt">${allProjects.length}</span></button>
        <button class="seg-btn ${sub==='tag'?'active':''}" role="tab" aria-selected="${sub==='tag'}" onclick="setResSub('tag')">${esc(terms.tab)}<span class="seg-cnt">${tags.length}</span></button>

    /* #03-5：Unlink Resource 是藍色 outline（跟 Assign Resource 同一組主色），不是紅色。
     * v2 做成 danger 紅框是設計端自己加的，這裡改回設計稿。 */
    const assignClick = sub==='tag' ? `openTagAssign('${state.cloud}')` : `openAssign('${state.cloud}')`;

/* 表頭全選（#03-5）：全開就全關，否則全開 */
function toggleAllResources(bucket, ids){

/* ============================================================
 * Assign Resource — folder tree picker
 * 骨架採「資料夾 → 專案」，帳單帳戶降級成篩選器（見
 * specs/2026-09-03-group-list-folder-view-ux-response.md 第一節）。
 * 走「帳單帳戶 → 資料夾 → 專案」的話，橫跨兩個 BA 的資料夾會因此
 * 出現兩次，使用者勾一個會以為選完、實際只拿到一半。
 * ============================================================ */
const assign = {
  open:false,
  host:'modal',        // modal | wizard —— 選單被誰裝著（v3：Create Group 第 3/4 步內嵌同一個選單）
  cloud:'gcp',         // gcp | aws | azure，決定名詞與資料來源
  /* component = 完全照 libs/lumiture-ui 的 GroupedMultiSelect（Cost Dashboard
   *             的 Tag / Label Value 下拉）語言，直接延伸到多層
   * component-fix = 同上，只改兩個數字：縮排步進 32→16、箭頭從右移到左。
   *             其餘（藍底 band、單行 name (id)、無引導線、無資料夾 icon、
   *             不 sticky）完全不動，對現有九個消費端影響最小
   * tree      = 我原本做的樹狀版（左側箭頭、縮排引導線、巢狀 sticky）
   * 放兩套是為了讓 Kabin 實際感受「既有元件延伸到多層」會遇到什麼，
   * 而不是只讀我的文字分析。Demo FAB 可即時切換。 */
  pickerStyle:'tree-tint-hover',   // 2026-09-24 Kabin 定案：樹狀＋資料夾底色，引導線照 VS Code 預設「游標進清單才顯示」。常駐版與 component 系列留作對照
  hasFolders:true,     // org 完全沒開資料夾時退回現行的 BA → Project 兩層
  /* false ＝ 切 Group by 就清掉已勾選（開發團隊 2026-09-10 立場，RD 出兩支
   * 獨立 API）。清掉時會在彈窗裡告知並給 Undo，不靜默。true ＝ 保留（UX
   * 建議），Demo FAB 可切。 */
  /* true ＝ 縮排封頂在第 4 層 + 深層用祖先路徑補（2026-09-10 預設）。
   * false ＝ 原本的線性縮排，留著對照「波動拳」長什麼樣。 */
  /* 是否授權了多個 GCP org。true 才長出 org 區段標頭，單一 org 畫面完全不變。 */
  multiOrg:false,
  /* 深層樹的路徑策略：
   *   'deep' = 預設。縮排封頂時才補路徑（C 案不封頂，所以實際只在搜尋／撞名時出現）
   *   'all'  = 每一列都顯示緊鄰上層（語言一致，但淺層全是冗餘）
   * 'micro'（封頂後改 8px 步進）與它的常駐引導線 2026-09-24 否決，程式碼已移除。 */
  pathMode:'deep',
  /* 2026-09-24 Kabin 定案 C：整棵樹只有一種步距（16px，不封頂），平常不畫線，
   * 滑鼠停在哪一列只亮它所屬的那一條。封頂（A）、micro＋常駐引導線（B）已否決、情境已移除 */
  indentCap:false,
  keepSelection:false,
  clearedSelection:null,   // Undo 用，切視角清掉的那一份
  clearedCount:0,
  loading:false,
  expanded:{},
  selected:{},
  search:'',
  groupBy:'ba',       // ba | folder —— 預設維持現行的帳單帳戶視角，Folder 是新增的選項。
                      // 選取單位是專案、分組只是呈現，所以切換不會弄丟已勾的東西
};
let assignSearchTimer;
let assignFetchTimer;

/* ⚠️ 這個彈窗只列「尚未被指派的資源」，依設計稿註記
 * （Figma 11735:168385「僅顯示『尚未被 assign 的資源』」）。
 * 移除是另一條路：Resources 表格批次勾選 → [Unlink Resource] → 彈窗 #20
 * （Figma 12801:76215），T1 還會先跑 group-check 列出受影響的 T2 群組。
 * 所以這裡沒有取消指派，也不該有。
 *
 * 實作上有一個必須注意的點：PUT platforms/{platform}/resources/assign
 * 是「覆寫整份清單」不是「追加」——
 *   - backend/api/user.md R5：Cleans existing resource perms, then assigns new
 *     ones. For tier-one groups, also cleans removed resources from child
 *     tier-two groups
 *   - domain/identity/organization.md（Resource Assignment Flow）：
 *     PUT assign - replaces full assignment set
 * 所以畫面只顯示未指派的、送出時必須帶上「已指派的 + 這次勾的」。
 * 只送這次勾的會把群組原本的資源全部洗掉，T1 還連帶清掉子 T2。
 *
 * ⚠️ 現況 FE 兩件事都沒做：GCPAssignResourcesContent 完全沒讀 assigned
 * （所以沒過濾、也沒辦法在送出時補上既有的），GCPAssignResources 每次
 * 開啟都是 useState([])。詳見 specs 的 §8.11。 */

/* 選單的狀態重置抽成 startAssignPicker()，因為 v3 起有兩個宿主：
 *   modal  = Resources 分頁的 Assign Resource 彈窗（v2 原本的用法）
 *   wizard = Create Group 第 3 / 4 步（#31 / #37）內嵌同一個選單
 * renderAssign() 依 assign.host 決定重畫哪一個外殼，選取 / 搜尋 / 分組邏輯完全共用。 */
function startAssignPicker(cloud){
  assign._resetScroll = true;
  assign.cloud = cloud || state.cloud || 'gcp';
  assign.loading = true;
  assign.searching = false;
  assign.clearedSelection = null;
  assign.clearedCount = 0;
  /* 照設計稿：預設收合，先看到第一層資料夾，展開才往下看。 */
  assign.expanded = {};
  assign.selected = {};
  assign.forceFail = false;
  assign.search = '';
  assign.typed = null;
  /* 預設維持現行的帳單帳戶視角（既有客戶操作不變），資料夾是切過去的第二個視角。 */
  assign.groupBy = 'ba';
  setTimeout(()=>{ assign.loading = false; renderAssign(); }, 500);
}
function openAssign(cloud){
  startAssignPicker(cloud);
  assign.host = 'modal';
  assign.open = true;
  renderAssign();
}
function closeAssign(){ assign.open = false; renderAssign(); }

/* 帳單帳戶篩選只縮小「看得到的專案」，不改變樹的骨架 */
function projectVisible(project){
  if(project.assigned) return false;   // 已指派的不進這個選單（設計稿註記）
  if(!assign.search) return true;
  const term = assign.search.toLowerCase();
  /* 搜尋範圍＝「當下視角的分組軸」＋「專案本身」（2026-09-10 Kabin 定義）：
   *   資料夾視角 → 資料夾名（folderMatches）＋ 專案 name / ID
   *   帳單帳戶視角 → 帳單帳戶名（parent）＋ 專案 name / ID
   * 已知取捨：資料夾視角的專案列右邊掛著帳單帳戶 chip，但那個名稱在這個視角
   * 搜不到。看得見卻搜不到會讓人困惑，不過反過來（兩個視角都搜全部欄位）會讓
   * 結果出現「不知道為什麼命中」的列，兩害相權取這邊，規則也比較講得清楚。 */
  const hitSelf = projectLabel(project).toLowerCase().includes(term)
    || project.resId.toLowerCase().includes(term);
  if(hitSelf) return true;
  return assign.groupBy === 'ba' && project.parent.name.toLowerCase().includes(term);
}
/* 一般情況只比對資料夾名稱——使用者要找 infra 就打 infra，**不必打整條路徑**。
 * PM 擔心「顯示路徑會不會逼使用者打 corp/platform/infra 才搜得到」：不會，顯示
 * 跟查詢是兩件事，路徑只回答「這是哪一個 infra」。
 * 但工程師確實喜歡用路徑找東西，所以加一個漸進式的支援：**查詢字串裡有 `/` 才
 * 切成路徑比對**（比對 `祖先/.../自己`）。沒人被迫打斜線，想用的人打得到，
 * 跟 Gmail 的 `from:` 是同一種設計——強力功能靠語法 opt-in，不改變預設行為。 */
function folderMatches(node){
  if(!assign.search) return false;
  const term = assign.search.toLowerCase();
  if(term.includes('/')){
    const full = (hierIndex(assign.cloud).paths.get(node.id) || []).concat(node.name).join('/').toLowerCase();
    /* 空白容錯：使用者可能照畫面打「platform / staging」 */
    return full.includes(term.replace(/\s*\/\s*/g, '/'));
  }
  return node.name.toLowerCase().includes(term);
}
/* 資料夾自己命中搜尋時，底下的專案整批留著，不然搜到資料夾卻看不到內容 */
function visibleProjectsOf(node, inheritedMatch){
  const keepAll = inheritedMatch || folderMatches(node);
  const own = node.projects.filter(project => keepAll ? inFolderScope(project) : projectVisible(project));
  let total = own.length;
  node.children.forEach(child=>{ total += visibleProjectsOf(child, keepAll).length; });
  return keepAll ? allProjectsOf(node).filter(inFolderScope) : (function(){
    let acc = own.slice();
    node.children.forEach(child=>{ acc = acc.concat(visibleProjectsOf(child, false)); });
    return acc;
  })();
}
function nodeHasVisible(node){ return visibleProjectsOf(node, false).length > 0 || folderMatches(node); }

/* 這個選單的可選範圍：未指派 + 通過帳單帳戶篩選 */
function inFolderScope(project){ return !project.assigned; }
function selectedIn(projects){ return projects.filter(project=>assign.selected[project.id]).length; }
/* Demo 用：三種指派狀態。mixed = mock 原始值（當初指派過、之後 GCP 又長出新專案）， 
 * none = 第一次指派（全部可選），all = 全部都指派過（提示不出現） */
let ASSIGNED_SNAPSHOT = null;
function setAssignedMode(mode){
  const projects = everyProject();
  if(!ASSIGNED_SNAPSHOT) ASSIGNED_SNAPSHOT = new Map(projects.map(project=>[project.id, project.assigned]));
  projects.forEach(project=>{
    project.assigned = mode==='none' ? false : mode==='all' ? true : ASSIGNED_SNAPSHOT.get(project.id);
  });
  assign.selected = {};
}
function everyUnassigned(){ return everyProject().filter(project=>!project.assigned); }
/* 父層勾選框「全選」跟畫面上實際看得到的列，之前是兩個不同的集合：
 * 顯示用 visibleProjectsOf()（有搜尋時只算搜到的），但點擊全選卻是
 * selectableOf()（不管有沒有搜尋，永遠是整個資料夾底下全部）。
 * 後果：搜尋只篩出 1 個子項目時，勾這個資料夾的全選會連同畫面上看不到
 * 的其他 N 個一起選走，「16 個裡勾了 14 個」這種結果就是這樣來的。
 * 修法：全選的範圍一律用 visibleProjectsOf()，跟畫面上排出來的列一致。
 * 沒有搜尋時 visibleProjectsOf(node,false) 就等於原本 selectableOf(node)，
 * 行為不變。 */
function toggleFolder(nodeId){
  forgetClearedNotice();
  const node = findFolder(nodeId);
  if(!node) return;
  toggleScope(visibleProjectsOf(node, false));
}
/* 使用者一旦重新勾東西就代表已經往前走了，Undo 的意義消失，提示收掉。 */
function forgetClearedNotice(){
  assign.clearedSelection = null;
  assign.clearedCount = 0;
}
function toggleProject(projectId){
  forgetClearedNotice();
  if(assign.selected[projectId]) delete assign.selected[projectId]; else assign.selected[projectId]=true;
  renderAssign();

   * （保留最上層、命中的層換回來）——同一個資料夾在內外不會有兩種寫法（2026-09-24） */
  if(flattened){
    const q = assign.search.includes('/') ? '' : assign.search.trim().toLowerCase();
    const {parts} = hierDisplayParts(node, assign.cloud, q);
    return parts.length ? `<span class="tpath">${parts.join(' / ')} / </span>` : '';
  }
  const take = Math.min(ancestors.length, Math.max(1, distinguishingSegments(node, assign.cloud)));
  const shown = ancestors.slice(ancestors.length - take);
  const elided = ancestors.length > take ? '… / ' : '';
  return `<span class="tpath">${elided}${esc(shown.join(' / '))} / </span>`;
}
function folderRow(node, depth, ancestors = [], ancIds = []){
  /* 選單只列未指派的，所以計數也只能算未指派的，
   * 不然「platform (24)」底下只掛 3 列，數字跟看到的東西對不起來 */
  const unassigned = allProjectsOf(node).filter(project=>!project.assigned);
  /* 這裡的「全選範圍」要跟畫面上實際排出來的列一致，包含帳單帳戶篩選
   * 跟搜尋兩種情況——用 visibleProjectsOf() 而不是不看搜尋的 selectableOf() */
  const selectable = visibleProjectsOf(node, false);
  const picked = selectedIn(selectable);
  const isAll = selectable.length>0 && picked===selectable.length;
  const isSome = picked>0 && !isAll;
  /* 篩選（帳單帳戶或搜尋）讓資料夾只剩一部分時要講出來，不然使用者以為專案不見了 */
  const countText = selectable.length === unassigned.length
    ? `(${unassigned.length})`
    : `(${selectable.length} / ${unassigned.length})`;
  const expanded = !!assign.expanded[node.id] || !!assign.search;
  const kids = expanded ? (
      node.children.filter(nodeHasVisible).map(child=>folderRow(child, depth+1, ancestors.concat(node.name), ancIds.concat(node.id))).join('') +
      /* 資料夾自己命中搜尋時整批留著底下的專案，但「已指派的不進這個選單」這條
       * 規則不能跟著放掉——原本這裡只檢查帳單帳戶篩選，導致搜資料夾名稱時
       * 已指派的專案會冒出來，跟旁邊的計數對不起來。用 inFolderScope 一起擋掉。 */
      node.projects.filter(project => folderMatches(node) ? inFolderScope(project) : projectVisible(project)).map(project=>projectRow(project, depth+1, ancIds.concat(node.id))).join('')
    ) : '';
  const nounN = `${selectable.length} ${selectable.length===1?cfg().noun:cfg().nounPlural}`;
  return `<div class="tbranch">
      <div class="tnode is-folder" role="treeitem" aria-level="${treeLevel(depth)}" aria-expanded="${expanded}" aria-checked="${isAll?'true':isSome?'mixed':'false'}" aria-label="${esc(node.name)}, ${nounN}" data-fk="node:${esc(node.id)}" tabindex="-1" data-depth="${depth}"${ancIds.length?` data-parent="${ancIds[ancIds.length-1]}"`:''} style="padding-left:${indentPx(depth)}px;top:${folderStickyTop()}px;z-index:${30+depth}"${node.folderId?` data-tip="Folder ID: ${esc(node.folderId)}"`:''} onclick="toggleExpand('${node.id}')">${railsHtml(depth, ancIds)}${hoverGuidesHtml(ancIds)}
        <button class="tchev" data-fk="chev:${esc(node.id)}" aria-expanded="${expanded}" onclick="event.stopPropagation();toggleExpand('${node.id}')" aria-label="${expanded?'Collapse':'Expand'} ${esc(node.name)}"><span aria-hidden="true" class="material-symbols-outlined">${expanded?'expand_more':'chevron_right'}</span></button>
        ${checkboxHtml(isAll, `toggleFolder('${node.id}')`, isSome, false, `Select ${node.name} (${nounN})`)}
        <span aria-hidden="true" class="material-symbols-outlined ticon">folder</span>
        <div class="tlabel"><span class="tname">${pathPrefix(depth, node)}${hl(node.name)} <span class="tcount ${selectable.length!==unassigned.length?'partial':''}">${countText}</span></span></div>
      </div>${kids}
    </div>`;
}

/* 設計稿 #18-1 要求的 Select All。範圍＝目前視角下真正列出來的所有可選專案，
 * 跟父層全選同一條規則（有搜尋時只算搜到的）。 */
function allVisibleSelectable(){
  const seen = new Set();
  const out = [];
  const push = list => list.forEach(project=>{ if(!seen.has(project.id)){ seen.add(project.id); out.push(project); } });
  if(!assign.hasFolders || assign.groupBy === 'ba'){
    cfg().groups().forEach(group=>push(baProjects(group.id)));
  } else {
    cfg().folders().forEach(node=>push(visibleProjectsOf(node, false)));
    push(unassignedInFilter());
  }
  push(noBaInFilter());
  return out;
}
function toggleSelectAll(){ forgetClearedNotice(); toggleScope(allVisibleSelectable()); }
/* org 區段標頭：刻意長得不像資料夾列——沒有 checkbox、沒有展開箭頭、不可點、
 * 字級小一階。四個線索同時在講「這不是資料夾」，不是只靠顏色。
 * 明度往上加深（org blue-20 > folder blue-10 > project 白底），層級一眼讀得出來。 */
function orgHeaderRow(org){

}
function selectAllRow(){
  const scope = allVisibleSelectable();

  return `<div class="tnode is-selectall" role="treeitem" aria-level="1" aria-checked="${isAll?'true':isSome?'mixed':'false'}" aria-label="Select all (${scope.length})" data-fk="node:select-all" tabindex="-1" style="padding-left:${indentPx(0)}px" onclick="toggleSelectAll()">

/* org 一個資料夾都沒開時，樹會退化成一個裝了 92 個專案的「No folder」節點，
 * 比現在的平鋪還難用。所以沒有資料夾就維持現行的 BA → Project 兩層。 */
function flatBaTree(){
  return cfg().groups().map(group=>{
    const all = everyUnassigned().filter(project=>project.parent.id===group.id);
    const projects = baProjects(group.id);
    if(!projects.length) return '';
    const expanded = !!assign.expanded[group.id] || !!assign.search;
    const picked = selectedIn(projects);
    const isAll = projects.length>0 && picked===projects.length;
    const isSome = picked>0 && !isAll;
    const countText = projects.length===all.length ? `(${all.length})` : `(${projects.length} / ${all.length})`;
    const nounN = `${projects.length} ${projects.length===1?cfg().noun:cfg().nounPlural}`;
    return `<div class="tbranch">
        <div class="tnode is-folder" role="treeitem" aria-level="1" aria-expanded="${expanded}" aria-checked="${isAll?'true':isSome?'mixed':'false'}" aria-label="${esc(group.name)}, ${nounN}" data-fk="node:${esc(group.id)}" tabindex="-1" data-depth="0" style="padding-left:24px;top:${folderStickyTop()}px;z-index:30" onclick="toggleExpand('${group.id}')">
          <button class="tchev" data-fk="chev:${esc(group.id)}" aria-expanded="${expanded}" aria-label="${expanded?'Collapse':'Expand'} ${esc(group.name)}" onclick="event.stopPropagation();toggleExpand('${group.id}')"><span aria-hidden="true" class="material-symbols-outlined">${expanded?'expand_more':'chevron_right'}</span></button>
          ${checkboxHtml(isAll, `toggleBa('${group.id}')`, isSome, false, `Select ${group.name} (${nounN})`)}
          <span aria-hidden="true" class="material-symbols-outlined ticon">${cfg().parentIcon}</span>
          <div class="tlabel"><span class="tname">${hl(group.name)} <span class="tcount ${projects.length!==all.length?'partial':''}">${countText}</span></span></div>
        </div>${expanded ? projects.map(project=>projectRow(project,1,[],2)).join('') : ''}
      </div>`;
  }).join('');
}
/* 帳單帳戶自己的名字也算搜尋命中，命中就整批留著底下的專案——跟資料夾視角的
 * folderMatches() 同一套規則，不然搜「corp-main」會搜不到任何東西（因為之前
 * 只比對專案的 name / ID）。 */
/* placeholder 要講出這個視角實際搜得到什麼。原本固定寫「folders or projects」，
 * 但在帳單帳戶視角裡沒有資料夾這個東西，而帳單帳戶名稱其實搜得到卻沒被提到。 */
function searchPlaceholder(){
  /* placeholder 要把這個視角實際搜得到的東西講完，兩邊都是「分組軸 + 專案」：
   *   資料夾視角 → Search folders or projects
   *   帳單帳戶視角 → Search billing accounts or projects
   * 併行之後搜尋框文字區只有 234px，這兩句都在寬度內（先前塞三個名詞才需要
   * 省掉連接詞）。 */
  const c = cfg();
  if(c.searchHint) return `Search ${c.searchHint}`;
  const parent = c.parentLabel.toLowerCase() + 's';
  if(!showFolderView()) return `Search ${parent} or ${c.nounPlural}`;
  return `Search folders or ${c.nounPlural}`;
}
function baMatches(ba){
  return !!assign.search && ba.name.toLowerCase().includes(assign.search.toLowerCase());
}
/* 這同時是「畫面上排哪些列」跟「全選會選走哪些」的唯一來源，兩邊共用一個
 * 函式就不會再出現「看到 1 個卻選走 14 個」那種對不起來的情況。 */
function baProjects(baId){
  const ba = cfg().groups().find(item=>item.id===baId);
  const keepAll = !!ba && baMatches(ba);
  return everyProject()
    .filter(project=>project.parent.id===baId)
    .filter(project=>keepAll ? inFolderScope(project) : projectVisible(project));
}
function toggleBa(baId){ toggleScope(baProjects(baId)); }

/* 選單本體（工具列 + 提示條 + 清單 + 計數）跟外殼分開。modal 與 wizard 兩個宿主都吃這一份。 */
function assignPickerParts(){
  invalidateHierIndex();    // 換雲、切 multiOrg、塞深樹都會改變樹，索引丟掉重建（成本可忽略）
  const assignable = everyUnassigned().length;
  const picked = Object.keys(assign.selected).length;

  let body, treeMode = false;
  if(assign.loading || assign.searching){
    body = `<div class="tskel">${Array.from({length:7}).map(()=>'<div class="skel"></div>').join('')}</div>`;
  } else if(!everyUnassigned().length){
    /* 全部都指派過就沒東西可加了。這裡刻意不用 No Data 那種語彙——
     * 這不是出錯，是這個群組已經設定完了，而且要移除的話得去表格。 */
    body = `<div class="tempty"><span aria-hidden="true" class="material-symbols-outlined tempty-icon is-success">check_circle</span>
      <div class="tempty-title">Everything is already assigned</div>
      <div>All authorized ${esc(cfg().cloudLabel)} resources are assigned to this group. To remove one, select it in the Resources table and use Unlink Resource.</div></div>`;
  } else if(cfg().supportsFolders && assign.groupBy==='folder' && !assign.hasFolders){
    /* 使用者主動點了 Folder 分頁，這個 org 才真的沒有資料夾可看。跟
     * cloud pill tabs 的 not-authorized 空狀態同一個視覺語言（icon +
     * 標題 + 說明），不是常駐警語。 */
    body = `<div class="tempty"><span aria-hidden="true" class="material-symbols-outlined tempty-icon">folder_off</span>
      <div class="tempty-title">No folders in this organization</div>
      <div>Projects here aren't organized into folders. Switch to ${esc(cfg().parentLabel)} to browse and assign resources.</div></div>`;
  } else if(!showFolderView()){
    const tree = flatBaTree() + noBaRow();
    body = tree ? selectAllRow() + tree : `<div class="tempty">No resources match your search.</div>`;
    treeMode = !!tree;
  } else {
    /* 多 org：每個 org 一段，標頭 + 該 org 底下有內容的資料夾。
     * 單一 org：完全不出現標頭，跟改版前一模一樣。 */
    const multi = isMultiOrg();
    /* 「No folder」是直接掛在 organization 底下的專案，所以它屬於某一個 org，
     * 要排在該 org 的區段裡面。mock 只有一組，歸在第一個 org；真實資料是每個
     * org 各自有自己的一組。

     * 付費給跨 org 的專案），所以排在所有 org 區段之外、最底部，並在多 org 時
     * 加一條分隔線，不然會被讀成屬於最後一個 org。 */
    const tree = activeOrgs().map((org, index)=>{
      const rows = org.folders.filter(nodeHasVisible).map(node=>folderRow(node,0)).join('')
        + (index === 0 ? unassignedRow() : '');
      if(!rows) return '';                       // 這個 org 被搜尋濾光就整段不出現
      return (multi ? orgHeaderRow(org) : '') + rows;
    }).join('') + noBaRow();
    body = tree ? selectAllRow() + tree : `<div class="tempty">No resources match your search.</div>`;
    treeMode = !!tree;
  }

  /* 原本這裡有一塊藍底常駐說明，收掉了（Kabin 2026-09-09 決定）。三件事
   * 各自歸位：「只列未指派」→ 底部計數的 unassigned 這個字、視角行為 →
   * Group by 的 info tooltip、「要移除去表格 Unlink」→ 空狀態已經有。
   *
   * 「這個 org 沒有資料夾」原本也走常駐 caption，2026-09-10 改掉：Kabin
   * 指出這件事該比照本檔 resourcesTab() 的雲端 pill tabs 做——tab 永遠
   * 顯示，沒資料的那個點下去才出現空狀態，不要預先把選項藏起來再用文字
   * 解釋為什麼看不到。所以 Group by 的 Folder 分頁永遠在，這個 org 真的
   * 沒有資料夾時，點進 Folder 才在 rmodal-body 出現對應空狀態。 */
  const tools = `<div class="rmodal-tools">
        <div class="search-box"><span aria-hidden="true" class="material-symbols-outlined">search</span><input aria-label="${searchPlaceholder()}" placeholder="${searchPlaceholder()}" value="${esc(assign.typed != null ? assign.typed : assign.search)}" oninput="onAssignSearch(this.value)"></div>
        ${showGroupByToggle() ? `<div class="groupby-toggle">
          <span class="lbl">Group by</span>
          <span aria-hidden="true" class="material-symbols-outlined gb-info" data-tip="${esc(GROUPBY_HELP)}" tabindex="0">info</span>
          <div class="pill-tabs">
            <button class="pill-tab ${assign.groupBy==='ba'?'active':''}" aria-pressed="${assign.groupBy==='ba'}" onclick="setGroupBy('ba')"><span aria-hidden="true" class="material-symbols-outlined" style="font-size:16px">${cfg().parentIcon}</span>${esc(cfg().parentLabel)}</button>
            <button class="pill-tab ${assign.groupBy==='folder'?'active':''}" aria-pressed="${assign.groupBy==='folder'}" onclick="setGroupBy('folder')"><span aria-hidden="true" class="material-symbols-outlined" style="font-size:16px">folder</span>Folder</button>
          </div>
        </div>` : ''}
      </div>`;
  const bodyCls = `rmodal-body ${isComponentStyle()?'is-component':'is-tree'}${isComponentFixed()?' is-component-fixed':''}${isTinted()?' is-tinted':''}${railsOnHover()?' is-rails-onhover':''}`;
  const count = assignable ? `<b>${picked}</b> of ${assignable} unassigned ${assignable===1?cfg().noun:cfg().nounPlural} selected` : '';
  /* X-9r5 GA27：搜尋結果數播給讀屏（同一句不重播） */
  if(assign.search && !assign.loading && !assign.searching){
    const n = allVisibleSelectable().length;

const TAG_TERMS = {

         searchKeys:'Search label keys',                 // #56-1 原文
         searchValues:'Search label values',             // 設計端暫擬：#56-1 只畫了 Keys 的下拉，Values 的搜尋 placeholder 比照造句
         parentPrefix:'Billing Account', keyPrefix:'Label Key',

/* 上層（Billing Account / Management Account / Subscription）。GCP 沿用 Resources 表格
 * 既有的 GCP_BAS，另外兩朵雲補第二個上層，讓「上層 → key」的分組看得出來。 */
const TAG_PARENTS = {
  gcp:   GCP_BAS.map(([name,id])=>({id, name})),
  aws:   [{id:'112233445566', name:'CloudMile-Org-Root'}, {id:'998811223344', name:'CloudMile-Org-Sandbox'}],
  azure: [{id:'/subscriptions/c5d7a1e2', name:'Corporate-BI-Data'}, {id:'/subscriptions/9a1f77c0', name:'Corporate-Web-Prod'}],
};
const TAG_KEYS = {
  gcp:   {application:['crm-system','security-monitoring','iot-platform','hr-portal'], 'billing-account':['shared','dedicated'], compliance:['pci-dss','sox'], 'cost-center':['cc-1001','cc-2040','cc-3300'], environment:['prod','staging','dev']},
  aws:   {Application:['payments','checkout','search'], CostCenter:['fin-01','eng-02'], ManagedBy:['terraform','console'], WorkloadType:['batch','web','ml'], Environment:['Prod','Staging','Dev']},
  azure: {environment:['prod','staging','dev'], owner:['finops','platform'], 'cost-center':['cc-1001','cc-2040'], workload:['bi','web']},

/* 每朵雲的 label/tag 全集：(上層, key, value) 三元組。不是每個上層都有每個 key，
 * 否則兩個上層底下的清單會一模一樣、看不出分組的意義。 */
function buildTagUniverse(cloud){
  const out = [];
  const keys = Object.keys(TAG_KEYS[cloud]);
  TAG_PARENTS[cloud].forEach((parent, pi)=>keys.forEach((key, ki)=>{
    if(pi>0 && (pi+ki)%3===2) return;
    TAG_KEYS[cloud][key].forEach(value=>out.push({id:`${parent.id}|${key}|${value}`, parent, key, value}));
  }));
  return out;
}
const TAG_UNIVERSE = {gcp:buildTagUniverse('gcp'), aws:buildTagUniverse('aws'), azure:buildTagUniverse('azure')};
/* 每個群組已指派的 label/tag（mock，從全集裡等距抽幾個）。存成 Set，指派 / Unlink 會改它，
 * 所以 #56 彈窗「只列尚未指派的」跟表格能對得上。 */
const TAG_ASSIGNED = {};
function assignedTagSet(groupId, cloud){
  const key = groupId+'|'+cloud;
  if(!TAG_ASSIGNED[key]){
    const seed = groupId.length + (cloud==='aws'?1:cloud==='azure'?2:0);
    const universe = TAG_UNIVERSE[cloud];
    TAG_ASSIGNED[key] = new Set(universe.filter((tag, index)=>(index+seed)%5===0).map(tag=>tag.id).slice(0, 4 + seed%3));
  }
  return TAG_ASSIGNED[key];
}
function assignedTagsFor(groupId, cloud){
  const set = assignedTagSet(groupId, cloud);
  return TAG_UNIVERSE[cloud].filter(tag=>set.has(tag.id));
}
function unassignedTagsFor(groupId, cloud){
  const set = assignedTagSet(groupId, cloud);
  return TAG_UNIVERSE[cloud].filter(tag=>!set.has(tag.id));
}

}
function closeTagAssign(){ tagPick.open = false; renderTagAssign(); }
function tagTerms(){ return TAG_TERMS[tagPick.cloud]; }
function tagPool(){ return unassignedTagsFor(tagPick.groupId, tagPick.cloud); }
function tagHit(text){ return !tagPick.search || text.toLowerCase().includes(tagPick.search.toLowerCase()); }
/* Keys 下拉：上層 → key（#56-1 註記「Label Key 的上層為 Billing Account」）。
 * 只列還有未指派 value 的 (上層, key) 組合。 */
function tagKeyGroups(){
  const groups = [];
  TAG_PARENTS[tagPick.cloud].forEach(parent=>{
    const keys = [...new Set(tagPool().filter(tag=>tag.parent.id===parent.id).map(tag=>tag.key))].filter(tagHit);
    if(keys.length) groups.push({id:parent.id, label:`${tagTerms().parentPrefix} = ${parent.name}`, sub:parent.id, items:keys.map(key=>({id:`${parent.id}|${key}`, label:key}))});
  });
  return groups;
}
/* Values 下拉：key → value（註記「Label Value 的上層為 Label Key」）。同一個 key 在
 * 兩個上層都被選到時，value 右邊補上層名稱，不然兩列 prod 分不出是哪一個。
 * 分組列的文案「Label Key = application」是比照 Keys 下拉的「Billing Account = …」造句
 * （設計端暫擬，#56-1 沒畫 Values 展開的樣子）。 */
function tagValueGroups(){
  const pool = tagPool().filter(tag=>tagPick.keys[`${tag.parent.id}|${tag.key}`]);
  const byKey = new Map();
  pool.forEach(tag=>{ if(!byKey.has(tag.key)) byKey.set(tag.key, []); byKey.get(tag.key).push(tag); });
  const groups = [];
  byKey.forEach((tags, key)=>{
    const multiParent = new Set(tags.map(tag=>tag.parent.id)).size > 1;
    const items = tags.filter(tag=>tagHit(tag.value)).map(tag=>({id:tag.id, label:tag.value, sub:multiParent?tag.parent.name:''}));
    if(items.length) groups.push({id:'key|'+key, label:`${tagTerms().keyPrefix} = ${key}`, sub:'', items});
  });
  return groups;
}

/* 取消一個 key 時，底下已勾的 value 一起清掉，不然 Values 欄位會留著看不到的勾選 */
function pruneValues(){

/* 重繪 innerHTML 會弄掉輸入框的焦點與游標（v2 在 assign 搜尋框就踩過）。
 * 這裡做成通用版：帶 data-f 的輸入框、或 .assign-picker 裡的搜尋框，渲染前記住、渲染後補回。 */
function captureFocus(root){
  const active = document.activeElement;
  if(!active || !active.matches) return null;
  let selector = null;
  if(active.dataset && active.dataset.f) selector = `[data-f="${active.dataset.f}"]`;
  else if(active.matches('.assign-picker .search-box input')) selector = '.assign-picker .search-box input';
  if(selector){
    let caret = null;
    try { caret = active.selectionStart; } catch(_) { caret = null; }
    return {selector, caret};
  }
  /* X-9r5 GA26：沒有 data-f 的控制項（tab、勾選框、chevron、按鈕）用穩定鍵找回（data-fk 優先，否則「名稱＋第 n 個同名」） */
  if(root && root.contains && root !== active && root.contains(active)){
    const key = ctrlKey(active, root);
    if(key) return {key};
  }
  return null;
}
function restoreFocus(root, focus){
  if(!focus) return;
  const el = focus.selector ? root.querySelector(focus.selector) : findByKey(root, focus.key);
  if(!el) return;
  el.focus({preventScroll:true});
  if(focus.caret != null){ try { el.setSelectionRange(focus.caret, focus.caret); } catch(_) {} }
}

const WZ_STEPS = [
  {id:'info',   label:'Group Information',                    title:'Create Group'},
  {id:'invite', label:'Invite User',                          title:'Invite User'},
  {id:'gcp',    label:'Assign Resource:<br>Google Cloud',     title:'Assign Resource: Google Cloud'},
  {id:'aws',    label:'Assign Resource:<br>AWS',              title:'Assign Resource: AWS'},
  {id:'finish', label:'Finish',                               title:'Finish'},
];
const wizard = {open:false, tier:1, step:0, name:'', managers:'', role:'member', emails:'', errors:{}, apiError:null, errOpen:true,
  picks:{gcp:{}, aws:{}}, checking:false, submitting:false, forceFail:false, forceApiError:false};
const EMAIL_RE = /^[^\s@,]+@[^\s@,]+\.[^\s@,]+$/;
const EMAIL_ERR = 'Some email addresses are invalid or duplicated.';          // #08-1 / #11-1 原文
const NAME_EMPTY_ERR = 'Group name cannot be empty.';                         // #08-1 原文
const EMAIL_EMPTY_ERR = 'Email cannot be empty.';                             // 設計端暫擬（X-9r5 GA23）：稿沒畫空白態，比照 #08-1 句型
const API_FIELD_ERR = 'Error encountered. Please check the details below.';   // #08-2 原文
const API_DETAIL_COPY = 'You need to remove the users below; they are already in other groups.'; // #08-2 / #11-1 原文
const CREATE_TOAST = {success:'Group created successfully.', error:'Unable to create group. Please try again later.'}; // #08-3 原文
const EMAIL_HELP = 'Use commas (",") as separators for adding multiple members.<br>*If there are any newly registered members, please remind them to check their inbox for the account activation email.'; // #08 / #30 原文
/* API 端「已在其他群組」的模擬：mock 裡所有群組成員的 email 都算已被佔用。
 * Demo FAB 有一個強制觸發的情境，不用真的去查誰是成員。 */
const TAKEN_EMAILS = (()=>{ const set = new Set(); T1_GROUPS.forEach(group=>usersFor(group.id).forEach(user=>set.add(user.email.toLowerCase()))); return set; })();
function splitEmails(text){ return String(text||'').split(',').map(item=>item.trim()).filter(Boolean); }
function emailListError(text){
  const list = splitEmails(text);
  const seen = new Set();
  for(const email of list){
    if(!EMAIL_RE.test(email)) return EMAIL_ERR;
    const key = email.toLowerCase();
    if(seen.has(key)) return EMAIL_ERR;
    seen.add(key);
  }
  return null;
}
function openCreateGroup(tier){
  Object.assign(wizard, {open:true, tier:tier||1, step:0, name:'', managers:'', role:'member', emails:'', errors:{}, apiError:null, errOpen:true,
    picks:{gcp:{}, aws:{}}, checking:false, submitting:false});
  renderWizard();
}
function closeWizard(){
  wizard.open = false;
  wizard.seq = (wizard.seq||0) + 1;   // 讓還在路上的 API check / submit timer 作廢
  wizard.forceFail = false; wizard.forceApiError = false;
  if(assign.host==='wizard'){ assign.host='modal'; assign.open=false; }
  renderWizard();
}
/* 格式錯誤即時檢查（#08-1 註記「[Add Manager]：email 格式需即時檢查，即時顯示錯誤提示」）。
 * 只在錯誤狀態有變化時重繪，減少打字時的閃動；焦點與游標由 captureFocus 保住。 */
function wizardLiveValidate(field){
  const before = wizard.errors[field] || null;
  let after = null;
  if(field==='name') after = wizard.errors.name ? (wizard.name.trim() ? null : NAME_EMPTY_ERR) : null;   // 名稱只在按過 Next 之後才即時清除
  if(field==='managers' || field==='emails') after = emailListError(wizard[field]);
  if(wizard.apiError && wizard.apiError.field===field){ wizard.apiError = null; before !== after || renderWizard(); }
  if(before !== after){ if(after) wizard.errors[field]=after; else delete wizard.errors[field]; renderWizard(); }
}
function wizardValidateInfo(){
  wizard.errors = {};
  if(!wizard.name.trim()) wizard.errors.name = NAME_EMPTY_ERR;
  const emailErr = emailListError(wizard.managers);
  if(emailErr) wizard.errors.managers = emailErr;
  if(Object.keys(wizard.errors).length) wizard._focusErr = true;
  renderWizard();
  return !Object.keys(wizard.errors).length;
}
function wizardValidateInvite(){
  wizard.errors = {};
  const emailErr = emailListError(wizard.emails);
  if(emailErr) wizard.errors.emails = emailErr;
  if(emailErr) wizard._focusErr = true;
  renderWizard();
  return !Object.keys(wizard.errors).length;
}
/* #08-2：按 Next 後由 API 判斷（這裡用 600ms 模擬往返，期間 Next 轉圈、不可再按）。
 * 失敗 → 欄位紅框 + 「Error encountered…」+ 預設展開的 Error Details；註記說錯誤排解完前
 * 不能前往下一步。 */
function wizardApiCheck(field, emails, onPass){
  const taken = wizard.forceApiError ? emails.slice() : emails.filter(email=>TAKEN_EMAILS.has(email.toLowerCase()));
  if(!emails.length || (!taken.length)){ onPass(); return; }
  wizard.checking = true; renderWizard();
  const seq = (wizard.seq = (wizard.seq||0) + 1);
  setTimeout(()=>{
    if(wizard.seq !== seq || !wizard.open) return;
    wizard.checking = false;
    wizard.errors[field] = API_FIELD_ERR;
    wizard.apiError = {field, emails:taken};
    wizard.errOpen = true;
    renderWizard();
  }, 600);
}
function wizardGo(step){
  wizard.step = step; wizard.apiError = null; wizard.errors = {};
  const id = WZ_STEPS[step].id;
  if(id==='gcp' || id==='aws') enterWizardPicker(id); else { if(assign.host==='wizard') assign.host='modal'; renderWizard(); }
}
function enterWizardPicker(cloud){
  startAssignPicker(cloud);
  assign.host = 'wizard';
  assign.selected = {...wizard.picks[cloud]};   // 回到這一步時要看到上次勾的
  renderWizard();
}
function leaveWizardPicker(){
  const id = WZ_STEPS[wizard.step].id;
  if(id==='gcp' || id==='aws') wizard.picks[id] = {...assign.selected};
}
function wizardNext(){
  if(wizard.checking || wizard.submitting) return;
  const id = WZ_STEPS[wizard.step].id;
  if(id==='info'){ if(!wizardValidateInfo()) return; wizardApiCheck('managers', splitEmails(wizard.managers), ()=>wizardGo(1)); return; }
  if(id==='invite'){ if(!wizardValidateInvite()) return; wizardApiCheck('emails', splitEmails(wizard.emails), ()=>wizardGo(2)); return; }
  if(id==='gcp'){ leaveWizardPicker(); wizardGo(3); return; }
}
function wizardPrev(){
  if(wizard.checking || wizard.submitting) return;
  leaveWizardPicker();
  wizardGo(wizard.step-1);
}
/* #08 註記：「[Skip Steps and Create Group]：按下後檢查欄位上所有值是否符合格式，不符合顯示
 * 錯誤頁面，符合則跳過後面步驟直接創立群組。」所以要先回到第一步驗證，也要跑一次 API 檢查。 */
function wizardSkipAndCreate(){
  if(wizard.checking || wizard.submitting) return;
  leaveWizardPicker();
  const inviteOk = !emailListError(wizard.emails);
  if(!inviteOk){ wizardGo(1); wizardValidateInvite(); return; }
  wizard.step = 0; wizard.apiError = null;
  if(!wizardValidateInfo()) return;
  wizardApiCheck('managers', splitEmails(wizard.managers), ()=>wizardSubmit());
}
function wizardSubmit(){
  if(wizard.submitting) return;
  leaveWizardPicker();
  wizard.submitting = true; renderWizard();
  const seq = (wizard.seq = (wizard.seq||0) + 1);
  setTimeout(()=>{
    if(wizard.seq !== seq || !wizard.open) return;
    const failed = wizard.forceFail;
    if(!failed) addCreatedGroup();
    closeWizard();
    showToast(failed ? CREATE_TOAST.error : CREATE_TOAST.success, failed ? 'error' : 'success');
    render();
    announce(failed ? 'Unable to create group' : 'Group created');   // X-9r5 GA27
  }, 800);
}
/* 建好的群組直接長進清單，讓 demo 看得到結果。creator 用 mock 名單第一位代表「目前登入者」。 */
function addCreatedGroup(){
  const resource = Object.keys(wizard.picks.gcp).length + Object.keys(wizard.picks.aws).length;
  const base = {name:wizard.name.trim(), resource, lastUpdated:'Just now', creator:NAME_POOL[0], created:new Date().toLocaleDateString('en-GB')};
  if(wizard.tier===2){
    const t1 = findT1(state.t1Id);
    if(!t1) return;
    tier2GroupsFor(t1).push({id:t1.id+'-t2-new-'+Date.now(), ...base});
    t1.tier2 = tier2GroupsFor(t1).length;
  } else {
    T1_GROUPS.push({id:'new-'+Date.now(), tier2:0, ...base});
  }
}
/* Error Details 折疊區（#08-2 / #11-1）。ctx 是 wizard 或 fm，rerender 是對應的重繪函式名。 */
function errBoxHtml(ctx, rerender){
  ctx = ctx || wizard; rerender = rerender || 'renderWizard';
  if(!ctx.apiError) return '';
  const owner = ctx===wizard ? 'wizard' : 'fm';
  return `<div class="errbox">
    <button class="errbox-head" type="button" onclick="${owner}.errOpen=!${owner}.errOpen;${rerender}()" aria-expanded="${ctx.errOpen}">
      <span aria-hidden="true" class="material-symbols-outlined warn">warning</span>Error Details
      <span aria-hidden="true" class="material-symbols-outlined chev">${ctx.errOpen?'expand_less':'expand_more'}</span>
    </button>
    ${ctx.errOpen?`<div class="errbox-body">${API_DETAIL_COPY}<ul>${ctx.apiError.emails.map(email=>`<li>${esc(email)}</li>`).join('')}</ul></div>`:''}
  </div>`;
}
function wizardInfoStep(){
  const errors = wizard.errors;
  return `<p class="wz-desc">Name your group and assign manager.</p>
    <div class="fld ${errors.name?'has-error':''}"><label class="fld-lbl" for="wz-name">Group Name<span class="req" aria-hidden="true"> *</span></label>
      <input class="ipt" data-f="wz-name"${errAttrs('wz-name', errors.name, true)} placeholder="Please enter the group name" value="${esc(wizard.name)}" oninput="wizard.name=this.value;wizardLiveValidate('name')">
      ${errEl('wz-name', errors.name)}</div>
    <!-- Add Manager 非必填（#08 便利貼「PM 決策此欄位非必填」） -->
    <div class="fld ${errors.managers?'has-error':''}"><label class="fld-lbl" for="wz-managers">Add Manager</label>
      <input class="ipt" data-f="wz-managers"${errAttrs('wz-managers', errors.managers, false)} placeholder="Please enter the manager's email address" value="${esc(wizard.managers)}" oninput="wizard.managers=this.value;wizardLiveValidate('managers')">
      ${errEl('wz-managers', errors.managers)}
      ${wizard.apiError && wizard.apiError.field==='managers' ? errBoxHtml() : ''}
      <div class="fld-help">${EMAIL_HELP}</div></div>`;
}
function wizardInviteStep(){
  const errors = wizard.errors;
  return `<p class="wz-desc">Invite members and assign their roles within the group.</p>
    <div class="fld"><label class="fld-lbl" for="wz-role">Role</label>
      <div class="sel"><select class="ipt" id="wz-role" data-f="wz-role" onchange="wizard.role=this.value">
        <option value="member" ${wizard.role==='member'?'selected':''}>Member</option>
        <option value="manager" ${wizard.role==='manager'?'selected':''}>Manager</option>
      </select></div></div>
    <div class="fld ${errors.emails?'has-error':''}"><label class="fld-lbl" for="wz-emails">Email</label>
      <input class="ipt" data-f="wz-emails"${errAttrs('wz-emails', errors.emails, false)} placeholder="Please enter the user's email address" value="${esc(wizard.emails)}" oninput="wizard.emails=this.value;wizardLiveValidate('emails')">
      ${errEl('wz-emails', errors.emails)}
      ${wizard.apiError && wizard.apiError.field==='emails' ? errBoxHtml() : ''}
      <div class="fld-help">${EMAIL_HELP}</div></div>`;
}
/* #31 / #37 便利貼問 RD：「判斷使用者是否已經做好 GCP / AWS 授權，若無，直接跳過未授權的雲的
 * 指派步驟？若可，Stepper 也能隱藏那些步驟嗎？若不可，則需要定義空狀態下的 action button」。
 * 這題還沒有答案，所以這裡走「不可」那一邊：步驟照常出現，內容區顯示 Resources 分頁既有的
 * not-authorized 空狀態，Next / Submit 維持可按（這一步本來就非必填、可跳過）。 */
function wizardPickerStep(cloud){
  const label = CLOUD_META[cloud].label;
  const notAuthorized = state.cloudAuth==='gcp-only' && cloud!=='gcp';
  const desc = `<p class="wz-desc">Select the ${esc(label)} resources you want to assign to this group.</p>`;
  if(notAuthorized){
    const isAdmin = state.role==='admin';
    return desc + `<div class="wz-picker"><div class="empty-state error" style="min-height:100%"><div>
      <span aria-hidden="true" class="material-symbols-outlined">${isAdmin?'lock_open':'lock'}</span>
      <p class="empty-title">${esc(label)} is not authorized</p>
      <p class="empty-copy">${isAdmin?`Authorize ${esc(label)} in Authorization List before assigning resources from this provider.`:'Please reach out to your administrator to authorize this cloud provider.'}</p>
    </div></div></div>`;
  }
  const parts = assignPickerParts();
  return desc + `<div class="wz-picker assign-picker">${parts.tools}${parts.notice}<div class="${parts.bodyCls}"${parts.bodyAttrs}>${parts.body}</div></div>
    <div class="wz-count rmodal-count">${parts.count}</div>`;
}
function renderWizard(){
  const root = document.getElementById('wizard-root');
  if(!wizard.open){ root.innerHTML=''; dialogSync('wizard-root'); return; }
  const focus = captureFocus(root);
  const keepTop = (!assign._resetScroll && root.querySelector('.rmodal-body')) ? root.querySelector('.rmodal-body').scrollTop : 0;
  assign._resetScroll = false;
  const step = WZ_STEPS[wizard.step];
  const busy = wizard.checking || wizard.submitting;
  const steps = WZ_STEPS.map((item, index)=>{
    const cls = index<wizard.step ? 'done' : index===wizard.step ? 'active' : '';
    return `<div class="wz-step ${cls}"${cls==='active'?' aria-current="step"':''}><span class="wz-dot"><span aria-hidden="true" class="material-symbols-outlined">check</span></span><span>${item.label}</span></div>` + (index<WZ_STEPS.length-1?'<div class="wz-line"></div>':'');
  }).join('');
  let body = '';
  if(step.id==='info') body = wizardInfoStep();
  else if(step.id==='invite') body = wizardInviteStep();
  else if(step.id==='gcp' || step.id==='aws') body = wizardPickerStep(step.id);
  const spinner = `<span aria-hidden="true" class="material-symbols-outlined spin">progress_activity</span>`;
  const left = step.id==='aws' ? '' : `<button class="link-btn wz-skip" ${busy?'disabled':''} onclick="wizardSkipAndCreate()">Skip Steps and Create Group</button>`;
  const back = wizard.step===0
    ? `<button class="btn btn-out" ${busy?'disabled':''} onclick="closeWizard()">Cancel</button>`
    : `<button class="btn btn-out" ${busy?'disabled':''} onclick="wizardPrev()">Previous</button>`;
  const forward = step.id==='aws'
    ? `<button class="btn btn-pri" ${busy?'disabled':''} onclick="wizardSubmit()">${wizard.submitting?spinner:''}Submit</button>`
    : `<button class="btn btn-pri" ${busy?'disabled':''} onclick="wizardNext()">${wizard.checking||wizard.submitting?spinner:''}Next</button>`;
  /* 點背景不關閉：這是多步表單，誤觸就會把填了一半的東西弄掉。設計稿沒定義，設計端暫定。 */
  root.innerHTML = `<div class="wz-backdrop">
    <div class="wz" role="dialog" aria-modal="true" aria-labelledby="wz-title">
      <aside class="wz-steps">${steps}</aside>
      <div class="wz-pane">
        <div class="wz-head"><h3 id="wz-title">${step.title}</h3><button class="rmodal-close" onclick="closeWizard()" aria-label="Close"><span aria-hidden="true" class="material-symbols-outlined">close</span></button></div>
        <div class="wz-body">${body}</div>
        <div class="wz-foot">${left}<div class="wz-foot-right">${back}${forward}</div></div>
      </div>
    </div></div>`;
  treePass(root, keepTop);
  restoreFocus(root, focus);
  if(wizard._focusErr){ wizard._focusErr = false; const bad = root.querySelector('[aria-invalid="true"]'); if(bad) bad.focus({preventScroll:true}); }
  dialogSync('wizard-root');
}

const CURRENT_USER_EMAIL = personEmail(NAME_POOL[0]);   // mock 的「目前登入者」：#02 註記說不能刪自己
const fm = {kind:null, busy:false, forceFail:false, forceApiError:false, groupId:null, t1Id:null, userId:null, name:'', role:'member', emails:'', errors:{}, apiError:null, errOpen:true};
const FM_TOAST = {
  editGroup:          {ok:'Group updated successfully.', err:'Unable to update group. Please try again later.'},   // #09-1
  removeGroup:        {ok:'Group removed successfully.', err:'Unable to remove group. Please try again later.'},   // #10-2

function openFm(kind, data){

function closeFm(){ fm.kind = null; fm.seq = (fm.seq||0) + 1; fm.forceFail = false; fm.forceApiError = false; renderFm(); }
function fmGroup(){ return fm.t1Id ? findT2(fm.t1Id, fm.groupId) : findT1(fm.groupId); }
function fmUser(){ return usersFor(fm.groupId).find(user=>user.id===fm.userId); }
function openEditGroup(groupId, t1Id){

/* #10-1 的觸發條件照文案：「must first remove all members from this group and any of its subgroups」
 * → 自己有成員、或（T1 時）任何一個子 T2 有成員，都不能刪。 */
function groupHasMembers(groupId, t1Id){
  if(usersFor(groupId).length) return true;
  if(!t1Id){ const t1 = findT1(groupId); return !!t1 && tier2GroupsFor(t1).some(t2=>usersFor(t2.id).length>0); }
  return false;
}
function openRemoveGroup(groupId, t1Id){
  openFm(groupHasMembers(groupId, t1Id) ? 'deletionNotAllowed' : 'removeGroup', {groupId, t1Id:t1Id||null});
}
function openInviteUser(groupId){ openFm('inviteUser', {groupId, t1Id: state.tier===2 ? state.t1Id : null}); }
function openEditUser(groupId, userId){
  const user = usersFor(groupId).find(item=>item.id===userId);
  openFm('editUser', {groupId, t1Id: state.tier===2 ? state.t1Id : null, userId, role:user?user.role:'member'});
}
function openRemoveUser(groupId, userId){ openFm('removeUser', {groupId, t1Id: state.tier===2 ? state.t1Id : null, userId}); }
function fmLiveEmail(){
  const before = fm.errors.emails || null;
  const after = emailListError(fm.emails);
  if(fm.apiError) fm.apiError = null;
  if(before !== after || !after){ if(after) fm.errors.emails = after; else delete fm.errors.emails; renderFm(); }
}
function fmSubmit(){
  if(fm.busy) return;
  if(fm.kind==='editGroup' && !fm.name.trim()){ fm.errors.name = NAME_EMPTY_ERR; fm._focusErr = true; renderFm(); return; }   // 沿用 #08-1 文案（#09 沒畫錯誤態，設計端暫擬）
  if(fm.kind==='inviteUser' || fm.kind==='inviteAdmin'){
    /* X-9r5 GA23：空白時按下去才顯示錯誤。⚠ 設計端暫擬：稿 #07-2／#11-1 只畫了格式錯誤，空白沿用 #08-1 的「X cannot be empty.」句型 */
    const err = splitEmails(fm.emails).length ? emailListError(fm.emails) : EMAIL_EMPTY_ERR;
    if(err){ fm.errors.emails = err; fm._focusErr = true; renderFm(); return; }   // 驗證失敗焦點移到第一個錯誤欄位
  }
  fm.busy = true; renderFm();
  /* 每次送出帶一個序號：timer 回來時彈窗若已關掉或換成別的 kind，就當這次送出作廢。
   * 否則連續操作（或 Demo FAB 連點）時，上一個彈窗的 timer 會拿新彈窗的狀態去跑。 */
  const kind = fm.kind, seq = (fm.seq = (fm.seq||0) + 1);
  setTimeout(()=>{
    if(fm.seq !== seq || fm.kind !== kind) return;
    fm.busy = false;

/* ============================================================
 * X-9r5 FX-A（GA25～GA29、GA10、GA26～GA28）：鍵盤與讀屏基礎
 *   - 彈窗：aria-modal、開啟聚焦、focus trap＋背景 inert（只蓋 .shell，不蓋彈窗 root 與 Demo FAB）、Esc 關、關閉還焦點
 *   - 重繪保焦點：穩定鍵（data-fk，或「名稱＋第 n 個同名」）
 *   - #sr-status：視覺隱藏 role="status"，只播短句（排序、N results、Group created）
 *   - picker：role=tree／treeitem、roving tabindex、方向鍵
 * ============================================================ */
function announce(text){
  const el = document.getElementById('sr-status');
  if(!el) return;
  el.textContent = '';
  setTimeout(()=>{ el.textContent = text; }, 40);
}
function errAttrs(id, err, required){
  return ` id="${id}"${required?' aria-required="true"':''}${err?` aria-invalid="true" aria-describedby="${id}-err"`:''}`;
}
function errEl(id, err){ return err ? `<div class="fld-err" id="${id}-err" role="alert">${esc(err)}</div>` : ''; }

/* ---- 穩定鍵 ---- */
const CTRL_ALL = 'button,a[href],input,select,textarea,[tabindex],[role="checkbox"],[role="treeitem"]';
function ctrlLabel(el){
  const a = el.getAttribute && el.getAttribute('aria-label');
  if(a) return a;
  const c = el.cloneNode(true);
  c.querySelectorAll('.material-symbols-outlined').forEach(n=>n.remove());
  return (c.textContent || '').replace(/\s+/g,' ').trim();
}
function ctrlKey(el, scope){
  if(el.dataset && el.dataset.fk) return {fk: el.dataset.fk};
  const label = ctrlLabel(el);
  if(!label) return null;
  const same = [...scope.querySelectorAll(CTRL_ALL)].filter(n=>ctrlLabel(n)===label);
  return {label, n: Math.max(0, same.indexOf(el))};
}
function findByKey(scope, key){
  if(!key) return null;
  if(key.fk) return scope.querySelector(`[data-fk="${CSS.escape(key.fk)}"]`);
  const same = [...scope.querySelectorAll(CTRL_ALL)].filter(n=>ctrlLabel(n)===key.label);
  return same[key.n] || same[same.length-1] || null;
}
let _pendingFocus = null;
function applyPendingFocus(){
  if(!_pendingFocus) return;
  const app = document.getElementById('app');
  const el = findByKey(app, _pendingFocus);
  _pendingFocus = null;
  if(el && !el.disabled && !el.closest('[inert]')) el.focus({preventScroll:true});
}

/* ---- 彈窗（GA25） ---- */
const DLG_ROOTS = ['dialog-root','assign-root','tag-root','wizard-root','form-root'];   // DOM 順序＝疊放順序（同 z-index，後面的在上）
const _dlgWas = {}, _dlgReturn = {};
function openDlgRoots(){ return DLG_ROOTS.map(id=>document.getElementById(id)).filter(r=>r && r.firstElementChild); }
function dlgFocusables(dlg){
  return [...dlg.querySelectorAll('button,a[href],input,select,textarea,[tabindex]')].filter(n=>{
    if(n.disabled || n.tabIndex < 0) return false;
    if(n.closest('[hidden],[inert]')) return false;
    const st = getComputedStyle(n);
    return st.visibility !== 'hidden' && st.display !== 'none' && n.getClientRects().length > 0;
  });
}
function focusInitial(root){
  const dlg = root.querySelector('[role="dialog"]') || root;
  const f = dlgFocusables(dlg);
  const field = f.find(n=>/^(INPUT|SELECT|TEXTAREA)$/.test(n.tagName) || n.classList.contains('dd-trigger'));
  /* 確認類：有 Cancel 的破壞性確認（Remove Group／Remove User／Unlink）聚焦 Cancel（WAI-ARIA APG alertdialog，X-9r5 R5）；只有一顆 Got it 的聚焦主按鈕 */
  const cancelBtn = dlg.classList.contains('dlg') ? f.find(n=>n.classList.contains('btn-out') && /^Cancel$/.test(n.textContent.trim())) : null;
  let target = field || cancelBtn || (dlg.classList.contains('dlg') ? f.find(n=>n.classList.contains('btn-pri')) : null);
  if(!target){ dlg.setAttribute('tabindex','-1'); target = dlg; }
  target.focus({preventScroll:true});
}
function dialogSync(rootId){
  const root = document.getElementById(rootId);
  if(!root) return;
  const open = !!root.firstElementChild, was = !!_dlgWas[rootId];
  _dlgWas[rootId] = open;
  const shell = document.querySelector('.shell');
  if(shell){ if(openDlgRoots().length) shell.setAttribute('inert',''); else shell.removeAttribute('inert'); }
  if(open && !was){
    const a = document.activeElement;
    _dlgReturn[rootId] = (a && a !== document.body && !root.contains(a)) ? {el:a, key: document.getElementById('app').contains(a) ? ctrlKey(a, document.getElementById('app')) : null} : null;
    focusInitial(root);
  } else if(open && was){
    if(!document.activeElement || document.activeElement === document.body) focusInitial(root);
  } else if(!open && was){
    const r = _dlgReturn[rootId]; _dlgReturn[rootId] = null;
    const app = document.getElementById('app');
    if(r){
      let el = r.el;
      if(!(el && el.isConnected && !el.closest('[inert]'))) el = r.key ? findByKey(app, r.key) : null;
      if(el && !el.disabled) el.focus({preventScroll:true});
      if(r.key){ _pendingFocus = r.key; setTimeout(applyPendingFocus, 30); }   // 之後緊接的 render() 會重建列，焦點在那之後再找回
      else if(!el) { const h1 = app.querySelector('h1[tabindex="-1"]'); if(h1) h1.focus({preventScroll:true}); }
    }
  }
}
document.addEventListener('keydown', e=>{
  const roots = openDlgRoots();
  if(!roots.length) return;
  const top = roots[roots.length-1];
  if(e.key === 'Escape'){
    if(e.defaultPrevented) return;
    e.preventDefault(); e.stopPropagation();
    const id = top.id;
    if(id === 'tag-root' && tagPick.dd){ ddCloseAll(); return; }   // 下拉開著先收下拉
    if(id === 'form-root'){ if(!fm.busy) closeFm(); }
    else if(id === 'wizard-root') closeWizard();   // 比照 ×，不另外加確認
    else if(id === 'tag-root') closeTagAssign();
    else if(id === 'assign-root') closeAssign();
    else if(id === 'dialog-root') closeDialog();
    return;
  }
  if(e.key === 'Tab'){
    const dlg = top.querySelector('[role="dialog"]') || top;
    const f = dlgFocusables(dlg);
    if(!f.length){ e.preventDefault(); dlg.focus(); return; }
    const first = f[0], last = f[f.length-1], a = document.activeElement;
    if(!dlg.contains(a)){ e.preventDefault(); first.focus(); }
    else if(e.shiftKey && (a === first || a === dlg)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && a === last){ e.preventDefault(); first.focus(); }
  }
}, true);

/* ---- picker 樹（GA29） ---- */
function treePass(root, keepTop){
  const body = root.querySelector('.rmodal-body');
  if(body && keepTop) body.scrollTop = keepTop;
  const tree = root.querySelector('.rmodal-body[role="tree"]');
  if(!tree) return;
  const items = [...tree.querySelectorAll('[role="treeitem"]')];
  items.forEach(i=>{ i.tabIndex = -1; });
  tree.querySelectorAll('[role="treeitem"] .checkbox[tabindex], [role="treeitem"] .tchev').forEach(n=>{ n.tabIndex = -1; });   // 樹內用方向鍵移動，勾選框與箭頭不佔 Tab 停靠點
  const usable = items.filter(i=>!i.hasAttribute('aria-disabled'));
  const cur = usable.find(i=>i.dataset.fk === 'node:' + assign.rovingId) || usable[0];
  if(cur) cur.tabIndex = 0;
}
document.addEventListener('focusin', e=>{
  const it = e.target.closest && e.target.closest('.rmodal-body[role="tree"] [role="treeitem"]');
  if(!it || it.hasAttribute('aria-disabled')) return;
  it.closest('[role="tree"]').querySelectorAll('[role="treeitem"][tabindex="0"]').forEach(n=>{ if(n !== it) n.tabIndex = -1; });
  it.tabIndex = 0;
  assign.rovingId = (it.dataset.fk || '').replace(/^node:/, '');
});
document.addEventListener('keydown', e=>{
  const it = e.target && e.target.matches && e.target.matches('.rmodal-body[role="tree"] [role="treeitem"]') ? e.target : null;
  if(!it) return;
  const tree = it.closest('[role="tree"]');
  const items = [...tree.querySelectorAll('[role="treeitem"]')].filter(n=>!n.hasAttribute('aria-disabled'));
  const i = items.indexOf(it), k = e.key;
  const go = n => { if(n){ n.focus({preventScroll:true}); n.scrollIntoView({block:'nearest'}); } };
  const lvl = n => +n.getAttribute('aria-level');
  const id = (it.dataset.fk || '').replace(/^node:/, '');
  const ex = it.getAttribute('aria-expanded');
  if(k === 'ArrowDown'){ e.preventDefault(); go(items[i+1]); }
  else if(k === 'ArrowUp'){ e.preventDefault(); go(items[i-1]); }
  else if(k === 'Home'){ e.preventDefault(); go(items[0]); }
  else if(k === 'End'){ e.preventDefault(); go(items[items.length-1]); }
  else if(k === 'ArrowRight'){
    if(ex === 'false'){ e.preventDefault(); toggleExpand(id); }
    else if(ex === 'true'){ e.preventDefault(); const nx = items[i+1]; if(nx && lvl(nx) > lvl(it)) go(nx); }
  }
  else if(k === 'ArrowLeft'){
    if(ex === 'true'){ e.preventDefault(); toggleExpand(id); }
    else { e.preventDefault(); for(let j=i-1; j>=0; j--){ if(lvl(items[j]) < lvl(it)){ go(items[j]); break; } } }
  }
  else if(k === ' '){ e.preventDefault(); const cb = it.querySelector('.checkbox'); if(cb) cb.click(); }
  else if(k === 'Enter'){ e.preventDefault(); it.click(); }
});

  if (id === 'assign-nofld')   { assign.hasFolders = false; openAssign('gcp'); return; }
  if (id === 'assign-deep')    { showDeepTree(); return; }
  if (id === 'style-component'){ assign.pickerStyle='component'; if(!assign.open){ openAssign('gcp'); setGroupBy('folder'); } else renderAssign(); return; }
  if (id === 'style-component-fix'){ assign.pickerStyle='component-fix'; if(!assign.open){ openAssign('gcp'); setGroupBy('folder'); } else renderAssign(); return; }
  if (id === 'style-tree-tint-hover'){ assign.pickerStyle='tree-tint-hover'; if(!assign.open){ openAssign('gcp'); } setGroupBy('folder'); expandDeepChain(); return; }
  if (id === 'style-tree-tint'){ assign.pickerStyle='tree-tint'; if(!assign.open){ openAssign('gcp'); } setGroupBy('folder'); expandDeepChain(); return; }
  if (id === 'assign-first')   { setAssignedMode('none');  assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'assign-drift')   { setAssignedMode('mixed'); assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'assign-synced')  { setAssignedMode('all');   assign.hasFolders = true; openAssign('gcp'); setGroupBy('folder'); return; }
  if (id === 'org-multi')       { assign.multiOrg = true;  assign.hasFolders = true; if(!assign.open){ openAssign('gcp'); } setGroupBy('folder'); return; }
  /* List 分類：一律停在外層表格、不開彈窗，只切旗標，方便單一↔多 org 來回比對 */

  if (id === 'list-single-org') { assign.multiOrg = false; state.hierShowcase = false; closeAssign(); invalidateHierIndex(); gotoResourcesTable('data-analytics'); return; }
  if (id === 'org-multi-table') { assign.multiOrg = true; assign.hasFolders = true; state.hierShowcase = false; closeAssign(); invalidateHierIndex(); gotoResourcesTable('data-analytics'); return; }
  if (id === 'org-single')      { assign.multiOrg = false; assign.hasFolders = true; if(!assign.open){ openAssign('gcp'); } setGroupBy('folder'); return; }
  if (id === 'sel-clear')      { assign.keepSelection = false; if(!assign.open){ openAssign('gcp'); } else renderAssign(); showToast('切換 Group by 會清掉已勾選（開發團隊目前立場），清掉時會在彈窗裡告知並給 Undo', 'info'); return; }

  /* ---- v3 P1：Label / Tag ---- */
  const toResources = (cloud, sub) => { openDetail(1,'biz-dev',null,'resources'); state.cloud=cloud; state.resSub[cloud]=sub; render(); };
  if (id === 'tag-gcp')    { toResources('gcp','tag'); openTagAssign('gcp'); return; }

  if (id === 'tag-synced') { toResources('gcp','tag'); const set=assignedTagSet('biz-dev','gcp'); TAG_UNIVERSE.gcp.forEach(t=>set.add(t.id)); render(); openTagAssign('gcp'); return; }

  /* ---- v3 P2：CRUD ---- */
  const toMembers = (t1) => { openDetail(1, t1, null, 'group-members'); };
  if (id === 'crud-edit-group')   { toMembers('biz-dev'); openEditGroup('biz-dev', null); return; }
  if (id === 'crud-remove-block') { toMembers('biz-dev'); openRemoveGroup('biz-dev', null); return; }
  if (id === 'crud-remove-group') { USERS_CACHE.set('hr', []); toMembers('hr'); openRemoveGroup('hr', null); return; }
  if (id === 'crud-invite')       { toMembers('biz-dev'); openInviteUser('biz-dev'); return; }
  if (id === 'crud-invite-err')   { toMembers('biz-dev'); openInviteUser('biz-dev'); fm.forceApiError=true; fm.role='manager'; fm.emails='cameron.cooper@five9.com, geole.chan@five9.com, halweo.ieation@five9.com'; renderFm(); showToast('按 Invite User 就會看到 Error Details（這個情境把所有 email 都當成已在其他群組）', 'info'); return; }

  if (id === 'crud-entries-off')  { document.body.classList.add('demo-entries-off'); showToast('展示入口已隱藏', 'info'); return; }
  if (id === 'crud-fail')         { fm.forceFail = true; showToast('下一個 Edit / Remove / Invite 送出會走失敗 toast', 'info'); return; }

  /* ---- v3 P3 ---- */
  if (id === 'admin-list')     { state.pageState='set'; state.role='admin'; openAdminList(); return; }
  if (id === 'admin-invite')   { state.pageState='set'; state.role='admin'; openAdminList(); openInviteAdmin(); return; }

  /* X-9r5 GA17：稿有、但原本沒有資料到得了的三張空狀態 */

  // Normalise scenario: tab → page (backwards compat)

  // Detect rendering mode based on what's configured

    var hasCats  = (window.DEMO_CATEGORIES && window.DEMO_CATEGORIES.length) ||
                   scenarios.some(function (s) { return !!s.category; });

    if (window.DEMO_PAGES && window.DEMO_PAGES.length) return window.DEMO_PAGES;

    _normalizedScenarios().forEach(function (s) {
      if (s.page && !seen[s.page]) {
        seen[s.page] = true;
        pages.push({ id: s.page, label: s.page.charAt(0).toUpperCase() + s.page.slice(1), icon: 'tab' });
      }

    return pages;
  }

  function _getCategories() {
    return window.DEMO_CATEGORIES || [];

    return scenarios.filter(function (s) {

      if (_activePage && !s.page) return false; // page-tab mode requires scenario to have page
      if (_activeCategory && s.category && s.category !== _activeCategory) return false;
      if (_activeCategory && !s.category) return false; // cat-tab mode requires scenario to have category

  // ===== HTML BUILDERS =====
  function _renderButtons(scenarios) {
    if (!scenarios.length) {

    var noData = scenarios.filter(function (s) { return s.isNoData; });
    var html = '';
    if (normal.some(function (s) { return !!s.group; })) {
      var order = [];
      normal.forEach(function (s) { var g = s.group || ''; if (order.indexOf(g) < 0) order.push(g); });
      order.forEach(function (g) {

      });
    } else {
      html = _renderGroup(normal);

    if (noData.length) {
      html += '<div class="demo-sub-sep">no data</div>' + _renderGroup(noData);
    }

  function _renderGroup(scenarios) {
    if (!scenarios.length) return '';

             ' data-scenario="' + _esc(s.id) + '">' +
             '<span class="material-symbols-outlined">' + _esc(s.icon || 'play_arrow') + '</span>' +

    var tabClass  = isTwoLayer ? 'demo-page-tab' : 'demo-cat-tab';

  function _renderCategoryTabs() {

             _esc(c.label) +

  function _renderHint() {
