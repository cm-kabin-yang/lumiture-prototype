<style>
/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-btn:    5px;      /* 2026-10-15 B-8：按鈕／輸入框／下拉觸發欄（FE muiButton、Figma CMDS 都是 5） */
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-modal-sm: 10px;   /* 2026-10-15 B-4：確認類彈窗（Remove／Discard／Select Role） */
  --lt-radius-modal:  15px;     /* 2026-10-15 B-4：表單類彈窗（稿量到 15） */
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */
  --lt-shadow-chip:   0 2px 4px 0 rgba(0, 0, 0, 0.3);            /* chip / tag 用，較深 opacity */
  --lt-shadow-dialog: 0 0 6px 0 rgba(0, 0, 0, 0.2);              /* Card / Dialog / Dropdown 共用；無 offset */
  --lt-shadow-overlay:        0 4px 12px rgba(0, 0, 0, 0.14);    /* CMDS 未涵蓋；popover / floating menu */
  --lt-shadow-overlay-strong: 0 4px 16px rgba(0, 0, 0, 0.18);    /* CMDS 未涵蓋；drawer / 較重 overlay */

  /* --- Transition --- */
  --lt-transition-fast: .15s ease;
  --lt-transition-base: .2s ease;
  --lt-transition-slow: .3s ease;

  /* --- Z-index --- */
  --lt-z-base:     0;
  --lt-z-elevated: 10;
  --lt-z-sticky:   100;
  --lt-z-dropdown: 1000;
  --lt-z-modal:    2000;
  --lt-z-tooltip:  3000;
  --lt-z-toast:    4000;


  /* ============================================================
   * LAYER 2 — SEMANTIC
   * 語意層：引用 primitive，描述用途；component 預設用此層
   * ============================================================ */

  /* --- Color: Brand --- */
  --lt-color-primary:         var(--lt-blue-70);
  --lt-color-primary-hover:   var(--lt-blue-60);
  --lt-color-primary-active:  var(--lt-blue-90);
  --lt-color-primary-bg:      var(--lt-blue-10);
  --lt-color-primary-bg-emphasized: var(--lt-blue-20);

  --lt-color-secondary:       var(--lt-turquoise-70);
  --lt-color-secondary-hover: var(--lt-turquoise-60);
  --lt-color-secondary-bg:    var(--lt-turquoise-10);

  /* --- Color: Functional (alias) --- */
  --lt-color-success: var(--lt-color-success-base);
  --lt-color-error:   var(--lt-color-error-base);
  --lt-color-warning: var(--lt-color-warning-base);
  --lt-color-info:    var(--lt-color-info-base);

  /* --- Color: Text --- */
  --lt-color-text-primary:   var(--lt-grey-700);   /* 內文預設 */
  --lt-color-text-secondary: var(--lt-grey-500);   /* 次要文字 */
  --lt-color-text-tertiary:  var(--lt-grey-400);   /* hint / placeholder */
  --lt-color-text-disabled:  var(--lt-grey-400);   /* 白底上的停用文字／icon；停用「按鈕」的字用 --lt-button-disabled-text（白） */
  --lt-color-text-inverse:   var(--lt-white);
  --lt-color-text-link:      var(--lt-blue-70);    /* 2026-10-15 B-14：#0B6DD7 → #004FB0，連結一律加底線（稿 cell、FE ResourceButton） */
  --lt-color-text-link-hover: var(--lt-blue-60);   /* hover 淺一階 #0B6DD7，底線保留 */
  --lt-color-text-heading:   var(--lt-grey-800);   /* 為未來 heading 獨立換色預留 */
  --lt-color-text-icon:      var(--lt-grey-600);   /* 為未來 icon 獨立換色預留 */

  /* --- Color: Background --- */
  --lt-color-bg-default:    var(--lt-white);
  --lt-color-bg-subtle:     var(--lt-grey-50);
  --lt-color-bg-emphasized: var(--lt-grey-100);
  --lt-color-bg-disabled:   var(--lt-grey-100);   /* 停用的「欄位」底（輸入框／下拉，FE SelectButton gray.disableLight）。2026-10-15 B-1：停用「按鈕」改用 FE 版 #CCCCCC 底白字，見 --lt-button-disabled-bg／-text；這顆維持 #F2F2F2，不然舊頁 `.btn:disabled` 用它當底又用 #CCCCCC 當字會變灰壓灰 */
  --lt-color-text-on-disabled: var(--lt-white);   /* 停用按鈕上的字（= --lt-button-disabled-text） */
  --lt-color-bg-inverse:    var(--lt-blue-90);
  --lt-color-bg-overlay:    rgba(0, 0, 0, 0.5);
  --lt-color-bg-skeleton:   var(--lt-grey-200);   /* 骨架屏；2026-09-24 定，對應前端 gray.skeleton → gray.10；用途命名，日後可單獨換色 */

  /* --- Color: Border --- */
  --lt-color-border-default: var(--lt-grey-200);
  --lt-color-border-strong:  var(--lt-grey-300);
  --lt-color-border-focus:   var(--lt-color-primary);
  --lt-color-border-input:   var(--lt-grey-300);   /* 2026-10-15 B-7：#DCE3EC → #CCCCCC（FE、X-6 稿、RS／RO 稿一致） */
  --lt-color-border-input-hover: var(--lt-grey-400); /* 下拉／輸入 hover 框 #B3B3B3（Guideline Dropdown 已是這個） */
  --lt-color-border-error:   var(--lt-color-error-base);


  /* ============================================================
   * LAYER 3 — COMPONENT
   * 元件層：給特定元件使用；引用 semantic
   * ============================================================ */

  /* --- Sidebar (深海軍藍) --- */
  --lt-sidebar-width:      250px;
  --lt-sidebar-bg:         var(--lt-blue-90);
  --lt-sidebar-text:       rgba(255, 255, 255, 0.85);
  --lt-sidebar-text-muted: rgba(255, 255, 255, 0.50);
  --lt-sidebar-hover-bg:   rgba(255, 255, 255, 0.06);
  --lt-sidebar-active-bg:  var(--lt-color-primary);

  /* --- Topbar --- */
  --lt-topbar-bg:     var(--lt-white);
  --lt-topbar-shadow: var(--lt-shadow-dialog);   /* CMDS Dialog shadow（Card 級別 elevation）*/

  /* --- Card --- */
  --lt-card-bg:      var(--lt-color-bg-default);
  --lt-card-radius:  var(--lt-radius-md);
  --lt-card-shadow:  0 0 20px 0 rgba(0, 0, 0, 0.10);   /* 2026-10-15 B-3：Figma 對稿量到的卡片陰影（CB／AD／LumiTag 10/02）；原 var(--lt-shadow-dialog) 0 0 6px .2 */
  --lt-card-padding: var(--lt-space-24);

  /* --- Button --- */
  --lt-button-radius:     var(--lt-radius-btn);   /* 2026-10-15 B-8：4 → 5 */
  --lt-button-font-weight: var(--lt-fw-bold);     /* 2026-10-15 A-2：稿（CMDS Button Bold 1）與 FE muiButton 都是 700 */
  --lt-button-height:     36px;
  --lt-button-disabled-bg:   var(--lt-grey-300);  /* 2026-10-15 B-1：FE 版 */
  --lt-button-disabled-text: var(--lt-white);
  --lt-button-padding-x:  var(--lt-space-16);
  --lt-button-padding-y:  var(--lt-space-8);
  --lt-button-focus-ring: 0 0 0 3px rgba(0, 79, 176, 0.10);

  /* --- Input / Text Field --- */
  --lt-input-bg:        var(--lt-color-bg-default);
  --lt-input-border:    var(--lt-color-border-input);
  --lt-input-radius:    var(--lt-radius-btn);   /* 2026-10-15：36h r5（Figma 輸入與下拉） */
  --lt-input-height:    36px;
  --lt-input-padding-x: var(--lt-space-16);
  --lt-input-padding-y: var(--lt-space-8);

  /* --- Modal --- */
  --lt-modal-radius:   var(--lt-radius-modal);     /* 2026-10-15 B-4：表單類 15（原 12） */
  --lt-modal-radius-sm: var(--lt-radius-modal-sm); /* 確認類 10 */
  --lt-modal-shadow:   0 0 6px 0 rgba(0, 0, 0, 0.2);  /* 全站彈窗統一（B-4）；等同 --lt-shadow-dialog，寫死以免 dialog 陰影日後獨立換值時彈窗跟著動 */
  --lt-modal-padding:  var(--lt-space-24);
  --lt-modal-backdrop: rgba(0, 0, 0, 0.5);

  /* --- Tooltip --- */
  --lt-tooltip-bg:      #31383E;            /* 2026-10-09 Kabin 裁決改成 Figma 量到的值（原 #3C3C3C）；對齊 Lumiture-Guideline.md 規範；非品牌色，刻意不引用 brand token */
  --lt-tooltip-text:    var(--lt-white);
  --lt-tooltip-radius:  var(--lt-radius-sm);
  --lt-tooltip-padding: var(--lt-space-8);

  /* --- Page title / Toast（2026-10-15 修正輪新增） --- */
  --lt-page-title-size:   var(--lt-fs-24);   /* B-2：頁標題 24／700 */
  --lt-page-title-weight: var(--lt-fw-bold);
  --lt-toast-success-bg:  #008F88;           /* 照 FE toast.css；CLAUDE.md 10/13 */
  --lt-toast-error-bg:    #BF302E;
  --lt-toast-info-bg:     #0B6DD7;           /* FE toast.css --infoMain */
  --lt-toast-warning-bg:  #EC6F09;           /* FE toast.css --warningMain */
  --lt-toast-radius:      4px;
  --lt-toast-width:       400px;
}


/* ============================================================
 * NOT YET DEFINED (Pass 3+)
 * ============================================================
 * - ~~Chart palette~~ ✅ 已加入（2026-05-12 從 Figma General Behavior file audit）
 * - Gradient tokens (Figma 有 Lumiture.ai Blue / Orange / Lemon C 等)
 * - Opacity tokens (Figma 有 CM Opacity Color 系列)
 * - Composite typography tokens (--lt-type-h1, --lt-type-body 等 style sets)
 * - Focus / Inset shadow 特殊變體
 * - Dark mode 對應 token
 *
 * Shadow 結構待 Figma audit：v7/v8 用單層、tokens.css 主階用雙層；Overlay 已用單層作折衷
 * ============================================================ */

</style>
<style>
/* === Inlined: shared/lumiture-ui.css === */
/* ============================================================
 * lumiture-ui.css — 共用小元件樣式（2026-10-15 修正輪 S 組）
 * 引用：<link rel="stylesheet" href="../shared/lumiture-ui.css?v=2026-10-15">（tokens.css 之後；沒載 tokens.css 的頁面也能用，var 都有備用值）
 *
 *   .lt-select   下拉／輸入觸發欄（A-11）
 *   .lt-skeleton 骨架屏（A-18）
 *   .lt-link     文字連結（B-14）
 *   .lt-btn-icon 表格 Action icon button（B-6，CB 版）
 *   空狀態／無權限見 lumiture-empty.js；Toast 見 lumiture-toast.js
 * ============================================================ */

/* ---------- .lt-select ----------
 * 結構：
 *   <button type="button" class="lt-select" aria-haspopup="listbox" aria-expanded="false">
 *     <span class="lt-select__v">All Types</span>                       ← 沒選時加 .is-placeholder 在 .lt-select 上，字變 #B3B3B3
 *     <span class="material-symbols-outlined lt-select__arrow">arrow_drop_down</span>   ← MUI 實心 ▾，不要用 expand_more／chevron
 *   </button>
 * 狀態 class：.is-open（框 primary＋focus ring，箭頭轉 180）、.is-error、.is-disabled 或 :disabled、.is-placeholder
 * 高 36、圓角 5、字 14／400、框 #CCCCCC、hover 框 #B3B3B3（Guideline Dropdown；舊的 hover 框變藍底 #F2FAFF 已廢）。寬度由頁面給（width／min-width）。 */
.lt-select{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;box-sizing:border-box;height:var(--lt-input-height,36px);padding:0 4px 0 12px;
  background:var(--lt-color-bg-default,#fff);border:1px solid var(--lt-color-border-input,#CCCCCC);border-radius:var(--lt-input-radius,5px);
  font-family:inherit;font-size:14px;font-weight:400;line-height:1.5;color:var(--lt-color-text-primary,#262626);text-align:left;cursor:pointer;
  transition:border-color .15s ease,box-shadow .15s ease}
.lt-select:hover{border-color:var(--lt-color-border-input-hover,#B3B3B3)}
.lt-select:focus-visible,.lt-select.is-open{outline:none;border-color:var(--lt-color-border-focus,#004FB0);box-shadow:var(--lt-button-focus-ring,0 0 0 3px rgba(0,79,176,.1))}
.lt-select__v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt-select.is-placeholder .lt-select__v{color:var(--lt-grey-400,#B3B3B3)}
.lt-select__arrow{flex-shrink:0;font-size:24px;line-height:1;color:var(--lt-grey-500,#676767);transition:transform .2s ease;
  font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.lt-select.is-open .lt-select__arrow{transform:rotate(180deg)}
.lt-select.is-error{border-color:var(--lt-color-error,#FF403D)}
.lt-select.is-error:focus-visible,.lt-select.is-error.is-open{box-shadow:0 0 0 3px rgba(255,64,61,.1)}
.lt-select:disabled,.lt-select.is-disabled{background:var(--lt-grey-100,#F2F2F2);border-color:var(--lt-grey-300,#CCCCCC);color:var(--lt-grey-300,#CCCCCC);cursor:not-allowed;box-shadow:none}
.lt-select:disabled .lt-select__arrow,.lt-select.is-disabled .lt-select__arrow{color:var(--lt-grey-300,#CCCCCC)}

/* ---------- .lt-skeleton ----------
 * 骨架屏統一用 --lt-color-bg-skeleton（#E6E6E6）。**靜態**不跑 shimmer（X-6 現況，Guideline 已回改）；要 shimmer 才加 .lt-skeleton--shimmer。
 * 用法：<div class="lt-skeleton" style="width:120px;height:16px"></div>；表格列慣例見各頁稿 #01-6（表頭文字照常、只有儲存格內容換成灰條；卡片標題照常、按鈕 disabled）。

td.has-fptip{cursor:default}
td.has-fptip:focus-visible{outline:2px solid var(--lt-color-primary);outline-offset:-2px}
/* 樹狀版＋資料夾底色（2026-09-24 Kabin 試 C 之後提的版本）：
 * 引導線常駐（跟樹狀版一樣），停留時只把「所屬父層」那一條加深一階，
 * 不是讓線出現或消失，所以游標移動時畫面沒有東西在跳。
 * 資料夾列用 --lt-blue-10 底色；專案列 hover 改灰階，不然 hover 中的專案列
 * 會跟資料夾列同色，被讀成資料夾。 */
.rmodal-body.is-tinted .tnode.is-folder{background:var(--lt-blue-10);box-shadow:inset 0 -1px 0 0 var(--lt-blue-20)}
.rmodal-body.is-tinted .tnode.is-folder:hover{background:var(--lt-blue-20)}
.rmodal-body.is-tinted .trail{transition:background-color .12s}
/* 對照：VS Code 預設（workbench.tree.renderIndentGuides = onHover）。
 * 游標不在清單上時完全不畫線；游標一進清單，所有線一起淡入，所屬父層那條照樣加深。
 * 跟 C 的差別：線是整片一起出現，不會一列一列跟著游標跑。鍵盤 focus 在清單內也算進入 */
.rmodal-body.is-rails-onhover .trail{opacity:0;transition:opacity .15s,background-color .12s}
.rmodal-body.is-rails-onhover:hover .trail,
.rmodal-body.is-rails-onhover:focus-within .trail{opacity:1}
.hguide{position:absolute;top:0;bottom:0;width:1px;background:var(--lt-blue-60,#0B6DD7);opacity:0;pointer-events:none;transition:opacity .12s}
/* 白底列 hover 用 CM Hover #F6F6F6（Guideline 狀態色「白色背景 hover」、Dropdown Item hover）。
 * 淡藍 #F2FAFF 在 Dropdown 規範裡是 Selected，拿來當 hover 會跟選取狀態混淆（2026-09-24 統一） */
.tnode:hover{background:var(--lt-grey-50)}
/* 資料夾列在自己的子樹範圍內黏在頂端。因為 .tbranch 把子項包起來，
 * 黏著會在子樹捲完時自然結束，不會一路疊到底。收合的資料夾 .tbranch
 * 高度等於自己那一列，等於沒有黏著空間，行為自動退回一般列。 */
.tnode.is-folder{position:sticky;background:var(--lt-color-bg-default)}
.tnode.is-folder:hover{background:var(--lt-grey-50)}
.tnode.is-project{min-height:44px}
/* 縮排封頂後補上的祖先路徑。次要文字色 + 正常字重，讓資料夾名稱仍然是這一列
 * 唯一的粗體，路徑只是脈絡不是主體。 */
.tpath{color:var(--lt-color-text-secondary);font-weight:400}
/* 工具列下方的提示位（先前刻意留空給真警示用的那一格）。這裡是「切視角清掉
 * 了勾選」，屬於使用者需要立刻知道且可以還原的事，所以用 warning 的琥珀色，
 * 不是錯誤紅、也不是常駐說明的藍。 */
.tnotice{display:flex;align-items:center;gap:8px;padding:10px 24px;background:var(--lt-color-warning-bg,#FFF6E5);
  color:var(--lt-color-text-primary);font-size:13px;border-bottom:1px solid var(--lt-color-border-default)}
.tnotice .material-symbols-outlined{font-size:18px;color:var(--lt-color-warning,#FC9A0F)}
.tnotice-act{margin-left:auto;background:none;border:0;padding:0;cursor:pointer;font:inherit;
  color:var(--lt-color-primary);font-weight:600}
.tnotice-act:hover{text-decoration:underline}
/* padding:0 是必要的，不是保險：<button> 的 UA 預設 padding 是 1px 6px，
 * 配上 box-sizing:border-box 跟固定 20x20，content box 只剩 8px 寬，
 * 20px 的 icon 放不進去就往右溢出 6px、往下 1px。結果是 hover 的灰色方塊
 * （按鈕本體）跟箭頭本身錯開，看起來歪斜。 */
.tchev{width:20px;height:20px;flex:0 0 20px;padding:0;display:grid;place-items:center;border:0;background:transparent;color:var(--lt-color-text-secondary);cursor:pointer;border-radius:var(--lt-radius-sm)}
.tchev:hover{background:var(--lt-grey-200)}
.tchev .material-symbols-outlined{font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}
.tchev.ghost{visibility:hidden}
.tnode .ticon{font-size:18px;color:var(--lt-color-text-secondary);flex:0 0 auto}
/* 專案列沒有資料夾 icon，但如果不補一個等寬的空位，專案名稱會比父層資料夾的
 * 名稱還靠左（父層多了 icon 18px + gap 8px），縮排看起來像倒退回去。 */
.tnode .ticon.ghost{visibility:hidden}
.tnode.is-folder .ticon{color:var(--lt-color-primary)}
.tnode.is-unassigned .ticon{color:var(--lt-grey-400)}
/* 多 org 時這一組排在所有 org 區段之外，用一條實線把它跟上一個 org 切開，
 * 不然它緊貼在最後一個 org 的資料夾底下，會被讀成屬於那個 org。 */
.tnode.is-cross-org{border-top:1px solid var(--lt-color-border-default)}
.tlabel{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tname{font-size:var(--lt-fs-14);color:var(--lt-color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode.is-folder .tname{font-weight:600}
.tnode.is-unassigned .tname{color:var(--lt-color-text-secondary)}
.tsub{font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcount{font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);font-weight:400;font-variant-numeric:tabular-nums}
.tcount.partial{color:var(--lt-color-warning)}
.ba-chip.is-org-chip{background:var(--lt-blue-10);color:var(--lt-color-primary)}
.ba-chip{flex:0 0 auto;font-size:11px;color:var(--lt-color-text-secondary);background:var(--lt-grey-100);border-radius:var(--lt-radius-xs);padding:2px 8px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.hl{color:var(--lt-blue-60);font-weight:700}
/* Select All 是清單的總開關，不是樹的一部分，用一條底線跟樹分開 */
.tnode.is-selectall{border-bottom:1px solid var(--lt-color-border-default);position:sticky;top:0;z-index:40;background:var(--lt-color-bg-default)}
/* org 區段標頭。比資料夾列深一階（blue-20 vs blue-10），字級小一階，
 * 沒有 checkbox / chevron 也不可點——讓它一眼就不是「可以勾的東西」。 */
/* min-height 壓到 32px 要連 .tnode 的 padding 4px 上下一起收掉，不然會被撐回 40。
 * 比資料夾列矮一階是刻意的：它不是可勾選的列，體積就不該跟那些列一樣。 */
/* padding-left 16px：.tnode 的 base padding-left 是 0（各列自己用 inline 的
 * indentPx() 決定），標頭沒有 inline padding 就會貼齊左邊緣。取 16 而不是
 * 資料夾列的 24，是讓標頭的左緣比列還外面一點，強化「這是區段不是列」。
 * icon 與文字之間 8px（8px grid；原本寫 6px 是離格的）。 */
.tnode.is-org{position:sticky;z-index:35;min-height:32px;padding:0 24px 0 16px;gap:8px;cursor:default;
  background:var(--lt-blue-20,#CCE0F5);box-shadow:inset 0 -1px 0 0 var(--lt-blue-30,#99C1EB)}
.tnode.is-org:hover{background:var(--lt-blue-20,#CCE0F5)}
.tnode.is-org .org-icon{font-size:16px;color:var(--lt-color-primary);flex:0 0 auto;
  font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
.tnode.is-org .org-name{font-size:var(--lt-fs-12);font-weight:600;color:var(--lt-color-text-primary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode.is-selectall .tname{font-weight:600}
.tname.is-nocost{color:var(--lt-color-text-secondary);font-style:italic}
.is-nofolder{color:var(--lt-color-text-secondary);font-style:italic}
.fpath{color:var(--lt-color-text-secondary)}
/* Folder 欄中段截斷（2026-09-24）：原本整格 text-overflow 從尾巴切，1024px 寬時
 * 顯示成「corp / … / payment…」，最重要的資料夾本身反而被切掉。
 * 改成兩段：路徑可以縮到只剩「…」，資料夾名稱不縮（只有自己比整格還長時才截） */
.fcell{display:flex;min-width:0;max-width:100%}
.fcell .fpath{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcell .fown{flex:0 0 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ============================================================
 * 元件版：忠實複製既有 GroupedMultiSelect 的視覺語言，再延伸到多層。
 * 對照來源（LumiTure-FE）：
 *   GroupHeader.tsx                → 父層：primary.light10 底 + 底部
 *                                    light20 hairline + fontWeight 700 +
 *                                    (count) + 右側 Expand icon button
 *   GroupedMultiSelectOptionItem   → 子項：pl:'32px'、單行 name + (desc)
 *   GroupedMultiSelectOption       → ITEM_HEIGHT = 40（固定列高）
 * 刻意不補的：縮排引導線、資料夾 icon、巢狀 sticky——元件本來就沒有，
 * 補了就不是「用既有元件做」而是又變回樹狀版了。
 * ============================================================ */
.rmodal-body.is-component .tnode{min-height:40px}
.rmodal-body.is-component .tnode.is-project{min-height:40px}
/* 這條要跟上面同一個選擇器深度，否則 .tnode.is-org 的 32px 搶不過 0,3,0。 */
.rmodal-body.is-component .tnode.is-org{min-height:32px}
/* 元件版（非 fix）用 react-window，列會變成 absolute，sticky 在裡面無效——
 * org 標頭跟資料夾列受同一個限制，所以那個對照版本要一起退回 static，
 * 不然會給人「元件版做得到 sticky」的錯覺。 */
.rmodal-body.is-component:not(.is-component-fixed) .tnode.is-org{position:static}
/* 父層＝整條 tint band（GroupHeader 的 sx） */
.rmodal-body.is-component .tnode.is-folder{
  position:static;                       /* 元件用 react-window 虛擬清單，sticky 在裡面無效 */
  background:var(--lt-blue-10);
  box-shadow:inset 0 -1px 0 0 var(--lt-blue-20);
}
.rmodal-body.is-component .tnode.is-folder:hover{background:var(--lt-blue-10)}
.rmodal-body.is-component .tnode.is-folder .tname{font-weight:700}
/* 收合箭頭移到最右（GroupHeader 把 IconButton 放在 label 後面） */
.rmodal-body.is-component .tchev{order:9;margin-left:auto;color:var(--lt-color-primary)}
.rmodal-body.is-component .tchev.ghost{display:none}
/* 元件沒有資料夾 icon，父層只有 checkbox + 粗體字 */
.rmodal-body.is-component .ticon{display:none}
/* 子項是單行 name (desc)，desc 用 hint 色 */
.rmodal-body.is-component .tlabel{flex-direction:row;align-items:center;justify-content:flex-start;gap:6px}
.tdesc{font-size:var(--lt-fs-14);color:var(--lt-color-text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 元件版 + 建議修正：箭頭移回左邊（跟縮排同一欄）、縮排步進改 16px。
 * 只有這兩個差異，其餘視覺完全等於元件版。 */
/* 只釘「目前所在的最上層資料夾」那一列，不做巢狀釘選。
 * 巢狀釘選（每一層祖先都釘住）在 10 層 = 400px 的釘住區、body 只有 465px，
 * 會自己撐爆；而且 react-window 的列是 position:absolute、本來就不能 sticky。
 * 只釘一列是設計上合理、技術上也做得到的那個版本。
 * ⚠️ 這支 prototype 沒有虛擬清單，所以這裡的 sticky 是「示意要的行為」，
 * 不等於證明它在 react-window 裡可行。真的要做的路徑是換成
 * @tanstack/react-virtual（package.json 已有，VirtualizedTable 已在用且
 * sticky header 有效）。 */
.rmodal-body.is-component.is-component-fixed .tnode.is-folder{position:sticky}
.rmodal-body.is-component.is-component-fixed .tchev{order:0;margin-left:0}
.rmodal-body.is-component.is-component-fixed .tchev.ghost{display:block;visibility:hidden}
.tempty-icon{display:block;font-size:32px;color:var(--lt-color-text-tertiary);margin-bottom:8px}
.tempty-icon.is-success{color:var(--lt-color-success)}
.tempty-title{font-size:var(--lt-fs-16);font-weight:600;color:var(--lt-color-text-primary);margin-bottom:4px}
.tempty{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;color:var(--lt-color-text-secondary);font-size:var(--lt-fs-14)}
.gb-info{font-size:16px;color:var(--lt-color-text-secondary);cursor:help}
.tskel{padding:8px 24px}
.tskel .skel{height:36px;margin-bottom:8px}


/* ============================================================
 * v3 P1 — Create Group wizard（Figma #08 系列）
 * 彈窗 800×720：#08 的 instance「IAM / Group List / Create Group」實測 800×720，
 * 註記也寫「由於後面步驗需要展示較多內容，因此彈窗高度先固定為最大值的 720px」。
 * 這是 CMDS 660px 預設的例外，依據是設計稿本身（#11 的便利貼也提到
 * 「create group 流程優化…連帶出現一些寬度 800px 的彈窗，其餘都是 700px」）。
 * ============================================================ */
.wz-backdrop{position:fixed;inset:0;z-index:2000;background:var(--lt-modal-backdrop);display:grid;place-items:center;padding:24px}
.wz{width:min(800px,100%);height:min(720px,calc(100vh - 48px));display:flex;background:#fff;border-radius:var(--lt-modal-radius);box-shadow:var(--lt-modal-shadow);overflow:hidden}   /* Figma: rounded-[15px]，不對應任何既有 --lt-radius-* token（get_design_context 核對） */
/* 左側垂直 stepper：done / active 都是藍色實心勾（#30 第一、二步同時是勾），
 * 未到的步驟是灰色空心圓 + 灰字。步驟之間一條 2px 直線接在圓心下方。 */
.wz-steps{flex:0 0 200px;padding:32px 8px 32px 24px;display:flex;flex-direction:column;border-right:1px solid var(--lt-grey-200)}   /* X-9r5 GA21：稿 #08 stepper 欄右緣分隔線 #E6E6E6 */
.wz-step{display:flex;align-items:flex-start;gap:10px;font-size:14px;font-weight:700;line-height:24.5px;color:var(--lt-grey-400)}   /* get_design_context：Body Bold 14px、icon-text gap 10px，不是 13px/600/18px/8px */
.wz-step .wz-dot{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:2px solid var(--lt-grey-300);background:#fff;display:grid;place-items:center;margin-top:-1px}
.wz-step .wz-dot .material-symbols-outlined{display:none;font-size:14px;color:#fff;font-variation-settings:'FILL' 1,'wght' 700,'GRAD' 0,'opsz' 20}
.wz-step.done,.wz-step.active{color:var(--lt-color-primary)}
.wz-step.done .wz-dot,.wz-step.active .wz-dot{background:var(--lt-color-primary);border-color:var(--lt-color-primary)}
.wz-step.done .wz-dot .material-symbols-outlined,.wz-step.active .wz-dot .material-symbols-outlined{display:block}
.wz-line{width:2px;height:30px;background:var(--lt-grey-200);margin:6px 0 6px 9px;flex:0 0 auto}   /* Figma connector 是 30px，不是 26（get_design_context 核對） */
.wz-pane{flex:1;min-width:0;display:flex;flex-direction:column;padding:24px}
.wz-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:32px}   /* Figma Content: gap-32，不是 24（get_design_context 核對） */
.wz-head h3{margin:0;font-size:var(--lt-fs-20);font-weight:var(--lt-fw-bold);line-height:30px}   /* Figma: CM Typography/Headers/H4 20px Bold（get_variable_defs 核對，不是 v2 沿用的 18px） */
.wz-desc{margin:0 0 32px;font-size:var(--lt-fs-14);color:var(--lt-color-text-primary);line-height:var(--lt-leading-tight)}   /* 同上，Content gap-32 統一套用 */
.wz-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;overscroll-behavior:contain}
.wz-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px}
.wz-foot .btn{min-width:100px}
.wz-foot-right{display:flex;gap:8px;margin-left:auto}
.wz-skip{font-size:12px;font-weight:700}   /* X-9r5 GA13：稿 #08 12／700（底線保留） */
/* 內嵌的資源選單：#31 / #37 把清單裝在一個帶框線的容器裡，這裡復用 v2 的
 * picker（工具列 + 提示條 + 清單），只換外殼。 */
.wz-picker{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--lt-color-border-default);border-radius:5px;overflow:hidden}
.wz-picker .rmodal-tools{padding:12px 16px;flex-wrap:wrap}
.wz-picker .rmodal-tools .search-box{flex:1 1 300px;min-width:300px}   /* A-34③：placeholder 完整顯示，放不下時 Group by 換到下一行 */
.wz-picker .rmodal-body{border-bottom:0}
.wz-picker .tnotice{padding:8px 16px}
.wz-count{margin-top:8px}
.spin{animation:wzspin 1s linear infinite;font-size:18px}
@keyframes wzspin{to{transform:rotate(360deg)}}

/* ---- form fields（#08 / #30 / #11：藍色粗體小標籤 + 36px 輸入框 + 12px 灰色說明） ---- */
.fld{margin-bottom:32px}   /* 同上：Content 內每個區塊（欄位、欄位群組）之間固定 gap-32，不是 20（get_design_context 核對 #08 / #09 皆同） */
.fld-lbl{display:block;font-size:var(--lt-fs-12);font-weight:700;color:var(--lt-color-primary);margin-bottom:4px;line-height:1.4}   /* Text Field 元件內建 label→input gap 是 4px，不是 6（get_design_context 核對） */
.fld-lbl .req{color:var(--lt-color-error);font-size:var(--lt-fs-12);font-weight:400}   /* X-9r5 GA14：稿 #08／#07-1 星號前空一格、12／400 */
.ipt{width:100%;height:36px;border:1px solid var(--lt-grey-300);border-radius:5px;padding:0 8px;font-size:14px;background:#fff;color:var(--lt-color-text-primary)}   /* Figma: State/Border Main #CCCCCC + 8px 水平內距（get_design_context 核對，原本邊框 12px 內距都是猜的） */
.ipt::placeholder{color:var(--lt-grey-400)}
.ipt-lg{height:44px}   /* #09 Edit Group 用的是 Text Field / Large（44px），不是其餘表單共用的 Medium（36px）（get_design_context 核對，只在這一個彈窗看到 Large，範圍縮到只有這裡） */
.ipt:focus{outline:none;border-color:var(--lt-color-primary)}
.fld.has-error .ipt{border-color:var(--lt-color-error)}
.fld.has-error .ipt:focus{border-color:var(--lt-color-error)}
.fld-err{font-size:var(--lt-fs-12);color:var(--lt-color-error);margin-top:4px;line-height:1.4}
.fld-help{font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);margin-top:6px;line-height:1.5;padding-left:8px}
.sel{position:relative}
.sel select.ipt{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer}
.sel::after{content:'arrow_drop_down';font-family:'Material Symbols Outlined';position:absolute;right:8px;top:6px;font-size:22px;color:var(--lt-color-text-secondary);pointer-events:none}
/* Error Details 折疊區（#08-2、#11-1）：預設展開、內容過高才出捲軸、點標題可收合
 * 只剩標題。註記說樣式參考 CMDS，這裡照截圖：外框 + 紅色警示 icon + 粗體標題 +
 * 右側 chevron。 */
.errbox{border:1px solid var(--lt-grey-300);border-radius:0;margin-top:8px;overflow:hidden;background:#fff}   /* X-9r5 GA15：稿 #08-2／#11-1 框 #CCCCCC、直角 */
.errbox-head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px 8px 20px;border:0;background:#fff;font:inherit;font-size:13px;font-weight:700;color:var(--lt-color-text-primary);cursor:pointer;text-align:left}
.errbox-head .warn{color:var(--lt-color-error);font-size:18px}
.errbox-head .chev{margin-left:auto;font-size:20px;color:var(--lt-color-text-secondary);font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}
.errbox-body{border-top:1px solid var(--lt-color-border-default);padding:12px 16px 12px 20px;font-size:var(--lt-fs-12);line-height:1.6;max-height:132px;overflow:auto;overscroll-behavior:contain;color:var(--lt-color-text-primary)}
.errbox-body ul{margin:8px 0 0;padding-left:18px}
.errbox-body::-webkit-scrollbar{width:6px}
.errbox-body::-webkit-scrollbar-thumb{background:var(--lt-grey-300);border-radius:3px}

/* ---- Resources 子分頁 segmented control（#03-3 / #03-4）：Project|Label、Account|Tag。
 * 選中的那格淺藍底 + 藍字 + 深藍計數 pill；未選白底灰字 + 灰計數 pill。 ---- */
/* X-9r5 GA6：CMDS Toggle Group（稿 #03；同 Audit Log .tg）。白底、框 #CCCCCC、r6、選中 #D1EEFF／#002663 14／400；計數 20×20 r5 方塊，選中 #004FB0、未選 #676767，白字 14／700 */
.seg{display:inline-flex;height:36px;border:1px solid var(--lt-grey-300);border-radius:6px;overflow:hidden;background:#fff;flex:0 0 auto}
.seg-btn{height:34px;padding:0 16px;border:0;background:#fff;font-size:14px;font-weight:400;color:var(--lt-color-text-secondary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;white-space:nowrap;transition:background var(--lt-transition-fast)}
.seg-btn+.seg-btn{border-left:1px solid var(--lt-grey-300)}
.seg-btn:hover{background:var(--lt-grey-50)}
.seg-btn.active{background:var(--lt-blue-20);color:var(--lt-blue-90)}
.seg-btn.active:hover{background:var(--lt-blue-20)}
.seg-btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(0,79,176,.35)}
.seg-cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:5px;padding:0 4px;font-size:14px;font-weight:700;background:var(--lt-grey-500);color:#fff;font-variant-numeric:tabular-nums}
.seg-btn.active .seg-cnt{background:var(--lt-color-primary);color:#fff}
.res-toolbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.res-toolbar-left .search-box{width:240px}

/* ---- Assign Resource by Label / Tag（#56 / #57）：800px 寬、高度 hug。
 * 下拉面板（#56-1 / #57-1）會超出彈窗底部，所以彈窗本身不能 overflow:hidden。 ---- */
.lmodal{width:min(800px,100%);background:#fff;border-radius:var(--lt-modal-radius);box-shadow:var(--lt-modal-shadow);padding:24px;position:relative}
.lmodal .rmodal-head{padding:0;margin-bottom:20px}
.lmodal .rmodal-head h3{font-size:var(--lt-fs-20);font-weight:var(--lt-fw-bold)}   /* A-34②：稿 #56 標題 20/700 */
.dd{position:relative}
.dd-trigger{width:100%;height:36px;border:1px solid var(--lt-grey-300);border-radius:5px;padding:0 32px 0 12px;background:#fff;text-align:left;font:inherit;font-size:14px;color:var(--lt-color-text-primary);cursor:pointer;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}   /* 同上 */
.dd-trigger.placeholder{color:var(--lt-grey-400)}
.dd-trigger:focus-visible{outline:none;border-color:var(--lt-color-primary)}
.dd.is-open .dd-trigger{border-color:var(--lt-color-primary)}
.dd-trigger:disabled{background:var(--lt-grey-50);color:var(--lt-grey-300);cursor:not-allowed}
.dd-caret{position:absolute;right:8px;top:6px;font-size:22px;color:var(--lt-color-text-secondary);pointer-events:none;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
.dd-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;background:#fff;border:1px solid var(--lt-color-border-default);border-radius:6px;box-shadow:var(--lt-shadow-dialog);padding:10px;display:flex;flex-direction:column;overflow:hidden}   /* 上一版猜 elevation/1（MUI Paper 陰影）是錯的——get_design_context 直接讀到這個元件自己的 shadow-[0px_0px_6px_...rgba(0,0,0,0.2)]，就是站台既有的扁平 Dialog/Card/Dropdown 陰影 --lt-shadow-dialog。get_variable_defs 那次抓到的 elevation/1 屬於同一個畫布範圍內的別的東西，不是這個下拉本身。順帶核對：外距 10px、圓角 6px、清單列 40px（見下） */
.dd-search{padding:0 0 8px;border-bottom:1px solid var(--lt-color-border-default);margin-bottom:8px}   /* .dd-panel 已經有 10px 外距，搜尋框不用再自己內縮；改成搜尋列跟清單之間畫一條分隔線（get_design_context：Line 73） */
.dd-search .search-box{width:100%}
/* #56-1／#57-1 稿的搜尋 icon 在右邊，B-9 裁決全站統一放左（見下方 DEVIATION） */
.dd-search .search-box input{padding:0 12px 0 36px;height:32px}   /* ⚠ DEVIATION（B-9 全站統一放左，稿 #56-1／#57-1 是右，Figma 待回改） */
.dd-search .search-box .material-symbols-outlined{left:9px;right:auto;top:6px}
.dd-list{flex:1;min-height:0;max-height:280px;overflow:auto;overscroll-behavior:contain}   /* X-9r5 GA24：正好 7 整列（40×7，拿掉原本的底內距 4，那 4px 會露出下一列群組標頭的頂端），面板底不停在半截群組標頭上 */
.dd-list::-webkit-scrollbar{width:6px}
.dd-list::-webkit-scrollbar-thumb{background:var(--lt-grey-300);border-radius:3px}
.dd-row{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 8px;border-radius:5px;cursor:pointer;font-size:14px;color:var(--lt-color-text-primary)}   /* get_design_context：40px 列高、8px gap、14px 字（原本 30px/10px/13px 都是猜的） */
.dd-row:hover{background:var(--lt-color-primary-bg)}
/* 上層列是深藍色整條 band（#56-1「Billing Account = Cleveland-client-01 (…)」） */
.dd-row.group{background:var(--lt-blue-90);color:#fff;font-weight:700;font-size:16px;position:sticky;top:0;z-index:2;border-radius:0}   /* 2026-09-11 Kabin 核可：深藏青 #002663（--lt-blue-90）才對，
   get_design_context 上次讀到的 #0b6dd7 是誤判。
   已知未來方向：這個分組列之後會改成跟 Cost Dashboard 篩選器／LumiTag 那組一樣的 Light 10（淺藍底
   --lt-blue-10 #f2faff）風格，但那個模式在目前的 codebase 裡還沒有現成範例可抄（cost-dashboard 的
   groupby-dropdown 目前的 section 分隔只是純文字小標籤，不是色塊），屬於之後才會做的改版，這輪不動。 */
.dd-row.group:hover{background:var(--lt-blue-90)}
.dd-row.group .dd-id{color:rgba(255,255,255,.72);font-weight:400}
.dd-row.group .checkbox__box{border-color:#fff}
.dd-row.child{padding-left:32px}   /* get_design_context：32px 縮排，不是 28 */
.dd-id{font-size:12px;color:var(--lt-color-text-secondary)}
.dd-empty{padding:16px;font-size:13px;color:var(--lt-color-text-secondary);text-align:center}
.dd-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


/* ---- v3 P2：Group / User CRUD 彈窗（#09 / #10 / #10-1 / #11 / #12 / #13） ----
 * 寬度照 Figma instance 實測：Edit Group / Remove Group / Edit User / Remove User 640、
 * Group Deletion Not Allowed 655、Invite User 800（跟 Create Group 同一顆元件）。
 * ⚠️ CMDS 預設 660 與這裡量到的 640 差 20px，已列入回報請 Kabin 確認哪個是準的。 */
.dlg.fm{padding:24px 32px;border-radius:var(--lt-modal-radius)}   /* Figma「Modal / Left Aligned / Field」：px-32 py-24 + rounded-15，不是 v2 .dlg 沿用的 24px 全邊 + --lt-radius-lg（get_design_context 核對 #09） */
.dlg.fm.is-warn{border-radius:var(--lt-modal-radius-sm)}   /* Remove Group／Remove User／Group Deletion Not Allowed 用的是「Modal / Left Aligned / Normal」，圓角 10px，不是 Field 變體的 15px（get_design_context 核對 #10／#13） */
.fm-head{display:flex;align-items:center;gap:15px;margin-bottom:32px}   /* Normal 變體：icon-標題 gap 15px、Content 統一 32px 間距，不是 10px/20px（get_design_context 核對） */
.fm-head h3{margin:0;font-size:var(--lt-fs-20);font-weight:var(--lt-fw-bold);line-height:30px;flex:1}   /* 同上，H4 20px Bold */
/* #10 / #13 的警示 icon 是深色實心三角，不是琥珀色（跟 v2 Unlink 那顆不同，照各自的稿） */
.fm-head .material-symbols-outlined.fm-warn{font-size:30px;color:var(--lt-color-text-primary)}
.fm-head .material-symbols-outlined.fm-err{font-size:30px;color:var(--lt-color-error)}   /* B-12：Remove Group／Remove User 標題 icon 改 CB 版紅 error 圓 */   /* Warning icon 是 30x30，不是 24（get_design_context 核對） */
.fm-name{color:var(--lt-color-primary);font-weight:500}   /* Figma 群組/使用者名稱是 Medium 500，不是預設 400（get_design_context 核對） */
.fld-static{font-size:14px;color:var(--lt-color-text-primary);padding:2px 0}
/* .fm 內的 .wz-desc（Invite Admin/Invite User）沒有另外驗證出不同的間距，拿掉原本猜的 20px override，直接繼承上面驗證過的 32px */
.fm .dlg-body{margin-bottom:32px;line-height:24.5px}   /* 同一個 Content gap-32 規則，不是 24；行高 24.5px（Body Regular）（get_design_context 核對） */
.fm .dlg-actions{gap:16px}   /* #09 的 action row 是 gap-16，v2 的 .dlg-actions 預設 8px 是 Unlink Resource 自己的稿，不動、只在 .fm 範圍覆寫（get_design_context 核對） */


/* ---- v3 P3：Admin List、逐清單 loading、零碎狀態 ---- */
/* 麵包屑（#06 註記：最多一行、每項最大寬約 135px、超過顯示 …） */
.crumb{display:flex;align-items:center;gap:4px;white-space:nowrap}
.crumb-item{display:inline-block;max-width:135px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
/* Learn More 連結（#01 / #02 / #07）：問號 icon + 深灰底線粗體小字，放在卡片內表格下方 */
.learn-more{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:20px}   /* R2：align-items:flex-start，按鈕寬度只吃文字＋icon，不再整行可點 */
.learn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;cursor:pointer;font:inherit;font-size:var(--lt-fs-12);font-weight:700;color:var(--lt-color-text-secondary);text-decoration:underline;position:relative}   /* X-9r5 GA18：Learn More 文字 #676767（稿 #01；同 Organization Settings C-6 #32） */
.learn .material-symbols-outlined{font-size:16px;color:var(--lt-color-text-secondary);text-decoration:none}
.learn:hover{color:var(--lt-color-primary)}
/* Skeleton 表頭（#32–#35）：表頭是一條灰色 band 裡放灰條，沒有欄位文字 */
thead th.skel-th{background:var(--lt-grey-100)}
.skel-th .skel{height:14px;width:60%}
/* 讀取中的分頁列：維持樣式但不可點（#34 註記「用來顯示使用者身處何處的 tab / button group 等元件需維持原樣式，但點擊無作用」） */
.is-loading-ui{pointer-events:none}

/* X-9r5 GA32：點擊目標補到 24（WCAG 2.5.8），外觀不動，只加透明偽元素 */
.lt-btn-icon{position:relative}
.lt-btn-icon::before,.link-btn::before,.learn::before,.wz-skip::before{content:'';position:absolute;left:-2px;right:-2px;top:-4px;bottom:-4px}
.lt-btn-icon::before{left:-2px;right:-2px;top:-2px;bottom:-2px}
.tnode .tchev{position:relative}
.tnode .tchev::before,.tnode .checkbox::before,td .checkbox::before,th .checkbox::before{content:'';position:absolute;left:-4px;right:-4px;top:-4px;bottom:-4px}
.tnode .tchev::before{left:-2px;right:-2px;top:-2px;bottom:-2px}

/* ---- footer ---- */
.footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:16px 32px;margin-top:auto;font-size:12px;color:#676767;background:var(--lt-color-primary-bg);border-top:1px solid var(--lt-color-border-default)}
.footer-version{color:#262626;font-weight:500}
.ver-tag{background:#34B5D9;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px}   /* A-41：同其他頁 r10／高 18／10px／700 */

@media(max-width:800px){.main{padding:24px 16px 96px}.section-head{flex-direction:column}.res-toolbar{flex-direction:column;align-items:flex-start}.search-box{width:100%}}
/* 展示入口（X-9r6 F2；寫法同 Auth）：Invite User 成功 toast 第二行的「Open this email (prototype)」，連到 Notification Emails 的 Activate 信。prototype 專用元素不是產品 UI，Demo FAB「CRUD」可整批隱藏 */

.lt-toast .demo-entry:hover{background:#0E3A82}
.lt-toast .demo-entry:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lt-toast .demo-entry .material-symbols-outlined{font-size:14px}
body.demo-entries-off .demo-entry,body.demo-entries-off .lt-toast-extra{display:none}
</style>

<script>window.LUMITURE_ACTIVE = location.hash==='#admin' ? 'admin-list' : 'group-list';   // v3：Admin List 也在這支檔案裡（#admin） window.LUMITURE_USER={role:'Admin',plan:'Standard',quota:{analyses:{used:32,total:80},rightsizing:{used:410,total:1000},refreshDate:'2 Jul. 2026'}};</script>
<script>
/* === Inlined: shared/lumiture-checkbox.js === */
/*!
 * lumiture-checkbox.js — Lumiture Shared Checkbox v1
 *
 * Design spec: Lumiture-Guideline #Checkbox（S size / Primary / unchecked-checked-mixed）
 *   16×16、圓角 2、unchecked 框 --lt-color-primary（2026-10-15 A-13：稿 CB 註解／GB #02 都是 primary 框 r2，原本灰框 #CCCCCC r4；CB／ARL 頁面層的覆寫可刪）、checked/mixed 皆 --lt-color-primary
 *   四態齊全：hover / focus-visible / disabled / mixed
 *   mixed 用 remove icon、checked 用 check icon
 *
 * 為什麼不是純 span、也不是純原生 input
 * ---------------------------------------------------------------------------
 * group-list v3 當初改成純 span，理由是原生 input[type=checkbox] 在部分瀏覽器的
 * unchecked 狀態會多畫出一個痕跡（實測與 accent-color、尺寸都無關，是瀏覽器畫
 * 原生方框本身的痕跡）。但那個痕跡來自「被畫出來的」原生方框；把 input 藏成
 * opacity:0 之後它一樣不存在，而 .checked / .indeterminate / :checked 三個介面
 * 全部保留下來。
 *
 * 這件事有實際意義，因為既有 prototype 分成兩派狀態模型：
 *   重繪派  caller 持有 Set/物件，傳 checked/mixed 進來，改變後重繪整塊
 *           （group-list v3、cost-dashboard v2）
 *   DOM 派  DOM 本身就是狀態，靠 el.checked / :checked 反推
 *           （lumi-tag v8 的多選面板、rightsizing v1 的表格與 .sc-check）
 * 純 span 會逼 DOM 派發明一套狀態層；純原生 input 會逼重繪派回頭補
 * input.indeterminate（HTML 沒有這個屬性，只能渲染後補丁）。
 *
 * 解法是讓 CSS 同時吃兩種來源：
 *   .checkbox input:checked ~ .checkbox__box   ← DOM 派
 *   .checkbox.is-checked     .checkbox__box    ← 重繪派
 * 兩條路落在同一組像素上，誰都不用改自己的模型。
 *
 * 附帶把原生語意拿回來：Space 鍵、label 關聯、form 參與、focus 目標都是免費的
 * （group-list v3 的註記自己就寫過「原生 input 這些是免費的」）。
 *
 * ---------------------------------------------------------------------------
 * 用法 A — 重繪派（caller 持有狀態）
 *
 *   LumiCheckbox.html({ checked, mixed, disabled, onclick })
 *   → 傳 class，渲染時就決定，不需要渲染後補 indeterminate
 *
 *     rows.map(r => LumiCheckbox.html({
 *       checked: sel.has(r.id),
 *       onclick: `toggleRow('${r.id}')`
 *     })).join('')
 *
 * 用法 B — DOM 派（DOM 即狀態）
 *
 *   LumiCheckbox.html({ stateful:true, checked, value, cls, onchange })
 *   → 產生真的 input，el.checked / el.indeterminate / :checked 照常運作
 *
 *     `<label>${LumiCheckbox.html({ stateful:true, cls:'ms-chk', value:opt })}
 *        <span>${opt}</span></label>`
 *     panel.querySelectorAll('.ms-chk:checked')     // 照常
 *     chkAll.indeterminate = true                    // 照常
 *
 * 兩種用法可以同檔混用，視覺完全一致。
 *
 * ---------------------------------------------------------------------------
 * Exposes
 *   LumiCheckbox.html(opts)   → HTML 字串
 *   LumiCheckbox.el(opts)     → DOM 節點（需要直接 append 時用）
 *   LumiCheckbox.input(elOrSelector) → 取出內部 input（stateful 用）
 *   LumiCheckbox.set(elOrSelector, {checked, mixed, disabled})
 *                             → 兩種模式共用的狀態設定，caller 不用管是哪一種
 *
 * opts
 *   checked   bool    初始/當前選中
 *   mixed     bool    部分選中（重繪派用 class；DOM 派請改設 input.indeterminate）
 *   disabled  bool
 *   stateful  bool    true = 產生真 input（DOM 派），false = 純 class（重繪派）
 *   onclick   string  inline handler（重繪派慣用；自動包 event.stopPropagation）
 *                     省略 = 這個 checkbox 只是外層控制項的視覺，會輸出
 *                     aria-hidden 且不搶 tab 焦點、不擋外層的 onclick
 *   onchange  string  inline handler（stateful 慣用）
 *   value     string  stateful 的 input value
 *   cls       string  額外掛在 input 上的 class（讓既有選擇器如 .ms-chk 繼續命中）
 *   attrs     object  額外屬性，如 {'data-gi':3}。stateful 掛 input、重繪派掛外層
 *   wrapTag   string  stateful 外層標籤，預設 'label'。外層已經是 <button>
 *                     之類的互動元素時傳 'span'，避免巢狀 label 重複觸發
 *   interactive bool  重繪派專用。它自己是一個控制項、但 handler 是外部
 *                     addEventListener 綁的（不是 inline onclick）。會輸出
 *                     role/tabindex，鍵盤以 this.click() 合成點擊
 *   wrapCls   string  額外掛在外層 .checkbox 上的 class
 *   id        string  input id（配 <label for>）
 *   name      string  input name
 *   label     string  右側文字；省略則只有方框
 *   ariaLabel string  無可見文字時的無障礙名稱
 *   title     string  原生 title 提示（掛在外層）
 *   stop      bool    是否包 event.stopPropagation（預設 true）
 */
(function () {
  'use strict';

  /* ---- CSS（自我注入，載入即可用，不需各 prototype 複製）---- */
  var CSS = [
    '.checkbox{display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:0 0 auto;position:relative;vertical-align:middle}',
    '.checkbox.is-disabled{cursor:not-allowed}',
    /* 真 input 藏起來但保留在無障礙樹與 tab 序中。不用 display:none／visibility:hidden，
     * 那兩個會讓它拿不到焦點，:focus-visible 就沒有東西可以掛。 */
    '.checkbox input.checkbox__input{position:absolute;width:16px;height:16px;margin:0;opacity:0;cursor:inherit;z-index:1}',
    '.checkbox input.checkbox__input:disabled{cursor:not-allowed}',
    '.checkbox__box{display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px;width:16px;height:16px;border:1px solid var(--lt-color-primary,#004FB0);border-radius:2px;background:#fff;transition:border-color 150ms ease,background 150ms ease,box-shadow 200ms ease}',
    '.checkbox__icon{color:#fff;display:none;font-size:12px;line-height:1;font-variation-settings:\'FILL\' 1,\'wght\' 700,\'GRAD\' 0,\'opsz\' 20}',
    '.checkbox__label{font-size:14px;color:var(--lt-color-text-primary,#262626);user-select:none}',
    '.checkbox.is-disabled .checkbox__label{color:var(--lt-color-text-disabled,#B3B3B3)}',

    /* hover */
    '.checkbox:hover .checkbox__box{border-color:var(--lt-color-primary-hover,#0B6DD7)}',

    /* checked／mixed 的填色。左邊是 DOM 派（真 input），右邊是重繪派（class）。 */
    '.checkbox__input:checked~.checkbox__box,',
    '.checkbox__input:indeterminate~.checkbox__box,',
    '.checkbox.is-checked .checkbox__box,',
    '.checkbox.is-mixed .checkbox__box{background:var(--lt-color-primary,#004FB0);border-color:var(--lt-color-primary,#004FB0)}',

    /* icon 切換全部走 CSS，兩個 icon 都渲染出來、由狀態決定露哪一個，
     * 所以 DOM 派切換 input.checked 時不需要動 innerHTML。 */
    '.checkbox__input:checked~.checkbox__box .checkbox__icon--check,',
    '.checkbox.is-checked .checkbox__icon--check{display:inline-block}',
    '.checkbox__input:indeterminate~.checkbox__box .checkbox__icon--check,',
    '.checkbox.is-mixed .checkbox__icon--check{display:none}',
    '.checkbox__input:indeterminate~.checkbox__box .checkbox__icon--mixed,',
    '.checkbox.is-mixed .checkbox__icon--mixed{display:inline-block}',

    '.checkbox:hover .checkbox__input:indeterminate~.checkbox__box,',
    '.checkbox:hover.is-checked .checkbox__box,',
    '.checkbox:hover.is-mixed .checkbox__box{background:var(--lt-color-primary-hover,#0B6DD7);border-color:var(--lt-color-primary-hover,#0B6DD7)}',

    '.checkbox:focus-visible .checkbox__box{border-color:var(--lt-color-primary,#004FB0);box-shadow:0 0 0 3px rgba(0,79,176,.1);outline:none}',
    '.checkbox:focus-visible{outline:none}',

    '.checkbox__input:focus-visible~.checkbox__box,',
    '.checkbox:focus-visible .checkbox__box{outline:2px solid var(--lt-color-primary,#004FB0);outline-offset:2px}',

    /* disabled 最後宣告，蓋掉上面所有狀態 */
    '.checkbox__input:disabled~.checkbox__box,',
    '.checkbox.is-disabled .checkbox__box{border-color:var(--lt-grey-300,#CCCCCC);background:#fff;box-shadow:none}',
    '.checkbox__input:disabled:checked~.checkbox__box,',
    '.checkbox__input:disabled:indeterminate~.checkbox__box,',
    '.checkbox.is-disabled.is-checked .checkbox__box,',
    '.checkbox.is-disabled.is-mixed .checkbox__box{background:var(--lt-grey-300,#CCCCCC);border-color:var(--lt-grey-300,#CCCCCC)}'

  function injectCSS() {
    if (document.getElementById('lumi-checkbox-css')) return;
    var style = document.createElement('style');
    style.id = 'lumi-checkbox-css';
    style.textContent = CSS;
    (document.head || document.documentElement).appendChild(style);
  }
  injectCSS();   // documentElement 一定存在，不需要等 DOMContentLoaded

  function attr(name, val) {
    if (val === undefined || val === null || val === '') return '';
    return ' ' + name + '="' + String(val).replace(/"/g, '&quot;') + '"';
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var BOX =
    '<span class="checkbox__box">' +
      '<span class="material-symbols-outlined checkbox__icon checkbox__icon--check">check</span>' +
      '<span class="material-symbols-outlined checkbox__icon checkbox__icon--mixed">remove</span>' +
    '</span>';

  /* 額外屬性（data-* 之類）。stateful 掛在 input 上，因為既有的委派 handler
   * 都是從 input 讀 dataset；重繪派掛在外層 span 上，那裡才是可點擊的元素。 */
  function extraAttrs(o) {
    if (!o) return '';
    var out = '';
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) out += attr(k, o[k]);
    return out;
  }

  function html(opts) {
    opts = opts || {};
    var checked  = !!opts.checked;
    var mixed    = !!opts.mixed;
    var disabled = !!opts.disabled;
    var stop     = opts.stop !== false;

    /* stateful 模式刻意不輸出 is-checked／is-mixed：那兩個 class 是渲染當下的
     * 快照，caller 之後翻 input.checked 時不會跟著變，留著只會與真實狀態脫節。
     * 該模式的狀態一律由 input 屬性表達，CSS 已經吃 :checked／:indeterminate。 */
    var wrapCls = ['checkbox'];
    if (disabled) wrapCls.push('is-disabled');
    /* disabled 與 checked／mixed 是可疊加的，不是互斥的。基準版寫成三元互斥
     * （disabled ? 'is-disabled' : mixed ? ... : checked ? ...），結果
     * .is-disabled.is-checked 那條 CSS 永遠命中不了，disabled 的已選項目
     * 會畫成空白框。這裡改成疊加。 */
    if (!opts.stateful) {
      if (mixed) wrapCls.push('is-mixed');
      else if (checked) wrapCls.push('is-checked');
    }
    if (opts.wrapCls) wrapCls.push(opts.wrapCls);

    var labelHtml = opts.label
      ? '<span class="checkbox__label">' + esc(opts.label) + '</span>'
      : '';

    if (opts.stateful) {
      /* DOM 派。外層用 <label>，點文字也會切換，是原生行為不需要 handler。
       * mixed 在 HTML 沒有對應屬性，caller 照常設 input.indeterminate
       * （CSS 已經吃 :indeterminate）。要在首次渲染就是 mixed 的話，用
       * LumiCheckbox.set(el,{mixed:true}) 或直接 LumiCheckbox.input(el).indeterminate=true。 */
      var inputCls = 'checkbox__input' + (opts.cls ? ' ' + opts.cls : '');
      var oc = opts.onclick && stop
        ? 'event.stopPropagation();' + opts.onclick
        : opts.onclick;
      /* 預設外層是 <label>，點文字也會切換（原生行為，不用 handler）。
       * 但 <label> 不能巢狀在 <button> 裡（HTML 不合法，而且 label 會再轉發
       * 一次點擊、跟按鈕自己的 handler 打對台變成切了又切回去）。lumi-tag 的
       * .ms-item 就是按鈕包 checkbox，那種情況傳 wrapTag:'span'。 */
      var tag = opts.wrapTag || 'label';
      return '<' + tag + ' class="' + wrapCls.join(' ') + '"' + attr('title', opts.title) + '>' +
        '<input type="checkbox" class="' + inputCls + '"' +
          attr('id', opts.id) + attr('name', opts.name) + attr('value', opts.value) +
          (checked ? ' checked' : '') + (disabled ? ' disabled' : '') +
          attr('aria-label', opts.ariaLabel) + extraAttrs(opts.attrs) +
          attr('onclick', oc) + attr('onchange', opts.onchange) +

     * role/tabindex/keydown 補回原生 input 免費提供的鍵盤操作。 */
    var act = (disabled || !opts.onclick) ? ''
      : ((stop ? 'event.stopPropagation();' : '') + opts.onclick);

    /* 沒有自己的 onclick，代表點擊由外層（例如 .dropdown-item 整列）處理，
     * 這個 checkbox 只是那個控制項的視覺。這時候不能宣告 role="checkbox"
     * 也不能吃 tabindex：它不是控制項，掛上去只會多一個按不動的焦點站，
     * 而且螢幕閱讀器會聽到兩個 checkbox。改成 aria-hidden 交給外層負責語意。
     * 另外 act 空字串時絕對不能輸出 event.stopPropagation()，否則外層的
     * onclick 會被自己的視覺元素擋掉。 */
    if (!act && !disabled && !opts.interactive) {
      return '<span class="' + wrapCls.join(' ') + '" aria-hidden="true"' +
        attr('title', opts.title) + extraAttrs(opts.attrs) + '>' + BOX + labelHtml + '</span>';
    }

    /* 有 inline handler 就直接跑它；interactive 但 handler 是外部
     * addEventListener 綁的（cost-dashboard 幾個 dropdown 就是這樣），
     * 就用 this.click() 合成一次點擊，外部 listener 照樣會收到。 */
    var keydown = act
      ? "if(event.key===' '||event.key==='Enter'){event.preventDefault();" + act + '}'
      : "if(event.key===' '||event.key==='Enter'){event.preventDefault();this.click()}";
    return '<span class="' + wrapCls.join(' ') + '" role="checkbox"' +
      ' aria-checked="' + (mixed ? 'mixed' : checked) + '"' +
      ' aria-disabled="' + disabled + '"' +
      ' tabindex="' + (disabled ? -1 : 0) + '"' +
      attr('aria-label', opts.ariaLabel) + attr('title', opts.title) + extraAttrs(opts.attrs) +
      attr('onclick', act) + attr('onkeydown', keydown) +
    '>' + BOX + labelHtml + '</span>';
  }

  function el(opts) {
    var d = document.createElement('div');
    d.innerHTML = html(opts);
    return d.firstElementChild;
  }

  /* 兩種模式共用的狀態設定。stateful 走 input 屬性，重繪派走 class，
   * caller 不必知道自己拿到的是哪一種。 */
  function set(target, st) {
    var node = typeof target === 'string' ? document.querySelector(target) : target;
    if (!node) return null;
    var wrap = node.classList && node.classList.contains('checkbox')
      ? node : node.closest('.checkbox');
    var inp = input(node);
    st = st || {};
    if (inp) {
      if ('checked'  in st) inp.checked = !!st.checked;
      if ('mixed'    in st) inp.indeterminate = !!st.mixed;
      if ('disabled' in st) inp.disabled = !!st.disabled;
    } else if (wrap) {
      if ('mixed' in st || 'checked' in st) {
        wrap.classList.toggle('is-mixed', !!st.mixed);
        wrap.classList.toggle('is-checked', !st.mixed && !!st.checked);
        wrap.setAttribute('aria-checked', st.mixed ? 'mixed' : !!st.checked);
      }
    }
    if (wrap && 'disabled' in st) {
      wrap.classList.toggle('is-disabled', !!st.disabled);
      if (!inp) {
        wrap.setAttribute('aria-disabled', !!st.disabled);
        wrap.setAttribute('tabindex', st.disabled ? -1 : 0);
      }
    }
    return wrap;
  }

  function input(target) {
    var node = typeof target === 'string' ? document.querySelector(target) : target;
    if (!node) return null;
    if (node.tagName === 'INPUT') return node;
    return node.querySelector('.checkbox__input');
  }

  window.LumiCheckbox = { html: html, el: el, input: input, set: set, CSS: CSS };
})();

</script>

4.9419 25.1299H7.44297C7.70315 25.1299 7.87237 24.8561 7.75601 24.6234L6.45275 22.0168Z"/><path d="M25.0413 5.59998C29.6803 5.60019 33.4407 9.3613 33.4407 14.0004C33.4405 18.6392 29.6801 22.3996 25.0413 22.3998C20.4022 22.3998 16.6411 18.6394 16.6409 14.0004C16.6409 9.36117 20.4021 5.59998 25.0413 5.59998ZM25.0403 8.39978C24.0472 8.39988 23.1146 8.65916 22.3059 9.11267C23.4354 9.14717 24.3409 10.0716 24.3411 11.2094C24.3411 12.3691 23.4003 13.3099 22.2405 13.3099C21.105 13.3097 20.1818 12.4079 20.1438 11.2816C19.6961 12.0864 19.4408 13.0131 19.4407 13.9994C19.4407 17.092 21.9478 19.5997 25.0403 19.6C28.1331 19.6 30.6409 17.0922 30.6409 13.9994C30.6406 10.9069 28.1329 8.39978 25.0403 8.39978Z" fill="#FFF"/></svg>';

  // logo 連到 Overview（從 LUMITURE_NAV 拿 href）；在 Overview 頁本身不連自己，也就沒有 hover 變形
  function _homeHref() {
    var nav = window.LUMITURE_NAV || [];
    var home = nav.filter(function (e) { return e.type === 'item' && e.id === 'overview'; })[0];
    return home && home.href && !home.disabled && window.LUMITURE_ACTIVE !== 'overview' ? home.href : null;
  }
  function _logoBody(icon) {
    return '<div class="lt-sb-logo-wrap">' + icon + '</div>' +
      '<span class="lt-sb-logo-text">LumiTure.ai</span>' +
      '<span class="lt-sb-proto" data-tip="Prototype" data-tip-pos="below">PROTO<span class="lt-sb-proto-x">TYPE</span></span>';
  }
  function _renderLogo() {
    var href = _homeHref();
    var open = href ? '<a class="lt-sb-logo is-link" href="' + _esc(href) + '" data-tip="Go to Overview" data-tip-pos="below">' : '<div class="lt-sb-logo">';
    return open + _logoBody(LOGO_ICON) + (href ? '</a>' : '</div>');
  }
  // 收合時顯示在 topbar 左側的 logo（同一組圖形，mask id 改 ltT* 避免跟 sidebar 那份撞 id）
  function _renderTopbarLogo() {
    var href = _homeHref();
    var icon = LOGO_ICON.replace(/ltH(ring|bars|leg)/g, 'ltT$1');
    var open = href ? '<a class="lt-tb-logo is-link" href="' + _esc(href) + '" data-tip="Go to Overview" data-tip-pos="below">' : '<div class="lt-tb-logo">';
    return open + _logoBody(icon) + (href ? '</a>' : '</div>');
  }
  function _mountTopbarLogo(host) {
    host = host || document.getElementById('lt-topbar');
    if (!host) return;
    _injectCSS();
    var old = host.querySelector('.lt-tb-logo');
    if (old) old.parentNode.removeChild(old);
    host.insertAdjacentHTML('afterbegin', _renderTopbarLogo());
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function _renderItem(item, isSub) {
    var cls = isSub ? 'lt-sb-subitem' : 'lt-sb-item';
    var isActive = (item.id === window.LUMITURE_ACTIVE);
    var active = isActive ? ' lt-active' : '';
    var dis = item.disabled ? ' lt-dis' : '';
    // Active item: render as <div> (no self-link). Disabled item: also no href.
    var useHref = item.href && !isActive && !item.disabled;
    var tag = useHref ? 'a' : 'div';
    var hrefAttr = useHref ? ' href="' + _esc(item.href) + '"' : '';
    var dataId = ' data-nav-id="' + _esc(item.id) + '"';
    var curAttr = isActive ? ' aria-current="page"' : '';   // X-9r6 F16
    return '<' + tag + ' class="' + cls + active + dis + '"' + hrefAttr + dataId + curAttr + '>' +
             '<span class="material-symbols-outlined" aria-hidden="true">' + _esc(item.icon || 'circle') + '</span>' +
             '<span>' + _esc(item.label) + '</span>' +
           '</' + tag + '>';
  }

  function _renderGroup(grp) {
    var collapsed = grp.collapsed ? ' lt-collapsed' : '';
    var children = (grp.items || []).map(function (item) {
      return _renderItem(item, true);
    }).join('');
    return '<div class="lt-sb-group' + collapsed + '" data-group-id="' + _esc(grp.id) + '">' +
             '<button type="button" class="lt-sb-group-hdr" aria-expanded="' + (grp.collapsed ? 'false' : 'true') + '">' +
               '<span>' + _esc(grp.label) + '</span>' +
               '<span class="material-symbols-outlined lt-sb-group-arrow" aria-hidden="true">keyboard_arrow_up</span>' +
             '</button>' +
             '<div class="lt-sb-group-children">' + children + '</div>' +
           '</div>';
  }

  function _renderNav() {
    var nav = window.LUMITURE_NAV || [];
    var html = '<nav class="lt-sb-nav" aria-label="Main">';
    nav.forEach(function (entry) {
      if (entry.type === 'group') {
        html += _renderGroup(entry);
      } else {
        html += _renderItem(entry, false);
      }
    });
    html += '<div class="lt-sb-skel" aria-hidden="true">' + '<span class="lt-sb-skel-bar"></span>'.repeat(5) + '</div>';
    html += '</nav>';
    return html;
  }

  function _renderToggleBtn() {
    return '<button type="button" class="lt-sb-toggle" data-action="toggle-collapse">' +
             '<span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>' +
           '</button>';
  }

  // ===== 收合狀態（記住使用者前次設定）=====
  var STORE_KEY = 'lt-sidebar-collapsed', COLLAPSED_W = '21px';
  function _readStored() { try { return window.localStorage.getItem(STORE_KEY) === '1'; } catch (e) { return false; } }
  function _writeStored(on) { try { window.localStorage.setItem(STORE_KEY, on ? '1' : '0'); } catch (e) {} }
  var _collapsed = _readStored();

  // 套用到 <html>（class＋CSS 變數，給各頁的固定列／內容區位移用）與 sidebar 本身（class、inert、按鈕文字）
  function _applyCollapsed() {
    var root = document.documentElement;
    root.classList.toggle('lt-sb-collapsed', _collapsed);
    if (_collapsed) {
      root.style.setProperty('--lt-sb-w', COLLAPSED_W);
      root.style.setProperty('--sw', COLLAPSED_W);   // 舊頁面寫的 left:var(--sw)（固定底列）跟著動
    } else {
      root.style.removeProperty('--lt-sb-w');        // 還原成各頁／tokens 原本的展開值，展開狀態完全不變
      root.style.removeProperty('--sw');
    }
    var sb = document.getElementById('lt-sidebar');
    if (!sb) return;
    sb.classList.toggle('lt-collapsed', _collapsed);
    var clip = sb.querySelector('.lt-sb-clip');
    if (clip) { if (_collapsed) clip.setAttribute('inert', ''); else clip.removeAttribute('inert'); }
    var btn = sb.querySelector('.lt-sb-toggle');
    if (btn) {
      var label = _collapsed ? 'Expand sidebar' : 'Collapse sidebar';
      btn.setAttribute('aria-label', label); btn.removeAttribute('title');   // title 與 aria-label 同字會被部分輔助工具唸兩次
      btn.setAttribute('aria-controls', 'lt-sidebar');
      btn.setAttribute('aria-expanded', _collapsed ? 'false' : 'true');
      var ic = btn.querySelector('.material-symbols-outlined'); if (ic) ic.textContent = _collapsed ? 'chevron_right' : 'chevron_left';
    }
  }
  var _resizeTimer = null;
  function _setCollapsed(on, opts) {
    on = !!on;
    var changed = on !== _collapsed;
    _collapsed = on;
    if (opts && opts.persist) _writeStored(on);
    // 程式收合時若焦點在 nav 內，inert 會把焦點丟到 body；先移到收合後唯一可達的 sidebar 控制（Fable §12 #5）
    if (on && changed) {
      var sbEl = document.getElementById('lt-sidebar'), clipEl = sbEl && sbEl.querySelector('.lt-sb-clip'), tgl = sbEl && sbEl.querySelector('.lt-sb-toggle');
      if (clipEl && tgl && clipEl.contains(document.activeElement)) tgl.focus({ preventScroll: true });
    }
    _applyCollapsed();
    if (!changed) return;
    document.dispatchEvent(new CustomEvent('lt-sidebar-toggle', { detail: { collapsed: _collapsed } }));
    // 寬度轉場跑完後通知圖表重新量容器（ECharts 等）
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 230);
  }
  // 載入時先把記住的狀態套到 <html>（不等 DOM 建好），並在套用的那一刻關掉轉場，免得每換一頁都看到 250→21 的動畫
  function _bootCollapsed() {
    var root = document.documentElement;
    root.classList.add('lt-html-noanim');
    _applyCollapsed();
    requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove('lt-html-noanim'); }); });
  }

  // ===== Loading（#01-5）=====
  var _loading = false;
  function _applyLoading(mount) {
    mount = mount || document.getElementById('lt-sidebar');
    if (!mount) return;
    mount.classList.toggle('lt-loading', _loading);
    if (_loading) mount.setAttribute('aria-busy', 'true'); else mount.removeAttribute('aria-busy');
  }

  // ===== Mount =====
  function _render() {
    var mount = document.getElementById('lt-sidebar');
    if (!mount) {
      console.warn('[lumiture-sidebar] Mount point #lt-sidebar not found');
      return;
    }
    // If mount is not already a sidebar, wrap it
    mount.classList.add('lt-sidebar');
    mount.innerHTML = '<div class="lt-sb-clip"><div class="lt-sb-inner">' + _renderLogo() + _renderNav() + '</div></div>' + _renderToggleBtn();
    _applyLoading(mount);
    _applyCollapsed();
    _mountTopbarLogo();

    // Group toggle
    mount.querySelectorAll('.lt-sb-group-hdr').forEach(function (hdr) {
      hdr.addEventListener('click', function () {
        var grp = hdr.parentElement;
        if (grp) { grp.classList.toggle('lt-collapsed'); hdr.setAttribute('aria-expanded', grp.classList.contains('lt-collapsed') ? 'false' : 'true'); }
      });
    });
    // Collapse the whole sidebar
    var btn = mount.querySelector('[data-action="toggle-collapse"]');
    if (btn) {
      btn.addEventListener('click', function () {
        _setCollapsed(!_collapsed, { persist: true });   // 使用者自己按才記住
      });
    }
  }

  // ===== Public API =====
  window.LumitureSidebar = {
    toggleGroup: function (groupId) {
      var grp = document.querySelector('[data-group-id="' + groupId + '"]');
      if (grp) { grp.classList.toggle('lt-collapsed'); var h = grp.querySelector('.lt-sb-group-hdr'); if (h) h.setAttribute('aria-expanded', grp.classList.contains('lt-collapsed') ? 'false' : 'true'); }
    },
    toggleCollapse: function (opts) { _setCollapsed(!_collapsed, opts); },
    setCollapsed: function (on, opts) { _setCollapsed(on, opts); },
    isCollapsed: function () { return _collapsed; },
    restoreStored: function () { _setCollapsed(_readStored()); },   // Demo 情境重設用：回到「使用者前次設定」
    mountTopbarLogo: _mountTopbarLogo,
    setActive: function (itemId) {
      window.LUMITURE_ACTIVE = itemId;
      document.querySelectorAll('.lt-sb-item, .lt-sb-subitem').forEach(function (el) {
        el.classList.toggle('lt-active', el.dataset.navId === itemId);
        if (el.dataset.navId === itemId) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
      });
    },
    setLoading: function (on) { _loading = !!on; _applyLoading(); },
    isLoading: function () { return _loading; },
    rerender: _render,
  };

  // 頁面自己沒設 favicon 才補，分頁列一眼分得出 prototype 跟正式站
  function _injectFavicon() {
    if (document.querySelector('link[rel~="icon"]')) return;
    var l = document.createElement('link');
    l.rel = 'icon'; l.type = 'image/svg+xml';
    l.href = 'data:image/svg+xml,' + encodeURIComponent(FAVICON_SVG);
    document.head.appendChild(l);
  }

  // ===== INIT =====
  function _init() {
    _injectCSS();
    _injectFavicon();
    _render();
    // Dispatch resize so chart libraries (ECharts 等) 重新測量容器
    // —— 避免 inline script 已先 init chart 後，shared CSS 才 inject 導致 layout shift
    requestAnimationFrame(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }

  _injectCSS();      // 載入當下就先套上記住的收合狀態（<html> class＋變數），第一次繪製就是對的寬度
  _bootCollapsed();

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>

  function _injectCSS() {
    if (document.getElementById('lt-topbar-css')) return;
    var s = document.createElement('style');
    s.id = 'lt-topbar-css';
    s.textContent = CSS + ROLE_CSS;
    document.head.appendChild(s);
  }

  // ===== Helpers =====
  /* 角色 chip icon（A-3；稿 #01-4／#01-7、FE UserRoleChip ROLE_ICON_MAP）：Member account_circle、Manager supervised_user_circle、Admin／Owner admin_panel_settings。
     role 字串寫法：'Admin'／'Owner'／'Manager - Cost Center'／'Member - Finance-APAC'。topbar 上的頭像是使用者頭像（稿 #01 就是人像圓），不是角色 chip，不跟著換 */
  function _roleIcon(role) {
    var r = String(role || '');
    if (/^Member\b/i.test(r)) return 'account_circle';
    if (/^Manager\b/i.test(r)) return 'supervised_user_circle';
    return 'admin_panel_settings';
  }
  function _esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function _user() {
    var u = Object.assign({}, DEFAULT_USER, window.LUMITURE_USER || {});
    u.quota = Object.assign({}, DEFAULT_USER.quota, (window.LUMITURE_USER || {}).quota || {});
    return u;
  }
  function _status(used, total) {
    if (!total || total <= 0) return 'active';
    var pct = used / total * 100;
    if (pct >= 100) return 'depleted';
    if (pct >= 80)  return 'warning';
    return 'active';
  }
  function _planItems(plan) {
    return PLAN_QUOTA_ITEMS[plan] != null ? PLAN_QUOTA_ITEMS[plan] : PLAN_QUOTA_ITEMS.Standard;
  }
  function _showQuotaBox(u) {
    return _planItems(u.plan).length > 0;
  }

  // ===== Renderers =====
  function _renderIcon(item) {
    var attrs = ' class="lt-tb-ic" data-tip="' + _esc(item.title || '') + '" data-tip-pos="below" aria-label="' + _esc((item.title || '') + (item.badge ? ', 1 unread' : '')) + '"';   /* X-9r6 F17：紅點只有 CSS，讀屏要有字（aria-label 會蓋掉內部文字，所以未讀訊息寫進 label） */   /* 原生 title 改 data-tip（#gl-tip） */
    if (item.onclick) attrs += ' onclick="' + _esc(item.onclick) + '"';
    var badge = item.badge ? '<span class="lt-tb-badge"></span>' : '';
    return '<button type="button"' + attrs + '>' +
             '<span class="material-symbols-outlined" aria-hidden="true">' + _esc(item.icon) + '</span>' + badge +
           '</button>';
  }

  function _renderUserChip(u) {
    return '<button type="button" class="lt-tb-user" id="lt-tb-user" aria-haspopup="true" aria-expanded="false">' +
             '<span class="material-symbols-outlined lt-tb-avatar-ic" aria-hidden="true">account_circle</span>' +
             '<div class="lt-tb-user-text">' +
               '<span class="lt-tb-user-name">' + _esc(u.name) + '</span>' +
               '<span class="lt-tb-user-role" id="lt-tb-user-role">' + _esc(u.role) + '</span>' +
             '</div>' +
             '<span class="material-symbols-outlined lt-tb-chev" aria-hidden="true">keyboard_arrow_down</span>' +
           '</button>';
  }

  function _renderQuotaItem(key, q) {
    var meta = QUOTA_META[key];
    var used = q.used || 0, total = q.total || 0;
    var remaining = Math.max(0, total - used);
    var st = _status(used, total);
    // Warning / Depleted 才有 hover tooltip 說明（取代原本點開的 Limit Reached 對話框；
    // PM 確認無法提供 per-user 業務 email，故改輕量懸停說明，無 Contact Sales 動作）
    // 文案含變數 {total} {unit} {label}；{label}=Cost Dashboard / Usage Optimization
    var tip = '';
    if (st === 'depleted' || st === 'warning') {
      var verb = st === 'depleted' ? 'has been reached' : 'is approaching';
      var tipText = 'Your monthly limit (' + total.toLocaleString() + ' ' + meta.unit + ') ' + verb +
        ' for ' + meta.dialogLabel + '. Please contact your LumiTure.ai representative to purchase ' +
        'Add-ons to increase your quota for this billing cycle.';
      tip = '<span class="lt-q-tip">' + _esc(tipText) + '</span>';
    }
    var hasTip = tip !== '';
    return '<div class="lt-q-item is-' + st + (hasTip ? ' has-tip' : '') + '"' + (hasTip ? ' tabindex="0" role="menuitem" aria-disabled="true"' : '') + '>' +
             '<span class="lt-q-dot"></span>' +
             '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
             '<span class="lt-q-val">' + remaining.toLocaleString() + ' / ' + total.toLocaleString() + ' left</span>' +
             tip +
           '</div>';
  }

  function _renderQuotaBox(u) {
    var isPremium = u.plan === 'Premium';
    var items = _planItems(u.plan);
    if (!items.length) return '';   // 無有效 plan：不顯示（理論上不會發生）
    // Premium（稿 #01-4）：header 只寫 Org-wide，不接 refresh 日；數字照一般方案
    var sub = isPremium ? 'Org-wide' : 'Org-wide, refresh on ' + _esc(u.quota.refreshDate);
    var head = '<div class="lt-q-head">' +
                 '<span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-sub">' + sub + '</span>' +
               '</div>';
    // loading（#01-7）：refresh 日也尚未載入 → 右上一條 skeleton；下面兩條滿寬；整塊 min-height 113（跟有資料時同高）
    if (u.quota.state === 'loading') {
      return '<div class="lt-q is-loading" aria-busy="true" aria-label="Loading AI Quota">' +
               '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-skel lt-q-skel-sub"></span></div>' +
               '<div class="lt-q-skel lt-q-skel-row"></div><div class="lt-q-skel lt-q-skel-row"></div>' +
             '</div>';
    }
    // error（#01-7 partial degrade：只有這塊壞，menu 其他項照常）；refresh 日未載入 → sub 只顯示 Org-wide；Retry 右對齊、青色粗體底線
    if (u.quota.state === 'error') {
      var headErr = '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span><span class="lt-q-sub">Org-wide</span></div>';
      return '<div class="lt-q">' + headErr +
               '<div class="lt-q-err"><span class="material-symbols-outlined" aria-hidden="true">help</span>' +
               '<span class="lt-q-err-msg">Couldn\'t load quota</span>' +
               '<a role="menuitem" tabindex="0" onclick="window.LumitureTopbar._retryQuota()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();window.LumitureTopbar._retryQuota()}">Retry</a></div>' +
             '</div>';
    }
    var rows = items.map(function (k) { return _renderQuotaItem(k, u.quota[k] || {}); }).join('');
    // add-on 行（packs>0，Premium 不適用）；naming 對齊 PRD：單數 "AI Quota Add-on × N"
    var addon = (!isPremium && (u.addonPacks || 0) > 0)
      ? '<div class="lt-q-addon"><span class="material-symbols-outlined" aria-hidden="true">auto_awesome</span>' +
          u.addonPacks + ' × AI Quota Add-ons Activated</div>'
      : '';
    return '<div class="lt-q">' + head + rows + addon + '</div>';
  }

  function _renderMenu(u) {
    var planName = _esc(u.plan) + ' Plan';
    var bannerStyle = PLAN_BANNER[u.plan] || PLAN_BANNER.Standard;
    var viewAs = u.canSwitchRole
      ? '<div class="lt-am-grp">' +
          '<button type="button" role="menuitem" class="lt-am-item" onclick="window.LumitureTopbar.openRoleDialog()">' +
            '<span class="material-symbols-outlined" aria-hidden="true">sync_alt</span>View as Another Role</button></div>' +
        '<div class="lt-am-div"></div>'
      : '';
    var box = _renderQuotaBox(u);
    return '<div class="lt-am-backdrop" id="lt-am-backdrop" onclick="window.LumitureTopbar.closeMenu()"></div>' +
           '<div class="lt-am" id="lt-am" role="menu" aria-label="Account menu">' +
             '<div class="lt-am-plan" style="' + bannerStyle + '">' +
               '<span class="lt-am-plan-name">' + planName + '</span>' +
               '<span class="lt-am-plan-date">' + _esc(u.planDateRange) + '</span>' +
             '</div>' +
             '<div class="lt-am-id">' +

 * 表格的 Folder 欄跟彈窗搜尋結果都走這一支，所以同一個資料夾在兩個地方寫法一定一樣 */
function hierDisplayParts(node, cloud, q){
  const full = folderColumnSegmentsFull(node, cloud);
  const last = full.length - 1;
  const {root, ancestors} = folderColumnParts(node, cloud);
  const show = new Set([last]);
  if(root) show.add(0);
  for(let i = last - ancestors.length; i < last; i++) show.add(i);
  if(q) full.forEach((seg, i)=>{ if(seg.toLowerCase().includes(q)) show.add(i); });
  const idx = [...show].sort((a,b)=>a-b);
  const parts = [];
  idx.forEach((i, n)=>{ if(n > 0 && i - idx[n-1] > 1) parts.push('…'); if(i !== last) parts.push(hlq(full[i], q)); });
  return {parts, own: hlq(full[last], q)};
}
function folderColumnHtml(node, cloud, q){
  const {parts, own} = hierDisplayParts(node, cloud, q);
  /* 最後那個「 / 」放在名稱那段、不放在路徑那段：路徑被截時才會是「fraud-revie… / archive」，
   * 而不是分隔符跟著被截掉、黏成「fraud-revie…archive」 */
  const lead = parts.join(' / ');
  return `<span class="fcell">${lead?`<span class="fpath">${lead}</span>`:''}<span class="fown">${lead?'<span class="fpath">\u00a0/\u00a0</span>':''}${own}</span></span>`;
}
/* Folder 欄 tooltip：hover 與鍵盤 focus 都會出現（原生 title 只有 hover、而且排版不了）。
 * 每一行替它的每個上層畫一條線，位置 = 那一層文字起點往左 10px，跟彈窗的線
 * 「對齊上層箭頭中心」是同一個邏輯，只是 tooltip 裡沒有箭頭，改對齊文字起點前的空位。 */
/* 多 org 時第一行是 org（domain icon＋名稱），對應彈窗裡的 org 區段標頭：
 * 它是區段不是樹的一層，所以資料夾不因為它多縮一層，跟彈窗一樣 */
function fpathTipHtml(segs, org){
  const head = org ? `<div class="fptip-org"><span aria-hidden="true" class="material-symbols-outlined">domain</span>${esc(org)}</div>` : '';
  return head + segs.map((seg, level)=>{

    for(let l=0; l<level; l++) rails += `<span class="fptip-rail" style="left:${l*16 + 5}px"></span>`;
    return `<div class="fptip-row${level===segs.length-1?' is-self':''}" style="padding-left:${level*16}px">${rails}${esc(seg)}</div>`;

function showFpathTip(cell){
  hideFpathTip();
  const segs = (cell.getAttribute('data-fpath') || '').split('\n').filter(Boolean);
  if(!segs.length) return;
  const tip = document.createElement('div');
  tip.className = 'fptip'; tip.id = 'fptip'; tip.setAttribute('role','tooltip');
  tip.innerHTML = fpathTipHtml(segs, cell.getAttribute('data-forg'));
  document.body.appendChild(tip);
  const r = cell.getBoundingClientRect(), t = tip.getBoundingClientRect();
  let top = r.bottom + 4;
  if(top + t.height > window.innerHeight - 8) top = r.top - t.height - 4;   // 下面放不下就翻到上面
  const left = Math.min(r.left + 8, window.innerWidth - t.width - 8);
  tip.style.top = top + 'px'; tip.style.left = Math.max(8, left) + 'px';

document.addEventListener('focusout', e=>{ if(e.target.closest && e.target.closest('td.has-fptip')) hideFpathTip(); });

/* 排序與搜尋用的純文字版（排序拿 HTML 去比會把標籤也比進去） */
function folderColumnText(node, cloud){
  const {prefix, own} = folderColumnSegments(node, cloud);
  return prefix.concat(own).join(' / ');
}
function folderColumnSegmentsFull(node, cloud){
  return (hierIndex(cloud).paths.get(node.id) || []).concat(node.name);
}
function folderColumnFullPath(node, cloud){
