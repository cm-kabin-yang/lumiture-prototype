  settings: { detection: true, sensitivity: 'High', notif: { admin: true, t1Manager: true, t1Member: true, t2Manager: true, t2Member: true } },
  draft: null,               // Alert Settings 彈窗的暫存草稿（按 Save 前 live state 不動，同 Rate Optimization Data Sources 的做法）
  failNext: false,           // Demo：下一次 Save 回失敗
};
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);

/* ============================================================
 * 3. Helpers
 * ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const MON = ['Jan.', 'Feb.', 'Mar.', 'Apr.', 'May.', 'Jun.', 'Jul.', 'Aug.', 'Sep.', 'Oct.', 'Nov.', 'Dec.'];
const fmtDMY = d => d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();   // Figma：4 Jan. 2036
const fmtMoney = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dateOf = off => new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - off);
const role = () => ROLES[state.role];

/* Assigned to：字母升冪、逗號隔開；沒有子群組 → '--'。T2 整欄不顯示（見 hideAssigned()）*/
function groupsOf(it) { return role().tier === 2 ? [] : it.groups.slice().sort((a, b) => a.localeCompare(b)); }
function assignedTip(gs) {
  if (!gs.length) return COPY.dashTip;
  if (gs.length === 1) return gs[0];                                            // 只有 1 筆時不需顯示項目符號
  const shown = gs.slice(0, MAX_TIP_GROUPS).map(g => '• ' + g);
  if (gs.length > MAX_TIP_GROUPS) shown.push('...+' + (gs.length - MAX_TIP_GROUPS) + ' more, view full list in detail page.');
  return shown.join('\n');
}
/* 非 Admin 只看得到自己有權限的資源告警（#01-7）。⚠ 設計端暫擬：Figma 沒定義 mock 範圍，T1 看前 11 組、T2 看前 7 組（含被釘選的過期項目要看得到者，保留 r15）*/
function visibleParents() {
  const t = role().tier, lim = t === 0 ? 99 : t === 1 ? 11 : 7;
  return state.items.filter(it => it.idx < lim || it.old && t < 2);
}
function allVisible() { return visibleParents().filter(it => !it.old); }          // All 視角：最近 30 天
function pinnedFlat() {                                                              // Pinned 視角：遞迴撈出所有已釘選、清空 children 攤平，依時間新→舊
  const out = [];
  visibleParents().forEach(it => { if (it.pin) out.push(it); it.children.forEach(c => { if (c.pin) out.push(c); }); });
  return out.sort((a, b) => a.off - b.off);
}
function findItem(id) {
  for (const it of state.items) { if (it.id === id) return it; for (const c of it.children) if (c.id === id) return c; }
  return null;
}

function rowHtml(it, kind) {

  }).join('');
  /* 「欄位無法點擊，因此 Hover 無效果；字串內容大於可顯示範圍時以 … 替代，Hovering 顯示完整內容」＋ #02-2：Hover 不論內容長短一律顯示 Tooltips（與前端約定）*/
  const body = rows.map(r => `<div class="tr" role="row">${cols.map(c => { const v = dCell(c[0], r), sl = c[0] in sticky; return `<div class="td ${c[4] ? 'r' : ''} ${sl ? 'sl' + (c[0] === 'sku' ? ' sl3' : '') : ''}" role="cell" ${sl ? `style="left:${sticky[c[0]]}"` : ''} data-tip="${esc(v)}" data-tip-anchor=".ell" data-tip-gap="4"><span class="ell">${esc(v)}</span></div>`; }).join('')}</div>`).join('');
  return `<div class="tbl-scroll c-${D.cloud}" id="${shot ? 'shot-tbl' : 'd-tbl'}" role="table" aria-label="Top 10 services 36-hour cost breakdown" style="--cols:${tpl};--minw:${minw}px"><div class="tr th-row" role="row">${th}</div><div class="tbody" role="rowgroup">${body}</div></div>`;
}

/* ---------- ECharts ---------- */
let CHARTS = [];
function disposeCharts() { CHARTS.forEach(c => { try { c.ro.disconnect(); c.ch.dispose(); } catch (e) { } }); CHARTS = []; }
/* Fable §5 #4：Y 軸上限依「目前看得到的系列」算（點掉圖例後重算，同 ECharts／Dashboard 預設行為）*/
function yStep(D, shot) { let m = 0; D.series.forEach(s => { if (shot || !state.dHidden.has(s.name)) s.data.forEach(v => { if (v != null && v > m) m = v; }); }); return niceStep((m || D.max) / 5); }
function mkChart(el, D, shot) {
  if (typeof echarts === 'undefined') { el.innerHTML = '<div class="es"><div class="es-desc">ECharts failed to load.</div></div>'; return; }
  const ch = echarts.init(el), step = yStep(D, shot), labels = D.times.map(fmtAx);
  const sel = {}; D.series.forEach(s => { sel[s.name] = shot || !state.dHidden.has(s.name); });
  ch.setOption({
    animation: false,
    grid: { left: 68, right: 30, top: 17, bottom: 45 },   /* ⚠ DEVIATION: 稿上折線畫到卡片右緣、X 軸標籤自己平均分布（第一個在軸右 38、最後一個離右緣 34，跟資料點對不上）。實作讓標籤對準資料點（boundaryGap false），最後一個標籤（2 Jan. 00:00）置中在最後一點，右側留 30 才不會被裁掉。
     對稿修正：折線起點貼齊 Y 軸（boundaryGap false）、0 軸實線 #B3B3B3、折線圓滑（稿的 path 帶 r20 轉角）*/
    legend: { show: false, data: D.series.map(s => s.name), selected: sel },
    tooltip: shot ? { show: false } : {
      trigger: 'axis', axisPointer: { type: 'line', lineStyle: { color: '#CCCCCC', width: 1, type: 'solid' } },
      backgroundColor: '#FFFFFF', borderColor: '#FFFFFF', borderWidth: 1, padding: 8, confine: false,
      textStyle: { color: '#262626', fontFamily: 'Noto Sans', fontSize: 12 },
      extraCssText: 'box-shadow:0 0 6px rgba(0,0,0,.2);border-radius:5px;max-width:600px;',
      /* 對稿修正（#02-2）：tooltip 在指示線右側 8、上緣固定在圖表頂端上方 9（不跟著游標上下跑）；右邊放不下才翻到左側 */
      position: (pt, p, dom, rect, size) => { let x = pt[0] + 8; if (x + size.contentSize[0] > size.viewSize[0]) x = pt[0] - size.contentSize[0] - 8; return [x, -9]; },
      formatter: ps => {
        const items = ps.filter(p => p.value != null && p.value !== '-').sort((a, b) => (a.seriesName === 'Others') - (b.seriesName === 'Others') || b.value - a.value);
        const i = ps[0].dataIndex;
        return `<div class="ct"><div class="ct-t">${fmtTip(D.times[i])}</div>${items.map(p => `<div class="ct-r"><i style="background:${p.color}"></i><span class="n">${esc(p.seriesName)}</span><span class="v">$${fmtMoney(p.value)}</span></div>`).join('')}</div>`;
      }
    },
    xAxis: { type: 'category', data: labels, boundaryGap: false, axisLine: { lineStyle: { color: '#B3B3B3' } }, axisTick: { show: false }, axisLabel: { interval: 7, color: '#262626', fontSize: 12, lineHeight: 18, margin: 9, fontFamily: 'Noto Sans', hideOverlap: false } },
    yAxis: { type: 'value', min: 0, max: step * 5, interval: step, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#262626', fontSize: 12, fontFamily: 'Noto Sans', margin: 8, formatter: v => fmtAxis(v, step) }, splitLine: { lineStyle: { color: '#CCCCCC', type: [5, 5] } } },
    series: D.series.map(s => ({ name: s.name, type: 'line', data: s.data, connectNulls: false, showSymbol: false, smooth: 0.3, smoothMonotone: 'x', symbol: 'circle', symbolSize: 8, lineStyle: { width: 1.5, color: s.color }, itemStyle: { color: s.color, borderColor: '#FFFFFF', borderWidth: 2 },   /* #02-2 Marker：8 圓點＋白框 2 */ emphasis: { focus: 'series', lineStyle: { width: 1.5 } }, blur: { lineStyle: { opacity: .25 } } }))
  });
  const ro = new ResizeObserver(() => ch.resize()); ro.observe(el);
  CHARTS.push({ ch, ro, el, shot });
}
function initCharts(it) {
  const D = genDetail(it);
  document.querySelectorAll('.js-chart').forEach(el => mkChart(el, D, el.dataset.shot === '1'));
}
function liveChart() { const c = CHARTS.find(x => !x.shot); return c && c.ch; }

function renderDetail() {
  disposeCharts();

  if (ps !== 'loading' && state.pageState === 'no-auth') ps = 'no-auth';        // 沿用列表的規則：沒有授權資源就是 No Authorization

function fitShot() { const cv = $('#shot-canvas'); if (!cv) return; const z = Math.min(1, ($('.shot-scroll').clientWidth) / 2026); cv.style.zoom = z; }
window.addEventListener('resize', fitShot);

function renderRoute() { if (state.route === 'list') renderList(); else { renderDetail(); renderShot(); } }
function setHash(h) { if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h); }
function enterDetail(id, opts) {
  opts = opts || {};
  closeModal();
  if (state.detailId !== id) { state.dTree = false; state.dHidden = new Set(); state.dSort = { k: 'time', dir: -1 }; }
  state.detailId = id; state.route = opts.shot ? 'screenshot' : 'detail'; _listShown = true;
  if (opts.dPage) state.dPage = opts.dPage;
  if (!opts.noSkel && (state.dPage === 'set' || !opts.dPage) && findItem(id)) {          // 進頁固定跑一次 skeleton（全站慣例，650ms）
    state.dPage = 'loading'; renderRoute();
    setTimeout(() => { if (state.dPage === 'loading' && state.detailId === id) { state.dPage = 'set'; renderRoute(); if (opts.after) opts.after(); } }, 650);
  } else { if (!opts.dPage) state.dPage = 'set'; renderRoute(); if (opts.after) setTimeout(opts.after, 60); }
  window.scrollTo(0, 0);
}
function routeFromHash() {
  const h = (location.hash || '').replace('#', '');
  let m;
  if ((m = h.match(/^detail\/(.+)$/))) {
    const id = decodeURIComponent(m[1]);
    if (state.route === 'screenshot' && state.detailId === id) { state.route = 'detail'; renderShot(); return true; }   // 從 Screenshot 預覽關閉：回到同一頁，不重跑 skeleton
    enterDetail(id); return true;
  }
  if ((m = h.match(/^screenshot(?:\/(.+))?$/))) { enterDetail(m[1] ? decodeURIComponent(m[1]) : state.detailId, { shot: true, dPage: 'set', noSkel: true }); return true; }
  return false;
}
window.addEventListener('hashchange', () => { if (!routeFromHash() && state.route !== 'list') showList({ noSkel: true }); });

function downloadCsv() {
  const it = findItem(state.detailId); if (!it) return;
  const D = genDetail(it), cols = DCOLS[D.cloud], q = v => { const t = String(v == null ? '' : v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const head = cols.map(c => c[1]);
  const body = sortRows(D).map(r => cols.map(c => c[0] === 'time' ? fmtCT(r.ts) : (['cost', 'price', 'amt'].includes(c[0]) ? r[c[0]].toFixed(2) : r[c[0]])).map(q).join(','));
  const csv = '﻿' + [head.map(q).join(',')].concat(body).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = 'anomaly-' + it.rid + '-' + fmtDMYs(dateOf(it.off)).replace(/\//g, '-') + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

Object.assign(ACT, {
  'detail': (el, e) => { e.stopPropagation(); location.hash = '#detail/' + encodeURIComponent(el.dataset.id); },
  'd-back': () => { location.hash = ''; },
  'd-tree': () => { state.dTree = !state.dTree; renderDetail(); const r = $('.gt-row.can'); r && r.focus(); },
  'd-sort': el => { const k = el.dataset.k, s = state.dSort; state.dSort = s.k === k ? { k, dir: -s.dir } : { k, dir: 1 }; const sc = $('#d-tbl'), sl = sc ? sc.scrollLeft : 0; renderDetail(); const n = $('#d-tbl'); if (n) { n.scrollLeft = sl; n.classList.toggle('is-scrolled', sl > 0); } const f = document.querySelector('.th[data-k="' + k + '"]'); f && f.focus(); },
  'd-lg': el => {
    const n = el.dataset.n, ch = liveChart(); state.dHidden.has(n) ? state.dHidden.delete(n) : state.dHidden.add(n);
    el.classList.toggle('off', state.dHidden.has(n)); el.setAttribute('aria-pressed', String(!state.dHidden.has(n)));
    ch && ch.dispatchAction({ type: 'legendToggleSelect', name: n });
    if (ch) { const st = yStep(genDetail(findItem(state.detailId)), false); ch.setOption({ yAxis: { max: st * 5, interval: st, axisLabel: { formatter: v => fmtAxis(v, st) } } }); }
  },
  'd-csv': () => downloadCsv(),
  /* ⚠ 設計端暫擬：View 1-Month Cost Trend 真產品帶參數（Anomaly 前一個月、Group by SKU、Filter 該 Project／Account）；Cost Dashboard prototype 沒有接這些參數，所以開頁＋toast 說明 */
  'd-trend': () => { toast('info', DCOPY.trendToast); window.open('./cost-dashboard.html', '_blank', 'noopener'); },
  'd-shot': () => { toast('info', DCOPY.shotToast); location.hash = '#screenshot/' + encodeURIComponent(state.detailId); },
  'shot-close': () => { location.hash = '#detail/' + encodeURIComponent(state.detailId); },
  'shot-print': () => window.print()
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.gb,.gt-row.can,.th.sortable')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && state.route === 'screenshot') ACT['shot-close']();
});
/* 圖例 hover：對應 series 強化、其他變淡（Guideline「Legend 行為」）*/
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('.lg-i'); const ch = liveChart(); if (el && ch && !el.closest('.is-static') && !el.classList.contains('off')) ch.dispatchAction({ type: 'highlight', seriesName: el.dataset.n }); });
document.addEventListener('mouseout', e => { const el = e.target.closest && e.target.closest('.lg-i'); const ch = liveChart(); if (el && ch && !el.closest('.is-static')) ch.dispatchAction({ type: 'downplay', seriesName: el.dataset.n }); });
</script>

window.DEMO_DEFAULT = 'set';

function setRole(id) { state.role = id; if (window.LumitureTopbar) LumitureTopbar.setRole(ROLES[id].chip); }
let _listShown = false;
function showList(opts) {
  closeModal(); opts = opts || {};
  if (state.route !== 'list') { state.route = 'list'; disposeCharts(); renderShot(); if (/^#(detail|screenshot)/.test(location.hash)) setHash(''); }
  const first = !_listShown; _listShown = true;
  if (first && state.pageState === 'set' && !opts.noSkel) {   // Kabin 偏好：切進「有資料」畫面前故意跑一次 skeleton
    state.pageState = 'loading'; renderList();
    setTimeout(() => { if (state.pageState === 'loading') { state.pageState = 'set'; renderList(); } }, 650);
  } else renderList();
  window.scrollTo(0, 0);
}
function setPageState(id) { state.pageState = id; _listShown = true; showList(); }
function resetData() { state.items = buildItems(); state.expanded = new Set(); state.view = 'all'; }
/* 用合成 mouse 事件觸發 #gl-tip（Demo 用，讓靜態畫面也看得到懸停態）*/
function simHover(sel) {
  const el = document.querySelector(sel); if (!el) return;
  el.scrollIntoView({ block: 'center', inline: 'nearest' });
  const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const init = { bubbles: true, clientX: x, clientY: y };
  el.dispatchEvent(new MouseEvent('mouseover', init)); el.dispatchEvent(new MouseEvent('mousemove', init));
}
const later = fn => setTimeout(fn, 80);

/* ---- Detail 情境（v2）---- */
function setSidebarCollapsed(on) { const s = document.querySelector('.lt-sidebar'); if (s && s.classList.contains('lt-collapsed') !== on && window.LumitureSidebar) LumitureSidebar.toggleCollapse(); }
function applyDetail(id) {
  /* Fable §5 #1（🔴）：原本 dt-role-* 只是「不重設成 admin」，從來沒切到 T1／T2，畫面還是 Admin 的樹 */
  setRole(id === 'dt-role-t1' ? 't1m' : id === 'dt-role-t2' ? 't2m' : 'admin');
  state.pageState = id === 'dt-noauth' ? 'no-auth' : 'set';
  if (id === 'dt-collapsed') setSidebarCollapsed(true); else if (window.LumitureSidebar) LumitureSidebar.restoreStored();   /* 非收合情境回到使用者記住的狀態，不強制展開（Fable §12 #6） */
  if (id !== 'dt-parked-off') state.showParked = true;
  const go = (rid, o) => { enterDetail(rid, Object.assign({ noSkel: true, dPage: 'set' }, o || {})); if (!(o && o.shot)) setHash('#detail/' + rid); else setHash('#screenshot/' + rid); };
  const R1 = 'r1';
  if (id === 'dt-gcp' || id === 'dt-collapsed') return go(R1);
  if (id === 'dt-expand') { state.dTree = true; return go(R1, { after: () => simHover('.gt-kids .gt-n.ch:first-child .gt-tx') }); }
  if (id === 'dt-aws') return go('r13');
  if (id === 'dt-azure') return go('r6');   // 對稿修正：#07 有 Assigned to 群組（r14 是沒有群組的 org 層級資源，見 dt-org）
  if (id === 'dt-org') return go('r14');
  if (id === 'dt-sort-cost') { state.detailId = R1; state.dSort = { k: 'cost', dir: -1 }; enterDetail(R1, { noSkel: true, dPage: 'set' }); state.dSort = { k: 'cost', dir: -1 }; renderRoute(); setHash('#detail/' + R1); return; }
  if (id === 'dt-h-shot') return go(R1, { after: () => simHover('[data-a="d-shot"]') });
  if (id === 'dt-h-info') return go(R1, { after: () => simHover('.sec-t .info') });
  if (id === 'dt-h-chart') return go(R1, { after: () => setTimeout(() => { const ch = liveChart(); ch && ch.dispatchAction({ type: 'showTip', seriesIndex: 0, dataIndex: 39 }); }, 150) });
  if (id === 'dt-h-cell') return go(R1, { after: () => simHover('.td[data-tip^="Security Command"]') });
  if (id === 'dt-loading') return go(R1, { dPage: 'loading' });
  if (id === 'dt-empty') return go(R1, { dPage: 'empty' });
  if (id === 'dt-error') return go(R1, { dPage: 'error' });
  if (id === 'dt-noauth') return go(R1);
  if (id === 'dt-role-t1' || id === 'dt-role-t2') { state.dTree = true; return go(R1); }
  if (id === 'dt-shot') return go(R1, { shot: true });
  if (id === 'dt-shot-aws') return go('r13', { shot: true });
  if (id === 'dt-parked-on' || id === 'dt-parked-off') { state.showParked = id === 'dt-parked-on'; return go(state.route === 'list' ? R1 : state.detailId, { dPage: 'set' }); }
  if (id === 'dt-csv') { go(R1); setTimeout(() => downloadCsv(), 120); return; }
  if (id === 'dt-trend') { go(R1); toast('info', DCOPY.trendToast); return; }
}

/* 看通知信（Notification Emails 接回流程）：用 <a target=_blank> 開新分頁到對應信件（不取代目前頁面，Demo 狀態不會丟；也避免自動掃情境時被導走）。路徑與 hash 見 notification-emails-prototype-v1.html */
function openNotificationEmail(hash) { const a = document.createElement('a'); a.href = './notification-emails.html' + hash; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
window.DEMO_APPLY = function (id) {
  closePop(); closeModal();
  const tip = document.getElementById('gl-tip'); if (tip) tip.style.display = 'none';
  if (id === 'view-email') return openNotificationEmail('#anomaly');
  if (ROLES[id]) { setRole(id); if (state.pageState === 'set') state.pageState = 'set'; renderRoute(); return; }
  if (['set', 'loading', 'empty', 'no-auth', 'error'].includes(id)) { if (id === 'set') { resetData(); state.settings.detection = true; } setPageState(id); return; }
  if (id === 'no-auth-na') { setRole('t1m'); setPageState('no-auth'); return; }
  if (id === 'det-off') { state.pageState = 'set'; state.settings.detection = false; showList({ noSkel: true }); return; }
  if (id === 'det-on') { state.pageState = 'set'; state.settings.detection = true; state.settings.sensitivity = 'High'; showList({ noSkel: true }); return; }

  if (id.startsWith('dt-')) return applyDetail(id);

  /* ---- View ---- */
  state.pageState = 'set'; _listShown = true;
  if (id === 'v-all') { resetData(); showList({ noSkel: true }); return; }
  if (id === 'v-pinned') { resetData(); state.view = 'pinned'; showList({ noSkel: true }); return; }
  if (id === 'v-pinned-empty') { resetData(); state.items.forEach(it => { it.pin = false; it.children.forEach(c => { c.pin = false; }); }); state.items = state.items.filter(it => !it.old); state.view = 'pinned'; showList({ noSkel: true }); return; }
  if (id === 'v-expand') { resetData(); state.expanded.add('r1'); showList({ noSkel: true }); return; }
  if (id === 'v-expand-many') { resetData(); ['r1', 'r3', 'r7'].forEach(x => state.expanded.add(x)); showList({ noSkel: true }); return; }
  if (id === 'v-t2') { resetData(); setRole('t2m'); showList({ noSkel: true }); return; }
  if (id === 'h-assigned-info') { resetData(); showList({ noSkel: true }); later(() => simHover('#assigned-info')); return; }
  if (id === 'h-assigned-list') { resetData(); showList({ noSkel: true }); later(() => simHover('.tr[data-rid="r8"] .td[data-tip]:not(.res)')); return; }
  if (id === 'h-assigned-dash') { resetData(); showList({ noSkel: true }); later(() => simHover('.tr[data-rid="r2"] .td[data-tip]:not(.res)')); return; }
  if (id === 'h-pin') { resetData(); showList({ noSkel: true }); later(() => simHover('.tr[data-rid="r3"] .ib.pin')); return; }
  if (id === 'h-name') { resetData(); showList({ noSkel: true }); later(() => simHover('.tr[data-rid="r7"] .td.res')); return; }
  if (id === 'h-detail') { resetData(); showList({ noSkel: true }); later(() => simHover('.tr[data-rid="r2"] .ib[data-a="detail"]')); return; }
  if (id === 'd-detail') { resetData(); showList({ noSkel: true }); later(() => { const b = document.querySelector('.ib[data-a="detail"]'); b && b.click(); }); return; }

  /* ---- Settings ---- */
  if (id === 's-fail') { state.failNext = !state.failNext; toast('info', state.failNext ? 'The next Save will fail.' : 'Save will succeed again.'); return; }
  if (id === 't-ok') return toast('ok', COPY.toast.ok);
  if (id === 't-fail') return toast('error', COPY.toast.fail);
  if (id === 't-both') { toast('ok', COPY.toast.ok); toast('error', COPY.toast.fail); return; }
  if (['s-on', 's-off', 's-sens'].includes(id)) {
    setRole('admin'); state.pageState = 'set'; showList({ noSkel: true });
    openSettings({ detection: id !== 's-off', sensitivity: 'Medium', notif: { admin: true, t1Manager: true, t1Member: true, t2Manager: true, t2Member: true } });
    if (id === 's-sens') later(() => { const s = document.getElementById('sm-sel'); s && s.click(); });
    return;
  }
};

/* ============================================================
 * 9. Boot（#loading／#empty／#no-auth／#error／#pinned／#expand／#det-off／#settings／#settings-off 等 hash 直接開到該狀態）
 * ============================================================ */
(function boot() {
  setRole('admin');
  if (routeFromHash()) return;
  const h = (location.hash || '').replace('#', '');
  const map = { loading: 'loading', empty: 'empty', 'no-auth': 'no-auth', 'no-auth-na': 'no-auth-na', error: 'error', pinned: 'v-pinned', 'pinned-empty': 'v-pinned-empty', expand: 'v-expand', 't2': 'v-t2', 'det-off': 'det-off', settings: 's-on', 'settings-off': 's-off', t1m: 't1m', t2mb: 't2mb' };
  if (h === 't1m' || h === 't2mb') { setRole(h); setPageState('no-auth'); return; }
  if (map[h]) { _listShown = true; DEMO_APPLY(map[h]); return; }
  showList();
})();
</script>
<script>
/* ============================================================
 * 10. Tooltip（#gl-tip）：頁面自己提供，shared demo-fab.js 看到已存在就不注入它「跟著游標跑」的版本（Fable §5 #3）
 *   做法比照 All Resource List v1（兩頁行為一致）：tooltip 錨在元件上，游標在元件裡移動不會漂。
 *   位置依 Figma #01-3 六個 tooltip 量到的：
 *   - Resource 名稱、Assigned to 儲存格：出現在下方（名稱靠文字起點、下緣＋4；Assigned to 貼列底線上 2）
 *   - 表頭 info、Pin、Details：出現在上方 6px
 *   - 水平先靠元件左緣，右邊放不下就改靠元件右緣＋2（Details、Pin、info）；Assigned to 一律對齊內容右緣（r.right−16）
 *   shared 的全站版本要不要也改成錨定，列在對稿紀錄 §8 待 Kabin。
 * ============================================================ */
(function () {
  const tip = document.createElement('div'); tip.id = 'gl-tip'; tip.style.display = 'none'; document.body.appendChild(tip);
  let cur = null;
  function place() {
    if (!cur || !cur.isConnected) { cur = null; tip.style.display = 'none'; return; }
    const a = (cur.dataset.tipAnchor && cur.querySelector(cur.dataset.tipAnchor)) || cur;
    const r = a.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, vw = innerWidth, vh = innerHeight;
    let x = r.left; if (x + tw > vw - 8) x = Math.max(8, Math.min(r.right + 2, vw - 8) - tw);
    /* Fable §7 #3：#01-3 兩個 Assigned to tooltip 右緣都對齊儲存格文字右緣（1200），不是靠左；靠左會蓋到右邊 Pin */
    if (cur.dataset.tipAlign === 'content-right') x = Math.max(8, r.right - 16 - tw);
    /* v2 詳情頁（#02-2／#02-3）：截圖按鈕與 Assigned to 長名稱的 tooltip 右緣對齊元件右緣；上方間距 4（data-tip-gap）*/
    if (cur.dataset.tipAlign === 'right') x = Math.max(8, r.right - tw);
    const below = cur.dataset.tipPos === 'below', dy = cur.dataset.tipDy != null ? +cur.dataset.tipDy : 4;
    const gapA = cur.dataset.tipGap != null ? +cur.dataset.tipGap : 6;
    let y = below ? r.bottom + dy : r.top - th - gapA;
    if (y < 8) y = r.bottom + 4; if (y + th > vh - 8) y = Math.max(8, r.top - th - 6);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el || (el === cur && tip.style.display !== 'none')) return;
    /* Fable §5 #5：data-tip-trunc 的元件只在文字被截斷時才顯示（#02-3「超過呈現 …，懸停可查看完整內容」）；表格儲存格維持「不論長短統一顯示」 */
    if (el.dataset.tipTrunc != null && el.scrollWidth <= el.clientWidth) return;
    cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block'; place();
  });
  document.addEventListener('mouseout', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el === cur && !el.contains(e.relatedTarget)) { cur = null; tip.style.display = 'none'; }
  });
  window.addEventListener('scroll', place, true);
  window.addEventListener('resize', place);
})();

    '.demo-btn.active{background:radial-gradient(circle at 88% 70%,#D9CC4A 0%,rgba(217,204,74,0) 42%),',

    'background:rgba(14,58,130,.06);border-radius:3px;padding:1px 5px;letter-spacing:.3px;flex-shrink:0}',

  var style = document.createElement('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  // ===== HELPERS =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  // Normalise scenario: tab → page (backwards compat)
  function _normalizedScenarios() {
    return (window.DEMO_SCENARIOS || []).map(function (s) {
      return Object.assign({}, s, { page: s.page || s.tab || null });
    });
  }

  // Detect rendering mode based on what's configured
  function _detectMode() {
    var scenarios = _normalizedScenarios();
    var hasPages = (window.DEMO_PAGES && window.DEMO_PAGES.length) ||
                   scenarios.some(function (s) { return !!s.page; });
    var hasCats  = (window.DEMO_CATEGORIES && window.DEMO_CATEGORIES.length) ||
                   scenarios.some(function (s) { return !!s.category; });

    if (hasPages) return 'pages-only';
    if (hasCats)  return 'categories-only';
    return 'flat';

  // Auto-derive page list if DEMO_PAGES not provided
  function _getPages() {
    if (window.DEMO_PAGES && window.DEMO_PAGES.length) return window.DEMO_PAGES;
    var seen = {};
    var pages = [];
    _normalizedScenarios().forEach(function (s) {
      if (s.page && !seen[s.page]) {
        seen[s.page] = true;
        pages.push({ id: s.page, label: s.page.charAt(0).toUpperCase() + s.page.slice(1), icon: 'tab' });
      }
    });
    return pages;
  }

  function _getCategories() {
    return window.DEMO_CATEGORIES || [];
  }

  // Filter scenarios for current page + category
  function _filterScenarios() {
    var scenarios = _normalizedScenarios();
    return scenarios.filter(function (s) {
      if (_activePage && s.page && s.page !== _activePage) return false;
      if (_activePage && !s.page) return false; // page-tab mode requires scenario to have page
      if (_activeCategory && s.category && s.category !== _activeCategory) return false;
      if (_activeCategory && !s.category) return false; // cat-tab mode requires scenario to have category
      return true;
    });
  }

  // ===== HTML BUILDERS =====
  function _renderButtons(scenarios) {
    if (!scenarios.length) {
      return '<div class="demo-empty">No scenarios in this view.</div>';
    }
    var normal = scenarios.filter(function (s) { return !s.isNoData; });
    var noData = scenarios.filter(function (s) { return s.isNoData; });
    var html = '';
    if (normal.some(function (s) { return !!s.group; })) {
      var order = [];
      normal.forEach(function (s) { var g = s.group || ''; if (order.indexOf(g) < 0) order.push(g); });
      order.forEach(function (g) {
        if (g) html += '<div class="demo-grp-sep">' + _esc(g) + '</div>';
        html += _renderGroup(normal.filter(function (s) { return (s.group || '') === g; }));
      });
    } else {
      html = _renderGroup(normal);
    }
    if (noData.length) {
      html += '<div class="demo-sub-sep">no data</div>' + _renderGroup(noData);
    }
    return html;
  }

  function _renderGroup(scenarios) {
    if (!scenarios.length) return '';
    var btns = scenarios.map(function (s) {
      var dis = s.disabled ? ' demo-dis' : '';
      var act = s.id === _activeScenario ? ' active' : '';

             '<span class="material-symbols-outlined">' + _esc(s.icon || 'play_arrow') + '</span>' +
             '<span>' + _esc(s.label) + '</span>' + cs + '</button>';
    }).join('');
    return '<div class="demo-buttons">' + btns + '</div>';
  }

  function _renderPageTabs(mode) {
    var pages = _getPages();
    if (!pages.length) return '';
    // 雙層模式：page tabs 用 pill style 放最上面
    // 單層 pages-only 模式：page tabs 用 underline style（跟 cat-tabs 一致），無第二層
    var isTwoLayer = mode === 'two-layer';
    var wrapClass = isTwoLayer ? 'demo-page-tabs' : 'demo-cat-tabs';
    var tabClass  = isTwoLayer ? 'demo-page-tab' : 'demo-cat-tab';
    return '<div class="' + wrapClass + '">' + pages.map(function (p) {
      var act = p.id === _activePage ? ' active' : '';
      return '<button class="' + tabClass + act + '" data-page="' + _esc(p.id) + '">' +
             (p.icon ? '<span class="material-symbols-outlined">' + _esc(p.icon) + '</span>' : '') +
             _esc(p.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderCategoryTabs() {
    var cats = _getCategories();
    if (!cats.length) return '';
    return '<div class="demo-cat-tabs">' + cats.map(function (c) {
      var act = c.id === _activeCategory ? ' active' : '';
      return '<button class="demo-cat-tab' + act + '" data-category="' + _esc(c.id) + '">' +
             (c.icon ? '<span class="material-symbols-outlined">' + _esc(c.icon) + '</span>' : '') +
             _esc(c.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderHint() {
    if (!_activeCategory) return '';
    var cat = _getCategories().find(function (c) { return c.id === _activeCategory; });
    if (!cat || !cat.hint) return '';
    return '<div class="demo-pane-hint">' + _esc(cat.hint) + '</div>';
  }

  function _renderScrollArea() {
    return _renderHint() + _renderButtons(_filterScenarios());
  }

  // ===== DOM MOUNTING =====
  function _render() {
    if (document.getElementById('demo-fab')) return;

    // Auto-detect first page & category
    var mode = _detectMode();
    var pages = _getPages();
    var cats = _getCategories();
    if (!_activePage && pages.length) _activePage = pages[0].id;
    if (!_activeCategory && cats.length) _activeCategory = cats[0].id;
    if (mode === 'flat') { _activePage = null; _activeCategory = null; }
    if (mode === 'pages-only') _activeCategory = null;
    if (mode === 'categories-only') _activePage = null;

    // FAB
    var fabEl = document.createElement('button');
    fabEl.className = 'demo-fab';
    fabEl.id = 'demo-fab';
    fabEl.title = 'Designer Demo Scenarios';
    fabEl.innerHTML =
      '<span class="material-symbols-outlined">science</span>' +
      '<span class="demo-pulse" id="demo-fab-pulse"></span>';
    fabEl.addEventListener('click', function () { window._demoFabToggle(); });

    // Popover
    var popEl = document.createElement('div');
    popEl.className = 'demo-popover';
    popEl.id = 'demo-popover';
    popEl.innerHTML =
      '<div class="demo-popover-hdr">' +
        '<div class="demo-popover-title">' +
          '<span class="material-symbols-outlined" style="font-size:16px">science</span>' +
          'Demo Scenarios' +
        '</div>' +
        '<button class="demo-popover-close" id="demo-pop-close">' +
          '<span class="material-symbols-outlined" style="font-size:18px">close</span>' +
        '</button>' +
      '</div>' +
      (window.DEMO_DEFAULT
        ? '<button class="demo-reset-link" id="demo-reset-link">' +
            '<span class="material-symbols-outlined">refresh</span>Reset to Default</button>'
        : '') +
      _renderPageTabs(mode) +
      _renderCategoryTabs() +
      '<div class="demo-popover-scroll" id="demo-popover-scroll">' +
        _renderScrollArea() +
      '</div>';

    document.body.appendChild(fabEl);
    document.body.appendChild(popEl);

    // === Event wiring ===
    document.getElementById('demo-pop-close').addEventListener('click', function () {
      window._demoFabToggle();
    });

    // Reset link
    var resetLink = document.getElementById('demo-reset-link');
    if (resetLink && window.DEMO_DEFAULT) {
      resetLink.addEventListener('click', function () {
        window._demoFabApply(window.DEMO_DEFAULT, null);
      });
    }

    // Page tabs
    popEl.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        window._demoFabSetPage(t.dataset.page);
      });
    });

    // Category tabs (also handles page tabs in pages-only mode, where they use demo-cat-tab class)
    popEl.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        if (t.dataset.page) {
          window._demoFabSetPage(t.dataset.page);
        } else {
          window._demoFabSetCategory(t.dataset.category);
        }
      });
    });

    // Scenario button clicks (event delegation on scroll area)
    document.getElementById('demo-popover-scroll').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-scenario]');
      if (!btn || btn.classList.contains('demo-dis')) return;
      window._demoFabApply(btn.dataset.scenario, btn);
    });

    // Outside click to close
    document.addEventListener('click', function (e) {
      var pop = document.getElementById('demo-popover');
      var fab = document.getElementById('demo-fab');
      if (!pop || !fab) return;
      if (!pop.contains(e.target) && !fab.contains(e.target) && pop.classList.contains('show')) {
        pop.classList.remove('show');
        fab.classList.remove('popped');
      }
    });

    _injectGlobalTooltip();
  }

  // ===== #gl-tip auto-injection =====
  function _injectGlobalTooltip() {
    if (document.getElementById('gl-tip')) return; // host page already provides one
    var tip = document.createElement('div');
    tip.id = 'gl-tip';
    document.body.appendChild(tip);
    var cur = null;
    // 2026-10-09 Kabin 裁決：全站 tooltip 改成錨在元件上（Figma／MUI 行為），不再跟著游標跑。
    // 規則照 Anomaly Detection #01-3 量到的：預設出現在元件上方 6px、水平靠元件左緣，
    // 右邊放不下就改靠元件右緣 +2；上方放不下改到下方。
    // 可選屬性：data-tip-pos="below"（固定放下方）、data-tip-dy（下方距離，預設 4）、
    // data-tip-anchor（CSS 選擇器，錨在子元素上）、data-tip-align="content-right"（右緣對齊內容右緣 −16）。
    function place() {
      if (!cur || !cur.isConnected) { cur = null; tip.style.display = 'none'; return; }
      var a = (cur.dataset.tipAnchor && cur.querySelector(cur.dataset.tipAnchor)) || cur;
      var r = a.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
      var vw = window.innerWidth, vh = window.innerHeight;
      var x = r.left;
      if (x + tw > vw - 8) x = Math.max(8, Math.min(r.right + 2, vw - 8) - tw);
      if (cur.dataset.tipAlign === 'content-right') x = Math.max(8, r.right - 16 - tw);
      var below = cur.dataset.tipPos === 'below';
      var dy = cur.dataset.tipDy != null ? +cur.dataset.tipDy : 4;
      var y = below ? r.bottom + dy : r.top - th - 6;
      if (y < 8) y = r.bottom + 4;
      if (y + th > vh - 8) y = Math.max(8, r.top - th - 6);
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (!el || (el === cur && tip.style.display !== 'none')) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block'; place();
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (el && el === cur && !el.contains(e.relatedTarget)) { cur = null; tip.style.display = 'none'; }
    });
    window.addEventListener('scroll', place, true);
    window.addEventListener('resize', place);
  }

  // ===== PUBLIC API =====
  function _refreshScrollArea() {
    var scroll = document.getElementById('demo-popover-scroll');
    if (!scroll) return;
    scroll.style.opacity = '0';
    setTimeout(function () {
      scroll.innerHTML = _renderScrollArea();
      scroll.style.opacity = '1';
    }, 120);
  }

  function _refreshTabs() {
    var pop = document.getElementById('demo-popover');
    if (!pop) return;
    pop.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === _activePage);
    });
    pop.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      // In pages-only mode, cat-tab elements carry data-page (not data-category)
      if (t.dataset.page) {
        t.classList.toggle('active', t.dataset.page === _activePage);
      } else {
        t.classList.toggle('active', t.dataset.category === _activeCategory);
      }
    });
  }

  /** Toggle popover open/close */
  window._demoFabToggle = function () {
    var pop = document.getElementById('demo-popover');
    var fab = document.getElementById('demo-fab');
    var pulse = document.getElementById('demo-fab-pulse');
    var opening = !pop.classList.contains('show');
    pop.classList.toggle('show');
    fab.classList.toggle('popped');
    if (opening && pulse) pulse.style.display = 'none';
  };

  /** Set active page tab (internal + external) */
  window._demoFabSetPage = function (pageId) {
    if (_activePage === pageId) return;
    _activePage = pageId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /** Set active category tab */
  window._demoFabSetCategory = function (catId) {
    if (_activeCategory === catId) return;
    _activeCategory = catId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /**
   * Called from prototype's navigation function to auto-switch the page tab.
   * Only switches if the popover doesn't need to stay on current tab.
   */
  window.demoFabSwitchTab = function (pageId) {
    window._demoFabSetPage(pageId);
  };

  /** Apply a scenario — called via event delegation or by host */
  window._demoFabApply = function (id, btn) {
    _activeScenario = id;
    document.querySelectorAll('.demo-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    if (btn) {
      btn.classList.add('active');
    } else {
      // No btn provided (e.g. Reset link) — find scenario in DOM
      var found = document.querySelector('[data-scenario="' + id + '"]');
      if (found) found.classList.add('active');
    }
    if (typeof window.DEMO_APPLY === 'function') {
      window.DEMO_APPLY(id, btn);
    }
  };

  // ===== INIT =====
  function _init() {
    if (_activeScenario === null && window.DEMO_DEFAULT) {
      _activeScenario = window.DEMO_DEFAULT;
    }
    _render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>
<script>
/* ============================================================
 * General Behavior：角色切換（2026-10-14，Figma General Behavior #01-5 Popup: Select Your Role）
 * Account Menu → View as Another Role 選好角色按 Continue 後，shared/lumiture-topbar.js 先做「原頁面 Loading」，
 * 再呼叫下面的 LUMITURE_ROLE_CHANGE 讓這一頁變成那個角色看到的樣子；角色不在 LUMITURE_ALLOWED_ROLES 裡就跳回 Overview。
 * 套用角色走 _demoFabApply（跟 Demo FAB 按鈕同一條路），FAB 的 active 情境會跟著亮；沒有 FAB 時退回 DEMO_APPLY
 * 角色鍵：admin／t1m／t1mb／t2m／t2mb（對照表見 specs/2026-10-14-general-behavior-v1-figma-compare.md §6）
 * ============================================================ */
(function () {
  /* 依據：Demo FAB Role 5 組（T1 隱藏 Alert Settings 按鈕、T2 沒有 Assigned to 欄位），都進得了這一頁 */
  window.LUMITURE_ALLOWED_ROLES = ['admin','t1m','t1mb','t2m','t2mb'];
  window.LUMITURE_ROLE_CHANGE = function (key, group) {
    (window._demoFabApply || window.DEMO_APPLY)(key);
    if (window.LumitureTopbar) LumitureTopbar.setRole(LumitureTopbar.roleLabel(group));   /* 頁面的 setRole 會把 chip 寫成頁面慣用寫法，換回使用者選的群組 */
  };
})();
</script>
