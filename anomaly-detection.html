/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */
  --lt-shadow-chip:   0 2px 4px 0 rgba(0, 0, 0, 0.3);            /* chip / tag 用，較深 opacity */
  --lt-shadow-dialog: 0 0 6px 0 rgba(0, 0, 0, 0.2);              /* Card / Dialog / Dropdown 共用；無 offset */
  --lt-shadow-overlay:        0 4px 12px rgba(0, 0, 0, 0.14);    /* CMDS 未涵蓋；popover / floating menu */
  --lt-shadow-overlay-strong: 0 4px 16px rgba(0, 0, 0, 0.18);    /* CMDS 未涵蓋；drawer / 較重 overlay */

  /* --- Transition --- */
  --lt-transition-fast: .15s ease;
  --lt-transition-base: .2s ease;
  --lt-transition-slow: .3s ease;

  /* --- Z-index --- */
  --lt-z-base:     0;
  --lt-z-elevated: 10;
  --lt-z-sticky:   100;
  --lt-z-dropdown: 1000;
  --lt-z-modal:    2000;
  --lt-z-tooltip:  3000;
  --lt-z-toast:    4000;


  /* ============================================================
   * LAYER 2 — SEMANTIC
   * 語意層：引用 primitive，描述用途；component 預設用此層
   * ============================================================ */

  /* --- Color: Brand --- */
  --lt-color-primary:         var(--lt-blue-70);
  --lt-color-primary-hover:   var(--lt-blue-60);
  --lt-color-primary-active:  var(--lt-blue-90);
  --lt-color-primary-bg:      var(--lt-blue-10);
  --lt-color-primary-bg-emphasized: var(--lt-blue-20);

  --lt-color-secondary:       var(--lt-turquoise-70);
  --lt-color-secondary-hover: var(--lt-turquoise-60);
  --lt-color-secondary-bg:    var(--lt-turquoise-10);

  /* --- Color: Functional (alias) --- */
  --lt-color-success: var(--lt-color-success-base);
  --lt-color-error:   var(--lt-color-error-base);
  --lt-color-warning: var(--lt-color-warning-base);
  --lt-color-info:    var(--lt-color-info-base);

  /* --- Color: Text --- */
  --lt-color-text-primary:   var(--lt-grey-700);   /* 內文預設 */
  --lt-color-text-secondary: var(--lt-grey-500);   /* 次要文字 */
  --lt-color-text-tertiary:  var(--lt-grey-400);   /* hint / placeholder */
  --lt-color-text-disabled:  var(--lt-grey-400);
  --lt-color-text-inverse:   var(--lt-white);
  --lt-color-text-link:      var(--lt-blue-60);
  --lt-color-text-heading:   var(--lt-grey-800);   /* 為未來 heading 獨立換色預留 */
  --lt-color-text-icon:      var(--lt-grey-600);   /* 為未來 icon 獨立換色預留 */

  /* --- Color: Background --- */
  --lt-color-bg-default:    var(--lt-white);
  --lt-color-bg-subtle:     var(--lt-grey-50);
  --lt-color-bg-emphasized: var(--lt-grey-100);
  --lt-color-bg-disabled:   var(--lt-grey-100);
  --lt-color-bg-inverse:    var(--lt-blue-90);
  --lt-color-bg-overlay:    rgba(0, 0, 0, 0.5);
  --lt-color-bg-skeleton:   var(--lt-grey-200);   /* 骨架屏；2026-09-24 定，對應前端 gray.skeleton → gray.10；用途命名，日後可單獨換色 */

  /* --- Color: Border --- */
  --lt-color-border-default: var(--lt-grey-200);
  --lt-color-border-strong:  var(--lt-grey-300);
  --lt-color-border-focus:   var(--lt-color-primary);
  --lt-color-border-input:   #DCE3EC;   /* prototype --tf-border；略不同於 grey-200 */
  --lt-color-border-error:   var(--lt-color-error-base);


  /* ============================================================
   * LAYER 3 — COMPONENT
   * 元件層：給特定元件使用；引用 semantic
   * ============================================================ */

  /* --- Sidebar (深海軍藍) --- */
  --lt-sidebar-width:      250px;
  --lt-sidebar-bg:         var(--lt-blue-90);
  --lt-sidebar-text:       rgba(255, 255, 255, 0.85);
  --lt-sidebar-text-muted: rgba(255, 255, 255, 0.50);
  --lt-sidebar-hover-bg:   rgba(255, 255, 255, 0.06);
  --lt-sidebar-active-bg:  var(--lt-color-primary);

  /* --- Topbar --- */
  --lt-topbar-bg:     var(--lt-white);
  --lt-topbar-shadow: var(--lt-shadow-dialog);   /* CMDS Dialog shadow（Card 級別 elevation）*/

  /* --- Card --- */
  --lt-card-bg:      var(--lt-color-bg-default);
  --lt-card-radius:  var(--lt-radius-md);
  --lt-card-shadow:  var(--lt-shadow-dialog);    /* CMDS 明確規範 Card 用 Dialog shadow */
  --lt-card-padding: var(--lt-space-24);

  /* --- Button --- */
  --lt-button-radius:     var(--lt-radius-sm);
  --lt-button-padding-x:  var(--lt-space-16);
  --lt-button-padding-y:  var(--lt-space-8);
  --lt-button-focus-ring: 0 0 0 3px rgba(0, 79, 176, 0.10);

  /* --- Input / Text Field --- */
  --lt-input-bg:        var(--lt-color-bg-default);
  --lt-input-border:    var(--lt-color-border-input);
  --lt-input-radius:    var(--lt-radius-sm);
  --lt-input-padding-x: var(--lt-space-16);
  --lt-input-padding-y: var(--lt-space-8);

  /* --- Modal --- */
  --lt-modal-radius:   var(--lt-radius-lg);
  --lt-modal-shadow:   var(--lt-shadow-dialog);  /* CMDS Dialog shadow（Modal = Dialog 同類）*/
  --lt-modal-padding:  var(--lt-space-24);
  --lt-modal-backdrop: rgba(0, 0, 0, 0.5);

  /* --- Tooltip --- */
  --lt-tooltip-bg:      #31383E;            /* 2026-10-09 Kabin 裁決改成 Figma 量到的值（原 #3C3C3C）；對齊 Lumiture-Guideline.md 規範；非品牌色，刻意不引用 brand token */
  --lt-tooltip-text:    var(--lt-white);
  --lt-tooltip-radius:  var(--lt-radius-sm);
  --lt-tooltip-padding: var(--lt-space-8);
}


/* ============================================================
 * NOT YET DEFINED (Pass 3+)
 * ============================================================
 * - ~~Chart palette~~ ✅ 已加入（2026-05-12 從 Figma General Behavior file audit）
 * - Gradient tokens (Figma 有 Lumiture.ai Blue / Orange / Lemon C 等)
 * - Opacity tokens (Figma 有 CM Opacity Color 系列)
 * - Composite typography tokens (--lt-type-h1, --lt-type-body 等 style sets)
 * - Focus / Inset shadow 特殊變體
 * - Dark mode 對應 token
 *
 * Shadow 結構待 Figma audit：v7/v8 用單層、tokens.css 主階用雙層；Overlay 已用單層作折衷
 * ============================================================ */

</style>
<style>
/* ============================================================
 * Anomaly Detection — route `/budget/anomaly`（本輪只做列表頁；詳情頁 `/budget/anomaly/[alertId]` 另一輪）
 * 權威順序（Kabin 2026-09-11 裁決）：Figma 設計稿 > tokens.css > Guideline > FE 現況（FE 依據＝2026-08-11 快照，可能已過期）
 * Figma file P3MZ4MmG1pjel2cSbXkUMW，正式 page「Anomaly Detection & Alert」4267:40553（不用 [Draft] 8034:86674、不用 Backup for V1）。數值皆由 REST 節點樹量得。
 * 標記慣例：⚠ DEVIATION＝偏離 Figma 或 FE；⚠ 設計端暫擬＝Figma 沒畫、自己補的；⚠ 未確認＝稿上有但用途或規則不明
 * ============================================================ */

/* ---- 頁面層 token：Figma 量到、tokens.css 沒有或不同時補在這裡（待收錄）----
 * ⚠ DEVIATION: 卡片陰影 0 0 20 .10（token 是 0 0 6 .2）／輸入框與按鈕圓角 5（token 4）／Modal 圓角 15（Figma #03-1 量到 r15；token 12。Customized Budget 量到 10，兩頁不一致，見設計稿問題清單）／輸入框邊框 #CCCCCC（token #DCE3EC）*/
:root{
  --ad-card-shadow: 0 0 20px rgba(0,0,0,.10);
  --ad-radius-field: 5px;
  --ad-radius-modal: 15px;
  --ad-field-border: #CCCCCC;                 /* = --lt-grey-300 */
  --ad-scroll-thumb: #D8D8D8;
  --ad-toast-ok: #008F88;                     /* = --lt-color-success-dark（Figma Toast Allocated）*/
  --ad-toast-err: #BF302E;                    /* tokens 無 error dark；Figma Toast 量到 */
  --ad-badge-bg: #B3B3B3;                     /* Figma Badge / Text：子項計數膠囊（= --lt-grey-400）；FE 的 gray.borderDark，tokens 沒有對應語意 token */
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none}
body{font-family:var(--lt-font-sans);font-size:var(--lt-fs-14);line-height:var(--lt-leading-body);color:var(--lt-color-text-primary);background:var(--lt-color-primary-bg);letter-spacing:var(--lt-tracking-normal)}
a{color:var(--lt-color-primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:var(--lt-fs-14);letter-spacing:0;color:inherit}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20;vertical-align:middle;user-select:none}
.icon-outline{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}
[hidden]{display:none!important}

/* ===== App layout（Figma：內容區 padding 32、段落間距 20）===== */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:var(--lt-space-32);flex:1;display:flex;flex-direction:column;gap:20px;min-width:0}

/* ===== Buttons（Figma Button/M：36h、圓角 5、14/700）===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--lt-space-4);min-width:80px;padding:0 var(--lt-button-padding-x);height:36px;border-radius:var(--ad-radius-field);font-weight:var(--lt-fw-bold);font-size:var(--lt-fs-14);line-height:1.5;white-space:nowrap;border:1px solid transparent;transition:background-color var(--lt-transition-fast),border-color var(--lt-transition-fast),color var(--lt-transition-fast)}
.btn-p{background:var(--lt-color-primary);color:var(--lt-color-text-inverse)}
.btn-p:hover{background:var(--lt-color-primary-hover)}
.btn-p:active{background:var(--lt-color-primary-active)}
.btn-o{background:var(--lt-color-bg-default);color:var(--lt-color-primary);border-color:var(--lt-color-primary)}
.btn-o:hover{background:var(--lt-color-bg-subtle);color:var(--lt-color-primary-hover);border-color:var(--lt-color-primary-hover)}
.btn-o:active{background:var(--lt-color-bg-emphasized);color:var(--lt-color-primary-active);border-color:var(--lt-color-primary-active)}
.btn .material-symbols-outlined{font-size:16px}
.btn .ic-add{font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 20}
.btn:disabled,.btn.is-disabled{background:var(--lt-grey-300)!important;color:#fff!important;border-color:transparent!important;cursor:not-allowed}
.btn.btn-o:disabled,.btn.btn-o.is-disabled{background:#fff!important;color:var(--lt-grey-300)!important;border-color:var(--lt-grey-300)!important}

/* ===== Page header（Figma #01：H4 20/700、說明 14/24.5 #676767）===== */
.pg-hdr{display:flex;align-items:center;gap:var(--lt-space-16);min-height:30px}
/* ⚠ DEVIATION: Overview v1 把標題放大成 Guideline H3 24px；這頁 Figma 量到 H4 20/700/30，照 Figma（同 Customized Budget）*/
.pg-title{font-size:20px;font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading);line-height:30px}
.pg-desc{font-size:var(--lt-fs-14);line-height:24.5px;color:var(--lt-color-text-secondary)}
.hdr-block{display:flex;flex-direction:column;gap:4px}

/* ===== Card（Figma：白底 r8 內距 24 陰影 0 0 20 .10）===== */
.card{background:var(--lt-card-bg);border-radius:var(--lt-card-radius);box-shadow:var(--ad-card-shadow);padding:var(--lt-card-padding);display:flex;flex-direction:column;gap:16px;min-width:0}
.card.is-tall{min-height:504px}   /* Figma #01-4／#01-5／#01-8：卡片高 504（空狀態、No Auth）*/

/* ===== 工具列（Figma #01：高 36、Alert List 18/700 靠左；右側 Alert Settings／狀態 chip／All|Pinned，gap 16）===== */
.toolbar{display:flex;align-items:center;gap:16px;min-height:36px}
.tb-title{font-size:var(--lt-fs-18);font-weight:var(--lt-fw-bold);line-height:27px;color:var(--lt-color-text-heading);margin-right:auto}
.tb-title.none{margin-right:auto;min-width:1px}
.toolbar.is-empty{min-height:30px}   /* 對稿修正（Figma #01-4）：空狀態沒有切換器，工具列高 30 不是 36 */
.tb-r{display:flex;align-items:center;gap:16px;margin-left:auto}
/* Alert Settings：Text Button（12/700、primary、文字底線、icon 永遠不畫底線）*/
.lnk-btn{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 0;font-size:var(--lt-fs-12);font-weight:var(--lt-fw-bold);line-height:21px;color:var(--lt-color-primary)}
.lnk-btn .material-symbols-outlined{font-size:16px}
.lnk-btn .t{text-decoration:underline}
.lnk-btn:hover{color:var(--lt-color-primary-hover)}
.lnk-btn:disabled{color:var(--lt-grey-300);cursor:not-allowed}
.lnk-btn:disabled:hover{color:var(--lt-grey-300)}
/* 偵測狀態 chip（Figma Status Chips：高 24、r4、內距 2/8、燈 8×8、文字 12/18）*/
.st-chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:2px 8px;border-radius:var(--lt-radius-sm);background:var(--lt-color-info-light);font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-color-text-primary)}
.st-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--lt-color-primary);flex-shrink:0}
.st-chip .tx{white-space:pre}   /* Figma 文案 `Detection Enabled  (Sensitivity: High)` 中間是兩個空格，照稿保留 */
.st-chip.off{background:var(--lt-grey-100)}
.st-chip.off .dot{background:var(--lt-grey-400)}
.st-chip.skel{width:224px;background:transparent;padding:0}
.st-chip.skel .sk{background:var(--lt-grey-100);animation:none}   /* Figma #01-6：狀態 chip 的佔位是靜態 #F2F2F2 224×14 */
/* All | Pinned Toggle Group（Figma：101×36、外框 #CCCCCC r6、All 48 寬／Pin 52 寬、選中底 #D1EEFF 字 #002663）*/
.tg{display:inline-flex;height:36px;border:1px solid var(--lt-grey-300);border-radius:6px;overflow:hidden;background:#fff;flex-shrink:0}
.tgb{display:inline-flex;align-items:center;justify-content:center;height:34px;color:var(--lt-grey-500);transition:background var(--lt-transition-fast)}
.tgb.t-all{width:48px;font-size:var(--lt-fs-14);line-height:21px}
.tgb.t-pin{width:52px}
.tgb .material-symbols-outlined{font-size:20px}
.tgb:hover{background:var(--lt-grey-50)}
.tgb.on{background:var(--lt-blue-20);color:var(--lt-blue-90)}   /* ⚠ 設計端暫擬：Figma 只畫 All 選中；Pinned 選中的 icon 色沿用 All 選中字色 #002663 */
.tgb.on:hover{background:var(--lt-blue-20)}
.tg .sep{width:1px;background:var(--lt-grey-300);flex-shrink:0}
.tg.is-disabled .tgb{color:var(--lt-grey-400);cursor:not-allowed;background:#fff}   /* Figma #01-6：讀取中不能操作的元件呈現 Disabled（字 #B3B3B3、icon #CCCCCC）*/
.tg.is-disabled .tgb.t-pin .material-symbols-outlined{color:var(--lt-grey-300)}

/* ===== Table（Figma：Header 50＋Row 50、header #F2FAFF、header 下緣 #B3B3B3、列分隔 #E6E6E6；最多 10.5 列→外框高 575）=====
 * 用 grid 列模擬 table，欄寬 = 320／min175／min175／min240／80（Figma 1117 寬正好是最小寬；1346 寬時三個彈性欄各 273）*/
.tbl-scroll{--cols:320px minmax(175px,1fr) minmax(175px,1fr) minmax(240px,1fr) 80px;--minw:990px;max-height:575px;overflow-y:scroll;overflow-x:auto;overscroll-behavior:contain;position:relative}
/* T2 沒有 Assigned to 欄（#01-7 畫面）：稿在 1117 寬量到 Resource／Actual Cost／Anomaly Date 各 303、Action 80。
 * Resource 欄照 #01-1「寬度固定」規則固定成 303（#01-7 的值，不是其他稿的 320），其餘兩欄平分；1117 寬時三欄都是 303，跟稿一致 */
.tbl-scroll.no-assigned{--cols:303px minmax(175px,1fr) minmax(175px,1fr) 80px;--minw:733px}
/* 垂直捲軸常駐（Figma 用 15px 軸＋10px thumb #D8D8D8 r2＋左右 1px #E6E6E6）；軸上方 50px 與表頭同色 */
.tbl-scroll::-webkit-scrollbar{width:15px;height:15px}
/* 對稿修正（Figma #01 取樣）：軌道從表頭下緣開始、表頭底色與下緣線延伸過捲軸那一欄；軌道左右 1px #E6E6E6、thumb 約 9 寬 #D8D8D8。
 * 表頭那 50px 由 .tbl-scroll 自己的背景補（背景不隨內容捲動，剛好是固定在頂端的那一段）*/
.tbl-scroll{background:linear-gradient(#F2FAFF 0,#F2FAFF 49px,#B3B3B3 49px,#B3B3B3 50px,#fff 50px)}
.tbl-scroll::-webkit-scrollbar-track{background:#fff;box-shadow:inset 1px 0 #E6E6E6,inset -1px 0 #E6E6E6}
.tbl-scroll::-webkit-scrollbar-track:vertical{margin-top:50px}
.tbl-scroll::-webkit-scrollbar-track:horizontal{box-shadow:inset 0 1px #E6E6E6,inset 0 -1px #E6E6E6}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--ad-scroll-thumb);border:solid transparent;border-width:0 2px 0 3px;background-clip:padding-box;border-radius:2px;box-shadow:inset 0 0 0 1px #E6E6E6}   /* Figma Scroll bar / Vertical：thumb 10 寬、距軌道左 3、#D8D8D8＋1px #E6E6E6、r2 */
.tbl-scroll::-webkit-scrollbar-thumb:horizontal{border-width:3px 0 2px 0}
.tbl-scroll::-webkit-scrollbar-corner{background:#fff}
.tr{display:grid;grid-template-columns:var(--cols);min-width:var(--minw)}
.td,.th{height:50px;padding:0 16px;display:flex;align-items:center;min-width:0;background:#fff;border-bottom:1px solid var(--lt-grey-200);font-size:var(--lt-fs-14);line-height:24.5px;color:var(--lt-color-text-primary)}
.th{background:var(--lt-color-primary-bg);font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading);border-bottom-color:var(--lt-grey-400);gap:4px}
.th-row{position:sticky;top:0;z-index:5}
.td .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* 固定欄：Resource Name / ID（左）、Action（右）；固定欄接合處陰影 0 0 10 .1（#01 註記，一開始就有）*/
.st-l{position:sticky;left:0;z-index:3}
.st-r{position:sticky;right:0;z-index:3}
.th.st-l,.th.st-r{z-index:6}
.st-l::after,.st-r::before{content:'';position:absolute;top:0;bottom:-1px;width:10px;pointer-events:none}
/* 對稿修正（Figma #01-1 取樣）：稿是 DROP 0.10 blur10 位移 2 被裁成一條，接合處實際只有約 6% 深、8px 內淡出；原本 10% 線性 10px 太重 */
.st-l::after{right:-10px;background:linear-gradient(90deg,rgba(0,0,0,.063),rgba(0,0,0,.012) 7px,rgba(0,0,0,0) 8px)}
.st-r::before{left:-10px;background:linear-gradient(270deg,rgba(0,0,0,.055),rgba(0,0,0,.012) 7px,rgba(0,0,0,0) 8px)}
.tbody .tr:hover .td{background:var(--lt-grey-50)}
/* 資源欄：[箭頭 10][Logo 24][兩行名稱/ID][計數膠囊]（Figma #01-1／#01-9）*/
/* Figma #01-1／#01-9 量到：一般列 padding 左右 20、gap 10 → 箭頭 x20、logo x40、名稱 x74；展開中的主列 4px 前綴線＋左 18／右 10、gap 8（logo 仍在 x40、名稱 x72、計數膠囊右移到距右 10）；子列左 40（含前綴線）右 10 */
.td.res{padding:0 20px;gap:10px;position:relative}
.td.res.can{cursor:pointer}
.tw{width:10px;height:10px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.tw i{display:block;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid var(--lt-grey-500)}
.tw.open i{border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--lt-grey-500);border-bottom:0}
.csp{width:24px;height:24px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.csp svg,.csp img{width:24px;height:24px;display:block}
.cell-2l{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.cell-2l .l1{font-size:var(--lt-fs-14);line-height:21px;color:var(--lt-color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-2l .l2{font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-grey-400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{flex-shrink:0;min-width:20px;height:20px;padding:0 4px;border-radius:5px;background:var(--ad-badge-bg);color:#fff;font-size:var(--lt-fs-14);font-weight:var(--lt-fw-bold);line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
/* 展開：主列與子列左側 4px #9ED7FF 前綴線；子列底色 #F6F6F6（#01-9 註記：各種狀態定義請見 CMDS）*/
.tr.is-open .td.res::before,.tr.is-child .td.res::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lt-blue-30)}
.tr.is-open .td.res{padding:0 10px 0 22px;gap:8px}
.tr.is-child .td{background:var(--lt-grey-50)}
.tr.is-child:hover .td{background:var(--lt-grey-100)}   /* ⚠ 設計端暫擬：子列底色本來就是 CMDS hover 色 #F6F6F6，hover 再深一階 #F2F2F2，否則沒有回饋（#01-9 只寫「各種狀態定義請見 CMDS」）*/
.tr.is-child .td.res{padding:0 10px 0 40px;gap:10px}
.tr.is-child .td.res .csp{margin-left:0}
.td .dash{color:var(--lt-color-text-primary)}
.td.asg{padding-right:8px}   /* 文案寬度容差：Figma 文字框 208 剛好放得下 Engineering Research Assistants，Chrome 字寬略大，右內距縮到 8 避免多截 */
.td.act{padding:0 16px;gap:8px}
.ib{width:20px;height:20px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--lt-grey-500);transition:background var(--lt-transition-fast),color var(--lt-transition-fast)}
.ib .material-symbols-outlined{font-size:16px}
/* 對稿修正（Figma #01-3 節點）：一般 icon button hover 圓底 #676767@24%；已釘選 pin hover #0B6DD7@12% */
.ib:hover{background:rgba(103,103,103,.24)}
/* Pin：Figma 兩態 icon 同形（FILL 1）、只換顏色：已釘＝primary、未釘＝#676767；hover 淡藍圓底。
 * ⚠ DEVIATION: Guideline 規定 On/Off icon 要「on=FILL 1+primary、off=FILL 0+neutral」；Figma 與 FE 都只切顏色，Kabin 09-11 裁決「Figma 有畫就照 Figma」→ 照稿，不切 FILL。 */
.ib.pin.on{color:var(--lt-color-primary)}
.ib.pin.on:hover{background:rgba(11,109,215,.12)}
.ib:focus-visible{outline:none;box-shadow:var(--lt-button-focus-ring)}
.td.res:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(0,79,176,.35)}
.th .info{font-size:16px;color:var(--lt-grey-500);cursor:help}

/* ===== Skeleton（#01-6：表頭 #F2F2F2＋上緣 2px、四列、左欄與右四欄間 1px 分隔）===== */
/* 對稿修正（Figma #01-6）：條的底色 #E6E6E6（稿上再疊一層動畫光），原本 #EBEBEB 偏淡 */
.sk{background:linear-gradient(90deg,#E6E6E6 25%,#F2F2F2 50%,#E6E6E6 75%);background-size:200% 100%;animation:shimmer 1.5s infinite linear;border-radius:4px;height:14px}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk-tbl{display:grid;grid-template-columns:476fr 1px 528fr}
.sk-tbl .sk-div{background:var(--lt-grey-200)}
.sk-left,.sk-right{display:flex;flex-direction:column}
.sk-hd{height:50px;background:var(--lt-grey-100);border-top:2px solid var(--lt-grey-200);border-bottom:1px solid var(--lt-grey-200);display:flex;align-items:center;padding:0 16px}
.sk-row{height:50px;border-bottom:1px solid var(--lt-grey-200);display:flex;align-items:center;padding:0 16px;background:#fff}
/* 對稿修正（Figma #01-6）：右半四欄等寬 132、每欄一條 50 寬的條置中（原本是 gap 25 靠左排）*/
.sk-right .sk-hd,.sk-right .sk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0;justify-items:center}
.sk-right .sk{width:50px}
.sk-hd .sk{background:#E6E6E6;animation:none}

/* ===== Empty / No-auth / Error（#01-4／#01-5／#01-8）===== */
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--lt-color-text-secondary);flex:1;min-height:300px;padding:16px 0}
.es .es-ic{font-size:80px;color:var(--lt-blue-30);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 48;line-height:80px;width:80px;height:80px}
.es .es-ic.is-outline{font-variation-settings:'FILL' 0,'wght' 700,'GRAD' 0,'opsz' 48}   /* 對稿修正（Fable §5 #1）：#01-4 的 table_view 格子是空心的，Material Symbols 的 FILL 0 就是這個字形 */
.es svg{width:80px;height:80px;display:block}
.es-title{font-size:var(--lt-fs-18);font-weight:var(--lt-fw-bold);line-height:27px;margin-top:16px}
.es-desc{font-size:var(--lt-fs-14);white-space:pre-line;margin-top:8px;line-height:24.5px}
.es .btn{margin-top:32px}
.es.err{min-height:70vh}

/* ===== Switch（Figma 30×16、r8、knob 12）／ 下拉（36h、8×6 實心三角 #676767）===== */
.sw{position:relative;display:inline-block;width:30px;height:16px;border-radius:8px;border:1px solid var(--lt-color-primary);background:#fff;vertical-align:middle;cursor:pointer;transition:background var(--lt-transition-fast);flex-shrink:0}
.sw::after{content:'';position:absolute;left:1px;top:1px;width:12px;height:12px;border-radius:50%;background:transparent;border:1px solid var(--lt-color-primary);transition:transform var(--lt-transition-fast),background var(--lt-transition-fast)}
.sw.on{background:var(--lt-color-primary)}
.sw.on::after{background:#fff;border-color:#fff;transform:translateX(14px)}
.sw:focus-visible{outline:none;box-shadow:var(--lt-button-focus-ring)}
.sw.is-disabled{cursor:not-allowed;background:#fff;border-color:var(--lt-grey-300)}
.sw.is-disabled.on{background:var(--lt-grey-300)}   /* Figma #03-2：Disabled ON 軌 #CCCCCC、白點 */
.sel{display:flex;align-items:center;justify-content:space-between;gap:10px;height:36px;padding:0 10px;background:#fff;border:1px solid var(--ad-field-border);border-radius:var(--ad-radius-field);font-size:var(--lt-fs-14);color:var(--lt-color-text-primary);cursor:pointer;text-align:left;width:100%;min-width:0;transition:border-color var(--lt-transition-fast),box-shadow var(--lt-transition-fast)}
.sel:hover{border-color:var(--lt-grey-400)}
.sel.open{border-color:var(--lt-color-border-focus);box-shadow:var(--lt-button-focus-ring)}
.tri{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--lt-grey-500);flex-shrink:0}
.sel.open .tri{transform:rotate(180deg)}
.sel:disabled{background:var(--lt-grey-100);border-color:var(--lt-grey-200);color:var(--lt-grey-400);cursor:not-allowed}   /* Figma #03-2：底 #F2F2F2、框 #E6E6E6、字 #B3B3B3 */
.sel:disabled .tri{border-top-color:var(--lt-grey-300)}
.pop{position:fixed;z-index:calc(var(--lt-z-modal) + 1);background:#fff;border:1px solid var(--lt-grey-200);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.1);overscroll-behavior:contain;font-size:var(--lt-fs-14);max-height:320px;overflow-y:auto}
/* ⚠ 設計端暫擬（Fable §5 #2）：Figma 沒畫 Sensitivity 下拉的展開態 → 照 Guideline「Dropdown / Select」的 List／Item：
 * 容器 1px #E6E6E6、r8、上下 4、陰影 0 4 12 .08＋0 1 3 .1；項目 40 高、內距 0 12；Hover #F6F6F6、鍵盤焦點 #E6E6E6、
 * Selected 底 #F2FAFF＋字 #004FB0＋右側勾、Selected+Hover #D1EEFF。
 * （原本選中態用 class `sel`，會吃到下拉欄位 .sel 的框線與高度，一併改名 is-sel）*/
.pop.menu{padding:4px 0}
.mi{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;padding:0 12px;cursor:pointer;color:var(--lt-color-text-primary);white-space:nowrap}
.mi:hover{background:var(--lt-grey-50)}
.mi.hl{background:var(--lt-grey-200)}
.mi.is-sel{background:var(--lt-blue-10);color:var(--lt-color-primary)}
.mi.is-sel:hover{background:var(--lt-blue-20)}
.mi .ck{font-size:18px;color:var(--lt-color-primary);font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}

/* ===== Modal（#03-1／#03-2：700 寬、r15、內距 24/32、gap 24、陰影 0 0 6 .2、標題 20/700；上下 Padding 24、左右 32 是 #03-1 紫色註記）===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:var(--lt-z-modal);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:700px;max-width:100%;max-height:calc(100vh - 48px);background:#fff;border-radius:var(--ad-radius-modal);box-shadow:var(--lt-shadow-dialog);padding:24px 32px;display:flex;flex-direction:column;gap:24px;min-height:0}
.modal .m-hd{display:flex;align-items:center;gap:15px;flex-shrink:0}
.modal .m-hd h2{flex:1;font-size:20px;line-height:30px;font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading)}
.modal .m-x{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--lt-grey-500);flex-shrink:0}
.modal .m-x:hover{background:var(--lt-grey-100)}
.modal .m-x .material-symbols-outlined{font-size:24px;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
.modal .m-desc{font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-color-text-primary);flex-shrink:0}
.modal .m-scroll{flex:1 1 auto;min-height:0;overflow-y:scroll;overscroll-behavior:contain}
/* 內容區右側固定一條 15px 捲軸（Figma 一直畫著，thumb #D8D8D8）*/
.modal .m-scroll::-webkit-scrollbar{width:15px}
.modal .m-scroll::-webkit-scrollbar-track{background:#fff;box-shadow:inset 1px 0 #E6E6E6,inset -1px 0 #E6E6E6}   /* 對稿修正：scrollbar 軌道的 border 不會畫，改 inset 陰影 */
.modal .m-scroll::-webkit-scrollbar-thumb{background:var(--ad-scroll-thumb);border:solid transparent;border-width:0 2px 0 3px;background-clip:padding-box;border-radius:2px;box-shadow:inset 0 0 0 1px #E6E6E6}
.m-inner{display:flex;flex-direction:column;gap:24px;padding-right:8px}
.modal .m-ft{display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
.modal .m-ft .btn{min-width:100px}
.lbl{font-size:var(--lt-fs-12);font-weight:var(--lt-fw-bold);line-height:18px;color:var(--lt-color-primary)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.swrow{display:inline-flex;align-items:center;gap:10px;height:36px;cursor:pointer;align-self:flex-start;font-size:var(--lt-fs-14);line-height:24.5px}
.swrow.is-disabled{cursor:not-allowed;color:var(--lt-grey-300)}
.help{font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-color-text-secondary)}
.sens{display:flex;flex-direction:column;gap:8px}
.sens .sel{width:240px;padding:0 10px 0 7px}   /* 對稿修正（Fable §5 #9，同 CB §5 #16）：Figma 文字距欄位左緣 8（外框畫在框內）→ 1px 框＋7 */
.sens.is-disabled .lbl{color:var(--lt-color-primary)}   /* Figma #03-2：Detection Sensitivity 標籤維持藍色，欄位與說明變灰 */
.sens.is-disabled .help{color:var(--lt-grey-400)}
.nbox{border:1px solid var(--lt-grey-200);border-radius:8px;background:#fff;padding:23px;display:flex;flex-direction:column;gap:16px}
.nbox h3{font-size:var(--lt-fs-16);font-weight:var(--lt-fw-bold);line-height:24px;color:var(--lt-color-text-heading)}
.nbox .intro{display:flex;flex-direction:column;gap:8px}
.nbox .role{display:flex;flex-direction:column;gap:8px}
.nbox .role .rl{font-size:var(--lt-fs-12);font-weight:var(--lt-fw-bold);line-height:18px;color:var(--lt-color-text-primary)}
.nbox .role .swrow{height:25px}
.nbox hr{border:none;border-top:1px solid var(--lt-grey-200);margin:0 0 -1px}   /* 對稿修正（Figma #03-1）：Figma 外框畫在框內、分隔線高 0；padding 23＋分隔線不佔高，框高 483 與稿一致 */
.nbox.is-disabled h3,.nbox.is-disabled .rl{color:var(--lt-grey-400)}
.nbox.is-disabled .help{color:var(--lt-grey-400)}

/* ===== Toast（Figma：左下、400×46、r4、陰影 0 0 6 .2；成功 #008F88、失敗 #BF302E；同時出現時失敗在上）===== */

/* Tooltip（Figma #01-3：深底白字、14/24.5、內距 8/16、max-width 400、r4、陰影 0 0 6 .2）。底色用 token --lt-tooltip-bg（#31383E，Kabin 10/09 裁決）；Figma 實際是 #000910@80%，疊白底約等於 */

  // logo 連到 Overview（從 LUMITURE_NAV 拿 href）；在 Overview 頁本身不連自己，也就沒有 hover 變形
  function _renderLogo() {
    var nav = window.LUMITURE_NAV || [];
    var home = nav.filter(function (e) { return e.type === 'item' && e.id === 'overview'; })[0];
    var linked = home && home.href && !home.disabled && window.LUMITURE_ACTIVE !== 'overview';
    var open = linked ? '<a class="lt-sb-logo is-link" href="' + _esc(home.href) + '" title="Go to Overview">' : '<div class="lt-sb-logo">';
    return open +
      '<div class="lt-sb-logo-wrap">' + LOGO_ICON + '</div>' +
      '<span class="lt-sb-logo-text">LumiTure.ai</span>' +
      '<span class="lt-sb-proto" title="Prototype">PROTO<span class="lt-sb-proto-x">TYPE</span></span>' +
      '<div class="lt-sb-logo-p" aria-hidden="true"><svg viewBox="0 0 39.10 34.00" fill="none">' + P_MARK_INNER + '</svg></div>' +
    (linked ? '</a>' : '</div>');
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function _renderItem(item, isSub) {
    var cls = isSub ? 'lt-sb-subitem' : 'lt-sb-item';
    var isActive = (item.id === window.LUMITURE_ACTIVE);
    var active = isActive ? ' lt-active' : '';
    var dis = item.disabled ? ' lt-dis' : '';
    // Active item: render as <div> (no self-link). Disabled item: also no href.
    var useHref = item.href && !isActive && !item.disabled;
    var tag = useHref ? 'a' : 'div';
    var hrefAttr = useHref ? ' href="' + _esc(item.href) + '"' : '';
    var dataId = ' data-nav-id="' + _esc(item.id) + '"';
    return '<' + tag + ' class="' + cls + active + dis + '"' + hrefAttr + dataId + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon || 'circle') + '</span>' +
             '<span>' + _esc(item.label) + '</span>' +
           '</' + tag + '>';
  }

  function _renderGroup(grp) {
    var collapsed = grp.collapsed ? ' lt-collapsed' : '';
    var children = (grp.items || []).map(function (item) {
      return _renderItem(item, true);
    }).join('');
    return '<div class="lt-sb-group' + collapsed + '" data-group-id="' + _esc(grp.id) + '">' +
             '<div class="lt-sb-group-hdr">' +
               '<span>' + _esc(grp.label) + '</span>' +
               '<span class="material-symbols-outlined lt-sb-group-arrow">keyboard_arrow_up</span>' +
             '</div>' +
             '<div class="lt-sb-group-children">' + children + '</div>' +
           '</div>';
  }

  function _renderNav() {
    var nav = window.LUMITURE_NAV || [];
    var html = '<div class="lt-sb-nav">';
    nav.forEach(function (entry) {
      if (entry.type === 'group') {
        html += _renderGroup(entry);
      } else {
        html += _renderItem(entry, false);
      }
    });
    html += '</div>';
    return html;
  }

  function _renderCollapseBtn() {
    return '<div class="lt-sb-collapse-btn">' +
             '<button type="button" data-action="toggle-collapse" title="Collapse sidebar">' +
               '<span class="material-symbols-outlined">chevron_left</span>' +
             '</button>' +
           '</div>';
  }

  // ===== Mount =====
  function _render() {
    var mount = document.getElementById('lt-sidebar');
    if (!mount) {
      console.warn('[lumiture-sidebar] Mount point #lt-sidebar not found');
      return;
    }
    // If mount is not already a sidebar, wrap it
    mount.classList.add('lt-sidebar');
    mount.innerHTML = _renderLogo() + _renderNav() + _renderCollapseBtn();

    // Group toggle
    mount.querySelectorAll('.lt-sb-group-hdr').forEach(function (hdr) {
      hdr.addEventListener('click', function () {
        var grp = hdr.parentElement;
        if (grp) grp.classList.toggle('lt-collapsed');
      });
    });
    // Collapse the whole sidebar
    var btn = mount.querySelector('[data-action="toggle-collapse"]');
    if (btn) {
      btn.addEventListener('click', function () {
        window.LumitureSidebar.toggleCollapse();
      });
    }
  }

  // ===== Public API =====
  window.LumitureSidebar = {
    toggleGroup: function (groupId) {
      var grp = document.querySelector('[data-group-id="' + groupId + '"]');
      if (grp) grp.classList.toggle('lt-collapsed');
    },
    toggleCollapse: function () {
      var sb = document.getElementById('lt-sidebar');
      var main = document.querySelector('.lt-main, .main, main');
      if (sb) sb.classList.toggle('lt-collapsed');
      if (main) main.classList.toggle('lt-sidebar-collapsed');
      // Sync legacy CSS vars (--sw) for prototypes that reference them in topbar / footer
      var w = sb && sb.classList.contains('lt-collapsed') ? '64px' : '250px';
      document.documentElement.style.setProperty('--sw', w);
      document.documentElement.style.setProperty('--lt-sb-w', w);
    },
    setActive: function (itemId) {
      window.LUMITURE_ACTIVE = itemId;
      document.querySelectorAll('.lt-sb-item, .lt-sb-subitem').forEach(function (el) {
        el.classList.toggle('lt-active', el.dataset.navId === itemId);
      });
    },
    rerender: _render,
  };

  // 頁面自己沒設 favicon 才補，分頁列一眼分得出 prototype 跟正式站
  function _injectFavicon() {
    if (document.querySelector('link[rel~="icon"]')) return;
    var l = document.createElement('link');
    l.rel = 'icon'; l.type = 'image/svg+xml';
    l.href = 'data:image/svg+xml,' + encodeURIComponent(FAVICON_SVG);
    document.head.appendChild(l);
  }

  // ===== INIT =====
  function _init() {
    _injectCSS();
    _injectFavicon();
    _render();
    // Dispatch resize so chart libraries (ECharts 等) 重新測量容器
    // —— 避免 inline script 已先 init chart 後，shared CSS 才 inject 導致 layout shift
    requestAnimationFrame(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

  function _injectCSS() {
    if (document.getElementById('lt-topbar-css')) return;
    var s = document.createElement('style');
    s.id = 'lt-topbar-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function _user() {
    var u = Object.assign({}, DEFAULT_USER, window.LUMITURE_USER || {});
    u.quota = Object.assign({}, DEFAULT_USER.quota, (window.LUMITURE_USER || {}).quota || {});
    return u;
  }
  function _status(used, total) {
    if (!total || total <= 0) return 'active';
    var pct = used / total * 100;
    if (pct >= 100) return 'depleted';
    if (pct >= 80)  return 'warning';
    return 'active';
  }
  function _planItems(plan) {
    return PLAN_QUOTA_ITEMS[plan] != null ? PLAN_QUOTA_ITEMS[plan] : PLAN_QUOTA_ITEMS.Standard;
  }
  function _showQuotaBox(u) {
    return _planItems(u.plan).length > 0;
  }

  // ===== Renderers =====
  function _renderIcon(item) {
    var attrs = ' class="lt-tb-ic" title="' + _esc(item.title || '') + '"';
    if (item.onclick) attrs += ' onclick="' + _esc(item.onclick) + '"';
    var badge = item.badge ? '<span class="lt-tb-badge"></span>' : '';
    return '<button type="button"' + attrs + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon) + '</span>' + badge +
           '</button>';
  }

  function _renderUserChip(u) {
    return '<button type="button" class="lt-tb-user" id="lt-tb-user" aria-haspopup="true" aria-expanded="false">' +
             '<span class="material-symbols-outlined lt-tb-avatar-ic">account_circle</span>' +
             '<div class="lt-tb-user-text">' +
               '<span class="lt-tb-user-name">' + _esc(u.name) + '</span>' +
               '<span class="lt-tb-user-role" id="lt-tb-user-role">' + _esc(u.role) + '</span>' +
             '</div>' +
             '<span class="material-symbols-outlined lt-tb-chev">keyboard_arrow_down</span>' +
           '</button>';
  }

  function _renderQuotaItem(key, q, opts) {
    opts = opts || {};
    var meta = QUOTA_META[key];
    // Premium：unlimited（無 used/total，cyan + sparkle，不可點）
    if (opts.unlimited) {
      return '<div class="lt-q-item is-unlimited">' +
               '<span class="lt-q-dot"></span>' +
               '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
               '<span class="lt-q-val">Unlimited<span class="material-symbols-outlined">auto_awesome</span></span>' +
             '</div>';
    }
    var used = q.used || 0, total = q.total || 0;
    var remaining = Math.max(0, total - used);
    var st = _status(used, total);
    // Warning / Depleted 才有 hover tooltip 說明（取代原本點開的 Limit Reached 對話框；
    // PM 確認無法提供 per-user 業務 email，故改輕量懸停說明，無 Contact Sales 動作）
    // 文案含變數 {total} {unit} {label}；{label}=Cost Dashboard / Usage Optimization
    var tip = '';
    if (st === 'depleted' || st === 'warning') {
      var verb = st === 'depleted' ? 'has been reached' : 'is approaching';
      var tipText = 'Your monthly limit (' + total.toLocaleString() + ' ' + meta.unit + ') ' + verb +
        ' for ' + meta.dialogLabel + '. Please contact your LumiTure.ai representative to purchase ' +
        'Add-ons to increase your quota for this billing cycle.';
      tip = '<span class="lt-q-tip">' + _esc(tipText) + '</span>';
    }
    var hasTip = tip !== '';
    return '<div class="lt-q-item is-' + st + (hasTip ? ' has-tip' : '') + '"' + (hasTip ? ' tabindex="0"' : '') + '>' +
             '<span class="lt-q-dot"></span>' +
             '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
             '<span class="lt-q-val">' + remaining.toLocaleString() + ' / ' + total.toLocaleString() + ' left</span>' +
             tip +
           '</div>';
  }

  function _renderQuotaBox(u) {
    var isPremium = u.plan === 'Premium';
    var items = _planItems(u.plan);
    if (!items.length && !isPremium) return '';   // 無有效 plan：不顯示（理論上不會發生）
    // Premium（unlimited）不重置 → header 只顯示 Org-wide，不接 refresh 日
    var sub = isPremium ? 'Org-wide' : 'Org-wide, refresh on ' + _esc(u.quota.refreshDate);
    var head = '<div class="lt-q-head">' +
                 '<span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-sub">' + sub + '</span>' +
               '</div>';
    // loading（refresh 日也尚未載入 → sub 一併 skeleton）
    if (u.quota.state === 'loading') {
      return '<div class="lt-q">' +
               '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-skel lt-q-skel-sub"></span></div>' +
               '<div class="lt-q-skel" style="width:78%"></div><div class="lt-q-skel" style="width:62%"></div>' +
             '</div>';
    }
    // error（partial degrade：只有這塊壞，menu 其他項照常）；refresh 日未載入 → sub 只顯示 Org-wide；Retry 右對齊
    if (u.quota.state === 'error') {
      var headErr = '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span><span class="lt-q-sub">Org-wide</span></div>';
      return '<div class="lt-q">' + headErr +
               '<div class="lt-q-err"><span class="material-symbols-outlined">help</span>' +
               '<span class="lt-q-err-msg">Couldn\'t load quota</span>' +
               '<a onclick="window.LumitureTopbar.rerender()">Retry</a></div>' +
             '</div>';
    }
    var rows = isPremium
      ? ['analyses', 'rightsizing'].map(function (k) { return _renderQuotaItem(k, {}, { unlimited: true }); }).join('')
      : items.map(function (k) { return _renderQuotaItem(k, u.quota[k] || {}); }).join('');
    // add-on 行（packs>0，Premium 不適用）；naming 對齊 PRD：單數 "AI Quota Add-on × N"
    var addon = (!isPremium && (u.addonPacks || 0) > 0)
      ? '<div class="lt-q-addon"><span class="material-symbols-outlined">auto_awesome</span>' +
          u.addonPacks + ' × AI Quota Add-ons Activated</div>'
      : '';
    return '<div class="lt-q">' + head + rows + addon + '</div>';
  }

  function _renderMenu(u) {
    var planName = _esc(u.plan) + ' Plan';
    var bannerStyle = PLAN_BANNER[u.plan] || PLAN_BANNER.Standard;
    var viewAs = u.canSwitchRole
      ? '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'View as Another Role\')">' +
          '<span class="material-symbols-outlined">sync_alt</span>View as Another Role</button>' +
        '<div class="lt-am-div"></div>'
      : '';
    var box = _renderQuotaBox(u);
    var quotaSection = box
      ? '<div class="lt-am-div"></div>' + box + '<div class="lt-am-div"></div>'
      : '<div class="lt-am-div"></div>';
    return '<div class="lt-am-backdrop" id="lt-am-backdrop" onclick="window.LumitureTopbar.closeMenu()"></div>' +
           '<div class="lt-am" id="lt-am" role="menu">' +
             '<div class="lt-am-plan" style="' + bannerStyle + '">' +
               '<span class="lt-am-plan-name">' + planName + '</span>' +
               '<span class="lt-am-plan-date">' + _esc(u.planDateRange) + '</span>' +
             '</div>' +
             '<div class="lt-am-id">' +
               '<div class="lt-am-id-name">' + _esc(u.name) + '</div>' +
               '<div class="lt-am-id-email">' + _esc(u.email) + '</div>' +
               '<span class="lt-am-chip"><span class="material-symbols-outlined">account_circle</span>' + _esc(u.role) + '</span>' +
             '</div>' +
             quotaSection +
             viewAs +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Profile\')">' +
               '<span class="material-symbols-outlined">person</span>Profile</button>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Settings\')">' +
               '<span class="material-symbols-outlined">settings</span>Settings</button>' +
             '<div class="lt-am-div"></div>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Log out\')">' +
               '<span class="material-symbols-outlined">logout</span>Log out</button>' +
           '</div>';
  }

  // ===== Mount / state =====
  var _menuOpen = false;

  function _render() {
    var mount = document.getElementById('lt-topbar');
    if (!mount) { console.warn('[lumiture-topbar] Mount point #lt-topbar not found'); return; }
    var u = _user();
    var icons = window.LUMITURE_TOPBAR_ICONS || DEFAULT_ICONS;
    mount.classList.add('lt-topbar');
    mount.innerHTML = icons.map(_renderIcon).join('') + _renderUserChip(u);
    var chip = document.getElementById('lt-tb-user');
    if (chip) chip.addEventListener('click', function (e) { e.stopPropagation(); _toggleMenu(); });
    _menuOpen = false;
  }

  function _menuHost() {
    var host = document.getElementById('lt-am-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'lt-am-host';
      document.body.appendChild(host);
    }
    return host;
  }

  function _openMenu() {
    var u = _user();
    _menuHost().innerHTML = _renderMenu(u);
    _menuOpen = true;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.add('is-open'); chip.setAttribute('aria-expanded', 'true'); }
  }
  function _closeMenu() {
    _menuHost().innerHTML = '';
    _menuOpen = false;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.remove('is-open'); chip.setAttribute('aria-expanded', 'false'); }
  }
  function _toggleMenu() { _menuOpen ? _closeMenu() : _openMenu(); }

  // Esc 關閉 menu
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && _menuOpen) _closeMenu();
  });

  // ===== Public API =====
  window.LumitureTopbar = {
    setUser: function (user) {
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, user || {});
      _render(); if (_menuOpen) _openMenu();
    },
    setRole: function (role) {
      var el = document.getElementById('lt-tb-user-role');
      if (el) el.textContent = role;
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, { role: role });
      if (_menuOpen) _openMenu();
    },
    setPlan: function (plan) {
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, { plan: plan });
      if (_menuOpen) _openMenu();
    },
    setQuota: function (q) {
      var cur = (window.LUMITURE_USER || {});
      window.LUMITURE_USER = Object.assign({}, cur, {
        quota: Object.assign({}, DEFAULT_USER.quota, cur.quota || {}, q || {}),
      });
      if (q && typeof q.addonPacks !== 'undefined') window.LUMITURE_USER.addonPacks = q.addonPacks;
      if (_menuOpen) _openMenu();
    },
    openMenu: _openMenu,

function buildItems() {
  return RES.map((r, ri) => {
    const it = { id: r.id, platform: r.platform, name: r.name, rid: r.rid, cost: r.cost, off: r.off, groups: r.groups.slice(), pin: !!r.pin, old: !!r.old, idx: ri, children: [] };
    const n = r.total - 1;
    for (let k = 0; k < n; k++) {
      const off = Math.min(29, r.off + 1 + Math.floor(k * (29 - r.off) / Math.max(n, 1)));
      const cost = Math.round(r.cost * (0.35 + ((k * 37 + ri * 11) % 90) / 50) * 100) / 100;
      /* 子列群組：輪流用父列的群組；k=1（BigQuery 第二筆）依 Figma 用 Lab Technicians；偶爾沒有子群組 → '--' */
      const gs = r.id === 'r1' && k === 1 ? [G.lab] : r.groups.length ? [r.groups[k % r.groups.length]] : [];
      it.children.push({ id: r.id + '-c' + k, platform: r.platform, name: r.name, rid: r.rid, cost, off, groups: gs, pin: (r.childPins || []).includes(k), old: false, idx: ri, children: [] });
    }
    return it;
  });
}

 * ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const MON = ['Jan.', 'Feb.', 'Mar.', 'Apr.', 'May.', 'Jun.', 'Jul.', 'Aug.', 'Sep.', 'Oct.', 'Nov.', 'Dec.'];
const fmtDMY = d => d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();   // Figma：4 Jan. 2036
const fmtMoney = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dateOf = off => new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - off);
const role = () => ROLES[state.role];

/* Assigned to：字母升冪、逗號隔開；沒有子群組 → '--'。T2 整欄不顯示（見 hideAssigned()）*/
function groupsOf(it) { return role().tier === 2 ? [] : it.groups.slice().sort((a, b) => a.localeCompare(b)); }
function assignedTip(gs) {
  if (!gs.length) return COPY.dashTip;
  if (gs.length === 1) return gs[0];                                            // 只有 1 筆時不需顯示項目符號
  const shown = gs.slice(0, MAX_TIP_GROUPS).map(g => '• ' + g);
  if (gs.length > MAX_TIP_GROUPS) shown.push('...+' + (gs.length - MAX_TIP_GROUPS) + ' more, view full list in detail page.');
  return shown.join('\n');
}
/* 非 Admin 只看得到自己有權限的資源告警（#01-7）。⚠ 設計端暫擬：Figma 沒定義 mock 範圍，T1 看前 11 組、T2 看前 7 組（含被釘選的過期項目要看得到者，保留 r15）*/
function visibleParents() {
  const t = role().tier, lim = t === 0 ? 99 : t === 1 ? 11 : 7;
  return state.items.filter(it => it.idx < lim || it.old && t < 2);
}
function allVisible() { return visibleParents().filter(it => !it.old); }          // All 視角：最近 30 天
function pinnedFlat() {                                                              // Pinned 視角：遞迴撈出所有已釘選、清空 children 攤平，依時間新→舊
  const out = [];
  visibleParents().forEach(it => { if (it.pin) out.push(it); it.children.forEach(c => { if (c.pin) out.push(c); }); });
  return out.sort((a, b) => a.off - b.off);
}
function findItem(id) {
  for (const it of state.items) { if (it.id === id) return it; for (const c of it.children) if (c.id === id) return c; }
  return null;
}

/* ============================================================
 * 4. List view（#01～#01-9）
 * ============================================================ */
const ACT = {};   // data-a 事件處理表（全站 click 委派）

function headerHtml() { return `<div class="hdr-block"><div class="pg-hdr"><h1 class="pg-title">${COPY.title}</h1></div><div class="pg-desc">${esc(COPY.desc)}</div></div>`; }

function chipHtml() {
  const s = state.settings;
  return s.detection
    ? `<span class="st-chip"><span class="dot"></span><span class="tx">Detection Enabled  (Sensitivity: ${s.sensitivity})</span></span>`
    : `<span class="st-chip off"><span class="dot"></span><span class="tx">Detection Disabled</span></span>`;
}
/* mode: full（標題＋設定＋chip＋切換器）／empty（#01-4：沒有標題與切換器）／loading（#01-6）*/
function toolbarHtml(mode) {
  const canSet = role().settings;
  const loading = mode === 'loading';
  const settingsBtn = canSet ? `<button class="lnk-btn" data-a="open-settings" ${loading ? 'disabled' : ''}><span class="material-symbols-outlined">settings</span><span class="t">${COPY.settingsBtn}</span></button>` : '';
  const chip = loading ? '<span class="st-chip skel"><span class="sk" style="width:224px"></span></span>' : chipHtml();
  const tg = mode === 'empty' ? '' : `<div class="tg ${loading ? 'is-disabled' : ''}" role="group" aria-label="Alert list view"><button class="tgb t-all ${state.view === 'all' ? 'on' : ''}" data-a="view" data-v="all" ${loading ? 'disabled' : ''}>All</button><i class="sep"></i><button class="tgb t-pin ${state.view === 'pinned' ? 'on' : ''}" data-a="view" data-v="pinned" aria-label="Pinned" ${loading ? 'disabled' : ''}><span class="material-symbols-outlined">keep</span></button></div>`;
  return `<div class="toolbar ${mode === 'empty' ? 'is-empty' : ''}">${mode === 'empty' ? '<span class="tb-title none"></span>' : `<h2 class="tb-title">${COPY.listTitle}</h2>`}<div class="tb-r">${settingsBtn}${chip}${tg}</div></div>`;
}

/* ⚠ 未確認：pin tooltip 只在 Figma #01-3 已釘選那顆畫出，文案卻寫「超過 30 天」；FE 一律掛。這裡掛在所有已釘選的 pin 上 */
function pinBtn(it) {
  const on = it.pin;
  return `<button class="ib pin ${on ? 'on' : ''}" data-a="pin" data-id="${esc(it.id)}" aria-pressed="${on}" aria-label="${on ? 'Unpin anomaly' : 'Pin anomaly'}" ${on ? `data-tip="${esc(COPY.pinTip)}"` : ''}><span class="material-symbols-outlined">keep</span></button>`;
}
/* kind：'p' 父列（可展開）／'c' 子列／'f' Pinned 視角攤平的單列 */
function rowHtml(it, kind) {
  const can = kind === 'p' && it.children.length > 0;
  const open = can && state.expanded.has(it.id);
  const total = it.children.length + 1;
  const badge = can ? `<span class="cnt">${total > MAX_BADGE ? MAX_BADGE + '+' : total}</span>` : '';
  const gs = groupsOf(it);
  const txt = gs.length ? esc(gs.join(', ')) : '<span class="dash">--</span>';
  const noAssigned = hideAssigned();
  const cls = (kind === 'c' ? 'is-child ' : '') + (open ? 'is-open' : '');
  const nameTip = `${it.name} (${it.rid})`;
  const tw = kind === 'c' ? '' : `<span class="tw ${open ? 'open' : ''}">${can ? '<i></i>' : ''}</span>`;
  return `<div class="tr ${cls}" role="row" data-rid="${esc(it.id)}">
    <div class="td res st-l ${can ? 'can' : ''}" role="cell" ${can ? `data-a="toggle" data-id="${esc(it.id)}" tabindex="0" aria-expanded="${open}"` : ''} data-tip="${esc(nameTip)}" data-tip-pos="below" data-tip-anchor=".cell-2l">${tw}<span class="csp">${CSP[it.platform].logo}</span><div class="cell-2l"><div class="l1">${esc(it.name)}</div><div class="l2">${esc(it.rid)}</div></div>${badge}</div>
    <div class="td" role="cell"><span class="ell">${CURRENCY} ${fmtMoney(it.cost)}</span></div>
    <div class="td" role="cell"><span class="ell">${fmtDMY(dateOf(it.off))}</span></div>
    ${noAssigned ? '' : `<div class="td asg" role="cell" data-tip="${esc(assignedTip(gs))}" data-tip-pos="below" data-tip-dy="-2" data-tip-align="content-right"><span class="ell">${txt}</span></div>`}
    <div class="td act st-r" role="cell">${pinBtn(it)}<button class="ib" data-a="detail" data-id="${esc(it.id)}" aria-label="Check anomaly details" data-tip="${esc(COPY.detailTip)}"><span class="material-symbols-outlined">description</span></button></div>
  </div>`;
}
/* ⚠ DEVIATION（偏離 FE 與 #01-7 紫便條，照設計稿畫面）：T2 整欄藏起 Assigned to。
 * #01-7 紫便條寫「因會動到後端資料流，約定暫時維持顯示、內容為 --」，FE 也是這樣做；Kabin 2026-10-09 驗收裁決照畫面（設計定義）藏起來——
 * 紫便條代表開發現實跟設計的差異，她偏好保留設計定義。藏欄後也不會出現「--」懸停說明對 T2 不成立的問題（對稿紀錄 §5 #4）*/
function hideAssigned() { return role().tier === 2; }
function tableHtml(rows) {
  const na = hideAssigned();
  return `<div class="tbl-scroll ${na ? 'no-assigned' : ''}" id="tbl-scroll" role="table" aria-label="Anomaly alerts">
    <div class="tr th-row" role="row">
      <div class="th st-l" role="columnheader" style="padding-left:16px">Resource Name / ID</div>
      <div class="th" role="columnheader">Actual Cost</div>
      <div class="th" role="columnheader">Anomaly Date</div>
      ${na ? '' : `<div class="th" role="columnheader">Assigned to<span class="material-symbols-outlined info" id="assigned-info" data-tip="${esc(COPY.assignedTip)}">info</span></div>`}
      <div class="th st-r" role="columnheader">Action</div>
    </div>
    <div class="tbody" role="rowgroup">${rows}</div></div>`;
}
function bodyRows() {
  if (state.view === 'pinned') return pinnedFlat().map(it => rowHtml(it, 'f')).join('');
  return allVisible().map(it => rowHtml(it, 'p') + (state.expanded.has(it.id) ? it.children.map(c => rowHtml(c, 'c')).join('') : '')).join('');
}
function skelCard() {
  const na = hideAssigned();
  const row = () => `<div class="sk-row"><div class="sk" style="width:100%"></div></div>`;
  const rrow = () => `<div class="sk-row"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`;
  return `<div class="card" role="status" aria-label="Loading">${toolbarHtml('loading')}
    <div class="sk-tbl"><div class="sk-left"><div class="sk-hd"><div class="sk" style="width:100px"></div></div>${row() + row() + row() + row()}</div><div class="sk-div"></div>
    <div class="sk-right"><div class="sk-hd"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>${rrow() + rrow() + rrow() + rrow()}</div></div></div>`;
}
function esCard(inner, tall) { return `<div class="card ${tall ? 'is-tall' : ''}"><div class="es">${inner}</div></div>`; }
const ILLUS_TABLE = '<span class="material-symbols-outlined es-ic is-outline">table_view</span>';

function renderList() {
  const root = $('#content');
  const sc0 = $('#tbl-scroll');
  const keep = sc0 ? { t: sc0.scrollTop, l: sc0.scrollLeft } : null;
  const ps = state.pageState;
  let body;
  const list = allVisible();
  if (ps === 'loading') body = skelCard();
  else if (ps === 'empty' || (ps === 'set' && !list.length && !pinnedFlat().length)) {
    /* #01-4：時間範圍內沒有任何異常偵測告警 → 空狀態；仍可進行告警設定（Alert Settings 與 chip 還在，Alert List 標題與切換器消失）*/
    body = `<div class="card is-tall">${toolbarHtml('empty')}<div class="es">${ILLUS_TABLE}<div class="es-title">${COPY.empty.title}</div><div class="es-desc">${esc(COPY.empty.desc)}</div></div></div>`;
  } else if (ps === 'no-auth') {
    const admin = role().canAddAuth;
    body = esCard(`${ILLUS_AUTH}<div class="es-title">${COPY.noAuth.title}</div><div class="es-desc">${esc(admin ? COPY.noAuth.admin : COPY.noAuth.nonAdmin)}</div>${admin ? `<a class="btn btn-p" href="./organization-settings.html"><span class="material-symbols-outlined ic-add">add</span>${COPY.noAuth.btn}</a>` : ''}`, true);
  } else if (ps === 'error') body = esCard(`${ILLUS_ERR}<div class="es-title">${COPY.error.title}</div><div class="es-desc">${esc(COPY.error.desc)}</div>`, true);
  else {
    const pinnedEmpty = state.view === 'pinned' && !pinnedFlat().length;
    if (pinnedEmpty) body = `<div class="card is-tall">${toolbarHtml('full')}<div class="es"><span class="material-symbols-outlined es-ic">keep</span><div class="es-title">${COPY.pinnedEmpty.title}</div><div class="es-desc">${esc(COPY.pinnedEmpty.desc)}</div></div></div>`;
    else body = `<div class="card">${toolbarHtml('full')}${tableHtml(bodyRows())}</div>`;
  }
  root.innerHTML = headerHtml() + body;
  const sc = $('#tbl-scroll');
  if (sc && keep) { sc.scrollTop = keep.t; sc.scrollLeft = keep.l; }
}

Object.assign(ACT, {
  'view': el => { if (state.view === el.dataset.v) return; state.view = el.dataset.v; renderList(); },
  'toggle': el => { const id = el.dataset.id; state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); renderList(); },
  /* Pin：optimistic update（先改再送 API，失敗回滾；prototype 只做前半）。Pinned 視角取消釘選後該列直接消失；超過 30 天的告警取消釘選後永久消失（pin tooltip 的說明）*/
  'pin': (el, e) => {
    e.stopPropagation();
    const it = findItem(el.dataset.id); if (!it) return;
    it.pin = !it.pin;
    if (!it.pin && it.old) state.items = state.items.filter(x => x.id !== it.id);
    const tip = $('#gl-tip'); if (tip) tip.style.display = 'none';
    renderList();
  },
  /* ⚠ 設計端暫擬：詳情頁（#02 系列）另一輪製作，入口先以 toast 說明 */
  'detail': (el, e) => { e.stopPropagation(); toast('info', COPY.detailLater); },
  'open-settings': () => openSettings()
});
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && e.target.matches && e.target.matches('.td.res.can')) { e.preventDefault(); e.target.click(); }
  if ((e.key === ' ' || e.key === 'Enter') && e.target.matches && e.target.matches('.sw[data-a]')) { e.preventDefault(); e.target.click(); }
});

/* ============================================================
 * 5. Alert Settings 彈窗（#03-1／#03-2）— 只有 Admin 進得來
 * ============================================================ */
function openSettings(draft) {
  state.draft = draft || { detection: state.settings.detection, sensitivity: state.settings.sensitivity, notif: Object.assign({}, state.settings.notif) };
  renderSettings();
}
function swRow(on, act, key, disabled, label) {
  return `<span class="swrow ${disabled ? 'is-disabled' : ''}" ${disabled ? '' : `data-a="${act}" data-k="${key || ''}"`}><span class="sw ${on ? 'on' : ''} ${disabled ? 'is-disabled' : ''}" role="switch" aria-checked="${on}" ${disabled ? 'aria-disabled="true"' : `tabindex="0" data-a="${act}" data-k="${key || ''}"`} aria-label="${esc(label)}"></span><span>${on ? 'ON' : 'OFF'}</span></span>`;
}
function renderSettings() {
  const d = state.draft; if (!d) return;
  const off = !d.detection;
  const keepScroll = ($('#modal-root .m-scroll') || {}).scrollTop || 0;
  const roles = NOTIF_ROLES.map(([k, l]) => `<div class="role"><div class="rl">${l}</div>${swRow(d.notif[k], 'sm-notif', k, off, l)}</div>${NOTIF_DIVIDE_AFTER.includes(k) ? '<hr>' : ''}`).join('');
  $('#modal-root').innerHTML = `<div class="mask"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="sm-t">
    <div class="m-hd"><h2 id="sm-t">${COPY.settings.title}</h2><button class="m-x" data-a="m-close" aria-label="Close"><span class="material-symbols-outlined">close</span></button></div>
    <div class="m-desc">${esc(COPY.settings.desc)}</div>
    <div class="m-scroll"><div class="m-inner">
      <div class="fld"><div class="lbl">${COPY.settings.detection}</div>${swRow(d.detection, 'sm-det', '', false, 'Detection')}</div>
      <div class="sens ${off ? 'is-disabled' : ''}"><div class="fld"><div class="lbl">${COPY.settings.sensitivity}</div><button class="sel" id="sm-sel" data-a="sm-sens" ${off ? 'disabled' : ''} aria-haspopup="listbox"><span>${d.sensitivity}</span><span class="tri"></span></button></div><div class="help">${esc(COPY.settings.sensHelp)}</div></div>
      <div class="nbox ${off ? 'is-disabled' : ''}"><div class="intro"><h3>${COPY.settings.notif}</h3><div class="help">${esc(COPY.settings.notifDesc)}</div></div>${roles.replace(/<hr>$/, '')}</div>
    </div></div>
    <div class="m-ft"><button class="btn btn-o" data-a="m-close">Cancel</button><button class="btn btn-p" data-a="sm-save">Save</button></div></div></div>`;
  const sc = $('#modal-root .m-scroll'); if (sc) sc.scrollTop = keepScroll;
  const b = $('#modal-root .btn-p'); if (b && !document.activeElement.closest('#modal-root')) b.focus({ preventScroll: true });
}
function closeModal() { closePop(); $('#modal-root').innerHTML = ''; state.draft = null; }
Object.assign(ACT, {
  'm-close': () => closeModal(),
  /* Detection 關閉時：下半部（敏感度、通知）呈現 Disabled，但仍維持原設定（#03-2 紫便條）*/
  'sm-det': () => { state.draft.detection = !state.draft.detection; closePop(); renderSettings(); },
  'sm-notif': el => { const k = el.dataset.k; state.draft.notif[k] = !state.draft.notif[k]; renderSettings(); },
  'sm-sens': el => openSensMenu(el),
  'sm-pick': el => { state.draft.sensitivity = el.dataset.v; closePop(); renderSettings(); },
  'sm-save': () => {
    const d = state.draft; closeModal();
    if (state.failNext) { state.failNext = false; toast('error', COPY.toast.fail); return; }   // #Toast：因連線等其他不可避原因導致失敗者，關閉彈窗並顯示 Toast 於左下角
    state.settings = { detection: d.detection, sensitivity: d.sensitivity, notif: Object.assign({}, d.notif) };
    renderList(); toast('ok', COPY.toast.ok);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (POP) closePop(); else if ($('#modal-root').firstChild) closeModal(); } });

/* ---- 單選下拉（Detection Sensitivity）----*/
let POP = null;
function openSensMenu(el) {
  if (POP) { closePop(); return; }
  const r = el.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'pop menu'; pop.setAttribute('role', 'listbox'); pop.style.minWidth = Math.max(r.width, 240) + 'px';
  pop.innerHTML = SENS.map(s => { const on = state.draft.sensitivity === s; return `<div class="mi ${on ? 'is-sel' : ''}" role="option" aria-selected="${on}" data-a="sm-pick" data-v="${s}"><span>${s}</span>${on ? '<span class="material-symbols-outlined ck">check</span>' : ''}</div>`; }).join('');
  document.body.appendChild(pop);
  pop.style.left = r.left + 'px';
  const h = pop.offsetHeight;
  pop.style.top = (r.bottom + 4 + h > window.innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  el.classList.add('open'); POP = { pop, anchor: el };
}
function closePop() { if (!POP) return; POP.pop.remove(); POP.anchor.classList && POP.anchor.classList.remove('open'); POP = null; }
document.addEventListener('mousedown', e => { if (POP && !e.target.closest('.pop') && !e.target.closest('#sm-sel')) closePop(); });
window.addEventListener('resize', () => closePop());
document.addEventListener('scroll', e => { if (POP && !(e.target.closest && e.target.closest('.pop'))) closePop(); }, true);

/* ============================================================
 * 6. Toast
 * ============================================================ */
function toast(kind, msg) {
  const wrap = $('#toast-wrap'), el = document.createElement('div');
  el.className = 'toast ' + (kind === 'error' ? 'err' : kind === 'info' ? 'info' : '');
  el.innerHTML = `<span class="material-symbols-outlined">${kind === 'error' ? 'error' : kind === 'info' ? 'info' : 'check_circle'}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, 4200);
}

/* ============================================================
 * 7. 事件委派
 * ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-a]');
  if (!el) return;
  if (el.disabled) return;
  const fn = ACT[el.dataset.a]; if (fn) fn(el, e);
});
/* 彈窗點遮罩空白處不關閉（Figma 註記只有 Save／Cancel 兩種結束方式，加上右上 X）*/
</script>
<script>
/* ============================================================

window.DEMO_PAGES = [
  { id: 'role',     label: 'Role',     icon: 'person' },

window.DEMO_SCENARIOS = [

  { id: 't1m',   page: 'role', label: 'T1 Manager',    icon: 'supervisor_account',   tip: '#01-7：隱藏 Alert Settings 按鈕，只看得到自己有權限的資源告警。No-auth 是請聯絡管理員版（#01-8）。' },
  { id: 't1mb',  page: 'role', label: 'T1 Member',     icon: 'badge',                tip: '同 T1 Manager。這頁沒有 Manager / Member 差異。' },

  { id: 'loading',  page: 'state', group: 'List 狀態', label: 'Loading skeleton (#01-6)',    icon: 'hourglass_top', tip: 'Alert Settings、All/Pinned 切換器 Disabled，chip 與表格換成 skeleton。' },
  { id: 'empty',    page: 'state', group: 'List 狀態', label: 'No anomaly alerts (#01-4)',   icon: 'monitoring', tip: '沒有 Alert List 標題與切換器；仍可進行告警設定（Admin）。' },
  { id: 'no-auth',  page: 'state', group: 'List 狀態', label: 'No authorization：Admin (#01-5)', icon: 'lock_open', tip: '提示 Admin 前往授權；角色切到非 Admin 就是 #01-8 文案、無按鈕。' },

function setRole(id) { state.role = id; if (window.LumitureTopbar) LumitureTopbar.setRole(ROLES[id].chip); }
let _listShown = false;
function showList(opts) {
  closeModal(); opts = opts || {};
  const first = !_listShown; _listShown = true;
  if (first && state.pageState === 'set' && !opts.noSkel) {   // Kabin 偏好：切進「有資料」畫面前故意跑一次 skeleton
    state.pageState = 'loading'; renderList();

  } else renderList();
  window.scrollTo(0, 0);
}
function setPageState(id) { state.pageState = id; _listShown = true; showList(); }
function resetData() { state.items = buildItems(); state.expanded = new Set(); state.view = 'all'; }
/* 用合成 mouse 事件觸發 #gl-tip（Demo 用，讓靜態畫面也看得到懸停態）*/
function simHover(sel) {
  const el = document.querySelector(sel); if (!el) return;
  el.scrollIntoView({ block: 'center', inline: 'nearest' });
  const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const init = { bubbles: true, clientX: x, clientY: y };
  el.dispatchEvent(new MouseEvent('mouseover', init)); el.dispatchEvent(new MouseEvent('mousemove', init));
}
const later = fn => setTimeout(fn, 80);

window.DEMO_APPLY = function (id) {
  closePop(); closeModal();
  const tip = document.getElementById('gl-tip'); if (tip) tip.style.display = 'none';
  if (ROLES[id]) { setRole(id); if (state.pageState === 'set') state.pageState = 'set'; renderList(); return; }
  if (['set', 'loading', 'empty', 'no-auth', 'error'].includes(id)) { if (id === 'set') { resetData(); state.settings.detection = true; } setPageState(id); return; }
  if (id === 'no-auth-na') { setRole('t1m'); setPageState('no-auth'); return; }
  if (id === 'det-off') { state.pageState = 'set'; state.settings.detection = false; showList({ noSkel: true }); return; }
  if (id === 'det-on') { state.pageState = 'set'; state.settings.detection = true; state.settings.sensitivity = 'High'; showList({ noSkel: true }); return; }

  /* ---- View ---- */
  state.pageState = 'set'; _listShown = true;
  if (id === 'v-all') { resetData(); showList({ noSkel: true }); return; }
  if (id === 'v-pinned') { resetData(); state.view = 'pinned'; showList({ noSkel: true }); return; }
  if (id === 'v-pinned-empty') { resetData(); state.items.forEach(it => { it.pin = false; it.children.forEach(c => { c.pin = false; }); }); state.items = state.items.filter(it => !it.old); state.view = 'pinned'; showList({ noSkel: true }); return; }
  if (id === 'v-expand') { resetData(); state.expanded.add('r1'); showList({ noSkel: true }); return; }
  if (id === 'v-expand-many') { resetData(); ['r1', 'r3', 'r7'].forEach(x => state.expanded.add(x)); showList({ noSkel: true }); return; }
  if (id === 'v-t2') { resetData(); setRole('t2m'); showList({ noSkel: true }); return; }
  if (id === 'h-assigned-info') { resetData(); showList({ noSkel: true }); later(() => simHover('#assigned-info')); return; }
  if (id === 'h-assigned-list') { resetData(); showList({ noSkel: true }); later(() => simHover('.tr[data-rid="r8"] .td[data-tip]:not(.res)')); return; }
  if (id === 'h-assigned-dash') { resetData(); showList({ noSkel: true }); later(() => simHover('.tr[data-rid="r2"] .td[data-tip]:not(.res)')); return; }
  if (id === 'h-pin') { resetData(); showList({ noSkel: true }); later(() => simHover('.tr[data-rid="r3"] .ib.pin')); return; }
  if (id === 'h-name') { resetData(); showList({ noSkel: true }); later(() => simHover('.tr[data-rid="r7"] .td.res')); return; }
  if (id === 'h-detail') { resetData(); showList({ noSkel: true }); later(() => simHover('.tr[data-rid="r2"] .ib[data-a="detail"]')); return; }
  if (id === 'd-detail') { resetData(); showList({ noSkel: true }); later(() => { const b = document.querySelector('.ib[data-a="detail"]'); b && b.click(); }); return; }

  /* ---- Settings ---- */
  if (id === 's-fail') { state.failNext = !state.failNext; toast('info', state.failNext ? 'The next Save will fail.' : 'Save will succeed again.'); return; }
  if (id === 't-ok') return toast('ok', COPY.toast.ok);
  if (id === 't-fail') return toast('error', COPY.toast.fail);
  if (id === 't-both') { toast('ok', COPY.toast.ok); toast('error', COPY.toast.fail); return; }
  if (['s-on', 's-off', 's-sens'].includes(id)) {
    setRole('admin'); state.pageState = 'set'; showList({ noSkel: true });
    openSettings({ detection: id !== 's-off', sensitivity: 'Medium', notif: { admin: true, t1Manager: true, t1Member: true, t2Manager: true, t2Member: true } });
    if (id === 's-sens') later(() => { const s = document.getElementById('sm-sel'); s && s.click(); });
    return;
  }
};

(function boot() {

  if (h === 't1m' || h === 't2mb') { setRole(h); setPageState('no-auth'); return; }
  if (map[h]) { _listShown = true; DEMO_APPLY(map[h]); return; }
  showList();
})();

<script>
/* ============================================================
 * 10. Tooltip（#gl-tip）：頁面自己提供，shared demo-fab.js 看到已存在就不注入它「跟著游標跑」的版本（Fable §5 #3）
 *   做法比照 All Resource List v1（兩頁行為一致）：tooltip 錨在元件上，游標在元件裡移動不會漂。
 *   位置依 Figma #01-3 六個 tooltip 量到的：
 *   - Resource 名稱、Assigned to 儲存格：出現在下方（名稱靠文字起點、下緣＋4；Assigned to 貼列底線上 2）
 *   - 表頭 info、Pin、Details：出現在上方 6px
 *   - 水平先靠元件左緣，右邊放不下就改靠元件右緣＋2（Details、Pin、info）；Assigned to 一律對齊內容右緣（r.right−16）
 *   shared 的全站版本要不要也改成錨定，列在對稿紀錄 §8 待 Kabin。
 * ============================================================ */
(function () {
  const tip = document.createElement('div'); tip.id = 'gl-tip'; tip.style.display = 'none'; document.body.appendChild(tip);
  let cur = null;
  function place() {
    if (!cur || !cur.isConnected) { cur = null; tip.style.display = 'none'; return; }
    const a = (cur.dataset.tipAnchor && cur.querySelector(cur.dataset.tipAnchor)) || cur;
    const r = a.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, vw = innerWidth, vh = innerHeight;
    let x = r.left; if (x + tw > vw - 8) x = Math.max(8, Math.min(r.right + 2, vw - 8) - tw);
    /* Fable §7 #3：#01-3 兩個 Assigned to tooltip 右緣都對齊儲存格文字右緣（1200），不是靠左；靠左會蓋到右邊 Pin */
    if (cur.dataset.tipAlign === 'content-right') x = Math.max(8, r.right - 16 - tw);
    const below = cur.dataset.tipPos === 'below', dy = cur.dataset.tipDy != null ? +cur.dataset.tipDy : 4;
    let y = below ? r.bottom + dy : r.top - th - 6;
    if (y < 8) y = r.bottom + 4; if (y + th > vh - 8) y = Math.max(8, r.top - th - 6);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el || (el === cur && tip.style.display !== 'none')) return;
    cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block'; place();
  });
  document.addEventListener('mouseout', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el === cur && !el.contains(e.relatedTarget)) { cur = null; tip.style.display = 'none'; }
  });
  window.addEventListener('scroll', place, true);
  window.addEventListener('resize', place);
})();
</script>
