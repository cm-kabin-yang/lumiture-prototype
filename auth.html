/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-btn:    5px;      /* 2026-10-15 B-8：按鈕／輸入框／下拉觸發欄（FE muiButton、Figma CMDS 都是 5） */
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-modal-sm: 10px;   /* 2026-10-15 B-4：確認類彈窗（Remove／Discard／Select Role） */
  --lt-radius-modal:  15px;     /* 2026-10-15 B-4：表單類彈窗（稿量到 15） */
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */

.inp input::placeholder{color:var(--lt-color-text-tertiary);opacity:1;text-overflow:ellipsis;overflow:hidden}   /* X-9r6 F5：放不下時尾端「…」（稿 #04 是 MUI 預設的省略號），不是硬切 */
.inp:hover:not(.dis),.inp:focus-within:not(.dis){border-color:transparent;outline:2px solid var(--au-input-border);outline-offset:-2px}
.inp.err{border-color:var(--au-error)}
.inp.err:hover,.inp.err:focus-within{border-color:transparent;outline:2px solid var(--au-error);outline-offset:-2px}
.inp.dis{border-color:var(--au-input-disabled-border);background:var(--lt-grey-100);color:var(--au-input-disabled-text);cursor:not-allowed}
.inp.dis input{color:var(--au-input-disabled-text);-webkit-text-fill-color:var(--au-input-disabled-text);cursor:not-allowed}
.eye{display:flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border-radius:50%;color:var(--lt-color-text-secondary);flex:none}
.eye .material-symbols-outlined{font-size:24px}   /* 對稿修正：FE 的 IconButton sx 寫 20，但 muiInputBase sizeLarge 的 .MuiSvgIcon-root 24 選擇器權重較高，實際 24 */
.eye:hover{background:rgba(0,79,176,.04)}
.help{margin-top:4px;font-size:12px;line-height:18px;color:var(--au-error);white-space:pre-line}   /* 對稿修正：FormHelperText 吃 theme caption（lineHeight 18px），不是 MUI 預設 1.66 */
.help:empty{display:none}
/* 「Select」型欄位（Country / Region、Dropdown）：FE MUI Select，外觀同輸入框、右側 arrow_drop_down */
.sel{cursor:pointer;user-select:none}
.sel .sel-v{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--au-input-text)}
.sel .sel-v.ph{color:var(--lt-color-text-tertiary)}
.sel .arr{color:rgba(0,0,0,.54);font-size:24px;flex:none}
/* 電話：旗幟下拉＋區碼＋號碼（FE mui-tel-input，forceCallingCode） */
.tel .cc{display:flex;align-items:center;gap:2px;flex:none;cursor:pointer;padding:0 2px 0 0}
.tel .cc .flag{font-size:20px;line-height:1}
.tel .pre{flex:none;color:var(--au-input-text);margin-right:-4px}
/* Figma 對照樣式：標籤嵌在邊框上的 notch（MUI 預設畫法） */
body.lbl-figma .fld .lbl{position:absolute;z-index:1;top:-8px;left:10px;margin:0;padding:0 4px;background:#fff;font-size:12px;line-height:16px;font-weight:400;color:var(--lt-color-text-secondary);max-width:calc(100% - 20px)}
body.lbl-figma .fld{margin-top:16px}
body.lbl-figma .inp{padding:0 12px}
body.lbl-figma .fld .lbl .ast{color:var(--au-error)}

/* ============================================================
 * 3. 按鈕／連結（FE theme muiButton；Typography variant link／linkBold）
 * ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;min-width:80px;padding:0 16px;border-radius:5px;border:1px solid transparent;font-size:14px;line-height:14px;font-weight:700;white-space:nowrap}
/* ⚠ DEVIATION（Kabin 10/13 裁決按鈕大小寫照稿）：取消 FE 主題的 capitalize，文字照稿逐字（Continue、Got it、Join an Invited Organization、Create a New Organization、Confirm）；原本 .btn 有 text-transform:capitalize，已拿掉 */
.btn.up{text-transform:uppercase}   /* 五頁的送出鈕：稿的文字節點是「Login／Send／Reset Password／Sign up／Activate account」＋textCase UPPER，畫面上是全大寫（LOGIN、SEND…），照稿 */
.btn.nocap{text-transform:none}
.btn.lg{height:44px;font-size:16px;line-height:16px}
.btn.full{width:100%}
.btn.pri{background:var(--lt-color-primary);color:#fff;border-color:var(--lt-color-primary)}
.btn.pri:hover{background:var(--lt-color-primary-hover);border-color:var(--lt-color-primary-hover)}
.btn.pri:active{background:var(--lt-color-primary-active);border-color:var(--lt-color-primary-active)}
.btn.out{background:#fff;color:var(--lt-color-primary);border-color:var(--lt-color-primary)}
.btn.out:hover{background:var(--lt-blue-10)}
.btn.out:active{background:var(--lt-blue-20)}
.btn[disabled],.btn.is-disabled{background:var(--lt-button-disabled-bg);border-color:var(--lt-button-disabled-bg);color:var(--lt-button-disabled-text);cursor:not-allowed}
.spin{display:inline-block;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.btn .spin{width:14px;height:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.lnk{font-size:12px;line-height:18px;font-weight:400;color:var(--lt-color-primary);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;text-underline-position:from-font}
.lnk.b{font-weight:700}
.lnk.plain{color:inherit}
.cap{font-size:12px;line-height:18px}
.row-sb{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row-end{display:flex;align-items:baseline;justify-content:flex-end;gap:8px}   /* 稿 Frame 24 gap 8 */

/* ---- 登入頁：SSO 區塊（FE login/components/SSOButtons.tsx） ---- */
.sso{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:16px}   /* ⚠ DEVIATION（Kabin 10/13 裁決間距照稿）：按鈕到「Or Continue With」16、到圖示 16（稿 Frame 22／SSO gap 16）；FE 6＋8、8 */
.sso-or{display:flex;align-items:center;gap:10px;width:100%}
.sso-or hr{flex:1;border:0;border-top:1px solid rgba(0,0,0,.12)}
.sso-or span{font-size:14px;font-weight:700;line-height:24.5px;color:var(--lt-color-text-tertiary);white-space:nowrap}
.sso-btns{display:flex;gap:16px;align-items:center;justify-content:center}
.sso-b{width:36px;min-width:36px;height:36px;padding:6px;border:1px solid var(--au-input-border);border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center}
.sso-b:hover{background:var(--lt-blue-10)}
.sso-b svg{width:24px;height:24px}
.login-links{margin-top:60px}  /* ⚠ DEVIATION（Kabin 10/13 裁決間距照稿）：SSO 圖示到連結列 60（稿 Frame 20 gap 60）；FE 0 */
.inline-4{display:flex;align-items:center;gap:8px}   /* ⚠ DEVIATION（Kabin 10/13 裁決間距照稿）：「Don't have an account」與 Sign Up 間距 8（稿 Frame 24 gap 8）；FE Stack spacing={1}＝4 */

/* ---- 規則清單（FE PwdRuleListItem：圓點＋caption；Figma 畫勾勾圖示，可切換） ---- */
.rules-h{margin:0;padding-bottom:2px;font-size:14px;font-weight:500;line-height:22px}   /* ⚠ DEVIATION（Kabin 10/13 裁決間距照稿）：Confirm 欄位到標題 16（由欄位 mb 16 給）、標題列高 24（稿 Frame 31）；FE mt 4 */   /* 對稿修正：FE subtitle2 沒在 theme 定義，吃 MUI 預設 500／1.57（原本寫成 700） */
.rules{list-style:none;padding:0}
.rules li{display:flex;align-items:center;height:30px;padding:0 8px;font-size:12px;line-height:18px;cursor:default}   /* ⚠ DEVIATION（Kabin 10/13 裁決間距照稿）：規則每列 30（稿 Frame 26／29／30）；FE List py 8＋ListItem 40 */
.rules li .dot{margin-right:8px;font-size:14px}
.rules li .ck{display:none;margin-right:8px;font-size:18px;color:var(--lt-color-text-secondary)}
body.rule-figma .rules li .dot{display:none}
body.rule-figma .rules li .ck{display:inline-block}
body.rule-figma .rules li{height:30px}
body.rule-figma .rules li.met .ck{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
body.rule-figma .rules li:not(.met) .ck{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}

/* ---- Token 驗證中／錯誤（FE AuthFormWrapper isLoading／ErrorView） ---- */
.verify{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:200px;gap:8px}
.verify .spin{width:50px;height:50px;border:5px solid var(--lt-color-primary);border-right-color:transparent}
.errview{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.errview .eh{display:flex;align-items:center;gap:4px;color:var(--au-error)}
.errview .eh .material-symbols-outlined{font-size:35px}
.errview .eh b{font-size:18px;line-height:27px}

/* ============================================================
 * 4. 彈窗（FE theme muiDialog；SelectUserRoleDialog／UserNotInvitedErrorDialog 寬 600、px 32 py 24）
 * ============================================================ */
.dlg-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:990;  /* ⚠ DEVIATION: 比 tokens 的 modal(2000) 低，壓在 Demo FAB(998) 下面，彈窗開著時還能點 Demo 情境 */
  display:flex;align-items:center;justify-content:center;padding:32px;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{background:#fff;border-radius:var(--au-dialog-radius);box-shadow:var(--au-dialog-shadow);width:600px;max-width:100%;max-height:100%;overflow:auto;padding:24px 32px;position:relative;display:flex;flex-direction:column}
.dlg.wide{width:700px;padding:16px 24px}
.dlg-hd{display:flex;flex-direction:column;align-items:center;text-align:center}
/* ⚠ DEVIATION（Kabin 10/13 裁決間距照稿）彈窗：#08 圖示到標題 15（稿 Frame 4214 gap 15，FE 0）；#09 標題→插圖 40、插圖→內文 15、內文→按鈕 40、兩顆按鈕間 10（稿 Modal gap 40／Frame gap 15／Dialog action gap 10，原本 24／16／32／8）。
   #08 其餘（標題→說明 15、說明→下拉 40、下拉→按鈕 64）與 #10（40／15／40）FE 跟稿本來就一樣 */
.dlg-hd h4{font-size:20px;font-weight:700;line-height:30px}
.dlg-hd p{font-size:14px;line-height:24.5px;color:var(--lt-color-text-primary)}
.dlg-act{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}   /* 390 寬時 #09 兩顆長按鈕會擠出彈窗，換行（設計端暫擬，稿沒定義窄版） */
.dlg-body{margin:40px 0 64px}
.dlg-body-s{margin:15px 0 40px;text-align:center;font-size:14px;line-height:24.5px}
.dlg-title-row{display:flex;align-items:center;padding:0 0 24px}   /* ⚠ DEVIATION（Kabin 10/13 裁決間距照稿）：條款彈窗標題到日期 24（稿 Dialog Frame gap 24）；FE DialogTitle pb 20 */
.dlg-title-row h4{font-size:20px;font-weight:700;line-height:30px}
.dlg-x{margin-left:auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--lt-color-text-secondary)}
.dlg-x:hover{background:rgba(0,0,0,.04)}
.dlg-x .material-symbols-outlined{font-size:24px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.agree{margin-top:8px;color:var(--lt-color-text-secondary)}   /* FE FormHelperText（caption、text.secondary）；⚠ DEVIATION（Kabin 10/13 裁決間距照稿）：按鈕到說明 8（稿 Frame 4340 gap 8），FE mb 8＋mt 4 */
.legal-meta{display:block;text-align:right;white-space:pre-line;font-size:12px;line-height:18px;color:var(--lt-color-text-secondary);margin-bottom:24px}
.legal{height:510px;max-height:calc(100vh - 250px);overflow:auto;font-size:14px;line-height:24.5px;padding-right:8px;overscroll-behavior:contain;border-radius:4px}
.legal:focus-visible{outline:2px solid var(--lt-color-primary);outline-offset:2px}   /* 全文區可聚焦（tabindex=0），方向鍵／PageDown 捲內文 */
.legal .lg-stack{display:flex;flex-direction:column;gap:20px}   /* FE Stack spacing={5} */
.legal .t.h6{font-size:16px;font-weight:700;line-height:24px}   /* FE Typography h6 */
.legal ol{padding:8px 0 0 24px;list-style:lower-alpha}   /* FE OrderedList：MUI List pt 8、pb 0、pl spacing(6)、預設 lower-alpha */
.legal ol.num{list-style:decimal}
.legal ol.roman{list-style:lower-roman}
.legal ol>li:not(:last-child){margin-bottom:8px}   /* FE '& li:not(:last-child)': { mb: 2 } */
.legal a{color:var(--lt-color-primary)}
.dlg.wide .dlg-act{margin-left:auto;padding-top:24px}   /* 對稿修正：FE muiDialog 的 DialogActions marginLeft:auto（BaseDialog 沒覆寫）→ 靠右，跟 Figma #06／#07 一致；DialogContent pb 24 */

/* 下拉（FE SingleSelect／SelectMenuWrapper／SelectOptionItem） */
.pop{position:fixed;z-index:var(--lt-z-dropdown);background:#fff;border-radius:6px;box-shadow:var(--au-menu-shadow);overflow:hidden}
.pop-in{padding:10px;display:flex;flex-direction:column}
.pop-search{display:flex;align-items:center;height:36px;border:1px solid var(--au-input-border);border-radius:5px;padding:8px;margin-bottom:10px;gap:8px}
.pop-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--au-input-text)}
.pop-search input::placeholder{color:var(--lt-color-text-tertiary)}
.pop-search .material-symbols-outlined{color:var(--lt-color-text-tertiary);font-size:24px}
.pop hr{border:0;border-top:1px solid rgba(0,0,0,.12)}
.pop-list{max-height:260px;overflow:auto;overscroll-behavior:contain;padding-top:4px}   /* Fable #4：FE SingleSelectOption DISPLAY_ITEMS 6.5 × 40 = listHeight 260（Figma #08-1 註記「最大高度以共用元件為主」） */
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;padding:0 8px;margin:0 2px;border-radius:4px;cursor:pointer;font-size:14px}
.opt:hover{background:rgba(0,0,0,.04)}           /* 對稿修正：FE SelectOptionItem hover＝action.hover、selected＝action.selected、radius spacing(1)、左右 margin spacing(.5) */
.opt.sel-on{background:rgba(0,0,0,.08)}
.pop.menu .opt{margin:0}
.pop.menu .opt:hover{background:var(--lt-grey-50)}   /* FE muiMenu：MenuItem hover gray.hover、selected gray.selected、radius 4 */
.pop.menu .opt.sel-on{background:var(--lt-grey-200)}
.opt.kb-on{background:rgba(0,0,0,.04);box-shadow:inset 0 0 0 1px var(--lt-grey-300)}   /* 鍵盤高亮（Fable #3）：hover 底色＋1px 內框，跟滑鼠 hover 分得出來 */
.opt.sel-on.kb-on{background:rgba(0,0,0,.08)}
.pop.menu .opt.kb-on{background:var(--lt-grey-50)}
.pop.menu .opt.sel-on.kb-on{background:var(--lt-grey-200)}
.dlg:focus{outline:none}   /* 開啟時焦點放在彈窗容器（同 MUI），容器本身不畫焦點框 */
.opt .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-empty{padding:12px 8px;color:var(--lt-color-text-tertiary);font-size:14px}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--au-chip-radius);background:var(--lt-color-primary);color:#fff;font-size:12px;line-height:18px;flex:none}
.pop.menu{padding:10px;box-shadow:0 2px 14px 0 rgba(137,174,255,.2)}   /* 對稿修正：FE muiMenu paper 陰影（Country／區碼是 MUI Menu，不是 SelectMenuWrapper） */
#role-sel{gap:4px}
#role-sel .sel-v{color:var(--lt-color-text-primary)}   /* 對稿修正：FE SelectButton 文字 text.primary、chip 與箭頭間距 4 */
.pop.menu .pop-list{max-height:320px;padding:0}

/* ============================================================
 * 5. Toast（FE libs Toaster：左下 sonner，寬 400、padding 8 16、success #008F88／error #BF302E／info #0B6DD7）
 *    Kabin 10/13 裁決：照 FE 成功綠 #008F88（Figma #11 也是這個色；10/13 驗收再確認不用 #00B5A6）＋FE 文案；Figma #02-2／#03-2／#04-2／#05-2 的深藍 toast 列為設計稿問題。
 *    對稿修正：FE Toaster 的 toastOptions.style 是 inline，蓋過 toast.css 的陰影 → 實際是 1px rgba(0,0,0,.12) 框＋MUI shadows[1]，沒有 min-height
 *    ⚠ DEVIATION: FE／Figma toast 距左 24、距底 24；Demo FAB 佔 18–66px，與其他 prototype 一致往右挪到 80；底部再抬高到 96（X-9r6 F10），避開 prototype footer 與 Copyright
 * ============================================================ */
/* 共用 Toast（shared/lumiture-toast.js）：沒有 sidebar 所以 left 自動 24（FE／Figma 的位置）。
 * ⚠ DEVIATION：bottom 抬到 96（稿是 24；X-9r6 F10 由 72 改），避開 Demo FAB（左下）、prototype footer 與左下 Copyright（帶展示入口的兩行 toast 高 95，72 時會壓到 Copyright 11px） */
body .lt-toast-wrap{bottom:96px}
.lt-toast .lt-toast-msg{white-space:pre-line}
/* 展示入口（Notification Emails 接回流程，2026-10-14）：Demo FAB 同色系的深藍底＋黃色虛線框，讀得出「這不是產品 UI」；Demo FAB「展示入口」可隱藏。
   ⚠ 設計端暫擬：Kabin 要求 Forgot／Sign Up 寄出成功後有路徑看到那封信，正式產品沒有這顆 */
.lt-toast .demo-entry{pointer-events:auto;display:inline-flex;align-items:center;gap:4px;flex-shrink:0;margin-left:0;height:22px;padding:0 8px;border-radius:11px;background:#0D1B3E;color:#fff;border:1px dashed #D9CC4A;font-size:12px;line-height:18px;font-weight:700;white-space:nowrap;text-decoration:none}
.lt-toast .demo-entry:hover{background:#0E3A82}
.lt-toast .demo-entry:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lt-toast .demo-entry .material-symbols-outlined{font-size:14px}
body.demo-entries-off .demo-entry,body.demo-entries-off .lt-toast-extra{display:none}
@keyframes toast-in{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* ============================================================
 * 6. SSO 第三方頁面（示意）與登入後首頁（示意）
 * ============================================================ */
.stage{min-height:calc(100vh - 48px);display:flex;align-items:center;justify-content:center;padding:32px;background:var(--lt-grey-50)}
.stage.home{background:var(--lt-color-primary-bg)}
.card{width:440px;max-width:100%;background:#fff;border-radius:8px;box-shadow:var(--lt-card-shadow);padding:32px;display:flex;flex-direction:column;gap:16px}
.card h3{font-size:24px;line-height:36px;font-weight:700}
.card .sub{color:var(--lt-color-text-secondary)}
.proto-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:3px;background:var(--lt-turquoise-20);color:var(--lt-turquoise-80);font-size:12px;font-weight:700}
.trace{margin:0;padding:12px 16px;background:var(--lt-grey-50);border-radius:5px;font-size:12px;line-height:18px;color:var(--lt-color-text-secondary);list-style:decimal inside}
.trace li{padding:2px 0}
.trace li b{color:var(--lt-color-text-primary)}
.prov-logo{width:48px;height:48px}
.card-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.parked-badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:3px;background:var(--lt-color-warning-light);color:#9A5B00;font-size:12px;font-weight:700;margin-bottom:8px}
</style>

<body>
<main id="app"></main>   <!-- X-9r1 P11：內容區用 <main>（id 不動） -->
<div class="footer">
  <span class="footer-version">Auth Prototype<span class="ver-tag">v1</span></span>
  <span class="footer-credit">Internal Review Only · Designed &amp; Built by Kabin</span>
</div>
<div id="dlg-host"></div>

<script>
/* === Inlined: shared/lumiture-toast.js === */
/*!
 * lumiture-toast.js — 全站共用 Toast（2026-10-15 修正輪 A-1）
 *
 * 規格（FE libs/lumiture-ui/src/Toaster/toast.css＋Toaster.tsx，Figma GB #02-3／GL #18-3／EI #08／RS #06／RO #06 逐值一致）：

/* Fable #1（🔴）：彈窗開著時焦點要在彈窗裡。FE MUI Dialog 的行為：開啟時焦點進彈窗、Tab 只在彈窗內循環、背景對輔助科技隱藏，關閉後焦點回到觸發處。
   做法：背景（#app、版號 footer）加 inert，焦點移到 .dlg（tabindex=-1，同 MUI 把焦點放在 paper 容器），Tab 在 .dlg（＋開著的下拉）內循環；關閉時回到開啟前的焦點。 */

    return;

  host.innerHTML = d.type === 'role' ? roleDlgHtml() : d.type === 'almost' ? almostDlgHtml() : d.type === 'onelast' ? oneLastDlgHtml(d.kind) : legalDlgHtml(d.kind);

function trapTab(e) {

 * 8. 送出（模擬後端）

function startPending(view) { state.pending = true; const b = $(`[data-submit="${view}"]`); if (b) b.innerHTML = btnInner('', true); }
function endPending(view) { state.pending = false; const b = $(`[data-submit="${view}"]`); if (b) b.innerHTML = btnInner(view === 'login' ? COPY.login.btn : view === 'forgot' ? COPY.forgot.btn : view === 'reset' ? COPY.reset.btn : view === 'signup' ? COPY.signup.btn : COPY.activate.btn, false); }
function submit(view) {
  if (state.pending) return;
  const e = validateAll(view);
  FIELDS[view].forEach(n => setErr(view, n, e[n] || null));
  const first = Object.keys(e)[0];
  if (first) { const el = $(`.fld[data-fld="${first}"] input, .fld[data-fld="${first}"] .sel`); if (el) el.focus({ preventScroll: false }); return; }
  startPending(view);
  later(() => finish(view), 900);
}
function finish(view) {
  const res = state.next[view] || 'ok'; delete state.next[view];
  endPending(view);
  const f = state.forms[view];
  const failGeneric = () => toast('error', COPY.failGeneric);
  if (view === 'login') {
    if (res === 'bad') { setErr('login', 'password', COPY.login.badCred + '\n' + COPY.login.lockNote); return; }
    if (res === 'inactive') { setErr('login', 'password', COPY.login.inactive); return; }
    /* Fable #8：FE login/page.tsx 的 catch 把任何 ApiError 都 setError('password', error.message)，usePostLogin 的 onError 只 console.error，沒有 toast。
       位置照 FE（密碼欄下方）；文案是 API 回傳的 message，內容未知 → ⚠ 設計端暫擬：先用通用句 */
    if (res === 'fail') { setErr('login', 'password', COPY.failGeneric); return; }
    if (res === 'multi') { state.fromSso = false; openRoleDialog(); return; }   /* Fable #7：FE 只在 session 沒有預設群組時開 #08，預選 defaultGroupId || 第一個 → 首次指派 */
    return enterApp();
  }
  if (view === 'forgot') {
    if (res === 'nf') return setErr('forgot', 'email', COPY.forgot.notFound);
    if (res === 'fail') return failGeneric();
    toast('ok', COPY.forgot.ok, { dur: 10000, demoLink: EMAIL_RESET }); return go('login', { silent: false });
  }
  if (view === 'reset' || view === 'activate') {
    if (COMMON_PWDS.includes(f.password.toLowerCase()) || res === 'common') return setErr(view, 'passwordConfirm', COPY.common);   /* ⚠ 設計端暫擬：Figma #05-1 把 7 則密碼錯誤統一寫在 Confirm Password 下方；FE 的 API 錯誤是 toast，這裡跟 Figma 放 Confirm 下方 */
    if (res === 'fail') return failGeneric();
    toast('ok', view === 'reset' ? COPY.reset.ok : COPY.activate.ok); return go('login');
  }
  if (view === 'signup') {
    if (res === 'dup') return setErr('signup', 'email', COPY.signup.dup);
    if (res === 'fail') return failGeneric();
    toast('ok', COPY.signup.ok, { dur: 10000, demoLink: EMAIL_ACTIVATE }); return go('login');
  }
}

/* ============================================================
 * 9. Router
 * ============================================================ */
const VIEWS = { login: loginView, forgot: forgotView, reset: resetView, signup: signupView, activate: activateView };
function show(view, opt = {}) {
  clearTimers();
  if (view === 'home') { goHome(); return; }
  const changed = state.view !== view || !opt.keep;
  if (!opt.keep) { state.forms[view] = FORM_DEFAULTS()[view]; state.errs[view] = {}; state.showPwd = {}; state.pending = false; }
  state.view = view;
  const app = $('#app');
  if (view === 'sso-provider') app.innerHTML = providerView();
  else app.innerHTML = VIEWS[view]();
  renderDialog();
  document.body.dataset.view = view;
  if (view === 'reset' || view === 'activate') {
    refreshRules(view);
    if (state.verify === 'ok' && state.verifyAuto && !opt.keep) { state.verify = 'loading'; app.innerHTML = VIEWS[view](); later(() => { state.verify = 'ok'; app.innerHTML = VIEWS[view](); refreshRules(view); focusFirst(); }, 700); return; }
  }
  if (!opt.noFocus && !state.dlg) focusFirst();   /* Fable #1：彈窗開著時焦點交給 renderDialog（放進彈窗），不給背後表單 */
}
function focusFirst() { const el = $('[data-af="1"]'); if (el && !el.disabled) el.focus({ preventScroll: true }); }
function go(view, opt = {}) {
  /* hash ↔ view 對照：go() 只是改 hash，真正渲染在 hashchange（opt.silent＝只換 hash 不渲染，給已經自己渲染過的路徑） */
  if (opt.silent) { history.replaceState(null, '', '#' + view); return; }
  if (location.hash === '#' + view) { routeFromHash(); } else location.hash = '#' + view;
}
const HASHES = {
  '': () => show('login'), login: () => show('login'), forgot: () => show('forgot'), reset: () => { state.verify = 'ok'; state.verifyAuto = true; show('reset'); }, signup: () => show('signup'), activate: () => { state.verified.activate = { first: '', last: '' }; state.verify = 'ok'; state.verifyAuto = true; show('activate'); },
  terms: () => { show('signup'); state.dlg = { type: 'legal', kind: 'terms' }; renderDialog(); },
  privacy: () => { show('signup'); state.dlg = { type: 'legal', kind: 'privacy' }; renderDialog(); },
  'activate-privacy': () => { state.verified.activate = { first: '', last: '' }; state.verify = 'ok'; state.verifyAuto = false; show('activate'); state.verifyAuto = true; state.dlg = { type: 'legal', kind: 'privacy' }; renderDialog(); },
  role: () => { state.fromSso = false; openRoleDialog('g-cc'); },
  'role-dd': () => { state.fromSso = false; openRoleDialog('g-cc'); openRolePop(); },
  'sso-role': () => { state.fromSso = true; openRoleDialog(); },
  'sso-provider': () => show('sso-provider'),
  'sso-uninvited': () => { state.dlg = { type: 'onelast', kind: 'team' }; show('login', { keep: true }); },
  'sso-join': () => { state.dlg = { type: 'onelast', kind: 'group' }; show('login', { keep: true }); },
  'sso-almost': () => { state.dlg = { type: 'almost' }; show('login', { keep: true }); },
  'sso-toast': () => { goHome(); toast('ok', COPY.sso.ok, { persist: true }); toast('error', COPY.sso.generic, { persist: true }); },
  home: () => goHome()
};
function routeFromHash() {
  const h = decodeURIComponent((location.hash || '').replace('#', ''));
  state.dlg = null; closePop();
  (HASHES[h] || HASHES[''])();
}
window.addEventListener('hashchange', routeFromHash);
</script>

<script>
/* ============================================================
 * 10. 事件（委派）
 * ============================================================ */
document.addEventListener('input', e => {
  const t = e.target.closest && e.target.closest('input[data-f]'); if (!t) return;
  onInput(t.dataset.v, t.dataset.f, t.value);
});
document.addEventListener('click', e => {
  const t = e.target;
  const eye = t.closest('[data-eye]'); if (eye) { const k = eye.dataset.eye; state.showPwd[k] = !state.showPwd[k]; const [v, n] = k.split('.'); const input = $(`input[data-v="${v}"][data-f="${n}"]`); input.type = state.showPwd[k] ? 'text' : 'password'; $('.material-symbols-outlined', eye).textContent = state.showPwd[k] ? 'visibility_off' : 'visibility'; eye.setAttribute('aria-pressed', state.showPwd[k] ? 'true' : 'false'); eye.setAttribute('aria-label', state.showPwd[k] ? 'Hide password' : 'Show password'); return; }
  const sb = t.closest('[data-submit]'); if (sb) { e.preventDefault(); submit(sb.dataset.submit); return; }
  const sso = t.closest('[data-sso]'); if (sso) { startSso(sso.dataset.sso); return; }
  const prov = t.closest('[data-prov]'); if (prov) { if (prov.dataset.prov === 'back') { runSso('fail-generic'); } else runSso(); return; }
  if (t.closest('[data-feedback]')) { e.preventDefault(); return; }   /* ⚠ 設計端暫擬：Give Feedback 真產品開外部表單，這裡不導頁 */
  /* 下拉 */
  const selBtn = t.closest('[data-sel]'); if (selBtn) { if (pop && pop.anchor === selBtn) closePop(); else openCountryPop(selBtn); return; }
  const cc = t.closest('[data-cc]'); if (cc && cc.classList.contains('cc')) { if (pop && pop.anchor === cc) closePop(); else openCcPop(cc); return; }
  const opt = t.closest('.opt'); if (opt && pop) {
    if (opt.dataset.cty) { state.forms.signup.country = opt.dataset.cty; closePop(); const fld = $('.fld[data-fld="country"]'); const c = countryOf(opt.dataset.cty); const v = $('.sel-v', fld); v.className = 'sel-v'; v.innerHTML = flag(c[0]) + ' ' + esc(c[1]); setErr('signup', 'country', null); return; }
    if (opt.dataset.cc) { state.forms.signup.phoneCc = opt.dataset.cc; closePop(); const c = countryOf(opt.dataset.cc); const fld = $('.fld[data-fld="businessPhone"]'); $('.flag', fld).textContent = flag(c[0]); $('.pre', fld).textContent = '+' + c[2]; if (state.forms.signup.phoneNum) setErr('signup', 'businessPhone', validateField('signup', 'businessPhone')); return; }
    if (opt.dataset.roleId) { state.roles.selected = opt.dataset.roleId; closePop(); renderDialog(); return; }
  }
  const rsel = t.closest('#role-sel'); if (rsel) { if (pop) closePop(); else openRolePop(); return; }
  if (pop && !t.closest('.pop')) closePop();
  /* 彈窗按鈕 */
  const rc = t.closest('[data-role="continue"]'); if (rc) { if (state.roles.loading) return; state.roles.loading = true; renderDialog(); later(() => { const fromSso = state.fromSso; state.roles.loading = false; enterApp({ roleToast: true, ssoToast: fromSso }); }, 800); return; }
  const al = t.closest('[data-almost]'); if (al) { if (al.dataset.almost === 'join') { state.dlg = { type: 'onelast', kind: 'group' }; renderDialog(); history.replaceState(null, '', '#sso-join'); } else { state.dlg = null; renderDialog(); go('signup'); } return; }
  const ol = t.closest('[data-onelast]'); if (ol) { state.dlg = null; renderDialog(); history.replaceState(null, '', '#login'); return; }
  const lg = t.closest('[data-legal]'); if (lg) { const back = state.view === 'signup' ? 'signup' : 'activate'; state.dlg = null; renderDialog(); history.replaceState(null, '', '#' + back); return; }
  /* 站內連結：用 hashchange 路由；強制重新渲染（同一個 hash 再點一次也要回到乾淨狀態） */
  /* 條款／隱私連結：在原頁開彈窗、不換路由（FE 是 state 開關，表單內容不會被清掉）；hash 只換顯示用 */
  const lk = t.closest('a[href="#terms"],a[href="#privacy"],a[href="#activate-privacy"]');
  if (lk && lk.dataset.nav !== '0' && (state.view === 'signup' || state.view === 'activate')) { e.preventDefault(); const h = lk.getAttribute('href'); state.dlg = { type: 'legal', kind: h === '#terms' ? 'terms' : 'privacy' }; renderDialog(); history.replaceState(null, '', h); return; }
  const a = t.closest('a[href^="#"]'); if (a && !a.hasAttribute('data-feedback') && a.dataset.nav !== '0') { const h = a.getAttribute('href'); if (h === location.hash) { e.preventDefault(); routeFromHash(); } return; }
  if (a && a.dataset.nav === '0') e.preventDefault();
  /* 彈窗點背景：#10 One Last Step 可關（FE UserNotInvitedErrorDialog 有給 onClose）；Select Your Role 不可（FE reason===backdropClick 直接 return）；條款彈窗沒給 onClose 所以也不能點背景關 */
  const back = t.classList && t.classList.contains('dlg-back') ? t : null;
  if (back && back.dataset.back === 'onelast') { state.dlg = null; renderDialog(); history.replaceState(null, '', '#login'); }
});
document.addEventListener('keydown', e => {
  if (popKey(e)) return;
  if (e.key === 'Tab' && state.dlg) { trapTab(e); return; }   /* Fable #1：Tab 只在彈窗內循環 */
  if (e.key === 'Escape') { if (state.dlg && state.dlg.type === 'onelast') { state.dlg = null; renderDialog(); history.replaceState(null, '', '#login'); } return; }   /* Select Your Role：disableEscapeKeyDown；條款彈窗沒給 onClose */
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') && t && t.matches && t.matches('[data-sel],#role-sel')) { e.preventDefault(); t.click(); return; }
  if (e.key === 'ArrowDown' && t && t.matches && t.matches('.cc[data-cc]')) { e.preventDefault(); t.click(); return; }
  if (state.dlg) return;   /* Fable #1：彈窗開著時，Enter 不能送出背後的表單（背景已 inert，這行是保險） */
  if (e.key === 'Enter' && t && t.matches && t.matches('input[data-f]')) { e.preventDefault(); submit(state.view); }
});
/* Fable #2（🔴）：原本 capture 收到「任何元素」的 scroll 就關選單，清單自己捲也算 → 捲到第二頁選項的那一刻選單消失。
   只在選單外面（頁面、Paper）捲動時才關；清單本身的捲動放行。 */
window.addEventListener('scroll', e => { if (pop && !(e.target instanceof Node && pop.el.contains(e.target))) closePop(); }, true);
window.addEventListener('resize', () => { if (pop) closePop(); });
</script>

}
function fillValid(view) {

function validateNow(view, only) { FIELDS[view].forEach(n => { if (only && !only.includes(n)) return; const e = validateField(view, n); if (e) state.errs[view][n] = e; }); }
function open(view, { keep = true, hash } = {}) { state.verifyAuto = false; show(view, { keep: true, noFocus: true }); history.replaceState(null, '', '#' + (hash || view)); }

    function hideTip() { cur = null; tip.style.display = 'none'; undescribe(); }
    /* 頁面自己把 #gl-tip 設成 display:none（例：開 Month Picker 時收起）也要跟著移除 describedby */
    if (window.MutationObserver) new MutationObserver(function () { if (tip.style.display === 'none') undescribe(); }).observe(tip, { attributes: true, attributeFilter: ['style'] });
    // 2026-10-09 Kabin 裁決：全站 tooltip 改成錨在元件上（Figma／MUI 行為），不再跟著游標跑。
    // 規則照 Anomaly Detection #01-3 量到的：預設出現在元件上方 6px、水平靠元件左緣，
    // 右邊放不下就改靠元件右緣 +2；上方放不下改到下方。
    // 可選屬性：data-tip-pos="below"（固定放下方）、data-tip-dy（下方距離，預設 4）、
    // data-tip-anchor（CSS 選擇器，錨在子元素上）、data-tip-align="content-right"（右緣對齊內容右緣 −16）。
    function minX() {
      try {
        var sb = document.querySelector('.lt-sidebar');
        if (sb && sb.offsetWidth > 0) return (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lt-sb-w')) || sb.offsetWidth) + 8;
      } catch (err) {}
      return 8;
    }
    function place() {
      if (!cur || !cur.isConnected) { hideTip(); return; }
      var a = (cur.dataset.tipAnchor && cur.querySelector(cur.dataset.tipAnchor)) || cur;
      /* X-9r1 R1：量測前先歸位，不然 tooltip 還停在上一個位置時寬度被視窗右緣擠窄（先 hover 右側短提示、再 hover 長提示，寬只有 440） */
      tip.style.left = '0px'; tip.style.top = '0px';
      var r = a.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
      var vw = window.innerWidth, vh = window.innerHeight;
      var x = r.left;
      /* X-9r1 S2：放不下改靠右緣時，左緣不能落進 sidebar（600 寬在 1280 中間位置會伸進去）；沒有 sidebar 的頁維持 8，收合時 21＋8 */
      if (x + tw > vw - 8) x = Math.max(minX(), Math.min(r.right + 2, vw - 8) - tw);
      if (cur.dataset.tipAlign === 'content-right') x = Math.max(8, r.right - 16 - tw);
      var below = cur.dataset.tipPos === 'below';
      var dy = cur.dataset.tipDy != null ? +cur.dataset.tipDy : 4;
      var y = below ? r.bottom + dy : r.top - th - 6;
      if (y < 8) y = r.bottom + 4;
      if (y + th > vh - 8) y = Math.max(8, r.top - th - 6);
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (!el || (el === cur && tip.style.display !== 'none')) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block'; place(); describe(el);
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (el && el === cur && !el.contains(e.relatedTarget)) hideTip();
    });
    /* 2026-10-22 X-9r3 FA23：鍵盤 focus 到帶 data-tip 的元素也顯示、blur／Esc 收起（additive，只吃 :focus-visible，滑鼠點擊不觸發） */
    /* 2026-10-22 X-9r3 R4：:focus-visible 改判真正拿到焦點的 e.target（不是帶 data-tip 的祖先）；describedby 掛在拿到焦點的那個元素上 */
    document.addEventListener('focusin', function (e) {
      var t = e.target, el = t.closest && t.closest('[data-tip]');
      if (!el || !t.matches || !t.matches(':focus-visible')) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block'; place(); describe(t);
    });
    document.addEventListener('focusout', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (el && el === cur) hideTip();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && cur) { hideTip(); return; }
      /* role="button" 的 info icon（非原生按鈕）按 Enter／Space 切換 tooltip；滑鼠行為不變 */
      if ((e.key === 'Enter' || e.key === ' ') && !e.defaultPrevented) {
        var t = e.target, b = t.closest && t.closest('[role="button"][data-tip]');
        if (!b || b !== t || /^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
        e.preventDefault();
        if (cur === b && tip.style.display !== 'none') hideTip();
        else { cur = b; tip.textContent = b.dataset.tip; tip.style.display = 'block'; place(); describe(b); }
      }
    });
    window.addEventListener('scroll', place, true);
    window.addEventListener('resize', place);
  }

  /* X-9r1 S8：頁面自建 #gl-tip（Anomaly Detection、All Resource List、Audit Log）時，shared 不綁 mouseover／mouseout／scroll／resize，
     位置與顯示邏輯留給頁面；這裡只補讀屏與鍵盤語意：role="tooltip"、顯示時給觸發元件 aria-describedby="gl-tip"、Esc 收起、
     role="button" 的 Enter／Space 切換、鍵盤 focus-visible 顯示（兩者都是發合成 mouseover／mouseout 交給頁面自己的邏輯，位置規則不動）。
     觸發元件靠 :hover／activeElement 與文字比對找，不靠自己綁 mouseover */
  function _enhanceHostTooltip(tip) {
    if (tip.getAttribute('role') !== 'tooltip') tip.setAttribute('role', 'tooltip');
    var described = null, pending = null;
    function visible() { return tip.style.display !== 'none' && getComputedStyle(tip).display !== 'none'; }
    function undescribe() {
      if (!described) return;
      var ids = (described.getAttribute('aria-describedby') || '').split(/\s+/).filter(function (x) { return x && x !== 'gl-tip'; });
      if (ids.length) described.setAttribute('aria-describedby', ids.join(' ')); else described.removeAttribute('aria-describedby');
      described = null;
    }
    function describe(node) {
      if (node === described) return;
      undescribe();
      var ids = (node.getAttribute('aria-describedby') || '').split(/\s+/).filter(Boolean);
      if (ids.indexOf('gl-tip') === -1) { ids.push('gl-tip'); node.setAttribute('aria-describedby', ids.join(' ')); }
      described = node;
    }
    function findTrigger() {
      var txt = tip.textContent, list = [];
      if (pending && pending.isConnected) list.push(pending);
      var ae = document.activeElement; if (ae && ae.closest) list.push(ae);
      [].forEach.call(document.querySelectorAll('[data-tip]:hover'), function (n) { list.push(n); });
      for (var i = 0; i < list.length; i++) {
        var host = list[i].closest && list[i].closest('[data-tip]');
        if (host && host.dataset.tip === txt) return host;
      }
      return null;
    }
    function sync() {
      if (!visible()) { undescribe(); pending = null; return; }
      var t = findTrigger();
      if (t) describe(t);
    }
    if (window.MutationObserver) new MutationObserver(sync).observe(tip, { attributes: true, attributeFilter: ['style', 'class'], childList: true, characterData: true, subtree: true });
    /* 合成事件只是「請頁面自己的 mouseover／mouseout 邏輯照它的位置規則顯示或收起」，shared 不接管位置 */
    function fire(node, type, rel) { try { node.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, relatedTarget: rel || null })); } catch (err) {} }
    function hide() {
      var n = described || pending;
      if (n && n.isConnected) fire(n, 'mouseout', null);   // 讓頁面把自己的 cur 清掉，之後同一個元件才能再顯示
      tip.style.display = 'none';
    }
    /* 鍵盤 focus 到帶 data-tip 的元件（:focus-visible）也顯示，blur 收起；頁面自己的 focusin（ARL 的 .cnt）照跑，同一元件不會重複顯示 */
    document.addEventListener('focusin', function (e) {
      var t = e.target, el = t.closest && t.closest('[data-tip]');
      if (!el || !t.matches || !t.matches(':focus-visible')) return;
      pending = el; fire(el, 'mouseover', null); sync();
    });
    document.addEventListener('focusout', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (el && (el === described || el === pending) && !el.contains(e.relatedTarget)) { fire(el, 'mouseout', e.relatedTarget); pending = null; sync(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && visible()) { hide(); return; }
      if ((e.key === 'Enter' || e.key === ' ') && !e.defaultPrevented) {
        var t = e.target, b = t.closest && t.closest('[role="button"][data-tip]');
        if (!b || b !== t || /^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
        e.preventDefault();
        if (visible() && tip.textContent === b.dataset.tip) { hide(); return; }
        pending = b; fire(b, 'mouseover', null); sync();
      }
    });
  }

  // ===== PUBLIC API =====
  function _refreshScrollArea() {
    var scroll = document.getElementById('demo-popover-scroll');
    if (!scroll) return;
    scroll.style.opacity = '0';
    setTimeout(function () {
      scroll.innerHTML = _renderScrollArea();
      scroll.style.opacity = '1';
    }, 120);
  }

  function _refreshTabs() {
    var pop = document.getElementById('demo-popover');
    if (!pop) return;
    pop.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === _activePage);
    });
    pop.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      // In pages-only mode, cat-tab elements carry data-page (not data-category)
      if (t.dataset.page) {
        t.classList.toggle('active', t.dataset.page === _activePage);
      } else {
        t.classList.toggle('active', t.dataset.category === _activeCategory);
      }
    });
  }

  /** Toggle popover open/close */
  window._demoFabToggle = function () {
    var pop = document.getElementById('demo-popover');
    var fab = document.getElementById('demo-fab');
    var pulse = document.getElementById('demo-fab-pulse');
    var opening = !pop.classList.contains('show');
    pop.classList.toggle('show');
    fab.classList.toggle('popped');
    fab.setAttribute('aria-expanded', opening ? 'true' : 'false');   /* X-9r1 S6 */
    if (opening && pulse) pulse.style.display = 'none';
  };

  /** Set active page tab (internal + external) */
  window._demoFabSetPage = function (pageId) {
    if (_activePage === pageId) return;
    _activePage = pageId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /** Set active category tab */
  window._demoFabSetCategory = function (catId) {
    if (_activeCategory === catId) return;
    _activeCategory = catId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /**
   * Called from prototype's navigation function to auto-switch the page tab.
   * Only switches if the popover doesn't need to stay on current tab.
   */
  window.demoFabSwitchTab = function (pageId) {
    window._demoFabSetPage(pageId);
  };

  /** onLeave 鉤子（2026-10-15）：切走上一個情境時先呼叫它，讓頁面把該情境塞進模組狀態的東西重設掉（避免 Demo 殘留，例如 RS 先點 um-* 再開 modal-detail）。
   *   寫法一：scenario.onLeave = function (nextId) {…}　寫法二：window.DEMO_ON_LEAVE = function (prevId, nextId) {…}（兩種都會呼叫，先 scenario 後全域）
   *   觸發點有兩個：點 FAB 按鈕（_demoFabApply）與「直接呼叫 window.DEMO_APPLY(id)」（下面的 DEMO_APPLY 包裝，第二輪 R1 加，讓 sweep 工具也量得到殘留）。 */
  function _runLeave(id) {
    var prevId = _activeScenario;
    if (prevId && prevId !== id) {
      try {
        var prev = (window.DEMO_SCENARIOS || []).filter(function (s) { return s.id === prevId; })[0];
        if (prev && typeof prev.onLeave === 'function') prev.onLeave(id);
        if (typeof window.DEMO_ON_LEAVE === 'function') window.DEMO_ON_LEAVE(prevId, id);
      } catch (e) { console.error('[demo-fab] onLeave', e); }
    }
  }

  /** 包住頁面的 window.DEMO_APPLY：直接呼叫（不經 FAB）時也先跑 onLeave，並記下目前情境。
   *  經 _demoFabApply 進來的呼叫用 _inFabApply 旗標略過，所以 onLeave 不會被呼叫兩次。
   *  頁面不論在 demo-fab.js 載入前或後指定 window.DEMO_APPLY = fn 都會被攔到（accessor 屬性）。 */
  var _inFabApply = false;
  (function _wrapDemoApply() {
    var raw = window.DEMO_APPLY, wrapped = null, wrappedFor = null;
    function get() {
      if (typeof raw !== 'function') return raw;
      if (wrappedFor !== raw) {
        wrappedFor = raw;
        wrapped = function (id) {
          if (!_inFabApply) { _runLeave(id); _activeScenario = id; }
          return raw.apply(this, arguments);
        };
      }
      return wrapped;
    }
    try {
      Object.defineProperty(window, 'DEMO_APPLY', { configurable: true, enumerable: true, get: get, set: function (fn) { raw = fn; } });
    } catch (e) { /* 屬性不可重定義（極少見）：退回不包裝，只剩 FAB 點擊會觸發 onLeave */ }
  })();

  /** Apply a scenario — called via event delegation or by host */
  window._demoFabApply = function (id, btn) {
    _runLeave(id);
    if (window.LumitureToast && window.LumitureToast.clear) { try { window.LumitureToast.clear(); } catch (e) {} }   // 換情境時清掉上一個情境留下的 toast
    _activeScenario = id;
    document.querySelectorAll('.demo-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    if (btn) {
      btn.classList.add('active');
    } else {
      // No btn provided (e.g. Reset link) — find scenario in DOM
      var found = document.querySelector('[data-scenario="' + id + '"]');
      if (found) found.classList.add('active');
    }
    if (typeof window.DEMO_APPLY === 'function') {
      _inFabApply = true;
      try { window.DEMO_APPLY(id, btn); } finally { _inFabApply = false; }
    }
  };

  // ===== INIT =====
  function _init() {
    if (_activeScenario === null && window.DEMO_DEFAULT) {
      _activeScenario = window.DEMO_DEFAULT;
    }
    _render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>
</body>
</html>
