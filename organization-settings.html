  <style>
/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-btn:    5px;      /* 2026-10-15 B-8：按鈕／輸入框／下拉觸發欄（FE muiButton、Figma CMDS 都是 5） */
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-modal-sm: 10px;   /* 2026-10-15 B-4：確認類彈窗（Remove／Discard／Select Role） */
  --lt-radius-modal:  15px;     /* 2026-10-15 B-4：表單類彈窗（稿量到 15） */
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */
  --lt-shadow-chip:   0 2px 4px 0 rgba(0, 0, 0, 0.3);            /* chip / tag 用，較深 opacity */
  --lt-shadow-dialog: 0 0 6px 0 rgba(0, 0, 0, 0.2);              /* Card / Dialog / Dropdown 共用；無 offset */
  --lt-shadow-overlay:        0 4px 12px rgba(0, 0, 0, 0.14);    /* CMDS 未涵蓋；popover / floating menu */
  --lt-shadow-overlay-strong: 0 4px 16px rgba(0, 0, 0, 0.18);    /* CMDS 未涵蓋；drawer / 較重 overlay */

  /* --- Transition --- */
  --lt-transition-fast: .15s ease;
  --lt-transition-base: .2s ease;
  --lt-transition-slow: .3s ease;

  /* --- Z-index --- */
  --lt-z-base:     0;
  --lt-z-elevated: 10;
  --lt-z-sticky:   100;
  --lt-z-dropdown: 1000;
  --lt-z-modal:    2000;
  --lt-z-tooltip:  3000;
  --lt-z-toast:    4000;


  /* ============================================================
   * LAYER 2 — SEMANTIC
   * 語意層：引用 primitive，描述用途；component 預設用此層
   * ============================================================ */

  /* --- Color: Brand --- */
  --lt-color-primary:         var(--lt-blue-70);
  --lt-color-primary-hover:   var(--lt-blue-60);
  --lt-color-primary-active:  var(--lt-blue-90);
  --lt-color-primary-bg:      var(--lt-blue-10);
  --lt-color-primary-bg-emphasized: var(--lt-blue-20);

  --lt-color-secondary:       var(--lt-turquoise-70);
  --lt-color-secondary-hover: var(--lt-turquoise-60);
  --lt-color-secondary-bg:    var(--lt-turquoise-10);

  /* --- Color: Functional (alias) --- */
  --lt-color-success: var(--lt-color-success-base);
  --lt-color-error:   var(--lt-color-error-base);
  --lt-color-warning: var(--lt-color-warning-base);
  --lt-color-info:    var(--lt-color-info-base);

  /* --- Color: Text --- */
  --lt-color-text-primary:   var(--lt-grey-700);   /* 內文預設 */
  --lt-color-text-secondary: var(--lt-grey-500);   /* 次要文字 */
  --lt-color-text-tertiary:  var(--lt-grey-400);   /* hint / placeholder */
  --lt-color-text-disabled:  var(--lt-grey-400);   /* 白底上的停用文字／icon；停用「按鈕」的字用 --lt-button-disabled-text（白） */
  --lt-color-text-inverse:   var(--lt-white);
  --lt-color-text-link:      var(--lt-blue-70);    /* 2026-10-15 B-14：#0B6DD7 → #004FB0，連結一律加底線（稿 cell、FE ResourceButton） */
  --lt-color-text-link-hover: var(--lt-blue-60);   /* hover 淺一階 #0B6DD7，底線保留 */
  --lt-color-text-heading:   var(--lt-grey-800);   /* 為未來 heading 獨立換色預留 */
  --lt-color-text-icon:      var(--lt-grey-600);   /* 為未來 icon 獨立換色預留 */

  /* --- Color: Background --- */
  --lt-color-bg-default:    var(--lt-white);
  --lt-color-bg-subtle:     var(--lt-grey-50);
  --lt-color-bg-emphasized: var(--lt-grey-100);
  --lt-color-bg-disabled:   var(--lt-grey-100);   /* 停用的「欄位」底（輸入框／下拉，FE SelectButton gray.disableLight）。2026-10-15 B-1：停用「按鈕」改用 FE 版 #CCCCCC 底白字，見 --lt-button-disabled-bg／-text；這顆維持 #F2F2F2，不然舊頁 `.btn:disabled` 用它當底又用 #CCCCCC 當字會變灰壓灰 */
  --lt-color-text-on-disabled: var(--lt-white);   /* 停用按鈕上的字（= --lt-button-disabled-text） */
  --lt-color-bg-inverse:    var(--lt-blue-90);
  --lt-color-bg-overlay:    rgba(0, 0, 0, 0.5);
  --lt-color-bg-skeleton:   var(--lt-grey-200);   /* 骨架屏；2026-09-24 定，對應前端 gray.skeleton → gray.10；用途命名，日後可單獨換色 */

  /* --- Color: Border --- */
  --lt-color-border-default: var(--lt-grey-200);
  --lt-color-border-strong:  var(--lt-grey-300);
  --lt-color-border-focus:   var(--lt-color-primary);
  --lt-color-border-input:   var(--lt-grey-300);   /* 2026-10-15 B-7：#DCE3EC → #CCCCCC（FE、X-6 稿、RS／RO 稿一致） */
  --lt-color-border-input-hover: var(--lt-grey-400); /* 下拉／輸入 hover 框 #B3B3B3（Guideline Dropdown 已是這個） */
  --lt-color-border-error:   var(--lt-color-error-base);


  /* ============================================================
   * LAYER 3 — COMPONENT
   * 元件層：給特定元件使用；引用 semantic
   * ============================================================ */

  /* --- Sidebar (深海軍藍) --- */
  --lt-sidebar-width:      250px;
  --lt-sidebar-bg:         var(--lt-blue-90);
  --lt-sidebar-text:       rgba(255, 255, 255, 0.85);
  --lt-sidebar-text-muted: rgba(255, 255, 255, 0.50);
  --lt-sidebar-hover-bg:   rgba(255, 255, 255, 0.06);
  --lt-sidebar-active-bg:  var(--lt-color-primary);

  /* --- Topbar --- */
  --lt-topbar-bg:     var(--lt-white);
  --lt-topbar-shadow: var(--lt-shadow-dialog);   /* CMDS Dialog shadow（Card 級別 elevation）*/

  /* --- Card --- */
  --lt-card-bg:      var(--lt-color-bg-default);
  --lt-card-radius:  var(--lt-radius-md);
  --lt-card-shadow:  0 0 20px 0 rgba(0, 0, 0, 0.10);   /* 2026-10-15 B-3：Figma 對稿量到的卡片陰影（CB／AD／LumiTag 10/02）；原 var(--lt-shadow-dialog) 0 0 6px .2 */
  --lt-card-padding: var(--lt-space-24);

  /* --- Button --- */
  --lt-button-radius:     var(--lt-radius-btn);   /* 2026-10-15 B-8：4 → 5 */
  --lt-button-font-weight: var(--lt-fw-bold);     /* 2026-10-15 A-2：稿（CMDS Button Bold 1）與 FE muiButton 都是 700 */
  --lt-button-height:     36px;
  --lt-button-disabled-bg:   var(--lt-grey-300);  /* 2026-10-15 B-1：FE 版 */
  --lt-button-disabled-text: var(--lt-white);
  --lt-button-padding-x:  var(--lt-space-16);
  --lt-button-padding-y:  var(--lt-space-8);
  --lt-button-focus-ring: 0 0 0 3px rgba(0, 79, 176, 0.10);

  /* --- Input / Text Field --- */
  --lt-input-bg:        var(--lt-color-bg-default);
  --lt-input-border:    var(--lt-color-border-input);
  --lt-input-radius:    var(--lt-radius-btn);   /* 2026-10-15：36h r5（Figma 輸入與下拉） */
  --lt-input-height:    36px;
  --lt-input-padding-x: var(--lt-space-16);
  --lt-input-padding-y: var(--lt-space-8);

  /* --- Modal --- */
  --lt-modal-radius:   var(--lt-radius-modal);     /* 2026-10-15 B-4：表單類 15（原 12） */
  --lt-modal-radius-sm: var(--lt-radius-modal-sm); /* 確認類 10 */
  --lt-modal-shadow:   0 0 6px 0 rgba(0, 0, 0, 0.2);  /* 全站彈窗統一（B-4）；等同 --lt-shadow-dialog，寫死以免 dialog 陰影日後獨立換值時彈窗跟著動 */
  --lt-modal-padding:  var(--lt-space-24);
  --lt-modal-backdrop: rgba(0, 0, 0, 0.5);

  /* --- Tooltip --- */
  --lt-tooltip-bg:      #31383E;            /* 2026-10-09 Kabin 裁決改成 Figma 量到的值（原 #3C3C3C）；對齊 Lumiture-Guideline.md 規範；非品牌色，刻意不引用 brand token */
  --lt-tooltip-text:    var(--lt-white);
  --lt-tooltip-radius:  var(--lt-radius-sm);
  --lt-tooltip-padding: var(--lt-space-8);

  /* --- Page title / Toast（2026-10-15 修正輪新增） --- */
  --lt-page-title-size:   var(--lt-fs-24);   /* B-2：頁標題 24／700 */
  --lt-page-title-weight: var(--lt-fw-bold);
  --lt-toast-success-bg:  #008F88;           /* 照 FE toast.css；CLAUDE.md 10/13 */
  --lt-toast-error-bg:    #BF302E;
  --lt-toast-info-bg:     #0B6DD7;           /* FE toast.css --infoMain */
  --lt-toast-warning-bg:  #EC6F09;           /* FE toast.css --warningMain */
  --lt-toast-radius:      4px;
  --lt-toast-width:       400px;
}


/* ============================================================
 * NOT YET DEFINED (Pass 3+)
 * ============================================================
 * - ~~Chart palette~~ ✅ 已加入（2026-05-12 從 Figma General Behavior file audit）
 * - Gradient tokens (Figma 有 Lumiture.ai Blue / Orange / Lemon C 等)
 * - Opacity tokens (Figma 有 CM Opacity Color 系列)
 * - Composite typography tokens (--lt-type-h1, --lt-type-body 等 style sets)
 * - Focus / Inset shadow 特殊變體
 * - Dark mode 對應 token
 *
 * Shadow 結構待 Figma audit：v7/v8 用單層、tokens.css 主階用雙層；Overlay 已用單層作折衷
 * ============================================================ */

</style>
  <style>
/* === Inlined: shared/lumiture-ui.css === */
/* ============================================================
 * lumiture-ui.css — 共用小元件樣式（2026-10-15 修正輪 S 組）
 * 引用：<link rel="stylesheet" href="../shared/lumiture-ui.css?v=2026-10-15">（tokens.css 之後；沒載 tokens.css 的頁面也能用，var 都有備用值）
 *
 *   .lt-select   下拉／輸入觸發欄（A-11）
 *   .lt-skeleton 骨架屏（A-18）
 *   .lt-link     文字連結（B-14）
 *   .lt-btn-icon 表格 Action icon button（B-6，CB 版）
 *   空狀態／無權限見 lumiture-empty.js；Toast 見 lumiture-toast.js
 * ============================================================ */

/* ---------- .lt-select ----------
 * 結構：
 *   <button type="button" class="lt-select" aria-haspopup="listbox" aria-expanded="false">
 *     <span class="lt-select__v">All Types</span>                       ← 沒選時加 .is-placeholder 在 .lt-select 上，字變 #B3B3B3
 *     <span class="material-symbols-outlined lt-select__arrow">arrow_drop_down</span>   ← MUI 實心 ▾，不要用 expand_more／chevron
 *   </button>
 * 狀態 class：.is-open（框 primary＋focus ring，箭頭轉 180）、.is-error、.is-disabled 或 :disabled、.is-placeholder
 * 高 36、圓角 5、字 14／400、框 #CCCCCC、hover 框 #B3B3B3（Guideline Dropdown；舊的 hover 框變藍底 #F2FAFF 已廢）。寬度由頁面給（width／min-width）。 */
.lt-select{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;box-sizing:border-box;height:var(--lt-input-height,36px);padding:0 4px 0 12px;
  background:var(--lt-color-bg-default,#fff);border:1px solid var(--lt-color-border-input,#CCCCCC);border-radius:var(--lt-input-radius,5px);
  font-family:inherit;font-size:14px;font-weight:400;line-height:1.5;color:var(--lt-color-text-primary,#262626);text-align:left;cursor:pointer;
  transition:border-color .15s ease,box-shadow .15s ease}
.lt-select:hover{border-color:var(--lt-color-border-input-hover,#B3B3B3)}
.lt-select:focus-visible,.lt-select.is-open{outline:none;border-color:var(--lt-color-border-focus,#004FB0);box-shadow:var(--lt-button-focus-ring,0 0 0 3px rgba(0,79,176,.1))}
.lt-select__v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt-select.is-placeholder .lt-select__v{color:var(--lt-grey-400,#B3B3B3)}
.lt-select__arrow{flex-shrink:0;font-size:24px;line-height:1;color:var(--lt-grey-500,#676767);transition:transform .2s ease;
  font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.lt-select.is-open .lt-select__arrow{transform:rotate(180deg)}
.lt-select.is-error{border-color:var(--lt-color-error,#FF403D)}
.lt-select.is-error:focus-visible,.lt-select.is-error.is-open{box-shadow:0 0 0 3px rgba(255,64,61,.1)}
.lt-select:disabled,.lt-select.is-disabled{background:var(--lt-grey-100,#F2F2F2);border-color:var(--lt-grey-300,#CCCCCC);color:var(--lt-grey-300,#CCCCCC);cursor:not-allowed;box-shadow:none}
.lt-select:disabled .lt-select__arrow,.lt-select.is-disabled .lt-select__arrow{color:var(--lt-grey-300,#CCCCCC)}

/* ---------- .lt-skeleton ----------
 * 骨架屏統一用 --lt-color-bg-skeleton（#E6E6E6）。**靜態**不跑 shimmer（X-6 現況，Guideline 已回改）；要 shimmer 才加 .lt-skeleton--shimmer。
 * 用法：<div class="lt-skeleton" style="width:120px;height:16px"></div>；表格列慣例見各頁稿 #01-6（表頭文字照常、只有儲存格內容換成灰條；卡片標題照常、按鈕 disabled）。

  // logo 連到 Overview（從 LUMITURE_NAV 拿 href）；在 Overview 頁本身不連自己，也就沒有 hover 變形
  function _homeHref() {
    var nav = window.LUMITURE_NAV || [];
    var home = nav.filter(function (e) { return e.type === 'item' && e.id === 'overview'; })[0];
    return home && home.href && !home.disabled && window.LUMITURE_ACTIVE !== 'overview' ? home.href : null;
  }
  function _logoBody(icon) {
    return '<div class="lt-sb-logo-wrap">' + icon + '</div>' +
      '<span class="lt-sb-logo-text">LumiTure.ai</span>' +
      '<span class="lt-sb-proto" data-tip="Prototype" data-tip-pos="below">PROTO<span class="lt-sb-proto-x">TYPE</span></span>';
  }
  function _renderLogo() {
    var href = _homeHref();
    var open = href ? '<a class="lt-sb-logo is-link" href="' + _esc(href) + '" data-tip="Go to Overview" data-tip-pos="below">' : '<div class="lt-sb-logo">';
    return open + _logoBody(LOGO_ICON) + (href ? '</a>' : '</div>');
  }
  // 收合時顯示在 topbar 左側的 logo（同一組圖形，mask id 改 ltT* 避免跟 sidebar 那份撞 id）
  function _renderTopbarLogo() {
    var href = _homeHref();
    var icon = LOGO_ICON.replace(/ltH(ring|bars|leg)/g, 'ltT$1');
    var open = href ? '<a class="lt-tb-logo is-link" href="' + _esc(href) + '" data-tip="Go to Overview" data-tip-pos="below">' : '<div class="lt-tb-logo">';
    return open + _logoBody(icon) + (href ? '</a>' : '</div>');
  }
  function _mountTopbarLogo(host) {
    host = host || document.getElementById('lt-topbar');
    if (!host) return;
    _injectCSS();
    var old = host.querySelector('.lt-tb-logo');
    if (old) old.parentNode.removeChild(old);
    host.insertAdjacentHTML('afterbegin', _renderTopbarLogo());
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function _renderItem(item, isSub) {
    var cls = isSub ? 'lt-sb-subitem' : 'lt-sb-item';
    var isActive = (item.id === window.LUMITURE_ACTIVE);
    var active = isActive ? ' lt-active' : '';
    var dis = item.disabled ? ' lt-dis' : '';
    // Active item: render as <div> (no self-link). Disabled item: also no href.
    var useHref = item.href && !isActive && !item.disabled;
    var tag = useHref ? 'a' : 'div';
    var hrefAttr = useHref ? ' href="' + _esc(item.href) + '"' : '';
    var dataId = ' data-nav-id="' + _esc(item.id) + '"';
    return '<' + tag + ' class="' + cls + active + dis + '"' + hrefAttr + dataId + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon || 'circle') + '</span>' +
             '<span>' + _esc(item.label) + '</span>' +
           '</' + tag + '>';
  }

  function _renderGroup(grp) {
    var collapsed = grp.collapsed ? ' lt-collapsed' : '';
    var children = (grp.items || []).map(function (item) {
      return _renderItem(item, true);
    }).join('');
    return '<div class="lt-sb-group' + collapsed + '" data-group-id="' + _esc(grp.id) + '">' +
             '<div class="lt-sb-group-hdr">' +
               '<span>' + _esc(grp.label) + '</span>' +
               '<span class="material-symbols-outlined lt-sb-group-arrow">keyboard_arrow_up</span>' +
             '</div>' +
             '<div class="lt-sb-group-children">' + children + '</div>' +
           '</div>';
  }

  function _renderNav() {
    var nav = window.LUMITURE_NAV || [];
    var html = '<div class="lt-sb-nav">';
    nav.forEach(function (entry) {
      if (entry.type === 'group') {
        html += _renderGroup(entry);
      } else {
        html += _renderItem(entry, false);
      }
    });
    html += '<div class="lt-sb-skel" aria-hidden="true">' + '<span class="lt-sb-skel-bar"></span>'.repeat(5) + '</div>';
    html += '</div>';
    return html;
  }

  function _renderToggleBtn() {
    return '<button type="button" class="lt-sb-toggle" data-action="toggle-collapse">' +
             '<span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>' +
           '</button>';
  }

  // ===== 收合狀態（記住使用者前次設定）=====
  var STORE_KEY = 'lt-sidebar-collapsed', COLLAPSED_W = '21px';
  function _readStored() { try { return window.localStorage.getItem(STORE_KEY) === '1'; } catch (e) { return false; } }
  function _writeStored(on) { try { window.localStorage.setItem(STORE_KEY, on ? '1' : '0'); } catch (e) {} }
  var _collapsed = _readStored();

  // 套用到 <html>（class＋CSS 變數，給各頁的固定列／內容區位移用）與 sidebar 本身（class、inert、按鈕文字）
  function _applyCollapsed() {
    var root = document.documentElement;
    root.classList.toggle('lt-sb-collapsed', _collapsed);
    if (_collapsed) {
      root.style.setProperty('--lt-sb-w', COLLAPSED_W);
      root.style.setProperty('--sw', COLLAPSED_W);   // 舊頁面寫的 left:var(--sw)（固定底列）跟著動
    } else {
      root.style.removeProperty('--lt-sb-w');        // 還原成各頁／tokens 原本的展開值，展開狀態完全不變
      root.style.removeProperty('--sw');
    }
    var sb = document.getElementById('lt-sidebar');
    if (!sb) return;
    sb.classList.toggle('lt-collapsed', _collapsed);
    var clip = sb.querySelector('.lt-sb-clip');
    if (clip) { if (_collapsed) clip.setAttribute('inert', ''); else clip.removeAttribute('inert'); }
    var btn = sb.querySelector('.lt-sb-toggle');
    if (btn) {
      var label = _collapsed ? 'Expand sidebar' : 'Collapse sidebar';
      btn.setAttribute('aria-label', label); btn.removeAttribute('title');   // title 與 aria-label 同字會被部分輔助工具唸兩次
      btn.setAttribute('aria-controls', 'lt-sidebar');
      btn.setAttribute('aria-expanded', _collapsed ? 'false' : 'true');
      var ic = btn.querySelector('.material-symbols-outlined'); if (ic) ic.textContent = _collapsed ? 'chevron_right' : 'chevron_left';
    }
  }
  var _resizeTimer = null;
  function _setCollapsed(on, opts) {
    on = !!on;
    var changed = on !== _collapsed;
    _collapsed = on;
    if (opts && opts.persist) _writeStored(on);
    // 程式收合時若焦點在 nav 內，inert 會把焦點丟到 body；先移到收合後唯一可達的 sidebar 控制（Fable §12 #5）
    if (on && changed) {
      var sbEl = document.getElementById('lt-sidebar'), clipEl = sbEl && sbEl.querySelector('.lt-sb-clip'), tgl = sbEl && sbEl.querySelector('.lt-sb-toggle');
      if (clipEl && tgl && clipEl.contains(document.activeElement)) tgl.focus({ preventScroll: true });
    }
    _applyCollapsed();
    if (!changed) return;
    document.dispatchEvent(new CustomEvent('lt-sidebar-toggle', { detail: { collapsed: _collapsed } }));
    // 寬度轉場跑完後通知圖表重新量容器（ECharts 等）
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 230);
  }
  // 載入時先把記住的狀態套到 <html>（不等 DOM 建好），並在套用的那一刻關掉轉場，免得每換一頁都看到 250→21 的動畫
  function _bootCollapsed() {
    var root = document.documentElement;
    root.classList.add('lt-html-noanim');
    _applyCollapsed();
    requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove('lt-html-noanim'); }); });
  }

  // ===== Loading（#01-5）=====
  var _loading = false;
  function _applyLoading(mount) {
    mount = mount || document.getElementById('lt-sidebar');
    if (!mount) return;
    mount.classList.toggle('lt-loading', _loading);
    if (_loading) mount.setAttribute('aria-busy', 'true'); else mount.removeAttribute('aria-busy');
  }

  // ===== Mount =====
  function _render() {
    var mount = document.getElementById('lt-sidebar');
    if (!mount) {
      console.warn('[lumiture-sidebar] Mount point #lt-sidebar not found');
      return;
    }
    // If mount is not already a sidebar, wrap it
    mount.classList.add('lt-sidebar');
    mount.innerHTML = '<div class="lt-sb-clip"><div class="lt-sb-inner">' + _renderLogo() + _renderNav() + '</div></div>' + _renderToggleBtn();
    _applyLoading(mount);
    _applyCollapsed();
    _mountTopbarLogo();

    // Group toggle
    mount.querySelectorAll('.lt-sb-group-hdr').forEach(function (hdr) {
      hdr.addEventListener('click', function () {
        var grp = hdr.parentElement;
        if (grp) grp.classList.toggle('lt-collapsed');
      });

  }
  function _openMenu() {

    else if (idx > -1 && items.length) t = items[Math.min(idx, items.length - 1)];            // 重繪（Retry、切 plan…）：焦點留在原位

    function showStatusTooltip(target){const copy=target.dataset.tooltip;if(!copy)return;statusTooltip.textContent=copy;statusTooltip.classList.add('show');const rect=target.getBoundingClientRect();const tipRect=statusTooltip.getBoundingClientRect();let left=Math.min(rect.left,window.innerWidth-tipRect.width-16);left=Math.max(16,left);let top=rect.bottom+8;if(top+tipRect.height>window.innerHeight-16)top=rect.top-tipRect.height-8;statusTooltip.style.left=left+'px';statusTooltip.style.top=Math.max(16,top)+'px';}

  <script>

    skeleton = function () {

    };
    csp = function (key) {
      const gcp = '../../assets/csp-google-cloud.svg';
      const aws = '../../assets/csp-aws-wordmark.svg';

      return '<span class="csp azure" aria-label="Azure"><img src="' + azure + '" alt=""></span>';

    table = function (title, head, rows) {

    };
    let azureListMarkup = null;
    function setFlowPage(active) { document.body.classList.toggle('is-flow-page', active); }

    const AZURE_FLOW = {
      billing: { title:'Cloud Billing Data Integration', labels:['Prepare billing export','Connect Azure','Create FinOps Reader','Grant storage access','Create export event'] },

    function journeyOverview(labels, currentStep) {

      return '<section class="journey-overview"><h3>Your setup journey</h3><p>Complete these tasks in order. You can leave and return if cloud permissions need time to propagate.</p><div class="journey-list">'+items+'</div></section>';

    }
    function azureRoleJson() {

    function detailedSteps(kind, step) {
      let body = '';
      if (kind === 'billing' && step === 0) body = '<h3>Register required resource providers</h3><ol><li>In the Azure portal search bar, search for <strong>Subscriptions</strong> and select it from the results, then select your target subscription.</li><li>In the left pane, go to <strong>Settings → Resource providers</strong>. Search for <strong>Microsoft.CostManagementExports</strong>, select the <strong>(...) icon</strong> in the Provider column, and select <strong>Register</strong>.</li><li>Wait until the status changes to <strong>Registered</strong> before continuing.</li><li>On the same page, search for <strong>Microsoft.EventGrid</strong>, select the <strong>(...) icon</strong>, and select <strong>Register</strong>.</li><li>Wait until the status changes to <strong>Registered</strong> before continuing.</li></ol><h3>Create the daily Billing Export</h3><ol><li>Sign in to Azure Portal. Search for <strong>Cost Management</strong> and open it.</li><li>Under <strong>Reporting + analytics</strong>, select <strong>Export</strong>.</li><li>Select <strong>Scope</strong>, then choose the billing scope you want LumiTure.ai to read.</li><li>Select <strong>+ Create</strong> and choose <strong>All data</strong>.</li><li>Enter <strong>daily</strong> as the Export prefix and select Next.</li><li>Set Storage type to <strong>Azure Blob Storage</strong>; choose Create new for the destination and storage.</li><li>For the new destination, select the target subscription, create resource group <strong>rg-lumiture</strong>, keep a copy of the Storage Account name, select <strong>(US) East US</strong>, container <strong>billing-export</strong>, directory <strong>cost</strong>, format <strong>CSV</strong>, and compression <strong>Gzip</strong>.</li><li>Enable <strong>File partitioning</strong> and <strong>Overwrite data</strong>, then select Next and Create.</li></ol><div class="tutorial-note"><strong>Why keep the storage account name?</strong><br>You will need it later when assigning Storage Blob Data Reader and creating the Event Grid subscription.</div>';
      if (kind === 'billing' && step === 1) body = '<h3>Find and submit the Azure IDs</h3><ol><li>In Azure Portal, search for <strong>Microsoft Entra ID</strong> and open Overview.</li><li>Copy the <strong>Tenant ID</strong> from Basic information.</li><li>Search for <strong>Subscriptions</strong>, then open the subscription where you created the billing export.</li><li>Copy its <strong>Subscription ID</strong>.</li><li>Return here, paste both IDs, and select <strong>Permission Check and Integrate</strong>.</li><li>When Azure opens the permission request, select <strong>Accept</strong> to grant LumiTure-App the requested access.</li></ol><div class="tutorial-note tutorial-warn"><strong>Use matching IDs.</strong><br>The subscription must be the same one that owns the billing export; otherwise the export cannot be discovered.</div>';
      if (kind === 'billing' && step === 2) body = '<h3>Create the LumiTure FinOps Reader custom role</h3><ol><li>In Azure Portal, open <strong>Subscriptions</strong> and select the connected subscription.</li><li>Open <strong>Access control (IAM)</strong> → <strong>+ Add</strong> → <strong>Add custom role</strong>.</li><li>In Basics, enter <strong>LumiTure FinOps Reader</strong> as the custom role name and add an optional description.</li><li>Open the <strong>JSON</strong> tab and select <strong>Edit</strong>.</li><li>Copy the complete JSON shown above and replace the editor contents.</li><li>Select <strong>Save</strong> → Next → <strong>Review + create</strong>, then select <strong>Create</strong>.</li></ol><h4>Assign the role to LumiTure-App</h4><ol><li>Return to Access control (IAM) and select <strong>+ Add</strong> → <strong>Add role assignment</strong>.</li><li>Search for <strong>LumiTure FinOps Reader</strong>, select it, and choose Next.</li><li>Select <strong>+ Select members</strong>, search for <strong>LumiTure-App</strong>, and select it.</li><li>Select <strong>Review + assign</strong> to finish the assignment.</li></ol><div class="tutorial-note"><strong>Read-only access.</strong><br>This custom role contains only subscription and resource-group read actions required by the Billing Data integration.</div>';
      if (kind === 'billing' && step === 3) body = '<h3>Grant Storage Blob Data Reader</h3><ol><li>Search for <strong>Storage accounts</strong> and open the account created for the billing export.</li><li>Open <strong>Access control (IAM)</strong> → <strong>+ Add</strong> → <strong>Add role assignment</strong>.</li><li>Search for <strong>Storage Blob Data Reader</strong>, choose Next, then select <strong>LumiTure-App</strong> as the member.</li><li>Select <strong>Review + assign</strong> to finish the role assignment.</li></ol><div class="tutorial-note"><strong>Next up</strong><br>After this role is assigned, create the Event Grid subscription in the next task so LumiTure.ai knows when a new billing export arrives.</div>';
      if (kind === 'billing' && step === 4) body = '<h3>Create the Blob Created Event Subscription</h3><ol><li>In the same storage account, open <strong>Events</strong> and select <strong>+ Event Subscription</strong>.</li><li>Name the event subscription and system topic as appropriate for your organization; keep Event Schema, Topic Type, Source Resource, and Cross-tenant delivery at their defaults.</li><li>Under Event Types, select <strong>Blob Created</strong>.</li><li>Set Endpoint Type to <strong>Web Hook</strong>, select Configure an endpoint, and paste the Subscriber endpoint shown above.</li><li>Confirm selection, then select <strong>Create</strong>.</li><li>After Azure confirms creation, return here and select <strong>Check Authorization Status</strong>.</li></ol><div class="tutorial-note tutorial-warn"><strong>If the status is In Progress</strong><br>Azure data synchronization can take up to one day. If it becomes Error, reopen this setup and check every prerequisite and role assignment.</div>';
      if (kind === 'usage' && step === 0) body = '<h3>Confirm the correct subscription</h3><ol><li>Confirm that Billing Data Authorization is already Connected for the subscription you intend to use.</li><li>Make sure you have the <strong>Owner</strong> or <strong>User Access Administrator</strong> role on that subscription.</li><li>Select the subscription here. This choice generates the exact scope inside the custom-role JSON.</li></ol><div class="tutorial-note tutorial-warn"><strong>Double-check before continuing.</strong><br>The custom role is subscription-scoped. Choose the subscription that should provide Rightsizing and Recommendation data.</div>';
      if (kind === 'usage' && step === 1) body = '<h3>Update the LumiTure FinOps Reader role</h3><ol><li>In Azure Portal, open <strong>Subscriptions</strong> and select the subscription chosen above.</li><li>Open <strong>Access control (IAM)</strong> → <strong>Roles</strong>, then open the existing <strong>LumiTure FinOps Reader</strong> custom role.</li><li>Open the <strong>JSON</strong> tab and select <strong>Edit</strong>.</li><li>Copy the generated JSON above and replace the JSON editor contents.</li><li>Select <strong>Save</strong>, then continue to <strong>Review + Update</strong>.</li><li>Review the configuration and select <strong>Update</strong>.</li></ol><div class="tutorial-note"><strong>No new write permission is added.</strong><br>The updated role adds only the six read actions in the approved Figma configuration for virtual machines, SKUs, metrics, subscriptions, and resource groups.</div>';

      return '<details class="step-tutorial" open><summary>Detailed setup instructions</summary><div class="tutorial-content">' + body + '</div></details>';
    }
    function azureFlowShell(kind, step, content) {
      const config = AZURE_FLOW[kind];
      const steps = config.labels.map((label, index) => '<div class="step ' + (index === step ? 'active' : (index < step ? 'done' : '')) + '"><span class="step-dot">' + (index < step ? '✓' : index + 1) + '</span><span>' + label + '</span></div>').join('');

    openAzureFlow = function (kind) { if (!azureListMarkup) azureListMarkup = document.querySelector('.main').innerHTML; setFlowPage(true); azureFlowKind = kind || 'billing'; azureFlowStep = 0; renderAzureFlow(0); };
    renderAzureFlow = function (step) {
      azureFlowStep = step;

      let content = '';
      if (kind === 'billing' && step === 0) content = '<div class="azure-panel"><h2>Prepare your Azure billing export</h2><p>Start with the export, then connect the same subscription and grant the two read-only data paths.</p><div class="notice">Please Note That:<ul><li>The update time of Azure data is several hours.<br><span class="c6-red">After you complete the Azure authentication process, it may take up to <strong>1 day</strong> to see your resources in the LumiTure.ai platform.</span></li><li>If “Billing Export” does not been showed in the side bar, please change to the account that has the permission or contact the organization. The organization account can assign the role to the account.</li><li>This process will only export the billing of resources linked to the corresponding billing account.</li></ul></div><section class="c6-section"><h3>Prerequisites: Permissions Check</h3><p class="c6-strong">To enable and configure integration with your Azure environment, you need the following permissions:</p><ol><li>For Azure Active Directory (Entra ID) Tenant, you need the <strong>Application Administrator</strong> (or Global Administrator) role.</li><li>For Azure Resource Permissions (RBAC), you need the <strong>User Access Administrator</strong> (or Owner) role on the target Azure Subscription.</li><li>For Azure Billing Management, you need the <strong>Contributor</strong> (or Cost Management Contributor) role on the target Azure Subscription.</li></ol></section>' + journeyOverview(AZURE_FLOW.billing.labels,0) + detailedSteps('billing',0) + '<div class="flow-actions stickyish"><span aria-hidden="true"></span><button class="primary-action" onclick="renderAzureFlow(1)">Next</button></div></div>';
      if (kind === 'billing' && step === 1) content = '<div class="azure-panel is-form" style="--field-label-w:114px"><h2>Set Azure Authorization</h2><p class="c6-form-intro">Please furnish the following information obtainable from your Azure account.</p>' + c6Field('tenant-id','Tenant ID','e.g. sampleid-xxxx-xxxx-xxxx-xxxxxxxxxxxx',{value:azureBillingTenantId}) + c6Field('subscription-id','Subscription ID','e.g. sampleid-xxxx-xxxx-xxxx-xxxxxxxxxxxx',{value:azureBillingSubscriptionId}) + '<div class="notice" style="margin-top:20px"><strong>Where to find them</strong><br>Tenant ID: Microsoft Entra ID → Overview. Subscription ID: Subscriptions → select the billing-export subscription.</div>' + detailedSteps('billing',1) + '<div class="flow-actions stickyish">' + c6Prev('renderAzureFlow(0)') + '<button class="primary-action" onclick="submitAzureAuthorization()">Permission Check and Integrate</button></div></div>';
      if (kind === 'billing' && step === 2) content = '<div class="azure-panel"><h2>Create and assign LumiTure FinOps Reader</h2><p>Create the approved custom read-only role in the connected subscription, then assign it to <strong>LumiTure-App</strong>.</p><div class="notice warning">A critical final step is required for full functionality.<br>Failure to complete these steps will prevent LumiTure.ai from accessing the necessary Azure data.<br>Please finish the remaining steps so LumiTure.ai can securely access your Azure data and deliver valuable cloud spending insights.</div><div class="notice" style="margin-top:16px"><strong>Azure path</strong><br>Subscriptions → connected subscription → Access control (IAM) → + Add → Add custom role → JSON → Edit</div>' + copyPayload('Azure Portal custom-role JSON','Copy the complete JSON and replace all content in the Azure custom-role editor.','azure-billing-role-json',azureBillingRoleJson(),'Copy entire JSON') + detailedSteps('billing',2) + '<div class="flow-actions stickyish">' + c6Prev('renderAzureFlow(1)') + '<button class="primary-action" onclick="renderAzureFlow(3)">Next</button></div></div>';

    function openAwsFlow(kind) { if (!azureListMarkup) azureListMarkup = document.querySelector('.main').innerHTML; setFlowPage(true); awsFlowKind = kind || 'billing'; renderAwsFlow(0); }
    function awsCopy(label, id, value) { return c6CopyCorner(label, id, value); }   /* C-6 #28：Element / Copy Corner */
    function renderAwsFlow(step) {
      const kind = awsFlowKind, final = kind==='billing'?3:2, labels = AWS_FLOW[kind].labels; let content = '';
      if (step < final) {
        const paths = kind==='billing' ? ['AWS Organizations → Management Account','IAM → Policies → Create policy','IAM → Roles → Create role'] : ['AWS Organization Management Account','CloudFormation → StackSets → Create stack set'];

        if (kind==='billing' && step===2) extra = awsCopy("LumiTure's AWS Account ID",'aws-lumiture-account',AWS_LUMITURE_ACCOUNT) + awsCopy('External ID','aws-external-id',AWS_EXTERNAL_ID);   /* C-6：標籤照稿 #24 Step 2 */

anagement Account has been authorized for Billing Data.</li><li>Ensure you have administrative access to your Organization Management Account.</li></ul></section>';

    function submitAwsBilling() { if (!validateGcpFields(['aws-billing-account','aws-billing-role','aws-billing-policy','aws-billing-external-input'])) { showToast('Enter the Management Account and IAM details to continue.','error'); return; } const account=document.getElementById('aws-billing-account').value.trim(); if (account==='000000000000') { showPrototypeDialog('Quota Exceeded','<p>Each AWS account is limited to <strong>5 CUR 2.0</strong> and <strong>2 FOCUS</strong> data exports.</p><p>Remove an unused export or use another Management Account before running the integration again.</p>'); return; } if (account==='111111111111') { showPrototypeDialog('Permission Denied','<p>The permission check could not use the supplied IAM role and policy.</p><ul><li>Confirm the full Role ARN and Policy ARN are correct.</li><li>Confirm the complete billing policy is attached to the role.</li><li>Confirm the trust relationship uses LumiTure.ai account <strong>'+AWS_LUMITURE_ACCOUNT+'</strong> and the same External ID.</li></ul>'); return; } closeAzureFlow(); showToast('AWS Billing Data permission check started.'); }
    function submitAwsUsage() { if (!validateGcpFields(['aws-usage-stackset','aws-usage-role','aws-usage-account','aws-usage-external-input'])) { showToast('Enter the StackSet, role, Management Account, and External ID details to continue.','error'); return; } const stackset=document.getElementById('aws-usage-stackset').value.trim().toLowerCase(); if (stackset==='stackset-failed') { showPrototypeDialog('StackSet Deployment Failed','<p>The StackSet failed to deploy to one or more target AWS accounts.</p><p>Open <strong>AWS CloudFormation → StackSets → Stack instances</strong> and review the detailed error for each failed target account.</p>'); return; } if (stackset==='policy-mismatch') { showPrototypeDialog('IAM Policy Mismatch','<p>The StackSet deployed, but its inline IAM policy does not match the required LumiTure.ai permissions.</p><p>Compare the deployed policy with the supplied template and redeploy the affected instances.</p>'); return; } if (stackset==='invalid-parameters') { showPrototypeDialog('Invalid Configuration Parameters','<p>The supplied StackSet Name or Member Management Role Name does not map to an active deployment in this AWS Organization.</p><p>Copy both values from the StackSet details and Parameters section, then try again.</p>'); return; } closeAzureFlow(); showToast('AWS Usage Data authorization integrated successfully.'); }
    addAuthorization = function (providerName, type) { openMenu = null; if (providerName === 'Azure') { openAzureFlow(type === 'Usage Data' ? 'usage' : 'billing'); return; } if (providerName === 'Google Cloud') { openGcpFlow(type === 'Usage Data' ? 'usage' : 'billing'); return; } if (providerName === 'AWS') { openAwsFlow(type === 'Usage Data' ? 'usage' : 'billing'); return; } render(); };
    const demoPanel = document.querySelector('.demo-panel'); if (demoPanel) demoPanel.insertAdjacentHTML('beforeend','<span class="demo-label" style="margin-top:10px">Azure Flows</span><button class="demo-choice" onclick="openAzureFlow(\'billing\');document.getElementById(\'demo\').classList.remove(\'open\')">Billing Data redesign</button><button class="demo-choice" onclick="openAzureFlow(\'usage\');document.getElementById(\'demo\').classList.remove(\'open\')">Usage Data redesign</button>');

  <script>
    /* ============================================================
     * C 區 C-6 對稿（2026-10-16）：表單、彈窗、toast、離開確認與 Demo 情境
     * 只對視覺與文案，journey 結構維持 v4（Kabin 10/15）。條號對 specs/2026-10-15-c-region/c6-compare.md
     * ============================================================ */
    const C6_FORMS = {
      'gcp-billing': ['gcp-billing-account','gcp-detailed-project','gcp-detailed-dataset','gcp-pricing-project','gcp-pricing-dataset'],
      'gcp-usage': ['gcp-scoping-project'],
      'aws-billing': ['aws-billing-account','aws-billing-role','aws-billing-policy','aws-billing-external-input'],
      'aws-usage': ['aws-usage-stackset','aws-usage-role','aws-usage-account','aws-usage-external-input'],
      'azure-billing': ['tenant-id','subscription-id']
    };
    const C6_FORM_DEFAULTS = {'aws-usage-external-input': AWS_EXTERNAL_ID};
    const C6_FORM_STEP = {'gcp-billing':()=>renderGcpFlow(5),'gcp-usage':()=>renderGcpFlow(2),'aws-billing':()=>renderAwsFlow(3),'aws-usage':()=>renderAwsFlow(2),'azure-billing':()=>renderAzureFlow(1)};
    const C6_DIRTY_TEXT = 'Unsaved changes will be lost. Are you sure you want to leave?';
    let c6Vals = {};      /* #30：已填內容依雲保留（稿 #28-1／#24-2 註記：切回 guide 再回來要保留） */
    let c6Checked = {};   /* #29：已通過 Information／Permission Check 的表單（欄位轉 disabled） */
    let c6Flow = null;    /* 目前開著的流程，例如 'gcp-billing' */

    /* #12／#23：欄位＝標籤（必填紅星）＋撐滿的輸入框＋框下方錯誤字 */
    function c6Field(id, label, ph, opts) {
      opts = opts || {};
      const v = (id in c6Vals) ? c6Vals[id] : (opts.value || C6_FORM_DEFAULTS[id] || '');
      return '<div class="field' + (opts.sub ? ' sub' : '') + '"><label for="' + id + '">' + label + '<span class="req"> *</span></label><input id="' + id + '" value="' + escapeHtml(v) + '" placeholder="' + escapeHtml(ph) + '" oninput="c6OnInput(this)"><div class="field-error" id="' + id + '-err" hidden></div></div>';
    }
    function c6LabelOf(id) { const l = document.querySelector('label[for="' + id + '"]'); return l ? l.childNodes[0].textContent.trim() : id; }
    function c6SetError(id, msg) { const i = document.getElementById(id), e = document.getElementById(id + '-err'); if (!i || !e) return; i.classList.toggle('error', !!msg); e.hidden = !msg; e.textContent = msg || ''; }
    function c6OnInput(el) { c6Vals[el.id] = el.value; c6SetError(el.id, el.value.trim() ? '' : c6LabelOf(el.id) + ' cannot be empty'); }   /* 稿 #49-1 註記：是否為空，編輯後立即判斷 */
    function c6Validate(ids) { let ok = true; ids.forEach(id => { const el = document.getElementById(id); if (!el) return; c6Vals[id] = el.value; const empty = !el.value.trim(); c6SetError(id, empty ? c6LabelOf(id) + ' cannot be empty' : ''); if (empty && ok) { el.focus(); } ok = ok && !empty; }); return ok; }
    function c6Val(id) { const el = document.getElementById(id); return (el ? el.value : (c6Vals[id] || '')).trim(); }

    /* #16／#24：上一步一律 Previous（Kabin 10/15 規則；樣式照稿 secondary/link/borderless） */
    function c6Prev(onclick) { return '<button class="secondary-action" type="button" onclick="' + onclick + '"><span class="sa-label">Previous</span></button>'; }
    previousControl = function (step, onclick) { return step === 0 ? '<span aria-hidden="true"></span>' : c6Prev(onclick); };
    /* #31（K2）：照稿 #38 註記拿掉左上 Back to Authorization List，離開走 sidebar */
    flowReturnControl = function () { return ''; };
    /* #27：程式碼區塊 header 只留右側 Copy code */
    copyPayload = function (title, caption, id, value, badge) {
      return '<section class="copy-section"><h3>' + title + '</h3>' + (caption ? '<p class="copy-caption">' + caption + '</p>' : '') + '<div class="code-snippet"><div class="code-snippet-head"><button class="code-copy" onclick="copyAzureValue(\'' + id + '\')"><span class="material-symbols-outlined">content_paste</span>Copy code</button></div><pre><code id="' + id + '">' + escapeHtml(value) + '</code></pre></div></section>';
    };
    /* #28：單值複製框 Element / Copy Corner */
    function c6CopyCorner(label, id, value) { return '<div class="copy-corner"><span class="cc-label">' + label + '</span><span class="cc-row"><span class="cc-val" id="' + id + '">' + escapeHtml(value) + '</span><button class="cc-btn" type="button" aria-label="Copy ' + escapeHtml(label) + '" onclick="copyAzureValue(\'' + id + '\')"><span class="material-symbols-outlined">content_copy</span></button></span></div>'; }

    /* #29（K3）：GCP／AWS Billing 表單先 Check 再 Integrate（稿 #28-1、#24-2、#24-4） */
    function c6CheckIntegrate(form, checkLabel, submit) {
      const ok = !!c6Checked[form];
      return '<div class="c6-right"><button class="primary-action" type="button" id="' + form + '-check" ' + (ok ? 'disabled' : '') + ' onclick="c6RunCheck(\'' + form + '\')">' + (ok ? '<span class="material-symbols-outlined">check</span>' : '') + checkLabel + '</button><span class="c6-tip-wrap"' + (ok ? '' : ' data-tip-c6="You should process “' + checkLabel + '” first."') + '><button class="primary-action" type="button" id="' + form + '-integrate" ' + (ok ? '' : 'disabled') + ' onclick="' + submit + '">Integrate</button></span></div>';
    }
    function c6RunCheck(form) {
      const ids = C6_FORMS[form]; if (!c6Validate(ids)) return;
      if (form === 'aws-billing' && !/^\d{12}$/.test(c6Val('aws-billing-account'))) { c6SetError('aws-billing-account', 'Invalid account ID'); return; }
      const btn = document.getElementById(form + '-check'); btn.disabled = true; btn.innerHTML = '<span class="c6-spin" aria-label="Checking"></span>';   /* 稿註記：需要時間時按鈕上顯示 spinner */
      setTimeout(() => { c6Checked[form] = true; C6_FORM_STEP[form](); }, 800);
    }
    /* 檢查通過後欄位轉 disabled（#24-4 註記）；focusActiveStep 是每條流程 render 完都會呼叫的收尾 */
    const _c6Focus = focusActiveStep;
    focusActiveStep = function () { _c6Focus(); c6FitLabels(); Object.keys(c6Checked).forEach(form => { if (c6Checked[form]) C6_FORMS[form].forEach(id => { const el = document.getElementById(id); if (el) el.disabled = true; }); }); };

    /* 標籤欄寬以稿為下限；實際字寬比稿寬時（字型 metrics 差幾 px）自動加寬，紅星不被擠到下一行 */
    function c6FitLabels() { document.querySelectorAll('.azure-panel.is-form').forEach(panel => { const base = parseFloat(panel.style.getPropertyValue('--field-label-w')) || 131; let need = base; panel.querySelectorAll('.field').forEach(f => { const l = f.querySelector('label'); need = Math.max(need, Math.ceil(l.scrollWidth) + (f.classList.contains('sub') ? 20 : 0)); }); if (need > base) panel.style.setProperty('--field-label-w', need + 'px'); }); }
    /* 流程開關：記住目前流程、離開時清掉已填內容 */
    function c6Reset(flow) { (flow ? (C6_FORMS[flow] || []) : Object.values(C6_FORMS).flat()).forEach(id => delete c6Vals[id]); if (flow) delete c6Checked[flow]; else c6Checked = {}; }
    const _c6OpenGcp = openGcpFlow, _c6OpenAws = openAwsFlow, _c6OpenAzure = openAzureFlow;
    openGcpFlow = function (kind) { c6Flow = 'gcp-' + (kind || 'billing'); _c6OpenGcp(kind); };
    openAwsFlow = function (kind) { c6Flow = 'aws-' + (kind || 'billing'); _c6OpenAws(kind); };
    openAzureFlow = function (kind) { c6Flow = 'azure-' + (kind || 'billing'); _c6OpenAzure(kind); };

    function c6Dirty() { if (!c6Flow || !C6_FORMS[c6Flow]) return false; if (c6Checked[c6Flow]) return true; return C6_FORMS[c6Flow].some(id => { const v = (c6Vals[id] || '').trim(); return v && v !== (C6_FORM_DEFAULTS[id] || ''); }); }

    /* #26：錯誤／確認彈窗（標題 icon #676767、Got it 寬 100；可帶兩顆按鈕） */
    function c6Dialog(title, body, actions) {
      const root = document.getElementById('prototype-dialog-root');
      root.innerHTML = '<div class="prototype-dialog-backdrop" role="presentation" onclick="if(event.target===this)closePrototypeDialog()"><section class="prototype-dialog" role="dialog" aria-modal="true" aria-labelledby="prototype-dialog-title"><div class="prototype-dialog-head"><div class="prototype-dialog-title"><span class="material-symbols-outlined">warning</span><h2 id="prototype-dialog-title">' + title + '</h2></div><button class="dialog-close" aria-label="Close" onclick="closePrototypeDialog()"><span class="material-symbols-outlined">close</span></button></div><div class="prototype-dialog-content">' + body + '</div><div class="prototype-dialog-actions">' + (actions || '<button class="primary-action" onclick="closePrototypeDialog()">Got it</button>') + '</div></section></div>';

    }
    showPrototypeDialog = c6Dialog;
    /* #10：#27 Confirmation Before Leaving（表單有填值或已檢查，從 sidebar 離開時；回頭看 guide 不算） */
    let c6PendingHref = null;
    function c6ConfirmLeave(href) { c6PendingHref = href; c6Dialog('Confirmation', '<p>' + C6_DIRTY_TEXT + '</p>', '<button class="dialog-cancel" onclick="c6PendingHref=null;closePrototypeDialog()">Cancel</button><button class="primary-action" onclick="c6DiscardAndLeave()">Discard changes</button>'); }
    function c6DiscardAndLeave() { const href = c6PendingHref; c6PendingHref = null; c6Reset(c6Flow); closePrototypeDialog(); if (href && href !== '#') location.href = href; else closeAzureFlow(); }
    document.addEventListener('click', e => { const a = e.target.closest('#lt-sidebar a[href], #lt-topbar a[href]'); if (!a || !document.body.classList.contains('is-flow-page') || !c6Dirty()) return; e.preventDefault(); e.stopPropagation(); c6ConfirmLeave(a.getAttribute('href')); }, true);

    /* #13：toast 照稿 #26／#40／#46／#53 */
    const C6_OK = 'Authorization integrated successfully.', C6_FAIL = 'Unable to integrate authorization. Please try again later.';
    function c6Success() { closeAzureFlow(); showToast(C6_OK); }

    /* #3／#4：GCP Billing Integrate（#29 Permission Denied、#29-1 Path Not Found；fail → 失敗 toast） */
    submitGcpBilling = function () {
      if (!c6Validate(C6_FORMS['gcp-billing'])) return;

      if (c6Val('gcp-detailed-project') === 'path-not-found') { c6Dialog('Path Not Found', '<p>Please check the input and ensure the following:</p><ul><li>The <strong>Project ID</strong> is correct.</li></ul>'); return; }   /* 稿 {Project ID} 依後端回傳換成 Billing Account ID／Project ID／Dataset Name */
      if (c6Val('gcp-billing-account') === 'fail') { showToast(C6_FAIL, 'error'); return; }

    /* #5／#6：GCP Usage Integrate（#44、#45；已註冊用欄位錯誤字，⚠ 設計端暫擬：稿只畫了 AWS 的 StackSet 版） */
    submitGcpUsage = function () {

  var style = document.createElement('style');

  // ===== HELPERS =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  // Normalise scenario: tab → page (backwards compat)
  function _normalizedScenarios() {
    return (window.DEMO_SCENARIOS || []).map(function (s) {
      return Object.assign({}, s, { page: s.page || s.tab || null });
    });
  }

  // Detect rendering mode based on what's configured
  function _detectMode() {
    var scenarios = _normalizedScenarios();
    var hasPages = (window.DEMO_PAGES && window.DEMO_PAGES.length) ||
                   scenarios.some(function (s) { return !!s.page; });
    var hasCats  = (window.DEMO_CATEGORIES && window.DEMO_CATEGORIES.length) ||
                   scenarios.some(function (s) { return !!s.category; });
    if (hasPages && hasCats) return 'two-layer';
    if (hasPages) return 'pages-only';
    if (hasCats)  return 'categories-only';
    return 'flat';
  }

  // Auto-derive page list if DEMO_PAGES not provided
  function _getPages() {
    if (window.DEMO_PAGES && window.DEMO_PAGES.length) return window.DEMO_PAGES;
    var seen = {};
    var pages = [];
    _normalizedScenarios().forEach(function (s) {
      if (s.page && !seen[s.page]) {
        seen[s.page] = true;
        pages.push({ id: s.page, label: s.page.charAt(0).toUpperCase() + s.page.slice(1), icon: 'tab' });
      }
    });
    return pages;
  }

  function _getCategories() {
    return window.DEMO_CATEGORIES || [];
  }

  // Filter scenarios for current page + category
  function _filterScenarios() {
    var scenarios = _normalizedScenarios();
    return scenarios.filter(function (s) {
      if (_activePage && s.page && s.page !== _activePage) return false;
      if (_activePage && !s.page) return false; // page-tab mode requires scenario to have page
      if (_activeCategory && s.category && s.category !== _activeCategory) return false;
      if (_activeCategory && !s.category) return false; // cat-tab mode requires scenario to have category
      return true;
    });
  }

  // ===== HTML BUILDERS =====
  function _renderButtons(scenarios) {
    if (!scenarios.length) {
      return '<div class="demo-empty">No scenarios in this view.</div>';
    }
    var normal = scenarios.filter(function (s) { return !s.isNoData; });
    var noData = scenarios.filter(function (s) { return s.isNoData; });
    var html = '';
    if (normal.some(function (s) { return !!s.group; })) {
      var order = [];
      normal.forEach(function (s) { var g = s.group || ''; if (order.indexOf(g) < 0) order.push(g); });
      order.forEach(function (g) {
        if (g) html += '<div class="demo-grp-sep">' + _esc(g) + '</div>';
        html += _renderGroup(normal.filter(function (s) { return (s.group || '') === g; }));
      });
    } else {
      html = _renderGroup(normal);
    }
    if (noData.length) {
      html += '<div class="demo-sub-sep">no data</div>' + _renderGroup(noData);
    }
    return html;
  }

  function _renderGroup(scenarios) {
    if (!scenarios.length) return '';
    var btns = scenarios.map(function (s) {
      var dis = s.disabled ? ' demo-dis' : '';
      var act = s.id === _activeScenario ? ' active' : '';
      var tip = s.tip ? ' data-tip="' + _esc(s.tip) + '"' : '';
      var cs = s.disabled ? '<span class="demo-cs">Soon</span>' : '';
      return '<button class="demo-btn' + dis + act + '"' + tip +
             ' data-scenario="' + _esc(s.id) + '">' +
             '<span class="material-symbols-outlined">' + _esc(s.icon || 'play_arrow') + '</span>' +
             '<span>' + _esc(s.label) + '</span>' + cs + '</button>';
    }).join('');
    return '<div class="demo-buttons">' + btns + '</div>';
  }

  function _renderPageTabs(mode) {
    var pages = _getPages();
    if (!pages.length) return '';
    // 雙層模式：page tabs 用 pill style 放最上面
    // 單層 pages-only 模式：page tabs 用 underline style（跟 cat-tabs 一致），無第二層
    var isTwoLayer = mode === 'two-layer';
    var wrapClass = isTwoLayer ? 'demo-page-tabs' : 'demo-cat-tabs';
    var tabClass  = isTwoLayer ? 'demo-page-tab' : 'demo-cat-tab';
    return '<div class="' + wrapClass + '">' + pages.map(function (p) {
      var act = p.id === _activePage ? ' active' : '';
      return '<button class="' + tabClass + act + '" data-page="' + _esc(p.id) + '">' +
             (p.icon ? '<span class="material-symbols-outlined">' + _esc(p.icon) + '</span>' : '') +
             _esc(p.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderCategoryTabs() {
    var cats = _getCategories();
    if (!cats.length) return '';
    return '<div class="demo-cat-tabs">' + cats.map(function (c) {
      var act = c.id === _activeCategory ? ' active' : '';
      return '<button class="demo-cat-tab' + act + '" data-category="' + _esc(c.id) + '">' +
             (c.icon ? '<span class="material-symbols-outlined">' + _esc(c.icon) + '</span>' : '') +
             _esc(c.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderHint() {
    if (!_activeCategory) return '';
    var cat = _getCategories().find(function (c) { return c.id === _activeCategory; });
    if (!cat || !cat.hint) return '';
    return '<div class="demo-pane-hint">' + _esc(cat.hint) + '</div>';
  }

  function _renderScrollArea() {
    return _renderHint() + _renderButtons(_filterScenarios());
  }

  // ===== DOM MOUNTING =====
  function _render() {
    if (document.getElementById('demo-fab')) return;

    // Auto-detect first page & category
    var mode = _detectMode();
    var pages = _getPages();
    var cats = _getCategories();
    if (!_activePage && pages.length) _activePage = pages[0].id;
    if (!_activeCategory && cats.length) _activeCategory = cats[0].id;
    if (mode === 'flat') { _activePage = null; _activeCategory = null; }
    if (mode === 'pages-only') _activeCategory = null;
    if (mode === 'categories-only') _activePage = null;

    // FAB
    var fabEl = document.createElement('button');
    fabEl.className = 'demo-fab';
    fabEl.id = 'demo-fab';
    fabEl.setAttribute('data-tip', 'Designer Demo Scenarios');   /* 原生 title 改 data-tip（#gl-tip），B 區 A-15 */
    fabEl.innerHTML =
      '<span class="material-symbols-outlined">science</span>' +
      '<span class="demo-pulse" id="demo-fab-pulse"></span>';
    fabEl.addEventListener('click', function () { window._demoFabToggle(); });

    // Popover
    var popEl = document.createElement('div');
    popEl.className = 'demo-popover';
    popEl.id = 'demo-popover';
    popEl.innerHTML =
      '<div class="demo-popover-hdr">' +
        '<div class="demo-popover-title">' +
          '<span class="material-symbols-outlined" style="font-size:16px">science</span>' +
          'Demo Scenarios' +
        '</div>' +
        '<button class="demo-popover-close" id="demo-pop-close">' +
          '<span class="material-symbols-outlined" style="font-size:18px">close</span>' +
        '</button>' +
      '</div>' +
      (window.DEMO_DEFAULT
        ? '<button class="demo-reset-link" id="demo-reset-link">' +
            '<span class="material-symbols-outlined">refresh</span>Reset to Default</button>'
        : '') +
      _renderPageTabs(mode) +
      _renderCategoryTabs() +
      '<div class="demo-popover-scroll" id="demo-popover-scroll">' +
        _renderScrollArea() +
      '</div>';

    document.body.appendChild(fabEl);
    document.body.appendChild(popEl);

    // === Event wiring ===
    document.getElementById('demo-pop-close').addEventListener('click', function () {
      window._demoFabToggle();
    });

    // Reset link
    var resetLink = document.getElementById('demo-reset-link');
    if (resetLink && window.DEMO_DEFAULT) {
      resetLink.addEventListener('click', function () {
        window._demoFabApply(window.DEMO_DEFAULT, null);
      });
    }

    // Page tabs
    popEl.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        window._demoFabSetPage(t.dataset.page);
      });
    });

    // Category tabs (also handles page tabs in pages-only mode, where they use demo-cat-tab class)
    popEl.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        if (t.dataset.page) {
          window._demoFabSetPage(t.dataset.page);
        } else {
          window._demoFabSetCategory(t.dataset.category);
        }
      });
    });

    // Scenario button clicks (event delegation on scroll area)
    document.getElementById('demo-popover-scroll').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-scenario]');
      if (!btn || btn.classList.contains('demo-dis')) return;
      window._demoFabApply(btn.dataset.scenario, btn);
    });

    // Outside click to close
    document.addEventListener('click', function (e) {
      var pop = document.getElementById('demo-popover');
      var fab = document.getElementById('demo-fab');
      if (!pop || !fab) return;
      if (!pop.contains(e.target) && !fab.contains(e.target) && pop.classList.contains('show')) {
        pop.classList.remove('show');
        fab.classList.remove('popped');
      }
    });

    _injectGlobalTooltip();
  }

  // ===== #gl-tip auto-injection =====
  function _injectGlobalTooltip() {
    if (document.getElementById('gl-tip')) return; // host page already provides one
    var tip = document.createElement('div');
    tip.id = 'gl-tip';
    document.body.appendChild(tip);
    var cur = null;
    // 2026-10-09 Kabin 裁決：全站 tooltip 改成錨在元件上（Figma／MUI 行為），不再跟著游標跑。
    // 規則照 Anomaly Detection #01-3 量到的：預設出現在元件上方 6px、水平靠元件左緣，
    // 右邊放不下就改靠元件右緣 +2；上方放不下改到下方。
    // 可選屬性：data-tip-pos="below"（固定放下方）、data-tip-dy（下方距離，預設 4）、
    // data-tip-anchor（CSS 選擇器，錨在子元素上）、data-tip-align="content-right"（右緣對齊內容右緣 −16）。
    function place() {
      if (!cur || !cur.isConnected) { cur = null; tip.style.display = 'none'; return; }
      var a = (cur.dataset.tipAnchor && cur.querySelector(cur.dataset.tipAnchor)) || cur;
      var r = a.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
      var vw = window.innerWidth, vh = window.innerHeight;
      var x = r.left;
      if (x + tw > vw - 8) x = Math.max(8, Math.min(r.right + 2, vw - 8) - tw);
      if (cur.dataset.tipAlign === 'content-right') x = Math.max(8, r.right - 16 - tw);
      var below = cur.dataset.tipPos === 'below';
      var dy = cur.dataset.tipDy != null ? +cur.dataset.tipDy : 4;
      var y = below ? r.bottom + dy : r.top - th - 6;
      if (y < 8) y = r.bottom + 4;
      if (y + th > vh - 8) y = Math.max(8, r.top - th - 6);
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (!el || (el === cur && tip.style.display !== 'none')) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block'; place();
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (el && el === cur && !el.contains(e.relatedTarget)) { cur = null; tip.style.display = 'none'; }
    });
    window.addEventListener('scroll', place, true);
    window.addEventListener('resize', place);
  }

  // ===== PUBLIC API =====
  function _refreshScrollArea() {
    var scroll = document.getElementById('demo-popover-scroll');
    if (!scroll) return;
    scroll.style.opacity = '0';
    setTimeout(function () {
      scroll.innerHTML = _renderScrollArea();
      scroll.style.opacity = '1';
    }, 120);
  }

  function _refreshTabs() {
    var pop = document.getElementById('demo-popover');
    if (!pop) return;
    pop.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === _activePage);
    });
    pop.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      // In pages-only mode, cat-tab elements carry data-page (not data-category)
      if (t.dataset.page) {
        t.classList.toggle('active', t.dataset.page === _activePage);
      } else {
        t.classList.toggle('active', t.dataset.category === _activeCategory);
      }
    });
  }

  /** Toggle popover open/close */
  window._demoFabToggle = function () {
    var pop = document.getElementById('demo-popover');
    var fab = document.getElementById('demo-fab');
    var pulse = document.getElementById('demo-fab-pulse');
    var opening = !pop.classList.contains('show');
    pop.classList.toggle('show');
    fab.classList.toggle('popped');
    if (opening && pulse) pulse.style.display = 'none';
  };

  /** Set active page tab (internal + external) */
  window._demoFabSetPage = function (pageId) {
    if (_activePage === pageId) return;
    _activePage = pageId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /** Set active category tab */
  window._demoFabSetCategory = function (catId) {
    if (_activeCategory === catId) return;
    _activeCategory = catId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /**

   * Only switches if the popover doesn't need to stay on current tab.
   */
  window.demoFabSwitchTab = function (pageId) {
    window._demoFabSetPage(pageId);
  };

  /** onLeave 鉤子（2026-10-15）：切走上一個情境時先呼叫它，讓頁面把該情境塞進模組狀態的東西重設掉（避免 Demo 殘留，例如 RS 先點 um-* 再開 modal-detail）。
   *   寫法一：scenario.onLeave = function (nextId) {…}　寫法二：window.DEMO_ON_LEAVE = function (prevId, nextId) {…}（兩種都會呼叫，先 scenario 後全域）
   *   觸發點有兩個：點 FAB 按鈕（_demoFabApply）與「直接呼叫 window.DEMO_APPLY(id)」（下面的 DEMO_APPLY 包裝，第二輪 R1 加，讓 sweep 工具也量得到殘留）。 */
  function _runLeave(id) {
    var prevId = _activeScenario;
    if (prevId && prevId !== id) {
      try {
        var prev = (window.DEMO_SCENARIOS || []).filter(function (s) { return s.id === prevId; })[0];
        if (prev && typeof prev.onLeave === 'function') prev.onLeave(id);
        if (typeof window.DEMO_ON_LEAVE === 'function') window.DEMO_ON_LEAVE(prevId, id);
      } catch (e) { console.error('[demo-fab] onLeave', e); }
    }
  }

  /** 包住頁面的 window.DEMO_APPLY：直接呼叫（不經 FAB）時也先跑 onLeave，並記下目前情境。
   *  經 _demoFabApply 進來的呼叫用 _inFabApply 旗標略過，所以 onLeave 不會被呼叫兩次。
   *  頁面不論在 demo-fab.js 載入前或後指定 window.DEMO_APPLY = fn 都會被攔到（accessor 屬性）。 */
  var _inFabApply = false;
  (function _wrapDemoApply() {
    var raw = window.DEMO_APPLY, wrapped = null, wrappedFor = null;
    function get() {
      if (typeof raw !== 'function') return raw;
      if (wrappedFor !== raw) {
        wrappedFor = raw;
        wrapped = function (id) {
          if (!_inFabApply) { _runLeave(id); _activeScenario = id; }
          return raw.apply(this, arguments);
        };
      }
      return wrapped;
    }
    try {
      Object.defineProperty(window, 'DEMO_APPLY', { configurable: true, enumerable: true, get: get, set: function (fn) { raw = fn; } });
    } catch (e) { /* 屬性不可重定義（極少見）：退回不包裝，只剩 FAB 點擊會觸發 onLeave */ }
  })();

  /** Apply a scenario — called via event delegation or by host */
  window._demoFabApply = function (id, btn) {
    _runLeave(id);
    if (window.LumitureToast && window.LumitureToast.clear) { try { window.LumitureToast.clear(); } catch (e) {} }   // 換情境時清掉上一個情境留下的 toast
    _activeScenario = id;
    document.querySelectorAll('.demo-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    if (btn) {
      btn.classList.add('active');
    } else {
      // No btn provided (e.g. Reset link) — find scenario in DOM
      var found = document.querySelector('[data-scenario="' + id + '"]');
      if (found) found.classList.add('active');
    }
    if (typeof window.DEMO_APPLY === 'function') {
      _inFabApply = true;
      try { window.DEMO_APPLY(id, btn); } finally { _inFabApply = false; }
    }
  };

  // ===== INIT =====
  function _init() {
    if (_activeScenario === null && window.DEMO_DEFAULT) {
      _activeScenario = window.DEMO_DEFAULT;
    }
    _render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>
<script>
/* ============================================================
 * General Behavior：角色切換（2026-10-14，Figma General Behavior #01-5 Popup: Select Your Role）
 * Account Menu → View as Another Role 選好角色按 Continue 後，shared/lumiture-topbar.js 先做「原頁面 Loading」，
 * 再呼叫下面的 LUMITURE_ROLE_CHANGE 讓這一頁變成那個角色看到的樣子；角色不在 LUMITURE_ALLOWED_ROLES 裡就跳回 Overview。
 * 套用角色走 _demoFabApply（跟 Demo FAB 按鈕同一條路），FAB 的 active 情境會跟著亮；沒有 FAB 時退回 DEMO_APPLY
 * 角色鍵：admin／t1m／t1mb／t2m／t2mb（對照表見 specs/2026-10-14-general-behavior-v1-figma-compare.md §6）
 * ============================================================ */
(function () {
  /* 依據：頁面 Demo FAB 的 'no-access'（標籤「No Access (non Owner/Admin)」）。頁面沒有角色狀態，只有「Admin 看得到／不是 Owner/Admin 就整頁無權限」 */
  window.LUMITURE_ALLOWED_ROLES = ['admin'];
  window.LUMITURE_ROLE_CHANGE = function (key, group) {
    (window._demoFabApply || window.DEMO_APPLY)(key === 'admin' ? 'default' : 'no-access');   /* 載入時套用用；非 admin 會顯示頁面自己的 No Access */
    if (window.LumitureTopbar) LumitureTopbar.setRole(LumitureTopbar.roleLabel(group));
  };
})();
</script>
