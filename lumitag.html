/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */

  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */

  --lt-grey-100: #F2F2F2;

  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */

  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */

  /* ============================================================

  --lt-input-bg:        var(--lt-color-bg-default);

<script>
/* === Inlined: shared/lumiture-checkbox.js === */
/*!
 * lumiture-checkbox.js — Lumiture Shared Checkbox v1
 *
 * Design spec: Lumiture-Guideline #Checkbox（S size / Primary / unchecked-checked-mixed）
 *   16×16、--lt-radius-sm、border --lt-grey-300、checked/mixed 皆 --lt-color-primary
 *   四態齊全：hover / focus-visible / disabled / mixed
 *   mixed 用 remove icon、checked 用 check icon
 *
 * 為什麼不是純 span、也不是純原生 input
 * ---------------------------------------------------------------------------
 * group-list v3 當初改成純 span，理由是原生 input[type=checkbox] 在部分瀏覽器的
 * unchecked 狀態會多畫出一個痕跡（實測與 accent-color、尺寸都無關，是瀏覽器畫
 * 原生方框本身的痕跡）。但那個痕跡來自「被畫出來的」原生方框；把 input 藏成
 * opacity:0 之後它一樣不存在，而 .checked / .indeterminate / :checked 三個介面
 * 全部保留下來。
 *
 * 這件事有實際意義，因為既有 prototype 分成兩派狀態模型：
 *   重繪派  caller 持有 Set/物件，傳 checked/mixed 進來，改變後重繪整塊
 *           （group-list v3、cost-dashboard v2）
 *   DOM 派  DOM 本身就是狀態，靠 el.checked / :checked 反推
 *           （lumi-tag v8 的多選面板、rightsizing v1 的表格與 .sc-check）
 * 純 span 會逼 DOM 派發明一套狀態層；純原生 input 會逼重繪派回頭補
 * input.indeterminate（HTML 沒有這個屬性，只能渲染後補丁）。
 *
 * 解法是讓 CSS 同時吃兩種來源：
 *   .checkbox input:checked ~ .checkbox__box   ← DOM 派
 *   .checkbox.is-checked     .checkbox__box    ← 重繪派
 * 兩條路落在同一組像素上，誰都不用改自己的模型。
 *
 * 附帶把原生語意拿回來：Space 鍵、label 關聯、form 參與、focus 目標都是免費的
 * （group-list v3 的註記自己就寫過「原生 input 這些是免費的」）。
 *
 * ---------------------------------------------------------------------------
 * 用法 A — 重繪派（caller 持有狀態）
 *
 *   LumiCheckbox.html({ checked, mixed, disabled, onclick })
 *   → 傳 class，渲染時就決定，不需要渲染後補 indeterminate
 *
 *     rows.map(r => LumiCheckbox.html({
 *       checked: sel.has(r.id),
 *       onclick: `toggleRow('${r.id}')`
 *     })).join('')
 *
 * 用法 B — DOM 派（DOM 即狀態）
 *
 *   LumiCheckbox.html({ stateful:true, checked, value, cls, onchange })
 *   → 產生真的 input，el.checked / el.indeterminate / :checked 照常運作
 *
 *     `<label>${LumiCheckbox.html({ stateful:true, cls:'ms-chk', value:opt })}
 *        <span>${opt}</span></label>`
 *     panel.querySelectorAll('.ms-chk:checked')     // 照常
 *     chkAll.indeterminate = true                    // 照常
 *
 * 兩種用法可以同檔混用，視覺完全一致。
 *
 * ---------------------------------------------------------------------------
 * Exposes
 *   LumiCheckbox.html(opts)   → HTML 字串
 *   LumiCheckbox.el(opts)     → DOM 節點（需要直接 append 時用）
 *   LumiCheckbox.input(elOrSelector) → 取出內部 input（stateful 用）
 *   LumiCheckbox.set(elOrSelector, {checked, mixed, disabled})
 *                             → 兩種模式共用的狀態設定，caller 不用管是哪一種
 *
 * opts
 *   checked   bool    初始/當前選中
 *   mixed     bool    部分選中（重繪派用 class；DOM 派請改設 input.indeterminate）
 *   disabled  bool
 *   stateful  bool    true = 產生真 input（DOM 派），false = 純 class（重繪派）
 *   onclick   string  inline handler（重繪派慣用；自動包 event.stopPropagation）
 *                     省略 = 這個 checkbox 只是外層控制項的視覺，會輸出
 *                     aria-hidden 且不搶 tab 焦點、不擋外層的 onclick
 *   onchange  string  inline handler（stateful 慣用）
 *   value     string  stateful 的 input value
 *   cls       string  額外掛在 input 上的 class（讓既有選擇器如 .ms-chk 繼續命中）
 *   attrs     object  額外屬性，如 {'data-gi':3}。stateful 掛 input、重繪派掛外層
 *   wrapTag   string  stateful 外層標籤，預設 'label'。外層已經是 <button>
 *                     之類的互動元素時傳 'span'，避免巢狀 label 重複觸發
 *   interactive bool  重繪派專用。它自己是一個控制項、但 handler 是外部
 *                     addEventListener 綁的（不是 inline onclick）。會輸出
 *                     role/tabindex，鍵盤以 this.click() 合成點擊
 *   wrapCls   string  額外掛在外層 .checkbox 上的 class
 *   id        string  input id（配 <label for>）
 *   name      string  input name
 *   label     string  右側文字；省略則只有方框
 *   ariaLabel string  無可見文字時的無障礙名稱
 *   title     string  原生 title 提示（掛在外層）
 *   stop      bool    是否包 event.stopPropagation（預設 true）
 */
(function () {
  'use strict';

  /* ---- CSS（自我注入，載入即可用，不需各 prototype 複製）---- */
  var CSS = [
    '.checkbox{display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:0 0 auto;position:relative;vertical-align:middle}',
    '.checkbox.is-disabled{cursor:not-allowed}',
    /* 真 input 藏起來但保留在無障礙樹與 tab 序中。不用 display:none／visibility:hidden，
     * 那兩個會讓它拿不到焦點，:focus-visible 就沒有東西可以掛。 */
    '.checkbox input.checkbox__input{position:absolute;width:16px;height:16px;margin:0;opacity:0;cursor:inherit;z-index:1}',
    '.checkbox input.checkbox__input:disabled{cursor:not-allowed}',
    '.checkbox__box{display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px;width:16px;height:16px;border:1px solid var(--lt-grey-300,#CCCCCC);border-radius:var(--lt-radius-sm,4px);background:#fff;transition:border-color 150ms ease,background 150ms ease,box-shadow 200ms ease}',
    '.checkbox__icon{color:#fff;display:none;font-size:12px;line-height:1;font-variation-settings:\'FILL\' 1,\'wght\' 700,\'GRAD\' 0,\'opsz\' 20}',
    '.checkbox__label{font-size:14px;color:var(--lt-color-text-primary,#262626);user-select:none}',
    '.checkbox.is-disabled .checkbox__label{color:var(--lt-color-text-disabled,#B3B3B3)}',

    /* hover */
    '.checkbox:hover .checkbox__box{border-color:var(--lt-grey-400,#B3B3B3)}',

    /* checked／mixed 的填色。左邊是 DOM 派（真 input），右邊是重繪派（class）。 */
    '.checkbox__input:checked~.checkbox__box,',

function validateName(input,prefix,editId){const v=input.value;const hint=document.getElementById(prefix+'-hint');const valid=/^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(v);const exists=S.tags.some(t=>t.name.toLowerCase()===v.toLowerCase()&&t.id!==editId);
if(!v){input.classList.remove('err');hint.className='fh';hint.style.color='';hint.textContent='Use lowercase letters, numbers, and hyphens. e.g., cost-center'}
else if(v.length>=128){input.classList.add('err');hint.className='fh err';hint.style.color='';hint.textContent='Tag key cannot exceed 128 characters.'}
else if(!valid){input.classList.add('err');hint.className='fh err';hint.style.color='';hint.textContent='Please use lowercase letters, numbers, and hyphens only. No underscores or leading/trailing hyphens.'}
else if(exists){input.classList.add('err');hint.className='fh err';hint.style.color='';hint.textContent=`"${v}" already exists. Please use a different name.`}
else{input.classList.remove('err');hint.className='fh';hint.style.color='var(--ok)';hint.textContent='✓ Name is available'}}

/* 依 Figma 2185:129692（Dropdown 搜尋行為，註記「所有 Dropdown Menu 皆套用」）：
 * 「呈現搜尋結果時，全選選項調整為 [Select All 3 Result(s)]…點擊 [Select All]
 *  僅勾選搜尋結果中的項目」。
 *
 * 這裡原本用 item.querySelector('span') 取選項文字來比對搜尋字串——2026-09-11
 * 把 checkbox 換成共用元件之後，元件本身在 <button> 內插入的第一個 span
 * 是 checkbox 的視覺外殼（.checkbox 本身、以及裡面的 check／remove icon
 * span），比選項文字 <span>opt</span> 更早出現在 DOM 裡，querySelector('span')
 * 撈到的其實是 icon 的文字（textContent 恆為 "checkremove"）。結果是搜尋永遠
 * 比對不到任何真正的選項文字，打字之後清單全部消失——這是遷移造成的迴歸，

function filterMs(inp){

    if(hit) visN++;

const _RMS={type:'matched',valueName:'',resources:[],totalCost:0,level:'billing',cloud:'all',search:'',sortCol:'cost',sortAsc:false};
const _billLabel={GCP:'Billing Account',AWS:'Management Account',Azure:'Billing Account'};
const _subLabel={all:'Sub Account',GCP:'Project',AWS:'Account',Azure:'Subscription'};
const _cspCls={GCP:'csp-gcp',AWS:'csp-aws',Azure:'csp-azure',FOCUS:'csp-focus'};
const _cspBadge=p=>p?`<span class="csp-badge ${_cspCls[p]||''}" style="font-size:10px;padding:1px 5px;flex-shrink:0">${p}</span>`:'<span style="color:var(--g300);font-size:13px">—</span>';

function _aggResLevel(resources,level){
  const valid=resources.filter(r=>r.p);
  const outside=resources.filter(r=>!r.p);
  if(level==='resource'){
    const rows=valid.map(r=>({name:r.resource||'--',resourceType:r.resourceType||'—',service:r.service||'—',cloud:r.p,cost:r.c,count:1}));
    if(outside.length>0){const oc=outside.reduce((s,r)=>s+r.c,0);rows.push({name:'Billing records outside displayed dimensions',resourceType:null,service:null,cloud:null,cost:oc,count:outside.length,isOutside:true});}
    return rows;
  }
  const map=new Map();
  valid.forEach(r=>{
    let key,name,id;
    if(level==='billing'){key=r.billingAccountId||'Unknown';name=r.billingAccountName||key;id=key;}
    else if(level==='sub'){key=r.billingAccountId+'||'+r.subAccountId;name=r.subAccountName||r.subAccountId||'Unknown';id=r.subAccountId||'—';}
    else{key=(r.p||'')+'||'+(r.service||'');name=r.service||'Unknown';id='';}
    if(!map.has(key))map.set(key,{name,id,cloud:r.p,cost:0,count:0});
    const e=map.get(key);e.cost+=r.c;e.count+=1;
  });
  return Array.from(map.values());
}

function _renderSkeleton(level){
  const sk=(w,h=13)=>`<span class="skeleton" style="width:${w}px;height:${h}px"></span>`;
  const isRes=level==='resource';
  // Vary widths per row for natural look
  const widths=isRes
    ?[[150,90,80,110,38],[200,110,100,130,42],[120,70,90,90,35],[180,100,85,115,40],[160,80,95,105,37],[140,95,88,98,41]]
    :[[220,140,130,42],[280,120,110,38],[190,150,125,44],[250,130,118,40],[210,145,132,36],[170,155,128,43]];
  const rows=widths.map(w=>isRes
    ?`<tr class="sk-row"><td>${sk(w[0])}<br><span class="skeleton" style="width:${w[1]}px;height:10px;margin-top:4px"></span></td><td>${sk(w[2])}</td><td>${sk(w[3])}</td><td style="text-align:right">${sk(120)}</td><td style="text-align:right">${sk(w[4])}</td></tr>`
    :`<tr class="sk-row"><td>${sk(w[0])}<br><span class="skeleton" style="width:${w[1]}px;height:10px;margin-top:4px"></span></td><td style="text-align:right">${sk(w[2])}</td><td style="text-align:right">${sk(w[3])}</td></tr>`
  ).join('');
  return`<div style="text-align:right;font-size:12px;color:var(--g200);margin-bottom:6px">${sk(180,12)}</div><div class="tw" id="res-modal-tbl-wrap" style="max-height:420px;overflow:hidden;box-shadow:none"><table style="width:100%;table-layout:auto"><tbody>${rows}</tbody></table></div>`;
}

function _renderResLevelTable(rows,level,isUntagged){
  const sl=_subLabel[_RMS.cloud]||'Sub Account';
  const billL=_billLabel[_RMS.cloud]||'Billing Account';
  const sa=col=>{const a=_RMS.sortCol===col;const ic=a?(_RMS.sortAsc?'arrow_upward':'arrow_downward'):'unfold_more';const color=a?'var(--pri)':'var(--g300)';return`<span class="material-symbols-outlined" style="font-size:15px;vertical-align:middle;color:${color};font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 20">${ic}</span>`;};
  const ts='font-size:12px;white-space:nowrap';
  const tsR='font-size:12px;white-space:nowrap;text-align:right';
  // Mock multipliers — Untagged: ~72% rate (×1.39); Matched: ~40% coverage (×2.5)
  const mult=isUntagged?1.39:2.5;
  const costLabel=isUntagged?'30-Day Untagged Spend':'30-Day Matched Spend';
  const pctLabel=isUntagged?'Untagged Rate':'Coverage';
  // first-col cell: badge + 2-line (name on top, id below)
  const nameCell=(name,id,cloud,title)=>`<td style="width:100%;overflow:hidden;" data-tip="${title||name}"><div style="display:flex;flex-direction:column;overflow:hidden;min-width:0"><span style="font-size:13px;color:var(--g800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</span>${id?`<span style="font-size:11px;color:var(--g400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">${id}</span>`:''}</div></td>`;
  // Resource cell — normal or "outside dimensions" special row
  const resCell=r=>r.isOutside
    ?`<td style="width:100%;overflow:hidden;"><span style="font-size:12px;color:var(--g400);font-style:italic">${r.name}</span></td>`
    :`<td style="width:100%;overflow:hidden;" data-tip="${r.name}"><span style="font-size:13px;font-weight:500;color:${r.name==='--'?'var(--g400)':'var(--g800)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${r.name}</span></td>`;
  // Plain text cell with truncation
  const textCell=v=>`<td style="font-size:13px;color:var(--g700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" data-tip="${v}">${v}</td>`;
  // Cost duo: [matched "A / B" inline, "/ B" in gray small, no duplicate currency] | [coverage % only]
  const costCells=r=>{
    const total=Math.round(r.cost*mult);
    const pct=total>0?Math.round((r.cost/total)*100):0;
    const costColor=isUntagged?'color:var(--err);':'';
    const totalNum=fmtK(total).replace(S._currency+' ','');
    return`<td style="text-align:right;white-space:nowrap;${costColor}"><span style="font-size:13px;font-weight:500">${fmtK(Math.round(r.cost))}</span><span style="font-size:11px;color:var(--g400)"> / ${totalNum}</span></td><td style="text-align:right;white-space:nowrap;font-size:13px;font-weight:500;color:var(--g700)">${pct}%</td>`;
  };
  // Cost headers (only the primary cost column is sortable)
  const costHdrs=`<th style="${tsR};cursor:pointer" onclick="sortResModal('cost')">${costLabel} ${sa('cost')}</th><th style="${tsR}">${pctLabel}</th>`;
  if(!rows.length)return`<div style="padding:40px 24px;text-align:center;color:var(--g400);font-size:13px">No data found for the selected filters.</div>`;

  if(level==='billing'){
    return`<table style="width:100%;table-layout:auto" id="res-modal-tbl"><thead><tr><th style="${ts}">${billL}</th>${costHdrs}</tr></thead><tbody>${rows.map(r=>`<tr>${nameCell(r.name,r.id,r.cloud)}${costCells(r)}</tr>`).join('')}</tbody></table>`;
  }
  if(level==='sub'){
    return`<table style="width:100%;table-layout:auto" id="res-modal-tbl"><thead><tr><th style="${ts}">${sl}</th>${costHdrs}</tr></thead><tbody>${rows.map(r=>`<tr>${nameCell(r.name,r.id,r.cloud)}${costCells(r)}</tr>`).join('')}</tbody></table>`;
  }
  if(level==='service'){
    return`<table style="width:100%;table-layout:auto" id="res-modal-tbl"><thead><tr><th style="${ts}">Service</th>${costHdrs}</tr></thead><tbody>${rows.map(r=>`<tr>${nameCell(r.name,'',r.cloud)}${costCells(r)}</tr>`).join('')}</tbody></table>`;
  }
  // Resource level — 5 cols: Resource | Resource Type | Service | Spend | Coverage
  const emptyCell=`<td style=""></td>`;
  return`<table style="width:100%;table-layout:auto" id="res-modal-tbl"><thead><tr><th style="${ts}">Resource</th><th style="${ts};white-space:nowrap">Resource Type</th><th style="${ts};white-space:nowrap">Service</th>${costHdrs}</tr></thead><tbody>${rows.map(r=>`<tr>${resCell(r)}${r.isOutside?emptyCell+emptyCell:textCell(r.resourceType)+textCell(r.service)}${costCells(r)}</tr>`).join('')}</tbody></table>`;
}

function _renderResModalBody(){
  const st=_RMS;const isUntagged=st.type==='untagged';
  const billL=_billLabel[st.cloud]||'Billing Account';
  const sl=_subLabel[st.cloud]||'Sub Account';
  const levelNames={billing:billL,sub:sl,service:'Service',resource:'Resource'};
  // Cloud dropdown (no "all" — prevents resource explosion)
  const cspOpts=['GCP','AWS','Azure'].map(c=>`<option value="${c}"${st.cloud===c?' selected':''}>${c}</option>`).join('');
  const cloudDrop=`<select class="res-csp-sel" style="width:100px" onchange="_setResCloud(this.value)">${cspOpts}</select>`;
  // Level button group
  const levelBtns=['billing','sub','service','resource'].map(l=>{
    return`<button class="rlb${st.level===l?' active':''}" onclick="_setResLevel('${l}')">${levelNames[l]}</button>`;
  }).join('');
  // Filter by cloud + search
  const q=st.search.toLowerCase();
  const filtered=st.resources.filter(r=>{
    if(!r.p)return false;
    if(st.cloud!=='all'&&r.p!==st.cloud)return false;
    if(!q)return true;
    return[r.billingAccountId,r.billingAccountName,r.subAccountId,r.subAccountName,r.service,r.resourceType,r.resource].filter(Boolean).join(' ').toLowerCase().includes(q);
  });
  // Aggregate
  let rows=_aggResLevel(filtered,st.level);
  // Sort
  rows.sort((a,b)=>{
    if(st.sortCol==='name'){const an=a.name||'',bn=b.name||'';return st.sortAsc?an.localeCompare(bn):bn.localeCompare(an);}
    if(st.sortCol==='total'){const at=a.cost*1.39,bt=b.cost*1.39;return st.sortAsc?at-bt:bt-at;}
    return st.sortAsc?a.cost-b.cost:b.cost-a.cost;
  });
  const totalCost=rows.reduce((s,r)=>s+r.cost,0);
  const tbl=_renderResLevelTable(rows,st.level,isUntagged);
  return`<div style="margin-bottom:10px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      ${cloudDrop}
      <div class="res-level-grp" style="flex-shrink:0">${levelBtns}</div>
      <span style="flex:1"></span>
      <div class="ts" style="width:220px;flex-shrink:0"><span class="material-symbols-outlined">search</span><input type="text" placeholder="Search ${levelNames[st.level]}…" value="${st.search.replace(/"/g,'&quot;')}" oninput="_filterResModal(this.value)" style="width:100%"></div>
    </div>
    <div style="text-align:right;font-size:12px;color:var(--g400)">${rows.length} items · 30-Day Total: ${fmtFull(Math.round(totalCost))}</div>
  </div>
  <div class="tw" id="res-modal-tbl-wrap" style="max-height:420px;overflow-y:auto;box-shadow:none">${tbl}</div>`;
}

function _showResLoading(delay=400){
  const el=document.getElementById('res-modal-inner');
  if(!el)return;
  // Swap only the table area with skeleton, keep toolbar
  const wrap=el.querySelector('#res-modal-tbl-wrap');
  const count=el.querySelector('[style*="items"]');
  if(wrap)wrap.innerHTML=`<table style="width:100%;table-layout:auto"><tbody>${Array(6).fill(`<tr class="sk-row"><td>${'<span class="skeleton" style="display:inline-block;height:13px;border-radius:4px;width:180px"></span>'}</td><td style="text-align:right"><span class="skeleton" style="display:inline-block;height:13px;border-radius:4px;width:120px"></span></td><td style="text-align:right"><span class="skeleton" style="display:inline-block;height:13px;border-radius:4px;width:36px"></span></td></tr>`).join('')}</tbody></table>`;
  if(count)count.innerHTML='<span class="skeleton" style="display:inline-block;height:12px;border-radius:4px;width:180px"></span>';
  return new Promise(r=>setTimeout(r,delay));
}
function _setResCloud(c){_RMS.cloud=c;_RMS.search='';_showResLoading(400).then(()=>{const el=document.getElementById('res-modal-inner');if(el)el.innerHTML=_renderResModalBody();});}
function _setResLevel(l){_RMS.level=l;_RMS.search='';_RMS.sortCol='cost';_RMS.sortAsc=false;_showResLoading(350).then(()=>{const el=document.getElementById('res-modal-inner');if(el)el.innerHTML=_renderResModalBody();});}
function _filterResModal(v){_RMS.search=v;document.getElementById('res-modal-inner').innerHTML=_renderResModalBody();}
function sortResModal(col){if(_RMS.sortCol===col){_RMS.sortAsc=!_RMS.sortAsc;}else{_RMS.sortCol=col;_RMS.sortAsc=col==='name';}document.getElementById('res-modal-inner').innerHTML=_renderResModalBody();}

function _openResModal(type,valueName,count,totalCost,allocated){
  /* 2026-10-06：假資料改成①同一個 value 每次開都一樣（用名稱當亂數種子）②全部資源加總＝這個 value 的直接成本，跟 Preview 表格對得上 */
  let seed=0;for(const ch of (type+valueName))seed=(seed*31+ch.charCodeAt(0))>>>0;const _rand=Math.random;Math.random=()=>{seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
  const resources=mockResources(count,type==='matched'?'matched':'unalloc');Math.random=_rand;
  const sum=resources.reduce((a,r)=>a+(r.c||0),0);if(totalCost>0&&sum>0)resources.forEach(r=>{r.c=r.c*totalCost/sum});
  Object.assign(_RMS,{type,valueName,resources,totalCost:totalCost||0,allocated:allocated||0,level:'billing',cloud:'GCP',search:'',sortCol:'cost',sortAsc:false});
  const isUntagged=type==='untagged';
  const title=isUntagged?'Untagged Resources':`Resources Matched To: ${valueName}`;
  // Show modal with skeleton first, then render real data after 800ms
  showModal(`<div class="mh"><span class="mt">${title}</span><span class="material-symbols-outlined mx" onclick="closeModal()">close</span></div><div id="res-modal-inner">${_renderSkeleton('billing')}</div>${allocated>0?`<p style="margin-top:12px;font-size:12px;color:var(--g600)">These are the resources behind ${valueName}'s direct cost (${v9fmt(totalCost)}). The ${v9fmt(allocated)} split from shared cost isn't tied to specific resources, so it isn't listed here.</p>`:''}<p style="margin-top:12px;font-size:12px;color:var(--g400);font-style:italic">*Note: Costs are estimated based on synchronized data and may differ from final billing.</p><div class="mf"><button class="btn btn-p" onclick="closeModal()">Got it</button></div>`,'lg tall');
  setTimeout(()=>{const el=document.getElementById('res-modal-inner');if(el)el.innerHTML=_renderResModalBody();},800);
}

function showMatchedModal(valueName,count,totalCost,allocated){_openResModal('matched',valueName,count,totalCost,allocated);}
function showUnallocModal(totalCost){_openResModal('untagged','',30,totalCost);}

function showModal(h,size){const o=document.getElementById('mo');const c=document.getElementById('mc');const tokens=String(size||'').toLowerCase().split(/\s+/);let cls='modal';if(tokens.includes('xs'))cls+=' modal-xs';else if(tokens.includes('center')||tokens.includes('s'))cls+=' modal-center';else if(tokens.includes('wide')||tokens.includes('l'))cls+=' modal-wide';else if(tokens.includes('lg')||tokens.includes('xl')||size===true||size===1)cls+=' modal-lg';if(tokens.includes('tall'))cls+=' modal-tall';c.className=cls;c.innerHTML=h;/* Auto-wrap body (between .mh and .mf) into .mb so scroll lives inside body, not on outer modal */const mh=c.querySelector('.mh'),mf=c.querySelector('.mf');if(mh){const mb=document.createElement('div');mb.className='mb';let n=mh.nextSibling;while(n&&n!==mf){const next=n.nextSibling;mb.appendChild(n);n=next;}mh.insertAdjacentElement('afterend',mb);}o.classList.add('active');o.onclick=e=>{if(e.target===o)closeModal()}}
function closeModal(){document.getElementById('mo').classList.remove('active')}
function toast(msg,err){const c=document.getElementById('tc');const t=document.createElement('div');t.className='toast'+(err?' terr':' tok');t.innerHTML=`<span class="material-symbols-outlined">${err?'error':'task_alt'}</span>${msg}`;c.appendChild(t);setTimeout(()=>t.remove(),3000)}

function toggleSbGroup(id){document.getElementById(id).classList.toggle('collapsed')}
function toggleSidebar(){const sb=document.querySelector('.sidebar');const mn=document.querySelector('.main');const ic=document.getElementById('sb-toggle-icon');sb.classList.toggle('collapsed');mn.classList.toggle('sb-collapsed');ic.textContent=sb.classList.contains('collapsed')?'chevron_right':'chevron_left';document.documentElement.style.setProperty('--sw',sb.classList.contains('collapsed')?'64px':'264px')}
function showSegTip(e,name,color,costStr){const tip=document.getElementById('seg-tip');document.getElementById('seg-tip-title').textContent=name;document.getElementById('seg-tip-row').innerHTML=`<span style="width:10px;height:10px;border-radius:2px;background:${color};flex-shrink:0;display:inline-block"></span><span>${name}</span><span class="seg-tip-amt">${costStr}</span>`;tip.style.display='block';posSegTip(e);}
function posSegTip(e){const tip=document.getElementById('seg-tip');const w=tip.offsetWidth||180;const h=tip.offsetHeight||56;let x=e.clientX+14;let y=e.clientY-h-10;if(x+w>window.innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+14;tip.style.left=x+'px';tip.style.top=y+'px';}
function hideSegTip(){document.getElementById('seg-tip').style.display='none';}
document.addEventListener('click',e=>{
if(!e.target.closest('.ms-wrap')){document.querySelectorAll('.ms-panel.open').forEach(p=>{p.classList.remove('open');p.previousElementSibling?.classList.remove('open')})}
if(!e.target.closest('.add-csp-wrap')){closePickers()}

// (.info-tip 是 CSS-only tooltip，原本 left:50% transform:-50% 在右側會切掉 — 加 JS 動態 clamp 到 viewport)
(function(){
  document.addEventListener('mouseover',e=>{
    const it=e.target.closest('.info-tip');
    if(!it)return;
    const tb=it.querySelector('.tip-box');
    if(!tb)return;
    requestAnimationFrame(()=>{
      if(!it.matches(':hover'))return;
      // Reset to default CSS positioning to measure natural size
      tb.style.left='';tb.style.right='';tb.style.transform='';tb.style.top='';
      const tw=tb.offsetWidth,th=tb.offsetHeight;
      const vw=window.innerWidth,vh=window.innerHeight;
      const itRect=it.getBoundingClientRect();
      // Horizontal: prefer center on .info-tip, but clamp to viewport
      const itCenter=itRect.left+itRect.width/2;
      let desiredLeft=itCenter-tw/2;
      if(desiredLeft<8)desiredLeft=8;
      if(desiredLeft+tw>vw-8)desiredLeft=vw-tw-8;
      // Vertical: prefer below, flip above if would clip bottom
      let desiredTop=itRect.bottom+8;
      if(desiredTop+th>vh-8)desiredTop=itRect.top-th-8;
      if(desiredTop<8)desiredTop=8;
      // Apply as offset from .info-tip (which has position:relative)
      tb.style.left=(desiredLeft-itRect.left)+'px';
      tb.style.top=(desiredTop-itRect.top)+'px';
      tb.style.transform='none';
    });
  });
})();

// ===== GLOBAL TOOLTIP =====
(function(){
  const tip=document.createElement('div');tip.id='gl-tip';document.body.appendChild(tip);
  let cur=null;
  document.addEventListener('mouseover',e=>{
    const el=e.target.closest('[data-tip]');
    if(!el||el===cur)return;
    cur=el;tip.textContent=el.dataset.tip;tip.style.display='block';
  });
  document.addEventListener('mousemove',e=>{
    if(!cur)return;
    const vw=window.innerWidth,vh=window.innerHeight;
    /* Cap tooltip dimensions to viewport (避免內容超大時溢出) */
    tip.style.maxWidth=(vw-16)+'px';
    tip.style.maxHeight=(vh-16)+'px';
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    /* Preferred: above cursor, horizontal center */
    let x=e.clientX-tw/2,y=e.clientY-th-10;
    /* Horizontal clamp to viewport */
    if(x<8)x=8;
    if(x+tw>vw-8)x=vw-tw-8;
    /* Vertical: if would clip top, flip below cursor */
    if(y<8)y=e.clientY+16;
    /* Vertical: if would clip bottom, clamp upward */
    if(y+th>vh-8)y=vh-th-8;
    /* Final safety: ensure top ≥ 8 */
    if(y<8)y=8;
    tip.style.left=x+'px';tip.style.top=y+'px';
  });
  document.addEventListener('mouseout',e=>{
    const el=e.target.closest('[data-tip]');
    if(el&&el===cur){cur=null;tip.style.display='none';}
  });
})();
</script>

/* ============================================================
 * 計算引擎：照 PRD 計算規則 ＋ RD doc 決定 4
 *   1. 每一列從最上面的卡往下比，第一張符合的卡拿走（不分卡型）
 *   2. value card：整列給那個 value（direct）
 *   3. allocation card：進 pool，照 Spend 分：

function v9Val(row,c){if(V9_K8S_MAP[c.f])return (row.labels||{})[V9_K8S_MAP[c.f]];if(c.f==='k8s'&&c.k==='Cluster')return v9ClusterOfRow(row);if(c.f==='k8s')return (row.labels||{})[V9_K8S_DIM[c.k]];return getFieldOpset(c.f)==='tag'?(row.labels||{})[c.k]:row[c.f]}
function v9EvalCond(row,c){
  const raw=v9Val(row,c);const val=raw==null?'':String(raw);const has=raw!=null;
  const list=String(c.v||'').split(',').map(x=>x.trim()).filter(Boolean);const one=list[0]||'';
  switch(c.o){
    case 'is':return has&&list.includes(val);
    case 'is_not':return !list.includes(val);
    case 'contains':return has&&!!one&&val.toLowerCase().includes(one.toLowerCase());
    case 'not_contains':return !one||!val.toLowerCase().includes(one.toLowerCase());
    case 'starts_with':return has&&!!one&&val.startsWith(one);
    case 'ends_with':return has&&!!one&&val.endsWith(one);
    case 'matches':try{return has&&!!one&&new RegExp(one).test(val)}catch(e){return false}
  }

}
function v9EvalBlock(row,b){

  const conds=(b.conds||[]).filter(c=>c.f&&(c.v||'').length&&(getFieldOpset(c.f)!=='tag'||c.k));
  if(!conds.length)return false;
  let r=v9EvalCond(row,conds[0]);
  for(let i=1;i<conds.length;i++){const e=v9EvalCond(row,conds[i]);r=conds[i].c==='OR'?(r||e):(r&&e)}
  return r;
}
function v9EvalCard(row,card){return (card.cspBlocks||[]).some(b=>v9EvalBlock(row,b))}
function v9Part(row){const cl=(row.labels||{})['goog-k8s-cluster-name'];return cl?`${row.project_id}|${cl}`:'*'}
function v9PartLabel(p){return p==='*'?'across the tag key':`cluster ${p.split('|')[1]}`}

function v9Compute(cards,rows){
  const R={direct:{},alloc:{},untagged:0,untaggedRows:[],total:0,cards:[],resByValue:{},resDirect:{},order:[],multi:[]};
  const directPart={};const pools=cards.map(()=>[]);
  cards.forEach((c,i)=>R.cards[i]={type:c.type||'value',name:c.name,matched:0,matchedRes:new Set(),allocated:0,unallocated:0,noWeight:[],byRecip:{},stolenBelow:0,stolenBy:new Set(),takenAbove:0,takenBy:new Set(),noNsParts:new Set()});
  const addRes=(name,row)=>{(R.resByValue[name]=R.resByValue[name]||new Set()).add(row.resource_name)};
  const seen=n=>{if(n&&!R.order.includes(n))R.order.push(n)};
  cards.forEach(c=>{if(c.type!=='alloc')seen(c.name)});
  cards.forEach(c=>{if(c.type==='alloc')(c.recipients||[]).forEach(seen)});
  rows.forEach(row=>{
    R.total+=row.cost;
    const hits=cards.map((c,i)=>v9EvalCard(row,c)?i:-1).filter(i=>i>=0);
    const vHits=hits.filter(i=>cards[i].type!=='alloc'&&cards[i].name);
    if(vHits.length>1)R.multi.push({row,hits:vHits});           // ⏸ PARKED：Rule Conflicts 只看 value card 之間的重疊
    const i=hits[0];
    // 資訊用：這張 allocation card 的條件有抓到、但被上面的卡先拿走
    hits.slice(1).forEach(j=>{if(cards[j].type==='alloc'&&i!==undefined&&cards[i].type!=='alloc'){R.cards[j].takenAbove+=row.cost;R.cards[j].takenBy.add(cards[i].name||`Card #${i+1}`)}});
    if(i===undefined){R.untagged+=row.cost;R.untaggedRows.push(row);return}
    const c=cards[i];
    if(c.type==='alloc'){
      pools[i].push(row);R.cards[i].matched+=row.cost;R.cards[i].matchedRes.add(row.resource_name);
      // 順序衝突：這一列也符合下面某張「在分攤名單裡」的 value card
      hits.slice(1).forEach(j=>{const cj=cards[j];if(cj.type!=='alloc'&&(c.recipients||[]).includes(cj.name)){R.cards[i].stolenBelow+=row.cost;R.cards[i].stolenBy.add(cj.name)}});
      return;
    }
    if(!c.name){R.untagged+=row.cost;R.untaggedRows.push(row);return}
    R.direct[c.name]=(R.direct[c.name]||0)+row.cost;addRes(c.name,row);(R.resDirect[c.name]=R.resDirect[c.name]||new Set()).add(row.resource_name);
    const p=v9Part(row);(directPart[p]=directPart[p]||{})[c.name]=((directPart[p]||{})[c.name]||0)+row.cost;
  });
  // 把 pool 依 Spend 分出去
  cards.forEach((c,i)=>{
    if(c.type!=='alloc')return;const info=R.cards[i];
    const recips=[...new Set((c.recipients||[]).filter(Boolean))];const usedParts=new Set();
    pools[i].forEach(row=>{
      const p=v9Part(row);usedParts.add(p);
      const base=p==='*'?R.direct:(directPart[p]||{});
      const sum=recips.reduce((s,n)=>s+(base[n]||0),0);
      if(p!=='*'&&!rows.some(r=>v9Part(r)===p&&(r.labels||{})['k8s-namespace']))info.noNsParts.add(p);
      if(!sum){R.untagged+=row.cost;R.untaggedRows.push(row);info.unallocated+=row.cost;if(!info.noWeight.includes(p))info.noWeight.push(p);return}
      recips.forEach(n=>{const amt=row.cost*(base[n]||0)/sum;if(!amt)return;R.alloc[n]=(R.alloc[n]||0)+amt;info.byRecip[n]=(info.byRecip[n]||0)+amt;info.allocated+=amt;addRes(n,row)});
    });
    // 權重依據：每個 value 在這些範圍裡的直接成本（每個範圍只算一次）
    info.basis={};usedParts.forEach(p=>{const base=p==='*'?R.direct:(directPart[p]||{});recips.forEach(n=>info.basis[n]=(info.basis[n]||0)+(base[n]||0))});
    info.basisWhere=usedParts.size===1?([...usedParts][0]==='*'?'across the tag key':`in ${[...usedParts][0].split('|')[1]}`):'where this shared cost sits';
    info.reason=!info.matched?'no-match':!info.allocated?'no-weight':info.unallocated?'partial':'ok';
  });
  return R;
}

function v9ReadBlocks(card){
  const out=[];
  card.querySelectorAll('.csp-block').forEach(block=>{
    const csp=block.dataset.csp||'GCP';const conds=[];
    block.querySelectorAll('.cr').forEach(row=>{
      const fSel=row.querySelector('.field-sel');const opSel=row.querySelector('.op-sel-vis:not(.tag-key-sel)');const cs=row.querySelector('.csel');const txt=row.querySelector('.val-txt');
      const checked=Array.from(row.querySelectorAll('.ms-chk:checked')).map(c=>c.value).filter(Boolean);
      const f=fSel?.value||defaultField(csp);
      conds.push({f,k:row.querySelector('.tag-key-sel')?.value||'',o:opSel?.value||defOpForField(f),v:txt?txt.value.trim():checked.join(','),c:cs?.value||''});
    });
    if(conds.length)out.push({csp,conds});
  });
  return out;
}
function v9ReadRecipients(card){return Array.from(card.querySelectorAll('.ac-row')).map(r=>(r.querySelector('.ac-sel')?.value||r.querySelector('.ac-txt')?.value||'').trim()).filter(v=>v&&v!=='__new__')}
function v9ReadCards(cid){

function v9RowsFor(cid){

function v9ValueNames(cid,exceptCard){

function v9ParkedBadge(kind){

  const conflictHtml=(S._showParked&&R.multi.length)?(()=>{
    const cspName={GCP:'Google Cloud',AWS:'AWS',Azure:'Azure',FOCUS:'FOCUS'};
    const condTxt=cd=>{const fl=V9_K8S_LABEL[cd.f]||(CSP_FIELDS.GCP.concat(CSP_FIELDS.AWS,CSP_FIELDS.Azure,CSP_FIELDS.FOCUS)).find(x=>x[0]===cd.f)?.[1]||cd.f;const opl=(FIELD_OPERATORSETS[getFieldOpset(cd.f)]||[]).find(x=>x[0]===cd.o)?.[1]||cd.o;
      const subj=cd.f==='k8s'?`Kubernetes ${cd.k}`:getFieldOpset(cd.f)==='tag'?`The value of label key “${cd.k}”`:fl;return `${subj} ${opl} "${cd.v}"`};
    // 列出「真的讓這一列符合」的那個 data source block 的完整條件，不是只列第一條
    const ruleTxt=(ci,row)=>{const c=cards[ci];const b=(c.cspBlocks||[]).find(x=>v9EvalBlock(row,x))||(c.cspBlocks||[])[0];if(!b)return `Rule ${ci+1} → ${c.name}`;

<details class="v9-conf"><summary><span class="material-symbols-outlined">call_merge</span>${R.multi.length} Resource${R.multi.length>1?'s':''} Matched Multiple Rules<span class="material-symbols-outlined v9-conf-arr">expand_more</span></summary>
${R.multi.map(m=>`<div class="v9-conf-item"><div class="v9-conf-res">${m.row.resource_name}</div>${m.hits.map((h,k)=>`<div class="v9-conf-rule${k===0?' is-win':''}">${ruleTxt(h,m.row)}${k===0?' <span class="v9-pill ok">Applied</span>':''}</div>`).join('')}</div>`).join('')}</details></div>`})():'';

  const kubeUntagged=R.untaggedRows.filter(r=>((r.labels||{})['k8s-namespace']||'').startsWith('kube:')).reduce((s,r)=>s+r.cost,0);

/* Apply 確認（沿用 #08），加上「成員會看不到這個 key」的提醒（PRD 邊界情況：加入第一張 allocation card）
 * ⚠ ASSUMPTION：提醒文案；只在「原本沒有 allocation card、這次加了」時出現 */
function v9ShowApply(id,cover,uc,valCount){
  const t=S._tmp||S.tags.find(x=>x.id===id);if(!t)return;
  const orig=S.tags.find(x=>x.id===id);const firstAlloc=v9HasAlloc(t)&&!(orig&&orig.status==='active'&&v9HasAlloc(orig)&&orig!==t);
  const total=cover+uc;const cr=total?(cover/total*100).toFixed(2):'0.00';
  const thumb=`<span class="material-symbols-outlined" style="font-size:18px;color:var(--ok);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20">thumb_up</span>`; // 同 v8／Figma #08 的 100% / USD 0 特殊呈現
  // 2026-10-01 PM 定調：刪掉最後一張 allocation card 之後，key 恢復讓 Manager／Member 看到 ⚠ ASSUMPTION：提醒文案
  const lastAllocGone=!v9HasAlloc(t)&&orig&&orig!==t&&orig.status==='active'&&v9HasAlloc(orig);
  const notice=lastAllocGone?`<div class="notice n-info" style="margin-bottom:20px;align-items:flex-start"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">visibility</span><div>This tag no longer splits shared cost. After you apply it, <strong>Managers and Members will see ${t.name}</strong> in Cost Dashboard again.</div></div>`:firstAlloc?`<div class="notice n-warn" style="margin-bottom:20px;align-items:flex-start"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">visibility_off</span><div>This tag splits shared cost. After you apply it, <strong>Managers and Members won't see ${t.name}</strong> in Cost Dashboard, because split amounts can reveal costs outside their access.</div></div>`:'';
  showModal(`<div class="mh"><div><span class="material-symbols-outlined mh-ic" style="color:var(--warn)">warning</span><span class="mt">Apply LumiTag</span></div><span class="material-symbols-outlined mx" onclick="closeModal()">close</span></div>
<p style="margin-bottom:30px;color:var(--g900);line-height:1.75">LumiTag <strong>${t.name}</strong> will be integrated as a primary dimension in all reports and dashboards. <br>Please confirm the summary below:</p>
<p style="margin-bottom:8px;color:var(--g900)">Applying this tag will cover <strong style="color:var(--pri)">${v9fmt(cover)}</strong> of your total spend.</p>${notice}
<div style="background:var(--pri-lt10);border:1px solid var(--pri-lt20);border-radius:var(--r-md);padding:16px;margin-bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
<div><div class="lt-mlabel">Tag Values</div><div style="font-weight:700;font-size:14px;color:var(--g900)">${valCount}</div></div>
<div><div style="font-size:12px;color:var(--g500);margin-bottom:6px">Coverage Rate</div><div style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:22px;color:${uc<=0?'var(--ok)':'var(--g900)'}">${uc<=0?thumb:''}${uc<=0?'100':cr}%</div></div>
<div><div style="font-size:12px;color:var(--g500);margin-bottom:6px">Untagged Spend</div><div style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:22px;color:${uc<=0?'var(--ok)':'var(--err)'}">${uc<=0?thumb+S._currency+' 0':v9fmt(uc)}</div></div></div>
<div class="mf"><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="confirmApply('${id}')">Apply LumiTag</button></div>`,'wide');
}

<script>
/* === Inlined: shared/currency-picker.js === */
/*!
 * currency-picker.js — Lumiture Shared Currency Picker v3
 *
 * Design spec: CMDS Component Library > Currency Switch (H=30px)
 *   - Normal: transparent bg, no border; Hover: subtle gray bg; Focus: focus ring
 *   - Trigger format: [flag] [CODE] [expand_more]
 *   - Dropdown gap: 4px from trigger bottom
 *   - Dropdown items: "Full Name (CODE)", selected = gray bg, no checkmark
 *
 * Design spec: Figma #01-4 Overview: Change Currency
 *   - 7 currencies from PRD, sorted alphabetically by full name
 *
 * Usage (inline onclick pattern, works with dynamically rendered triggers):
 *
 *   HTML trigger (static):
 *     <button class="curr-btn"
 *             onclick="CurrencyPicker.open(this, currentCode, onChangeFn)">
 *       <span class="curr-flag">🇺🇸</span>
 *       <span class="curr-code">USD</span>
 *       <span class="material-symbols-outlined">expand_more</span>
 *     </button>
 *
 *   HTML trigger (dynamic, inside JS template):
 *     const c = CurrencyPicker.CURRENCIES.find(c => c.code === currentCode);
 *     `<button class="curr-btn" onclick="CurrencyPicker.open(this,'${currentCode}',fn)">
 *       <span class="curr-flag">${c?.flag || ''}</span>
 *       <span class="curr-code">${currentCode}</span>
 *       <span class="material-symbols-outlined">expand_more</span>
 *     </button>`
 *
 *   Update trigger on currency change (setCurrency callback):
 *     const c = CurrencyPicker.CURRENCIES.find(c => c.code === newCode);
 *     document.getElementById('currency-flag').textContent = c?.flag || '';
 *     document.getElementById('currency-code').textContent = newCode;
 *
 * Exposes:
 *   window.CurrencyPicker.CURRENCIES   — [{code, name, flag}]
 *   window.CurrencyPicker.open(triggerEl, currentCode, onChangeFn)
 *   window.CurrencyPicker.close()
 */
(function () {
  'use strict';

  /* Sorted alphabetically by full name, per Figma spec + PRD */
  var CURRENCIES = [
    { code: 'HKD', name: 'Hong Kong dollar',      flag: '🇭🇰' },
    { code: 'IDR', name: 'Indonesian rupiah',      flag: '🇮🇩' },
    { code: 'MYR', name: 'Malaysian ringgit',      flag: '🇲🇾' },
    { code: 'TWD', name: 'New Taiwan dollar',      flag: '🇹🇼' },
    { code: 'PHP', name: 'Philippine peso',        flag: '🇵🇭' },
    { code: 'SGD', name: 'Singapore dollar',       flag: '🇸🇬' },
    { code: 'USD', name: 'United States dollar',   flag: '🇺🇸' },
  ];

  /* ===== CSS ===== */
  var CSS = [
    /* Trigger button — Normal: transparent, no border; H=30px per CMDS spec */
    '.curr-btn{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 7px;',
    'font-size:13px;color:#262626;',
    'cursor:pointer;background:transparent;border:none;border-radius:6px;',
    'font-family:inherit;line-height:1;white-space:nowrap;',
    'transition:background .12s}',
    /* Hover: subtle gray wash */
    '.curr-btn:hover{background:rgba(0,0,0,.06)}',
    /* Active/open: same wash + arrow flipped */
    '.curr-btn.cp-open{background:rgba(0,0,0,.06)}',
    /* Focus: blue focus ring (keyboard nav / Active state ring per CMDS) */
    '.curr-btn:focus-visible{outline:2px solid #004FB0;outline-offset:1px}',
    /* Flag + code */
    '.curr-flag{font-size:15px;line-height:1;flex-shrink:0}',
    '.curr-code{font-size:14px;color:#262626}',
    /* Arrow icon */
    '.curr-btn .material-symbols-outlined{font-size:16px;',
    'color:#676767;flex-shrink:0;transition:transform .15s}',
    '.curr-btn.cp-open .material-symbols-outlined{transform:rotate(180deg)}',

    /* Dropdown container — 4px gap per CMDS spec */
    '.curr-dd{position:absolute;top:calc(100% + 4px);right:0;left:auto;',
    'background:#fff;border:1px solid #DCE3EC;',
    'border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);',
    'z-index:300;min-width:220px;width:max-content;',
    'overflow:hidden;overscroll-behavior:contain}',

    /* Dropdown items — full name + (CODE), no flag */
    '.curr-dd-item{display:flex;align-items:center;padding:9px 14px;width:100%;',
    'font-size:13px;border:none;background:none;cursor:pointer;',
    'font-family:inherit;color:#262626;text-align:left;',
    'transition:background .1s;line-height:1.4;white-space:nowrap}',
    '.curr-dd-item:hover{background:#F5F5F5}',
    /* Selected: gray bg per Figma, no color/weight change */
    '.curr-dd-item.cp-active{background:#F0F0F0}',
  ].join('');

  var style = document.createElement('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  /* ===== STATE ===== */
  var _activeTrigger = null;

  /* ===== INTERNAL ===== */
  function _close() {
    var dd = document.getElementById('_curr-dd');
    if (dd) dd.remove();
    if (_activeTrigger) {
      _activeTrigger.classList.remove('cp-open');
      _activeTrigger = null;
    }
  }

  function _open(triggerEl, currentCode, onChange) {
    _activeTrigger = triggerEl;
    triggerEl.classList.add('cp-open');

    /* Ensure parent is positioned */
    var wrap = triggerEl.parentElement;
    if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';

    var dd = document.createElement('div');
    dd.className = 'curr-dd';
    dd.id = '_curr-dd';
    dd.innerHTML = CURRENCIES.map(function (c) {
      var isActive = c.code === currentCode;
      return '<button class="curr-dd-item' + (isActive ? ' cp-active' : '') + '">' +
        c.name + ' (' + c.code + ')' +
        '</button>';
    }).join('');

    dd.querySelectorAll('.curr-dd-item').forEach(function (btn, i) {
      btn.addEventListener('click', function () {
        _close();
        onChange(CURRENCIES[i].code);
      });
    });

    wrap.appendChild(dd);

    /* Outside click to close */
    setTimeout(function () {
      document.addEventListener('click', function _outsideClose(e) {
        if (!dd.contains(e.target) && e.target !== triggerEl) {
          _close();
          document.removeEventListener('click', _outsideClose, true);
        }
      }, true);
    }, 0);
  }

  /* ===== PUBLIC API ===== */
  window.CurrencyPicker = {
    CURRENCIES: CURRENCIES,

    /**
     * Toggle dropdown open / close.
     * @param {Element}  triggerEl   — the .curr-btn element
     * @param {string}   currentCode — e.g. 'USD'
     * @param {Function} onChange    — called with new code when user picks
     */
    open: function (triggerEl, currentCode, onChange) {
      if (_activeTrigger === triggerEl) {
        _close();
      } else {
        _close();
        _open(triggerEl, currentCode, onChange);
      }
    },

    close: _close,
  };
})();

</script>

  // logo 連到 Overview（從 LUMITURE_NAV 拿 href）；在 Overview 頁本身不連自己，也就沒有 hover 變形
  function _renderLogo() {
    var nav = window.LUMITURE_NAV || [];
    var home = nav.filter(function (e) { return e.type === 'item' && e.id === 'overview'; })[0];
    var linked = home && home.href && !home.disabled && window.LUMITURE_ACTIVE !== 'overview';
    var open = linked ? '<a class="lt-sb-logo is-link" href="' + _esc(home.href) + '" title="Go to Overview">' : '<div class="lt-sb-logo">';
    return open +
      '<div class="lt-sb-logo-wrap">' + LOGO_ICON + '</div>' +
      '<span class="lt-sb-logo-text">LumiTure.ai</span>' +
      '<span class="lt-sb-proto" title="Prototype">PROTO<span class="lt-sb-proto-x">TYPE</span></span>' +
      '<div class="lt-sb-logo-p" aria-hidden="true"><svg viewBox="0 0 39.10 34.00" fill="none">' + P_MARK_INNER + '</svg></div>' +
    (linked ? '</a>' : '</div>');
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function _renderItem(item, isSub) {
    var cls = isSub ? 'lt-sb-subitem' : 'lt-sb-item';
    var isActive = (item.id === window.LUMITURE_ACTIVE);
    var active = isActive ? ' lt-active' : '';
    var dis = item.disabled ? ' lt-dis' : '';
    // Active item: render as <div> (no self-link). Disabled item: also no href.
    var useHref = item.href && !isActive && !item.disabled;
    var tag = useHref ? 'a' : 'div';
    var hrefAttr = useHref ? ' href="' + _esc(item.href) + '"' : '';
    var dataId = ' data-nav-id="' + _esc(item.id) + '"';
    return '<' + tag + ' class="' + cls + active + dis + '"' + hrefAttr + dataId + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon || 'circle') + '</span>' +
             '<span>' + _esc(item.label) + '</span>' +
           '</' + tag + '>';
  }

  function _renderGroup(grp) {
    var collapsed = grp.collapsed ? ' lt-collapsed' : '';
    var children = (grp.items || []).map(function (item) {
      return _renderItem(item, true);
    }).join('');
    return '<div class="lt-sb-group' + collapsed + '" data-group-id="' + _esc(grp.id) + '">' +
             '<div class="lt-sb-group-hdr">' +
               '<span>' + _esc(grp.label) + '</span>' +
               '<span class="material-symbols-outlined lt-sb-group-arrow">keyboard_arrow_up</span>' +
             '</div>' +
             '<div class="lt-sb-group-children">' + children + '</div>' +
           '</div>';
  }

  function _renderNav() {
    var nav = window.LUMITURE_NAV || [];
    var html = '<div class="lt-sb-nav">';
    nav.forEach(function (entry) {
      if (entry.type === 'group') {
        html += _renderGroup(entry);
      } else {
        html += _renderItem(entry, false);
      }
    });
    html += '</div>';
    return html;
  }

  function _renderCollapseBtn() {
    return '<div class="lt-sb-collapse-btn">' +
             '<button type="button" data-action="toggle-collapse" title="Collapse sidebar">' +
               '<span class="material-symbols-outlined">chevron_left</span>' +
             '</button>' +
           '</div>';
  }

  // ===== Mount =====
  function _render() {
    var mount = document.getElementById('lt-sidebar');
    if (!mount) {
      console.warn('[lumiture-sidebar] Mount point #lt-sidebar not found');
      return;
    }
    // If mount is not already a sidebar, wrap it
    mount.classList.add('lt-sidebar');
    mount.innerHTML = _renderLogo() + _renderNav() + _renderCollapseBtn();

    // Group toggle
    mount.querySelectorAll('.lt-sb-group-hdr').forEach(function (hdr) {
      hdr.addEventListener('click', function () {
        var grp = hdr.parentElement;
        if (grp) grp.classList.toggle('lt-collapsed');
      });
    });
    // Collapse the whole sidebar
    var btn = mount.querySelector('[data-action="toggle-collapse"]');
    if (btn) {
      btn.addEventListener('click', function () {
        window.LumitureSidebar.toggleCollapse();
      });
    }
  }

  // ===== Public API =====
  window.LumitureSidebar = {
    toggleGroup: function (groupId) {
      var grp = document.querySelector('[data-group-id="' + groupId + '"]');
      if (grp) grp.classList.toggle('lt-collapsed');
    },
    toggleCollapse: function () {
      var sb = document.getElementById('lt-sidebar');
      var main = document.querySelector('.lt-main, .main, main');
      if (sb) sb.classList.toggle('lt-collapsed');
      if (main) main.classList.toggle('lt-sidebar-collapsed');
      // Sync legacy CSS vars (--sw) for prototypes that reference them in topbar / footer
      var w = sb && sb.classList.contains('lt-collapsed') ? '64px' : '250px';
      document.documentElement.style.setProperty('--sw', w);
      document.documentElement.style.setProperty('--lt-sb-w', w);
    },
    setActive: function (itemId) {
      window.LUMITURE_ACTIVE = itemId;
      document.querySelectorAll('.lt-sb-item, .lt-sb-subitem').forEach(function (el) {
        el.classList.toggle('lt-active', el.dataset.navId === itemId);
      });
    },
    rerender: _render,
  };

  // 頁面自己沒設 favicon 才補，分頁列一眼分得出 prototype 跟正式站
  function _injectFavicon() {
    if (document.querySelector('link[rel~="icon"]')) return;
    var l = document.createElement('link');
    l.rel = 'icon'; l.type = 'image/svg+xml';
    l.href = 'data:image/svg+xml,' + encodeURIComponent(FAVICON_SVG);
    document.head.appendChild(l);
  }

  // ===== INIT =====
  function _init() {
    _injectCSS();
    _injectFavicon();
    _render();
    // Dispatch resize so chart libraries (ECharts 等) 重新測量容器
    // —— 避免 inline script 已先 init chart 後，shared CSS 才 inject 導致 layout shift
    requestAnimationFrame(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

  function _injectCSS() {
    if (document.getElementById('lt-topbar-css')) return;
    var s = document.createElement('style');
    s.id = 'lt-topbar-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function _user() {
    var u = Object.assign({}, DEFAULT_USER, window.LUMITURE_USER || {});
    u.quota = Object.assign({}, DEFAULT_USER.quota, (window.LUMITURE_USER || {}).quota || {});
    return u;
  }
  function _status(used, total) {
    if (!total || total <= 0) return 'active';
    var pct = used / total * 100;
    if (pct >= 100) return 'depleted';
    if (pct >= 80)  return 'warning';
    return 'active';
  }
  function _planItems(plan) {
    return PLAN_QUOTA_ITEMS[plan] != null ? PLAN_QUOTA_ITEMS[plan] : PLAN_QUOTA_ITEMS.Standard;
  }
  function _showQuotaBox(u) {
    return _planItems(u.plan).length > 0;
  }

  // ===== Renderers =====
  function _renderIcon(item) {
    var attrs = ' class="lt-tb-ic" title="' + _esc(item.title || '') + '"';
    if (item.onclick) attrs += ' onclick="' + _esc(item.onclick) + '"';
    var badge = item.badge ? '<span class="lt-tb-badge"></span>' : '';
    return '<button type="button"' + attrs + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon) + '</span>' + badge +
           '</button>';
  }

  function _renderUserChip(u) {
    return '<button type="button" class="lt-tb-user" id="lt-tb-user" aria-haspopup="true" aria-expanded="false">' +
             '<span class="material-symbols-outlined lt-tb-avatar-ic">account_circle</span>' +
             '<div class="lt-tb-user-text">' +
               '<span class="lt-tb-user-name">' + _esc(u.name) + '</span>' +
               '<span class="lt-tb-user-role" id="lt-tb-user-role">' + _esc(u.role) + '</span>' +
             '</div>' +
             '<span class="material-symbols-outlined lt-tb-chev">keyboard_arrow_down</span>' +
           '</button>';
  }

  function _renderQuotaItem(key, q, opts) {
    opts = opts || {};
    var meta = QUOTA_META[key];
    // Premium：unlimited（無 used/total，cyan + sparkle，不可點）
    if (opts.unlimited) {
      return '<div class="lt-q-item is-unlimited">' +
               '<span class="lt-q-dot"></span>' +
               '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
               '<span class="lt-q-val">Unlimited<span class="material-symbols-outlined">auto_awesome</span></span>' +
             '</div>';
    }
    var used = q.used || 0, total = q.total || 0;
    var remaining = Math.max(0, total - used);
    var st = _status(used, total);
    // Warning / Depleted 才有 hover tooltip 說明（取代原本點開的 Limit Reached 對話框；
    // PM 確認無法提供 per-user 業務 email，故改輕量懸停說明，無 Contact Sales 動作）
    // 文案含變數 {total} {unit} {label}；{label}=Cost Dashboard / Usage Optimization
    var tip = '';
    if (st === 'depleted' || st === 'warning') {
      var verb = st === 'depleted' ? 'has been reached' : 'is approaching';
      var tipText = 'Your monthly limit (' + total.toLocaleString() + ' ' + meta.unit + ') ' + verb +
        ' for ' + meta.dialogLabel + '. Please contact your LumiTure.ai representative to purchase ' +
        'Add-ons to increase your quota for this billing cycle.';
      tip = '<span class="lt-q-tip">' + _esc(tipText) + '</span>';
    }
    var hasTip = tip !== '';
    return '<div class="lt-q-item is-' + st + (hasTip ? ' has-tip' : '') + '"' + (hasTip ? ' tabindex="0"' : '') + '>' +
             '<span class="lt-q-dot"></span>' +
             '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
             '<span class="lt-q-val">' + remaining.toLocaleString() + ' / ' + total.toLocaleString() + ' left</span>' +
             tip +
           '</div>';
  }

  function _renderQuotaBox(u) {
    var isPremium = u.plan === 'Premium';
    var items = _planItems(u.plan);
    if (!items.length && !isPremium) return '';   // 無有效 plan：不顯示（理論上不會發生）
    // Premium（unlimited）不重置 → header 只顯示 Org-wide，不接 refresh 日
    var sub = isPremium ? 'Org-wide' : 'Org-wide, refresh on ' + _esc(u.quota.refreshDate);
    var head = '<div class="lt-q-head">' +
                 '<span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-sub">' + sub + '</span>' +
               '</div>';
    // loading（refresh 日也尚未載入 → sub 一併 skeleton）
    if (u.quota.state === 'loading') {
      return '<div class="lt-q">' +
               '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-skel lt-q-skel-sub"></span></div>' +
               '<div class="lt-q-skel" style="width:78%"></div><div class="lt-q-skel" style="width:62%"></div>' +
             '</div>';
    }
    // error（partial degrade：只有這塊壞，menu 其他項照常）；refresh 日未載入 → sub 只顯示 Org-wide；Retry 右對齊
    if (u.quota.state === 'error') {
      var headErr = '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span><span class="lt-q-sub">Org-wide</span></div>';
      return '<div class="lt-q">' + headErr +
               '<div class="lt-q-err"><span class="material-symbols-outlined">help</span>' +
               '<span class="lt-q-err-msg">Couldn\'t load quota</span>' +
               '<a onclick="window.LumitureTopbar.rerender()">Retry</a></div>' +
             '</div>';
    }
    var rows = isPremium
      ? ['analyses', 'rightsizing'].map(function (k) { return _renderQuotaItem(k, {}, { unlimited: true }); }).join('')
      : items.map(function (k) { return _renderQuotaItem(k, u.quota[k] || {}); }).join('');
    // add-on 行（packs>0，Premium 不適用）；naming 對齊 PRD：單數 "AI Quota Add-on × N"
    var addon = (!isPremium && (u.addonPacks || 0) > 0)
      ? '<div class="lt-q-addon"><span class="material-symbols-outlined">auto_awesome</span>' +
          u.addonPacks + ' × AI Quota Add-ons Activated</div>'
      : '';
    return '<div class="lt-q">' + head + rows + addon + '</div>';
  }

  function _renderMenu(u) {
    var planName = _esc(u.plan) + ' Plan';
    var bannerStyle = PLAN_BANNER[u.plan] || PLAN_BANNER.Standard;
    var viewAs = u.canSwitchRole
      ? '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'View as Another Role\')">' +
          '<span class="material-symbols-outlined">sync_alt</span>View as Another Role</button>' +
        '<div class="lt-am-div"></div>'
      : '';
    var box = _renderQuotaBox(u);
    var quotaSection = box
      ? '<div class="lt-am-div"></div>' + box + '<div class="lt-am-div"></div>'
      : '<div class="lt-am-div"></div>';
    return '<div class="lt-am-backdrop" id="lt-am-backdrop" onclick="window.LumitureTopbar.closeMenu()"></div>' +
           '<div class="lt-am" id="lt-am" role="menu">' +
             '<div class="lt-am-plan" style="' + bannerStyle + '">' +
               '<span class="lt-am-plan-name">' + planName + '</span>' +
               '<span class="lt-am-plan-date">' + _esc(u.planDateRange) + '</span>' +
             '</div>' +
             '<div class="lt-am-id">' +
               '<div class="lt-am-id-name">' + _esc(u.name) + '</div>' +
               '<div class="lt-am-id-email">' + _esc(u.email) + '</div>' +
               '<span class="lt-am-chip"><span class="material-symbols-outlined">account_circle</span>' + _esc(u.role) + '</span>' +
             '</div>' +
             quotaSection +
             viewAs +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Profile\')">' +
               '<span class="material-symbols-outlined">person</span>Profile</button>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Settings\')">' +
               '<span class="material-symbols-outlined">settings</span>Settings</button>' +
             '<div class="lt-am-div"></div>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Log out\')">' +
               '<span class="material-symbols-outlined">logout</span>Log out</button>' +
           '</div>';
  }

  // ===== Mount / state =====
  var _menuOpen = false;

  function _render() {
    var mount = document.getElementById('lt-topbar');
    if (!mount) { console.warn('[lumiture-topbar] Mount point #lt-topbar not found'); return; }
    var u = _user();
    var icons = window.LUMITURE_TOPBAR_ICONS || DEFAULT_ICONS;
    mount.classList.add('lt-topbar');
    mount.innerHTML = icons.map(_renderIcon).join('') + _renderUserChip(u);
    var chip = document.getElementById('lt-tb-user');
    if (chip) chip.addEventListener('click', function (e) { e.stopPropagation(); _toggleMenu(); });
    _menuOpen = false;
  }

  function _menuHost() {
    var host = document.getElementById('lt-am-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'lt-am-host';
      document.body.appendChild(host);
    }
    return host;
  }

  function _openMenu() {
    var u = _user();
    _menuHost().innerHTML = _renderMenu(u);
    _menuOpen = true;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.add('is-open'); chip.setAttribute('aria-expanded', 'true'); }
  }
  function _closeMenu() {
    _menuHost().innerHTML = '';
    _menuOpen = false;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.remove('is-open'); chip.setAttribute('aria-expanded', 'false'); }
  }
  function _toggleMenu() { _menuOpen ? _closeMenu() : _openMenu(); }

  // Esc 關閉 menu
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && _menuOpen) _closeMenu();
  });

  // ===== Public API =====
  window.LumitureTopbar = {
    setUser: function (user) {
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, user || {});
      _render(); if (_menuOpen) _openMenu();
    },
    setRole: function (role) {
      var el = document.getElementById('lt-tb-user-role');
      if (el) el.textContent = role;
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, { role: role });
      if (_menuOpen) _openMenu();
    },
    setPlan: function (plan) {
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, { plan: plan });
      if (_menuOpen) _openMenu();
    },
    setQuota: function (q) {
      var cur = (window.LUMITURE_USER || {});
      window.LUMITURE_USER = Object.assign({}, cur, {
        quota: Object.assign({}, DEFAULT_USER.quota, cur.quota || {}, q || {}),
      });
      if (q && typeof q.addonPacks !== 'undefined') window.LUMITURE_USER.addonPacks = q.addonPacks;

  // ===== HELPERS =====
  function _esc(s) {

  function _normalizedScenarios() {
    return (window.DEMO_SCENARIOS || []).map(function (s) {

  }

  // Detect rendering mode based on what's configured
  function _detectMode() {
    var scenarios = _normalizedScenarios();
    var hasPages = (window.DEMO_PAGES && window.DEMO_PAGES.length) ||
                   scenarios.some(function (s) { return !!s.page; });
    var hasCats  = (window.DEMO_CATEGORIES && window.DEMO_CATEGORIES.length) ||
                   scenarios.some(function (s) { return !!s.category; });

    if (hasPages) return 'pages-only';
    if (hasCats)  return 'categories-only';

  // Auto-derive page list if DEMO_PAGES not provided

    if (window.DEMO_PAGES && window.DEMO_PAGES.length) return window.DEMO_PAGES;
    var seen = {};
    var pages = [];
    _normalizedScenarios().forEach(function (s) {
      if (s.page && !seen[s.page]) {
        seen[s.page] = true;
        pages.push({ id: s.page, label: s.page.charAt(0).toUpperCase() + s.page.slice(1), icon: 'tab' });
      }
    });

  function _getCategories() {
    return window.DEMO_CATEGORIES || [];

  // Filter scenarios for current page + category
  function _filterScenarios() {
    var scenarios = _normalizedScenarios();

      if (_activePage && !s.page) return false; // page-tab mode requires scenario to have page
      if (_activeCategory && s.category && s.category !== _activeCategory) return false;

    });
  }

  function _renderButtons(scenarios) {

    var noData = scenarios.filter(function (s) { return s.isNoData; });

    if (normal.some(function (s) { return !!s.group; })) {
      var order = [];
      normal.forEach(function (s) { var g = s.group || ''; if (order.indexOf(g) < 0) order.push(g); });
      order.forEach(function (g) {
        if (g) html += '<div class="demo-grp-sep">' + _esc(g) + '</div>';
        html += _renderGroup(normal.filter(function (s) { return (s.group || '') === g; }));
      });
    } else {
      html = _renderGroup(normal);
    }
    if (noData.length) {
      html += '<div class="demo-sub-sep">no data</div>' + _renderGroup(noData);
    }
    return html;
  }

  function _renderGroup(scenarios) {
    if (!scenarios.length) return '';

      var dis = s.disabled ? ' demo-dis' : '';
      var act = s.id === _activeScenario ? ' active' : '';
      var tip = s.tip ? ' data-tip="' + _esc(s.tip) + '"' : '';

             ' data-scenario="' + _esc(s.id) + '">' +
             '<span class="material-symbols-outlined">' + _esc(s.icon || 'play_arrow') + '</span>' +
             '<span>' + _esc(s.label) + '</span>' + cs + '</button>';
    }).join('');
    return '<div class="demo-buttons">' + btns + '</div>';
  }

  function _renderPageTabs(mode) {
    var pages = _getPages();
    if (!pages.length) return '';
    // 雙層模式：page tabs 用 pill style 放最上面
    // 單層 pages-only 模式：page tabs 用 underline style（跟 cat-tabs 一致），無第二層
    var isTwoLayer = mode === 'two-layer';
    var wrapClass = isTwoLayer ? 'demo-page-tabs' : 'demo-cat-tabs';
    var tabClass  = isTwoLayer ? 'demo-page-tab' : 'demo-cat-tab';
    return '<div class="' + wrapClass + '">' + pages.map(function (p) {
      var act = p.id === _activePage ? ' active' : '';

             (p.icon ? '<span class="material-symbols-outlined">' + _esc(p.icon) + '</span>' : '') +
             _esc(p.label) +

    }).join('') + '</div>';

  function _renderCategoryTabs() {
    var cats = _getCategories();
    if (!cats.length) return '';
    return '<div class="demo-cat-tabs">' + cats.map(function (c) {

      return '<button class="demo-cat-tab' + act + '" data-category="' + _esc(c.id) + '">' +
             (c.icon ? '<span class="material-symbols-outlined">' + _esc(c.icon) + '</span>' : '') +
             _esc(c.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderHint() {
    if (!_activeCategory) return '';
    var cat = _getCategories().find(function (c) { return c.id === _activeCategory; });
    if (!cat || !cat.hint) return '';
    return '<div class="demo-pane-hint">' + _esc(cat.hint) + '</div>';
  }

  function _renderScrollArea() {
    return _renderHint() + _renderButtons(_filterScenarios());

  // ===== DOM MOUNTING =====
  function _render() {
    if (document.getElementById('demo-fab')) return;

    // Auto-detect first page & category
    var mode = _detectMode();
    var pages = _getPages();
    var cats = _getCategories();
    if (!_activePage && pages.length) _activePage = pages[0].id;
    if (!_activeCategory && cats.length) _activeCategory = cats[0].id;
    if (mode === 'flat') { _activePage = null; _activeCategory = null; }
    if (mode === 'pages-only') _activeCategory = null;
    if (mode === 'categories-only') _activePage = null;

    // FAB
    var fabEl = document.createElement('button');
    fabEl.className = 'demo-fab';
    fabEl.id = 'demo-fab';
    fabEl.title = 'Designer Demo Scenarios';
    fabEl.innerHTML =
      '<span class="material-symbols-outlined">science</span>' +
      '<span class="demo-pulse" id="demo-fab-pulse"></span>';
    fabEl.addEventListener('click', function () { window._demoFabToggle(); });

    // Popover
    var popEl = document.createElement('div');
    popEl.className = 'demo-popover';
    popEl.id = 'demo-popover';
    popEl.innerHTML =
      '<div class="demo-popover-hdr">' +
        '<div class="demo-popover-title">' +
          '<span class="material-symbols-outlined" style="font-size:16px">science</span>' +
          'Demo Scenarios' +
        '</div>' +
        '<button class="demo-popover-close" id="demo-pop-close">' +
          '<span class="material-symbols-outlined" style="font-size:18px">close</span>' +
        '</button>' +
      '</div>' +
      (window.DEMO_DEFAULT
        ? '<button class="demo-reset-link" id="demo-reset-link">' +
            '<span class="material-symbols-outlined">refresh</span>Reset to Default</button>'
        : '') +
      _renderPageTabs(mode) +
      _renderCategoryTabs() +
      '<div class="demo-popover-scroll" id="demo-popover-scroll">' +
        _renderScrollArea() +
      '</div>';

    document.body.appendChild(fabEl);
    document.body.appendChild(popEl);

    // === Event wiring ===
    document.getElementById('demo-pop-close').addEventListener('click', function () {
      window._demoFabToggle();
    });

    // Reset link
    var resetLink = document.getElementById('demo-reset-link');
    if (resetLink && window.DEMO_DEFAULT) {
      resetLink.addEventListener('click', function () {
        window._demoFabApply(window.DEMO_DEFAULT, null);
      });
    }

    // Page tabs
    popEl.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        window._demoFabSetPage(t.dataset.page);
      });
    });

    // Category tabs (also handles page tabs in pages-only mode, where they use demo-cat-tab class)
    popEl.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        if (t.dataset.page) {
          window._demoFabSetPage(t.dataset.page);
        } else {
          window._demoFabSetCategory(t.dataset.category);
        }
      });
    });

    // Scenario button clicks (event delegation on scroll area)
    document.getElementById('demo-popover-scroll').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-scenario]');
      if (!btn || btn.classList.contains('demo-dis')) return;
      window._demoFabApply(btn.dataset.scenario, btn);
    });

    // Outside click to close
    document.addEventListener('click', function (e) {
      var pop = document.getElementById('demo-popover');
      var fab = document.getElementById('demo-fab');
      if (!pop || !fab) return;
      if (!pop.contains(e.target) && !fab.contains(e.target) && pop.classList.contains('show')) {
        pop.classList.remove('show');
        fab.classList.remove('popped');
      }
    });

    _injectGlobalTooltip();
  }

  // ===== #gl-tip auto-injection =====
  function _injectGlobalTooltip() {
    if (document.getElementById('gl-tip')) return; // host page already provides one
    var tip = document.createElement('div');
    tip.id = 'gl-tip';
    document.body.appendChild(tip);
    var cur = null;
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest('[data-tip]');
      if (!el || el === cur) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block';
    });
    document.addEventListener('mousemove', function (e) {
      if (!cur) return;
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var x = e.clientX - tw / 2, y = e.clientY - th - 10;
      if (x < 8) x = 8;
      if (x + tw > window.innerWidth - 8) x = window.innerWidth - tw - 8;
      if (y < 8) y = e.clientY + 16;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest('[data-tip]');
      if (el && el === cur) { cur = null; tip.style.display = 'none'; }
    });
  }

  // ===== PUBLIC API =====
  function _refreshScrollArea() {
    var scroll = document.getElementById('demo-popover-scroll');
    if (!scroll) return;
    scroll.style.opacity = '0';
    setTimeout(function () {
      scroll.innerHTML = _renderScrollArea();
      scroll.style.opacity = '1';
    }, 120);
  }

  function _refreshTabs() {
    var pop = document.getElementById('demo-popover');
    if (!pop) return;
    pop.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === _activePage);
    });
    pop.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      // In pages-only mode, cat-tab elements carry data-page (not data-category)
      if (t.dataset.page) {
        t.classList.toggle('active', t.dataset.page === _activePage);
      } else {
        t.classList.toggle('active', t.dataset.category === _activeCategory);
      }
    });
  }

  /** Toggle popover open/close */
  window._demoFabToggle = function () {
    var pop = document.getElementById('demo-popover');
    var fab = document.getElementById('demo-fab');
    var pulse = document.getElementById('demo-fab-pulse');
    var opening = !pop.classList.contains('show');
    pop.classList.toggle('show');
    fab.classList.toggle('popped');
    if (opening && pulse) pulse.style.display = 'none';
  };

  /** Set active page tab (internal + external) */
  window._demoFabSetPage = function (pageId) {
    if (_activePage === pageId) return;
    _activePage = pageId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /** Set active category tab */
  window._demoFabSetCategory = function (catId) {
    if (_activeCategory === catId) return;
    _activeCategory = catId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /**
   * Called from prototype's navigation function to auto-switch the page tab.
   * Only switches if the popover doesn't need to stay on current tab.
   */
  window.demoFabSwitchTab = function (pageId) {
    window._demoFabSetPage(pageId);
  };

  /** Apply a scenario — called via event delegation or by host */
  window._demoFabApply = function (id, btn) {
    _activeScenario = id;
    document.querySelectorAll('.demo-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    if (btn) {
      btn.classList.add('active');
    } else {
      // No btn provided (e.g. Reset link) — find scenario in DOM
      var found = document.querySelector('[data-scenario="' + id + '"]');
      if (found) found.classList.add('active');
    }
    if (typeof window.DEMO_APPLY === 'function') {
      window.DEMO_APPLY(id, btn);
    }
  };

  // ===== INIT =====
  function _init() {
    if (_activeScenario === null && window.DEMO_DEFAULT) {
      _activeScenario = window.DEMO_DEFAULT;
    }
    _render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>
<!-- Init: all shared scripts loaded, CurrencyPicker is now available -->
<script>go('list');</script>
</body>
