<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */
  --lt-shadow-chip:   0 2px 4px 0 rgba(0, 0, 0, 0.3);            /* chip / tag 用，較深 opacity */
  --lt-shadow-dialog: 0 0 6px 0 rgba(0, 0, 0, 0.2);              /* Card / Dialog / Dropdown 共用；無 offset */
  --lt-shadow-overlay:        0 4px 12px rgba(0, 0, 0, 0.14);    /* CMDS 未涵蓋；popover / floating menu */
  --lt-shadow-overlay-strong: 0 4px 16px rgba(0, 0, 0, 0.18);    /* CMDS 未涵蓋；drawer / 較重 overlay */

  /* --- Transition --- */
  --lt-transition-fast: .15s ease;
  --lt-transition-base: .2s ease;
  --lt-transition-slow: .3s ease;

  /* --- Z-index --- */
  --lt-z-base:     0;
  --lt-z-elevated: 10;
  --lt-z-sticky:   100;
  --lt-z-dropdown: 1000;
  --lt-z-modal:    2000;
  --lt-z-tooltip:  3000;
  --lt-z-toast:    4000;


  /* ============================================================
   * LAYER 2 — SEMANTIC
   * 語意層：引用 primitive，描述用途；component 預設用此層
   * ============================================================ */

  /* --- Color: Brand --- */
  --lt-color-primary:         var(--lt-blue-70);
  --lt-color-primary-hover:   var(--lt-blue-60);
  --lt-color-primary-active:  var(--lt-blue-90);
  --lt-color-primary-bg:      var(--lt-blue-10);
  --lt-color-primary-bg-emphasized: var(--lt-blue-20);

  --lt-color-secondary:       var(--lt-turquoise-70);
  --lt-color-secondary-hover: var(--lt-turquoise-60);
  --lt-color-secondary-bg:    var(--lt-turquoise-10);

  /* --- Color: Functional (alias) --- */
  --lt-color-success: var(--lt-color-success-base);
  --lt-color-error:   var(--lt-color-error-base);
  --lt-color-warning: var(--lt-color-warning-base);
  --lt-color-info:    var(--lt-color-info-base);

  /* --- Color: Text --- */
  --lt-color-text-primary:   var(--lt-grey-700);   /* 內文預設 */
  --lt-color-text-secondary: var(--lt-grey-500);   /* 次要文字 */
  --lt-color-text-tertiary:  var(--lt-grey-400);   /* hint / placeholder */
  --lt-color-text-disabled:  var(--lt-grey-400);
  --lt-color-text-inverse:   var(--lt-white);
  --lt-color-text-link:      var(--lt-blue-60);
  --lt-color-text-heading:   var(--lt-grey-800);   /* 為未來 heading 獨立換色預留 */
  --lt-color-text-icon:      var(--lt-grey-600);   /* 為未來 icon 獨立換色預留 */

  /* --- Color: Background --- */
  --lt-color-bg-default:    var(--lt-white);
  --lt-color-bg-subtle:     var(--lt-grey-50);
  --lt-color-bg-emphasized: var(--lt-grey-100);
  --lt-color-bg-disabled:   var(--lt-grey-100);
  --lt-color-bg-inverse:    var(--lt-blue-90);
  --lt-color-bg-overlay:    rgba(0, 0, 0, 0.5);

  /* --- Color: Border --- */
  --lt-color-border-default: var(--lt-grey-200);
  --lt-color-border-strong:  var(--lt-grey-300);
  --lt-color-border-focus:   var(--lt-color-primary);
  --lt-color-border-input:   #DCE3EC;   /* prototype --tf-border；略不同於 grey-200 */
  --lt-color-border-error:   var(--lt-color-error-base);


  /* ============================================================
   * LAYER 3 — COMPONENT
   * 元件層：給特定元件使用；引用 semantic
   * ============================================================ */

  /* --- Sidebar (深海軍藍) --- */
  --lt-sidebar-width:      264px;
  --lt-sidebar-bg:         var(--lt-blue-90);
  --lt-sidebar-text:       rgba(255, 255, 255, 0.85);
  --lt-sidebar-text-muted: rgba(255, 255, 255, 0.50);
  --lt-sidebar-hover-bg:   rgba(255, 255, 255, 0.06);
  --lt-sidebar-active-bg:  var(--lt-color-primary);

  /* --- Topbar --- */
  --lt-topbar-bg:     var(--lt-white);
  --lt-topbar-shadow: var(--lt-shadow-dialog);   /* CMDS Dialog shadow（Card 級別 elevation）*/

  /* --- Card --- */
  --lt-card-bg:      var(--lt-color-bg-default);
  --lt-card-radius:  var(--lt-radius-md);
  --lt-card-shadow:  var(--lt-shadow-dialog);    /* CMDS 明確規範 Card 用 Dialog shadow */
  --lt-card-padding: var(--lt-space-24);

  /* --- Button --- */
  --lt-button-radius:     var(--lt-radius-sm);
  --lt-button-padding-x:  var(--lt-space-16);
  --lt-button-padding-y:  var(--lt-space-8);
  --lt-button-focus-ring: 0 0 0 3px rgba(0, 79, 176, 0.10);

  /* --- Input / Text Field --- */
  --lt-input-bg:        var(--lt-color-bg-default);
  --lt-input-border:    var(--lt-color-border-input);
  --lt-input-radius:    var(--lt-radius-sm);
  --lt-input-padding-x: var(--lt-space-16);
  --lt-input-padding-y: var(--lt-space-8);

  /* --- Modal --- */
  --lt-modal-radius:   var(--lt-radius-lg);
  --lt-modal-shadow:   var(--lt-shadow-dialog);  /* CMDS Dialog shadow（Modal = Dialog 同類）*/
  --lt-modal-padding:  var(--lt-space-24);
  --lt-modal-backdrop: rgba(0, 0, 0, 0.5);

  /* --- Tooltip --- */
  --lt-tooltip-bg:      #3C3C3C;            /* 對齊 Lumiture-Guideline.md 規範；非品牌色，刻意不引用 brand token */
  --lt-tooltip-text:    var(--lt-white);
  --lt-tooltip-radius:  var(--lt-radius-sm);
  --lt-tooltip-padding: var(--lt-space-8);
}


/* ============================================================
 * NOT YET DEFINED (Pass 3+)
 * ============================================================
 * - ~~Chart palette~~ ✅ 已加入（2026-05-12 從 Figma General Behavior file audit）
 * - Gradient tokens (Figma 有 Lumiture.ai Blue / Orange / Lemon C 等)
 * - Opacity tokens (Figma 有 CM Opacity Color 系列)
 * - Composite typography tokens (--lt-type-h1, --lt-type-body 等 style sets)
 * - Focus / Inset shadow 特殊變體
 * - Dark mode 對應 token
 *
 * Shadow 結構待 Figma audit：v7/v8 用單層、tokens.css 主階用雙層；Overlay 已用單層作折衷
 * ============================================================ */

</style>
<style>
/* Compatibility aliases — v7 既有短名 token 對映到 tokens.css 長名 token。
 * body code 沿用舊短名；衝突值（與 tokens.css 不同）以註解標明，待後續對齊 Figma 後決定。 */
:root{
  /* Brand */
  --pri:        var(--lt-color-primary);                /* #004FB0 */
  --pri-dk:     var(--lt-color-primary-active);         /* #002663 */
  --pri-lt:     var(--lt-color-primary-hover);          /* #0B6DD7 */
  --pri-lt30:   var(--lt-blue-30);                      /* #9ED7FF */
  --pri-lt20:   var(--lt-color-primary-bg-emphasized);  /* #D1EEFF */
  --pri-lt10:   var(--lt-color-primary-bg);             /* #F2FAFF */
  --sec:        var(--lt-color-secondary);              /* #34B5D9 */
  --sec-dk:     var(--lt-turquoise-80);                 /* #228EB3 */
  --sec-lt:     var(--lt-color-secondary-hover);        /* #4ADFFF */
  --sec-lt10:   var(--lt-turquoise-10);                 /* #F0FFFF */

  /* Sidebar */
  --sb:     var(--lt-sidebar-bg);          /* #002663 */
  --sb-hov: var(--lt-sidebar-hover-bg);    /* rgba(255,255,255,0.06) */

  /* Neutral */
  --wh:   var(--lt-white);
  --g50:  var(--lt-grey-50);
  --g100: var(--lt-grey-100);
  --g200: var(--lt-grey-200);
  --g300: var(--lt-grey-300);
  --g400: var(--lt-grey-400);
  --g500: var(--lt-grey-500);
  --g600: var(--lt-grey-600);
  --g700: var(--lt-grey-700);
  --g800: var(--lt-grey-800);
  --g900: var(--lt-grey-900);

  /* Functional */
  --ok:       var(--lt-color-success-base);   /* #00B5A6 */
  --ok-lt:    var(--lt-color-success-light);  /* #E6FFF8 */
  --ok-dk:    var(--lt-color-success-dark);   /* #008F88 */
  --warn:     var(--lt-color-warning-base);   /* #FC9A0F */
  --warn-lt:  var(--lt-color-warning-light);  /* #FEF3E1 */
  --err:      var(--lt-color-error-base);     /* #FF403D */
  --err-lt:   var(--lt-color-error-light);    /* #FFEBEF */
  --info:     var(--lt-color-info-base);      /* #0B6DD7 */
  --info-lt:  var(--lt-color-info-light);     /* #E6F6FF */

  /* Radius (LumiTag v7 本來就是 4px，零衝突) */
  --r-sm: var(--lt-radius-sm);  /* 4px */
  --r-md: var(--lt-radius-md);  /* 8px */
  --r-lg: var(--lt-radius-lg);  /* 12px */

  /* Shadow — CONFLICT: v7 用單層 shadow，tokens.css 用雙層。保留 v7 literal 值避免視覺改變。 */
  --shd:  0 1px 2px rgba(0,0,0,.05);          /* DIVERGENT from --lt-shadow-xs */
  --shd2: 0 4px 6px -1px rgba(0,0,0,.1);      /* DIVERGENT from --lt-shadow-md (tokens.css 為雙層) */
  --shd3: 0 10px 15px -3px rgba(0,0,0,.1);    /* DIVERGENT from --lt-shadow-lg (tokens.css 為雙層) */

  /* Layout */
  --sw: var(--lt-sidebar-width);  /* 264px */
}

al-symbols-outlined{font-size:20px;flex-shrink:0}.ni-badge{background:var(--sec);color:var(--wh);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:auto}.sb-collapse{padding:12px;display:flex;justify-content:flex-end;border-top:1px solid rgba(255,255,255,.1)}.sb-collapse button{color:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--r-sm);transition:all .15s}.sb-collapse button:hover{background:var(--sb-hov);color:var(--wh)}.sidebar.collapsed .sb-collapse{justify-content:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.content{padding:24px 32px 32px;flex:1;background:var(--pri-lt10)}.view{display:none}.view.active{display:block}

function renderCPV(t){const ar=aRes(t);const ac=aCost(t);const ur=t.totalRes-ar;const uc=t.totalCost-ac;const ap=pct(ac,t.totalCost);const up=pct(uc,t.totalCost);

function validateName(input,prefix,editId){const v=input.value;const hint=document.getElementById(prefix+'-hint');const valid=/^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(v);const exists=S.tags.some(t=>t.name.toLowerCase()===v.toLowerCase()&&t.id!==editId);
if(!v){input.classList.remove('err');hint.className='fh';hint.style.color='';hint.textContent='Use lowercase letters, numbers, and hyphens. e.g., cost-center'}
else if(v.length>=128){input.classList.add('err');hint.className='fh err';hint.style.color='';hint.textContent='Tag key cannot exceed 128 characters.'}
else if(!valid){input.classList.add('err');hint.className='fh err';hint.style.color='';hint.textContent='Please use lowercase letters, numbers, and hyphens only. No underscores or leading/trailing hyphens.'}
else if(exists){input.classList.add('err');hint.className='fh err';hint.style.color='';hint.textContent=`"${v}" already exists. Please use a different name.`}
else{input.classList.remove('err');hint.className='fh';hint.style.color='var(--ok)';hint.textContent='✓ Name is available'}}

function _aggResLevel(resources,level){
  const valid=resources.filter(r=>r.p);
  const outside=resources.filter(r=>!r.p);
  if(level==='resource'){
    const rows=valid.map(r=>({name:r.resource||'--',resourceType:r.resourceType||'—',service:r.service||'—',cloud:r.p,cost:r.c,count:1}));
    if(outside.length>0){const oc=outside.reduce((s,r)=>s+r.c,0);rows.push({name:'Billing records outside displayed dimensions',resourceType:null,service:null,cloud:null,cost:oc,count:outside.length,isOutside:true});}
    return rows;
  }
  const map=new Map();
  valid.forEach(r=>{
    let key,name,id;
    if(level==='billing'){key=r.billingAccountId||'Unknown';name=r.billingAccountName||key;id=key;}
    else if(level==='sub'){key=r.billingAccountId+'||'+r.subAccountId;name=r.subAccountName||r.subAccountId||'Unknown';id=r.subAccountId||'—';}
    else{key=(r.p||'')+'||'+(r.service||'');name=r.service||'Unknown';id='';}
    if(!map.has(key))map.set(key,{name,id,cloud:r.p,cost:0,count:0});
    const e=map.get(key);e.cost+=r.c;e.count+=1;
  });
  return Array.from(map.values());
}

function _renderSkeleton(level){
  const sk=(w,h=13)=>`<span class="skeleton" style="width:${w}px;height:${h}px"></span>`;
  const isRes=level==='resource';
  // Vary widths per row for natural look
  const widths=isRes
    ?[[150,90,80,110,38],[200,110,100,130,42],[120,70,90,90,35],[180,100,85,115,40],[160,80,95,105,37],[140,95,88,98,41]]
    :[[220,140,130,42],[280,120,110,38],[190,150,125,44],[250,130,118,40],[210,145,132,36],[170,155,128,43]];
  const rows=widths.map(w=>isRes
    ?`<tr class="sk-row"><td>${sk(w[0])}<br><span class="skeleton" style="width:${w[1]}px;height:10px;margin-top:4px"></span></td><td>${sk(w[2])}</td><td>${sk(w[3])}</td><td style="text-align:right">${sk(120)}</td><td style="text-align:right">${sk(w[4])}</td></tr>`
    :`<tr class="sk-row"><td>${sk(w[0])}<br><span class="skeleton" style="width:${w[1]}px;height:10px;margin-top:4px"></span></td><td style="text-align:right">${sk(w[2])}</td><td style="text-align:right">${sk(w[3])}</td></tr>`
  ).join('');
  return`<div style="text-align:right;font-size:12px;color:var(--g200);margin-bottom:6px">${sk(180,12)}</div><div class="tw" id="res-modal-tbl-wrap" style="max-height:420px;overflow:hidden;box-shadow:none"><table style="width:100%;table-layout:auto"><tbody>${rows}</tbody></table></div>`;
}

function _renderResLevelTable(rows,level,isUntagged){
  const sl=_subLabel[_RMS.cloud]||'Sub Account';
  const billL=_billLabel[_RMS.cloud]||'Billing Account';
  const sa=col=>{const a=_RMS.sortCol===col;const ic=a?(_RMS.sortAsc?'arrow_upward':'arrow_downward'):'unfold_more';const color=a?'var(--pri)':'var(--g300)';return`<span class="material-symbols-outlined" style="font-size:15px;vertical-align:middle;color:${color};font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 20">${ic}</span>`;};
  const ts='font-size:12px;white-space:nowrap';
  const tsR='font-size:12px;white-space:nowrap;text-align:right';
  // Mock multipliers — Untagged: ~72% rate (×1.39); Matched: ~40% coverage (×2.5)
  const mult=isUntagged?1.39:2.5;
  const costLabel=isUntagged?'30-Day Untagged Spend':'30-Day Matched Spend';
  const pctLabel=isUntagged?'Untagged Rate':'Coverage';
  // first-col cell: badge + 2-line (name on top, id below)
  const nameCell=(name,id,cloud,title)=>`<td style="width:100%;overflow:hidden;" data-tip="${title||name}"><div style="display:flex;flex-direction:column;overflow:hidden;min-width:0"><span style="font-size:13px;color:var(--g800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</span>${id?`<span style="font-size:11px;color:var(--g400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">${id}</span>`:''}</div></td>`;
  // Resource cell — normal or "outside dimensions" special row
  const resCell=r=>r.isOutside
    ?`<td style="width:100%;overflow:hidden;"><span style="font-size:12px;color:var(--g400);font-style:italic">${r.name}</span></td>`
    :`<td style="width:100%;overflow:hidden;" data-tip="${r.name}"><span style="font-size:13px;font-weight:500;color:${r.name==='--'?'var(--g400)':'var(--g800)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${r.name}</span></td>`;
  // Plain text cell with truncation
  const textCell=v=>`<td style="font-size:13px;color:var(--g700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" data-tip="${v}">${v}</td>`;
  // Cost duo: [matched "A / B" inline, "/ B" in gray small, no duplicate currency] | [coverage % only]
  const costCells=r=>{
    const total=Math.round(r.cost*mult);
    const pct=total>0?Math.round((r.cost/total)*100):0;
    const costColor=isUntagged?'color:var(--err);':'';
    const totalNum=fmtK(total).replace(S._currency+' ','');
    return`<td style="text-align:right;white-space:nowrap;${costColor}"><span style="font-size:13px;font-weight:500">${fmtK(Math.round(r.cost))}</span><span style="font-size:11px;color:var(--g400)"> / ${totalNum}</span></td><td style="text-align:right;white-space:nowrap;font-size:13px;font-weight:500;color:var(--g700)">${pct}%</td>`;
  };
  // Cost headers (only the primary cost column is sortable)
  const costHdrs=`<th style="${tsR};cursor:pointer" onclick="sortResModal('cost')">${costLabel} ${sa('cost')}</th><th style="${tsR}">${pctLabel}</th>`;
  if(!rows.length)return`<div style="padding:40px 24px;text-align:center;color:var(--g400);font-size:13px">No data found for the selected filters.</div>`;

  if(level==='billing'){
    return`<table style="width:100%;table-layout:auto" id="res-modal-tbl"><thead><tr><th style="${ts}">${billL}</th>${costHdrs}</tr></thead><tbody>${rows.map(r=>`<tr>${nameCell(r.name,r.id,r.cloud)}${costCells(r)}</tr>`).join('')}</tbody></table>`;
  }
  if(level==='sub'){
    return`<table style="width:100%;table-layout:auto" id="res-modal-tbl"><thead><tr><th style="${ts}">${sl}</th>${costHdrs}</tr></thead><tbody>${rows.map(r=>`<tr>${nameCell(r.name,r.id,r.cloud)}${costCells(r)}</tr>`).join('')}</tbody></table>`;
  }
  if(level==='service'){
    return`<table style="width:100%;table-layout:auto" id="res-modal-tbl"><thead><tr><th style="${ts}">Service</th>${costHdrs}</tr></thead><tbody>${rows.map(r=>`<tr>${nameCell(r.name,'',r.cloud)}${costCells(r)}</tr>`).join('')}</tbody></table>`;
  }
  // Resource level — 5 cols: Resource | Resource Type | Service | Spend | Coverage
  const emptyCell=`<td style=""></td>`;
  return`<table style="width:100%;table-layout:auto" id="res-modal-tbl"><thead><tr><th style="${ts}">Resource</th><th style="${ts};white-space:nowrap">Resource Type</th><th style="${ts};white-space:nowrap">Service</th>${costHdrs}</tr></thead><tbody>${rows.map(r=>`<tr>${resCell(r)}${r.isOutside?emptyCell+emptyCell:textCell(r.resourceType)+textCell(r.service)}${costCells(r)}</tr>`).join('')}</tbody></table>`;
}

function _renderResModalBody(){
  const st=_RMS;const isUntagged=st.type==='untagged';
  const billL=_billLabel[st.cloud]||'Billing Account';
  const sl=_subLabel[st.cloud]||'Sub Account';
  const levelNames={billing:billL,sub:sl,service:'Service',resource:'Resource'};
  // Cloud dropdown (no "all" — prevents resource explosion)
  const cspOpts=['GCP','AWS','Azure'].map(c=>`<option value="${c}"${st.cloud===c?' selected':''}>${c}</option>`).join('');
  const cloudDrop=`<select class="res-csp-sel" style="width:100px" onchange="_setResCloud(this.value)">${cspOpts}</select>`;
  // Level button group
  const levelBtns=['billing','sub','service','resource'].map(l=>{
    return`<button class="rlb${st.level===l?' active':''}" onclick="_setResLevel('${l}')">${levelNames[l]}</button>`;
  }).join('');
  // Filter by cloud + search
  const q=st.search.toLowerCase();
  const filtered=st.resources.filter(r=>{
    if(!r.p)return false;
    if(st.cloud!=='all'&&r.p!==st.cloud)return false;
    if(!q)return true;
    return[r.billingAccountId,r.billingAccountName,r.subAccountId,r.subAccountName,r.service,r.resourceType,r.resource].filter(Boolean).join(' ').toLowerCase().includes(q);
  });
  // Aggregate
  let rows=_aggResLevel(filtered,st.level);
  // Sort
  rows.sort((a,b)=>{
    if(st.sortCol==='name'){const an=a.name||'',bn=b.name||'';return st.sortAsc?an.localeCompare(bn):bn.localeCompare(an);}
    if(st.sortCol==='total'){const at=a.cost*1.39,bt=b.cost*1.39;return st.sortAsc?at-bt:bt-at;}
    return st.sortAsc?a.cost-b.cost:b.cost-a.cost;
  });
  const totalCost=rows.reduce((s,r)=>s+r.cost,0);
  const tbl=_renderResLevelTable(rows,st.level,isUntagged);
  return`<div style="margin-bottom:10px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      ${cloudDrop}
      <div class="res-level-grp" style="flex-shrink:0">${levelBtns}</div>
      <span style="flex:1"></span>
      <div class="ts" style="width:220px;flex-shrink:0"><span class="material-symbols-outlined">search</span><input type="text" placeholder="Search ${levelNames[st.level]}…" value="${st.search.replace(/"/g,'&quot;')}" oninput="_filterResModal(this.value)" style="width:100%"></div>
    </div>
    <div style="text-align:right;font-size:12px;color:var(--g400)">${rows.length} items · 30-Day Total: ${fmtFull(Math.round(totalCost))}</div>
  </div>
  <div class="tw" id="res-modal-tbl-wrap" style="max-height:420px;overflow-y:auto;box-shadow:none">${tbl}</div>`;
}

function _showResLoading(delay=400){
  const el=document.getElementById('res-modal-inner');
  if(!el)return;
  // Swap only the table area with skeleton, keep toolbar
  const wrap=el.querySelector('#res-modal-tbl-wrap');
  const count=el.querySelector('[style*="items"]');
  if(wrap)wrap.innerHTML=`<table style="width:100%;table-layout:auto"><tbody>${Array(6).fill(`<tr class="sk-row"><td>${'<span class="skeleton" style="display:inline-block;height:13px;border-radius:4px;width:180px"></span>'}</td><td style="text-align:right"><span class="skeleton" style="display:inline-block;height:13px;border-radius:4px;width:120px"></span></td><td style="text-align:right"><span class="skeleton" style="display:inline-block;height:13px;border-radius:4px;width:36px"></span></td></tr>`).join('')}</tbody></table>`;
  if(count)count.innerHTML='<span class="skeleton" style="display:inline-block;height:12px;border-radius:4px;width:180px"></span>';
  return new Promise(r=>setTimeout(r,delay));
}
function _setResCloud(c){_RMS.cloud=c;_RMS.search='';_showResLoading(400).then(()=>{const el=document.getElementById('res-modal-inner');if(el)el.innerHTML=_renderResModalBody();});}
function _setResLevel(l){_RMS.level=l;_RMS.search='';_RMS.sortCol='cost';_RMS.sortAsc=false;_showResLoading(350).then(()=>{const el=document.getElementById('res-modal-inner');if(el)el.innerHTML=_renderResModalBody();});}
function _filterResModal(v){_RMS.search=v;document.getElementById('res-modal-inner').innerHTML=_renderResModalBody();}
function sortResModal(col){if(_RMS.sortCol===col){_RMS.sortAsc=!_RMS.sortAsc;}else{_RMS.sortCol=col;_RMS.sortAsc=col==='name';}document.getElementById('res-modal-inner').innerHTML=_renderResModalBody();}

function _openResModal(type,valueName,count,totalCost){
  Object.assign(_RMS,{type,valueName,resources:mockResources(count,type==='matched'?'matched':'unalloc'),totalCost:totalCost||0,level:'billing',cloud:'GCP',search:'',sortCol:'cost',sortAsc:false});
  const isUntagged=type==='untagged';
  const title=isUntagged?'Untagged Resources':`Resources Matched To: ${valueName}`;
  // Show modal with skeleton first, then render real data after 800ms
  showModal(`<div class="mh"><span class="mt">${title}</span><span class="material-symbols-outlined mx" onclick="closeModal()">close</span></div><div id="res-modal-inner">${_renderSkeleton('billing')}</div><p style="margin-top:12px;font-size:12px;color:var(--g400);font-style:italic">*Note: Costs are estimated based on synchronized data and may differ from final billing.</p><div class="mf"><button class="btn btn-p" onclick="closeModal()">Got it</button></div>`,'lg tall');

}

// ===== INFO-TIP VIEWPORT-AWARE POSITIONING =====
// (.info-tip 是 CSS-only tooltip，原本 left:50% transform:-50% 在右側會切掉 — 加 JS 動態 clamp 到 viewport)
(function(){
  document.addEventListener('mouseover',e=>{
    const it=e.target.closest('.info-tip');
    if(!it)return;
    const tb=it.querySelector('.tip-box');
    if(!tb)return;
    requestAnimationFrame(()=>{
      if(!it.matches(':hover'))return;
      // Reset to default CSS positioning to measure natural size
      tb.style.left='';tb.style.right='';tb.style.transform='';tb.style.top='';
      const tw=tb.offsetWidth,th=tb.offsetHeight;
      const vw=window.innerWidth,vh=window.innerHeight;
      const itRect=it.getBoundingClientRect();
      // Horizontal: prefer center on .info-tip, but clamp to viewport
      const itCenter=itRect.left+itRect.width/2;
      let desiredLeft=itCenter-tw/2;
      if(desiredLeft<8)desiredLeft=8;
      if(desiredLeft+tw>vw-8)desiredLeft=vw-tw-8;
      // Vertical: prefer below, flip above if would clip bottom
      let desiredTop=itRect.bottom+8;
      if(desiredTop+th>vh-8)desiredTop=itRect.top-th-8;
      if(desiredTop<8)desiredTop=8;
      // Apply as offset from .info-tip (which has position:relative)
      tb.style.left=(desiredLeft-itRect.left)+'px';
      tb.style.top=(desiredTop-itRect.top)+'px';
      tb.style.transform='none';
    });
  });
})();

// ===== GLOBAL TOOLTIP =====
(function(){
  const tip=document.createElement('div');tip.id='gl-tip';document.body.appendChild(tip);
  let cur=null;
  document.addEventListener('mouseover',e=>{
    const el=e.target.closest('[data-tip]');
    if(!el||el===cur)return;
    cur=el;tip.textContent=el.dataset.tip;tip.style.display='block';
  });
  document.addEventListener('mousemove',e=>{
    if(!cur)return;
    const vw=window.innerWidth,vh=window.innerHeight;
    /* Cap tooltip dimensions to viewport (避免內容超大時溢出) */
    tip.style.maxWidth=(vw-16)+'px';
    tip.style.maxHeight=(vh-16)+'px';
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    /* Preferred: above cursor, horizontal center */
    let x=e.clientX-tw/2,y=e.clientY-th-10;
    /* Horizontal clamp to viewport */
    if(x<8)x=8;
    if(x+tw>vw-8)x=vw-tw-8;
    /* Vertical: if would clip top, flip below cursor */
    if(y<8)y=e.clientY+16;
    /* Vertical: if would clip bottom, clamp upward */
    if(y+th>vh-8)y=vh-th-8;
    /* Final safety: ensure top ≥ 8 */
    if(y<8)y=8;
    tip.style.left=x+'px';tip.style.top=y+'px';
  });
  document.addEventListener('mouseout',e=>{
    const el=e.target.closest('[data-tip]');
    if(el&&el===cur){cur=null;tip.style.display='none';}
  });
})();
</script>

    { code: 'HKD', name: 'Hong Kong dollar',      flag: '🇭🇰' },
    { code: 'IDR', name: 'Indonesian rupiah',      flag: '🇮🇩' },
    { code: 'MYR', name: 'Malaysian ringgit',      flag: '🇲🇾' },
    { code: 'TWD', name: 'New Taiwan dollar',      flag: '🇹🇼' },
    { code: 'PHP', name: 'Philippine peso',        flag: '🇵🇭' },
    { code: 'SGD', name: 'Singapore dollar',       flag: '🇸🇬' },
    { code: 'USD', name: 'United States dollar',   flag: '🇺🇸' },
  ];

  /* ===== CSS ===== */
  var CSS = [
    /* Trigger button — Normal: transparent, no border; H=30px per CMDS spec */
    '.curr-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;',
    'font-size:13px;color:#262626;',

    'transition:background .12s}',
    /* Hover: subtle gray wash */
    '.curr-btn:hover{background:rgba(0,0,0,.06)}',
    /* Active/open: same wash + arrow flipped */
    '.curr-btn.cp-open{background:rgba(0,0,0,.06)}',
    /* Focus: blue focus ring (keyboard nav / Active state ring per CMDS) */
    '.curr-btn:focus-visible{outline:2px solid #004FB0;outline-offset:1px}',

    '.curr-dd{position:absolute;top:calc(100% + 4px);right:0;left:auto;',

  var style = document.createElement('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  /* ===== STATE ===== */
  var _activeTrigger = null;

  /* ===== INTERNAL ===== */
  function _close() {
    var dd = document.getElementById('_curr-dd');
    if (dd) dd.remove();
    if (_activeTrigger) {
      _activeTrigger.classList.remove('cp-open');
      _activeTrigger = null;
    }
  }

  function _open(triggerEl, currentCode, onChange) {
    _activeTrigger = triggerEl;
    triggerEl.classList.add('cp-open');

    /* Ensure parent is positioned */
    var wrap = triggerEl.parentElement;
    if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';

    var dd = document.createElement('div');
    dd.className = 'curr-dd';
    dd.id = '_curr-dd';
    dd.innerHTML = CURRENCIES.map(function (c) {
      var isActive = c.code === currentCode;
      return '<button class="curr-dd-item' + (isActive ? ' cp-active' : '') + '">' +
        c.name + ' (' + c.code + ')' +
        '</button>';
    }).join('');

    dd.querySelectorAll('.curr-dd-item').forEach(function (btn, i) {
      btn.addEventListener('click', function () {
        _close();
        onChange(CURRENCIES[i].code);
      });
    });

    wrap.appendChild(dd);

    /* Outside click to close */
    setTimeout(function () {
      document.addEventListener('click', function _outsideClose(e) {
        if (!dd.contains(e.target) && e.target !== triggerEl) {
          _close();
          document.removeEventListener('click', _outsideClose, true);
        }
      }, true);
    }, 0);
  }

  /* ===== PUBLIC API ===== */
  window.CurrencyPicker = {
    CURRENCIES: CURRENCIES,

    /**
     * Toggle dropdown open / close.
     * @param {Element}  triggerEl   — the .curr-btn element
     * @param {string}   currentCode — e.g. 'USD'
     * @param {Function} onChange    — called with new code when user picks
     */
    open: function (triggerEl, currentCode, onChange) {
      if (_activeTrigger === triggerEl) {
        _close();
      } else {
        _close();
        _open(triggerEl, currentCode, onChange);
      }
    },

    close: _close,
  };
})();

</script>

  function _injectCSS() {
    if (document.getElementById('lt-sidebar-css')) return;

  }

  // ===== Canonical Logo (concentric circles + PROTOTYPE tag + LumiTure.ai) =====
  var LOGO_HTML =
    '<div class="lt-sb-logo">' +
      '<div class="lt-sb-logo-wrap">' +
        '<svg viewBox="0 0 32 32" fill="none" aria-hidden="true">' +
          '<circle cx="16" cy="16" r="13" stroke="#FFF" stroke-width="2" fill="none"/>' +

      '<span class="lt-sb-logo-text">LumiTure.ai</span>' +
    '</div>';

  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

    var useHref = item.href && !isActive && !item.disabled;
    var tag = useHref ? 'a' : 'div';

               '<span class="material-symbols-outlined lt-sb-group-arrow">keyboard_arrow_up</span>' +

    return html;
  }

  function _renderCollapseBtn() {
    return '<div class="lt-sb-collapse-btn">' +
             '<button type="button" data-action="toggle-collapse" title="Collapse sidebar">' +
               '<span class="material-symbols-outlined">chevron_left</span>' +
             '</button>' +
           '</div>';
  }

  // ===== Mount =====
  function _render() {
    var mount = document.getElementById('lt-sidebar');
    if (!mount) {
      console.warn('[lumiture-sidebar] Mount point #lt-sidebar not found');
      return;
    }
    // If mount is not already a sidebar, wrap it
    mount.classList.add('lt-sidebar');
    mount.innerHTML = LOGO_HTML + _renderNav() + _renderCollapseBtn();

    // Group toggle
    mount.querySelectorAll('.lt-sb-group-hdr').forEach(function (hdr) {
      hdr.addEventListener('click', function () {
        var grp = hdr.parentElement;
        if (grp) grp.classList.toggle('lt-collapsed');
      });
    });
    // Collapse the whole sidebar
    var btn = mount.querySelector('[data-action="toggle-collapse"]');
    if (btn) {
      btn.addEventListener('click', function () {
        window.LumitureSidebar.toggleCollapse();
      });
    }
  }

  // ===== Public API =====
  window.LumitureSidebar = {
    toggleGroup: function (groupId) {
      var grp = document.querySelector('[data-group-id="' + groupId + '"]');
      if (grp) grp.classList.toggle('lt-collapsed');
    },
    toggleCollapse: function () {
      var sb = document.getElementById('lt-sidebar');
      var main = document.querySelector('.lt-main, .main, main');
      if (sb) sb.classList.toggle('lt-collapsed');
      if (main) main.classList.toggle('lt-sidebar-collapsed');
      // Sync legacy CSS vars (--sw) for prototypes that reference them in topbar / footer
      var w = sb && sb.classList.contains('lt-collapsed') ? '64px' : '264px';
      document.documentElement.style.setProperty('--sw', w);
      document.documentElement.style.setProperty('--lt-sb-w', w);
    },
    setActive: function (itemId) {
      window.LUMITURE_ACTIVE = itemId;
      document.querySelectorAll('.lt-sb-item, .lt-sb-subitem').forEach(function (el) {
        el.classList.toggle('lt-active', el.dataset.navId === itemId);
      });
    },
    rerender: _render,
  };

  // ===== INIT =====
  function _init() {
    _injectCSS();
    _render();
    // Dispatch resize so chart libraries (ECharts 等) 重新測量容器
    // —— 避免 inline script 已先 init chart 後，shared CSS 才 inject 導致 layout shift
    requestAnimationFrame(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>

 *     email:       'kabin.yang@mile.cloud',

 *     plan:        'Standard',              // Essential | Starter | Standard | Premium | none  (決定 AI Quota box 顯示哪些項目)
 *     planDateRange: '2 Aug 2025 ~ 2 Aug 2035',
 *     product:     'LumiTure.ai',
 *     version:     'v1.19.0',               // Software version 列
 *     addonPacks:  0,                       // 加購包數（>0 時 plan banner 後綴顯示 + AI Quota Add-on × N）
 *     quota: {                              // AI Quota box 數據；total 已含 add-on
 *       refreshDate: 'Jul 1, 2026',         // 下次重置日（= 自然月下月 1 號）
 *       analyses:    { used: 32,  total: 80 },    // Cost Dashboard 的 AI-Powered Analyses
 *       rightsizing: { used: 410, total: 1000 },  // Usage Optimization 的 Rightsizing resources
 *     },
 *   };
 *
 * Public API:
 *   window.LumitureTopbar.setUser({...})          — 更新並 rerender
 *   window.LumitureTopbar.setRole('Manager - ...')— 只更新 role chip（Demo FAB role 切換用）
 *   window.LumitureTopbar.setPlan('Essential')    — 切 plan（連動 AI Quota box 顯示項目）
 *   window.LumitureTopbar.setQuota({analyses:{...}, rightsizing:{...}, refreshDate, addonPacks})
 *   window.LumitureTopbar.openMenu() / closeMenu() / toggleMenu()
 *   window.LumitureTopbar.rerender()

  // plan banner 配色（對齊 Figma #01-4：Essential 灰 / Starter 藍 / Standard 深藍 / Premium 金）
  var PLAN_BANNER = {
    Essential: 'background:#5B6B7F',

    Premium:   'background:linear-gradient(90deg,#B8901F 0%,#E3BC55 100%)',

  // ===== CSS =====
  var CSS = [
    /* ---------- Topbar 容器 ---------- */

    /* User chip — avatar + name + role + chevron */
    '.lt-tb-user{display:flex;align-items:center;gap:10px;padding-left:16px;margin-left:0;',
    'border-left:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;transition:opacity .15s;background:none;border-top:none;border-right:none;border-bottom:none}',
    '.lt-tb-user:hover{opacity:.92}',
    '.lt-tb-avatar-ic{font-size:34px;color:#fff;flex-shrink:0;font-variation-settings:\'FILL\' 1,\'wght\' 400,\'GRAD\' 0,\'opsz\' 34}',
    '.lt-tb-user-text{display:flex;flex-direction:column;font-size:12px;line-height:1.3;min-width:0;font-family:\'Noto Sans\',sans-serif;text-align:left}',

    /* Plan banner */
    '.lt-am-plan{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;color:#fff}',
    '.lt-am-plan-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
    '.lt-am-plan-date{font-size:11px;font-weight:500;opacity:.85;white-space:nowrap;letter-spacing:.2px;text-transform:uppercase}',

    /* User identity */
    '.lt-am-id{padding:14px 16px 12px}',
    '.lt-am-id-name{font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
    '.lt-am-id-email{font-size:12px;color:rgba(255,255,255,.62);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
    '.lt-am-chip{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:3px 10px 3px 8px;',
    'background:#1E5FA8;border-radius:9999px;font-size:11px;font-weight:600;color:#fff}',
    '.lt-am-chip .material-symbols-outlined{font-size:14px;font-variation-settings:\'FILL\' 1,\'wght\' 500,\'GRAD\' 0,\'opsz\' 14}',

    /* ---------- AI Quota box (navy 內嵌，彩色圓點 + 提亮狀態色，對齊設計稿) ---------- */
    '.lt-q{padding:12px 16px}',
    '.lt-q-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}',
    '.lt-q-title{font-size:13px;font-weight:700;color:#fff}',
    '.lt-q-sub{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;letter-spacing:.1px}',
    /* quota item — 高度固定（per spec：切狀態版面不跳動）；warning/depleted 有 hover tooltip */
    '.lt-q-item{display:flex;align-items:center;gap:9px;padding:5px 8px;margin:0 -8px;border-radius:6px;position:relative;transition:background .12s}',
    '.lt-q-item.has-tip{cursor:help}',
    '.lt-q-item.has-tip:hover{background:rgba(255,255,255,.07)}',
    '.lt-q-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}',
    '.lt-q-label{font-size:12.5px;color:rgba(255,255,255,.9);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
    '.lt-q-val{font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:3px}',
    '.lt-q-val .material-symbols-outlined{font-size:13px;font-variation-settings:\'FILL\' 1,\'wght\' 500,\'GRAD\' 0,\'opsz\' 13}',
    /* hover tooltip（Lumiture 非圖表 tooltip 規範：#3C3C3C 深底白字） */
    '.lt-q-tip{position:absolute;top:calc(100% + 2px);left:8px;right:8px;z-index:5;background:#3C3C3C;color:#fff;',
    'font-size:11.5px;font-weight:400;line-height:1.45;padding:8px 10px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.3);',
    'opacity:0;visibility:hidden;transform:translateY(-2px);transition:opacity .12s,transform .12s;pointer-events:none}',
    '.lt-q-item.has-tip:hover .lt-q-tip,.lt-q-item.has-tip:focus-within .lt-q-tip{opacity:1;visibility:visible;transform:none}',
    /* 狀態色（提亮一階給 navy 深底，dot + value 同色） */
    '.lt-q-item.is-active    .lt-q-dot{background:#2DD4BF}', '.lt-q-item.is-active    .lt-q-val{color:#2DD4BF}',
    '.lt-q-item.is-warning   .lt-q-dot{background:#FBBF24}', '.lt-q-item.is-warning   .lt-q-val{color:#FBBF24}',
    '.lt-q-item.is-depleted  .lt-q-dot{background:#FF6B68}', '.lt-q-item.is-depleted  .lt-q-val{color:#FF6B68}',
    '.lt-q-item.is-unlimited .lt-q-dot{background:#4ADFFF}', '.lt-q-item.is-unlimited .lt-q-val{color:#4ADFFF}',
    /* add-on 行 */
    '.lt-q-addon{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:#4ADFFF;font-weight:500}',

    /* loading / error */
    '.lt-q-skel{height:13px;border-radius:4px;margin:9px 0;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.16),rgba(255,255,255,.08));background-size:200% 100%;animation:lt-q-shimmer 1.3s infinite}',
    '.lt-q-skel-sub{width:120px;height:11px;margin:0;display:inline-block}',
    '@keyframes lt-q-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}',
    '.lt-q-err{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.75);padding:4px 0}',
    '.lt-q-err-msg{flex:1;min-width:0}',
    '.lt-q-err .material-symbols-outlined{font-size:16px;color:rgba(255,255,255,.55);font-variation-settings:\'FILL\' 1,\'wght\' 400,\'GRAD\' 0,\'opsz\' 16}',
    '.lt-q-err a{color:#4ADFFF;font-weight:600;cursor:pointer;flex-shrink:0}',

    /* ---------- Menu action items ---------- */
    '.lt-am-div{height:1px;background:rgba(255,255,255,.1)}',
    '.lt-am-item{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;cursor:pointer;',
    'background:none;border:none;width:100%;font-family:inherit;font-size:13.5px;text-align:left;transition:background .12s}',
    '.lt-am-item:hover{background:rgba(255,255,255,.07)}',

  function _injectCSS() {
    if (document.getElementById('lt-topbar-css')) return;
    var s = document.createElement('style');
    s.id = 'lt-topbar-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function _user() {
    var u = Object.assign({}, DEFAULT_USER, window.LUMITURE_USER || {});
    u.quota = Object.assign({}, DEFAULT_USER.quota, (window.LUMITURE_USER || {}).quota || {});
    return u;
  }
  function _status(used, total) {
    if (!total || total <= 0) return 'active';
    var pct = used / total * 100;
    if (pct >= 100) return 'depleted';
    if (pct >= 80)  return 'warning';
    return 'active';
  }
  function _planItems(plan) {
    return PLAN_QUOTA_ITEMS[plan] != null ? PLAN_QUOTA_ITEMS[plan] : PLAN_QUOTA_ITEMS.Standard;
  }
  function _showQuotaBox(u) {
    return _planItems(u.plan).length > 0;
  }

  // ===== Renderers =====
  function _renderIcon(item) {
    var attrs = ' class="lt-tb-ic" title="' + _esc(item.title || '') + '"';
    if (item.onclick) attrs += ' onclick="' + _esc(item.onclick) + '"';
    var badge = item.badge ? '<span class="lt-tb-badge"></span>' : '';
    return '<button type="button"' + attrs + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon) + '</span>' + badge +
           '</button>';
  }

  function _renderUserChip(u) {
    return '<button type="button" class="lt-tb-user" id="lt-tb-user" aria-haspopup="true" aria-expanded="false">' +
             '<span class="material-symbols-outlined lt-tb-avatar-ic">account_circle</span>' +
             '<div class="lt-tb-user-text">' +
               '<span class="lt-tb-user-name">' + _esc(u.name) + '</span>' +
               '<span class="lt-tb-user-role" id="lt-tb-user-role">' + _esc(u.role) + '</span>' +
             '</div>' +
             '<span class="material-symbols-outlined lt-tb-chev">keyboard_arrow_down</span>' +
           '</button>';
  }

  function _renderQuotaItem(key, q, opts) {
    opts = opts || {};
    var meta = QUOTA_META[key];
    // Premium：unlimited（無 used/total，cyan + sparkle，不可點）
    if (opts.unlimited) {
      return '<div class="lt-q-item is-unlimited">' +
               '<span class="lt-q-dot"></span>' +
               '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
               '<span class="lt-q-val">Unlimited<span class="material-symbols-outlined">auto_awesome</span></span>' +
             '</div>';
    }
    var used = q.used || 0, total = q.total || 0;
    var remaining = Math.max(0, total - used);
    var st = _status(used, total);
    // Warning / Depleted 才有 hover tooltip 說明（取代原本點開的 Limit Reached 對話框；
    // PM 確認無法提供 per-user 業務 email，故改輕量懸停說明，無 Contact Sales 動作）
    // 文案含變數 {total} {unit} {label}；{label}=Cost Dashboard / Usage Optimization
    var tip = '';
    if (st === 'depleted' || st === 'warning') {
      var verb = st === 'depleted' ? 'has been reached' : 'is approaching';
      var tipText = 'Your monthly limit (' + total.toLocaleString() + ' ' + meta.unit + ') ' + verb +
        ' for ' + meta.dialogLabel + '. Please contact your LumiTure.ai representative to purchase ' +
        'Add-ons to increase your quota for this billing cycle.';
      tip = '<span class="lt-q-tip">' + _esc(tipText) + '</span>';
    }
    var hasTip = tip !== '';
    return '<div class="lt-q-item is-' + st + (hasTip ? ' has-tip' : '') + '"' + (hasTip ? ' tabindex="0"' : '') + '>' +
             '<span class="lt-q-dot"></span>' +
             '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
             '<span class="lt-q-val">' + remaining.toLocaleString() + ' / ' + total.toLocaleString() + ' left</span>' +
             tip +
           '</div>';
  }

  function _renderQuotaBox(u) {
    var isPremium = u.plan === 'Premium';
    var items = _planItems(u.plan);
    if (!items.length && !isPremium) return '';   // 無有效 plan：不顯示（理論上不會發生）
    // Premium（unlimited）不重置 → header 只顯示 Org-wide，不接 refresh 日
    var sub = isPremium ? 'Org-wide' : 'Org-wide, refresh on ' + _esc(u.quota.refreshDate);
    var head = '<div class="lt-q-head">' +
                 '<span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-sub">' + sub + '</span>' +
               '</div>';
    // loading（refresh 日也尚未載入 → sub 一併 skeleton）
    if (u.quota.state === 'loading') {
      return '<div class="lt-q">' +
               '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-skel lt-q-skel-sub"></span></div>' +
               '<div class="lt-q-skel" style="width:78%"></div><div class="lt-q-skel" style="width:62%"></div>' +
             '</div>';
    }
    // error（partial degrade：只有這塊壞，menu 其他項照常）；refresh 日未載入 → sub 只顯示 Org-wide；Retry 右對齊
    if (u.quota.state === 'error') {
      var headErr = '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span><span class="lt-q-sub">Org-wide</span></div>';
      return '<div class="lt-q">' + headErr +
               '<div class="lt-q-err"><span class="material-symbols-outlined">help</span>' +
               '<span class="lt-q-err-msg">Couldn\'t load quota</span>' +
               '<a onclick="window.LumitureTopbar.rerender()">Retry</a></div>' +
             '</div>';
    }
    var rows = isPremium
      ? ['analyses', 'rightsizing'].map(function (k) { return _renderQuotaItem(k, {}, { unlimited: true }); }).join('')
      : items.map(function (k) { return _renderQuotaItem(k, u.quota[k] || {}); }).join('');
    // add-on 行（packs>0，Premium 不適用）；naming 對齊 PRD：單數 "AI Quota Add-on × N"
    var addon = (!isPremium && (u.addonPacks || 0) > 0)
      ? '<div class="lt-q-addon"><span class="material-symbols-outlined">auto_awesome</span>' +
          u.addonPacks + ' × AI Quota Add-ons Activated</div>'
      : '';
    return '<div class="lt-q">' + head + rows + addon + '</div>';
  }

  function _renderMenu(u) {
    var planName = _esc(u.plan) + ' Plan';
    var bannerStyle = PLAN_BANNER[u.plan] || PLAN_BANNER.Standard;
    var viewAs = u.canSwitchRole
      ? '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'View as Another Role\')">' +
          '<span class="material-symbols-outlined">sync_alt</span>View as Another Role</button>' +
        '<div class="lt-am-div"></div>'
      : '';
    var box = _renderQuotaBox(u);
    var quotaSection = box
      ? '<div class="lt-am-div"></div>' + box + '<div class="lt-am-div"></div>'
      : '<div class="lt-am-div"></div>';
    return '<div class="lt-am-backdrop" id="lt-am-backdrop" onclick="window.LumitureTopbar.closeMenu()"></div>' +
           '<div class="lt-am" id="lt-am" role="menu">' +
             '<div class="lt-am-plan" style="' + bannerStyle + '">' +
               '<span class="lt-am-plan-name">' + planName + '</span>' +
               '<span class="lt-am-plan-date">' + _esc(u.planDateRange) + '</span>' +
             '</div>' +
             '<div class="lt-am-id">' +
               '<div class="lt-am-id-name">' + _esc(u.name) + '</div>' +
               '<div class="lt-am-id-email">' + _esc(u.email) + '</div>' +
               '<span class="lt-am-chip"><span class="material-symbols-outlined">account_circle</span>' + _esc(u.role) + '</span>' +
             '</div>' +
             quotaSection +
             viewAs +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Profile\')">' +
               '<span class="material-symbols-outlined">person</span>Profile</button>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Settings\')">' +
               '<span class="material-symbols-outlined">settings</span>Settings</button>' +
             '<div class="lt-am-div"></div>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Log out\')">' +
               '<span class="material-symbols-outlined">logout</span>Log out</button>' +
           '</div>';
  }

  // ===== Mount / state =====
  var _menuOpen = false;

  function _render() {
    var mount = document.getElementById('lt-topbar');
    if (!mount) { console.warn('[lumiture-topbar] Mount point #lt-topbar not found'); return; }
    var u = _user();
    var icons = window.LUMITURE_TOPBAR_ICONS || DEFAULT_ICONS;
    mount.classList.add('lt-topbar');
    mount.innerHTML = icons.map(_renderIcon).join('') + _renderUserChip(u);
    var chip = document.getElementById('lt-tb-user');
    if (chip) chip.addEventListener('click', function (e) { e.stopPropagation(); _toggleMenu(); });
    _menuOpen = false;
  }

  function _menuHost() {
    var host = document.getElementById('lt-am-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'lt-am-host';
      document.body.appendChild(host);
    }
    return host;
  }

  function _openMenu() {
    var u = _user();
    _menuHost().innerHTML = _renderMenu(u);
    _menuOpen = true;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.add('is-open'); chip.setAttribute('aria-expanded', 'true'); }
  }
  function _closeMenu() {
    _menuHost().innerHTML = '';
    _menuOpen = false;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.remove('is-open'); chip.setAttribute('aria-expanded', 'false'); }
  }

    var hasPages = (window.DEMO_PAGES && window.DEMO_PAGES.length) ||
                   scenarios.some(function (s) { return !!s.page; });

      if (s.page && !seen[s.page]) {
        seen[s.page] = true;
        pages.push({ id: s.page, label: s.page.charAt(0).toUpperCase() + s.page.slice(1), icon: 'tab' });

  // ===== HTML BUILDERS =====
  function _renderButtons(scenarios) {
    if (!scenarios.length) {

    var noData = scenarios.filter(function (s) { return s.isNoData; });

    if (noData.length) {

             '<span class="material-symbols-outlined">' + _esc(s.icon || 'play_arrow') + '</span>' +

    var tabClass  = isTwoLayer ? 'demo-page-tab' : 'demo-cat-tab';

             _esc(c.label) +

    if (!_activeCategory && cats.length) _activeCategory = cats[0].id;

    fabEl.id = 'demo-fab';

          '<span class="material-symbols-outlined" style="font-size:16px">science</span>' +
          'Demo Scenarios' +
        '</div>' +
        '<button class="demo-popover-close" id="demo-pop-close">' +
          '<span class="material-symbols-outlined" style="font-size:18px">close</span>' +
        '</button>' +
      '</div>' +
      (window.DEMO_DEFAULT

            '<span class="material-symbols-outlined">refresh</span>Reset to Default</button>'
        : '') +
      _renderPageTabs(mode) +
      _renderCategoryTabs() +
      '<div class="demo-popover-scroll" id="demo-popover-scroll">' +
        _renderScrollArea() +

    document.getElementById('demo-pop-close').addEventListener('click', function () {
      window._demoFabToggle();

    var resetLink = document.getElementById('demo-reset-link');

      resetLink.addEventListener('click', function () {

    popEl.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.addEventListener('click', function () {

    popEl.querySelectorAll('.demo-cat-tab').forEach(function (t) {

    document.addEventListener('click', function (e) {
      var pop = document.getElementById('demo-popover');
      var fab = document.getElementById('demo-fab');
      if (!pop || !fab) return;
      if (!pop.contains(e.target) && !fab.contains(e.target) && pop.classList.contains('show')) {
        pop.classList.remove('show');
        fab.classList.remove('popped');
      }
    });

    _injectGlobalTooltip();
  }

  // ===== #gl-tip auto-injection =====
  function _injectGlobalTooltip() {
    if (document.getElementById('gl-tip')) return; // host page already provides one
    var tip = document.createElement('div');
    tip.id = 'gl-tip';
    document.body.appendChild(tip);
    var cur = null;
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest('[data-tip]');
      if (!el || el === cur) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block';
    });
    document.addEventListener('mousemove', function (e) {
      if (!cur) return;
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var x = e.clientX - tw / 2, y = e.clientY - th - 10;
      if (x < 8) x = 8;
      if (x + tw > window.innerWidth - 8) x = window.innerWidth - tw - 8;
      if (y < 8) y = e.clientY + 16;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest('[data-tip]');
      if (el && el === cur) { cur = null; tip.style.display = 'none'; }
    });
  }

  // ===== PUBLIC API =====
  function _refreshScrollArea() {
    var scroll = document.getElementById('demo-popover-scroll');
    if (!scroll) return;
    scroll.style.opacity = '0';
    setTimeout(function () {
      scroll.innerHTML = _renderScrollArea();
      scroll.style.opacity = '1';
    }, 120);
  }

  function _refreshTabs() {
    var pop = document.getElementById('demo-popover');
    if (!pop) return;
    pop.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === _activePage);
    });
    pop.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      // In pages-only mode, cat-tab elements carry data-page (not data-category)
      if (t.dataset.page) {
        t.classList.toggle('active', t.dataset.page === _activePage);
      } else {
        t.classList.toggle('active', t.dataset.category === _activeCategory);
      }
    });
  }

  /** Toggle popover open/close */
  window._demoFabToggle = function () {
    var pop = document.getElementById('demo-popover');
    var fab = document.getElementById('demo-fab');
    var pulse = document.getElementById('demo-fab-pulse');
    var opening = !pop.classList.contains('show');
    pop.classList.toggle('show');
    fab.classList.toggle('popped');
    if (opening && pulse) pulse.style.display = 'none';
  };

  /** Set active page tab (internal + external) */
  window._demoFabSetPage = function (pageId) {
    if (_activePage === pageId) return;
    _activePage = pageId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /** Set active category tab */
  window._demoFabSetCategory = function (catId) {
    if (_activeCategory === catId) return;
    _activeCategory = catId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /**
   * Called from prototype's navigation function to auto-switch the page tab.
   * Only switches if the popover doesn't need to stay on current tab.
   */
  window.demoFabSwitchTab = function (pageId) {
    window._demoFabSetPage(pageId);
  };

  /** Apply a scenario — called via event delegation or by host */
  window._demoFabApply = function (id, btn) {
    _activeScenario = id;
    document.querySelectorAll('.demo-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    if (btn) {
      btn.classList.add('active');
    } else {
      // No btn provided (e.g. Reset link) — find scenario in DOM
      var found = document.querySelector('[data-scenario="' + id + '"]');
      if (found) found.classList.add('active');
    }
    if (typeof window.DEMO_APPLY === 'function') {
      window.DEMO_APPLY(id, btn);
    }
  };

  // ===== INIT =====
  function _init() {
    if (_activeScenario === null && window.DEMO_DEFAULT) {
      _activeScenario = window.DEMO_DEFAULT;
    }
    _render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>
<!-- Init: all shared scripts loaded, CurrencyPicker is now available -->
<script>go('list');</script>
