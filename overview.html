<style>
/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */
  --lt-shadow-chip:   0 2px 4px 0 rgba(0, 0, 0, 0.3);            /* chip / tag 用，較深 opacity */
  --lt-shadow-dialog: 0 0 6px 0 rgba(0, 0, 0, 0.2);              /* Card / Dialog / Dropdown 共用；無 offset */
  --lt-shadow-overlay:        0 4px 12px rgba(0, 0, 0, 0.14);    /* CMDS 未涵蓋；popover / floating menu */
  --lt-shadow-overlay-strong: 0 4px 16px rgba(0, 0, 0, 0.18);    /* CMDS 未涵蓋；drawer / 較重 overlay */

  /* --- Transition --- */
  --lt-transition-fast: .15s ease;
  --lt-transition-base: .2s ease;
  --lt-transition-slow: .3s ease;

  /* --- Z-index --- */
  --lt-z-base:     0;
  --lt-z-elevated: 10;
  --lt-z-sticky:   100;
  --lt-z-dropdown: 1000;
  --lt-z-modal:    2000;
  --lt-z-tooltip:  3000;
  --lt-z-toast:    4000;


  /* ============================================================
   * LAYER 2 — SEMANTIC
   * 語意層：引用 primitive，描述用途；component 預設用此層
   * ============================================================ */

  /* --- Color: Brand --- */
  --lt-color-primary:         var(--lt-blue-70);
  --lt-color-primary-hover:   var(--lt-blue-60);
  --lt-color-primary-active:  var(--lt-blue-90);
  --lt-color-primary-bg:      var(--lt-blue-10);
  --lt-color-primary-bg-emphasized: var(--lt-blue-20);

  --lt-color-secondary:       var(--lt-turquoise-70);
  --lt-color-secondary-hover: var(--lt-turquoise-60);
  --lt-color-secondary-bg:    var(--lt-turquoise-10);

  /* --- Color: Functional (alias) --- */
  --lt-color-success: var(--lt-color-success-base);
  --lt-color-error:   var(--lt-color-error-base);
  --lt-color-warning: var(--lt-color-warning-base);
  --lt-color-info:    var(--lt-color-info-base);

  /* --- Color: Text --- */
  --lt-color-text-primary:   var(--lt-grey-700);   /* 內文預設 */
  --lt-color-text-secondary: var(--lt-grey-500);   /* 次要文字 */
  --lt-color-text-tertiary:  var(--lt-grey-400);   /* hint / placeholder */
  --lt-color-text-disabled:  var(--lt-grey-400);
  --lt-color-text-inverse:   var(--lt-white);
  --lt-color-text-link:      var(--lt-blue-60);
  --lt-color-text-heading:   var(--lt-grey-800);   /* 為未來 heading 獨立換色預留 */
  --lt-color-text-icon:      var(--lt-grey-600);   /* 為未來 icon 獨立換色預留 */

  /* --- Color: Background --- */
  --lt-color-bg-default:    var(--lt-white);
  --lt-color-bg-subtle:     var(--lt-grey-50);
  --lt-color-bg-emphasized: var(--lt-grey-100);
  --lt-color-bg-disabled:   var(--lt-grey-100);
  --lt-color-bg-inverse:    var(--lt-blue-90);
  --lt-color-bg-overlay:    rgba(0, 0, 0, 0.5);

  /* --- Color: Border --- */
  --lt-color-border-default: var(--lt-grey-200);
  --lt-color-border-strong:  var(--lt-grey-300);
  --lt-color-border-focus:   var(--lt-color-primary);
  --lt-color-border-input:   #DCE3EC;   /* prototype --tf-border；略不同於 grey-200 */
  --lt-color-border-error:   var(--lt-color-error-base);


  /* ============================================================
   * LAYER 3 — COMPONENT
   * 元件層：給特定元件使用；引用 semantic
   * ============================================================ */

  /* --- Sidebar (深海軍藍) --- */
  --lt-sidebar-width:      250px;
  --lt-sidebar-bg:         var(--lt-blue-90);
  --lt-sidebar-text:       rgba(255, 255, 255, 0.85);
  --lt-sidebar-text-muted: rgba(255, 255, 255, 0.50);
  --lt-sidebar-hover-bg:   rgba(255, 255, 255, 0.06);
  --lt-sidebar-active-bg:  var(--lt-color-primary);

  /* --- Topbar --- */
  --lt-topbar-bg:     var(--lt-white);
  --lt-topbar-shadow: var(--lt-shadow-dialog);   /* CMDS Dialog shadow（Card 級別 elevation）*/

  /* --- Card --- */
  --lt-card-bg:      var(--lt-color-bg-default);
  --lt-card-radius:  var(--lt-radius-md);
  --lt-card-shadow:  var(--lt-shadow-dialog);    /* CMDS 明確規範 Card 用 Dialog shadow */
  --lt-card-padding: var(--lt-space-24);

  /* --- Button --- */
  --lt-button-radius:     var(--lt-radius-sm);
  --lt-button-padding-x:  var(--lt-space-16);
  --lt-button-padding-y:  var(--lt-space-8);
  --lt-button-focus-ring: 0 0 0 3px rgba(0, 79, 176, 0.10);

  /* --- Input / Text Field --- */
  --lt-input-bg:        var(--lt-color-bg-default);
  --lt-input-border:    var(--lt-color-border-input);
  --lt-input-radius:    var(--lt-radius-sm);
  --lt-input-padding-x: var(--lt-space-16);
  --lt-input-padding-y: var(--lt-space-8);

  /* --- Modal --- */
  --lt-modal-radius:   var(--lt-radius-lg);
  --lt-modal-shadow:   var(--lt-shadow-dialog);  /* CMDS Dialog shadow（Modal = Dialog 同類）*/
  --lt-modal-padding:  var(--lt-space-24);
  --lt-modal-backdrop: rgba(0, 0, 0, 0.5);

  /* --- Tooltip --- */
  --lt-tooltip-bg:      #3C3C3C;            /* 對齊 Lumiture-Guideline.md 規範；非品牌色，刻意不引用 brand token */
  --lt-tooltip-text:    var(--lt-white);
  --lt-tooltip-radius:  var(--lt-radius-sm);
  --lt-tooltip-padding: var(--lt-space-8);
}


/* ============================================================
 * NOT YET DEFINED (Pass 3+)
 * ============================================================
 * - ~~Chart palette~~ ✅ 已加入（2026-05-12 從 Figma General Behavior file audit）
 * - Gradient tokens (Figma 有 Lumiture.ai Blue / Orange / Lemon C 等)
 * - Opacity tokens (Figma 有 CM Opacity Color 系列)
 * - Composite typography tokens (--lt-type-h1, --lt-type-body 等 style sets)
 * - Focus / Inset shadow 特殊變體
 * - Dark mode 對應 token
 *
 * Shadow 結構待 Figma audit：v7/v8 用單層、tokens.css 主階用雙層；Overlay 已用單層作折衷
 * ============================================================ */

</style>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
/* ============================================================
 * Overview (Cloud Cost Overview) — route `/`
 * Source of truth: LumiTure-FE apps/lumiture-ai/src/app/(main)/page.tsx + components/*
 * 這頁已在真實產品上線；本檔是「翻譯 + 依 CMDS token 提升一致性」，不是重新設計。
 * 所有偏離 FE 現況的地方都用「⚠ DEVIATION」註記，方便回頭對照。
 * ============================================================ */

/* ---- Component-level tokens this page needs but tokens.css 尚未定義 ----
 * FE 超支變色用 MUI `warning.dark` / `error.dark`（basicColor tangerineOrange[90] / red[90]）。
 * tokens.css 只有 warning/error 的 base + light，沒有 dark 階 → 先以 FE 實際色值補在頁面層，
 * 待 tokens.css 收錄 `--lt-color-warning-dark` / `--lt-color-error-dark` 後直接改指過去。 */
:root{
  --ov-color-warning-dark: #EC6F09;   /* FE palette.warning.dark = tangerineOrange[90] */
  --ov-color-error-dark:   #BF302E;   /* FE palette.error.dark   = red[90] */
  --ov-focus-ring: 0 0 0 3px rgba(0, 79, 176, 0.10);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none}   /* 不可加 height:100%（會破壞 sticky sidebar） */
body{font-family:var(--lt-font-sans);font-size:var(--lt-fs-14);line-height:var(--lt-leading-body);color:var(--lt-color-text-primary);background:var(--lt-color-primary-bg);letter-spacing:var(--lt-tracking-normal)}
a{color:var(--lt-color-primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:var(--lt-fs-14);letter-spacing:0;color:inherit}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20;vertical-align:middle}
.icon-outline{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}

/* ===== App layout ===== */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:var(--lt-space-24) var(--lt-space-32);flex:1;display:flex;flex-direction:column}
.sections{display:flex;flex-direction:column;gap:var(--lt-space-32)}   /* FE <Stack gap={8}> = 32px */

/* ===== Page header ===== */
.pg-hdr{display:flex;align-items:center;gap:var(--lt-space-8);margin-bottom:var(--lt-space-8)}
/* ⚠ DEVIATION: FE 用 MUI h4 = 20px；這裡照 Guideline「頁面標題 H3 24px Bold」與其他 prototype 一致 */
.pg-title{font-size:var(--lt-fs-24);font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading);line-height:1.4}
.upd{display:flex;align-items:center;gap:var(--lt-space-4);margin-left:auto;font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary)}
.upd-times{display:flex;gap:20px;font-variant-numeric:tabular-nums}
.upd .ic-info{font-size:16px;color:var(--lt-color-text-secondary);cursor:help}
.icon-btn{width:36px;height:36px;border-radius:var(--lt-radius-circle);display:inline-flex;align-items:center;justify-content:center;color:var(--lt-color-text-icon);margin-left:var(--lt-space-8);transition:background var(--lt-transition-fast)}
.icon-btn:hover{background:var(--lt-color-bg-emphasized)}
.icon-btn:disabled{color:var(--lt-color-text-disabled);cursor:not-allowed;background:none}
.icon-btn svg{width:24px;height:24px;fill:currentColor}

.pg-sub{display:flex;align-items:center;justify-content:space-between;gap:var(--lt-space-16);flex-wrap:wrap}
.disclaimer{font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);line-height:1.6}
.disclaimer strong{color:var(--lt-color-text-primary);font-weight:var(--lt-fw-bold)}
.disclaimer .lm{text-decoration:underline;cursor:help}
.pg-sub-r{display:flex;align-items:center;gap:var(--lt-space-8)}

/* ===== Buttons (CMDS) ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--lt-space-4);min-width:80px;padding:0 var(--lt-button-padding-x);height:36px;border-radius:var(--lt-button-radius);font-weight:var(--lt-fw-medium);font-size:var(--lt-fs-14);line-height:1.5;white-space:nowrap;border:1px solid transparent;transition:background-color var(--lt-transition-fast),border-color var(--lt-transition-fast),color var(--lt-transition-fast)}
.btn-p{background:var(--lt-color-primary);color:var(--lt-color-text-inverse)}
.btn-p:hover{background:var(--lt-color-primary-hover)}
.btn-p:active{background:var(--lt-color-primary-active)}
.btn-o{background:var(--lt-color-bg-default);color:var(--lt-color-primary);border-color:var(--lt-color-primary)}
.btn-o:hover{background:var(--lt-color-bg-subtle);color:var(--lt-color-primary-hover);border-color:var(--lt-color-primary-hover)}
.btn-o:active{background:var(--lt-color-bg-emphasized);color:var(--lt-color-primary-active);border-color:var(--lt-color-primary-active)}
.btn-b{background:transparent;color:var(--lt-color-primary);min-width:auto;padding:0 var(--lt-space-8)}
.btn-b:hover{background:var(--lt-color-bg-subtle);color:var(--lt-color-primary-hover)}
.btn-b:hover .btn-text{text-decoration:underline}   /* Text Button：底線只套文字，icon 不畫 */
.btn-sm{height:30px;padding:0 12px}
.btn .material-symbols-outlined{font-size:18px;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 18}
.btn:disabled{background:var(--lt-color-bg-disabled)!important;color:var(--lt-grey-300)!important;border-color:transparent!important;cursor:not-allowed}

/* ===== Dropdown Field (CMDS M 36px) — Display Frequency ===== */
.dd{position:relative;display:inline-flex;align-items:center;gap:var(--lt-space-8)}
.dd-label{font-size:var(--lt-fs-12);font-weight:var(--lt-fw-bold);color:var(--lt-color-primary);white-space:nowrap}
.dd-trig{height:36px;min-width:130px;padding:0 12px;border:1px solid var(--lt-input-border);border-radius:var(--lt-input-radius);background:var(--lt-input-bg);display:inline-flex;align-items:center;justify-content:space-between;gap:var(--lt-space-8);font-size:var(--lt-fs-14);color:var(--lt-color-text-primary);transition:border-color var(--lt-transition-fast),box-shadow var(--lt-transition-fast)}
.dd-trig:hover{border-color:var(--lt-color-border-strong)}
.dd.open .dd-trig{border-color:var(--lt-color-border-focus);box-shadow:var(--ov-focus-ring)}
.dd-trig .material-symbols-outlined{font-size:18px;color:var(--lt-color-text-icon);font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 18;transition:transform .2s ease;flex-shrink:0}
.dd.open .dd-trig .material-symbols-outlined{transform:rotate(180deg)}
.dd-trig:disabled{background:var(--lt-color-bg-disabled);color:var(--lt-color-text-disabled);border-color:var(--lt-grey-300);cursor:not-allowed}
.dd-list{position:absolute;top:calc(100% + 4px);right:0;min-width:130px;background:var(--lt-color-bg-default);border-radius:var(--lt-radius-sm);box-shadow:var(--lt-shadow-dialog);padding:var(--lt-space-4) 0;z-index:var(--lt-z-dropdown);display:none;overscroll-behavior:contain}
.dd.open .dd-list{display:block}
.dd-item{height:36px;padding:0 12px;display:flex;align-items:center;font-size:var(--lt-fs-14);color:var(--lt-color-text-primary);cursor:pointer;white-space:nowrap}
.dd-item:hover{background:var(--lt-color-bg-subtle)}
.dd-item.sel{background:var(--lt-color-bg-emphasized)}

/* ===== Month Picker — 翻譯 @lumiture-ui MonthPicker（react-datepicker + Reset/Cancel/Apply footer）
 * 版面沿用 executive-insights v2 既有 .mp-* 作法（同一個元件在兩支 prototype 長一樣） ===== */
.mp-wrap{position:relative;display:inline-block}
.mp-trig{height:36px;padding:0 12px;border:1px solid var(--lt-input-border);border-radius:var(--lt-input-radius);background:var(--lt-input-bg);display:inline-flex;align-items:center;gap:var(--lt-space-8);font-size:var(--lt-fs-14);color:var(--lt-color-text-primary);min-width:150px;justify-content:space-between;transition:border-color var(--lt-transition-fast),box-shadow var(--lt-transition-fast)}
.mp-trig:hover{border-color:var(--lt-color-border-strong)}
.mp-wrap.open .mp-trig{border-color:var(--lt-color-border-focus);box-shadow:var(--ov-focus-ring)}
.mp-trig .material-symbols-outlined{font-size:18px;color:var(--lt-color-text-icon);font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 18}
.mp-trig .mp-cal{color:var(--lt-color-text-secondary)}
.mp-trig:disabled{background:var(--lt-color-bg-disabled);color:var(--lt-color-text-disabled);border-color:var(--lt-grey-300);cursor:not-allowed}
.mp-pop{position:absolute;top:calc(100% + 4px);right:0;width:320px;background:var(--lt-color-bg-default);border-radius:var(--lt-radius-md);box-shadow:var(--lt-shadow-dialog);z-index:var(--lt-z-dropdown);overscroll-behavior:contain;display:none;padding:20px}
.mp-wrap.open .mp-pop{display:block}
.mp-pop-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--lt-space-8)}
.mp-pop-title{font-size:var(--lt-fs-14);font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading);text-align:center;flex:1}
.mp-pop-nav{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--lt-radius-sm);color:var(--lt-color-text-primary)}
.mp-pop-nav:hover{background:var(--lt-color-bg-emphasized)}
.mp-pop-nav.hidden{visibility:hidden;pointer-events:none}
.mp-pop-nav .material-symbols-outlined{font-size:20px;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 20}
.mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--lt-space-8);padding:var(--lt-space-8) 0 var(--lt-space-16)}
.mp-cell{height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--lt-radius-sm);font-size:var(--lt-fs-14);font-weight:var(--lt-fw-bold);color:var(--lt-color-text-secondary);transition:background .1s}
.mp-cell:hover{background:var(--lt-color-primary-bg)}
.mp-cell.sel{background:var(--lt-color-primary);color:var(--lt-color-text-inverse)}
.mp-cell.sel:hover{background:var(--lt-color-primary-hover)}
.mp-cell.disabled{color:var(--lt-grey-300);cursor:not-allowed;background:none}
.mp-pop-ftr{display:flex;align-items:center;gap:var(--lt-space-16)}
.mp-pop-ftr .mp-ftr-right{display:flex;align-items:center;gap:var(--lt-space-8);margin-left:auto}
.mp-pop-ftr .btn-b{font-weight:var(--lt-fw-bold)}

/* ===== Card ===== */
.card{background:var(--lt-card-bg);border-radius:var(--lt-card-radius);box-shadow:var(--lt-card-shadow);padding:var(--lt-card-padding)}
/* ⚠ DEVIATION: FE CostSummaryCard 寫死 0 0 20px rgba(0,0,0,.10)；這裡統一用 --lt-card-shadow（CMDS Dialog shadow） */

/* ===== Cost Overview grid ===== */
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--lt-space-16);margin-top:var(--lt-space-32)}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--lt-space-16)}
@media(max-width:1280px){.ov-grid{grid-template-columns:1fr}}

/* Total Cost card */
.tc{height:376px;display:flex;flex-direction:column;gap:var(--lt-space-16);min-width:0}
.tc-hdr{display:flex;align-items:center;justify-content:space-between;gap:var(--lt-space-16)}
.card-title{font-size:var(--lt-fs-18);font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading);line-height:1.5;display:flex;align-items:center;gap:var(--lt-space-8)}
.card-title .ic-info{font-size:16px;color:var(--lt-color-text-tertiary);cursor:help}
.hint-italic{font-size:var(--lt-fs-14);color:var(--lt-color-text-tertiary);font-style:italic;white-space:nowrap}
.cap-hint{font-size:var(--lt-fs-12);color:var(--lt-color-text-tertiary);line-height:1.5;min-height:18px}
.tc-chart{flex:1;min-height:0;width:100%}

/* KPI summary card */
.kpi{height:180px;display:flex;flex-direction:column;min-width:0}
.kpi-lbl{font-size:var(--lt-fs-12);font-weight:var(--lt-fw-bold);color:var(--lt-color-text-secondary);margin-bottom:20px;line-height:1.5}
.kpi-val{display:flex;align-items:baseline;gap:var(--lt-space-4);margin-bottom:var(--lt-space-8);color:var(--lt-color-text-primary);cursor:default}
.kpi-val.warn{color:var(--ov-color-warning-dark)}
.kpi-val.alert{color:var(--ov-color-error-dark)}
.kpi-num{font-size:var(--lt-fs-36);font-weight:var(--lt-fw-bold);line-height:1.25;letter-spacing:0;font-variant-numeric:tabular-nums}
.kpi-cur{font-size:var(--lt-fs-12);font-weight:var(--lt-fw-bold)}
.kpi-ft{display:flex;justify-content:flex-end;align-items:center;gap:var(--lt-space-8);flex-wrap:wrap}
.kpi-desc{font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);text-align:right;white-space:pre-line;line-height:1.5}
.kpi-trend{display:inline-flex;align-items:center;gap:var(--lt-space-4);font-size:var(--lt-fs-14);font-variant-numeric:tabular-nums}
.kpi-trend.up{color:var(--lt-color-error)}
.kpi-trend.down{color:var(--lt-color-success)}
.kpi-trend.flat{color:var(--lt-color-text-tertiary)}
.kpi-trend .material-symbols-outlined{font-size:20px;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 20}
.kpi-nodata{font-size:var(--lt-fs-36);font-weight:var(--lt-fw-bold);color:var(--lt-color-text-tertiary);text-align:center;height:80px;line-height:80px}

/* ===== CardContainer（Top 10 / Cost by Cloud / Cost by FOCUS 共用外框） ===== */
.cc{min-height:280px;display:flex;flex-direction:column;gap:var(--lt-space-16);min-width:0}
.cc-hdr{display:flex;align-items:center;gap:var(--lt-space-8);flex-wrap:wrap}
.cc-hdr .cc-actions{display:flex;align-items:center;gap:var(--lt-space-8)}
.cc-hdr .dd{margin-left:auto}
.cc-meta{display:flex;align-items:center;justify-content:space-between;gap:var(--lt-space-16)}
.cc-body{flex:1;display:flex;flex-direction:column;min-height:0}
.chart-note{font-size:var(--lt-fs-12);color:var(--lt-color-text-tertiary);text-align:center;white-space:pre-line;font-style:italic;line-height:1.5;margin-top:var(--lt-space-8)}
.chart-box{width:100%}

/* Cost by Cloud HTML legend（FE 用 HTML 畫，不用 ECharts legend） */
.leg{display:flex;justify-content:center;gap:var(--lt-space-8);margin-top:12px;flex-wrap:wrap}
.leg-item{display:inline-flex;align-items:center;gap:var(--lt-space-4);font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary)}
.leg-sw{width:16px;height:12px;flex-shrink:0}

/* ===== Empty State（翻譯 FE EmptyState medium：插圖 80 + H5 + body pre-line；CMDS：icon 淡藍 #9ED7FF） ===== */
.es{flex:1;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--lt-color-text-secondary);padding:var(--lt-space-24)}
.es svg{width:80px;height:80px;display:block}
.es-title{font-size:var(--lt-fs-18);font-weight:var(--lt-fw-bold);margin-top:var(--lt-space-8);line-height:1.5}
.es-desc{font-size:var(--lt-fs-14);white-space:pre-line;margin-top:var(--lt-space-8);line-height:var(--lt-leading-body)}
.es .btn{margin-top:var(--lt-space-24)}
.es.compact{min-height:0;flex:1}

/* No Authorization 全頁 */
.noauth-card{flex:1;display:flex;justify-content:center;margin-bottom:var(--lt-space-8)}
.noauth-card .es{min-height:520px}

/* ===== Loading ===== */
.page-loading{flex:1;display:flex;align-items:center;justify-content:center;min-height:480px}
/* CMDS Loading Spinner 40×40 Primary（翻譯 MUI CircularProgress） */
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--lt-blue-20);border-top-color:var(--lt-color-primary);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ⚠ DEVIATION: FE 區塊級載入用 CircularProgress（CostByFOCUS 甚至整張卡消失）；
 * 這裡卡片外框留著、只有內容換 CMDS Skeleton（shimmer），版面不跳位 */
.sk{background:linear-gradient(90deg,var(--lt-grey-100) 25%,#FAFAFA 50%,var(--lt-grey-100) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite linear;border-radius:var(--lt-radius-sm)}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk-text{height:14px}
.sk-block{border-radius:var(--lt-radius-md)}

/* ===== Toast（左下角；避開 Demo FAB 往右挪） ===== */
.toast-wrap{position:fixed;bottom:20px;left:80px;z-index:var(--lt-z-toast);display:flex;flex-direction:column;gap:var(--lt-space-8);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--lt-color-success);color:#fff;border-radius:var(--lt-radius-md);box-shadow:var(--lt-shadow-overlay-strong);font-size:var(--lt-fs-14);font-weight:var(--lt-fw-medium);min-width:280px;max-width:480px;animation:toast-in .25s ease-out;pointer-events:auto}
.toast.err{background:var(--lt-color-error)}
.toast.info{background:var(--lt-tooltip-bg)}
.toast .material-symbols-outlined{font-size:20px;flex-shrink:0}
@keyframes toast-in{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* ===== Tooltip（非圖表：#3C3C3C 深底白字；demo-fab.js 注入的 #gl-tip 在這頁放寬到 600px + 保留換行） ===== */
body #gl-tip{max-width:600px;white-space:pre-line;font-size:13px;line-height:1.5;padding:8px 12px;border-radius:var(--lt-tooltip-radius)}

/* ===== Footer ===== */
.footer{padding:var(--lt-space-16) var(--lt-space-32);background:var(--lt-color-primary-bg);border-top:1px solid var(--lt-color-border-default);display:flex;align-items:center;justify-content:space-between;font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);flex-wrap:wrap;gap:10px}
.footer-version{font-weight:var(--lt-fw-medium);color:#262626}
.footer-version .ver-tag{background:#34B5D9;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px}
.footer-credit{color:#676767;font-size:12px}
</style>
</head>

<div class="app">

  <div class="main">

    <div class="content" id="content"></div>

      <span class="footer-version">Overview Prototype<span class="ver-tag">v1</span></span>
      <span class="footer-credit">Internal Review Only · Designed &amp; Built by Kabin</span>
    </div>

</div>

<div class="toast-wrap" id="toast-wrap"></div>

<!-- ===== Shared modules ===== -->
<script>
  window.LUMITURE_ACTIVE = 'overview';
  window.LUMITURE_USER = { role: 'Admin', plan: 'Standard' };
</script>
<script>
/* === Inlined: shared/lumiture-nav.js === */
/*!
 * lumiture-nav.js — Canonical Sidebar Navigation (Single Source of Truth)
 *
 * Defines window.LUMITURE_NAV used by shared/lumiture-sidebar.js.
 * All Lumiture prototypes share the same nav structure — this file is the
 * single source. Each prototype only needs to set window.LUMITURE_ACTIVE.
 *
 * Usage in prototype HTML:
 *   <aside id="lt-sidebar"></aside>
 *   <script>window.LUMITURE_ACTIVE = 'general-budget';<\/script>
 *   <script src="../shared/lumiture-nav.js"><\/script>    ← MUST load BEFORE sidebar
 *   <script src="../shared/lumiture-sidebar.js"><\/script>
 *
 * Rules:
 *   - Items with `href` → rendered as <a> links (clickable, cross-prototype navigation)
 *   - Items with `disabled:true` → rendered as <div> with .lt-dis class (greyed, not clickable)
 *   - The item matching LUMITURE_ACTIVE → href automatically stripped by lumiture-sidebar.js
 *     so the "current page" item won't self-link
 *
 * To add a new prototype:
 *   1. Update the relevant entry below — change `disabled:true` to `href:'../{name}/{name}-prototype-v{N}.html'`
 *   2. All 3 (or more) prototypes will automatically reflect the new link via this shared script
 *   3. The new prototype only needs to set LUMITURE_ACTIVE = its own id
 */
(function () {
  'use strict';

  window.LUMITURE_NAV = [
    { type: 'item', id: 'overview', label: 'Overview', icon: 'home', href: './overview.html' },

    { type: 'group', id: 'dashboard', label: 'Dashboard', items: [
      { id: 'cost-dashboard',     label: 'Cost Dashboard',     icon: 'dashboard',    href: './cost-dashboard.html' },
      { id: 'executive-insights', label: 'Executive Insights', icon: 'auto_awesome', href: './executive-insights.html' },
    ]},

    { type: 'group', id: 'optimization', label: 'Optimization', items: [
      { id: 'usage-optimization', label: 'Usage Optimization', icon: 'tune', href: './rightsizing.html' },
      { id: 'rate-optimization',  label: 'Rate Optimization',  icon: 'percent', href: './rate-optimization.html' },
    ]},

    { type: 'group', id: 'budget', label: 'Budget Monitoring & Alert', items: [
      { id: 'general-budget',    label: 'General Budget',    icon: 'savings',              href: './general-budget.html' },
      { id: 'customized-budget', label: 'Customized Budget', icon: 'tune',                 disabled: true },
      { id: 'anomaly-detection', label: 'Anomaly Detection', icon: 'notifications_active', disabled: true },
    ]},

    { type: 'group', id: 'org', label: 'Organization Settings', items: [
      { id: 'lumitag',            label: 'LumiTag',            icon: 'sell',            href: './lumitag.html' },
      { id: 'group-list',         label: 'Group List',         icon: 'groups',          href: './group-list.html' },
      { id: 'all-resource-list',  label: 'All Resource List',  icon: 'inventory_2',     disabled: true },
      { id: 'authorization-list', label: 'Authorization List', icon: 'link',            href: './organization-settings.html' },
      { id: 'admin-list',         label: 'Admin List',         icon: 'manage_accounts', href: './group-list.html#admin' },
    ]},
  ];
})();

</script>
<script>
/* === Inlined: shared/lumiture-sidebar.js === */
/*!
 * lumiture-sidebar.js — Lumiture Shared Sidebar (with canonical logo)
 *
 * Auto-injects:
 *   - Sidebar CSS (logo, nav items, group collapse, active state)
 *   - Canonical Lumiture logo (concentric circles + PROTOTYPE tag + LumiTure.ai wordmark)
 *
 * Usage in prototype HTML:
 *   1. Define window.LUMITURE_NAV = [...]   (see schema below)
 *   2. Define window.LUMITURE_ACTIVE = 'item-id'  (which item is highlighted)
 *   3. Add mount point: <aside id="lt-sidebar"></aside>
 *   4. <script src="../shared/lumiture-sidebar.js"><\/script>
 *
 * NAV schema:
 *   window.LUMITURE_NAV = [
 *     // Top-level item (no group)
 *     { type: 'item', id: 'overview', label: 'Overview', icon: 'home', href: '#' },
 *     // Group with children (expanded by default unless `collapsed: true`)
 *     { type: 'group', id: 'dashboard', label: 'Dashboard', expanded: true, items: [
 *       { id: 'cost-dashboard', label: 'Cost Dashboard', icon: 'dashboard', href: '#' },
 *       { id: 'exec-insights',  label: 'Executive Insights', icon: 'monitoring', disabled: true },
 *     ]},
 *   ];
 *   window.LUMITURE_ACTIVE = 'cost-dashboard';  // which item is active
 *
 * API:
 *   window.LumitureSidebar.toggleGroup(groupId)
 *   window.LumitureSidebar.toggleCollapse()    — collapse the whole sidebar (icon-only)
 *   window.LumitureSidebar.setActive(itemId)
 */
(function () {
  'use strict';

  // ===== CSS =====
  var CSS = [
    /* CSS variables — sidebar 用 Primary Dark #002663（per Lumiture-Guideline.md，2026-05-08 設計師確認） */
    ':root{--lt-sb-w:250px;--lt-sb-bg:#002663;--lt-sb-hov:rgba(255,255,255,.06);',
    '--lt-sb-active:#004FB0;--lt-sb-text:rgba(255,255,255,.85);--lt-sb-text-muted:rgba(255,255,255,.5);',
    '--lt-sb-border:rgba(255,255,255,.1)}',

    /* Sidebar container — 採 sticky positioning：父層 .app 用 flex 或 grid 都能適應
       min-width:0 是必要的：flex 子元素預設 min-width:auto 會被內容 min-content size 撐住，導致 collapse 失效 */
    '.lt-sidebar{width:var(--lt-sb-w);min-width:0;background:var(--lt-sb-bg);color:#fff;',
    'position:sticky;top:0;height:100vh;z-index:100;overflow:hidden;',
    'flex-shrink:0;',
    'display:flex;flex-direction:column;transition:width .2s ease;scrollbar-width:none}',
    '.lt-sidebar::-webkit-scrollbar{display:none}',
    '.lt-sidebar.lt-collapsed{width:64px}',

    /* Logo block */
    '.lt-sb-logo{padding:16px 20px;display:flex;align-items:center;gap:10px;',
    'font-size:18px;font-weight:700;color:#fff;border-bottom:1px solid var(--lt-sb-border);',
    'min-height:68px;box-sizing:border-box;white-space:nowrap;overflow:hidden;flex-shrink:0}',
    '.lt-sb-logo-wrap{position:relative;width:32px;height:32px;flex-shrink:0}',
    '.lt-sb-logo-wrap svg{width:32px;height:32px;display:block}',
    /* PROTOTYPE tag — cyan caps below the icon */
    '.lt-sb-proto{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);',
    'background:var(--lt-sb-bg);color:#34B5D9;font-size:6px;font-weight:700;',
    'padding:1px 3px;border-radius:2px;text-transform:uppercase;letter-spacing:.3px;',
    'line-height:1.2;white-space:nowrap}',
    '.lt-sb-logo-text{transition:opacity .2s}',
    '.lt-sidebar.lt-collapsed .lt-sb-logo-text{opacity:0;width:0;overflow:hidden}',
    '.lt-sidebar.lt-collapsed .lt-sb-proto{display:none}',
    '.lt-sidebar.lt-collapsed .lt-sb-logo{padding:16px;justify-content:center;gap:0}',

    /* Nav scroll area — 內部捲動，sidebar 外層不捲（寬敞 padding 對齊原始設計） */
    '.lt-sb-nav{flex:1;padding:8px 12px;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}',
    '.lt-sb-nav::-webkit-scrollbar{width:6px}',
    '.lt-sb-nav::-webkit-scrollbar-track{background:transparent}',
    '.lt-sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}',
    '.lt-sb-nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.25)}',

    /* Top-level item (no group) — 寬敞 padding，font-size 14px */
    '.lt-sb-item{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;',
    'font-size:14px;color:rgba(255,255,255,.92);border-radius:6px;transition:background .15s;',
    'text-decoration:none;white-space:nowrap;overflow:hidden;margin-bottom:2px}',
    '.lt-sb-item:hover{background:var(--lt-sb-hov);color:#fff}',
    '.lt-sb-item.lt-active{background:var(--lt-sb-active);color:#fff;font-weight:500}',
    '.lt-sb-item.lt-dis{color:rgba(255,255,255,.35);cursor:not-allowed;pointer-events:none}',
    '.lt-sb-item .material-symbols-outlined{font-size:20px;opacity:.9;flex-shrink:0}',

    /* Group section */
    '.lt-sb-group{margin-bottom:4px}',
    '.lt-sb-group-hdr{display:flex;align-items:center;justify-content:space-between;',
    'padding:18px 14px 10px;font-size:14px;font-weight:700;color:#fff;',
    'cursor:pointer;white-space:nowrap;overflow:hidden;letter-spacing:.2px}',
    '.lt-sb-group-hdr > span:first-child{overflow:hidden;text-overflow:ellipsis}',
    '.lt-sb-group-hdr:hover{color:rgba(255,255,255,.85)}',
    '.lt-sb-group-arrow{font-size:18px;transition:transform .18s;opacity:.85;flex-shrink:0}',
    '.lt-sb-group.lt-collapsed .lt-sb-group-arrow{transform:rotate(180deg)}',
    '.lt-sb-group.lt-collapsed .lt-sb-group-children{display:none}',

    /* Sub-item (inside group) — 一致 14px font，11px 垂直 padding */
    '.lt-sb-subitem{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;',
    'font-size:14px;color:rgba(255,255,255,.92);border-radius:6px;transition:background .15s;',
    'text-decoration:none;white-space:nowrap;overflow:hidden}',
    '.lt-sb-subitem:hover{background:var(--lt-sb-hov);color:#fff}',
    '.lt-sb-subitem.lt-active{background:var(--lt-sb-active);color:#fff;font-weight:500}',

    '.lt-sidebar.lt-collapsed .lt-sb-group.lt-collapsed .lt-sb-group-children{display:block}',
    '.lt-sidebar.lt-collapsed .lt-sb-nav{padding:8px 4px}',

    /* Collapse toggle button at bottom */
    '.lt-sb-collapse-btn{padding:12px;display:flex;justify-content:flex-end;',

  function _injectCSS() {
    if (document.getElementById('lt-sidebar-css')) return;
    var s = document.createElement('style');
    s.id = 'lt-sidebar-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ===== Canonical Logo (concentric circles + PROTOTYPE tag + LumiTure.ai) =====
  var LOGO_HTML =
    '<div class="lt-sb-logo">' +
      '<div class="lt-sb-logo-wrap">' +
        '<svg viewBox="0 0 32 32" fill="none" aria-hidden="true">' +
          '<circle cx="16" cy="16" r="13" stroke="#FFF" stroke-width="2" fill="none"/>' +
          '<circle cx="16" cy="16" r="7" stroke="#FFF" stroke-width="2" fill="none"/>' +
          '<circle cx="16" cy="16" r="3" fill="#FFF"/>' +
        '</svg>' +
        '<span class="lt-sb-proto">PROTOTYPE</span>' +
      '</div>' +
      '<span class="lt-sb-logo-text">LumiTure.ai</span>' +
    '</div>';

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function _renderItem(item, isSub) {
    var cls = isSub ? 'lt-sb-subitem' : 'lt-sb-item';
    var isActive = (item.id === window.LUMITURE_ACTIVE);
    var active = isActive ? ' lt-active' : '';
    var dis = item.disabled ? ' lt-dis' : '';
    // Active item: render as <div> (no self-link). Disabled item: also no href.
    var useHref = item.href && !isActive && !item.disabled;
    var tag = useHref ? 'a' : 'div';
    var hrefAttr = useHref ? ' href="' + _esc(item.href) + '"' : '';
    var dataId = ' data-nav-id="' + _esc(item.id) + '"';
    return '<' + tag + ' class="' + cls + active + dis + '"' + hrefAttr + dataId + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon || 'circle') + '</span>' +
             '<span>' + _esc(item.label) + '</span>' +
           '</' + tag + '>';
  }

  function _renderGroup(grp) {
    var collapsed = grp.collapsed ? ' lt-collapsed' : '';
    var children = (grp.items || []).map(function (item) {
      return _renderItem(item, true);
    }).join('');
    return '<div class="lt-sb-group' + collapsed + '" data-group-id="' + _esc(grp.id) + '">' +
             '<div class="lt-sb-group-hdr">' +
               '<span>' + _esc(grp.label) + '</span>' +
               '<span class="material-symbols-outlined lt-sb-group-arrow">keyboard_arrow_up</span>' +
             '</div>' +
             '<div class="lt-sb-group-children">' + children + '</div>' +
           '</div>';
  }

  function _renderNav() {
    var nav = window.LUMITURE_NAV || [];
    var html = '<div class="lt-sb-nav">';
    nav.forEach(function (entry) {
      if (entry.type === 'group') {
        html += _renderGroup(entry);
      } else {
        html += _renderItem(entry, false);
      }
    });
    html += '</div>';
    return html;
  }

  function _renderCollapseBtn() {
    return '<div class="lt-sb-collapse-btn">' +
             '<button type="button" data-action="toggle-collapse" title="Collapse sidebar">' +
               '<span class="material-symbols-outlined">chevron_left</span>' +
             '</button>' +
           '</div>';
  }

  // ===== Mount =====
  function _render() {
    var mount = document.getElementById('lt-sidebar');
    if (!mount) {
      console.warn('[lumiture-sidebar] Mount point #lt-sidebar not found');
      return;
    }
    // If mount is not already a sidebar, wrap it
    mount.classList.add('lt-sidebar');
    mount.innerHTML = LOGO_HTML + _renderNav() + _renderCollapseBtn();

    // Group toggle
    mount.querySelectorAll('.lt-sb-group-hdr').forEach(function (hdr) {
      hdr.addEventListener('click', function () {
        var grp = hdr.parentElement;
        if (grp) grp.classList.toggle('lt-collapsed');
      });
    });
    // Collapse the whole sidebar
    var btn = mount.querySelector('[data-action="toggle-collapse"]');
    if (btn) {
      btn.addEventListener('click', function () {
        window.LumitureSidebar.toggleCollapse();
      });
    }
  }

  // ===== Public API =====
  window.LumitureSidebar = {
    toggleGroup: function (groupId) {
      var grp = document.querySelector('[data-group-id="' + groupId + '"]');
      if (grp) grp.classList.toggle('lt-collapsed');
    },
    toggleCollapse: function () {
      var sb = document.getElementById('lt-sidebar');
      var main = document.querySelector('.lt-main, .main, main');
      if (sb) sb.classList.toggle('lt-collapsed');
      if (main) main.classList.toggle('lt-sidebar-collapsed');
      // Sync legacy CSS vars (--sw) for prototypes that reference them in topbar / footer
      var w = sb && sb.classList.contains('lt-collapsed') ? '64px' : '250px';
      document.documentElement.style.setProperty('--sw', w);
      document.documentElement.style.setProperty('--lt-sb-w', w);
    },
    setActive: function (itemId) {
      window.LUMITURE_ACTIVE = itemId;
      document.querySelectorAll('.lt-sb-item, .lt-sb-subitem').forEach(function (el) {
        el.classList.toggle('lt-active', el.dataset.navId === itemId);
      });
    },
    rerender: _render,
  };

  // ===== INIT =====
  function _init() {
    _injectCSS();
    _render();
    // Dispatch resize so chart libraries (ECharts 等) 重新測量容器
    // —— 避免 inline script 已先 init chart 後，shared CSS 才 inject 導致 layout shift
    requestAnimationFrame(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

    if (item.onclick) attrs += ' onclick="' + _esc(item.onclick) + '"';
    var badge = item.badge ? '<span class="lt-tb-badge"></span>' : '';
    return '<button type="button"' + attrs + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon) + '</span>' + badge +
           '</button>';
  }

  function _renderUserChip(u) {
    return '<button type="button" class="lt-tb-user" id="lt-tb-user" aria-haspopup="true" aria-expanded="false">' +
             '<span class="material-symbols-outlined lt-tb-avatar-ic">account_circle</span>' +
             '<div class="lt-tb-user-text">' +
               '<span class="lt-tb-user-name">' + _esc(u.name) + '</span>' +
               '<span class="lt-tb-user-role" id="lt-tb-user-role">' + _esc(u.role) + '</span>' +
             '</div>' +
             '<span class="material-symbols-outlined lt-tb-chev">keyboard_arrow_down</span>' +
           '</button>';
  }

  function _renderQuotaItem(key, q, opts) {
    opts = opts || {};
    var meta = QUOTA_META[key];
    // Premium：unlimited（無 used/total，cyan + sparkle，不可點）
    if (opts.unlimited) {
      return '<div class="lt-q-item is-unlimited">' +
               '<span class="lt-q-dot"></span>' +
               '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
               '<span class="lt-q-val">Unlimited<span class="material-symbols-outlined">auto_awesome</span></span>' +
             '</div>';
    }
    var used = q.used || 0, total = q.total || 0;
    var remaining = Math.max(0, total - used);
    var st = _status(used, total);
    // Warning / Depleted 才有 hover tooltip 說明（取代原本點開的 Limit Reached 對話框；
    // PM 確認無法提供 per-user 業務 email，故改輕量懸停說明，無 Contact Sales 動作）
    // 文案含變數 {total} {unit} {label}；{label}=Cost Dashboard / Usage Optimization
    var tip = '';
    if (st === 'depleted' || st === 'warning') {
      var verb = st === 'depleted' ? 'has been reached' : 'is approaching';
      var tipText = 'Your monthly limit (' + total.toLocaleString() + ' ' + meta.unit + ') ' + verb +
        ' for ' + meta.dialogLabel + '. Please contact your LumiTure.ai representative to purchase ' +
        'Add-ons to increase your quota for this billing cycle.';
      tip = '<span class="lt-q-tip">' + _esc(tipText) + '</span>';
    }
    var hasTip = tip !== '';
    return '<div class="lt-q-item is-' + st + (hasTip ? ' has-tip' : '') + '"' + (hasTip ? ' tabindex="0"' : '') + '>' +
             '<span class="lt-q-dot"></span>' +
             '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
             '<span class="lt-q-val">' + remaining.toLocaleString() + ' / ' + total.toLocaleString() + ' left</span>' +
             tip +
           '</div>';
  }

  function _renderQuotaBox(u) {
    var isPremium = u.plan === 'Premium';
    var items = _planItems(u.plan);
    if (!items.length && !isPremium) return '';   // 無有效 plan：不顯示（理論上不會發生）
    // Premium（unlimited）不重置 → header 只顯示 Org-wide，不接 refresh 日
    var sub = isPremium ? 'Org-wide' : 'Org-wide, refresh on ' + _esc(u.quota.refreshDate);
    var head = '<div class="lt-q-head">' +
                 '<span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-sub">' + sub + '</span>' +
               '</div>';
    // loading（refresh 日也尚未載入 → sub 一併 skeleton）
    if (u.quota.state === 'loading') {
      return '<div class="lt-q">' +
               '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-skel lt-q-skel-sub"></span></div>' +
               '<div class="lt-q-skel" style="width:78%"></div><div class="lt-q-skel" style="width:62%"></div>' +
             '</div>';
    }
    // error（partial degrade：只有這塊壞，menu 其他項照常）；refresh 日未載入 → sub 只顯示 Org-wide；Retry 右對齊
    if (u.quota.state === 'error') {
      var headErr = '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span><span class="lt-q-sub">Org-wide</span></div>';
      return '<div class="lt-q">' + headErr +
               '<div class="lt-q-err"><span class="material-symbols-outlined">help</span>' +
               '<span class="lt-q-err-msg">Couldn\'t load quota</span>' +
               '<a onclick="window.LumitureTopbar.rerender()">Retry</a></div>' +
             '</div>';
    }
    var rows = isPremium
      ? ['analyses', 'rightsizing'].map(function (k) { return _renderQuotaItem(k, {}, { unlimited: true }); }).join('')
      : items.map(function (k) { return _renderQuotaItem(k, u.quota[k] || {}); }).join('');
    // add-on 行（packs>0，Premium 不適用）；naming 對齊 PRD：單數 "AI Quota Add-on × N"
    var addon = (!isPremium && (u.addonPacks || 0) > 0)
      ? '<div class="lt-q-addon"><span class="material-symbols-outlined">auto_awesome</span>' +
          u.addonPacks + ' × AI Quota Add-ons Activated</div>'
      : '';
    return '<div class="lt-q">' + head + rows + addon + '</div>';
  }

  function _renderMenu(u) {
    var planName = _esc(u.plan) + ' Plan';
    var bannerStyle = PLAN_BANNER[u.plan] || PLAN_BANNER.Standard;
    var viewAs = u.canSwitchRole
      ? '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'View as Another Role\')">' +
          '<span class="material-symbols-outlined">sync_alt</span>View as Another Role</button>' +
        '<div class="lt-am-div"></div>'
      : '';
    var box = _renderQuotaBox(u);
    var quotaSection = box
      ? '<div class="lt-am-div"></div>' + box + '<div class="lt-am-div"></div>'
      : '<div class="lt-am-div"></div>';
    return '<div class="lt-am-backdrop" id="lt-am-backdrop" onclick="window.LumitureTopbar.closeMenu()"></div>' +
           '<div class="lt-am" id="lt-am" role="menu">' +
             '<div class="lt-am-plan" style="' + bannerStyle + '">' +
               '<span class="lt-am-plan-name">' + planName + '</span>' +
               '<span class="lt-am-plan-date">' + _esc(u.planDateRange) + '</span>' +
             '</div>' +
             '<div class="lt-am-id">' +
               '<div class="lt-am-id-name">' + _esc(u.name) + '</div>' +
               '<div class="lt-am-id-email">' + _esc(u.email) + '</div>' +
               '<span class="lt-am-chip"><span class="material-symbols-outlined">account_circle</span>' + _esc(u.role) + '</span>' +
             '</div>' +
             quotaSection +
             viewAs +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Profile\')">' +
               '<span class="material-symbols-outlined">person</span>Profile</button>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Settings\')">' +
               '<span class="material-symbols-outlined">settings</span>Settings</button>' +
             '<div class="lt-am-div"></div>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Log out\')">' +
               '<span class="material-symbols-outlined">logout</span>Log out</button>' +
           '</div>';
  }

  // ===== Mount / state =====
  var _menuOpen = false;

  function _render() {
    var mount = document.getElementById('lt-topbar');
    if (!mount) { console.warn('[lumiture-topbar] Mount point #lt-topbar not found'); return; }
    var u = _user();
    var icons = window.LUMITURE_TOPBAR_ICONS || DEFAULT_ICONS;
    mount.classList.add('lt-topbar');
    mount.innerHTML = icons.map(_renderIcon).join('') + _renderUserChip(u);
    var chip = document.getElementById('lt-tb-user');
    if (chip) chip.addEventListener('click', function (e) { e.stopPropagation(); _toggleMenu(); });
    _menuOpen = false;
  }

  function _menuHost() {
    var host = document.getElementById('lt-am-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'lt-am-host';
      document.body.appendChild(host);
    }
    return host;
  }

  function _openMenu() {
    var u = _user();
    _menuHost().innerHTML = _renderMenu(u);
    _menuOpen = true;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.add('is-open'); chip.setAttribute('aria-expanded', 'true'); }
  }
  function _closeMenu() {
    _menuHost().innerHTML = '';
    _menuOpen = false;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.remove('is-open'); chip.setAttribute('aria-expanded', 'false'); }
  }
  function _toggleMenu() { _menuOpen ? _closeMenu() : _openMenu(); }

  // Esc 關閉 menu
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && _menuOpen) _closeMenu();
  });

  // ===== Public API =====
  window.LumitureTopbar = {
    setUser: function (user) {
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, user || {});
      _render(); if (_menuOpen) _openMenu();
    },
    setRole: function (role) {
      var el = document.getElementById('lt-tb-user-role');
      if (el) el.textContent = role;
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, { role: role });
      if (_menuOpen) _openMenu();
    },
    setPlan: function (plan) {
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, { plan: plan });
      if (_menuOpen) _openMenu();
    },
    setQuota: function (q) {
      var cur = (window.LUMITURE_USER || {});
      window.LUMITURE_USER = Object.assign({}, cur, {
        quota: Object.assign({}, DEFAULT_USER.quota, cur.quota || {}, q || {}),
      });
      if (q && typeof q.addonPacks !== 'undefined') window.LUMITURE_USER.addonPacks = q.addonPacks;
      if (_menuOpen) _openMenu();
    },
    openMenu: _openMenu,
    closeMenu: _closeMenu,
    toggleMenu: _toggleMenu,
    rerender: function () { _render(); if (_menuOpen) _openMenu(); },
    _noop: function (label) { /* 展示用：Profile/Settings/Log out/View as Another Role 點擊佔位 */
      if (typeof window.LUMITURE_MENU_ACTION === 'function') window.LUMITURE_MENU_ACTION(label);
    },
  };

  // ===== INIT =====
  function _init() { _injectCSS(); _render(); }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else { _init(); }
})();

</script>
<script>
/* === Inlined: shared/currency-picker.js === */
/*!
 * currency-picker.js — Lumiture Shared Currency Picker v3
 *
 * Design spec: CMDS Component Library > Currency Switch (H=30px)
 *   - Normal: transparent bg, no border; Hover: subtle gray bg; Focus: focus ring
 *   - Trigger format: [flag] [CODE] [expand_more]
 *   - Dropdown gap: 4px from trigger bottom
 *   - Dropdown items: "Full Name (CODE)", selected = gray bg, no checkmark
 *
 * Design spec: Figma #01-4 Overview: Change Currency
 *   - 7 currencies from PRD, sorted alphabetically by full name
 *
 * Usage (inline onclick pattern, works with dynamically rendered triggers):
 *
 *   HTML trigger (static):
 *     <button class="curr-btn"
 *             onclick="CurrencyPicker.open(this, currentCode, onChangeFn)">
 *       <span class="curr-flag">🇺🇸</span>
 *       <span class="curr-code">USD</span>
 *       <span class="material-symbols-outlined">expand_more</span>
 *     </button>
 *
 *   HTML trigger (dynamic, inside JS template):
 *     const c = CurrencyPicker.CURRENCIES.find(c => c.code === currentCode);
 *     `<button class="curr-btn" onclick="CurrencyPicker.open(this,'${currentCode}',fn)">
 *       <span class="curr-flag">${c?.flag || ''}</span>
 *       <span class="curr-code">${currentCode}</span>
 *       <span class="material-symbols-outlined">expand_more</span>
 *     </button>`
 *
 *   Update trigger on currency change (setCurrency callback):
 *     const c = CurrencyPicker.CURRENCIES.find(c => c.code === newCode);
 *     document.getElementById('currency-flag').textContent = c?.flag || '';
 *     document.getElementById('currency-code').textContent = newCode;
 *
 * Exposes:
 *   window.CurrencyPicker.CURRENCIES   — [{code, name, flag}]
 *   window.CurrencyPicker.open(triggerEl, currentCode, onChangeFn)
 *   window.CurrencyPicker.close()
 */
(function () {
  'use strict';

  /* Sorted alphabetically by full name, per Figma spec + PRD */
  var CURRENCIES = [
    { code: 'HKD', name: 'Hong Kong dollar',      flag: '🇭🇰' },
    { code: 'IDR', name: 'Indonesian rupiah',      flag: '🇮🇩' },
    { code: 'MYR', name: 'Malaysian ringgit',      flag: '🇲🇾' },
    { code: 'TWD', name: 'New Taiwan dollar',      flag: '🇹🇼' },
    { code: 'PHP', name: 'Philippine peso',        flag: '🇵🇭' },
    { code: 'SGD', name: 'Singapore dollar',       flag: '🇸🇬' },
    { code: 'USD', name: 'United States dollar',   flag: '🇺🇸' },
  ];

  /* ===== CSS ===== */
  var CSS = [
    /* Trigger button — Normal: transparent, no border; H=30px per CMDS spec */
    '.curr-btn{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 7px;',
    'font-size:13px;color:#262626;',
    'cursor:pointer;background:transparent;border:none;border-radius:6px;',
    'font-family:inherit;line-height:1;white-space:nowrap;',
    'transition:background .12s}',
    /* Hover: subtle gray wash */
    '.curr-btn:hover{background:rgba(0,0,0,.06)}',
    /* Active/open: same wash + arrow flipped */
    '.curr-btn.cp-open{background:rgba(0,0,0,.06)}',
    /* Focus: blue focus ring (keyboard nav / Active state ring per CMDS) */
    '.curr-btn:focus-visible{outline:2px solid #004FB0;outline-offset:1px}',
    /* Flag + code */
    '.curr-flag{font-size:15px;line-height:1;flex-shrink:0}',
    '.curr-code{font-size:14px;color:#262626}',
    /* Arrow icon */
    '.curr-btn .material-symbols-outlined{font-size:16px;',
    'color:#676767;flex-shrink:0;transition:transform .15s}',
    '.curr-btn.cp-open .material-symbols-outlined{transform:rotate(180deg)}',

    /* Dropdown container — 4px gap per CMDS spec */
    '.curr-dd{position:absolute;top:calc(100% + 4px);right:0;left:auto;',
    'background:#fff;border:1px solid #DCE3EC;',
    'border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);',
    'z-index:300;min-width:220px;width:max-content;',
    'overflow:hidden;overscroll-behavior:contain}',

    /* Dropdown items — full name + (CODE), no flag */
    '.curr-dd-item{display:flex;align-items:center;padding:9px 14px;width:100%;',
    'font-size:13px;border:none;background:none;cursor:pointer;',
    'font-family:inherit;color:#262626;text-align:left;',
    'transition:background .1s;line-height:1.4;white-space:nowrap}',
    '.curr-dd-item:hover{background:#F5F5F5}',
    /* Selected: gray bg per Figma, no color/weight change */
    '.curr-dd-item.cp-active{background:#F0F0F0}',
  ].join('');

  var style = document.createElement('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  /* ===== STATE ===== */
  var _activeTrigger = null;

  /* ===== INTERNAL ===== */
  function _close() {
    var dd = document.getElementById('_curr-dd');
    if (dd) dd.remove();
    if (_activeTrigger) {
      _activeTrigger.classList.remove('cp-open');
      _activeTrigger = null;
    }
  }

  function _open(triggerEl, currentCode, onChange) {
    _activeTrigger = triggerEl;
    triggerEl.classList.add('cp-open');

    /* Ensure parent is positioned */
    var wrap = triggerEl.parentElement;
    if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';

    var dd = document.createElement('div');
    dd.className = 'curr-dd';
    dd.id = '_curr-dd';
    dd.innerHTML = CURRENCIES.map(function (c) {
      var isActive = c.code === currentCode;
      return '<button class="curr-dd-item' + (isActive ? ' cp-active' : '') + '">' +
        c.name + ' (' + c.code + ')' +
        '</button>';
    }).join('');

    dd.querySelectorAll('.curr-dd-item').forEach(function (btn, i) {
      btn.addEventListener('click', function () {
        _close();
        onChange(CURRENCIES[i].code);
      });
    });

    wrap.appendChild(dd);

    /* Outside click to close */
    setTimeout(function () {
      document.addEventListener('click', function _outsideClose(e) {
        if (!dd.contains(e.target) && e.target !== triggerEl) {
          _close();
          document.removeEventListener('click', _outsideClose, true);
        }
      }, true);
    }, 0);
  }

  /* ===== PUBLIC API ===== */
  window.CurrencyPicker = {
    CURRENCIES: CURRENCIES,

    /**
     * Toggle dropdown open / close.
     * @param {Element}  triggerEl   — the .curr-btn element
     * @param {string}   currentCode — e.g. 'USD'
     * @param {Function} onChange    — called with new code when user picks
     */
    open: function (triggerEl, currentCode, onChange) {
      if (_activeTrigger === triggerEl) {
        _close();
      } else {
        _close();
        _open(triggerEl, currentCode, onChange);
      }
    },

    close: _close,
  };
})();

</script>
<script>
/* === Inlined: shared/focus-treemap.js === */
/*!
 * focus-treemap.js — Lumiture Shared FOCUS Cost Treemap + Top10 Ranking
 *
 * 用途：把 cost-by-FOCUS-framework 區塊（左 Treemap + 右 Top10 表）
 * 抽成共用模組，給 Executive Insights / Cost Dashboard / 未來 prototype 共用。
 *
 * Source of truth:
 *   - 對齊 FE: src/features/CostByFOCUS/CostByFOCUSTreeMap.tsx + Top10CostByFOCUSTable.tsx
 *   - 設計：Figma Main Feature node 4103-40564 / 3873-84509（PM 註解規則）
 *
 * 規則（per PM 註解 2026-05-21）：
 *   - 顯示「所有」FOCUS 分類（202512 官方文件約 19+ 項）；花費為 0 不顯示
 *   - 不做 Top 9 + Others 收尾（如要顯示 Others 桶，由 caller 自行傳入）
 *   - 顏色順序按 ranking：rank 1→#2、rank 2→#4、rank 3→#6、rank 4→#10、
 *     rank 5→#9、rank 6→#8、rank 7→#7、rank 8→#5、rank 9→#3、rank 10→#1
 *     （CMDS Color Kit Main palette；參考 FE rankingColor array）
 *   - Treemap label 顯示「服務名 + 花費」，面積過小自動隱藏（ECharts 預設行為）
 *   - 底部 index / 下層 drill-down 暫不顯示（PM 指示）
 *   - Top10 排行榜 width 固定 452px；圖表 fill 剩餘 width
 *   - 雙方都需延展時 chart : ranking = 6 : 4（由 caller layout 控制 max-width）
 *
 * Usage:
 *   <div class="lt-focus-section">
 *     <div id="my-focus-treemap" class="lt-focus-treemap"></div>
 *     <div id="my-focus-table" class="lt-focus-table"></div>
 *   </div>
 *
 *   <script src="../shared/focus-treemap.js"><\/script>
 *   <script>
 *     LumitureFocusTreemap.render({
 *       treemapEl: '#my-focus-treemap',
 *       tableEl:   '#my-focus-table',
 *       data: [
 *         { name:'Compute',    spending:186400, share:0.346, changeRatio: 0.12 },
 *         { name:'Storage',    spending:94200,  share:0.175, changeRatio:-0.04 },
 *         // ... 19+ entries
 *       ],
 *       currency: 'USD',
 *       currencySymbol: '$',
 *       tableLimit: 10,        // optional — 表格只列前 N 名（treemap 仍畫全部）
 *       tableSymbol: '',       // optional — 表格金額前綴（預設同 currencySymbol）
 *       showChange: true,      // optional — 表格多一欄 Change（Overview 用；對齊 FE Top10CostByFOCUSTable）
 *       noCompareTip: '...',   // optional — Change 為 -- 時的 hover 文案（走 host page 的 [data-tip] tooltip）
 *     });
 *   <\/script>
 *
 *   同一組 el 重複呼叫 render() 會先 dispose 舊的 ECharts instance（切換幣別 / 期間重繪用）。
 *
 * Data schema (per entry):
 *   { name, spending, share?, changeRatio? }
 *   - name        : FOCUS service category name
 *   - spending    : number (in selected currency)
 *   - share       : 0~1 (proportion of total) — 用於 Top10 表格 Share 欄
 *   - changeRatio : -1~+inf — 用於 Top10 表格 Change 欄（+ red / − green）
 *   - 不傳 share / changeRatio → 表格欄顯示 '--'
 */
(function () {
  'use strict';

  // ===== CMDS Color Kit Main — ranking 1..10 color order =====
  // 對齊 FE rankingColor array (CostByFOCUSTreeMap.tsx)
  var RANK_COLORS = [
    '#9ED7FF', // rank 1 → CMDS #2 Sky Blue 30
    '#00DCC2', // rank 2 → CMDS #4 Green 60
    '#F3BE68', // rank 3 → CMDS #6 Tangerine Orange 40
    '#C096FF', // rank 4 → CMDS #10 Purple 40
    '#FE89C1', // rank 5 → CMDS #9 Fuchsia 30
    '#FFA4A9', // rank 6 → CMDS #8 Red 30
    '#F4B581', // rank 7 → CMDS #7 Lantern Orange 50
    '#94F29D', // rank 8 → CMDS #5 Emerald Green 40
    '#9CF3FF', // rank 9 → CMDS #3 Turquoise Blue 40
    '#7A8BA9', // rank 10 → CMDS #1 Navy Blue 50
  ];
  // Rank 11+ 按 RANK_COLORS 順序循環使用（不灰色 fallback）
  function getRankColor(rank) {
    if (rank < 1) return RANK_COLORS[0];
    var idx = (rank - 1) % RANK_COLORS.length;
    return RANK_COLORS[idx];
  }

  // ===== CSS injection =====
  var CSS = [
    /* Section wrapper: chart left + table right 452px fixed */
    '.lt-focus-section{display:grid;grid-template-columns:1fr 452px;gap:24px;align-items:stretch}',
    '.lt-focus-treemap{height:388px;background:#fff;border-radius:8px;overflow:hidden;position:relative;min-width:0}',
    /* table-wrap 改 scrollable，table 內維持標準 layout 讓 border-spacing 正常運作 */
    '.lt-focus-table-wrap{height:388px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;min-width:0;scrollbar-width:thin}',
    '.lt-focus-table-wrap::-webkit-scrollbar{width:6px}',
    '.lt-focus-table-wrap::-webkit-scrollbar-thumb{background:#CCCCCC;border-radius:3px}',
    '.lt-focus-table-wrap::-webkit-scrollbar-track{background:transparent}',
    /* Table — design spec 規範：row 25px 高 + 8px 間隔（per Kabin 2026-05-22）
       使用標準 table layout + border-spacing：8px（同 Top10）
       Scroll 由 wrap container 負責；thead 用 position:sticky 維持頂部固定 */
    '.lt-focus-table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:12px;table-layout:fixed}',

  function _injectCSS() {
    if (document.getElementById('lt-focus-treemap-css')) return;
    var s = document.createElement('style');
    s.id = 'lt-focus-treemap-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  // Number abbreviation: 1234567 → "1.23M"; 12345 → "12.3K"; <1000 → "1234.56"
  function nFormat(n, fixed) {
    if (n === null || n === undefined || isNaN(n)) return '--';
    var abs = Math.abs(n);
    var sign = n < 0 ? '-' : '';
    var d = fixed === undefined ? 2 : fixed;
    if (abs >= 1e12) return sign + (abs / 1e12).toFixed(d) + 'T';
    if (abs >= 1e9)  return sign + (abs / 1e9 ).toFixed(d) + 'B';
    if (abs >= 1e6)  return sign + (abs / 1e6 ).toFixed(d) + 'M';
    if (abs >= 1e3)  return sign + (abs / 1e3 ).toFixed(d) + 'K';
    return sign + abs.toFixed(d);
  }

  function _resolveEl(elOrSelector) {
    if (typeof elOrSelector === 'string') return document.querySelector(elOrSelector);
    return elOrSelector;
  }

  // ===== Treemap render =====
  function _renderTreemap(el, data, opts) {
    if (typeof echarts === 'undefined') {
      console.error('[focus-treemap] ECharts not loaded — please include https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js');
      el.classList.add('empty');
      el.textContent = 'ECharts not loaded';
      return null;
    }

    // Exclude zero-cost entries (per PM rule)
    var nonZero = data.filter(function (d) { return d.spending > 0; });
    // Sort by spending descending to derive ranking
    nonZero.sort(function (a, b) { return b.spending - a.spending; });

    if (!nonZero.length) {
      el.classList.add('empty');
      el.textContent = opts.emptyText || 'No FOCUS cost data available';
      return null;
    }

    el.classList.remove('empty');

    var formattedData = nonZero.map(function (d, i) {
      var rank = i + 1;
      return {
        name: d.name,
        value: d.spending,
        _rank: rank,
        _share: d.share,
        itemStyle: { color: getRankColor(rank) },
      };
    });

    var chart = echarts.init(el);
    var symbol = opts.currencySymbol || '$';
    var currencyCode = opts.currency || '';

    chart.setOption({
      tooltip: {
        show: true,
        trigger: 'item',
        confine: true,
        borderWidth: 0,
        backgroundColor: '#FFFFFF',
        textStyle: { color: '#262626', fontSize: 12 },
        extraCssText: 'border-radius:6px;padding:10px 12px;max-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.12)',
        formatter: function (p) {
          var d = p.data;
          var share = (d._share != null) ? (d._share * 100).toFixed(2) + '%' : '--';
          return '<div class="lt-focus-tooltip">' +
                 '<div class="lt-focus-tooltip-name" style="color:#262626;font-weight:700;font-size:13px;margin-bottom:6px">' + _esc(d.name) + '</div>' +
                 '<div style="color:#676767;line-height:1.6">Spending: <strong style="color:#0B6DD7">' + symbol + nFormat(d.value) + ' ' + _esc(currencyCode) + '</strong></div>' +
                 '<div style="color:#676767;line-height:1.6">Share: <strong style="color:#262626">' + share + '</strong></div>' +
                 '<div style="color:#676767;line-height:1.6">Rank: <strong style="color:#262626">Top ' + d._rank + '</strong></div>' +
                 '</div>';
        },
      },
      series: [{
        type: 'treemap',
        data: formattedData,
        roam: false,
        nodeClick: false,
        breadcrumb: { show: false },          // 底部 index 不顯示
        top: 0, left: 0, right: 0, bottom: 0,
        width: '100%', height: '100%',
        itemStyle: { gapWidth: 4, borderRadius: 4, borderColor: '#fff', borderWidth: 0 },
        label: {
          show: true,
          position: 'inside',
          align: 'center',
          verticalAlign: 'middle',
          fontSize: 12, fontWeight: 700,
          color: '#FFFFFF',
          lineHeight: 18,
          // 面積過小 ECharts 預設會自動隱藏 label（min font size constraint）
          formatter: function (p) {
            return p.name + '\n' + symbol + nFormat(p.value);
          },
        },
        // 不做 drill-down upper label
        upperLabel: { show: false },
        levels: [{
          itemStyle: { borderColor: '#FFFFFF', borderWidth: 2, gapWidth: 2 },
        }],
      }],
    });
    return chart;
  }

  // ===== Top10 Table render =====
  function _renderTable(el, data, opts) {
    var nonZero = data.filter(function (d) { return d.spending > 0; });
    nonZero.sort(function (a, b) { return b.spending - a.spending; });
    // Default: show all (not just top 10). caller can pass limit
    var rows = opts.limit ? nonZero.slice(0, opts.limit) : nonZero;

    // 表格金額前綴預設跟 treemap 一樣；FE 的 Top10 表格其實不帶幣別前綴（幣別寫在卡片 `Cost (USD)`），
    // caller 可傳 tableSymbol:'' 對齊 FE，順便避免 `USD 31.24K` 在 80px 欄裡折行
    var symbol = (opts.tableSymbol !== undefined && opts.tableSymbol !== null) ? opts.tableSymbol : (opts.currencySymbol || '$');

    if (!rows.length) {
      el.innerHTML = '<div style="padding:24px;text-align:center;color:#B3B3B3;font-size:12px">No data</div>';
      return;
    }

    var showChange = !!opts.showChange;
    var noCompareTip = opts.noCompareTip || 'There is not enough data to compare to the previous period.';

    var thead =
      '<thead><tr>' +
        '<th class="col-rank">Rank</th>' +
        '<th class="col-name">Service Category</th>' +
        '<th class="col-spend tx-right">Spending</th>' +
        '<th class="col-share tx-right">Share</th>' +
        (showChange ? '<th class="col-change tx-right">Change</th>' : '') +
      '</tr></thead>';

    // Change 欄：對齊 FE Top10CostByFOCUSTable — 0 / null 都顯示 '--'（FE 用 !value 判斷）並帶 tooltip
    function changeCell(d) {
      var v = d.changeRatio;
      if (!v) return '<td class="col-change tx-right"><span class="lt-focus-nocmp" data-tip="' + _esc(noCompareTip) + '">--</span></td>';
      var cls = v > 0 ? ' is-up' : ' is-down';
      var txt = (v > 0 ? '+' : '-') + nFormat(Math.abs(v) * 100) + '%';
      return '<td class="col-change tx-right' + cls + '">' + _esc(txt) + '</td>';
    }

    var tbody = '<tbody>' + rows.map(function (d, i) {
      var rank = i + 1;
      var rankStr = 'Top ' + String(rank).padStart(2, '0');
      var spending = symbol + nFormat(d.spending);
      var share = (d.share != null) ? (d.share * 100).toFixed(2) + '%' : '--';
      return '<tr>' +
               '<td class="col-rank">' + _esc(rankStr) + '</td>' +
               '<td class="col-name" title="' + _esc(d.name) + '">' + _esc(d.name) + '</td>' +
               '<td class="col-spend tx-right">' + _esc(spending) + '</td>' +
               '<td class="col-share tx-right">' + _esc(share) + '</td>' +
               (showChange ? changeCell(d) : '') +
             '</tr>';
    }).join('') + '</tbody>';

    el.innerHTML = '<table class="lt-focus-table">' + thead + tbody + '</table>';
  }

  // ===== Public API =====
  var _instances = [];

  function render(config) {
    _injectCSS();
    var tEl = _resolveEl(config.treemapEl);
    var bEl = _resolveEl(config.tableEl);
    if (!tEl) { console.warn('[focus-treemap] treemapEl not found'); return null; }
    if (!bEl) { console.warn('[focus-treemap] tableEl not found'); return null; }

    // 同一個 el 重繪：先清掉舊 instance（避免 echarts.init 警告 + resizeAll 打到已 dispose 的 chart）
    _instances = _instances.filter(function (i) {
      if (i.treemapEl !== tEl) return true;
      if (i.chart) i.chart.dispose();
      return false;
    });
    if (typeof echarts !== 'undefined') {
      var prev = echarts.getInstanceByDom(tEl);
      if (prev) prev.dispose();
    }

    var chart = _renderTreemap(tEl, config.data || [], {
      currency: config.currency,
      currencySymbol: config.currencySymbol,
      emptyText: config.emptyText,
    });

    _renderTable(bEl, config.data || [], {
      currency: config.currency,
      currencySymbol: config.currencySymbol,
      limit: config.tableLimit, // optional — default show all
      tableSymbol: config.tableSymbol,     // optional — 表格金額前綴（預設同 currencySymbol；Overview 傳 '' 對齊 FE）
      showChange: config.showChange,       // optional — 多一欄 Change（Overview 用；EI 預設不開，畫面不變）
      noCompareTip: config.noCompareTip,   // optional — Change 為 -- 時的 tooltip 文案
    });

    var instance = { chart: chart, treemapEl: tEl, tableEl: bEl, config: config };
    _instances.push(instance);
    return instance;
  }

  function resizeAll() {
    _instances.forEach(function (i) { if (i.chart) i.chart.resize(); });
  }

  window.addEventListener('resize', resizeAll);

  window.LumitureFocusTreemap = {
    render: render,
    resizeAll: resizeAll,
    RANK_COLORS: RANK_COLORS,
    getRankColor: getRankColor,
  };
})();

function fmtNum(n, fixed = 2) {
  return Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: fixed, maximumFractionDigits: fixed });
}
/* Guideline 數字縮寫規則：十萬以上才縮寫、一律兩位小數、未達門檻顯示千分位 */
function abbr(n, fixed = 2, prefix = '') {
  if (n === null || n === undefined || !isFinite(n)) return '--';
  const sign = n < 0 ? '-' : '';
  const a = Math.abs(n);
  if (a < 100000) return sign + prefix + fmtNum(a, fixed);
  const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  const u = units.find(([v]) => a >= v);
  return sign + prefix + fmtNum(a / u[0], fixed) + u[1];
}
/* 圖表軸標籤：FE getChartYAxisLabel(value, 0) — 千以上就縮寫、整數 */
function axisLabel(v) {
  if (!v) return '0';
  const a = Math.abs(v);
  if (a < 1000) return String(Math.round(v));
  const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  const u = units.find(([x]) => a >= x);
  const val = a / u[0];
  return (v < 0 ? '-' : '') + (val % 1 === 0 ? val : val.toFixed(2)) + u[1];
}

  const mins = times.map(t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; });
  let prev = null, next = null;
  mins.forEach((m, i) => { if (m <= nowMin) prev = times[i]; if (next === null && m > nowMin) next = times[i]; });
  return { prev: prev || times[times.length - 1], next: next || times[0] };
}

/* ---- Derived data（照 FE 的計算邏輯） ---- */
function variant() { return DATA_VARIANTS[state.data] || DATA_VARIANTS.normal; }
/* actualToForecastIndex：當年 = 當月 idx + 1（當月算 actual）；非當年 = 12 */
function actualToForecastIndex() { return isCurrentYear() ? CUR_MONTH_IDX + 1 : 12; }
function yearlyCostUSD() {
  const scale = isCurrentYear() ? 1 : (state.period.year === CUR_YEAR - 1 ? 0.86 : 0.74);
  return MONTHLY_USD.map(v => v * scale);
}
function overviewOrg() {
  const v = variant();
  const y = yearlyCostUSD();
  const a2f = actualToForecastIndex();
  const actualMonths = y.slice(0, a2f);
  const curIdx = isCurrentYear() ? CUR_MONTH_IDX : 11;
  const currentMonth = y[curIdx];
  const lastMonth = curIdx > 0 ? y[curIdx - 1] : y[11] * 0.9;
  const avg = actualMonths.reduce((s, x) => s + x, 0) / actualMonths.length;
  const ytd = actualMonths.reduce((s, x) => s + x, 0);
  const cmp = (r) => v.compare ? r : null;
  return {
    totalCost: { budget: v.budget, yearly: y, a2f },
    threshold: { warning: v.warning, alert: v.alert },
    currentMonth: { cost: currentMonth, comparisonRate: cmp(currentMonth / lastMonth - 1) },
    lastMonth:    { cost: lastMonth,    comparisonRate: cmp(0.092) },
    monthlyAvg:   { cost: avg,          comparisonRate: cmp(0.041) },
    currentYear:  { cost: ytd,          comparisonRate: cmp(isCurrentYear() ? 0.127 : 0) },
  };
}
function groupsForFreq() {
  if (state.freq === 'month') return GROUPS_MONTH;
  const k = CUR_MONTH_IDX + 1;
  return GROUPS_MONTH.map((g, i) => ({
    groupName: g.groupName,
    gcpCost: g.gcpCost === null ? null : g.gcpCost * k * YEAR_JITTER[i],
    awsCost: g.awsCost === null ? null : g.awsCost * k * YEAR_JITTER[i],
    azureCost: g.azureCost === null ? null : g.azureCost * k * YEAR_JITTER[i],
    budget: g.budget === null ? null : g.budget * 12,
  }));
}
function focusForFreq() {
  if (state.freq === 'month') return FOCUS_MONTH;
  const k = CUR_MONTH_IDX + 1;
  return FOCUS_MONTH.map((d, i) => ({ ...d, spending: d.spending * k * (1 + (i % 3) * 0.03) }));
}

/* FE getCostStatusConfig：percentage = cost / budget；≥alert → error.dark、≥warning → warning.dark */
function costStatus(cost, budget, th) {
  const p = (!cost || !budget) ? 0 : cost / budget;
  if (p >= th.alert) return { cls: 'alert', threshold: th.alert };
  if (p >= th.warning) return { cls: 'warn', threshold: th.warning };
  return { cls: '', threshold: null };
}

/* ---- Top 10 chart：三雲堆疊 cost + Total Budget 並排；依總花費排序（FE generateSortedSeries） ---- */
function mountTop10Chart() {
  const el = document.getElementById('top10-chart');
  if (!el) return;
  const groups = groupsForFreq();
  const totals = groups.map((g, i) => ({ i, sum: (g.gcpCost || 0) + (g.awsCost || 0) + (g.azureCost || 0) }));
  totals.sort((a, b) => b.sum - a.sum);
  const sorted = totals.map(t => groups[t.i]);
  const names = sorted.map(g => g.groupName);
  const series = [];
  ['gcp', 'aws', 'azure'].forEach(k => {
    const costs = sorted.map(g => g[`${k}Cost`]);
    if (!costs.some(v => typeof v === 'number')) return;
    series.push({ name: PLATFORM[k].label, type: 'bar', stack: 'cost', itemStyle: { color: PLATFORM[k].color },
      data: sorted.map(g => ({ value: cx(g[`${k}Cost`] ?? 0), isOverrun: typeof g.budget === 'number' && ((g.gcpCost || 0) + (g.awsCost || 0) + (g.azureCost || 0)) > g.budget })) });
  });
  if (sorted.some(g => typeof g.budget === 'number')) {
    series.push({ name: 'Total Budget', type: 'bar', stack: 'budget', itemStyle: { color: CHART.totalBudget }, data: sorted.map(g => cx(g.budget)) });
  }
  charts.top10 = echarts.init(el);
  charts.top10.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: CHART.shadow } }, borderWidth: 0, backgroundColor: 'transparent', padding: 0, extraCssText: 'box-shadow:none',
      formatter: (params) => {
        const clouds = params.filter(p => p.seriesName !== 'Total Budget');

        const totalCost = clouds.reduce((s, p) => s + (typeof p.value === 'number' ? p.value : (p.data && p.data.value) || 0), 0);
        const rows = clouds.map(p => {
          const over = p.data && p.data.isOverrun;
          return { html: `<span style="display:inline-block;width:8px;height:8px;margin-right:4px;background:${p.color}"></span>${p.seriesName}`, value: cur().symbol + fmtNum(p.data.value, 2), valueStyle: over ? `color:${CHART.alert.main}` : '' };
        });
        let footer;
        if (total && typeof total.value === 'number' && total.value) {
          const left = total.value - totalCost;
          footer = `<div style="height:1px;background:#E6E6E6;margin:8px 0"></div>
            <div style="display:flex;align-items:center;gap:4px;height:24px"><span style="display:inline-block;width:8px;height:8px;margin-right:4px;background:${total.color}"></span><span style="flex:1">Total Budget</span><strong>${cur().symbol + fmtNum(total.value, 2)}</strong></div>
