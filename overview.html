/* ---- Cost by Cloud：cost 蓋在 budget 上（barGap -100%）、超出部分疊紅 + 警示 markPoint ---- */
function mountByCloudChart() {
  const el = document.getElementById('bycloud-chart');
  if (!el) return;
  const src = BY_CLOUD[state.freq];
  const clouds = Object.keys(src);
  const cost = clouds.map(k => ({ value: cx(src[k].cost), itemStyle: { color: PLATFORM[k].color } }));
  const budget = clouds.map(k => ({ value: cx(src[k].budget), itemStyle: { color: PLATFORM[k].budget.color, borderColor: PLATFORM[k].budget.border, borderWidth: 1, borderType: 'dashed' } }));
  const overrun = clouds.map(k => { const d = src[k]; const diff = (typeof d.cost === 'number' && typeof d.budget === 'number') ? d.cost - d.budget : null; return { value: diff !== null && diff > 0 ? cx(diff) : null, itemStyle: { color: CHART.alert.main } }; });
  const values = clouds.flatMap(k => { const d = src[k]; const arr = [cx(d.cost), cx(d.budget)]; if (d.cost > d.budget) arr.push(cx(d.cost + d.cost - d.budget)); return arr; });
  const maxValue = Math.max(...values.map(Math.abs), 0);
  let maxOverrun = 0, maxIdx = -1;
  overrun.forEach((o, i) => { if (o.value !== null && o.value > maxOverrun) { maxOverrun = o.value; maxIdx = i; } });
  charts.byCloud = echarts.init(el);
  charts.byCloud.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: CHART.shadow } }, borderWidth: 0, backgroundColor: 'transparent', padding: 0, extraCssText: 'box-shadow:none',
      formatter: (params) => {
        const i = params[0].dataIndex, k = clouds[i], d = src[k];
        const sw = (bg, border) => `display:inline-block;width:8px;height:8px;margin-right:4px;background:${bg};${border ? `border:1px dashed ${border}` : ''}`;
        const rows = [
          { html: `<span style="${sw(PLATFORM[k].color)}"></span>Actual Cost`, value: money(d.cost) },
          { html: `<span style="${sw(PLATFORM[k].budget.color, PLATFORM[k].budget.border)}"></span>Remaining Budget`, value: money(d.budget) },
        ];
        const diff = d.cost - d.budget;
        if (diff > 0) rows.push({ html: `<span style="${sw(CHART.alert.main)}"></span>Budget Overrun`, value: money(diff), valueStyle: `color:${CHART.alert.main}` });
        return chartTip(PLATFORM[k].abbr, rows);
      } },
    legend: { show: false },
    grid: { left: 20, right: 0, bottom: 0, top: 20, containLabel: true },
    xAxis: { type: 'category', boundaryGap: true, data: clouds.map(k => PLATFORM[k].abbr), axisTick: { show: false },
             axisLabel: { interval: 0, color: CHART.axisText, width: 80, overflow: 'truncate', fontFamily: 'Noto Sans' }, axisLine: { lineStyle: { color: CHART.axisLine } } },
    yAxis: { type: 'value', max: maxValue ? maxValue * 1.1 : undefined, interval: maxValue ? (maxValue * 1.1) / 2 : undefined,
             axisLabel: { color: CHART.axisText, fontFamily: 'Noto Sans', formatter: (v) => axisLabel(v) }, splitLine: { lineStyle: { type: 'dashed', color: CHART.splitLine } } },
    barWidth: 16,
    series: [
      { name: 'cost',   type: 'bar', stack: 'cost',   barGap: '-100%', z: 2, data: cost },
      { name: 'budget', type: 'bar', stack: 'budget', barWidth: 16, z: 1, data: budget },
      { name: 'overrun', type: 'bar', stack: 'budget', itemStyle: { color: CHART.alert.main }, data: maxIdx > -1 ? overrun : [],
        markPoint: { label: { show: false }, symbolSize: 16, symbolOffset: [0, -12],
          symbol: 'path://M14.26 12.13a1.1 1.1 0 0 1-.4 1.5c-.16.09-.34.14-.53.14H2.67a1.05 1.05 0 0 1-.93-.55 1.11 1.11 0 0 1 0-1.09l5.34-9.45A1.08 1.08 0 0 1 8 2.13a1.05 1.05 0 0 1 .92.55l5.34 9.45ZM8 10.18a1 1 0 0 0-.57.17A1.04 1.04 0 0 0 7 11.43c.04.2.13.39.28.53a1.01 1.01 0 0 0 1.11.23 1.06 1.06 0 0 0 0-1.93 1 1 0 0 0-.39-.08Zm-.97-3.76.16 3.1c0 .07.04.13.09.18.05.05.11.07.18.07h1.08c.07 0 .13-.02.18-.07a.28.28 0 0 0 .08-.18l.17-3.1a.28.28 0 0 0-.07-.2.27.27 0 0 0-.2-.09H7.3a.26.26 0 0 0-.2.1.27.27 0 0 0-.07.2Z',
          itemStyle: { color: CHART.alert.main },
          data: maxOverrun ? [{ name: 'Max', xAxis: maxIdx, yAxis: cx(src[clouds[maxIdx]].cost) }] : [] } },
    ],
  });
}

/* 資料參數改變 → 受影響區塊先 skeleton 再重繪（切進有資料畫面前故意跑 skeleton） */
function reloadSections(ids) {
  closeAllPopovers();

/* Month Picker（翻譯 @lumiture-ui MonthPicker：minDate = 兩年前 1 月、maxDate = 今天；Reset → 當月；shouldCloseOnSelect:false） */
let mpView = CUR_YEAR, mpDraft = { year: CUR_YEAR, month: CUR_MONTH_IDX + 1 };
function mpIsDisabled(y, m) { return y < MIN_YEAR || y > CUR_YEAR || (y === CUR_YEAR && m > CUR_MONTH_IDX + 1); }
function renderMonthPicker() {
  const pop = document.getElementById('mp-pop'); if (!pop) return;
  const cells = MONTH_LABELS.map((lbl, i) => {
    const m = i + 1, sel = mpDraft.year === mpView && mpDraft.month === m;
    return mpIsDisabled(mpView, m)
      ? `<button type="button" class="mp-cell disabled" disabled>${lbl.replace('.', '')}</button>`
      : `<button type="button" class="mp-cell${sel ? ' sel' : ''}" onclick="mpPick(${m}, event)">${lbl.replace('.', '')}</button>`;
  }).join('');
  pop.innerHTML = `
    <div class="mp-pop-hdr">
      <button type="button" class="mp-pop-nav${mpView <= MIN_YEAR ? ' hidden' : ''}" onclick="mpStepYear(-1, event)" aria-label="Previous year"><span class="material-symbols-outlined">chevron_left</span></button>
      <div class="mp-pop-title">${mpView}</div>
      <button type="button" class="mp-pop-nav${mpView >= CUR_YEAR ? ' hidden' : ''}" onclick="mpStepYear(1, event)" aria-label="Next year"><span class="material-symbols-outlined">chevron_right</span></button>
    </div>
    <div class="mp-grid">${cells}</div>
    <div class="mp-pop-ftr">
      <button type="button" class="btn btn-b btn-sm" onclick="mpReset(event)"><span class="btn-text">Reset</span></button>
      <div class="mp-ftr-right">
        <button type="button" class="btn btn-o btn-sm" style="min-width:auto" onclick="closeMonthPicker()">Cancel</button>
        <button type="button" class="btn btn-p btn-sm" style="min-width:auto" onclick="mpApply()">Apply</button>
      </div>
    </div>`;
}
function toggleMonthPicker(e) {
  if (e) e.stopPropagation();
  const wrap = document.getElementById('mp-wrap'); if (!wrap) return;
  if (wrap.classList.contains('open')) { closeMonthPicker(); return; }
  mpView = state.period.year; mpDraft = { ...state.period };
  renderMonthPicker();
  wrap.classList.add('open');
  const t = document.getElementById('mp-trigger'); if (t) t.setAttribute('aria-expanded', 'true');
}
function closeMonthPicker() {
  const wrap = document.getElementById('mp-wrap'); if (wrap) wrap.classList.remove('open');
  const t = document.getElementById('mp-trigger'); if (t) t.setAttribute('aria-expanded', 'false');
}
function mpStepYear(d, e) { if (e) e.stopPropagation(); const ny = mpView + d; if (ny < MIN_YEAR || ny > CUR_YEAR) return; mpView = ny; renderMonthPicker(); }
function mpPick(m, e) { if (e) e.stopPropagation(); if (mpIsDisabled(mpView, m)) return; mpDraft = { year: mpView, month: m }; renderMonthPicker(); }
function mpReset(e) { if (e) e.stopPropagation(); mpDraft = { year: CUR_YEAR, month: CUR_MONTH_IDX + 1 }; mpView = CUR_YEAR; renderMonthPicker(); }
function mpApply() {
  const changed = mpDraft.year !== state.period.year || mpDraft.month !== state.period.month;
  state.period = { ...mpDraft };
  closeMonthPicker();
  const v = document.getElementById('mp-val'); if (v) v.textContent = monthLabel(state.period.year, state.period.month);
  /* FE：period 進 URL query → CostOverview / OptimizeCloudSpend / CostByFOCUS 三段都重抓 */
  if (changed) reloadSections(['sec-overview', 'sec-optimize', 'sec-focus']);
}

function toast(kind, msg) {

  const el = document.createElement('div');
  el.className = `toast ${kind === 'error' ? 'err' : kind === 'info' ? 'info' : ''}`;
  el.innerHTML = `<span class="material-symbols-outlined">${kind === 'error' ? 'error' : kind === 'info' ? 'info' : 'check_circle'}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, 4200);
}

    '100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,64,61,0)}}',

    /* Popover shell — 全站固定 390 × 480 */
    '.demo-popover{position:fixed;bottom:78px;left:18px;width:390px;height:480px;background:#fff;',
    'border:1px solid rgba(14,58,130,.18);border-radius:12px;box-shadow:0 8px 24px rgba(13,27,62,.16);',
    'z-index:998;padding:0;opacity:0;transform:translateY(8px);pointer-events:none;',
    'transition:opacity .18s,transform .18s;display:flex;flex-direction:column;overflow:hidden}',
    '.demo-popover.show{opacity:1;transform:translateY(0);pointer-events:auto}',
    '.demo-popover::before{content:\'\';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0;',
    'background:radial-gradient(circle at 78% 50%,#D9CC4A 0%,rgba(217,204,74,0) 32%),',
    'radial-gradient(circle at 30% 50%,#4D8DDB 0%,rgba(77,141,219,0) 42%),',
    'linear-gradient(90deg,#0D1B3E 0%,#0E3A82 100%)}',

    /* Popover header */
    '.demo-popover-hdr{display:flex;align-items:center;justify-content:space-between;',
    'padding:14px 16px 10px;flex-shrink:0}',
    '.demo-popover-title{font-size:12px;font-weight:700;color:#0E3A82;text-transform:uppercase;',
    'letter-spacing:.5px;display:flex;align-items:center;gap:6px}',
    '.demo-popover-close{color:#B0B7C0;cursor:pointer;padding:2px;border-radius:4px;',
    'display:flex;align-items:center;background:none;border:none}',
    '.demo-popover-close:hover{color:#0E3A82;background:rgba(14,58,130,.08)}',

    /* Reset link */
    '.demo-reset-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#676767;',
    'font-weight:500;background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:4px;',
    'font-family:inherit;margin:0 16px 6px}',
    '.demo-reset-link:hover{color:#004FB0;background:#F2FAFF}',
    '.demo-reset-link .material-symbols-outlined{font-size:14px}',

    /* Page tabs (Layer 1 — pill / segmented style，only when both layers exist) */
    '.demo-page-tabs{display:flex;gap:4px;padding:0 16px 8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}',
    '.demo-page-tabs::-webkit-scrollbar{display:none}',
    '.demo-page-tab{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;height:26px;',
    'background:#F2F2F2;color:#676767;border:none;border-radius:13px;font-size:11px;font-weight:600;',
    'font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}',
    '.demo-page-tab:hover{color:#262626;background:#E6E6E6}',
    '.demo-page-tab.active{background:#fff;color:#004FB0;box-shadow:inset 0 0 0 1px #004FB0}',
    '.demo-page-tab .material-symbols-outlined{font-size:13px}',

    /* Category tabs (Layer 2，or single-layer underline mode) */
    '.demo-cat-tabs{display:flex;border-bottom:2px solid #E6E6E6;padding:0 12px;flex-shrink:0;',
    'overflow-x:auto;scrollbar-width:none}',
    '.demo-cat-tabs::-webkit-scrollbar{display:none}',
    '.demo-cat-tab{display:inline-flex;align-items:center;gap:4px;padding:7px 10px;font-size:11px;',
    'font-weight:600;color:#676767;border:none;background:none;border-bottom:2px solid transparent;',
    'margin-bottom:-2px;cursor:pointer;letter-spacing:.3px;transition:all .15s;font-family:inherit;white-space:nowrap}',
    '.demo-cat-tab .material-symbols-outlined{font-size:14px}',
    '.demo-cat-tab:hover{color:#262626}',
    '.demo-cat-tab.active{color:#004FB0;border-bottom-color:#004FB0}',

    /* Hint block (淡藍底 + 左藍邊條) */
    '.demo-pane-hint{font-size:11px;color:#676767;line-height:1.5;margin:0 0 8px;',
    'padding:8px 10px;background:#F2FAFF;border-left:2px solid #004FB0;border-radius:4px}',

    /* Scroll area (flex 1, hidden scrollbar) */
    '.demo-popover-scroll{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;',
    'padding:8px 16px 14px;transition:opacity .12s ease;scrollbar-width:none}',
    '.demo-popover-scroll::-webkit-scrollbar{display:none}',

    /* Sub-separator (no data divider) */
    '.demo-sub-sep{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;',
    'color:#9CAEC4;letter-spacing:.4px;text-transform:uppercase;margin:10px 0 6px}',
    '.demo-sub-sep::before,.demo-sub-sep::after{content:\'\';flex:1;height:1px;background:rgba(14,58,130,.1)}',

    /* Button group */
    '.demo-buttons{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}',

    /* Scenario button */
    '.demo-btn{background:#fff;border:1px solid rgba(14,58,130,.25);color:#0E3A82;',
    'padding:8px 12px;border-radius:8px;font-size:12px;font-weight:500;',
    'display:flex;align-items:center;gap:6px;text-align:left;width:100%;',
    'transition:all .15s;position:relative;cursor:pointer;font-family:inherit}',
    '.demo-btn:hover{background:rgba(14,58,130,.05);border-color:rgba(14,58,130,.5)}',
    '.demo-btn.active{background:radial-gradient(circle at 88% 70%,#D9CC4A 0%,rgba(217,204,74,0) 42%),',
    'radial-gradient(circle at 22% 35%,#4D8DDB 0%,rgba(77,141,219,0) 50%),',
    'linear-gradient(135deg,#0D1B3E 0%,#0E3A82 100%);color:#fff;border-color:transparent;',
    'box-shadow:0 2px 6px rgba(13,27,62,.25)}',
    '.demo-btn .material-symbols-outlined{font-size:16px;flex-shrink:0}',

    /* Disabled button */
    '.demo-btn.demo-dis{opacity:.42;cursor:not-allowed}',
    '.demo-btn.demo-dis:hover{background:#fff!important;border-color:rgba(14,58,130,.25)!important}',
    '.demo-cs{margin-left:auto;font-size:9px;font-weight:700;color:#9CAEC4;',
    'background:rgba(14,58,130,.06);border-radius:3px;padding:1px 5px;letter-spacing:.3px;flex-shrink:0}',

    /* Empty state when no scenarios match current filters */
    '.demo-empty{padding:24px 8px;text-align:center;color:#9CAEC4;font-size:12px;line-height:1.5}',

    /* ⚠️ Suppress any global CSS [data-tip]::after on demo elements.
       Tooltips MUST be handled by #gl-tip (auto-injected below) — pseudo-tooltips
       get clipped by .demo-popover { overflow: hidden }. */
    '.demo-btn[data-tip]::after,.demo-btn[data-tip]::before,',
    '.demo-page-tab[data-tip]::after,.demo-cat-tab[data-tip]::after{display:none!important}',

    /* #gl-tip — body-level fixed tooltip (auto-injected) */
    '#gl-tip{position:fixed;background:#3C3C3C;color:#fff;font-size:12px;line-height:1.4;',
    'padding:6px 10px;border-radius:4px;max-width:320px;white-space:normal;',
    'pointer-events:none;z-index:9999;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25);',
    'font-family:\'Noto Sans\',sans-serif}'
  ].join('');

  var style = document.createElement('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  // ===== HELPERS =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  // Normalise scenario: tab → page (backwards compat)
  function _normalizedScenarios() {
    return (window.DEMO_SCENARIOS || []).map(function (s) {
      return Object.assign({}, s, { page: s.page || s.tab || null });
    });
  }

  // Detect rendering mode based on what's configured
  function _detectMode() {
    var scenarios = _normalizedScenarios();
    var hasPages = (window.DEMO_PAGES && window.DEMO_PAGES.length) ||
                   scenarios.some(function (s) { return !!s.page; });
    var hasCats  = (window.DEMO_CATEGORIES && window.DEMO_CATEGORIES.length) ||
                   scenarios.some(function (s) { return !!s.category; });
    if (hasPages && hasCats) return 'two-layer';
    if (hasPages) return 'pages-only';
    if (hasCats)  return 'categories-only';
    return 'flat';
  }

  // Auto-derive page list if DEMO_PAGES not provided
  function _getPages() {
    if (window.DEMO_PAGES && window.DEMO_PAGES.length) return window.DEMO_PAGES;
    var seen = {};
    var pages = [];
    _normalizedScenarios().forEach(function (s) {
      if (s.page && !seen[s.page]) {
        seen[s.page] = true;
        pages.push({ id: s.page, label: s.page.charAt(0).toUpperCase() + s.page.slice(1), icon: 'tab' });
      }
    });
    return pages;
  }

  function _getCategories() {
    return window.DEMO_CATEGORIES || [];
  }

  // Filter scenarios for current page + category
  function _filterScenarios() {
    var scenarios = _normalizedScenarios();
    return scenarios.filter(function (s) {
      if (_activePage && s.page && s.page !== _activePage) return false;
      if (_activePage && !s.page) return false; // page-tab mode requires scenario to have page
      if (_activeCategory && s.category && s.category !== _activeCategory) return false;
      if (_activeCategory && !s.category) return false; // cat-tab mode requires scenario to have category
      return true;
    });
  }

  // ===== HTML BUILDERS =====
  function _renderButtons(scenarios) {
    if (!scenarios.length) {
      return '<div class="demo-empty">No scenarios in this view.</div>';
    }
    var normal = scenarios.filter(function (s) { return !s.isNoData; });
    var noData = scenarios.filter(function (s) { return s.isNoData; });
    var html = _renderGroup(normal);
    if (noData.length) {
      html += '<div class="demo-sub-sep">no data</div>' + _renderGroup(noData);
    }
    return html;
  }

  function _renderGroup(scenarios) {
    if (!scenarios.length) return '';
    var btns = scenarios.map(function (s) {
      var dis = s.disabled ? ' demo-dis' : '';
      var act = s.id === _activeScenario ? ' active' : '';
      var tip = s.tip ? ' data-tip="' + _esc(s.tip) + '"' : '';
      var cs = s.disabled ? '<span class="demo-cs">Soon</span>' : '';
      return '<button class="demo-btn' + dis + act + '"' + tip +
             ' data-scenario="' + _esc(s.id) + '">' +
             '<span class="material-symbols-outlined">' + _esc(s.icon || 'play_arrow') + '</span>' +
             '<span>' + _esc(s.label) + '</span>' + cs + '</button>';
    }).join('');
    return '<div class="demo-buttons">' + btns + '</div>';
  }

  function _renderPageTabs(mode) {
    var pages = _getPages();
    if (!pages.length) return '';
    // 雙層模式：page tabs 用 pill style 放最上面
    // 單層 pages-only 模式：page tabs 用 underline style（跟 cat-tabs 一致），無第二層
    var isTwoLayer = mode === 'two-layer';
    var wrapClass = isTwoLayer ? 'demo-page-tabs' : 'demo-cat-tabs';
    var tabClass  = isTwoLayer ? 'demo-page-tab' : 'demo-cat-tab';
    return '<div class="' + wrapClass + '">' + pages.map(function (p) {
      var act = p.id === _activePage ? ' active' : '';
      return '<button class="' + tabClass + act + '" data-page="' + _esc(p.id) + '">' +
             (p.icon ? '<span class="material-symbols-outlined">' + _esc(p.icon) + '</span>' : '') +
             _esc(p.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderCategoryTabs() {
    var cats = _getCategories();
    if (!cats.length) return '';
    return '<div class="demo-cat-tabs">' + cats.map(function (c) {
      var act = c.id === _activeCategory ? ' active' : '';
      return '<button class="demo-cat-tab' + act + '" data-category="' + _esc(c.id) + '">' +
             (c.icon ? '<span class="material-symbols-outlined">' + _esc(c.icon) + '</span>' : '') +
             _esc(c.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderHint() {
    if (!_activeCategory) return '';
    var cat = _getCategories().find(function (c) { return c.id === _activeCategory; });
    if (!cat || !cat.hint) return '';
    return '<div class="demo-pane-hint">' + _esc(cat.hint) + '</div>';
  }

  function _renderScrollArea() {
    return _renderHint() + _renderButtons(_filterScenarios());
  }

  // ===== DOM MOUNTING =====
  function _render() {
    if (document.getElementById('demo-fab')) return;

    // Auto-detect first page & category
    var mode = _detectMode();
    var pages = _getPages();
    var cats = _getCategories();
    if (!_activePage && pages.length) _activePage = pages[0].id;
    if (!_activeCategory && cats.length) _activeCategory = cats[0].id;
    if (mode === 'flat') { _activePage = null; _activeCategory = null; }
    if (mode === 'pages-only') _activeCategory = null;
    if (mode === 'categories-only') _activePage = null;

    // FAB
    var fabEl = document.createElement('button');
    fabEl.className = 'demo-fab';
    fabEl.id = 'demo-fab';
    fabEl.title = 'Designer Demo Scenarios';
    fabEl.innerHTML =
      '<span class="material-symbols-outlined">science</span>' +
      '<span class="demo-pulse" id="demo-fab-pulse"></span>';
    fabEl.addEventListener('click', function () { window._demoFabToggle(); });

    // Popover
    var popEl = document.createElement('div');
    popEl.className = 'demo-popover';
    popEl.id = 'demo-popover';
    popEl.innerHTML =
      '<div class="demo-popover-hdr">' +
        '<div class="demo-popover-title">' +
          '<span class="material-symbols-outlined" style="font-size:16px">science</span>' +
          'Demo Scenarios' +
        '</div>' +
        '<button class="demo-popover-close" id="demo-pop-close">' +
          '<span class="material-symbols-outlined" style="font-size:18px">close</span>' +
        '</button>' +
      '</div>' +
      (window.DEMO_DEFAULT
        ? '<button class="demo-reset-link" id="demo-reset-link">' +
            '<span class="material-symbols-outlined">refresh</span>Reset to Default</button>'
        : '') +
      _renderPageTabs(mode) +
      _renderCategoryTabs() +
      '<div class="demo-popover-scroll" id="demo-popover-scroll">' +
        _renderScrollArea() +
      '</div>';

    document.body.appendChild(fabEl);
    document.body.appendChild(popEl);

    // === Event wiring ===
    document.getElementById('demo-pop-close').addEventListener('click', function () {
      window._demoFabToggle();
    });

    // Reset link
    var resetLink = document.getElementById('demo-reset-link');
    if (resetLink && window.DEMO_DEFAULT) {
      resetLink.addEventListener('click', function () {
        window._demoFabApply(window.DEMO_DEFAULT, null);
      });
    }

    // Page tabs
    popEl.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        window._demoFabSetPage(t.dataset.page);
      });
    });

    // Category tabs (also handles page tabs in pages-only mode, where they use demo-cat-tab class)
    popEl.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        if (t.dataset.page) {
          window._demoFabSetPage(t.dataset.page);
        } else {
          window._demoFabSetCategory(t.dataset.category);
        }
      });
    });

    // Scenario button clicks (event delegation on scroll area)
    document.getElementById('demo-popover-scroll').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-scenario]');
      if (!btn || btn.classList.contains('demo-dis')) return;
      window._demoFabApply(btn.dataset.scenario, btn);
    });

    // Outside click to close
    document.addEventListener('click', function (e) {
      var pop = document.getElementById('demo-popover');
      var fab = document.getElementById('demo-fab');
      if (!pop || !fab) return;
      if (!pop.contains(e.target) && !fab.contains(e.target) && pop.classList.contains('show')) {
        pop.classList.remove('show');
        fab.classList.remove('popped');
      }
    });

    _injectGlobalTooltip();
  }

  // ===== #gl-tip auto-injection =====
  function _injectGlobalTooltip() {
    if (document.getElementById('gl-tip')) return; // host page already provides one
    var tip = document.createElement('div');
    tip.id = 'gl-tip';
    document.body.appendChild(tip);
    var cur = null;
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest('[data-tip]');
      if (!el || el === cur) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block';
    });
    document.addEventListener('mousemove', function (e) {
      if (!cur) return;
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var x = e.clientX - tw / 2, y = e.clientY - th - 10;
      if (x < 8) x = 8;
      if (x + tw > window.innerWidth - 8) x = window.innerWidth - tw - 8;
      if (y < 8) y = e.clientY + 16;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest('[data-tip]');
      if (el && el === cur) { cur = null; tip.style.display = 'none'; }
    });
  }

  // ===== PUBLIC API =====
  function _refreshScrollArea() {
    var scroll = document.getElementById('demo-popover-scroll');
    if (!scroll) return;
    scroll.style.opacity = '0';
    setTimeout(function () {
      scroll.innerHTML = _renderScrollArea();
      scroll.style.opacity = '1';
    }, 120);
  }

  function _refreshTabs() {
    var pop = document.getElementById('demo-popover');
    if (!pop) return;
    pop.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === _activePage);
    });
    pop.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      // In pages-only mode, cat-tab elements carry data-page (not data-category)
      if (t.dataset.page) {
        t.classList.toggle('active', t.dataset.page === _activePage);
      } else {
        t.classList.toggle('active', t.dataset.category === _activeCategory);
      }
    });
  }

  /** Toggle popover open/close */
  window._demoFabToggle = function () {
    var pop = document.getElementById('demo-popover');
    var fab = document.getElementById('demo-fab');
    var pulse = document.getElementById('demo-fab-pulse');
    var opening = !pop.classList.contains('show');
    pop.classList.toggle('show');
    fab.classList.toggle('popped');
    if (opening && pulse) pulse.style.display = 'none';
  };

  /** Set active page tab (internal + external) */
  window._demoFabSetPage = function (pageId) {
    if (_activePage === pageId) return;
    _activePage = pageId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /** Set active category tab */
  window._demoFabSetCategory = function (catId) {
    if (_activeCategory === catId) return;
    _activeCategory = catId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /**
   * Called from prototype's navigation function to auto-switch the page tab.
   * Only switches if the popover doesn't need to stay on current tab.
   */
  window.demoFabSwitchTab = function (pageId) {
    window._demoFabSetPage(pageId);
  };

  /** Apply a scenario — called via event delegation or by host */
  window._demoFabApply = function (id, btn) {
    _activeScenario = id;
    document.querySelectorAll('.demo-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    if (btn) {
      btn.classList.add('active');
    } else {
      // No btn provided (e.g. Reset link) — find scenario in DOM
      var found = document.querySelector('[data-scenario="' + id + '"]');
      if (found) found.classList.add('active');
    }
    if (typeof window.DEMO_APPLY === 'function') {
      window.DEMO_APPLY(id, btn);
    }
  };

  // ===== INIT =====
  function _init() {
    if (_activeScenario === null && window.DEMO_DEFAULT) {
      _activeScenario = window.DEMO_DEFAULT;
    }
    _render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>
