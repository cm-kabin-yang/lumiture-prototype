  // ===== #gl-tip auto-injection =====
  function _injectGlobalTooltip() {
    if (document.getElementById('gl-tip')) return; // host page already provides one
    var tip = document.createElement('div');
    tip.id = 'gl-tip';
    document.body.appendChild(tip);
    var cur = null;
    // 2026-10-09 Kabin 裁決：全站 tooltip 改成錨在元件上（Figma／MUI 行為），不再跟著游標跑。
    // 規則照 Anomaly Detection #01-3 量到的：預設出現在元件上方 6px、水平靠元件左緣，
    // 右邊放不下就改靠元件右緣 +2；上方放不下改到下方。
    // 可選屬性：data-tip-pos="below"（固定放下方）、data-tip-dy（下方距離，預設 4）、
    // data-tip-anchor（CSS 選擇器，錨在子元素上）、data-tip-align="content-right"（右緣對齊內容右緣 −16）。
    function place() {
      if (!cur || !cur.isConnected) { cur = null; tip.style.display = 'none'; return; }
      var a = (cur.dataset.tipAnchor && cur.querySelector(cur.dataset.tipAnchor)) || cur;
      var r = a.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
      var vw = window.innerWidth, vh = window.innerHeight;
      var x = r.left;
      if (x + tw > vw - 8) x = Math.max(8, Math.min(r.right + 2, vw - 8) - tw);
      if (cur.dataset.tipAlign === 'content-right') x = Math.max(8, r.right - 16 - tw);
      var below = cur.dataset.tipPos === 'below';
      var dy = cur.dataset.tipDy != null ? +cur.dataset.tipDy : 4;
      var y = below ? r.bottom + dy : r.top - th - 6;
      if (y < 8) y = r.bottom + 4;
      if (y + th > vh - 8) y = Math.max(8, r.top - th - 6);
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (!el || (el === cur && tip.style.display !== 'none')) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block'; place();
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (el && el === cur && !el.contains(e.relatedTarget)) { cur = null; tip.style.display = 'none'; }
    });
    window.addEventListener('scroll', place, true);
    window.addEventListener('resize', place);
  }

  // ===== PUBLIC API =====
  function _refreshScrollArea() {
    var scroll = document.getElementById('demo-popover-scroll');
    if (!scroll) return;
    scroll.style.opacity = '0';
    setTimeout(function () {
      scroll.innerHTML = _renderScrollArea();
      scroll.style.opacity = '1';
    }, 120);
  }

  function _refreshTabs() {
    var pop = document.getElementById('demo-popover');
    if (!pop) return;
    pop.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === _activePage);
    });
    pop.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      // In pages-only mode, cat-tab elements carry data-page (not data-category)
      if (t.dataset.page) {
        t.classList.toggle('active', t.dataset.page === _activePage);
      } else {
        t.classList.toggle('active', t.dataset.category === _activeCategory);
      }
    });
  }

  /** Toggle popover open/close */
  window._demoFabToggle = function () {
    var pop = document.getElementById('demo-popover');
    var fab = document.getElementById('demo-fab');
    var pulse = document.getElementById('demo-fab-pulse');
    var opening = !pop.classList.contains('show');
    pop.classList.toggle('show');
    fab.classList.toggle('popped');
    if (opening && pulse) pulse.style.display = 'none';
  };

  /** Set active page tab (internal + external) */
  window._demoFabSetPage = function (pageId) {
    if (_activePage === pageId) return;
    _activePage = pageId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /** Set active category tab */
  window._demoFabSetCategory = function (catId) {
    if (_activeCategory === catId) return;
    _activeCategory = catId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /**
   * Called from prototype's navigation function to auto-switch the page tab.
   * Only switches if the popover doesn't need to stay on current tab.
   */
  window.demoFabSwitchTab = function (pageId) {
    window._demoFabSetPage(pageId);
  };

  /** onLeave 鉤子（2026-10-15）：切走上一個情境時先呼叫它，讓頁面把該情境塞進模組狀態的東西重設掉（避免 Demo 殘留，例如 RS 先點 um-* 再開 modal-detail）。
   *   寫法一：scenario.onLeave = function (nextId) {…}　寫法二：window.DEMO_ON_LEAVE = function (prevId, nextId) {…}（兩種都會呼叫，先 scenario 後全域）
   *   觸發點有兩個：點 FAB 按鈕（_demoFabApply）與「直接呼叫 window.DEMO_APPLY(id)」（下面的 DEMO_APPLY 包裝，第二輪 R1 加，讓 sweep 工具也量得到殘留）。 */
  function _runLeave(id) {
    var prevId = _activeScenario;
    if (prevId && prevId !== id) {
      try {
        var prev = (window.DEMO_SCENARIOS || []).filter(function (s) { return s.id === prevId; })[0];
        if (prev && typeof prev.onLeave === 'function') prev.onLeave(id);
        if (typeof window.DEMO_ON_LEAVE === 'function') window.DEMO_ON_LEAVE(prevId, id);
      } catch (e) { console.error('[demo-fab] onLeave', e); }
    }
  }

  /** 包住頁面的 window.DEMO_APPLY：直接呼叫（不經 FAB）時也先跑 onLeave，並記下目前情境。
   *  經 _demoFabApply 進來的呼叫用 _inFabApply 旗標略過，所以 onLeave 不會被呼叫兩次。
   *  頁面不論在 demo-fab.js 載入前或後指定 window.DEMO_APPLY = fn 都會被攔到（accessor 屬性）。 */
  var _inFabApply = false;
  (function _wrapDemoApply() {
    var raw = window.DEMO_APPLY, wrapped = null, wrappedFor = null;
    function get() {
      if (typeof raw !== 'function') return raw;
      if (wrappedFor !== raw) {
        wrappedFor = raw;
        wrapped = function (id) {
          if (!_inFabApply) { _runLeave(id); _activeScenario = id; }
          return raw.apply(this, arguments);
        };
      }
      return wrapped;
    }
    try {
      Object.defineProperty(window, 'DEMO_APPLY', { configurable: true, enumerable: true, get: get, set: function (fn) { raw = fn; } });
    } catch (e) { /* 屬性不可重定義（極少見）：退回不包裝，只剩 FAB 點擊會觸發 onLeave */ }
  })();

  /** Apply a scenario — called via event delegation or by host */
  window._demoFabApply = function (id, btn) {
    _runLeave(id);
    if (window.LumitureToast && window.LumitureToast.clear) { try { window.LumitureToast.clear(); } catch (e) {} }   // 換情境時清掉上一個情境留下的 toast
    _activeScenario = id;
    document.querySelectorAll('.demo-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    if (btn) {
      btn.classList.add('active');
    } else {
      // No btn provided (e.g. Reset link) — find scenario in DOM
      var found = document.querySelector('[data-scenario="' + id + '"]');
      if (found) found.classList.add('active');
    }
    if (typeof window.DEMO_APPLY === 'function') {
      _inFabApply = true;
      try { window.DEMO_APPLY(id, btn); } finally { _inFabApply = false; }
    }
  };

  // ===== INIT =====
  function _init() {
    if (_activeScenario === null && window.DEMO_DEFAULT) {
      _activeScenario = window.DEMO_DEFAULT;
    }
    _render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>
<script>
/* ============================================================
 * General Behavior：角色切換（2026-10-14，Figma General Behavior #01-5 Popup: Select Your Role）
 * Account Menu → View as Another Role 選好角色按 Continue 後，shared/lumiture-topbar.js 先做「原頁面 Loading」，
 * 再呼叫下面的 LUMITURE_ROLE_CHANGE 讓這一頁變成那個角色看到的樣子；角色不在 LUMITURE_ALLOWED_ROLES 裡就跳回 Overview。
 * 套用角色走 _demoFabApply（跟 Demo FAB 按鈕同一條路），FAB 的 active 情境會跟著亮；沒有 FAB 時退回 DEMO_APPLY
 * 角色鍵：admin／t1m／t1mb／t2m／t2mb（對照表見 specs/2026-10-14-general-behavior-v1-figma-compare.md §6）
 * ============================================================ */
(function () {
  /* 依據：頁面既有 5 組角色情境（Demo FAB Role）；T2 只是看不到 Top 10，仍進得了這一頁 */
  window.LUMITURE_ALLOWED_ROLES = ['admin','t1m','t1mb','t2m','t2mb'];
  window.LUMITURE_ROLE_CHANGE = function (key, group) {
    (window._demoFabApply || window.DEMO_APPLY)(key);
    if (window.LumitureTopbar) LumitureTopbar.setRole(LumitureTopbar.roleLabel(group));   /* 頁面的 setRole 會把 chip 寫成頁面慣用寫法，換回使用者選的群組 */
  };
})();
</script>
