<style>
/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-btn:    5px;      /* 2026-10-15 B-8：按鈕／輸入框／下拉觸發欄（FE muiButton、Figma CMDS 都是 5） */
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-modal-sm: 10px;   /* 2026-10-15 B-4：確認類彈窗（Remove／Discard／Select Role） */
  --lt-radius-modal:  15px;     /* 2026-10-15 B-4：表單類彈窗（稿量到 15） */
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */
  --lt-shadow-chip:   0 2px 4px 0 rgba(0, 0, 0, 0.3);            /* chip / tag 用，較深 opacity */
  --lt-shadow-dialog: 0 0 6px 0 rgba(0, 0, 0, 0.2);              /* Card / Dialog / Dropdown 共用；無 offset */
  --lt-shadow-overlay:        0 4px 12px rgba(0, 0, 0, 0.14);    /* CMDS 未涵蓋；popover / floating menu */
  --lt-shadow-overlay-strong: 0 4px 16px rgba(0, 0, 0, 0.18);    /* CMDS 未涵蓋；drawer / 較重 overlay */

  /* --- Transition --- */
  --lt-transition-fast: .15s ease;
  --lt-transition-base: .2s ease;
  --lt-transition-slow: .3s ease;

  /* --- Z-index --- */
  --lt-z-base:     0;
  --lt-z-elevated: 10;
  --lt-z-sticky:   100;
  --lt-z-dropdown: 1000;
  --lt-z-modal:    2000;
  --lt-z-tooltip:  3000;
  --lt-z-toast:    4000;


  /* ============================================================
   * LAYER 2 — SEMANTIC
   * 語意層：引用 primitive，描述用途；component 預設用此層
   * ============================================================ */

  /* --- Color: Brand --- */
  --lt-color-primary:         var(--lt-blue-70);
  --lt-color-primary-hover:   var(--lt-blue-60);
  --lt-color-primary-active:  var(--lt-blue-90);
  --lt-color-primary-bg:      var(--lt-blue-10);
  --lt-color-primary-bg-emphasized: var(--lt-blue-20);

  --lt-color-secondary:       var(--lt-turquoise-70);
  --lt-color-secondary-hover: var(--lt-turquoise-60);
  --lt-color-secondary-bg:    var(--lt-turquoise-10);

  /* --- Color: Functional (alias) --- */
  --lt-color-success: var(--lt-color-success-base);
  --lt-color-error:   var(--lt-color-error-base);
  --lt-color-warning: var(--lt-color-warning-base);
  --lt-color-info:    var(--lt-color-info-base);

  /* --- Color: Text --- */
  --lt-color-text-primary:   var(--lt-grey-700);   /* 內文預設 */
  --lt-color-text-secondary: var(--lt-grey-500);   /* 次要文字 */
  --lt-color-text-tertiary:  var(--lt-grey-400);   /* hint / placeholder */
  --lt-color-text-disabled:  var(--lt-grey-400);   /* 白底上的停用文字／icon；停用「按鈕」的字用 --lt-button-disabled-text（白） */
  --lt-color-text-inverse:   var(--lt-white);
  --lt-color-text-link:      var(--lt-blue-70);    /* 2026-10-15 B-14：#0B6DD7 → #004FB0，連結一律加底線（稿 cell、FE ResourceButton） */
  --lt-color-text-link-hover: var(--lt-blue-60);   /* hover 淺一階 #0B6DD7，底線保留 */
  --lt-color-text-heading:   var(--lt-grey-800);   /* 為未來 heading 獨立換色預留 */
  --lt-color-text-icon:      var(--lt-grey-600);   /* 為未來 icon 獨立換色預留 */

  /* --- Color: Background --- */
  --lt-color-bg-default:    var(--lt-white);
  --lt-color-bg-subtle:     var(--lt-grey-50);
  --lt-color-bg-emphasized: var(--lt-grey-100);
  --lt-color-bg-disabled:   var(--lt-grey-100);   /* 停用的「欄位」底（輸入框／下拉，FE SelectButton gray.disableLight）。2026-10-15 B-1：停用「按鈕」改用 FE 版 #CCCCCC 底白字，見 --lt-button-disabled-bg／-text；這顆維持 #F2F2F2，不然舊頁 `.btn:disabled` 用它當底又用 #CCCCCC 當字會變灰壓灰 */
  --lt-color-text-on-disabled: var(--lt-white);   /* 停用按鈕上的字（= --lt-button-disabled-text） */
  --lt-color-bg-inverse:    var(--lt-blue-90);
  --lt-color-bg-overlay:    rgba(0, 0, 0, 0.5);
  --lt-color-bg-skeleton:   var(--lt-grey-200);   /* 骨架屏；2026-09-24 定，對應前端 gray.skeleton → gray.10；用途命名，日後可單獨換色 */

  /* --- Color: Border --- */
  --lt-color-border-default: var(--lt-grey-200);
  --lt-color-border-strong:  var(--lt-grey-300);
  --lt-color-border-focus:   var(--lt-color-primary);
  --lt-color-border-input:   var(--lt-grey-300);   /* 2026-10-15 B-7：#DCE3EC → #CCCCCC（FE、X-6 稿、RS／RO 稿一致） */
  --lt-color-border-input-hover: var(--lt-grey-400); /* 下拉／輸入 hover 框 #B3B3B3（Guideline Dropdown 已是這個） */
  --lt-color-border-error:   var(--lt-color-error-base);


  /* ============================================================
   * LAYER 3 — COMPONENT
   * 元件層：給特定元件使用；引用 semantic
   * ============================================================ */

  /* --- Sidebar (深海軍藍) --- */
  --lt-sidebar-width:      250px;
  --lt-sidebar-bg:         var(--lt-blue-90);
  --lt-sidebar-text:       rgba(255, 255, 255, 0.85);
  --lt-sidebar-text-muted: rgba(255, 255, 255, 0.50);
  --lt-sidebar-hover-bg:   rgba(255, 255, 255, 0.06);
  --lt-sidebar-active-bg:  var(--lt-color-primary);

  /* --- Topbar --- */
  --lt-topbar-bg:     var(--lt-white);
  --lt-topbar-shadow: var(--lt-shadow-dialog);   /* CMDS Dialog shadow（Card 級別 elevation）*/

  /* --- Card --- */
  --lt-card-bg:      var(--lt-color-bg-default);
  --lt-card-radius:  var(--lt-radius-md);
  --lt-card-shadow:  0 0 20px 0 rgba(0, 0, 0, 0.10);   /* 2026-10-15 B-3：Figma 對稿量到的卡片陰影（CB／AD／LumiTag 10/02）；原 var(--lt-shadow-dialog) 0 0 6px .2 */
  --lt-card-padding: var(--lt-space-24);

  /* --- Button --- */
  --lt-button-radius:     var(--lt-radius-btn);   /* 2026-10-15 B-8：4 → 5 */
  --lt-button-font-weight: var(--lt-fw-bold);     /* 2026-10-15 A-2：稿（CMDS Button Bold 1）與 FE muiButton 都是 700 */
  --lt-button-height:     36px;
  --lt-button-disabled-bg:   var(--lt-grey-300);  /* 2026-10-15 B-1：FE 版 */
  --lt-button-disabled-text: var(--lt-white);
  --lt-button-padding-x:  var(--lt-space-16);
  --lt-button-padding-y:  var(--lt-space-8);
  --lt-button-focus-ring: 0 0 0 3px rgba(0, 79, 176, 0.10);

  /* --- Input / Text Field --- */
  --lt-input-bg:        var(--lt-color-bg-default);
  --lt-input-border:    var(--lt-color-border-input);
  --lt-input-radius:    var(--lt-radius-btn);   /* 2026-10-15：36h r5（Figma 輸入與下拉） */
  --lt-input-height:    36px;
  --lt-input-padding-x: var(--lt-space-16);
  --lt-input-padding-y: var(--lt-space-8);

  /* --- Modal --- */
  --lt-modal-radius:   var(--lt-radius-modal);     /* 2026-10-15 B-4：表單類 15（原 12） */
  --lt-modal-radius-sm: var(--lt-radius-modal-sm); /* 確認類 10 */
  --lt-modal-shadow:   0 0 6px 0 rgba(0, 0, 0, 0.2);  /* 全站彈窗統一（B-4）；等同 --lt-shadow-dialog，寫死以免 dialog 陰影日後獨立換值時彈窗跟著動 */
  --lt-modal-padding:  var(--lt-space-24);
  --lt-modal-backdrop: rgba(0, 0, 0, 0.5);

  /* --- Tooltip --- */
  --lt-tooltip-bg:      #31383E;            /* 2026-10-09 Kabin 裁決改成 Figma 量到的值（原 #3C3C3C）；對齊 Lumiture-Guideline.md 規範；非品牌色，刻意不引用 brand token */
  --lt-tooltip-text:    var(--lt-white);
  --lt-tooltip-radius:  var(--lt-radius-sm);
  --lt-tooltip-padding: var(--lt-space-8);

  /* --- Page title / Toast（2026-10-15 修正輪新增） --- */
  --lt-page-title-size:   var(--lt-fs-24);   /* B-2：頁標題 24／700 */
  --lt-page-title-weight: var(--lt-fw-bold);
  --lt-toast-success-bg:  #008F88;           /* 照 FE toast.css；CLAUDE.md 10/13 */
  --lt-toast-error-bg:    #BF302E;
  --lt-toast-info-bg:     #0B6DD7;           /* FE toast.css --infoMain */
  --lt-toast-warning-bg:  #EC6F09;           /* FE toast.css --warningMain */
  --lt-toast-radius:      4px;
  --lt-toast-width:       400px;
}


/* ============================================================
 * NOT YET DEFINED (Pass 3+)
 * ============================================================
 * - ~~Chart palette~~ ✅ 已加入（2026-05-12 從 Figma General Behavior file audit）
 * - Gradient tokens (Figma 有 Lumiture.ai Blue / Orange / Lemon C 等)
 * - Opacity tokens (Figma 有 CM Opacity Color 系列)
 * - Composite typography tokens (--lt-type-h1, --lt-type-body 等 style sets)
 * - Focus / Inset shadow 特殊變體
 * - Dark mode 對應 token
 *
 * Shadow 結構待 Figma audit：v7/v8 用單層、tokens.css 主階用雙層；Overlay 已用單層作折衷
 * ============================================================ */

</style>
<style>
/* === Inlined: shared/lumiture-ui.css === */
/* ============================================================
 * lumiture-ui.css — 共用小元件樣式（2026-10-15 修正輪 S 組）
 * 引用：<link rel="stylesheet" href="../shared/lumiture-ui.css?v=2026-10-15">（tokens.css 之後；沒載 tokens.css 的頁面也能用，var 都有備用值）
 *
 *   .lt-select   下拉／輸入觸發欄（A-11）
 *   .lt-skeleton 骨架屏（A-18）
 *   .lt-link     文字連結（B-14）
 *   .lt-btn-icon 表格 Action icon button（B-6，CB 版）
 *   空狀態／無權限見 lumiture-empty.js；Toast 見 lumiture-toast.js
 * ============================================================ */

/* ---------- .lt-select ----------
 * 結構：
 *   <button type="button" class="lt-select" aria-haspopup="listbox" aria-expanded="false">
 *     <span class="lt-select__v">All Types</span>                       ← 沒選時加 .is-placeholder 在 .lt-select 上，字變 #B3B3B3
 *     <span class="material-symbols-outlined lt-select__arrow">arrow_drop_down</span>   ← MUI 實心 ▾，不要用 expand_more／chevron
 *   </button>
 * 狀態 class：.is-open（框 primary＋focus ring，箭頭轉 180）、.is-error、.is-disabled 或 :disabled、.is-placeholder
 * 高 36、圓角 5、字 14／400、框 #CCCCCC、hover 框 #B3B3B3（Guideline Dropdown；舊的 hover 框變藍底 #F2FAFF 已廢）。寬度由頁面給（width／min-width）。 */
.lt-select{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;box-sizing:border-box;height:var(--lt-input-height,36px);padding:0 4px 0 12px;
  background:var(--lt-color-bg-default,#fff);border:1px solid var(--lt-color-border-input,#CCCCCC);border-radius:var(--lt-input-radius,5px);
  font-family:inherit;font-size:14px;font-weight:400;line-height:1.5;color:var(--lt-color-text-primary,#262626);text-align:left;cursor:pointer;
  transition:border-color .15s ease,box-shadow .15s ease}
.lt-select:hover{border-color:var(--lt-color-border-input-hover,#B3B3B3)}
.lt-select:focus-visible,.lt-select.is-open{outline:none;border-color:var(--lt-color-border-focus,#004FB0);box-shadow:var(--lt-button-focus-ring,0 0 0 3px rgba(0,79,176,.1))}
.lt-select__v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt-select.is-placeholder .lt-select__v{color:var(--lt-grey-400,#B3B3B3)}
.lt-select__arrow{flex-shrink:0;font-size:24px;line-height:1;color:var(--lt-grey-500,#676767);transition:transform .2s ease;
  font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.lt-select.is-open .lt-select__arrow{transform:rotate(180deg)}
.lt-select.is-error{border-color:var(--lt-color-error,#FF403D)}
.lt-select.is-error:focus-visible,.lt-select.is-error.is-open{box-shadow:0 0 0 3px rgba(255,64,61,.1)}
.lt-select:disabled,.lt-select.is-disabled{background:var(--lt-grey-100,#F2F2F2);border-color:var(--lt-grey-300,#CCCCCC);color:var(--lt-grey-300,#CCCCCC);cursor:not-allowed;box-shadow:none}
.lt-select:disabled .lt-select__arrow,.lt-select.is-disabled .lt-select__arrow{color:var(--lt-grey-300,#CCCCCC)}

/* ---------- .lt-skeleton ----------
 * 骨架屏統一用 --lt-color-bg-skeleton（#E6E6E6）。**靜態**不跑 shimmer（X-6 現況，Guideline 已回改）；要 shimmer 才加 .lt-skeleton--shimmer。
 * 用法：<div class="lt-skeleton" style="width:120px;height:16px"></div>；表格列慣例見各頁稿 #01-6（表頭文字照常、只有儲存格內容換成灰條；卡片標題照常、按鈕 disabled）。

.rk-back .t{text-decoration:underline}

.rk-title{font-size:var(--lt-fs-20);font-weight:var(--lt-fw-bold);line-height:30px;color:var(--lt-color-text-heading);margin:0}

.rk-shot{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--lt-color-primary);border-radius:var(--lt-radius-circle)}

.rk-axis-lbl{position:absolute;left:0;top:7px;width:calc(var(--rk-left,210px) - 20px);text-align:right;font-size:var(--lt-fs-12);font-weight:var(--lt-fw-bold);line-height:18px;color:var(--lt-grey-400);white-space:nowrap}

.rk-wrap.is-sticky .rk-axis.is-stuck{box-shadow:0 -1px 0 var(--lt-grey-200)}   /* ⚠ 設計端暫擬（Fable #4）：只在真的貼住視窗底（圖表還沒捲完）時才畫 1px 上線，讓「浮在內容上」講得出來；捲到圖表尾端落回原位時不畫，跟稿的靜態 X 軸一樣 */
.rk-sentinel{height:1px;margin-top:-1px}
.rk-wrap.is-static .rk-axis{position:relative}
.rk-wrap.is-maxh .rk-scroll{max-height:560px;overflow-y:auto;overscroll-behavior:contain}
.rk-wrap.is-maxh .rk-axis{position:relative;padding-right:var(--rk-sbw,0px)}

.rk-sk-lbl{width:calc(var(--rk-left,210px) - 10px)!important}
.rk-sk-row{display:flex;align-items:center;gap:10px;height:66px}
.rk-sk-lbl{width:200px;flex-shrink:0}
.rk-sk-bars{flex:1;display:flex;flex-direction:column;gap:3px;padding-right:12px}
.rk-state{min-height:400px;display:flex;flex-direction:column;justify-content:center}
@media(max-width:900px){.rk-hdr{flex-wrap:wrap}.rk-upd{flex-wrap:wrap;white-space:normal}.rk-leg-row{flex-wrap:wrap}}

.footer{padding:var(--lt-space-16) var(--lt-space-32);background:var(--lt-color-primary-bg);border-top:1px solid var(--lt-color-border-default);display:flex;align-items:center;justify-content:space-between;font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);flex-wrap:wrap;gap:10px}

  function _renderTopbarLogo() {
    var href = _homeHref();
    var icon = LOGO_ICON.replace(/ltH(ring|bars|leg)/g, 'ltT$1');
    var open = href ? '<a class="lt-tb-logo is-link" href="' + _esc(href) + '" data-tip="Go to Overview" data-tip-pos="below">' : '<div class="lt-tb-logo">';
    return open + _logoBody(icon) + (href ? '</a>' : '</div>');
  }
  function _mountTopbarLogo(host) {
    host = host || document.getElementById('lt-topbar');
    if (!host) return;
    _injectCSS();
    var old = host.querySelector('.lt-tb-logo');
    if (old) old.parentNode.removeChild(old);
    host.insertAdjacentHTML('afterbegin', _renderTopbarLogo());
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function _renderItem(item, isSub) {
    var cls = isSub ? 'lt-sb-subitem' : 'lt-sb-item';
    var isActive = (item.id === window.LUMITURE_ACTIVE);
    var active = isActive ? ' lt-active' : '';
    var dis = item.disabled ? ' lt-dis' : '';
    // Active item: render as <div> (no self-link). Disabled item: also no href.
    var useHref = item.href && !isActive && !item.disabled;
    var tag = useHref ? 'a' : 'div';
    var hrefAttr = useHref ? ' href="' + _esc(item.href) + '"' : '';
    var dataId = ' data-nav-id="' + _esc(item.id) + '"';
    return '<' + tag + ' class="' + cls + active + dis + '"' + hrefAttr + dataId + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon || 'circle') + '</span>' +
             '<span>' + _esc(item.label) + '</span>' +
           '</' + tag + '>';
  }

  function _renderGroup(grp) {
    var collapsed = grp.collapsed ? ' lt-collapsed' : '';
    var children = (grp.items || []).map(function (item) {
      return _renderItem(item, true);
    }).join('');
    return '<div class="lt-sb-group' + collapsed + '" data-group-id="' + _esc(grp.id) + '">' +
             '<div class="lt-sb-group-hdr">' +
               '<span>' + _esc(grp.label) + '</span>' +
               '<span class="material-symbols-outlined lt-sb-group-arrow">keyboard_arrow_up</span>' +
             '</div>' +
             '<div class="lt-sb-group-children">' + children + '</div>' +
           '</div>';
  }

  function _renderNav() {
    var nav = window.LUMITURE_NAV || [];
    var html = '<div class="lt-sb-nav">';
    nav.forEach(function (entry) {
      if (entry.type === 'group') {
        html += _renderGroup(entry);
      } else {
        html += _renderItem(entry, false);
      }
    });
    html += '<div class="lt-sb-skel" aria-hidden="true">' + '<span class="lt-sb-skel-bar"></span>'.repeat(5) + '</div>';
    html += '</div>';
    return html;
  }

  function _renderToggleBtn() {
    return '<button type="button" class="lt-sb-toggle" data-action="toggle-collapse">' +
             '<span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>' +
           '</button>';
  }

  // ===== 收合狀態（記住使用者前次設定）=====
  var STORE_KEY = 'lt-sidebar-collapsed', COLLAPSED_W = '21px';
  function _readStored() { try { return window.localStorage.getItem(STORE_KEY) === '1'; } catch (e) { return false; } }
  function _writeStored(on) { try { window.localStorage.setItem(STORE_KEY, on ? '1' : '0'); } catch (e) {} }
  var _collapsed = _readStored();

  // 套用到 <html>（class＋CSS 變數，給各頁的固定列／內容區位移用）與 sidebar 本身（class、inert、按鈕文字）
  function _applyCollapsed() {
    var root = document.documentElement;
    root.classList.toggle('lt-sb-collapsed', _collapsed);
    if (_collapsed) {
      root.style.setProperty('--lt-sb-w', COLLAPSED_W);
      root.style.setProperty('--sw', COLLAPSED_W);   // 舊頁面寫的 left:var(--sw)（固定底列）跟著動
    } else {
      root.style.removeProperty('--lt-sb-w');        // 還原成各頁／tokens 原本的展開值，展開狀態完全不變
      root.style.removeProperty('--sw');
    }
    var sb = document.getElementById('lt-sidebar');
    if (!sb) return;
    sb.classList.toggle('lt-collapsed', _collapsed);
    var clip = sb.querySelector('.lt-sb-clip');
    if (clip) { if (_collapsed) clip.setAttribute('inert', ''); else clip.removeAttribute('inert'); }
    var btn = sb.querySelector('.lt-sb-toggle');
    if (btn) {
      var label = _collapsed ? 'Expand sidebar' : 'Collapse sidebar';
      btn.setAttribute('aria-label', label); btn.removeAttribute('title');   // title 與 aria-label 同字會被部分輔助工具唸兩次
      btn.setAttribute('aria-controls', 'lt-sidebar');
      btn.setAttribute('aria-expanded', _collapsed ? 'false' : 'true');
      var ic = btn.querySelector('.material-symbols-outlined'); if (ic) ic.textContent = _collapsed ? 'chevron_right' : 'chevron_left';
    }
  }
  var _resizeTimer = null;
  function _setCollapsed(on, opts) {
    on = !!on;
    var changed = on !== _collapsed;
    _collapsed = on;
    if (opts && opts.persist) _writeStored(on);
    // 程式收合時若焦點在 nav 內，inert 會把焦點丟到 body；先移到收合後唯一可達的 sidebar 控制（Fable §12 #5）
    if (on && changed) {
      var sbEl = document.getElementById('lt-sidebar'), clipEl = sbEl && sbEl.querySelector('.lt-sb-clip'), tgl = sbEl && sbEl.querySelector('.lt-sb-toggle');
      if (clipEl && tgl && clipEl.contains(document.activeElement)) tgl.focus({ preventScroll: true });
    }
    _applyCollapsed();
    if (!changed) return;
    document.dispatchEvent(new CustomEvent('lt-sidebar-toggle', { detail: { collapsed: _collapsed } }));
    // 寬度轉場跑完後通知圖表重新量容器（ECharts 等）
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 230);
  }
  // 載入時先把記住的狀態套到 <html>（不等 DOM 建好），並在套用的那一刻關掉轉場，免得每換一頁都看到 250→21 的動畫
  function _bootCollapsed() {
    var root = document.documentElement;
    root.classList.add('lt-html-noanim');
    _applyCollapsed();
    requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove('lt-html-noanim'); }); });
  }

  // ===== Loading（#01-5）=====
  var _loading = false;
  function _applyLoading(mount) {
    mount = mount || document.getElementById('lt-sidebar');
    if (!mount) return;
    mount.classList.toggle('lt-loading', _loading);
    if (_loading) mount.setAttribute('aria-busy', 'true'); else mount.removeAttribute('aria-busy');
  }

  // ===== Mount =====
  function _render() {
    var mount = document.getElementById('lt-sidebar');
    if (!mount) {
      console.warn('[lumiture-sidebar] Mount point #lt-sidebar not found');
      return;
    }
    // If mount is not already a sidebar, wrap it
    mount.classList.add('lt-sidebar');
    mount.innerHTML = '<div class="lt-sb-clip"><div class="lt-sb-inner">' + _renderLogo() + _renderNav() + '</div></div>' + _renderToggleBtn();
    _applyLoading(mount);
    _applyCollapsed();
    _mountTopbarLogo();

    // Group toggle
    mount.querySelectorAll('.lt-sb-group-hdr').forEach(function (hdr) {
      hdr.addEventListener('click', function () {
        var grp = hdr.parentElement;
        if (grp) grp.classList.toggle('lt-collapsed');
      });
    });
    // Collapse the whole sidebar
    var btn = mount.querySelector('[data-action="toggle-collapse"]');
    if (btn) {
      btn.addEventListener('click', function () {
        _setCollapsed(!_collapsed, { persist: true });   // 使用者自己按才記住
      });
    }
  }

  // ===== Public API =====
  window.LumitureSidebar = {
    toggleGroup: function (groupId) {
      var grp = document.querySelector('[data-group-id="' + groupId + '"]');
      if (grp) grp.classList.toggle('lt-collapsed');
    },
    toggleCollapse: function (opts) { _setCollapsed(!_collapsed, opts); },
    setCollapsed: function (on, opts) { _setCollapsed(on, opts); },
    isCollapsed: function () { return _collapsed; },
    restoreStored: function () { _setCollapsed(_readStored()); },   // Demo 情境重設用：回到「使用者前次設定」
    mountTopbarLogo: _mountTopbarLogo,
    setActive: function (itemId) {
      window.LUMITURE_ACTIVE = itemId;
      document.querySelectorAll('.lt-sb-item, .lt-sb-subitem').forEach(function (el) {
        el.classList.toggle('lt-active', el.dataset.navId === itemId);
      });
    },
    setLoading: function (on) { _loading = !!on; _applyLoading(); },
    isLoading: function () { return _loading; },
    rerender: _render,
  };

  // 頁面自己沒設 favicon 才補，分頁列一眼分得出 prototype 跟正式站
  function _injectFavicon() {
    if (document.querySelector('link[rel~="icon"]')) return;
    var l = document.createElement('link');
    l.rel = 'icon'; l.type = 'image/svg+xml';
    l.href = 'data:image/svg+xml,' + encodeURIComponent(FAVICON_SVG);
    document.head.appendChild(l);
  }

  // ===== INIT =====
  function _init() {
    _injectCSS();
    _injectFavicon();
    _render();
    // Dispatch resize so chart libraries (ECharts 等) 重新測量容器
    // —— 避免 inline script 已先 init chart 後，shared CSS 才 inject 導致 layout shift
    requestAnimationFrame(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }

  _injectCSS();      // 載入當下就先套上記住的收合狀態（<html> class＋變數），第一次繪製就是對的寬度
  _bootCollapsed();

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>

  function _injectCSS() {
    if (document.getElementById('lt-topbar-css')) return;

  // ===== Helpers =====
  /* 角色 chip icon（A-3；稿 #01-4／#01-7、FE UserRoleChip ROLE_ICON_MAP）：Member account_circle、Manager supervised_user_circle、Admin／Owner admin_panel_settings。
     role 字串寫法：'Admin'／'Owner'／'Manager - Cost Center'／'Member - Finance-APAC'。topbar 上的頭像是使用者頭像（稿 #01 就是人像圓），不是角色 chip，不跟著換 */
  function _roleIcon(role) {
    var r = String(role || '');
    if (/^Member\b/i.test(r)) return 'account_circle';
    if (/^Manager\b/i.test(r)) return 'supervised_user_circle';
    return 'admin_panel_settings';
  }
  function _esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function _user() {
    var u = Object.assign({}, DEFAULT_USER, window.LUMITURE_USER || {});
    u.quota = Object.assign({}, DEFAULT_USER.quota, (window.LUMITURE_USER || {}).quota || {});
    return u;
  }
  function _status(used, total) {
    if (!total || total <= 0) return 'active';
    var pct = used / total * 100;
    if (pct >= 100) return 'depleted';
    if (pct >= 80)  return 'warning';
    return 'active';
  }
  function _planItems(plan) {
    return PLAN_QUOTA_ITEMS[plan] != null ? PLAN_QUOTA_ITEMS[plan] : PLAN_QUOTA_ITEMS.Standard;
  }
  function _showQuotaBox(u) {
    return _planItems(u.plan).length > 0;
  }

  // ===== Renderers =====
  function _renderIcon(item) {
    var attrs = ' class="lt-tb-ic" data-tip="' + _esc(item.title || '') + '" data-tip-pos="below" aria-label="' + _esc(item.title || '') + '"';   /* 原生 title 改 data-tip（#gl-tip） */
    if (item.onclick) attrs += ' onclick="' + _esc(item.onclick) + '"';
    var badge = item.badge ? '<span class="lt-tb-badge"></span>' : '';
    return '<button type="button"' + attrs + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon) + '</span>' + badge +
           '</button>';
  }

  function _renderUserChip(u) {
    return '<button type="button" class="lt-tb-user" id="lt-tb-user" aria-haspopup="true" aria-expanded="false">' +
             '<span class="material-symbols-outlined lt-tb-avatar-ic">account_circle</span>' +
             '<div class="lt-tb-user-text">' +
               '<span class="lt-tb-user-name">' + _esc(u.name) + '</span>' +
               '<span class="lt-tb-user-role" id="lt-tb-user-role">' + _esc(u.role) + '</span>' +
             '</div>' +
             '<span class="material-symbols-outlined lt-tb-chev">keyboard_arrow_down</span>' +
           '</button>';
  }

  function _renderQuotaItem(key, q) {
    var meta = QUOTA_META[key];
    var used = q.used || 0, total = q.total || 0;
    var remaining = Math.max(0, total - used);
    var st = _status(used, total);
    // Warning / Depleted 才有 hover tooltip 說明（取代原本點開的 Limit Reached 對話框；
    // PM 確認無法提供 per-user 業務 email，故改輕量懸停說明，無 Contact Sales 動作）
    // 文案含變數 {total} {unit} {label}；{label}=Cost Dashboard / Usage Optimization
    var tip = '';
    if (st === 'depleted' || st === 'warning') {
      var verb = st === 'depleted' ? 'has been reached' : 'is approaching';
      var tipText = 'Your monthly limit (' + total.toLocaleString() + ' ' + meta.unit + ') ' + verb +
        ' for ' + meta.dialogLabel + '. Please contact your LumiTure.ai representative to purchase ' +
        'Add-ons to increase your quota for this billing cycle.';
      tip = '<span class="lt-q-tip">' + _esc(tipText) + '</span>';
    }
    var hasTip = tip !== '';
    return '<div class="lt-q-item is-' + st + (hasTip ? ' has-tip' : '') + '"' + (hasTip ? ' tabindex="0" role="menuitem" aria-disabled="true"' : '') + '>' +
             '<span class="lt-q-dot"></span>' +
             '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
             '<span class="lt-q-val">' + remaining.toLocaleString() + ' / ' + total.toLocaleString() + ' left</span>' +
             tip +
           '</div>';
  }

  function _renderQuotaBox(u) {
    var isPremium = u.plan === 'Premium';
    var items = _planItems(u.plan);
    if (!items.length) return '';   // 無有效 plan：不顯示（理論上不會發生）
    // Premium（稿 #01-4）：header 只寫 Org-wide，不接 refresh 日；數字照一般方案
    var sub = isPremium ? 'Org-wide' : 'Org-wide, refresh on ' + _esc(u.quota.refreshDate);
    var head = '<div class="lt-q-head">' +
                 '<span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-sub">' + sub + '</span>' +
               '</div>';
    // loading（#01-7）：refresh 日也尚未載入 → 右上一條 skeleton；下面兩條滿寬；整塊 min-height 113（跟有資料時同高）
    if (u.quota.state === 'loading') {
      return '<div class="lt-q is-loading" aria-busy="true" aria-label="Loading AI Quota">' +
               '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-skel lt-q-skel-sub"></span></div>' +
               '<div class="lt-q-skel lt-q-skel-row"></div><div class="lt-q-skel lt-q-skel-row"></div>' +
             '</div>';
    }
    // error（#01-7 partial degrade：只有這塊壞，menu 其他項照常）；refresh 日未載入 → sub 只顯示 Org-wide；Retry 右對齊、青色粗體底線
    if (u.quota.state === 'error') {
      var headErr = '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span><span class="lt-q-sub">Org-wide</span></div>';
      return '<div class="lt-q">' + headErr +
               '<div class="lt-q-err"><span class="material-symbols-outlined">help</span>' +
               '<span class="lt-q-err-msg">Couldn\'t load quota</span>' +
               '<a role="menuitem" tabindex="0" onclick="window.LumitureTopbar._retryQuota()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();window.LumitureTopbar._retryQuota()}">Retry</a></div>' +
             '</div>';
    }
    var rows = items.map(function (k) { return _renderQuotaItem(k, u.quota[k] || {}); }).join('');
    // add-on 行（packs>0，Premium 不適用）；naming 對齊 PRD：單數 "AI Quota Add-on × N"
    var addon = (!isPremium && (u.addonPacks || 0) > 0)
      ? '<div class="lt-q-addon"><span class="material-symbols-outlined">auto_awesome</span>' +
          u.addonPacks + ' × AI Quota Add-ons Activated</div>'
      : '';
    return '<div class="lt-q">' + head + rows + addon + '</div>';
  }

  function _renderMenu(u) {
    var planName = _esc(u.plan) + ' Plan';
    var bannerStyle = PLAN_BANNER[u.plan] || PLAN_BANNER.Standard;
    var viewAs = u.canSwitchRole
      ? '<div class="lt-am-grp">' +
          '<button type="button" role="menuitem" class="lt-am-item" onclick="window.LumitureTopbar.openRoleDialog()">' +
            '<span class="material-symbols-outlined">sync_alt</span>View as Another Role</button></div>' +
        '<div class="lt-am-div"></div>'

    var box = _renderQuotaBox(u);
    return '<div class="lt-am-backdrop" id="lt-am-backdrop" onclick="window.LumitureTopbar.closeMenu()"></div>' +
           '<div class="lt-am" id="lt-am" role="menu">' +
             '<div class="lt-am-plan" style="' + bannerStyle + '">' +
               '<span class="lt-am-plan-name">' + planName + '</span>' +
               '<span class="lt-am-plan-date">' + _esc(u.planDateRange) + '</span>' +
             '</div>' +
             '<div class="lt-am-id">' +
               '<div class="lt-am-id-top">' +
                 '<div class="lt-am-id-name">' + _esc(u.name) + '</div>' +
                 '<div class="lt-am-id-email">' + _esc(u.email) + '</div>' +
               '</div>' +
               '<span class="lt-am-chip"><span class="material-symbols-outlined">' + _roleIcon(u.role) + '</span>' + _esc(u.role) + '</span>' +
             '</div>' +
             '<div class="lt-am-div"></div>' +
             (box ? box + '<div class="lt-am-div"></div>' : '') +
             viewAs +
             '<div class="lt-am-grp">' +
               '<button type="button" role="menuitem" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Profile\')">' +
                 '<span class="material-symbols-outlined">manage_accounts</span>Profile</button>' +
               '<button type="button" role="menuitem" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Settings\')">' +
                 '<span class="material-symbols-outlined">settings</span>Settings</button>' +
             '</div>' +
             '<div class="lt-am-div"></div>' +
             '<div class="lt-am-grp">' +
               '<button type="button" role="menuitem" class="lt-am-item" onclick="window.LumitureTopbar.logout()">' +
                 '<span class="material-symbols-outlined">logout</span>Log out</button>' +
             '</div>' +
           '</div>';
  }

  // ===== Mount / state =====
  var _menuOpen = false;

  function _render() {
    var mount = document.getElementById('lt-topbar');
    if (!mount) { console.warn('[lumiture-topbar] Mount point #lt-topbar not found'); return; }
    var u = _user();
    var icons = window.LUMITURE_TOPBAR_ICONS || DEFAULT_ICONS;
    mount.classList.add('lt-topbar');
    mount.innerHTML = icons.map(_renderIcon).join('') + _renderUserChip(u);
    // sidebar 收合時 logo 會移到 topbar 左側（Figma #01-2）；logo 由 lumiture-sidebar.js 提供，沒載入就不放
    if (window.LumitureSidebar && window.LumitureSidebar.mountTopbarLogo) window.LumitureSidebar.mountTopbarLogo(mount);
    var chip = document.getElementById('lt-tb-user');
    if (chip) chip.addEventListener('click', function (e) { e.stopPropagation(); _toggleMenu(); });
    _menuOpen = false;
  }

  function _menuHost() {
    var host = document.getElementById('lt-am-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'lt-am-host';
      document.body.appendChild(host);
    }
    return host;
  }

  /* 鍵盤（Fable #5）：開啟時焦點進第一項；↑↓／Home／End 移動；Esc 關閉並回到 user chip；Tab 離開選單時關閉並回到 chip；項目有 role="menuitem" */
  function _menuItems() {
    var m = document.getElementById('lt-am');
    return m ? Array.prototype.slice.call(m.querySelectorAll('.lt-am-item,.lt-q-err a,.lt-q-item.has-tip')) : [];
  }
  function _openMenu() {
    var wasOpen = _menuOpen, items0 = wasOpen ? _menuItems() : [], idx = items0.indexOf(document.activeElement);
    var u = _user();
    _menuHost().innerHTML = _renderMenu(u);
    _menuOpen = true;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.add('is-open'); chip.setAttribute('aria-expanded', 'true'); }
    var items = _menuItems(), t = null;
    if (!wasOpen) t = document.querySelector('#lt-am .lt-am-item');      // 第一次開：第一個功能項（Retry 只走方向鍵到得了，不搶第一個焦點）
    else if (idx > -1 && items.length) t = items[Math.min(idx, items.length - 1)];            // 重繪（Retry、切 plan…）：焦點留在原位
    if (t) t.focus({ preventScroll: true });
  }
  function _closeMenu(refocus) {
    var had = _menuOpen;
    _menuHost().innerHTML = '';
    _menuOpen = false;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.remove('is-open'); chip.setAttribute('aria-expanded', 'false'); if (refocus && had) chip.focus({ preventScroll: true }); }
  }
  function _toggleMenu() { _menuOpen ? _closeMenu() : _openMenu(); }

  document.addEventListener('keydown', function (e) {
    if (!_menuOpen) return;
    var m = document.getElementById('lt-am'), a = document.activeElement, inside = !!(m && a && m.contains(a));
    if (e.key === 'Escape') { e.preventDefault(); _closeMenu(true); return; }
    if (e.key === 'Tab' && inside) { e.preventDefault(); _closeMenu(true); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Home' || e.key === 'End') {
      var items = _menuItems(); if (!items.length) return;
      if (!inside && a && a.id !== 'lt-tb-user') return;
      e.preventDefault();
      var i = items.indexOf(a), n = items.length;
      if (e.key === 'Home') i = 0; else if (e.key === 'End') i = n - 1;
      else if (e.key === 'ArrowDown') i = i < 0 ? 0 : (i + 1) % n; else i = i < 0 ? n - 1 : (i - 1 + n) % n;
      items[i].focus({ preventScroll: true });
    }
  });

  // ===== View as Another Role（Figma General Behavior #01-5 Popup: Select Your Role）=====
  /* 視覺與互動沿用 Auth prototype 的 #08 Select Your Role（FE SelectUserRoleDialog）：寬 600、padding 24/32、圖示 75、
     標題 20/700、下拉＝FE SingleSelect（搜尋 Group Name、Admin 置頂其餘字母排序、尾端角色 chip、清單最高 260）。
     #01-5 與 #08 的差別（稿的註記）：多一顆 Keep Current Role（outlined、不切換直接關閉）；選到目前角色時 Continue disabled；
     Continue 後「原頁面 Loading → 新角色視角的該頁面；沒權限看就跳回 Overview」。
     頁面掛勾（都是選用，沒定義就只換 topbar 的角色 chip）。角色鍵 key 沿用各頁 ROLES 的 id：
       'admin'（Owner／Admin）／'t1m'（T1 Manager）／'t1mb'（T1 Member）／'t2m'（T2 Manager）／'t2mb'（T2 Member）；由群組的 tier（0＝org 層／1／2）＋ role 算出
       window.LUMITURE_ROLES         = [{id,name,role:'Admin'|'Manager'|'Member',tier:0|1|2}]   角色清單 mock；沒給用下面 DEFAULT_ROLES
       window.LUMITURE_ROLE_CHANGE   = function (key, group) {}                      切換成功後呼叫（讓頁面套用那個角色的畫面）。
                                                                                     頁面自己的 setRole 會把 chip 寫成頁面慣用寫法，要換回使用者選的群組請接著呼叫 LumitureTopbar.setRole(LumitureTopbar.roleLabel(group))
       window.LUMITURE_ALLOWED_ROLES = ['admin','t1m']                               這頁哪些角色看得到；新角色不在裡面 → 導向 Overview

    /* 2026-10-15 R1（A-11）：下拉箭頭統一實心 ▾（arrow_drop_down 24）。markup 加 class="curr-arrow" 才套用（舊頁面仍是 expand_more 16 的 chevron） */
    '.curr-btn .curr-arrow{font-size:24px;margin:0 -4px 0 -2px}',
    '.curr-btn.cp-open .material-symbols-outlined{transform:rotate(180deg)}',

    /* Dropdown container — 4px gap per CMDS spec */
    '.curr-dd{position:absolute;top:calc(100% + 4px);right:0;left:auto;',
    'background:#fff;border:1px solid #DCE3EC;',
    'border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);',
    'z-index:300;min-width:220px;width:max-content;',
    'overflow:hidden;overscroll-behavior:contain}',

    /* Dropdown items — full name + (CODE), no flag */
    '.curr-dd-item{display:flex;align-items:center;padding:9px 14px;width:100%;',
    'font-size:13px;border:none;background:none;cursor:pointer;',
    'font-family:inherit;color:#262626;text-align:left;',
    'transition:background .1s;line-height:1.4;white-space:nowrap}',
    '.curr-dd-item:hover{background:#F5F5F5}',
    /* Selected: gray bg per Figma, no color/weight change */
    '.curr-dd-item.cp-active{background:#F0F0F0}',
  ].join('');

  var style = document.createElement('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  /* ===== STATE ===== */
  var _activeTrigger = null;

  /* ===== INTERNAL ===== */
  function _close() {
    var dd = document.getElementById('_curr-dd');
    if (dd) dd.remove();
    if (_activeTrigger) {
      _activeTrigger.classList.remove('cp-open');
      _activeTrigger = null;
    }
  }

  function _open(triggerEl, currentCode, onChange) {
    _activeTrigger = triggerEl;
    triggerEl.classList.add('cp-open');

    /* Ensure parent is positioned */
    var wrap = triggerEl.parentElement;
    if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';

    var dd = document.createElement('div');
    dd.className = 'curr-dd';
    dd.id = '_curr-dd';
    dd.innerHTML = CURRENCIES.map(function (c) {
      var isActive = c.code === currentCode;
      return '<button class="curr-dd-item' + (isActive ? ' cp-active' : '') + '">' +
        c.name + ' (' + c.code + ')' +
        '</button>';
    }).join('');

    dd.querySelectorAll('.curr-dd-item').forEach(function (btn, i) {
      btn.addEventListener('click', function () {
        _close();
        onChange(CURRENCIES[i].code);
      });
    });

    wrap.appendChild(dd);

    /* Outside click to close */
    setTimeout(function () {
      document.addEventListener('click', function _outsideClose(e) {
        if (!dd.contains(e.target) && e.target !== triggerEl) {
          _close();
          document.removeEventListener('click', _outsideClose, true);
        }
      }, true);
    }, 0);
  }

  /* ===== PUBLIC API ===== */
  window.CurrencyPicker = {
    CURRENCIES: CURRENCIES,

    /**
     * Toggle dropdown open / close.
     * @param {Element}  triggerEl   — the .curr-btn element
     * @param {string}   currentCode — e.g. 'USD'
     * @param {Function} onChange    — called with new code when user picks
     */
    open: function (triggerEl, currentCode, onChange) {
      if (_activeTrigger === triggerEl) {
        _close();
      } else {
        _close();
        _open(triggerEl, currentCode, onChange);
      }
    },

    close: _close,
  };
})();

</script>
<script>
/* === Inlined: shared/focus-treemap.js === */
/*!
 * focus-treemap.js — Lumiture Shared FOCUS Cost Treemap + Top10 Ranking
 *
 * 用途：把 cost-by-FOCUS-framework 區塊（左 Treemap + 右 Top10 表）
 * 抽成共用模組，給 Executive Insights / Cost Dashboard / 未來 prototype 共用。
 *
 * Source of truth:
 *   - 對齊 FE: src/features/CostByFOCUS/CostByFOCUSTreeMap.tsx + Top10CostByFOCUSTable.tsx
 *   - 設計：Figma Main Feature node 4103-40564 / 3873-84509（PM 註解規則）
 *
 * 規則（per PM 註解 2026-05-21）：
 *   - 顯示「所有」FOCUS 分類（202512 官方文件約 19+ 項）；花費為 0 不顯示
 *   - 不做 Top 9 + Others 收尾（如要顯示 Others 桶，由 caller 自行傳入）
 *   - 顏色順序按 ranking：rank 1→#2、rank 2→#4、rank 3→#6、rank 4→#10、
 *     rank 5→#9、rank 6→#8、rank 7→#7、rank 8→#5、rank 9→#3、rank 10→#1
 *     （CMDS Color Kit Main palette；參考 FE rankingColor array）
 *   - Treemap label 顯示「服務名 + 花費」，面積過小自動隱藏（ECharts 預設行為）
 *   - 底部 index / 下層 drill-down 暫不顯示（PM 指示）
 *   - Top10 排行榜 width 固定 452px；圖表 fill 剩餘 width
 *   - 雙方都需延展時 chart : ranking = 6 : 4（由 caller layout 控制 max-width）
 *
 * Usage:
 *   <div class="lt-focus-section">
 *     <div id="my-focus-treemap" class="lt-focus-treemap"></div>
 *     <div id="my-focus-table" class="lt-focus-table"></div>
 *   </div>
 *
 *   <script src="../shared/focus-treemap.js"><\/script>
 *   <script>
 *     LumitureFocusTreemap.render({
 *       treemapEl: '#my-focus-treemap',
 *       tableEl:   '#my-focus-table',
 *       data: [
 *         { name:'Compute',    spending:186400, share:0.346, changeRatio: 0.12 },
 *         { name:'Storage',    spending:94200,  share:0.175, changeRatio:-0.04 },
 *         // ... 19+ entries
 *       ],
 *       currency: 'USD',
 *       currencySymbol: '$',
 *       tableLimit: 10,        // optional — 表格只列前 N 名（treemap 仍畫全部）
 *       tableSymbol: '',       // optional — 表格金額前綴（預設同 currencySymbol）
 *       showChange: true,      // optional — 表格多一欄 Change（Overview 用；對齊 FE Top10CostByFOCUSTable）
 *       noCompareTip: '...',   // optional — Change 為 -- 時的 hover 文案（走 host page 的 [data-tip] tooltip）
 *     });
 *   <\/script>
 *
 *   同一組 el 重複呼叫 render() 會先 dispose 舊的 ECharts instance（切換幣別 / 期間重繪用）。
 *
 * Data schema (per entry):
 *   { name, spending, share?, changeRatio? }
 *   - name        : FOCUS service category name
 *   - spending    : number (in selected currency)
 *   - share       : 0~1 (proportion of total) — 用於 Top10 表格 Share 欄
 *   - changeRatio : -1~+inf — 用於 Top10 表格 Change 欄（+ red / − green）
 *   - 不傳 share / changeRatio → 表格欄顯示 '--'
 */
(function () {
  'use strict';

  // ===== CMDS Color Kit Main — ranking 1..10 color order =====
  // 對齊 FE rankingColor array (CostByFOCUSTreeMap.tsx)
  var RANK_COLORS = [
    '#9ED7FF', // rank 1 → CMDS #2 Sky Blue 30
    '#00DCC2', // rank 2 → CMDS #4 Green 60
    '#F3BE68', // rank 3 → CMDS #6 Tangerine Orange 40
    '#C096FF', // rank 4 → CMDS #10 Purple 40
    '#FE89C1', // rank 5 → CMDS #9 Fuchsia 30
    '#FFA4A9', // rank 6 → CMDS #8 Red 30
    '#F4B581', // rank 7 → CMDS #7 Lantern Orange 50
    '#94F29D', // rank 8 → CMDS #5 Emerald Green 40
    '#9CF3FF', // rank 9 → CMDS #3 Turquoise Blue 40
    '#7A8BA9', // rank 10 → CMDS #1 Navy Blue 50
  ];
  // Rank 11+ 按 RANK_COLORS 順序循環使用（不灰色 fallback）
  function getRankColor(rank) {
    if (rank < 1) return RANK_COLORS[0];
    var idx = (rank - 1) % RANK_COLORS.length;
    return RANK_COLORS[idx];
  }

  // ===== CSS injection =====
  var CSS = [
    /* Section wrapper: chart left + table right 452px fixed */
    '.lt-focus-section{display:grid;grid-template-columns:1fr 452px;gap:24px;align-items:stretch}',
    '.lt-focus-treemap{height:388px;background:#fff;border-radius:8px;overflow:hidden;position:relative;min-width:0}',
    /* table-wrap 改 scrollable，table 內維持標準 layout 讓 border-spacing 正常運作 */
    '.lt-focus-table-wrap{height:388px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;min-width:0;scrollbar-width:thin}',
    '.lt-focus-table-wrap::-webkit-scrollbar{width:6px}',
    '.lt-focus-table-wrap::-webkit-scrollbar-thumb{background:#CCCCCC;border-radius:3px}',
    '.lt-focus-table-wrap::-webkit-scrollbar-track{background:transparent}',
    /* Table — design spec 規範：row 25px 高 + 8px 間隔（per Kabin 2026-05-22）
       使用標準 table layout + border-spacing：8px（同 Top10）
       Scroll 由 wrap container 負責；thead 用 position:sticky 維持頂部固定 */
    '.lt-focus-table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:12px;table-layout:fixed}',
    '.lt-focus-table thead th{position:sticky;top:0;z-index:2}',
    '.lt-focus-table thead th{padding:0 10px;height:32px;text-align:left;font-weight:700;color:#262626;font-size:11px;background:#F2FAFF;border-bottom:none;letter-spacing:.2px;white-space:nowrap}',
    '.lt-focus-table thead tr th:first-child{border-radius:4px 0 0 4px}',
    '.lt-focus-table thead tr th:last-child{border-radius:0 4px 4px 0}',
    '.lt-focus-table thead th.tx-right{text-align:right}',
    '.lt-focus-table thead th.col-rank{width:60px;white-space:nowrap}',
    '.lt-focus-table thead th.col-name{width:auto}',
    '.lt-focus-table thead th.col-spend{width:80px}',
    '.lt-focus-table thead th.col-share{width:60px}',
    '.lt-focus-table thead th.col-change{width:72px}',
    /* tbody / tr 維持標準 table layout（display:table-row-group / display:table-row）讓 border-spacing 生效 */
    '.lt-focus-table td{padding:0 10px;height:25px;border-bottom:none;font-size:12px;color:#676767;vertical-align:middle;background:#fff}',
    '.lt-focus-table td.tx-right{text-align:right;font-weight:700}',
    '.lt-focus-table td.col-rank{color:#676767;font-weight:700;font-size:11px;width:60px;white-space:nowrap;letter-spacing:.2px}',
    '.lt-focus-table td.col-name{width:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:#262626}',
    '.lt-focus-table td.col-spend{width:80px;color:#0B6DD7;font-weight:700}',
    '.lt-focus-table td.col-share{width:60px;color:#262626;font-weight:700}',
    /* Change 欄（opt-in `showChange`；對齊 FE Top10CostByFOCUSTable：+ 紅 / − 綠 / 0 或 null 顯示 -- 並帶 tooltip） */
    '.lt-focus-table td.col-change{width:72px;font-weight:700;color:var(--lt-color-text-secondary,#676767);white-space:nowrap}',
    '.lt-focus-table td.col-change.is-up{color:var(--lt-color-error,#FF403D)}',
    '.lt-focus-table td.col-change.is-down{color:var(--lt-color-success,#00B5A6)}',
    '.lt-focus-table td.col-change .lt-focus-nocmp{cursor:help}',
    '.lt-focus-table tbody tr:hover td{background:#F6F6F6}',
    /* Tooltip styling for ECharts */
    '.lt-focus-tooltip{font-family:\'Noto Sans\',sans-serif;font-size:12px;line-height:1.5}',
    '.lt-focus-tooltip-name{font-weight:700;color:#262626;margin-bottom:4px;font-size:13px}',
    '.lt-focus-tooltip-val{color:#676767}',
    '.lt-focus-tooltip-val strong{color:#262626;font-weight:700}',
    /* Empty state for no-data */
    '.lt-focus-treemap.empty{display:flex;align-items:center;justify-content:center;background:#FAFCFE;border:1px dashed #E6E6E6;color:#B3B3B3;font-size:13px}',
    /* Responsive: stack on narrow screens */
    '@media(max-width:1200px){.lt-focus-section{grid-template-columns:1fr}.lt-focus-table-wrap{height:auto}.lt-focus-table tbody{max-height:none}}',
  ].join('');

  function _injectCSS() {
    if (document.getElementById('lt-focus-treemap-css')) return;
    var s = document.createElement('style');
    s.id = 'lt-focus-treemap-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  // Number abbreviation: 1234567 → "1.23M"; 12345 → "12.3K"; <1000 → "1234.56"
  function nFormat(n, fixed) {
    if (n === null || n === undefined || isNaN(n)) return '--';
    var abs = Math.abs(n);
    var sign = n < 0 ? '-' : '';
    var d = fixed === undefined ? 2 : fixed;
    if (abs >= 1e12) return sign + (abs / 1e12).toFixed(d) + 'T';
    if (abs >= 1e9)  return sign + (abs / 1e9 ).toFixed(d) + 'B';
    if (abs >= 1e6)  return sign + (abs / 1e6 ).toFixed(d) + 'M';
    if (abs >= 1e3)  return sign + (abs / 1e3 ).toFixed(d) + 'K';
    return sign + abs.toFixed(d);
  }

  function _resolveEl(elOrSelector) {
    if (typeof elOrSelector === 'string') return document.querySelector(elOrSelector);
    return elOrSelector;
  }

  // ===== Treemap render =====
  function _renderTreemap(el, data, opts) {
    if (typeof echarts === 'undefined') {
      console.error('[focus-treemap] ECharts not loaded — please include https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js');
      el.classList.add('empty');
      el.textContent = 'ECharts not loaded';
      return null;
    }

    // Exclude zero-cost entries (per PM rule)
    var nonZero = data.filter(function (d) { return d.spending > 0; });
    // Sort by spending descending to derive ranking
    nonZero.sort(function (a, b) { return b.spending - a.spending; });

    if (!nonZero.length) {
      el.classList.add('empty');
      el.textContent = opts.emptyText || 'No FOCUS cost data available';
      return null;
    }

    el.classList.remove('empty');

    var formattedData = nonZero.map(function (d, i) {
      var rank = i + 1;
      return {
        name: d.name,
        value: d.spending,
        _rank: rank,
        _share: d.share,
        itemStyle: { color: getRankColor(rank) },
      };
    });

    var chart = echarts.init(el);
    var symbol = opts.currencySymbol || '$';
    var currencyCode = opts.currency || '';

    chart.setOption({
      tooltip: {
        show: true,
        trigger: 'item',
        confine: true,
        borderWidth: 0,
        backgroundColor: '#FFFFFF',
        textStyle: { color: '#262626', fontSize: 12 },
        extraCssText: 'border-radius:6px;padding:10px 12px;max-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.12)',
        formatter: function (p) {
          var d = p.data;
          var share = (d._share != null) ? (d._share * 100).toFixed(2) + '%' : '--';
          return '<div class="lt-focus-tooltip">' +
                 '<div class="lt-focus-tooltip-name" style="color:#262626;font-weight:700;font-size:13px;margin-bottom:6px">' + _esc(d.name) + '</div>' +
                 '<div style="color:#676767;line-height:1.6">Spending: <strong style="color:#0B6DD7">' + symbol + nFormat(d.value) + ' ' + _esc(currencyCode) + '</strong></div>' +
                 '<div style="color:#676767;line-height:1.6">Share: <strong style="color:#262626">' + share + '</strong></div>' +
                 '<div style="color:#676767;line-height:1.6">Rank: <strong style="color:#262626">Top ' + d._rank + '</strong></div>' +
                 '</div>';
        },
      },
      series: [{
        type: 'treemap',
        data: formattedData,
        roam: false,
        nodeClick: false,
        breadcrumb: { show: false },          // 底部 index 不顯示
        top: 0, left: 0, right: 0, bottom: 0,
        width: '100%', height: '100%',
        itemStyle: { gapWidth: 4, borderRadius: 4, borderColor: '#fff', borderWidth: 0 },
        label: {
          show: true,
          position: 'inside',
          align: 'center',
          verticalAlign: 'middle',
          fontSize: 12, fontWeight: 700,
          color: '#FFFFFF',
          lineHeight: 18,
          // 面積過小 ECharts 預設會自動隱藏 label（min font size constraint）
          formatter: function (p) {
            return p.name + '\n' + symbol + nFormat(p.value);
          },
        },
        // 不做 drill-down upper label
        upperLabel: { show: false },
        levels: [{
          itemStyle: { borderColor: '#FFFFFF', borderWidth: 2, gapWidth: 2 },
        }],
      }],
    });
    return chart;
  }

  // ===== Top10 Table render =====
  function _renderTable(el, data, opts) {
    var nonZero = data.filter(function (d) { return d.spending > 0; });
    nonZero.sort(function (a, b) { return b.spending - a.spending; });
    // Default: show all (not just top 10). caller can pass limit
    var rows = opts.limit ? nonZero.slice(0, opts.limit) : nonZero;

    // 表格金額前綴預設跟 treemap 一樣；FE 的 Top10 表格其實不帶幣別前綴（幣別寫在卡片 `Cost (USD)`），
    // caller 可傳 tableSymbol:'' 對齊 FE，順便避免 `USD 31.24K` 在 80px 欄裡折行
    var symbol = (opts.tableSymbol !== undefined && opts.tableSymbol !== null) ? opts.tableSymbol : (opts.currencySymbol || '$');

    if (!rows.length) {
      el.innerHTML = '<div style="padding:24px;text-align:center;color:#B3B3B3;font-size:12px">No data</div>';
      return;
    }

    var showChange = !!opts.showChange;
    var noCompareTip = opts.noCompareTip || 'There is not enough data to compare to the previous period.';

    var thead =
      '<thead><tr>' +
        '<th class="col-rank">Rank</th>' +
        '<th class="col-name">Service Category</th>' +
        '<th class="col-spend tx-right">Spending</th>' +
        '<th class="col-share tx-right">Share</th>' +
        (showChange ? '<th class="col-change tx-right">Change</th>' : '') +
      '</tr></thead>';

    // Change 欄：對齊 FE Top10CostByFOCUSTable — 0 / null 都顯示 '--'（FE 用 !value 判斷）並帶 tooltip
    function changeCell(d) {
      var v = d.changeRatio;
      if (!v) return '<td class="col-change tx-right"><span class="lt-focus-nocmp" data-tip="' + _esc(noCompareTip) + '">--</span></td>';
      var cls = v > 0 ? ' is-up' : ' is-down';
      var txt = (v > 0 ? '+' : '-') + nFormat(Math.abs(v) * 100) + '%';
      return '<td class="col-change tx-right' + cls + '">' + _esc(txt) + '</td>';
    }

    var tbody = '<tbody>' + rows.map(function (d, i) {
      var rank = i + 1;
      var rankStr = 'Top ' + String(rank).padStart(2, '0');
      var spending = symbol + nFormat(d.spending);
      var share = (d.share != null) ? (d.share * 100).toFixed(2) + '%' : '--';
      return '<tr>' +
               '<td class="col-rank">' + _esc(rankStr) + '</td>' +
               '<td class="col-name" data-tip="' + _esc(d.name) + '">' + _esc(d.name) + '</td>' +
               '<td class="col-spend tx-right">' + _esc(spending) + '</td>' +
               '<td class="col-share tx-right">' + _esc(share) + '</td>' +
               (showChange ? changeCell(d) : '') +
             '</tr>';
    }).join('') + '</tbody>';

    el.innerHTML = '<table class="lt-focus-table">' + thead + tbody + '</table>';
  }

  // ===== Public API =====
  var _instances = [];

  function render(config) {
    _injectCSS();
    var tEl = _resolveEl(config.treemapEl);
    var bEl = _resolveEl(config.tableEl);
    if (!tEl) { console.warn('[focus-treemap] treemapEl not found'); return null; }
    if (!bEl) { console.warn('[focus-treemap] tableEl not found'); return null; }

    // 同一個 el 重繪：先清掉舊 instance（避免 echarts.init 警告 + resizeAll 打到已 dispose 的 chart）
    _instances = _instances.filter(function (i) {
      if (i.treemapEl !== tEl) return true;
      if (i.chart) i.chart.dispose();
      return false;
    });
    if (typeof echarts !== 'undefined') {
      var prev = echarts.getInstanceByDom(tEl);
      if (prev) prev.dispose();
    }

    var chart = _renderTreemap(tEl, config.data || [], {
      currency: config.currency,
      currencySymbol: config.currencySymbol,
      emptyText: config.emptyText,
    });

    _renderTable(bEl, config.data || [], {
      currency: config.currency,
      currencySymbol: config.currencySymbol,
      limit: config.tableLimit, // optional — default show all
      tableSymbol: config.tableSymbol,     // optional — 表格金額前綴（預設同 currencySymbol；Overview 傳 '' 對齊 FE）
      showChange: config.showChange,       // optional — 多一欄 Change（Overview 用；EI 預設不開，畫面不變）
      noCompareTip: config.noCompareTip,   // optional — Change 為 -- 時的 tooltip 文案
    });

    var instance = { chart: chart, treemapEl: tEl, tableEl: bEl, config: config };
    _instances.push(instance);
    return instance;
  }

  function resizeAll() {
    _instances.forEach(function (i) { if (i.chart) i.chart.resize(); });
  }

  window.addEventListener('resize', resizeAll);

  window.LumitureFocusTreemap = {
    render: render,
    resizeAll: resizeAll,
    RANK_COLORS: RANK_COLORS,
    getRankColor: getRankColor,
  };
})();

</script>

/* ============================================================

const cur = () => CURRENCY[state.currency] || CURRENCY.USD;
const cx = (usd) => (usd === null || usd === undefined) ? null : usd * cur().rate;   // convert
function fmtNum(n, fixed = 2) {
  return Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: fixed, maximumFractionDigits: fixed });
}
/* Guideline 數字縮寫規則：十萬以上才縮寫、一律兩位小數、未達門檻顯示千分位 */
function abbr(n, fixed = 2, prefix = '') {
  if (n === null || n === undefined || !isFinite(n)) return '--';
  const sign = n < 0 ? '-' : '';
  const a = Math.abs(n);
  if (a < 100000) return sign + prefix + fmtNum(a, fixed);
  const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  const u = units.find(([v]) => a >= v);
  return sign + prefix + fmtNum(a / u[0], fixed) + u[1];
}
/* 圖表軸標籤：FE getChartYAxisLabel(value, 0) — 千以上就縮寫、整數 */
function axisLabel(v) {
  if (!v) return '0';
  const a = Math.abs(v);
  if (a < 1000) return String(Math.round(v));
  const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  const u = units.find(([x]) => a >= x);
  const val = a / u[0];
  return (v < 0 ? '-' : '') + (val % 1 === 0 ? val : val.toFixed(2)) + u[1];
}
const money = (usd) => cur().symbol + fmtNum(cx(usd), 2);                 // tooltip 用完整金額
const pctStr = (r) => fmtNum(Math.abs(r) * 100, 2) + '%';
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const monthLabel = (y, m1) => `${MONTH_LABELS[m1 - 1]} ${y}`;
const isCurrentYear = () => state.period.year === CUR_YEAR;
/* FE generateCaptions：monthRangeCaption = Jan. yyyy - MMM. yyyy（同月則單一）；periodCaption 依 freq */
function monthRangeCaption() {
  const start = monthLabel(state.period.year, 1), end = monthLabel(state.period.year, state.period.month);
  return start === end ? start : `${start} - ${end}`;
}
const periodCaption = () => state.freq === 'month' ? monthLabel(state.period.year, state.period.month) : monthRangeCaption();

/* FE UpdateAt：times 03:00 / 09:00 / 15:00 / 21:00，取上一個與下一個 */
function updateTimes() {
  const times = ['03:00', '09:00', '15:00', '21:00'];
  const nowMin = NOW.getHours() * 60 + NOW.getMinutes();
  const mins = times.map(t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; });
  let prev = null, next = null;
  mins.forEach((m, i) => { if (m <= nowMin) prev = times[i]; if (next === null && m > nowMin) next = times[i]; });
  return { prev: prev || times[times.length - 1], next: next || times[0] };
}

/* ---- Derived data（照 FE 的計算邏輯） ---- */
function variant() { return DATA_VARIANTS[state.data] || DATA_VARIANTS.normal; }
/* actualToForecastIndex：當年 = 當月 idx + 1（當月算 actual）；非當年 = 12 */
function actualToForecastIndex() { return isCurrentYear() ? CUR_MONTH_IDX + 1 : 12; }
function yearlyCostUSD() {
  const scale = isCurrentYear() ? 1 : (state.period.year === CUR_YEAR - 1 ? 0.86 : 0.74);
  return MONTHLY_USD.map(v => v * scale);
}
function overviewOrg() {
  const v = variant();
  const y = yearlyCostUSD();
  const a2f = actualToForecastIndex();
  const actualMonths = y.slice(0, a2f);
  const curIdx = isCurrentYear() ? CUR_MONTH_IDX : 11;
  const currentMonth = y[curIdx];
  const lastMonth = curIdx > 0 ? y[curIdx - 1] : y[11] * 0.9;
  const avg = actualMonths.reduce((s, x) => s + x, 0) / actualMonths.length;
  const ytd = actualMonths.reduce((s, x) => s + x, 0);
  const cmp = (r) => v.compare ? r : null;
  return {
    totalCost: { budget: v.budget, yearly: y, a2f },
    threshold: { warning: v.warning, alert: v.alert },
    currentMonth: { cost: currentMonth, comparisonRate: cmp(currentMonth / lastMonth - 1) },
    lastMonth:    { cost: lastMonth,    comparisonRate: cmp(0.092) },
    monthlyAvg:   { cost: avg,          comparisonRate: cmp(0.041) },
    currentYear:  { cost: ytd,          comparisonRate: cmp(isCurrentYear() ? 0.127 : 0) },
  };
}
const groupTotal = (g) => (g.gcpCost || 0) + (g.awsCost || 0) + (g.azureCost || 0);
/* 完整排名（依總花費由高到低，FE generateSortedSeries 的結果）。主頁 Top 10 = 這份的前 10 名 */
function groupsForFreq() {
  const base = state.manyGroups ? GROUPS_MONTH.concat(MANY_EXTRA) : GROUPS_MONTH;
  const k = CUR_MONTH_IDX + 1;
  const list = state.freq === 'month' ? base : base.map((g, i) => {
    const j = YEAR_JITTER[i] || 1;
    return {
      groupName: g.groupName,
      gcpCost: g.gcpCost === null ? null : g.gcpCost * k * j,
      awsCost: g.awsCost === null ? null : g.awsCost * k * j,
      azureCost: g.azureCost === null ? null : g.azureCost * k * j,
      budget: g.budget === null ? null : g.budget * 12,
    };
  });
  return list.slice().sort((a, b) => groupTotal(b) - groupTotal(a));
}
function focusForFreq() {
  if (state.freq === 'month') return FOCUS_MONTH;
  const k = CUR_MONTH_IDX + 1;
  return FOCUS_MONTH.map((d, i) => ({ ...d, spending: d.spending * k * (1 + (i % 3) * 0.03) }));
}

/* ---- 排名圖共用：series、tooltip、Hovering 灰底（Top 10 與子頁 Full Group Spending Ranking 完全相同；稿：「定義與操作與 Overview 中的 Top 10 完全相同（包含 Hovering）」）
 * Kabin 2026-10-13 裁決：主頁 Top 10 也照子頁的稿（tooltip、灰底、堆疊順序、關進場動畫），兩邊共用下面這組函式。
 * ⚠ DEVIATION（主頁 Top 10）：FE 是 MUI 風 tooltip（列高 24、灰框 r8）、ECharts shadow 蓋滿整個 category、堆疊 GCP 貼軸、有進場動畫；這裡照稿註記「與子頁完全相同」 ---- */
/* 對稿裁決（2026-10-13）：堆疊順序照稿，Azure 貼軸（子頁最左、主頁最下）→ AWS → GCP；圖例與 tooltip 照稿維持 GCP → AWS → Azure（RANK_ORDER） */
const RANK_ORDER = ['gcp', 'aws', 'azure'];
const RANK_STACK = ['azure', 'aws', 'gcp'];
/* 對稿修正：Hovering 時柱子維持原色（稿 Bar 4 只在柱子後面墊灰底）；ECharts 預設 emphasis 會把滑到的那列柱子提亮（實測 Azure #308CE3→#349AF9），兩個 series 都關掉 */
function rankSeries(sorted) {
  const series = [];
  RANK_STACK.forEach(k => {
    const costs = sorted.map(g => g[`${k}Cost`]);
    if (!costs.some(v => typeof v === 'number')) return;
    series.push({ name: PLATFORM[k].label, type: 'bar', stack: 'cost', itemStyle: { color: PLATFORM[k].color }, emphasis: { disabled: true },

  });
  if (sorted.some(g => typeof g.budget === 'number')) {
    series.push({ name: 'Total Budget', type: 'bar', stack: 'budget', itemStyle: { color: CHART.totalBudget }, emphasis: { disabled: true }, data: sorted.map(g => cx(g.budget)) });
  }
  return series;
}
/* 圖例順序（照稿 GCP → AWS → Azure → Total Budget），跟堆疊順序分開 */
const rankLegendNames = (series) => RANK_ORDER.map(k => PLATFORM[k].label).filter(n => series.some(x => x.name === n)).concat(series.some(x => x.name === 'Total Budget') ? ['Total Budget'] : []);
/* Tooltip 照稿 Chart / Tooltip（#08）：r5、陰影 0 0 6 .2、無灰框；列高 18、列距 4；分隔線 #CCCCCC；
 * Total Budget／Remaining Budget 標籤 500；Remaining Budget 與色塊列同一條左緣（前面留 8+4 空位）。
 * Fable #2：min 240／max 580（比照 chartTip），標籤與金額都不准縮（IDR 年視角 Rp1,278,549,588.00 原本把 Remaining Budget 擠成 Remaining Budg）。
 * Fable #1 ⚠ 設計端暫擬：子頁 Y 軸照註記截成 …、主頁 X 軸截成 80px，tooltip 標題是讀得到全名的地方，所以標題不截、整段換行；
 * 標題用 width:0＋min-width:100% 不參與寬度計算，長名稱只會變高、不會把 tooltip 撐到 580。稿的 Title 是 224×18 單行（只畫了短名字）
 * ⚠ 未確認：稿的 tooltip 範例是「各雲各自對自己的預算變紅」（GCP 黑、AWS／Azure 紅），FE 也是逐雲預算；mock 只有團隊層級預算，團隊總花費 > 總預算時三雲一起變紅 */
function rankTip(title, rows, footer) {
  const row = (r, i) => `<div style="display:flex;align-items:center;gap:8px;height:18px;${i ? 'margin-top:4px;' : ''}"><span style="flex:1 0 auto;display:flex;align-items:center;white-space:nowrap;${r.lblStyle || ''}">${r.sw === undefined ? '' : `<span style="display:inline-block;width:8px;height:8px;margin-right:4px;flex-shrink:0;background:${r.sw}"></span>`}${r.label}</span><strong style="flex-shrink:0;font-weight:700;${r.valueStyle || ''}">${r.value}</strong></div>`;
  const hr = '<div style="height:1px;background:#CCCCCC;margin:8px 0 7px"></div>';
  return `<div style="min-width:240px;max-width:580px;box-sizing:border-box;padding:8px;background:#fff;border-radius:5px;box-shadow:0 0 6px rgba(0,0,0,.2);font-family:'Noto Sans',sans-serif;font-size:12px;line-height:18px;color:#262626">
    <div style="width:0;min-width:100%;font-weight:500;white-space:normal;overflow-wrap:anywhere">${esc(title)}</div>${hr}
    ${rows.map(row).join('')}${footer ? hr + footer.map(row).join('') : ''}</div>`;
}
function rankTooltip() {
  return { trigger: 'axis', appendToBody: true, confine: true, borderWidth: 0, backgroundColor: 'transparent', padding: 0, extraCssText: 'box-shadow:none',
    axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(0,0,0,0)' } },   // 灰底改由 attachRankBand() 用 graphic 畫（稿 Bar 4 是 48，ECharts 的 shadow 只能蓋滿整個 category）
    formatter: (params) => {
      const val = (p) => typeof p.value === 'number' ? p.value : (p.data && p.data.value) || 0;
      const clouds = params.filter(p => p.seriesName !== 'Total Budget')
        .sort((a, b) => RANK_ORDER.findIndex(k => PLATFORM[k].label === a.seriesName) - RANK_ORDER.findIndex(k => PLATFORM[k].label === b.seriesName));
      const total = params.find(p => p.seriesName === 'Total Budget');
      const totalCost = clouds.reduce((s, p) => s + val(p), 0), red = `color:${CHART.alert.main}`;
      const rows = clouds.map(p => ({ sw: p.color, label: p.seriesName, value: cur().symbol + fmtNum(val(p), 2), valueStyle: p.data && p.data.isOverrun ? red : '' }));
      let footer;
      if (total && typeof total.value === 'number' && total.value) {
        const left = total.value - totalCost;
        footer = [{ sw: total.color, label: 'Total Budget', lblStyle: 'font-weight:500', value: cur().symbol + fmtNum(total.value, 2) },
                  { sw: 'transparent', label: 'Remaining Budget', lblStyle: 'font-weight:500', value: (left < 0 ? '-' : '') + cur().symbol + fmtNum(Math.abs(left), 2), valueStyle: left < 0 ? red : '' }];
      } else footer = [{ label: 'Total Cost', lblStyle: 'font-weight:500', value: cur().symbol + fmtNum(totalCost, 2) }];
      return rankTip(params[0].axisValue, rows, footer);
    } };
}
/* Hovering 灰底照稿 Bar 4：#7C7C7C@10%，沿數值軸蓋滿繪圖區，沿類別軸只蓋「兩條柱＋前 7 後 8」（子頁 15+3+15 → 48），不是整個 category 帶。
 * 主頁 Top 10 是直條（柱 16、間隔 4）→ 寬 51（⚠ 設計端暫擬：主頁沒有自己的 Hovering 稿，照子頁的規則換算） */
function attachRankBand(chart, catAxis, groupPx) {
  const id = 'rank-band', hide = () => chart.setOption({ graphic: [{ id, type: 'rect', invisible: true, shape: { x: 0, y: 0, width: 0, height: 0 } }] });
  const show = (idx) => {
    const grid = chart.getModel().getComponent('grid').coordinateSystem.getRect();
    const c = Math.round(chart.convertToPixel(catAxis === 'y' ? { yAxisIndex: 0 } : { xAxisIndex: 0 }, idx)), t = groupPx + 15;
    const lo = c - Math.ceil(t / 2), shape = catAxis === 'y' ? { x: grid.x, y: lo, width: grid.width, height: t } : { x: lo, y: grid.y, width: t, height: grid.height };
    chart.setOption({ graphic: [{ id, type: 'rect', z: -1, silent: true, invisible: false, shape, style: { fill: CHART.shadow } }] });
  };
  chart.on('updateAxisPointer', (e) => { const a = (e.axesInfo || []).find(x => x.axisDim === catAxis); a ? show(a.value) : hide(); });
  chart.on('globalout', hide);
}

function routeFromHash() {

/* FE UpdateAt 只列時間；稿上子頁多了日期與 (UTC+0)。⚠ 未確認：主頁維持 FE 的「只有時間」，兩頁不一致，等 Kabin 決定哪邊為準 */
function rkUpdateTimes() {
  const pts = [];
  for (let d = -1; d <= 1; d++) [3, 9, 15, 21].forEach(h => pts.push(new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() + d, h, 0)));
  const prev = pts.filter(t => t <= NOW).pop(), next = pts.find(t => t > NOW);
  const f = (t) => `${pad2(t.getDate())}/${pad2(t.getMonth() + 1)}/${t.getFullYear()} ${pad2(t.getHours())}:00`;
  return { prev: f(prev), next: f(next) };
}
/* X 軸刻度：稿是 0–50K、每 5K 一格（10 格）。取「好讀的間距」讓最大值落在 10 格左右；main chart 與 X 軸列共用同一組數字才會對齊 */
function rkScale(groups) {
  let m = 0;
  groups.forEach(g => { m = Math.max(m, cx(groupTotal(g)), cx(g.budget || 0)); });
  if (!(m > 0)) return { max: 1, step: 1 };
  const raw = m / 10, pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * pow).find(x => x >= raw - 1e-9);
  return { max: Math.ceil(m / step - 1e-9) * step, step };
}
/* Y 軸標籤：最大寬 200px、最多兩行、超過以「…」取代（稿 #08 註記）。ECharts 的 lineOverflow 在 5.4 對 category 軸不生效（實測會排出三行），所以自己量字寬斷行 */
const _rkCtx = document.createElement('canvas').getContext('2d');
function rkWrapLabel(text, maxW) {
  _rkCtx.font = '400 12px "Noto Sans", sans-serif';
  const w = (t) => _rkCtx.measureText(t).width;
  const lines = []; let cur = '';
  text.split(' ').forEach(word => {
    const t = cur ? cur + ' ' + word : word;
    if (w(t) <= maxW) { cur = t; return; }
    if (cur) lines.push(cur);
    cur = word;
    while (w(cur) > maxW) { let i = cur.length; while (i > 1 && w(cur.slice(0, i)) > maxW) i--; lines.push(cur.slice(0, i)); cur = cur.slice(i); }   // 單一長字也要切
  });
  if (cur) lines.push(cur);
  if (lines.length <= 2) return lines.join('\n');
  let rest = lines.slice(1).join(' ');
  while (rest.length > 1 && w(rest + '…') > maxW) rest = rest.slice(0, -1);
  return lines[0] + '\n' + rest.trimEnd() + '…';
}

(function boot() {

 *   {

  // ===== HELPERS =====
  function _esc(s) {

  // Normalise scenario: tab → page (backwards compat)
  function _normalizedScenarios() {
    return (window.DEMO_SCENARIOS || []).map(function (s) {

  // Detect rendering mode based on what's configured

    var scenarios = _normalizedScenarios();
    var hasPages = (window.DEMO_PAGES && window.DEMO_PAGES.length) ||
                   scenarios.some(function (s) { return !!s.page; });
    var hasCats  = (window.DEMO_CATEGORIES && window.DEMO_CATEGORIES.length) ||
                   scenarios.some(function (s) { return !!s.category; });
    if (hasPages && hasCats) return 'two-layer';
    if (hasPages) return 'pages-only';
    if (hasCats)  return 'categories-only';
    return 'flat';

  // Auto-derive page list if DEMO_PAGES not provided

    if (window.DEMO_PAGES && window.DEMO_PAGES.length) return window.DEMO_PAGES;
    var seen = {};
    var pages = [];
    _normalizedScenarios().forEach(function (s) {
      if (s.page && !seen[s.page]) {
        seen[s.page] = true;
        pages.push({ id: s.page, label: s.page.charAt(0).toUpperCase() + s.page.slice(1), icon: 'tab' });
      }
    });
    return pages;
  }

  function _getCategories() {
    return window.DEMO_CATEGORIES || [];
  }

  // Filter scenarios for current page + category
  function _filterScenarios() {
    var scenarios = _normalizedScenarios();
    return scenarios.filter(function (s) {
      if (_activePage && s.page && s.page !== _activePage) return false;
      if (_activePage && !s.page) return false; // page-tab mode requires scenario to have page
      if (_activeCategory && s.category && s.category !== _activeCategory) return false;
      if (_activeCategory && !s.category) return false; // cat-tab mode requires scenario to have category
      return true;
    });
  }

  // ===== HTML BUILDERS =====
  function _renderButtons(scenarios) {
    if (!scenarios.length) {

    }
    var normal = scenarios.filter(function (s) { return !s.isNoData; });
    var noData = scenarios.filter(function (s) { return s.isNoData; });
    var html = '';
    if (normal.some(function (s) { return !!s.group; })) {
      var order = [];
      normal.forEach(function (s) { var g = s.group || ''; if (order.indexOf(g) < 0) order.push(g); });
      order.forEach(function (g) {
        if (g) html += '<div class="demo-grp-sep">' + _esc(g) + '</div>';
        html += _renderGroup(normal.filter(function (s) { return (s.group || '') === g; }));
      });
    } else {
      html = _renderGroup(normal);
    }
    if (noData.length) {
      html += '<div class="demo-sub-sep">no data</div>' + _renderGroup(noData);
    }
    return html;
  }

  function _renderGroup(scenarios) {
    if (!scenarios.length) return '';

      var act = s.id === _activeScenario ? ' active' : '';
      var tip = s.tip ? ' data-tip="' + _esc(s.tip) + '"' : '';

             ' data-scenario="' + _esc(s.id) + '">' +
             '<span class="material-symbols-outlined">' + _esc(s.icon || 'play_arrow') + '</span>' +

  function _renderPageTabs(mode) {

    var isTwoLayer = mode === 'two-layer';
    var wrapClass = isTwoLayer ? 'demo-page-tabs' : 'demo-cat-tabs';
    var tabClass  = isTwoLayer ? 'demo-page-tab' : 'demo-cat-tab';
    return '<div class="' + wrapClass + '">' + pages.map(function (p) {
      var act = p.id === _activePage ? ' active' : '';
      return '<button class="' + tabClass + act + '" data-page="' + _esc(p.id) + '">' +
             (p.icon ? '<span class="material-symbols-outlined">' + _esc(p.icon) + '</span>' : '') +
             _esc(p.label) +

  function _renderCategoryTabs() {
    var cats = _getCategories();
    if (!cats.length) return '';
    return '<div class="demo-cat-tabs">' + cats.map(function (c) {

      return '<button class="demo-cat-tab' + act + '" data-category="' + _esc(c.id) + '">' +
             (c.icon ? '<span class="material-symbols-outlined">' + _esc(c.icon) + '</span>' : '') +
             _esc(c.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderHint() {
    if (!_activeCategory) return '';

    return '<div class="demo-pane-hint">' + _esc(cat.hint) + '</div>';

  function _renderScrollArea() {
    return _renderHint() + _renderButtons(_filterScenarios());

  // ===== DOM MOUNTING =====
  function _render() {
    if (document.getElementById('demo-fab')) return;

    // Auto-detect first page & category
    var mode = _detectMode();
    var pages = _getPages();
    var cats = _getCategories();
    if (!_activePage && pages.length) _activePage = pages[0].id;
    if (!_activeCategory && cats.length) _activeCategory = cats[0].id;
    if (mode === 'flat') { _activePage = null; _activeCategory = null; }
    if (mode === 'pages-only') _activeCategory = null;
    if (mode === 'categories-only') _activePage = null;

    // FAB
    var fabEl = document.createElement('button');
    fabEl.className = 'demo-fab';
    fabEl.id = 'demo-fab';
    fabEl.setAttribute('data-tip', 'Designer Demo Scenarios');   /* 原生 title 改 data-tip（#gl-tip），B 區 A-15 */
    fabEl.innerHTML =

      '<span class="demo-pulse" id="demo-fab-pulse"></span>';

      var fab = document.getElementById('demo-fab');

      if (!pop.contains(e.target) && !fab.contains(e.target) && pop.classList.contains('show')) {
