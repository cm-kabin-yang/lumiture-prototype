/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */
  --lt-shadow-chip:   0 2px 4px 0 rgba(0, 0, 0, 0.3);            /* chip / tag 用，較深 opacity */
  --lt-shadow-dialog: 0 0 6px 0 rgba(0, 0, 0, 0.2);              /* Card / Dialog / Dropdown 共用；無 offset */
  --lt-shadow-overlay:        0 4px 12px rgba(0, 0, 0, 0.14);    /* CMDS 未涵蓋；popover / floating menu */
  --lt-shadow-overlay-strong: 0 4px 16px rgba(0, 0, 0, 0.18);    /* CMDS 未涵蓋；drawer / 較重 overlay */

  /* --- Transition --- */
  --lt-transition-fast: .15s ease;
  --lt-transition-base: .2s ease;
  --lt-transition-slow: .3s ease;

  /* --- Z-index --- */
  --lt-z-base:     0;
  --lt-z-elevated: 10;
  --lt-z-sticky:   100;
  --lt-z-dropdown: 1000;
  --lt-z-modal:    2000;
  --lt-z-tooltip:  3000;
  --lt-z-toast:    4000;


  /* ============================================================
   * LAYER 2 — SEMANTIC
   * 語意層：引用 primitive，描述用途；component 預設用此層
   * ============================================================ */

  /* --- Color: Brand --- */
  --lt-color-primary:         var(--lt-blue-70);
  --lt-color-primary-hover:   var(--lt-blue-60);
  --lt-color-primary-active:  var(--lt-blue-90);
  --lt-color-primary-bg:      var(--lt-blue-10);
  --lt-color-primary-bg-emphasized: var(--lt-blue-20);

  --lt-color-secondary:       var(--lt-turquoise-70);
  --lt-color-secondary-hover: var(--lt-turquoise-60);
  --lt-color-secondary-bg:    var(--lt-turquoise-10);

  /* --- Color: Functional (alias) --- */
  --lt-color-success: var(--lt-color-success-base);
  --lt-color-error:   var(--lt-color-error-base);
  --lt-color-warning: var(--lt-color-warning-base);
  --lt-color-info:    var(--lt-color-info-base);

  /* --- Color: Text --- */
  --lt-color-text-primary:   var(--lt-grey-700);   /* 內文預設 */
  --lt-color-text-secondary: var(--lt-grey-500);   /* 次要文字 */
  --lt-color-text-tertiary:  var(--lt-grey-400);   /* hint / placeholder */
  --lt-color-text-disabled:  var(--lt-grey-400);
  --lt-color-text-inverse:   var(--lt-white);
  --lt-color-text-link:      var(--lt-blue-60);
  --lt-color-text-heading:   var(--lt-grey-800);   /* 為未來 heading 獨立換色預留 */
  --lt-color-text-icon:      var(--lt-grey-600);   /* 為未來 icon 獨立換色預留 */

  /* --- Color: Background --- */
  --lt-color-bg-default:    var(--lt-white);
  --lt-color-bg-subtle:     var(--lt-grey-50);
  --lt-color-bg-emphasized: var(--lt-grey-100);
  --lt-color-bg-disabled:   var(--lt-grey-100);
  --lt-color-bg-inverse:    var(--lt-blue-90);
  --lt-color-bg-overlay:    rgba(0, 0, 0, 0.5);
  --lt-color-bg-skeleton:   var(--lt-grey-200);   /* 骨架屏；2026-09-24 定，對應前端 gray.skeleton → gray.10；用途命名，日後可單獨換色 */

  /* --- Color: Border --- */
  --lt-color-border-default: var(--lt-grey-200);
  --lt-color-border-strong:  var(--lt-grey-300);
  --lt-color-border-focus:   var(--lt-color-primary);
  --lt-color-border-input:   #DCE3EC;   /* prototype --tf-border；略不同於 grey-200 */
  --lt-color-border-error:   var(--lt-color-error-base);


  /* ============================================================
   * LAYER 3 — COMPONENT
   * 元件層：給特定元件使用；引用 semantic
   * ============================================================ */

  /* --- Sidebar (深海軍藍) --- */
  --lt-sidebar-width:      250px;
  --lt-sidebar-bg:         var(--lt-blue-90);
  --lt-sidebar-text:       rgba(255, 255, 255, 0.85);
  --lt-sidebar-text-muted: rgba(255, 255, 255, 0.50);
  --lt-sidebar-hover-bg:   rgba(255, 255, 255, 0.06);
  --lt-sidebar-active-bg:  var(--lt-color-primary);

  /* --- Topbar --- */
  --lt-topbar-bg:     var(--lt-white);
  --lt-topbar-shadow: var(--lt-shadow-dialog);   /* CMDS Dialog shadow（Card 級別 elevation）*/

  /* --- Card --- */
  --lt-card-bg:      var(--lt-color-bg-default);
  --lt-card-radius:  var(--lt-radius-md);
  --lt-card-shadow:  var(--lt-shadow-dialog);    /* CMDS 明確規範 Card 用 Dialog shadow */
  --lt-card-padding: var(--lt-space-24);

  /* --- Button --- */
  --lt-button-radius:     var(--lt-radius-sm);
  --lt-button-padding-x:  var(--lt-space-16);
  --lt-button-padding-y:  var(--lt-space-8);
  --lt-button-focus-ring: 0 0 0 3px rgba(0, 79, 176, 0.10);

  /* --- Input / Text Field --- */
  --lt-input-bg:        var(--lt-color-bg-default);
  --lt-input-border:    var(--lt-color-border-input);
  --lt-input-radius:    var(--lt-radius-sm);
  --lt-input-padding-x: var(--lt-space-16);
  --lt-input-padding-y: var(--lt-space-8);

  /* --- Modal --- */
  --lt-modal-radius:   var(--lt-radius-lg);
  --lt-modal-shadow:   var(--lt-shadow-dialog);  /* CMDS Dialog shadow（Modal = Dialog 同類）*/
  --lt-modal-padding:  var(--lt-space-24);
  --lt-modal-backdrop: rgba(0, 0, 0, 0.5);

  /* --- Tooltip --- */
  --lt-tooltip-bg:      #31383E;            /* 2026-10-09 Kabin 裁決改成 Figma 量到的值（原 #3C3C3C）；對齊 Lumiture-Guideline.md 規範；非品牌色，刻意不引用 brand token */
  --lt-tooltip-text:    var(--lt-white);
  --lt-tooltip-radius:  var(--lt-radius-sm);
  --lt-tooltip-padding: var(--lt-space-8);
}


/* ============================================================
 * NOT YET DEFINED (Pass 3+)
 * ============================================================
 * - ~~Chart palette~~ ✅ 已加入（2026-05-12 從 Figma General Behavior file audit）
 * - Gradient tokens (Figma 有 Lumiture.ai Blue / Orange / Lemon C 等)
 * - Opacity tokens (Figma 有 CM Opacity Color 系列)
 * - Composite typography tokens (--lt-type-h1, --lt-type-body 等 style sets)
 * - Focus / Inset shadow 特殊變體
 * - Dark mode 對應 token
 *
 * Shadow 結構待 Figma audit：v7/v8 用單層、tokens.css 主階用雙層；Overlay 已用單層作折衷
 * ============================================================ */

</style>
<style>
/* ============================================================
 * Audit Log — route `/organization-settings/audit-log`（Organization Settings → Audit Log）
 * 這頁沒有 Figma 設計稿。依據（Kabin 2026-10-14 拍板）：
 *   基準＝FE 08-11 快照 `(organization-settings)/audit-log/`（行為、欄位、篩選、文案、狀態）＋ PRD `prd/organization-settings/audit-log/README.md`
 *   樣式＝翻成 Lumiture CMDS（tokens.css ＋ 既有已對稿頁面的元件寫法），不照 sandbox POC
 *   FE 與 PRD 不一致時照 FE；差異列在 PORTFOLIO_LOG.md／回報
 * 設計方案：specs/2026-10-14-audit-log-v2-polish-proposals.md 的 5 點全部做成「UX 提案」（預設顯示；Demo FAB「UX 提案」可逐點或整批切回 FE 現況）
 *   點 1 篩選列（A）／點 2 失敗登入（B）／點 3 User 篩選（A）／點 4 自訂時間（A）／點 5 欄位順序（A）
 *   2026-10-14 Kabin 裁決再加兩點：點 6 Status 篩選（只在 Login Activity）／點 7 Timestamp 表頭標時區（UTC±H，照瀏覽器）
 * 標記慣例：⚠ DEVIATION＝偏離 FE；⚠ 設計端暫擬＝FE／PRD 都沒有、自己補的；⚠ 未確認＝規則不明；⏸ PARKED＝UX 提案（登記在 specs/parked-designs.md）
 * ============================================================ */

/* ---- 頁面層 token：tokens.css 缺的補在這裡（待收錄）----
 * ⚠ 設計端暫擬：tokens.css 沒有 error dark／error row hover。#BF302E 是 Guideline「CM General Color」Error Dark（Overview v1 也在頁面層補過 --ov-color-error-dark，建議這次一起收進 tokens.css）；#FFD1D8 是 Guideline Error Light 的下一階 */
:root{
  --al-error-dark:#BF302E;
  --al-error-row-hover:#FFD1D8;
  --al-field-border:var(--lt-grey-300);
  --al-radius-field:5px;
  --al-scroll-thumb:#D8D8D8;
  --al-toast-ok:#008F88;
  --al-toast-err:#BF302E;
  --al-amber-text:#8A5300;   /* 同 LumiTag v10 .v9-parked-badge.is-proposal */
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none}
body{font-family:var(--lt-font-sans);font-size:var(--lt-fs-14);line-height:var(--lt-leading-body);color:var(--lt-color-text-primary);background:var(--lt-color-primary-bg);letter-spacing:var(--lt-tracking-normal)}
a{color:var(--lt-color-primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:var(--lt-fs-14);letter-spacing:0;color:inherit}
input{font-family:inherit}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20;vertical-align:middle;user-select:none}
.icon-outline{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}
[hidden]{display:none!important}

/* ===== App layout（FE：VStack gap 6＝24；內容區 padding 32）===== */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:var(--lt-space-32);flex:1;display:flex;flex-direction:column;gap:var(--lt-space-24);min-width:0}

/* ===== Buttons（Button/M：36h、圓角 5、14/700）===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--lt-space-4);min-width:80px;padding:0 var(--lt-button-padding-x);height:36px;border-radius:var(--al-radius-field);font-weight:var(--lt-fw-bold);font-size:var(--lt-fs-14);line-height:1.5;white-space:nowrap;border:1px solid transparent;transition:background-color var(--lt-transition-fast),border-color var(--lt-transition-fast),color var(--lt-transition-fast)}
.btn-p{background:var(--lt-color-primary);color:var(--lt-color-text-inverse)}
.btn-p:hover{background:var(--lt-color-primary-hover)}
.btn-p:active{background:var(--lt-color-primary-active)}
.btn-o{background:var(--lt-color-bg-default);color:var(--lt-color-primary);border-color:var(--lt-color-primary)}
.btn-o:hover{background:var(--lt-color-bg-subtle);color:var(--lt-color-primary-hover);border-color:var(--lt-color-primary-hover)}
.btn .material-symbols-outlined{font-size:18px}
.btn:disabled,.btn.is-disabled{background:var(--lt-grey-300)!important;color:#fff!important;border-color:transparent!important;cursor:not-allowed}
.btn.btn-o:disabled{background:#fff!important;color:var(--lt-grey-300)!important;border-color:var(--lt-grey-300)!important}
.btn:focus-visible,.lnk:focus-visible,.sel:focus-visible,.dtrig:focus-visible{outline:none;box-shadow:var(--lt-button-focus-ring)}
/* Text button（FE `variant="link"`）：hover 底線只套文字，icon 不畫底線 */
.lnk{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 4px;font-weight:var(--lt-fw-bold);color:var(--lt-color-primary);white-space:nowrap}
.lnk:hover{color:var(--lt-color-primary-hover)}
.lnk:hover .t{text-decoration:underline}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;flex-shrink:0}
@keyframes rot{to{transform:rotate(360deg)}}

/* ===== Page header（FE `Typography variant="h4"`＋ bodyMedium secondary，gap 0.5）===== */
/* ⚠ DEVIATION: FE 這頁標題是 MUI h4（20px）；Guideline 規定頁面標題 H3 24px。Kabin 2026-10-14 裁決：用 24px（沒有 Figma 稿，以 Guideline 為準）*/
.hdr-block{display:flex;flex-direction:column;gap:2px}
.pg-title{font-size:var(--lt-fs-24);font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading);line-height:36px}
.pg-desc{font-size:var(--lt-fs-14);line-height:24.5px;color:var(--lt-color-text-secondary)}
.tabrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ===== Tab（FE `ToggleGroup`，放在卡片外、跟 Export CSV 同一列；選中 primary.light20 底＋primary.dark 字）===== */
.tg{display:inline-flex;height:36px;border:1px solid var(--lt-grey-300);border-radius:6px;overflow:hidden;background:#fff;flex-shrink:0}
.tgb{display:inline-flex;align-items:center;gap:8px;justify-content:center;height:34px;padding:0 16px;color:var(--lt-grey-500);font-weight:var(--lt-fw-medium);transition:background var(--lt-transition-fast);white-space:nowrap}
.tgb+.tgb{border-left:1px solid var(--lt-grey-300)}
.tgb:hover{background:var(--lt-grey-50)}
.tgb.on{background:var(--lt-blue-20);color:var(--lt-blue-90)}
.tgb.on:hover{background:var(--lt-blue-20)}
.tgb:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(0,79,176,.35)}
.tg.is-disabled .tgb{color:var(--lt-grey-400);cursor:not-allowed;background:#fff}

/* ===== Card（FE `Paper padding 6`＝24；VStack gap 4＝16）===== */
.card{background:var(--lt-card-bg);border-radius:var(--lt-card-radius);box-shadow:var(--lt-card-shadow);padding:var(--lt-card-padding);display:flex;flex-direction:column;gap:16px;min-width:0}
.card.is-full{min-height:520px}

/* ===== 篩選列 ===== */
.fwrap{position:relative}
/* FE：HStack justifyContent="space-between"（flexWrap 預設 wrap）→ 搜尋框一掉行就會跳到左下角（Fable §1 估算 1366／1280 展開 sidebar 都會掉） */
.fbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-start}
.fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.fsel{display:flex;flex-wrap:wrap;gap:8px}
/* ⏸ PARKED（UX 提案 點 1）：搜尋框一律靠右（掉到第二行也靠右，不貼左） */
.ux-p1 .fbar{justify-content:flex-start}
.ux-p1 .fs{margin-left:auto;flex:1 1 200px;max-width:240px}
.ux-p1 .fs .search{width:100%}
/* 點 6 加了第四個下拉之後：下拉觸發欄維持 FE 的 140（Kabin 2026-10-14 裁決，不縮）。1280（sidebar 展開、卡片內寬 918）各篩選都有選值時放不下單列，搜尋框換到第二行並靠右（flex-wrap＋margin-left:auto）；1440 以上仍單列。截斷的觸發欄文字靠 tooltip。 */
.fs{display:flex;flex-direction:column;gap:4px}
.search{display:flex;align-items:center;gap:6px;height:36px;width:240px;padding:0 12px;border:1px solid var(--al-field-border);border-radius:var(--al-radius-field);background:#fff;transition:border-color var(--lt-transition-fast),box-shadow var(--lt-transition-fast)}
.search:hover{border-color:var(--lt-grey-400)}
.search:focus-within{border-color:var(--lt-color-border-focus);box-shadow:var(--lt-button-focus-ring)}
.search.err{border-color:var(--lt-color-error)}
.search input{border:none;outline:none;background:none;width:100%;min-width:0;font-size:var(--lt-fs-14);color:var(--lt-color-text-primary)}
.search input::placeholder{color:var(--lt-grey-400)}
/* ⚠ DEVIATION: FE 搜尋框的 search icon 在右（endAdornment）；CMDS Text Field Search 變體＝icon 在左（同 rightsizing v2 .rs-search，Kabin 2026-10-14 裁決）。篩選列搜尋框與下拉內建搜尋一律 icon 在左、18px */
.search .material-symbols-outlined{font-size:18px;flex-shrink:0;color:var(--lt-grey-500);font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}
.search.is-disabled{background:var(--lt-grey-100);border-color:var(--lt-grey-200)}
.help-err{font-size:12px;line-height:18px;color:var(--lt-color-error)}
/* 下拉觸發欄（MultiSelect／GroupedMultiSelect：width 140、36h）*/
.sel{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px;padding:0 10px;background:#fff;border:1px solid var(--al-field-border);border-radius:var(--al-radius-field);font-size:var(--lt-fs-14);color:var(--lt-color-text-primary);cursor:pointer;text-align:left;width:140px;flex-shrink:0;min-width:0;transition:border-color var(--lt-transition-fast),box-shadow var(--lt-transition-fast)}
.sel-wrap{position:relative;display:inline-flex}
.sel-wrap .pk-badge.abs{left:0;top:-22px}   /* 點 6 的 badge 掛在 Status 觸發欄上緣（卡片上內距，不改版面）*/
.sel .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sel .ph{color:var(--lt-grey-400)}
.sel:hover{border-color:var(--lt-grey-400)}
.sel.open{border-color:var(--lt-color-border-focus);box-shadow:var(--lt-button-focus-ring)}
.tri{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--lt-grey-500);flex-shrink:0}
.sel.open .tri{transform:rotate(180deg)}
.sel:disabled,.dtrig:disabled{background:var(--lt-grey-100);border-color:var(--lt-grey-200);color:var(--lt-grey-400);cursor:not-allowed}
.sel:disabled .tri{border-top-color:var(--lt-grey-300)}
/* 日期觸發欄（FE `DatePickerCustomInput`：高 36、左右內距 16、圓角 6、calendar icon 20＋兩段日期＋east icon 16）*/
.dtrig{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;background:#fff;border:1px solid var(--al-field-border);border-radius:6px;color:var(--lt-color-text-secondary);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background var(--lt-transition-fast),border-color var(--lt-transition-fast)}
.dtrig:hover{background:var(--lt-grey-50)}
.dtrig:active{background:var(--lt-grey-200)}   /* FE DatePickerCustomInput：hover gray.hover、active gray.selected */
.dtrig.open{border-color:var(--lt-color-border-focus);box-shadow:var(--lt-button-focus-ring)}
.dtrig .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;color:var(--lt-grey-500)}
.dtrig .ci{font-size:20px}
.dtrig .ar{font-size:16px;color:var(--lt-grey-400)}   /* FE：east icon 用 text.hint #B3B3B3，calendar icon 用 text.secondary */
.dtrig .dv{min-width:80px;text-align:center;color:var(--lt-color-text-secondary)}   /* FE：Typography 繼承 StyledButton 的 text.secondary */
.dtrig .dv.empty{color:var(--lt-grey-400)}
.dtrig .lab{color:var(--lt-color-text-primary)}
/* 點 1：Review #3 補回 16px，讓 1280（sidebar 展開）有篩選時也單列：Clear filter 內距 4→0、觸發欄內距 16→12（同 Guideline Text Field M）、圓角 5、icon 18、gap 6 */
.ux-p1 .lnk{padding:0}
.ux-p1 .dtrig{padding:0 12px;border-radius:5px;gap:6px}
.ux-p1 .dtrig .ci{font-size:18px}   /* 點 1／4：快捷範圍只顯示標籤（All Time／Last 7 Days…） */

/* ===== 下拉選單／日期 popover（fixed，掛在 #pop-root）===== */
.mm{position:fixed;z-index:calc(var(--lt-z-dropdown) + 1);background:#fff;border:1px solid var(--lt-grey-200);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.1);display:flex;flex-direction:column;overscroll-behavior:contain;max-height:min(420px,calc(100vh - 24px));font-size:var(--lt-fs-14)}
.mm-s{padding:8px;border-bottom:1px solid var(--lt-grey-200);flex-shrink:0}
.mm-s .search{width:100%;height:36px}
.mm-list{overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1}
.mm-row{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;cursor:pointer;color:var(--lt-color-text-primary);user-select:none}
.mm-row:hover{background:var(--lt-grey-50)}
.mm-row .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-all{border-bottom:1px solid var(--lt-grey-200);flex-shrink:0}
/* GroupedMultiSelect：群組列 primary.light10 底、checkbox、計數、收合鈕 */
.mm-g{background:var(--lt-blue-10);font-weight:var(--lt-fw-bold)}   /* Review #18：FE GroupHeader 700 */
.mm-g:hover{background:var(--lt-blue-20)}
.mm-g .chev{font-size:20px;color:var(--lt-color-primary);font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;transition:transform var(--lt-transition-fast)}
.mm-g.open .chev{transform:rotate(180deg)}
.mm-row:focus-visible,.mm-row:focus{outline:none;background:var(--lt-grey-200)}   /* Guideline Dropdown：鍵盤焦點 #E6E6E6 */
.mm-g:focus-visible,.mm-g:focus{background:var(--lt-blue-20);box-shadow:inset 0 0 0 2px rgba(0,79,176,.35)}
.mm-i{padding-left:36px}
.mm-i .rl{font-size:12px;color:var(--lt-grey-400)}
.mm-empty{padding:24px 12px;text-align:center;color:var(--lt-color-text-secondary)}
.mm-note{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 0;flex-shrink:0}

/* 日期 popover：左月曆、右快捷清單。2026-10-14 對齊 FE 已實作的共用元件（逐項依據見 specs/2026-10-14-audit-log-v1-review.md §4 第 7 題對照表）：
 *   DatePickerWithQuickRange/QuickRangeList.tsx（外框 radius 6、shadow、高 364、左窗 padding 20、清單 minWidth 130）
 *   DatePicker/BasicDatePicker.tsx（格子 38 寬、day 高 26、列距 16、range 整段實心 primary 白字、端點外側 radius 5、今天 1px primary 框、hover #F6F6F6）
 *   DatePicker/CustomHeader.tsx（高 36、下框 gray.border、h6「MMM yyyy」、雙箭頭＋單箭頭、icon primary）
 *   DatePickerWithQuickRange/QuickRangeItem.tsx（700 primary、hover light10＋primary.light、selected light20＋primary.dark、radius 5） */
.dp{position:fixed;z-index:calc(var(--lt-z-dropdown) + 1);background:#fff;border-radius:6px;box-shadow:var(--lt-shadow-dialog);overscroll-behavior:contain;display:flex;flex-direction:column}
.dp-main{display:flex;height:364px}
.cal{width:306px;padding:20px;flex-shrink:0}
.cal-h{display:flex;align-items:center;justify-content:space-between;height:36px;padding-bottom:10px;border-bottom:1px solid var(--lt-grey-300)}
.cal-t{margin:auto;font-size:var(--lt-fs-16);font-weight:var(--lt-fw-bold);line-height:24px;color:var(--lt-color-text-primary)}
.cal-nav{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--lt-color-primary)}
.cal-nav:hover:not(:disabled){background:rgba(0,79,176,.04)}
.cal-nav:disabled{color:#9E9E9E;cursor:not-allowed}
.cal-nav .material-symbols-outlined{font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}
.cal-g{display:grid;grid-template-columns:repeat(7,38px);row-gap:16px}
.cal-wk{display:grid;grid-template-columns:repeat(7,38px);margin:22px 0 12px}
.cal-w{width:38px;line-height:18px;text-align:center;font-size:var(--lt-fs-14);color:var(--lt-blue-90)}
.cal-d{width:38px;height:26px;display:flex;align-items:center;justify-content:center;font-size:var(--lt-fs-14);line-height:18px;font-weight:var(--lt-fw-regular);cursor:pointer;color:var(--lt-color-text-primary);position:relative;border:0;background:none;font-family:inherit;border-radius:0}
.cal-d:hover:not(.dis):not(.td):not(.s1):not(.r){width:26px;margin:0 6px;border-radius:5px;background:var(--lt-grey-50)}
.cal-d:focus-visible{outline:2px solid rgba(0,79,176,.55);outline-offset:1px;z-index:1}
.qi:focus-visible,.cal-nav:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(0,79,176,.45)}
.cal-d.dis{color:var(--lt-grey-300);cursor:not-allowed}
.cal-d.blank{cursor:default;visibility:hidden}
/* 今天：26×26、1px primary 框、primary 字、radius 5（BasicDatePicker `react-datepicker__day--today`）*/
.cal-d.td{width:26px;margin:0 6px;border:1px solid var(--lt-color-primary);border-radius:5px;color:var(--lt-color-primary);line-height:1}
.cal-d.td.dis{border:0;color:var(--lt-grey-300)}
/* 只選了起日（selected 單選）：26×26 實心 primary、白字、radius 5 */
.cal-d.s1{width:26px;margin:0 6px;border-radius:5px;background:var(--lt-color-primary);color:#fff;border:0}
/* range：整段（含起訖）實心 primary、白字、格寬 38 無間隙；列首／列尾與起訖外側 radius 5。起訖同一天＝26×26 */
.cal-d.r{background:var(--lt-color-primary);color:#fff;border:0}
.cal-d.r.td{width:38px;margin:0;border:0;line-height:18px}
.cal-d.r.rl{border-top-left-radius:5px;border-bottom-left-radius:5px}
.cal-d.r.rr{border-top-right-radius:5px;border-bottom-right-radius:5px}
.cal-d.r.rb{width:26px;margin:0 6px;border-radius:5px}
.ql{min-width:130px;padding:16px 8px;display:flex;flex-direction:column;flex-shrink:0}
.qi{display:flex;align-items:center;margin-bottom:4px;padding:4px 12px;line-height:24.5px;border-radius:5px;cursor:pointer;text-align:left;width:100%;white-space:nowrap;font-weight:var(--lt-fw-bold);color:var(--lt-color-primary)}
.qi:hover{background:var(--lt-blue-10);color:var(--lt-blue-60)}
.qi.on{background:var(--lt-blue-20);color:var(--lt-blue-90)}
.dp-f{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--lt-grey-200)}
.dp-f .r{margin-left:auto;display:flex;gap:8px}
.dp-f .btn{min-width:80px}
.dp-hd{display:flex;padding:8px 16px 0}

/* ===== Table（Guideline：Header＋Cell 各 50px、最多 10.5 行內捲、header sticky、header #F2FAFF）===== */
.tblwrap{position:relative;min-width:0}
.tbl-scroll{--cols:1fr;--minw:900px;max-height:575px;overflow-y:scroll;overflow-x:auto;overscroll-behavior:contain;position:relative;border:1px solid var(--lt-grey-200);border-radius:4px;background:linear-gradient(#F2FAFF 0,#F2FAFF 49px,#B3B3B3 49px,#B3B3B3 50px,#fff 50px)}
.tbl-scroll::-webkit-scrollbar{width:15px;height:15px}
.tbl-scroll::-webkit-scrollbar-track{background:#fff;box-shadow:inset 1px 0 #E6E6E6,inset -1px 0 #E6E6E6}
.tbl-scroll::-webkit-scrollbar-track:vertical{margin-top:50px}
.tbl-scroll::-webkit-scrollbar-track:horizontal{box-shadow:inset 0 1px #E6E6E6,inset 0 -1px #E6E6E6}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--al-scroll-thumb);border:solid transparent;border-width:0 2px 0 3px;background-clip:padding-box;border-radius:2px;box-shadow:inset 0 0 0 1px #E6E6E6}
.tbl-scroll::-webkit-scrollbar-thumb:horizontal{border-width:3px 0 2px 0}
.tbl-scroll::-webkit-scrollbar-corner{background:#fff}
.tr{display:grid;grid-template-columns:var(--cols);min-width:var(--minw)}
.td,.th{height:50px;padding:0 16px;display:flex;align-items:center;min-width:0;background:#fff;border-bottom:1px solid var(--lt-grey-200);font-size:var(--lt-fs-14);line-height:24.5px;color:var(--lt-color-text-primary)}
.th{white-space:nowrap;background:var(--lt-color-primary-bg);font-weight:var(--lt-fw-bold);color:var(--lt-color-text-heading);border-bottom-color:var(--lt-grey-400);gap:4px;user-select:none}
.th-row{position:sticky;top:0;z-index:5}
.th.sortable{cursor:pointer}
.th.sortable:hover .si{color:var(--lt-color-text-secondary)}
.th.sortable:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(0,79,176,.35)}
.si{font-size:16px;color:var(--lt-grey-300);font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 20;flex-shrink:0}
.th.on .si{color:var(--lt-color-primary)}
.td .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tbody .tr:hover .td{background:var(--lt-grey-50)}   /* Review #13：列不可點，hover 用 FE VirtualizedTable／CB／AD 一致的 #F6F6F6（#F2FAFF 是 Guideline 可點列） */
.td .hl{color:var(--lt-color-primary-hover);font-weight:var(--lt-fw-bold)}   /* 搜尋命中：藍字粗體、無底色（Figma 8117:40065，rightsizing v2 已查證）。⚠ DEVIATION: FE HighlightText 預設只有粗體 */
.td .rs{color:var(--lt-color-text-secondary)}   /* 角色後綴 (Owner) */
.cell-2l{display:flex;flex-direction:column;justify-content:center;min-width:0;width:100%}
.cell-2l .l1{font-size:var(--lt-fs-14);line-height:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-2l .l2{font-size:var(--lt-fs-12);line-height:18px;color:var(--lt-grey-400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ⏸ PARKED（UX 提案 點 2） */
.tr.fail .td{background:var(--lt-color-error-light)}   /* 點 2（UX 提案 B）：整列只留 CMDS Error BG 淡底，其他格文字不變紅 */
.tbody .tr.fail:hover .td{background:var(--al-error-row-hover)}
.stt{display:inline-flex;align-items:center;gap:6px}
.stt .material-symbols-outlined{font-size:16px}
.stt.ok .material-symbols-outlined{color:var(--lt-color-success)}
.stt.bad{color:var(--al-error-dark)}
.stt.bad .material-symbols-outlined{color:var(--lt-color-error)}   /* icon 用 Main、文字用 Dark：#FF403D 在白底只有 3.5:1，14px 文字不及格（Fable §2） */
.moreload{display:flex;justify-content:center;padding:12px 0;grid-column:1/-1}
.moreload i{width:24px;height:24px;border:3px solid var(--lt-blue-20);border-top-color:var(--lt-color-primary);border-radius:50%;animation:rot .8s linear infinite}

/* Skeleton（FE `TableSkeleton rows=5`）*/
.sk{background:linear-gradient(90deg,#E6E6E6 25%,#F2F2F2 50%,#E6E6E6 75%);background-size:200% 100%;animation:shimmer 1.5s infinite linear;border-radius:4px;height:14px}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk-t{border:1px solid var(--lt-grey-200);border-radius:4px;overflow:hidden}
.sk-hd>:first-child,.sk-row>:first-child{position:relative}
.sk-hd,.sk-row{display:grid;gap:24px;align-items:center;padding:0 16px;height:50px;border-bottom:1px solid var(--lt-grey-200);grid-template-columns:6fr 1.5fr 1.5fr 1.5fr 1.5fr}   /* Review #16：FE TableSkeleton 第一欄佔 50%（Grid size=6）*/
.sk-hd{background:var(--lt-grey-100)}
.sk-row{background:#fff}
.sk-hd .sk{background:#E6E6E6;animation:none}

/* ===== Empty / Error / No-access ===== */
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--lt-color-text-secondary);flex:1;min-height:400px;padding:16px 0}
.es .es-ic{font-size:80px;color:var(--lt-blue-30);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 48;line-height:80px;width:80px;height:80px}
.es .es-ic.is-outline{font-variation-settings:'FILL' 0,'wght' 700,'GRAD' 0,'opsz' 48}
.es-title{font-size:var(--lt-fs-18);font-weight:var(--lt-fw-bold);line-height:27px;margin-top:16px;color:var(--lt-color-text-primary)}
.es-desc{font-size:var(--lt-fs-14);white-space:pre-line;margin-top:8px;line-height:24.5px}
.es .btn{margin-top:24px}

/* ===== UX 提案 badge（⏸ PARKED，登記在 specs/parked-designs.md；樣式同 All Resource List .ux-badge／LumiTag .is-proposal）===== */
.pk-badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px 0 6px;border-radius:10px;background:var(--lt-color-warning-light);color:var(--al-amber-text);font-size:12px;line-height:18px;font-weight:var(--lt-fw-medium);white-space:nowrap;cursor:help;flex-shrink:0}
.pk-badge .material-symbols-outlined{font-size:14px;color:var(--lt-color-warning);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
.pk-badge.abs{position:absolute;left:0;top:-22px;z-index:2}   /* 掛在卡片上內距，不改版面 */
.th .pk-badge{margin-left:4px;font-weight:var(--lt-fw-medium)}
.pk-badge.mini{width:20px;padding:0;justify-content:center;gap:0}
.pk-badge.mini .material-symbols-outlined{font-size:14px}

/* ===== Toast（左下，成功 #008F88、失敗 #BF302E；往右挪到 80 避開 Demo FAB）===== */
.toast-wrap{position:fixed;bottom:24px;left:80px;z-index:var(--lt-z-toast);display:flex;flex-direction:column-reverse;gap:16px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 16px;background:var(--al-toast-ok);color:#fff;border-radius:4px;box-shadow:var(--lt-shadow-dialog);font-size:var(--lt-fs-14);line-height:24.5px;width:420px;max-width:calc(100vw - 100px);animation:toast-in .25s ease-out;pointer-events:auto}
.toast.err{background:var(--al-toast-err)}
.toast.info{background:var(--lt-tooltip-bg)}
.toast .material-symbols-outlined{font-size:20px;flex-shrink:0}
@keyframes toast-in{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}
body #gl-tip{max-width:400px;white-space:pre-line;font-size:14px;line-height:24.5px;padding:8px 16px;border-radius:var(--lt-tooltip-radius);box-shadow:var(--lt-shadow-dialog);text-align:left}

/* ===== Footer ===== */
.footer{padding:var(--lt-space-16) var(--lt-space-32);background:var(--lt-color-primary-bg);border-top:1px solid var(--lt-color-border-default);display:flex;align-items:center;justify-content:space-between;font-size:var(--lt-fs-12);color:var(--lt-color-text-secondary);flex-wrap:wrap;gap:10px}
.footer-version{font-weight:var(--lt-fw-medium);color:#262626}

  // logo 連到 Overview（從 LUMITURE_NAV 拿 href）；在 Overview 頁本身不連自己，也就沒有 hover 變形
  function _renderLogo() {
    var nav = window.LUMITURE_NAV || [];
    var home = nav.filter(function (e) { return e.type === 'item' && e.id === 'overview'; })[0];
    var linked = home && home.href && !home.disabled && window.LUMITURE_ACTIVE !== 'overview';
    var open = linked ? '<a class="lt-sb-logo is-link" href="' + _esc(home.href) + '" title="Go to Overview">' : '<div class="lt-sb-logo">';
    return open +
      '<div class="lt-sb-logo-wrap">' + LOGO_ICON + '</div>' +
      '<span class="lt-sb-logo-text">LumiTure.ai</span>' +
      '<span class="lt-sb-proto" title="Prototype">PROTO<span class="lt-sb-proto-x">TYPE</span></span>' +
      '<div class="lt-sb-logo-p" aria-hidden="true"><svg viewBox="0 0 39.10 34.00" fill="none">' + P_MARK_INNER + '</svg></div>' +
    (linked ? '</a>' : '</div>');
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function _renderItem(item, isSub) {
    var cls = isSub ? 'lt-sb-subitem' : 'lt-sb-item';
    var isActive = (item.id === window.LUMITURE_ACTIVE);
    var active = isActive ? ' lt-active' : '';
    var dis = item.disabled ? ' lt-dis' : '';
    // Active item: render as <div> (no self-link). Disabled item: also no href.
    var useHref = item.href && !isActive && !item.disabled;
    var tag = useHref ? 'a' : 'div';
    var hrefAttr = useHref ? ' href="' + _esc(item.href) + '"' : '';
    var dataId = ' data-nav-id="' + _esc(item.id) + '"';
    return '<' + tag + ' class="' + cls + active + dis + '"' + hrefAttr + dataId + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon || 'circle') + '</span>' +
             '<span>' + _esc(item.label) + '</span>' +
           '</' + tag + '>';
  }

  function _renderGroup(grp) {
    var collapsed = grp.collapsed ? ' lt-collapsed' : '';
    var children = (grp.items || []).map(function (item) {
      return _renderItem(item, true);
    }).join('');
    return '<div class="lt-sb-group' + collapsed + '" data-group-id="' + _esc(grp.id) + '">' +
             '<div class="lt-sb-group-hdr">' +
               '<span>' + _esc(grp.label) + '</span>' +
               '<span class="material-symbols-outlined lt-sb-group-arrow">keyboard_arrow_up</span>' +
             '</div>' +
             '<div class="lt-sb-group-children">' + children + '</div>' +
           '</div>';
  }

  function _renderNav() {
    var nav = window.LUMITURE_NAV || [];
    var html = '<div class="lt-sb-nav">';
    nav.forEach(function (entry) {
      if (entry.type === 'group') {
        html += _renderGroup(entry);
      } else {
        html += _renderItem(entry, false);
      }
    });
    html += '</div>';
    return html;
  }

  function _renderCollapseBtn() {
    return '<div class="lt-sb-collapse-btn">' +
             '<button type="button" data-action="toggle-collapse" title="Collapse sidebar">' +
               '<span class="material-symbols-outlined">chevron_left</span>' +
             '</button>' +
           '</div>';
  }

  // ===== Mount =====
  function _render() {
    var mount = document.getElementById('lt-sidebar');
    if (!mount) {
      console.warn('[lumiture-sidebar] Mount point #lt-sidebar not found');
      return;
    }
    // If mount is not already a sidebar, wrap it
    mount.classList.add('lt-sidebar');
    mount.innerHTML = _renderLogo() + _renderNav() + _renderCollapseBtn();

    // Group toggle
    mount.querySelectorAll('.lt-sb-group-hdr').forEach(function (hdr) {
      hdr.addEventListener('click', function () {
        var grp = hdr.parentElement;
        if (grp) grp.classList.toggle('lt-collapsed');
      });
    });
    // Collapse the whole sidebar
    var btn = mount.querySelector('[data-action="toggle-collapse"]');
    if (btn) {
      btn.addEventListener('click', function () {
        window.LumitureSidebar.toggleCollapse();
      });
    }
  }

  // ===== Public API =====
  window.LumitureSidebar = {
    toggleGroup: function (groupId) {
      var grp = document.querySelector('[data-group-id="' + groupId + '"]');
      if (grp) grp.classList.toggle('lt-collapsed');
    },
    toggleCollapse: function () {
      var sb = document.getElementById('lt-sidebar');
      var main = document.querySelector('.lt-main, .main, main');
      if (sb) sb.classList.toggle('lt-collapsed');
      if (main) main.classList.toggle('lt-sidebar-collapsed');
      // Sync legacy CSS vars (--sw) for prototypes that reference them in topbar / footer
      var w = sb && sb.classList.contains('lt-collapsed') ? '64px' : '250px';
      document.documentElement.style.setProperty('--sw', w);
      document.documentElement.style.setProperty('--lt-sb-w', w);
    },
    setActive: function (itemId) {
      window.LUMITURE_ACTIVE = itemId;
      document.querySelectorAll('.lt-sb-item, .lt-sb-subitem').forEach(function (el) {
        el.classList.toggle('lt-active', el.dataset.navId === itemId);
      });
    },
    rerender: _render,
  };

  // 頁面自己沒設 favicon 才補，分頁列一眼分得出 prototype 跟正式站
  function _injectFavicon() {
    if (document.querySelector('link[rel~="icon"]')) return;
    var l = document.createElement('link');
    l.rel = 'icon'; l.type = 'image/svg+xml';
    l.href = 'data:image/svg+xml,' + encodeURIComponent(FAVICON_SVG);
    document.head.appendChild(l);
  }

  // ===== INIT =====
  function _init() {
    _injectCSS();
    _injectFavicon();
    _render();
    // Dispatch resize so chart libraries (ECharts 等) 重新測量容器
    // —— 避免 inline script 已先 init chart 後，shared CSS 才 inject 導致 layout shift
    requestAnimationFrame(function () {
      window.dispatchEvent(new Event('resize'));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

  function _injectCSS() {
    if (document.getElementById('lt-topbar-css')) return;
    var s = document.createElement('style');
    s.id = 'lt-topbar-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ===== Helpers =====
  function _esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function _user() {
    var u = Object.assign({}, DEFAULT_USER, window.LUMITURE_USER || {});
    u.quota = Object.assign({}, DEFAULT_USER.quota, (window.LUMITURE_USER || {}).quota || {});
    return u;
  }
  function _status(used, total) {
    if (!total || total <= 0) return 'active';
    var pct = used / total * 100;
    if (pct >= 100) return 'depleted';
    if (pct >= 80)  return 'warning';
    return 'active';
  }
  function _planItems(plan) {
    return PLAN_QUOTA_ITEMS[plan] != null ? PLAN_QUOTA_ITEMS[plan] : PLAN_QUOTA_ITEMS.Standard;
  }
  function _showQuotaBox(u) {
    return _planItems(u.plan).length > 0;
  }

  // ===== Renderers =====
  function _renderIcon(item) {
    var attrs = ' class="lt-tb-ic" title="' + _esc(item.title || '') + '"';
    if (item.onclick) attrs += ' onclick="' + _esc(item.onclick) + '"';
    var badge = item.badge ? '<span class="lt-tb-badge"></span>' : '';
    return '<button type="button"' + attrs + '>' +
             '<span class="material-symbols-outlined">' + _esc(item.icon) + '</span>' + badge +
           '</button>';
  }

  function _renderUserChip(u) {
    return '<button type="button" class="lt-tb-user" id="lt-tb-user" aria-haspopup="true" aria-expanded="false">' +
             '<span class="material-symbols-outlined lt-tb-avatar-ic">account_circle</span>' +
             '<div class="lt-tb-user-text">' +
               '<span class="lt-tb-user-name">' + _esc(u.name) + '</span>' +
               '<span class="lt-tb-user-role" id="lt-tb-user-role">' + _esc(u.role) + '</span>' +
             '</div>' +
             '<span class="material-symbols-outlined lt-tb-chev">keyboard_arrow_down</span>' +
           '</button>';
  }

  function _renderQuotaItem(key, q, opts) {
    opts = opts || {};
    var meta = QUOTA_META[key];
    // Premium：unlimited（無 used/total，cyan + sparkle，不可點）
    if (opts.unlimited) {
      return '<div class="lt-q-item is-unlimited">' +
               '<span class="lt-q-dot"></span>' +
               '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
               '<span class="lt-q-val">Unlimited<span class="material-symbols-outlined">auto_awesome</span></span>' +
             '</div>';
    }
    var used = q.used || 0, total = q.total || 0;
    var remaining = Math.max(0, total - used);
    var st = _status(used, total);
    // Warning / Depleted 才有 hover tooltip 說明（取代原本點開的 Limit Reached 對話框；
    // PM 確認無法提供 per-user 業務 email，故改輕量懸停說明，無 Contact Sales 動作）
    // 文案含變數 {total} {unit} {label}；{label}=Cost Dashboard / Usage Optimization
    var tip = '';
    if (st === 'depleted' || st === 'warning') {
      var verb = st === 'depleted' ? 'has been reached' : 'is approaching';
      var tipText = 'Your monthly limit (' + total.toLocaleString() + ' ' + meta.unit + ') ' + verb +
        ' for ' + meta.dialogLabel + '. Please contact your LumiTure.ai representative to purchase ' +
        'Add-ons to increase your quota for this billing cycle.';
      tip = '<span class="lt-q-tip">' + _esc(tipText) + '</span>';
    }
    var hasTip = tip !== '';
    return '<div class="lt-q-item is-' + st + (hasTip ? ' has-tip' : '') + '"' + (hasTip ? ' tabindex="0"' : '') + '>' +
             '<span class="lt-q-dot"></span>' +
             '<span class="lt-q-label">' + _esc(meta.label) + '</span>' +
             '<span class="lt-q-val">' + remaining.toLocaleString() + ' / ' + total.toLocaleString() + ' left</span>' +
             tip +
           '</div>';
  }

  function _renderQuotaBox(u) {
    var isPremium = u.plan === 'Premium';
    var items = _planItems(u.plan);
    if (!items.length && !isPremium) return '';   // 無有效 plan：不顯示（理論上不會發生）
    // Premium（unlimited）不重置 → header 只顯示 Org-wide，不接 refresh 日
    var sub = isPremium ? 'Org-wide' : 'Org-wide, refresh on ' + _esc(u.quota.refreshDate);
    var head = '<div class="lt-q-head">' +
                 '<span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-sub">' + sub + '</span>' +
               '</div>';
    // loading（refresh 日也尚未載入 → sub 一併 skeleton）
    if (u.quota.state === 'loading') {
      return '<div class="lt-q">' +
               '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span>' +
                 '<span class="lt-q-skel lt-q-skel-sub"></span></div>' +
               '<div class="lt-q-skel" style="width:78%"></div><div class="lt-q-skel" style="width:62%"></div>' +
             '</div>';
    }
    // error（partial degrade：只有這塊壞，menu 其他項照常）；refresh 日未載入 → sub 只顯示 Org-wide；Retry 右對齊
    if (u.quota.state === 'error') {
      var headErr = '<div class="lt-q-head"><span class="lt-q-title">AI Quota</span><span class="lt-q-sub">Org-wide</span></div>';
      return '<div class="lt-q">' + headErr +
               '<div class="lt-q-err"><span class="material-symbols-outlined">help</span>' +
               '<span class="lt-q-err-msg">Couldn\'t load quota</span>' +
               '<a onclick="window.LumitureTopbar.rerender()">Retry</a></div>' +
             '</div>';
    }
    var rows = isPremium
      ? ['analyses', 'rightsizing'].map(function (k) { return _renderQuotaItem(k, {}, { unlimited: true }); }).join('')
      : items.map(function (k) { return _renderQuotaItem(k, u.quota[k] || {}); }).join('');
    // add-on 行（packs>0，Premium 不適用）；naming 對齊 PRD：單數 "AI Quota Add-on × N"
    var addon = (!isPremium && (u.addonPacks || 0) > 0)
      ? '<div class="lt-q-addon"><span class="material-symbols-outlined">auto_awesome</span>' +
          u.addonPacks + ' × AI Quota Add-ons Activated</div>'
      : '';
    return '<div class="lt-q">' + head + rows + addon + '</div>';
  }

  function _renderMenu(u) {
    var planName = _esc(u.plan) + ' Plan';
    var bannerStyle = PLAN_BANNER[u.plan] || PLAN_BANNER.Standard;
    var viewAs = u.canSwitchRole
      ? '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'View as Another Role\')">' +
          '<span class="material-symbols-outlined">sync_alt</span>View as Another Role</button>' +
        '<div class="lt-am-div"></div>'
      : '';
    var box = _renderQuotaBox(u);
    var quotaSection = box
      ? '<div class="lt-am-div"></div>' + box + '<div class="lt-am-div"></div>'
      : '<div class="lt-am-div"></div>';
    return '<div class="lt-am-backdrop" id="lt-am-backdrop" onclick="window.LumitureTopbar.closeMenu()"></div>' +
           '<div class="lt-am" id="lt-am" role="menu">' +
             '<div class="lt-am-plan" style="' + bannerStyle + '">' +
               '<span class="lt-am-plan-name">' + planName + '</span>' +
               '<span class="lt-am-plan-date">' + _esc(u.planDateRange) + '</span>' +
             '</div>' +
             '<div class="lt-am-id">' +
               '<div class="lt-am-id-name">' + _esc(u.name) + '</div>' +
               '<div class="lt-am-id-email">' + _esc(u.email) + '</div>' +
               '<span class="lt-am-chip"><span class="material-symbols-outlined">account_circle</span>' + _esc(u.role) + '</span>' +
             '</div>' +
             quotaSection +
             viewAs +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Profile\')">' +
               '<span class="material-symbols-outlined">person</span>Profile</button>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Settings\')">' +
               '<span class="material-symbols-outlined">settings</span>Settings</button>' +
             '<div class="lt-am-div"></div>' +
             '<button type="button" class="lt-am-item" onclick="window.LumitureTopbar._noop(\'Log out\')">' +
               '<span class="material-symbols-outlined">logout</span>Log out</button>' +
           '</div>';
  }

  // ===== Mount / state =====
  var _menuOpen = false;

  function _render() {
    var mount = document.getElementById('lt-topbar');
    if (!mount) { console.warn('[lumiture-topbar] Mount point #lt-topbar not found'); return; }
    var u = _user();
    var icons = window.LUMITURE_TOPBAR_ICONS || DEFAULT_ICONS;
    mount.classList.add('lt-topbar');
    mount.innerHTML = icons.map(_renderIcon).join('') + _renderUserChip(u);
    var chip = document.getElementById('lt-tb-user');
    if (chip) chip.addEventListener('click', function (e) { e.stopPropagation(); _toggleMenu(); });
    _menuOpen = false;
  }

  function _menuHost() {
    var host = document.getElementById('lt-am-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'lt-am-host';
      document.body.appendChild(host);
    }
    return host;
  }

  function _openMenu() {
    var u = _user();
    _menuHost().innerHTML = _renderMenu(u);
    _menuOpen = true;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.add('is-open'); chip.setAttribute('aria-expanded', 'true'); }
  }
  function _closeMenu() {
    _menuHost().innerHTML = '';
    _menuOpen = false;
    var chip = document.getElementById('lt-tb-user');
    if (chip) { chip.classList.remove('is-open'); chip.setAttribute('aria-expanded', 'false'); }
  }
  function _toggleMenu() { _menuOpen ? _closeMenu() : _openMenu(); }

  // Esc 關閉 menu
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && _menuOpen) _closeMenu();
  });

  // ===== Public API =====
  window.LumitureTopbar = {
    setUser: function (user) {
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, user || {});
      _render(); if (_menuOpen) _openMenu();
    },
    setRole: function (role) {
      var el = document.getElementById('lt-tb-user-role');
      if (el) el.textContent = role;
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, { role: role });
      if (_menuOpen) _openMenu();
    },
    setPlan: function (plan) {
      window.LUMITURE_USER = Object.assign({}, window.LUMITURE_USER || {}, { plan: plan });
      if (_menuOpen) _openMenu();
    },
    setQuota: function (q) {
      var cur = (window.LUMITURE_USER || {});
      window.LUMITURE_USER = Object.assign({}, cur, {
        quota: Object.assign({}, DEFAULT_USER.quota, cur.quota || {}, q || {}),
      });
      if (q && typeof q.addonPacks !== 'undefined') window.LUMITURE_USER.addonPacks = q.addonPacks;
      if (_menuOpen) _openMenu();
    },
    openMenu: _openMenu,
    closeMenu: _closeMenu,
    toggleMenu: _toggleMenu,

<script>
/* === Inlined: shared/lumiture-checkbox.js === */
/*!
 * lumiture-checkbox.js — Lumiture Shared Checkbox v1
 *
 * Design spec: Lumiture-Guideline #Checkbox（S size / Primary / unchecked-checked-mixed）
 *   16×16、--lt-radius-sm、border --lt-grey-300、checked/mixed 皆 --lt-color-primary
 *   四態齊全：hover / focus-visible / disabled / mixed
 *   mixed 用 remove icon、checked 用 check icon
 *
 * 為什麼不是純 span、也不是純原生 input
 * ---------------------------------------------------------------------------
 * group-list v3 當初改成純 span，理由是原生 input[type=checkbox] 在部分瀏覽器的
 * unchecked 狀態會多畫出一個痕跡（實測與 accent-color、尺寸都無關，是瀏覽器畫
 * 原生方框本身的痕跡）。但那個痕跡來自「被畫出來的」原生方框；把 input 藏成
 * opacity:0 之後它一樣不存在，而 .checked / .indeterminate / :checked 三個介面
 * 全部保留下來。
 *
 * 這件事有實際意義，因為既有 prototype 分成兩派狀態模型：
 *   重繪派  caller 持有 Set/物件，傳 checked/mixed 進來，改變後重繪整塊
 *           （group-list v3、cost-dashboard v2）
 *   DOM 派  DOM 本身就是狀態，靠 el.checked / :checked 反推
 *           （lumi-tag v8 的多選面板、rightsizing v1 的表格與 .sc-check）
 * 純 span 會逼 DOM 派發明一套狀態層；純原生 input 會逼重繪派回頭補
 * input.indeterminate（HTML 沒有這個屬性，只能渲染後補丁）。
 *
 * 解法是讓 CSS 同時吃兩種來源：
 *   .checkbox input:checked ~ .checkbox__box   ← DOM 派
 *   .checkbox.is-checked     .checkbox__box    ← 重繪派
 * 兩條路落在同一組像素上，誰都不用改自己的模型。
 *
 * 附帶把原生語意拿回來：Space 鍵、label 關聯、form 參與、focus 目標都是免費的
 * （group-list v3 的註記自己就寫過「原生 input 這些是免費的」）。
 *
 * ---------------------------------------------------------------------------
 * 用法 A — 重繪派（caller 持有狀態）
 *
 *   LumiCheckbox.html({ checked, mixed, disabled, onclick })
 *   → 傳 class，渲染時就決定，不需要渲染後補 indeterminate
 *
 *     rows.map(r => LumiCheckbox.html({
 *       checked: sel.has(r.id),
 *       onclick: `toggleRow('${r.id}')`
 *     })).join('')
 *
 * 用法 B — DOM 派（DOM 即狀態）
 *
 *   LumiCheckbox.html({ stateful:true, checked, value, cls, onchange })
 *   → 產生真的 input，el.checked / el.indeterminate / :checked 照常運作
 *
 *     `<label>${LumiCheckbox.html({ stateful:true, cls:'ms-chk', value:opt })}
 *        <span>${opt}</span></label>`
 *     panel.querySelectorAll('.ms-chk:checked')     // 照常
 *     chkAll.indeterminate = true                    // 照常
 *
 * 兩種用法可以同檔混用，視覺完全一致。
 *
 * ---------------------------------------------------------------------------
 * Exposes
 *   LumiCheckbox.html(opts)   → HTML 字串
 *   LumiCheckbox.el(opts)     → DOM 節點（需要直接 append 時用）
 *   LumiCheckbox.input(elOrSelector) → 取出內部 input（stateful 用）
 *   LumiCheckbox.set(elOrSelector, {checked, mixed, disabled})
 *                             → 兩種模式共用的狀態設定，caller 不用管是哪一種
 *
 * opts
 *   checked   bool    初始/當前選中
 *   mixed     bool    部分選中（重繪派用 class；DOM 派請改設 input.indeterminate）
 *   disabled  bool
 *   stateful  bool    true = 產生真 input（DOM 派），false = 純 class（重繪派）
 *   onclick   string  inline handler（重繪派慣用；自動包 event.stopPropagation）
 *                     省略 = 這個 checkbox 只是外層控制項的視覺，會輸出
 *                     aria-hidden 且不搶 tab 焦點、不擋外層的 onclick
 *   onchange  string  inline handler（stateful 慣用）
 *   value     string  stateful 的 input value
 *   cls       string  額外掛在 input 上的 class（讓既有選擇器如 .ms-chk 繼續命中）
 *   attrs     object  額外屬性，如 {'data-gi':3}。stateful 掛 input、重繪派掛外層
 *   wrapTag   string  stateful 外層標籤，預設 'label'。外層已經是 <button>
 *                     之類的互動元素時傳 'span'，避免巢狀 label 重複觸發
 *   interactive bool  重繪派專用。它自己是一個控制項、但 handler 是外部
 *                     addEventListener 綁的（不是 inline onclick）。會輸出
 *                     role/tabindex，鍵盤以 this.click() 合成點擊
 *   wrapCls   string  額外掛在外層 .checkbox 上的 class
 *   id        string  input id（配 <label for>）
 *   name      string  input name
 *   label     string  右側文字；省略則只有方框
 *   ariaLabel string  無可見文字時的無障礙名稱
 *   title     string  原生 title 提示（掛在外層）
 *   stop      bool    是否包 event.stopPropagation（預設 true）
 */
(function () {
  'use strict';

  /* ---- CSS（自我注入，載入即可用，不需各 prototype 複製）---- */
  var CSS = [
    '.checkbox{display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:0 0 auto;position:relative;vertical-align:middle}',
    '.checkbox.is-disabled{cursor:not-allowed}',
    /* 真 input 藏起來但保留在無障礙樹與 tab 序中。不用 display:none／visibility:hidden，
     * 那兩個會讓它拿不到焦點，:focus-visible 就沒有東西可以掛。 */
    '.checkbox input.checkbox__input{position:absolute;width:16px;height:16px;margin:0;opacity:0;cursor:inherit;z-index:1}',
    '.checkbox input.checkbox__input:disabled{cursor:not-allowed}',
    '.checkbox__box{display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px;width:16px;height:16px;border:1px solid var(--lt-grey-300,#CCCCCC);border-radius:var(--lt-radius-sm,4px);background:#fff;transition:border-color 150ms ease,background 150ms ease,box-shadow 200ms ease}',
    '.checkbox__icon{color:#fff;display:none;font-size:12px;line-height:1;font-variation-settings:\'FILL\' 1,\'wght\' 700,\'GRAD\' 0,\'opsz\' 20}',
    '.checkbox__label{font-size:14px;color:var(--lt-color-text-primary,#262626);user-select:none}',
    '.checkbox.is-disabled .checkbox__label{color:var(--lt-color-text-disabled,#B3B3B3)}',

    /* hover */
    '.checkbox:hover .checkbox__box{border-color:var(--lt-grey-400,#B3B3B3)}',

    /* checked／mixed 的填色。左邊是 DOM 派（真 input），右邊是重繪派（class）。 */
    '.checkbox__input:checked~.checkbox__box,',
    '.checkbox__input:indeterminate~.checkbox__box,',
    '.checkbox.is-checked .checkbox__box,',
    '.checkbox.is-mixed .checkbox__box{background:var(--lt-color-primary,#004FB0);border-color:var(--lt-color-primary,#004FB0)}',

    /* icon 切換全部走 CSS，兩個 icon 都渲染出來、由狀態決定露哪一個，
     * 所以 DOM 派切換 input.checked 時不需要動 innerHTML。 */
    '.checkbox__input:checked~.checkbox__box .checkbox__icon--check,',
    '.checkbox.is-checked .checkbox__icon--check{display:inline-block}',
    '.checkbox__input:indeterminate~.checkbox__box .checkbox__icon--check,',
    '.checkbox.is-mixed .checkbox__icon--check{display:none}',
    '.checkbox__input:indeterminate~.checkbox__box .checkbox__icon--mixed,',
    '.checkbox.is-mixed .checkbox__icon--mixed{display:inline-block}',

    /* hover on checked／mixed */
    '.checkbox:hover .checkbox__input:checked~.checkbox__box,',
    '.checkbox:hover .checkbox__input:indeterminate~.checkbox__box,',
    '.checkbox:hover.is-checked .checkbox__box,',
    '.checkbox:hover.is-mixed .checkbox__box{background:var(--lt-color-primary-hover,#0B6DD7);border-color:var(--lt-color-primary-hover,#0B6DD7)}',

    /* focus-visible。真 input 走原生 :focus-visible；純 class 版焦點在外層 span 上。 */
    '.checkbox__input:focus-visible~.checkbox__box,',
    '.checkbox:focus-visible .checkbox__box{border-color:var(--lt-color-primary,#004FB0);box-shadow:0 0 0 3px rgba(0,79,176,.1);outline:none}',
    '.checkbox:focus-visible{outline:none}',

    /* disabled 最後宣告，蓋掉上面所有狀態 */
    '.checkbox__input:disabled~.checkbox__box,',
    '.checkbox.is-disabled .checkbox__box{border-color:var(--lt-grey-300,#CCCCCC);background:#fff;box-shadow:none}',
    '.checkbox__input:disabled:checked~.checkbox__box,',
    '.checkbox__input:disabled:indeterminate~.checkbox__box,',
    '.checkbox.is-disabled.is-checked .checkbox__box,',
    '.checkbox.is-disabled.is-mixed .checkbox__box{background:var(--lt-grey-300,#CCCCCC);border-color:var(--lt-grey-300,#CCCCCC)}'
  ].join('');

  function injectCSS() {
    if (document.getElementById('lumi-checkbox-css')) return;
    var style = document.createElement('style');
    style.id = 'lumi-checkbox-css';
    style.textContent = CSS;
    (document.head || document.documentElement).appendChild(style);
  }
  injectCSS();   // documentElement 一定存在，不需要等 DOMContentLoaded

  function attr(name, val) {
    if (val === undefined || val === null || val === '') return '';
    return ' ' + name + '="' + String(val).replace(/"/g, '&quot;') + '"';
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var BOX =
    '<span class="checkbox__box">' +
      '<span class="material-symbols-outlined checkbox__icon checkbox__icon--check">check</span>' +
      '<span class="material-symbols-outlined checkbox__icon checkbox__icon--mixed">remove</span>' +
    '</span>';

  /* 額外屬性（data-* 之類）。stateful 掛在 input 上，因為既有的委派 handler
   * 都是從 input 讀 dataset；重繪派掛在外層 span 上，那裡才是可點擊的元素。 */
  function extraAttrs(o) {
    if (!o) return '';
    var out = '';
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) out += attr(k, o[k]);
    return out;
  }

  function html(opts) {
    opts = opts || {};
    var checked  = !!opts.checked;
    var mixed    = !!opts.mixed;
    var disabled = !!opts.disabled;
    var stop     = opts.stop !== false;

    /* stateful 模式刻意不輸出 is-checked／is-mixed：那兩個 class 是渲染當下的
     * 快照，caller 之後翻 input.checked 時不會跟著變，留著只會與真實狀態脫節。
     * 該模式的狀態一律由 input 屬性表達，CSS 已經吃 :checked／:indeterminate。 */
    var wrapCls = ['checkbox'];
    if (disabled) wrapCls.push('is-disabled');
    /* disabled 與 checked／mixed 是可疊加的，不是互斥的。基準版寫成三元互斥
     * （disabled ? 'is-disabled' : mixed ? ... : checked ? ...），結果
     * .is-disabled.is-checked 那條 CSS 永遠命中不了，disabled 的已選項目
     * 會畫成空白框。這裡改成疊加。 */
    if (!opts.stateful) {
      if (mixed) wrapCls.push('is-mixed');
      else if (checked) wrapCls.push('is-checked');
    }
    if (opts.wrapCls) wrapCls.push(opts.wrapCls);

    var labelHtml = opts.label
      ? '<span class="checkbox__label">' + esc(opts.label) + '</span>'
      : '';

    if (opts.stateful) {
      /* DOM 派。外層用 <label>，點文字也會切換，是原生行為不需要 handler。
       * mixed 在 HTML 沒有對應屬性，caller 照常設 input.indeterminate
       * （CSS 已經吃 :indeterminate）。要在首次渲染就是 mixed 的話，用
       * LumiCheckbox.set(el,{mixed:true}) 或直接 LumiCheckbox.input(el).indeterminate=true。 */
      var inputCls = 'checkbox__input' + (opts.cls ? ' ' + opts.cls : '');
      var oc = opts.onclick && stop
        ? 'event.stopPropagation();' + opts.onclick
        : opts.onclick;
      /* 預設外層是 <label>，點文字也會切換（原生行為，不用 handler）。
       * 但 <label> 不能巢狀在 <button> 裡（HTML 不合法，而且 label 會再轉發
       * 一次點擊、跟按鈕自己的 handler 打對台變成切了又切回去）。lumi-tag 的
       * .ms-item 就是按鈕包 checkbox，那種情況傳 wrapTag:'span'。 */
      var tag = opts.wrapTag || 'label';
      return '<' + tag + ' class="' + wrapCls.join(' ') + '"' + attr('title', opts.title) + '>' +
        '<input type="checkbox" class="' + inputCls + '"' +
          attr('id', opts.id) + attr('name', opts.name) + attr('value', opts.value) +
          (checked ? ' checked' : '') + (disabled ? ' disabled' : '') +
          attr('aria-label', opts.ariaLabel) + extraAttrs(opts.attrs) +
          attr('onclick', oc) + attr('onchange', opts.onchange) +
        '>' + BOX + labelHtml +
      '</' + tag + '>';
    }

    /* 重繪派。沒有 input，狀態完全由 class 表達，caller 改變狀態後重繪整塊。
     * role/tabindex/keydown 補回原生 input 免費提供的鍵盤操作。 */
    var act = (disabled || !opts.onclick) ? ''
      : ((stop ? 'event.stopPropagation();' : '') + opts.onclick);

    /* 沒有自己的 onclick，代表點擊由外層（例如 .dropdown-item 整列）處理，
     * 這個 checkbox 只是那個控制項的視覺。這時候不能宣告 role="checkbox"
     * 也不能吃 tabindex：它不是控制項，掛上去只會多一個按不動的焦點站，
     * 而且螢幕閱讀器會聽到兩個 checkbox。改成 aria-hidden 交給外層負責語意。
     * 另外 act 空字串時絕對不能輸出 event.stopPropagation()，否則外層的
     * onclick 會被自己的視覺元素擋掉。 */
    if (!act && !disabled && !opts.interactive) {
      return '<span class="' + wrapCls.join(' ') + '" aria-hidden="true"' +
        attr('title', opts.title) + extraAttrs(opts.attrs) + '>' + BOX + labelHtml + '</span>';
    }

    /* 有 inline handler 就直接跑它；interactive 但 handler 是外部
     * addEventListener 綁的（cost-dashboard 幾個 dropdown 就是這樣），
     * 就用 this.click() 合成一次點擊，外部 listener 照樣會收到。 */
    var keydown = act
      ? "if(event.key===' '||event.key==='Enter'){event.preventDefault();" + act + '}'
      : "if(event.key===' '||event.key==='Enter'){event.preventDefault();this.click()}";
    return '<span class="' + wrapCls.join(' ') + '" role="checkbox"' +
      ' aria-checked="' + (mixed ? 'mixed' : checked) + '"' +
      ' aria-disabled="' + disabled + '"' +
      ' tabindex="' + (disabled ? -1 : 0) + '"' +
      attr('aria-label', opts.ariaLabel) + attr('title', opts.title) + extraAttrs(opts.attrs) +
      attr('onclick', act) + attr('onkeydown', keydown) +
    '>' + BOX + labelHtml + '</span>';
  }

  function el(opts) {
    var d = document.createElement('div');
    d.innerHTML = html(opts);
    return d.firstElementChild;
  }

  /* 兩種模式共用的狀態設定。stateful 走 input 屬性，重繪派走 class，
   * caller 不必知道自己拿到的是哪一種。 */
  function set(target, st) {
    var node = typeof target === 'string' ? document.querySelector(target) : target;
    if (!node) return null;
    var wrap = node.classList && node.classList.contains('checkbox')
      ? node : node.closest('.checkbox');
    var inp = input(node);
    st = st || {};
    if (inp) {
      if ('checked'  in st) inp.checked = !!st.checked;
      if ('mixed'    in st) inp.indeterminate = !!st.mixed;
      if ('disabled' in st) inp.disabled = !!st.disabled;
    } else if (wrap) {
      if ('mixed' in st || 'checked' in st) {
        wrap.classList.toggle('is-mixed', !!st.mixed);
        wrap.classList.toggle('is-checked', !st.mixed && !!st.checked);
        wrap.setAttribute('aria-checked', st.mixed ? 'mixed' : !!st.checked);
      }
    }
    if (wrap && 'disabled' in st) {
      wrap.classList.toggle('is-disabled', !!st.disabled);
      if (!inp) {
        wrap.setAttribute('aria-disabled', !!st.disabled);
        wrap.setAttribute('tabindex', st.disabled ? -1 : 0);
      }
    }
    return wrap;
  }

  function input(target) {
    var node = typeof target === 'string' ? document.querySelector(target) : target;
    if (!node) return null;
    if (node.tagName === 'INPUT') return node;
    return node.querySelector('.checkbox__input');
  }

  window.LumiCheckbox = { html: html, el: el, input: input, set: set, CSS: CSS };
})();

</script>

(function boot() {

<script>
/* ============================================================
 * 14. Tooltip（#gl-tip）：頁面自己提供（shared demo-fab.js 看到已存在就不注入「跟著游標跑」的版本）
 *   做法比照 Anomaly Detection v2／All Resource List v1：錨在元件上。
 *   - data-tip-trunc：只在文字被截斷時才顯示（FE SingleLineCell 的 useOverflow）
 *   - data-tip-pos="below"：出現在元件下方（MUI Tooltip 預設 bottom）；其餘出現在上方
 * ============================================================ */
(function () {
  const tip = document.createElement('div'); tip.id = 'gl-tip'; tip.style.display = 'none'; document.body.appendChild(tip);
  let cur = null;
  function place() {
    if (!cur || !cur.isConnected) { cur = null; tip.style.display = 'none'; return; }
    const r = cur.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, vw = innerWidth, vh = innerHeight;
    let x = r.left; if (x + tw > vw - 8) x = Math.max(8, Math.min(r.right + 2, vw - 8) - tw);
    const below = cur.dataset.tipPos === 'below', dy = cur.dataset.tipDy != null ? +cur.dataset.tipDy : 4;
    let y = below ? r.bottom + dy + 4 : r.top - th - 6;
    if (y < 8) y = r.bottom + 4; if (y + th > vh - 8) y = Math.max(8, r.top - th - 6);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el || (el === cur && tip.style.display !== 'none')) return;
    if (el.dataset.tipTrunc != null && el.scrollWidth <= el.clientWidth) return;
    cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block'; place();
  });
  document.addEventListener('mouseout', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el === cur && !el.contains(e.relatedTarget)) { cur = null; tip.style.display = 'none'; }
  });
  window.addEventListener('scroll', place, true);
  window.addEventListener('resize', place);
})();
</script>

      var cs = s.disabled ? '<span class="demo-cs">Soon</span>' : '';
      return '<button class="demo-btn' + dis + act + '"' + tip +
             ' data-scenario="' + _esc(s.id) + '">' +
             '<span class="material-symbols-outlined">' + _esc(s.icon || 'play_arrow') + '</span>' +
             '<span>' + _esc(s.label) + '</span>' + cs + '</button>';
    }).join('');
    return '<div class="demo-buttons">' + btns + '</div>';
  }

  function _renderPageTabs(mode) {
    var pages = _getPages();
    if (!pages.length) return '';
    // 雙層模式：page tabs 用 pill style 放最上面
    // 單層 pages-only 模式：page tabs 用 underline style（跟 cat-tabs 一致），無第二層
    var isTwoLayer = mode === 'two-layer';
    var wrapClass = isTwoLayer ? 'demo-page-tabs' : 'demo-cat-tabs';
    var tabClass  = isTwoLayer ? 'demo-page-tab' : 'demo-cat-tab';
    return '<div class="' + wrapClass + '">' + pages.map(function (p) {
      var act = p.id === _activePage ? ' active' : '';
      return '<button class="' + tabClass + act + '" data-page="' + _esc(p.id) + '">' +
             (p.icon ? '<span class="material-symbols-outlined">' + _esc(p.icon) + '</span>' : '') +
             _esc(p.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderCategoryTabs() {
    var cats = _getCategories();
    if (!cats.length) return '';
    return '<div class="demo-cat-tabs">' + cats.map(function (c) {
      var act = c.id === _activeCategory ? ' active' : '';
      return '<button class="demo-cat-tab' + act + '" data-category="' + _esc(c.id) + '">' +
             (c.icon ? '<span class="material-symbols-outlined">' + _esc(c.icon) + '</span>' : '') +
             _esc(c.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderHint() {
    if (!_activeCategory) return '';
    var cat = _getCategories().find(function (c) { return c.id === _activeCategory; });
    if (!cat || !cat.hint) return '';
    return '<div class="demo-pane-hint">' + _esc(cat.hint) + '</div>';
  }

  function _renderScrollArea() {
    return _renderHint() + _renderButtons(_filterScenarios());
  }

  // ===== DOM MOUNTING =====
  function _render() {
    if (document.getElementById('demo-fab')) return;

    // Auto-detect first page & category
    var mode = _detectMode();
    var pages = _getPages();
    var cats = _getCategories();
    if (!_activePage && pages.length) _activePage = pages[0].id;
    if (!_activeCategory && cats.length) _activeCategory = cats[0].id;
    if (mode === 'flat') { _activePage = null; _activeCategory = null; }
    if (mode === 'pages-only') _activeCategory = null;
    if (mode === 'categories-only') _activePage = null;

    // FAB
    var fabEl = document.createElement('button');
    fabEl.className = 'demo-fab';
    fabEl.id = 'demo-fab';
    fabEl.title = 'Designer Demo Scenarios';
    fabEl.innerHTML =
      '<span class="material-symbols-outlined">science</span>' +
      '<span class="demo-pulse" id="demo-fab-pulse"></span>';
    fabEl.addEventListener('click', function () { window._demoFabToggle(); });

    // Popover
    var popEl = document.createElement('div');
    popEl.className = 'demo-popover';
    popEl.id = 'demo-popover';
    popEl.innerHTML =
      '<div class="demo-popover-hdr">' +
        '<div class="demo-popover-title">' +
          '<span class="material-symbols-outlined" style="font-size:16px">science</span>' +
          'Demo Scenarios' +
        '</div>' +
        '<button class="demo-popover-close" id="demo-pop-close">' +
          '<span class="material-symbols-outlined" style="font-size:18px">close</span>' +
        '</button>' +
      '</div>' +
      (window.DEMO_DEFAULT
        ? '<button class="demo-reset-link" id="demo-reset-link">' +
            '<span class="material-symbols-outlined">refresh</span>Reset to Default</button>'
        : '') +
      _renderPageTabs(mode) +
      _renderCategoryTabs() +
      '<div class="demo-popover-scroll" id="demo-popover-scroll">' +
        _renderScrollArea() +
      '</div>';

    document.body.appendChild(fabEl);
    document.body.appendChild(popEl);

    // === Event wiring ===
    document.getElementById('demo-pop-close').addEventListener('click', function () {
      window._demoFabToggle();
    });

    // Reset link
    var resetLink = document.getElementById('demo-reset-link');
    if (resetLink && window.DEMO_DEFAULT) {
      resetLink.addEventListener('click', function () {
        window._demoFabApply(window.DEMO_DEFAULT, null);
      });
    }

    // Page tabs
    popEl.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        window._demoFabSetPage(t.dataset.page);
      });
    });

    // Category tabs (also handles page tabs in pages-only mode, where they use demo-cat-tab class)
    popEl.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        if (t.dataset.page) {
          window._demoFabSetPage(t.dataset.page);
        } else {
          window._demoFabSetCategory(t.dataset.category);
        }
      });
    });

    // Scenario button clicks (event delegation on scroll area)
    document.getElementById('demo-popover-scroll').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-scenario]');
      if (!btn || btn.classList.contains('demo-dis')) return;
      window._demoFabApply(btn.dataset.scenario, btn);
    });

    // Outside click to close
    document.addEventListener('click', function (e) {
      var pop = document.getElementById('demo-popover');
      var fab = document.getElementById('demo-fab');
      if (!pop || !fab) return;
      if (!pop.contains(e.target) && !fab.contains(e.target) && pop.classList.contains('show')) {
        pop.classList.remove('show');
        fab.classList.remove('popped');
      }
    });

    _injectGlobalTooltip();
  }

  // ===== #gl-tip auto-injection =====
  function _injectGlobalTooltip() {
    if (document.getElementById('gl-tip')) return; // host page already provides one
    var tip = document.createElement('div');
    tip.id = 'gl-tip';
    document.body.appendChild(tip);
    var cur = null;
    // 2026-10-09 Kabin 裁決：全站 tooltip 改成錨在元件上（Figma／MUI 行為），不再跟著游標跑。
    // 規則照 Anomaly Detection #01-3 量到的：預設出現在元件上方 6px、水平靠元件左緣，
    // 右邊放不下就改靠元件右緣 +2；上方放不下改到下方。
    // 可選屬性：data-tip-pos="below"（固定放下方）、data-tip-dy（下方距離，預設 4）、
    // data-tip-anchor（CSS 選擇器，錨在子元素上）、data-tip-align="content-right"（右緣對齊內容右緣 −16）。
    function place() {
      if (!cur || !cur.isConnected) { cur = null; tip.style.display = 'none'; return; }
      var a = (cur.dataset.tipAnchor && cur.querySelector(cur.dataset.tipAnchor)) || cur;
      var r = a.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
      var vw = window.innerWidth, vh = window.innerHeight;
      var x = r.left;
      if (x + tw > vw - 8) x = Math.max(8, Math.min(r.right + 2, vw - 8) - tw);
      if (cur.dataset.tipAlign === 'content-right') x = Math.max(8, r.right - 16 - tw);
      var below = cur.dataset.tipPos === 'below';
      var dy = cur.dataset.tipDy != null ? +cur.dataset.tipDy : 4;
      var y = below ? r.bottom + dy : r.top - th - 6;
      if (y < 8) y = r.bottom + 4;
      if (y + th > vh - 8) y = Math.max(8, r.top - th - 6);
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (!el || (el === cur && tip.style.display !== 'none')) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block'; place();
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (el && el === cur && !el.contains(e.relatedTarget)) { cur = null; tip.style.display = 'none'; }
    });
    window.addEventListener('scroll', place, true);
    window.addEventListener('resize', place);
  }

  // ===== PUBLIC API =====
  function _refreshScrollArea() {
    var scroll = document.getElementById('demo-popover-scroll');
    if (!scroll) return;
    scroll.style.opacity = '0';
    setTimeout(function () {
      scroll.innerHTML = _renderScrollArea();
      scroll.style.opacity = '1';
    }, 120);
  }

  function _refreshTabs() {
    var pop = document.getElementById('demo-popover');
    if (!pop) return;
    pop.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === _activePage);
    });
    pop.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      // In pages-only mode, cat-tab elements carry data-page (not data-category)
      if (t.dataset.page) {
        t.classList.toggle('active', t.dataset.page === _activePage);
      } else {
        t.classList.toggle('active', t.dataset.category === _activeCategory);
      }
    });
  }

  /** Toggle popover open/close */
  window._demoFabToggle = function () {
    var pop = document.getElementById('demo-popover');
    var fab = document.getElementById('demo-fab');
    var pulse = document.getElementById('demo-fab-pulse');
    var opening = !pop.classList.contains('show');
    pop.classList.toggle('show');
    fab.classList.toggle('popped');
    if (opening && pulse) pulse.style.display = 'none';
  };

  /** Set active page tab (internal + external) */
  window._demoFabSetPage = function (pageId) {
    if (_activePage === pageId) return;
    _activePage = pageId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /** Set active category tab */
  window._demoFabSetCategory = function (catId) {
    if (_activeCategory === catId) return;
    _activeCategory = catId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /**
   * Called from prototype's navigation function to auto-switch the page tab.
   * Only switches if the popover doesn't need to stay on current tab.
   */
  window.demoFabSwitchTab = function (pageId) {
    window._demoFabSetPage(pageId);
  };

  /** Apply a scenario — called via event delegation or by host */
  window._demoFabApply = function (id, btn) {
    _activeScenario = id;
    document.querySelectorAll('.demo-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    if (btn) {
      btn.classList.add('active');
    } else {
      // No btn provided (e.g. Reset link) — find scenario in DOM
      var found = document.querySelector('[data-scenario="' + id + '"]');
      if (found) found.classList.add('active');
    }
    if (typeof window.DEMO_APPLY === 'function') {
      window.DEMO_APPLY(id, btn);
    }
  };

  // ===== INIT =====
  function _init() {
    if (_activeScenario === null && window.DEMO_DEFAULT) {
      _activeScenario = window.DEMO_DEFAULT;
    }
    _render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>
</body>
</html>
