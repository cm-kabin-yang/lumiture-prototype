/* === Inlined: shared/tokens.css === */
/* ============================================================
 * Lumiture Design Tokens
 * ============================================================
 * 來源：Figma CMDS + prototype scan + 8 項設計決策 (2026-05-12)
 * 命名規範：W3C Design Tokens spec（長名結構化 BEM）
 * 三層架構：Primitive → Semantic → Component
 * 完整決策紀錄：~/.claude/.../project_design_tokens_decisions.md
 * ============================================================ */

:root {

  /* ============================================================
   * LAYER 1 — PRIMITIVE
   * 原子層：純色號 / 純數值；不直接給 component 用
   * ============================================================ */

  /* --- Color: Brand Sky Blue (對齊 Figma Theme: LumiTure.ai/Primary) --- */
  --lt-blue-10: #F2FAFF;   /* Figma: Primary/Light 10 */
  --lt-blue-20: #D1EEFF;   /* Figma: Primary/Light 20 */
  --lt-blue-30: #9ED7FF;   /* Figma: Primary/Light 30 */
  --lt-blue-60: #0B6DD7;   /* Figma: Primary/Light */
  --lt-blue-70: #004FB0;   /* Figma: Primary/Main */
  --lt-blue-90: #002663;   /* Figma: Primary/Dark */

  /* --- Color: Brand Turquoise (對齊 Figma Theme: LumiTure.ai/Secondary) --- */
  --lt-turquoise-10: #F0FFFF;   /* Figma: Turquoise 10 */
  --lt-turquoise-20: #DBFDFF;   /* Figma: Turquoise 20 */
  --lt-turquoise-30: #B0F8FF;   /* Figma: Turquoise 30 */
  --lt-turquoise-60: #4ADFFF;   /* Figma: Turquoise 60 (Chart) */
  --lt-turquoise-70: #34B5D9;   /* Figma: Secondary/Main */
  --lt-turquoise-80: #228EB3;   /* Figma: Secondary/Dark */

  /* --- Color: Grey (9 階；同值不同 token = 為未來情境換色保留彈性) --- */
  --lt-grey-50:  #F6F6F6;
  --lt-grey-100: #F2F2F2;
  --lt-grey-200: #E6E6E6;
  --lt-grey-300: #CCCCCC;
  --lt-grey-400: #B3B3B3;
  --lt-grey-500: #676767;
  --lt-grey-600: #676767;   /* 暫同 500；保留為 icon-default 等情境獨立換色用 */
  --lt-grey-700: #262626;
  --lt-grey-800: #262626;   /* 暫同 700；保留為 heading 等情境獨立換色用 */
  --lt-grey-900: #262626;   /* 暫同 700；保留為 highest contrast 情境用 */

  /* --- Color: Black / White --- */
  --lt-black: #000000;
  --lt-white: #FFFFFF;

  /* --- Color: Chart Palette (對齊 Figma General Behavior 規範)
   * 來源：Figma file 🧞‍♂️-General-Behavior, node 1642-36013
   * 使用規則：圖表配色一律按 1→10 順序套用；超過 10 個則循環使用
   * 命名按官方 "#N Main" 編號 + 視覺色名註解
   */
  --lt-chart-1:  #7A8BA9;   /* CMDS Color Kit Main #1 — Navy Blue 50 */
  --lt-chart-2:  #9ED7FF;   /* CMDS Color Kit Main #2 — Sky Blue 30 (corrected from #86CBFC 2026-05-21; #86CBFC is GCP brand color, not CMDS palette) */
  --lt-chart-3:  #9CF3FF;   /* CMDS Color Kit Main #3 — Turquoise Blue 40 */
  --lt-chart-4:  #00DCC2;   /* CMDS Color Kit Main #4 — Green 60 */
  --lt-chart-5:  #94F29D;   /* CMDS Color Kit Main #5 — Emerald Green 40 */
  --lt-chart-6:  #F3BE68;   /* CMDS Color Kit Main #6 — Tangerine Orange 40 */
  --lt-chart-7:  #F4B581;   /* CMDS Color Kit Main #7 — Lantern Orange 50 */
  --lt-chart-8:  #FFA4A9;   /* CMDS Color Kit Main #8 — Red 30 */
  --lt-chart-9:  #FE89C1;   /* CMDS Color Kit Main #9 — Fuchsia 30 */
  --lt-chart-10: #C096FF;   /* CMDS Color Kit Main #10 — Purple 40 */
  --lt-chart-11: #B3B3B3;   /* CMDS Color Kit Main #11 — Gray 30 (for n+1 fallback) */

  /* --- Color: Functional (TBC — Figma 未做 Variable，待下輪 audit) --- */
  --lt-color-success-base:  #00B5A6;   /* TBC: Figma audit needed */
  --lt-color-success-dark:  #008F88;   /* TBC: Figma audit needed */
  --lt-color-success-light: #E6FFF8;   /* TBC: Figma audit needed */
  --lt-color-error-base:    #FF403D;   /* TBC: Figma audit needed */
  --lt-color-error-light:   #FFEBEF;   /* TBC: Figma audit needed */
  --lt-color-warning-base:  #FC9A0F;   /* TBC: Figma audit needed */
  --lt-color-warning-light: #FEF3E1;   /* TBC: Figma audit needed */
  --lt-color-info-base:     #0B6DD7;   /* = blue-60，符合 Figma info usage */
  --lt-color-info-light:    #E6F6FF;   /* TBC: Figma audit needed */

  /* --- Spacing: 嚴格 8px grid，4px 為微間距例外 --- */
  --lt-space-0:    0;
  --lt-space-4:    4px;     /* 例外：僅限 icon-text gap、border-thin 等微間距 */
  --lt-space-8:    8px;
  --lt-space-16:   16px;
  --lt-space-24:   24px;
  --lt-space-32:   32px;
  --lt-space-48:   48px;
  --lt-space-64:   64px;
  --lt-space-96:   96px;
  --lt-space-128:  128px;

  /* --- Radius --- */
  --lt-radius-none:   0;
  --lt-radius-xs:     3px;      /* chips / badges / 薄狀指示器 (源自 lumi-tag v7 5 處用法) */
  --lt-radius-sm:     4px;
  --lt-radius-md:     8px;
  --lt-radius-lg:     12px;
  --lt-radius-xl:     16px;
  --lt-radius-pill:   9999px;   /* pill button / chip — 矩形元素的最大圓角 */
  --lt-radius-circle: 50%;      /* 圓形 icon / avatar / toggle dot — 形狀無關 */

  /* --- Typography: Font Family --- */
  --lt-font-sans: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  --lt-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* --- Typography: Font Size (對齊 Figma 8 階；13px 為例外備用) --- */
  --lt-fs-12: 12px;   /* Figma: Caption */
  --lt-fs-13: 13px;   /* 例外：半 body 半 caption 過渡用；不在 Figma 主規範 */
  --lt-fs-14: 14px;   /* Figma: Body / Button Regular 1 / Link */
  --lt-fs-16: 16px;   /* Figma: H6 / Button 2 */
  --lt-fs-18: 18px;   /* Figma: H5 / Subtitle */
  --lt-fs-20: 20px;   /* Figma: H4 */
  --lt-fs-24: 24px;   /* Figma: H3 */
  --lt-fs-36: 36px;   /* Figma: H2 */
  --lt-fs-48: 48px;   /* Figma: H1 */

  /* --- Typography: Font Weight --- */
  --lt-fw-regular:  400;
  --lt-fw-medium:   500;
  --lt-fw-semibold: 600;   /* Figma: Button Medium 2 */
  --lt-fw-bold:     700;

  /* --- Typography: Line Height (對齊 Figma; Body 系列 1.75) --- */
  --lt-leading-heading: 1.25;   /* Figma: H1 */
  --lt-leading-tight:   1.5;    /* Figma: H2-H6 / Caption / Button / Link */
  --lt-leading-body:    1.75;   /* Figma: Body Regular/Medium/Bold */

  /* --- Typography: Letter Spacing (對齊 Figma: 全部 0) --- */
  --lt-tracking-normal: 0;

  /* --- Shadow: 對齊 CMDS Figma 規範 (2026-05-12 audit)
   * 來源：Figma node 20599-107518 — CMDS 4 個官方 shadow variables
   * 命名按「用途」而非「強度」(Cell / Button / Chip / Dialog)，跟 Material/Tailwind 不同
   * Overlay 系列為 Lumiture 補充規範（CMDS 未涵蓋的較強 floating overlay 場景）
   */
  --lt-shadow-cell:   0 2px 0 0 rgba(0, 0, 0, 0.2);              /* 銳邊，blur=0；table row 分隔線替代 */
  --lt-shadow-button: 0 2px 14px 0 rgba(137, 174, 255, 0.2);     /* 藍色 tinted，#89AEFF；clickable elevation */
  --lt-shadow-chip:   0 2px 4px 0 rgba(0, 0, 0, 0.3);            /* chip / tag 用，較深 opacity */
  --lt-shadow-dialog: 0 0 6px 0 rgba(0, 0, 0, 0.2);              /* Card / Dialog / Dropdown 共用；無 offset */
  --lt-shadow-overlay:        0 4px 12px rgba(0, 0, 0, 0.14);    /* CMDS 未涵蓋；popover / floating menu */
  --lt-shadow-overlay-strong: 0 4px 16px rgba(0, 0, 0, 0.18);    /* CMDS 未涵蓋；drawer / 較重 overlay */

  /* --- Transition --- */
  --lt-transition-fast: .15s ease;
  --lt-transition-base: .2s ease;
  --lt-transition-slow: .3s ease;

  /* --- Z-index --- */
  --lt-z-base:     0;
  --lt-z-elevated: 10;
  --lt-z-sticky:   100;
  --lt-z-dropdown: 1000;
  --lt-z-modal:    2000;
  --lt-z-tooltip:  3000;
  --lt-z-toast:    4000;


  /* ============================================================
   * LAYER 2 — SEMANTIC
   * 語意層：引用 primitive，描述用途；component 預設用此層
   * ============================================================ */

  /* --- Color: Brand --- */
  --lt-color-primary:         var(--lt-blue-70);
  --lt-color-primary-hover:   var(--lt-blue-60);
  --lt-color-primary-active:  var(--lt-blue-90);
  --lt-color-primary-bg:      var(--lt-blue-10);

  --lt-color-secondary:       var(--lt-turquoise-70);

  --lt-color-secondary-bg:    var(--lt-turquoise-10);

  /* --- Color: Functional (alias) --- */
  --lt-color-success: var(--lt-color-success-base);
  --lt-color-error:   var(--lt-color-error-base);
  --lt-color-warning: var(--lt-color-warning-base);
  --lt-color-info:    var(--lt-color-info-base);

  /* --- Color: Text --- */
  --lt-color-text-primary:   var(--lt-grey-700);   /* 內文預設 */
  --lt-color-text-secondary: var(--lt-grey-500);   /* 次要文字 */
  --lt-color-text-tertiary:  var(--lt-grey-400);   /* hint / placeholder */
  --lt-color-text-disabled:  var(--lt-grey-400);
  --lt-color-text-inverse:   var(--lt-white);
  --lt-color-text-link:      var(--lt-blue-60);
  --lt-color-text-heading:   var(--lt-grey-800);   /* 為未來 heading 獨立換色預留 */
  --lt-color-text-icon:      var(--lt-grey-600);   /* 為未來 icon 獨立換色預留 */

  /* --- Color: Background --- */
  --lt-color-bg-default:    var(--lt-white);
  --lt-color-bg-subtle:     var(--lt-grey-50);
  --lt-color-bg-emphasized: var(--lt-grey-100);
  --lt-color-bg-disabled:   var(--lt-grey-100);
  --lt-color-bg-inverse:    var(--lt-blue-90);
  --lt-color-bg-overlay:    rgba(0, 0, 0, 0.5);
  --lt-color-bg-skeleton:   var(--lt-grey-200);   /* 骨架屏；2026-09-24 定，對應前端 gray.skeleton → gray.10；用途命名，日後可單獨換色 */

  /* --- Color: Border --- */
  --lt-color-border-default: var(--lt-grey-200);
  --lt-color-border-strong:  var(--lt-grey-300);
  --lt-color-border-focus:   var(--lt-color-primary);
  --lt-color-border-input:   #DCE3EC;   /* prototype --tf-border；略不同於 grey-200 */
  --lt-color-border-error:   var(--lt-color-error-base);


  /* ============================================================
   * LAYER 3 — COMPONENT
   * 元件層：給特定元件使用；引用 semantic
   * ============================================================ */

  /* --- Sidebar (深海軍藍) --- */
  --lt-sidebar-width:      250px;
  --lt-sidebar-bg:         var(--lt-blue-90);
  --lt-sidebar-text:       rgba(255, 255, 255, 0.85);
  --lt-sidebar-text-muted: rgba(255, 255, 255, 0.50);
  --lt-sidebar-hover-bg:   rgba(255, 255, 255, 0.06);
  --lt-sidebar-active-bg:  var(--lt-color-primary);

  /* --- Topbar --- */
  --lt-topbar-bg:     var(--lt-white);
  --lt-topbar-shadow: var(--lt-shadow-dialog);   /* CMDS Dialog shadow（Card 級別 elevation）*/

  /* --- Card --- */
  --lt-card-bg:      var(--lt-color-bg-default);
  --lt-card-radius:  var(--lt-radius-md);
  --lt-card-shadow:  var(--lt-shadow-dialog);    /* CMDS 明確規範 Card 用 Dialog shadow */

  /* --- Button --- */
  --lt-button-radius:     var(--lt-radius-sm);
  --lt-button-padding-x:  var(--lt-space-16);
  --lt-button-padding-y:  var(--lt-space-8);

  /* --- Input / Text Field --- */
  --lt-input-bg:        var(--lt-color-bg-default);
  --lt-input-border:    var(--lt-color-border-input);
  --lt-input-radius:    var(--lt-radius-sm);
  --lt-input-padding-x: var(--lt-space-16);
  --lt-input-padding-y: var(--lt-space-8);

  --lt-modal-radius:   var(--lt-radius-lg);

  --lt-tooltip-radius:  var(--lt-radius-sm);
  --lt-tooltip-padding: var(--lt-space-8);

<style>
/* ============================================================
 * Notification Emails v1：5 封通知信（Reset Password／Activate Account／Budget General Alert／Customized Alert／Anomaly Detection）
 *
 * 來源：Figma「🧞‍♂️ General Behavior」gUxOGpZiBypTRInf400Pg2 page「Email Notification」6:23
 *   Email - Budget General Alert 1800:307（1822:816）／Customized Alert 2436:5764（2435:5234）／Reset Password 4264:3335（2093:36604）
 *   Activate Account 4264:3336（2073:32473）／Anomaly Detection 4265:3337（4265:3338、空值版 4871:6155）
 * 這頁是「收件匣展示頁」，不是產品內頁：沒有 sidebar／topbar，不進 lumiture-nav。
 *
 * Kabin 10/14 裁決：①中性收件匣（稿上的 Gmail 只是示意，部署版公開，不放任何郵件產品的品牌元素；信件本體照稿）②信裡按鈕接回產品流程。
 *
 * 信件本體寫成 email-safe HTML（table 排版、inline style、600 寬、漸層只用 CSS＋bgcolor 備援、圖用 PNG），以 <iframe srcdoc> 呈現，與頁面 CSS 隔離。
 * 設計稿便利貼：「為了讓信件能夠依據內容自動調整長度，盡量不使用背景圖片」→ Banner 用 CSS 漸層，不用圖。
 * Layout 註記：手機版時白色內容區塊左右 Padding 改 20px → @media (max-width:620px)，Demo FAB「手機寬度」把 iframe 縮到 375 觸發。
 *
 * 標記慣例：⚠ DEVIATION＝偏離 Figma；⚠ 設計端暫擬＝稿沒定義、自己補的；⚠ 未確認＝規則不明。`grep -n "⚠"` 一次列出。
 * 路由：hash（#reset-password #activate #budget-alert #customized-alert #anomaly），變體用 ?v=…，手機寬度用 &w=375，原始碼用 &src=1。
 * ============================================================ */

:root{
  --em-bg: var(--lt-grey-100);
  --em-line: var(--lt-color-border-default);
  --em-sel: var(--lt-blue-10);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--lt-font-sans);font-size:var(--lt-fs-14);line-height:var(--lt-leading-body);color:var(--lt-color-text-primary);background:var(--em-bg);letter-spacing:0;display:flex;flex-direction:column;min-height:100vh}
a{color:var(--lt-color-primary);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;line-height:1;user-select:none}

/* ---- 頂欄（中性，沒有任何郵件產品的元素）---- */
.top{height:56px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--em-line);display:flex;align-items:center;gap:12px;padding:0 24px}
.top img{width:28px;height:28px;border-radius:6px;background:#002663;padding:3px}
.top .ttl{font-size:16px;font-weight:700;line-height:24px}
.top .sub{color:var(--lt-color-text-secondary);font-size:12px;line-height:18px}
.proto-chip{margin-left:4px;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:3px;background:var(--lt-turquoise-20);color:var(--lt-turquoise-80);font-size:12px;font-weight:700}
.top .sp{flex:1}
.top .hint{font-size:12px;color:var(--lt-color-text-secondary)}

/* ---- 收件匣（左列表＋右閱讀窗格）---- */
.mail{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 56px - 48px)}
.list{background:#fff;border-right:1px solid var(--em-line);overflow-y:auto;overscroll-behavior:contain}
.list h2{font-size:12px;line-height:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--lt-color-text-secondary);padding:16px 16px 8px}
.row{display:block;width:100%;text-align:left;padding:12px 16px 12px 13px;border-left:3px solid transparent;border-bottom:1px solid var(--em-line);cursor:pointer;color:inherit}
.row:hover{background:var(--lt-grey-50)}
.row[aria-current="true"]{background:var(--em-sel);border-left-color:var(--lt-color-primary)}
.row:focus-visible{outline:2px solid var(--lt-color-primary);outline-offset:-2px}
.row .l1{display:flex;align-items:baseline;gap:8px}
.row .snd{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tm{font-size:12px;color:var(--lt-color-text-secondary);flex-shrink:0}
.row .sj{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:24px}
.row .pv{font-size:12px;line-height:18px;color:var(--lt-color-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tag{display:inline-block;margin-right:6px;padding:0 6px;border-radius:3px;background:var(--lt-grey-100);color:var(--lt-color-text-secondary);font-size:11px;font-weight:700;line-height:16px;vertical-align:1px}

.pane{overflow-y:auto;overscroll-behavior:contain;background:var(--em-bg)}
.pane-in{max-width:none;padding:24px 32px 32px}
.ph{background:#fff;border-radius:8px 8px 0 0;box-shadow:var(--lt-card-shadow);padding:20px 24px 16px;position:relative;z-index:1}
.ph h1{font-size:20px;line-height:30px;font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:12px;margin-top:12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--lt-blue-20);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av img{width:24px;height:auto}
.meta .who{flex:1;min-width:0;line-height:20px}
.meta .who b{font-weight:700}
.meta .who span{color:var(--lt-color-text-secondary)}
.meta .to{font-size:12px;color:var(--lt-color-text-secondary);line-height:18px}
.meta .dt{font-size:12px;color:var(--lt-color-text-secondary);flex-shrink:0;text-align:right}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--lt-grey-300);border-radius:5px;overflow:hidden}
.seg button{height:28px;padding:0 12px;font-size:12px;line-height:18px;color:var(--lt-color-text-secondary);background:#fff}
.seg button+button{border-left:1px solid var(--lt-grey-300)}
.seg button[aria-pressed="true"]{background:var(--lt-color-primary);color:#fff;font-weight:700}
.seg button:focus-visible{outline:2px solid var(--lt-color-primary);outline-offset:-2px}
.vlabel{font-size:12px;color:var(--lt-color-text-secondary)}
.vlabel b{color:var(--lt-color-text-primary)}
.back{display:none;align-items:center;gap:4px;height:28px;padding:0 8px;margin-bottom:8px;border-radius:5px;color:var(--lt-color-primary);font-weight:700}
.stage{background:#fff;border-radius:0 0 8px 8px;box-shadow:var(--lt-card-shadow);overflow:hidden}
.stage.m{width:375px;max-width:100%;margin:0 auto;border-radius:8px;border:1px solid var(--lt-grey-300);box-shadow:none}
.stage iframe{display:block;width:100%;border:0;height:600px;background:#F3F7FA}
.src{margin:0;padding:16px;background:#262626;color:#E6E6E6;font:12px/18px var(--lt-font-mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:70vh;overflow:auto}
.empty{padding:64px 24px;text-align:center;color:var(--lt-color-text-secondary)}

/* ---- footer（CLAUDE.md 規定格式）---- */
.footer{min-height:48px;padding:8px 32px;background:var(--lt-color-primary-bg);border-top:1px solid var(--lt-color-border-default);display:flex;align-items:center;justify-content:space-between;font-size:12px;line-height:18px;color:var(--lt-color-text-secondary);flex-wrap:wrap;gap:10px;flex-shrink:0}
.footer-version{font-weight:500;color:#262626}
.footer-version .ver-tag{background:#34B5D9;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px}
.footer-credit{color:#676767;font-size:12px}

/* ---- toast（外部連結說明、Demo 提示；位置照 Auth：避開 Demo FAB）---- */
.toast-wrap{position:fixed;bottom:72px;left:80px;z-index:var(--lt-z-toast);display:flex;flex-direction:column-reverse;gap:14px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#0B6DD7;color:#fff;border-radius:4px;border:1px solid rgba(0,0,0,.12);box-shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12);max-width:440px;animation:toast-in .2s ease}
.toast .tx{white-space:pre-line}
@keyframes toast-in{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* ---- 窄螢幕：列表與閱讀窗格二選一 ---- */
@media (max-width:860px){
  .mail{grid-template-columns:1fr;height:auto}
  body.has-sel .list{display:none}
  body:not(.has-sel) .pane{display:none}
  .back{display:inline-flex}
  .pane-in{padding:16px}
  .top .hint{display:none}
  .meta{flex-wrap:wrap}
  .meta .dt{flex-basis:100%;text-align:left;padding-left:52px}
  .toast-wrap{left:16px;bottom:72px}
}
</style>
</head>

/* ============================================================

 * ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const usd = n => 'USD ' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function toast(msg, ms = 4500) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span class="material-symbols-outlined">info</span><span class="tx">${esc(msg)}</span>`;
  el.style.pointerEvents = 'auto'; el.addEventListener('click', () => el.remove());
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), ms);
}

const LINK = {

  activate: './auth.html#activate',
  /* Budget General Alert [View Detail]：註記寫前往 Overview（Cloud Cost Overview 月視角），沒寫原因 */

  /* ⚠ 設計端暫擬：註記沒寫 Customized Alert 的 View Details 去向，指到 Customized Budget 列表（#01 Budget List） */
  customized: './customized-budget.html',
  anomalyDetail: id => './anomaly-detection.html#detail/' + id,
  anomalyList: './anomaly-detection.html'
};
/* 外部連結（prototype 不開）：feedback form 在稿上超連結到 Google Forms，這裡用 # 加 toast 說明 */
const EXT_FEEDBACK = '#feedback-form';

/* ============================================================
 * 3. 信件本體（email-safe HTML 產生器）
 *    量測依據：Figma 各信的 '.Signup_verify email' frame（979 寬，背景 #F3F7FA、內距 80/20）→ 白卡 600 寬、內容 520 寬（左右各 40）
 *    字型 Noto Sans；內文 14/24.5、標題 24/36 Bold、數值 16 Bold；顏色 #262626／#676767／#B3B3B3／連結 #0B6DD7
 * ============================================================ */
const FONT = "'Noto Sans','Helvetica Neue',Helvetica,Arial,sans-serif";
const K = { text: '#262626', sub: '#676767', mute: '#B3B3B3', link: '#0B6DD7', pri: '#004FB0', hair: '#E6E6E6', strong: '#B3B3B3' };
const tx = (size, lh, w, c, extra = '') => `font-family:${FONT};font-size:${size}px;line-height:${lh}px;font-weight:${w};color:${c};${extra}`;

function btn(label, href, kind = 'fill', attrs = '') {
  /* 36 高（6+24+6）、r5、16 Bold；fill＝#004FB0 底白字，outline＝白底 1px #004FB0 框藍字 */
  const fill = kind === 'fill';
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto"><tr><td bgcolor="${fill ? K.pri : '#FFFFFF'}" style="border-radius:5px;background:${fill ? K.pri : '#FFFFFF'};${fill ? '' : 'border:1px solid ' + K.pri + ';'}"><a href="${href}" target="_top" ${attrs} style="display:inline-block;padding:${fill ? '6px 16px' : '5px 15px'};${tx(16, 24, 700, fill ? '#FFFFFF' : K.link)}text-decoration:none;border-radius:5px;white-space:nowrap">${label}</a></td></tr></table>`;
}
function link(label, href, attrs = '') { return `<a href="${href}" target="_top" ${attrs} style="color:${K.link};text-decoration:underline">${label}</a>`; }
function fbLink() { return `<a href="${EXT_FEEDBACK}" data-ext="feedback" style="color:${K.link};font-weight:700;text-decoration:underline">feedback form</a>`; }

/* 兩欄資料列：label 252 | gap 16 | value 252（520 寬）；border-top 為分隔線，列高 = 內容 + 16（分隔線畫在列頂，與 Figma 疊在列邊界一致）*/
function kvTable(rows) {
  const n = rows.length;
  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="table-layout:fixed;border-collapse:collapse">` + rows.map((r, i) => {
    const top = i === 0 ? K.strong : K.hair;
    const bottom = i === n - 1 ? `border-bottom:1px solid ${K.strong};` : '';
    const pb = i === n - 1 ? 7 : 8;
    const cell = (w, inner, extra = '') => `<td valign="top" style="width:${w};border-top:1px solid ${top};${bottom}padding:${i === 0 ? 7 : 7}px 0 ${pb}px;${extra}">${inner}</td>`;
    return `<tr>${cell('48.46%', `<div style="${tx(14, 25, 400, K.text)}">${r.label}</div>`)}${cell('3.08%', '&nbsp;', 'font-size:0;line-height:0')}${cell('48.46%', r.value)}</tr>`;
  }).join('') + '</table>';
}
const val16 = t => `<div style="${tx(16, 24, 700, K.text)}">${t}</div>`;
const val14 = (t, w = 400) => `<div style="${tx(14, 24.5, w, K.text)}">${t}</div>`;
const note12 = t => `<div style="${tx(12, 18, 400, K.text)}">${t}</div>`;

const COPYRIGHT = 'Copyright © 2026 LumiTure.ai, Inc. All rights reserved.';

/* 整封信的外殼：Logo → 白卡（Banner＋內容）→ 意見回饋句 → Thank you → 圖形 Logo → Copyright */
function shell(o) {
  const g = o.grad;
  return `<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><meta name="supported-color-schemes" content="light only">

    <tr><td align="center" bgcolor="${g.mid}" style="background-color:${g.mid};background-image:linear-gradient(to top left,${g.from},${g.to});padding:16px 0;line-height:0;font-size:0"><img src="${ASSET[o.icon]}" width="48" height="48" alt="" style="display:block;margin:0 auto;width:48px;height:48px"></td></tr>
${o.rows}

<tr><td align="center" style="padding:30px 0 0"><img src="${ASSET['logo-mark']}" width="60" height="43" alt="LumiTure.ai" style="display:block;margin:0 auto;width:60px;height:43px"></td></tr>
<tr><td align="center" style="padding:18px 20px 20px;${tx(14, 25, 400, K.sub)}">${COPYRIGHT}</td></tr>
</table>
</body></html>`;
}
/* 卡片內的一列（內容寬 520，左右 40）。top/bottom 是這一列上下的留白 */
const GRAD = {
  blue: { from: '#004FB0', to: '#4ADFFF', mid: '#27A0E0' },
  orange: { from: '#EC6F09', to: '#FC9A0F', mid: '#F48510' }
};
const cardRow = (inner, top = 0, bottom = 0, extra = '') => `<tr><td class="em-pad" style="padding:${top}px 40px ${bottom}px;${extra}">${inner}</td></tr>`;
const h1 = t => `<div style="${tx(24, 36, 700, K.text)}">${t}</div>`;
/* Reset／Activate 按鈕外的淡藍光暈：520×76、水平漸層 #9ED7FF 透明 → 40% → 透明 */
const glow = (inner) => `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="padding:20px 0;background-image:linear-gradient(to right,rgba(158,215,255,0),rgba(158,215,255,.4) 50%,rgba(158,215,255,0))">${inner}</td></tr></table>`;
/* 預算信按鈕上方的 4px 漸層分隔線（通版 600 寬）*/
const gradDivider = `<tr><td style="padding:20px 0 0"><div style="height:4px;line-height:4px;font-size:0;background-image:linear-gradient(to right,rgba(0,79,176,0),rgba(0,79,176,.5),rgba(0,79,176,0))">&nbsp;</div></td></tr>`;

/* ---------- 3.1 Reset Password（Figma 2093:36604）---------- */
function mailReset(d) {
  const url = d.url;
  const rows =
    cardRow(h1('Reset Password') +
      `<div style="padding-top:20px;${tx(14, 24.5, 400, K.text)}">Hi ${esc(d.name)},<br><br>We recently received a request to reset the password for your account.<br>If you requested this change, please click the button below to reset password.<br>If you did not request this change, you can safely disregard this email.</div>`, 40, 0) +
    cardRow(glow(btn('Reset Password', LINK.reset)), 32, 0) +
    /* 最下方手動點擊的網址應為動態產生（註記）；網址文字與按鈕同一個去向 */
    cardRow(`<div style="text-align:center;${tx(14, 24.5, 400, K.text)}">You can also copy following link and paste it into the browser's address bar:<br><a href="${LINK.reset}" target="_top" style="color:${K.link};text-decoration:underline;overflow-wrap:anywhere">${esc(url[0])}<wbr>${esc(url[1])}</a></div>`, 40, 40);
  return { subject: '[LumiTure.ai] Reset password to get back into your account.', preheader: 'We recently received a request to reset the password for your account.', html: shell({ subject: '[LumiTure.ai] Reset password to get back into your account.', preheader: 'Reset your LumiTure.ai password.', grad: GRAD.blue, icon: 'icon-lock', rows }) };
}
/* ---------- 3.2 Activate Account（Figma 2073:32473）---------- */
function mailActivate(d) {

/* ---------- 3.4 Customized Alert（Figma 2435:5234）---------- */

const CLOUD_LABEL = { gcp: 'Project Name / ID', aws: 'Account Name / ID', azure: 'Resource Group Name / ID' };

function assignedHtml(groups) {
  if (!groups.length) return `<div style="${tx(14, 24.5, 400, K.sub)}">${ASSIGN_EMPTY}</div>`;
  /* 註記：呈現所有被指派資源的下層群組名稱；最多 5 組、字母升冪；超過 5 組顯示 …+{n} more, view full list in detail page. */

}

const state = { id: null, v: null, w: 'desktop', src: false };
function parseHash() {
  const raw = (location.hash || '').replace(/^#/, ''), [id, q = ''] = raw.split('?'), p = new URLSearchParams(q);
  return { id: EMAILS[id] ? id : null, v: p.get('v'), w: p.get('w') === '375' ? 'mobile' : 'desktop', src: p.get('src') === '1' };
}
function buildHash(s) { const p = new URLSearchParams(); if (s.v && s.v !== EMAILS[s.id].def) p.set('v', s.v); if (s.w === 'mobile') p.set('w', '375'); if (s.src) p.set('src', '1'); const q = p.toString(); return '#' + s.id + (q ? '?' + q : ''); }
function renderList() {

  }).join('');
}
function fitFrame(fr) {
  try { const d = fr.contentDocument; if (!d || !d.documentElement) return; fr.style.height = '10px'; fr.style.height = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) + 'px'; } catch (e) { /* srcdoc 同源，理論上不會進來 */ }
}
function renderPane() {
  const pane = $('#paneIn');

  if (state.src) { $('#srcpre').textContent = m.html; return; }
  const fr = $('#mailFrame');
  fr.addEventListener('load', () => {
    const d = fr.contentDocument; if (!d) return;
    fitFrame(fr);
    d.addEventListener('click', ev => { const a = ev.target.closest && ev.target.closest('a[data-ext]'); if (a) { ev.preventDefault(); toast('feedback form：正式信件會開啟意見回饋表單（外部連結）。這是 prototype，不會離開頁面。'); } });
    if (d.fonts && d.fonts.ready) d.fonts.ready.then(() => fitFrame(fr));
    new ResizeObserver(() => fitFrame(fr)).observe(d.body);
  });
  fr.srcdoc = m.html;
  $('#pane').scrollTop = 0;

function go(patch, { replace = false } = {}) {
  Object.assign(state, patch);
  if (state.id) { const h = buildHash(state); if (location.hash !== h) (replace ? history.replaceState : history.pushState).call(history, null, '', location.pathname + location.search + h); }
  renderList(); renderPane();
}
document.addEventListener('click', ev => {
  const row = ev.target.closest('.row'); if (row) return go({ id: row.dataset.id, v: null, src: false });
  if (ev.target.closest('#back')) { state.id = null; history.pushState(null, '', location.pathname + location.search); renderList(); renderPane(); return; }
  const w = ev.target.closest('[data-w]'); if (w) return go({ w: w.dataset.w });
  const s = ev.target.closest('[data-src]'); if (s) return go({ src: s.dataset.src === '1' });
});
window.addEventListener('hashchange', () => { const h = parseHash(); Object.assign(state, h); renderList(); renderPane(); });

  // ===== HELPERS =====
  function _esc(s) {

  // Detect rendering mode based on what's configured

      if (_activeCategory && s.category && s.category !== _activeCategory) return false;

      return true;

      normal.forEach(function (s) { var g = s.group || ''; if (order.indexOf(g) < 0) order.push(g); });

    return '<div class="' + wrapClass + '">' + pages.map(function (p) {

      return '<button class="demo-cat-tab' + act + '" data-category="' + _esc(c.id) + '">' +

             _esc(c.label) +
             '</button>';
    }).join('') + '</div>';
  }

  function _renderHint() {
    if (!_activeCategory) return '';
    var cat = _getCategories().find(function (c) { return c.id === _activeCategory; });
    if (!cat || !cat.hint) return '';
    return '<div class="demo-pane-hint">' + _esc(cat.hint) + '</div>';
  }

  function _renderScrollArea() {
    return _renderHint() + _renderButtons(_filterScenarios());
  }

  function _render() {
    if (document.getElementById('demo-fab')) return;

    // Auto-detect first page & category
    var mode = _detectMode();
    var pages = _getPages();
    var cats = _getCategories();
    if (!_activePage && pages.length) _activePage = pages[0].id;
    if (!_activeCategory && cats.length) _activeCategory = cats[0].id;
    if (mode === 'flat') { _activePage = null; _activeCategory = null; }
    if (mode === 'pages-only') _activeCategory = null;
    if (mode === 'categories-only') _activePage = null;

    // FAB
    var fabEl = document.createElement('button');
    fabEl.className = 'demo-fab';
    fabEl.id = 'demo-fab';
    fabEl.title = 'Designer Demo Scenarios';
    fabEl.innerHTML =
      '<span class="material-symbols-outlined">science</span>' +
      '<span class="demo-pulse" id="demo-fab-pulse"></span>';
    fabEl.addEventListener('click', function () { window._demoFabToggle(); });

    // Popover
    var popEl = document.createElement('div');
    popEl.className = 'demo-popover';
    popEl.id = 'demo-popover';
    popEl.innerHTML =
      '<div class="demo-popover-hdr">' +
        '<div class="demo-popover-title">' +
          '<span class="material-symbols-outlined" style="font-size:16px">science</span>' +
          'Demo Scenarios' +
        '</div>' +
        '<button class="demo-popover-close" id="demo-pop-close">' +
          '<span class="material-symbols-outlined" style="font-size:18px">close</span>' +
        '</button>' +
      '</div>' +
      (window.DEMO_DEFAULT
        ? '<button class="demo-reset-link" id="demo-reset-link">' +
            '<span class="material-symbols-outlined">refresh</span>Reset to Default</button>'
        : '') +
      _renderPageTabs(mode) +
      _renderCategoryTabs() +
      '<div class="demo-popover-scroll" id="demo-popover-scroll">' +
        _renderScrollArea() +
      '</div>';

    document.body.appendChild(fabEl);
    document.body.appendChild(popEl);

    // === Event wiring ===
    document.getElementById('demo-pop-close').addEventListener('click', function () {
      window._demoFabToggle();
    });

    // Reset link
    var resetLink = document.getElementById('demo-reset-link');
    if (resetLink && window.DEMO_DEFAULT) {
      resetLink.addEventListener('click', function () {
        window._demoFabApply(window.DEMO_DEFAULT, null);
      });
    }

    // Page tabs
    popEl.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        window._demoFabSetPage(t.dataset.page);
      });
    });

    // Category tabs (also handles page tabs in pages-only mode, where they use demo-cat-tab class)
    popEl.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        if (t.dataset.page) {
          window._demoFabSetPage(t.dataset.page);
        } else {
          window._demoFabSetCategory(t.dataset.category);
        }
      });
    });

    // Scenario button clicks (event delegation on scroll area)
    document.getElementById('demo-popover-scroll').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-scenario]');
      if (!btn || btn.classList.contains('demo-dis')) return;
      window._demoFabApply(btn.dataset.scenario, btn);
    });

    // Outside click to close
    document.addEventListener('click', function (e) {
      var pop = document.getElementById('demo-popover');
      var fab = document.getElementById('demo-fab');
      if (!pop || !fab) return;
      if (!pop.contains(e.target) && !fab.contains(e.target) && pop.classList.contains('show')) {
        pop.classList.remove('show');
        fab.classList.remove('popped');
      }
    });

    _injectGlobalTooltip();
  }

  // ===== #gl-tip auto-injection =====
  function _injectGlobalTooltip() {
    if (document.getElementById('gl-tip')) return; // host page already provides one
    var tip = document.createElement('div');
    tip.id = 'gl-tip';
    document.body.appendChild(tip);
    var cur = null;
    // 2026-10-09 Kabin 裁決：全站 tooltip 改成錨在元件上（Figma／MUI 行為），不再跟著游標跑。
    // 規則照 Anomaly Detection #01-3 量到的：預設出現在元件上方 6px、水平靠元件左緣，
    // 右邊放不下就改靠元件右緣 +2；上方放不下改到下方。
    // 可選屬性：data-tip-pos="below"（固定放下方）、data-tip-dy（下方距離，預設 4）、
    // data-tip-anchor（CSS 選擇器，錨在子元素上）、data-tip-align="content-right"（右緣對齊內容右緣 −16）。
    function place() {
      if (!cur || !cur.isConnected) { cur = null; tip.style.display = 'none'; return; }
      var a = (cur.dataset.tipAnchor && cur.querySelector(cur.dataset.tipAnchor)) || cur;
      var r = a.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
      var vw = window.innerWidth, vh = window.innerHeight;
      var x = r.left;
      if (x + tw > vw - 8) x = Math.max(8, Math.min(r.right + 2, vw - 8) - tw);
      if (cur.dataset.tipAlign === 'content-right') x = Math.max(8, r.right - 16 - tw);
      var below = cur.dataset.tipPos === 'below';
      var dy = cur.dataset.tipDy != null ? +cur.dataset.tipDy : 4;
      var y = below ? r.bottom + dy : r.top - th - 6;
      if (y < 8) y = r.bottom + 4;
      if (y + th > vh - 8) y = Math.max(8, r.top - th - 6);
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (!el || (el === cur && tip.style.display !== 'none')) return;
      cur = el; tip.textContent = el.dataset.tip; tip.style.display = 'block'; place();
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest && e.target.closest('[data-tip]');
      if (el && el === cur && !el.contains(e.relatedTarget)) { cur = null; tip.style.display = 'none'; }
    });
    window.addEventListener('scroll', place, true);
    window.addEventListener('resize', place);
  }

  // ===== PUBLIC API =====
  function _refreshScrollArea() {
    var scroll = document.getElementById('demo-popover-scroll');
    if (!scroll) return;
    scroll.style.opacity = '0';
    setTimeout(function () {
      scroll.innerHTML = _renderScrollArea();
      scroll.style.opacity = '1';
    }, 120);
  }

  function _refreshTabs() {
    var pop = document.getElementById('demo-popover');
    if (!pop) return;
    pop.querySelectorAll('.demo-page-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === _activePage);
    });
    pop.querySelectorAll('.demo-cat-tab').forEach(function (t) {
      // In pages-only mode, cat-tab elements carry data-page (not data-category)
      if (t.dataset.page) {
        t.classList.toggle('active', t.dataset.page === _activePage);
      } else {
        t.classList.toggle('active', t.dataset.category === _activeCategory);
      }
    });
  }

  /** Toggle popover open/close */
  window._demoFabToggle = function () {
    var pop = document.getElementById('demo-popover');
    var fab = document.getElementById('demo-fab');
    var pulse = document.getElementById('demo-fab-pulse');
    var opening = !pop.classList.contains('show');
    pop.classList.toggle('show');
    fab.classList.toggle('popped');
    if (opening && pulse) pulse.style.display = 'none';
  };

  /** Set active page tab (internal + external) */
  window._demoFabSetPage = function (pageId) {
    if (_activePage === pageId) return;
    _activePage = pageId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /** Set active category tab */
  window._demoFabSetCategory = function (catId) {
    if (_activeCategory === catId) return;
    _activeCategory = catId;
    _refreshTabs();
    _refreshScrollArea();
  };

  /**
   * Called from prototype's navigation function to auto-switch the page tab.
   * Only switches if the popover doesn't need to stay on current tab.
   */
  window.demoFabSwitchTab = function (pageId) {
    window._demoFabSetPage(pageId);
  };

  /** Apply a scenario — called via event delegation or by host */
  window._demoFabApply = function (id, btn) {
    _activeScenario = id;
    document.querySelectorAll('.demo-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    if (btn) {
      btn.classList.add('active');
    } else {
      // No btn provided (e.g. Reset link) — find scenario in DOM
      var found = document.querySelector('[data-scenario="' + id + '"]');
      if (found) found.classList.add('active');
    }
    if (typeof window.DEMO_APPLY === 'function') {
      window.DEMO_APPLY(id, btn);
    }
  };

  // ===== INIT =====
  function _init() {
    if (_activeScenario === null && window.DEMO_DEFAULT) {
      _activeScenario = window.DEMO_DEFAULT;
    }
    _render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }
})();

</script>
</body>
</html>
